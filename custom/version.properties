# Independent version management for the custom app.
# Do NOT confuse with upstream Telegram's APP_VERSION_* in gradle.properties:
# the build overrides those with the CUSTOM_* values below (scripts/version.sh gradle-args).

# Public release version of the custom app (semantic version) and its Android versionCode.
# The final APK versionCode is CUSTOM_VERSION_CODE * 10 + 9 (upstream's per-ABI scheme, afat flavor).
CUSTOM_VERSION_NAME=1.0.0
CUSTOM_VERSION_CODE=1

# Bumped whenever custom/patches/custom-features.patch changes.
CUSTOM_PATCH_VERSION=4

# Upstream Telegram this fork is currently based on.
# UPSTREAM_COMMIT is filled by: scripts/check-upstream.sh --record
UPSTREAM_VERSION_NAME=13.1.1
UPSTREAM_VERSION_CODE=7237
UPSTREAM_COMMIT=

# Upstream commit the patch was generated against (also filled by --record, after a successful patch check).
PATCH_BASE_COMMIT=
