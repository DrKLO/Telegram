name: Build Kid Telegram APK

on:
  workflow_dispatch:
  push:
    branches:
      - kid-mode-video-block
      - copilot/kid-mode-video-block

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

      - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

      - name: Set up Android SDK
      uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK components
      run: |
        sdkmanager "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;27.2.12479018" \
          "cmake;3.10.2.4988404"

      - name: Accept Android licenses
      run: yes | sdkmanager --licenses

      - name: Build debug APK
      run: ./gradlew --no-daemon :TMessagesProj_App:assembleAfatDebug

      - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: telegram-kid-mode-debug-apk
        path: TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
