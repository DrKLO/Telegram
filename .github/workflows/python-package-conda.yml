name: Auto-Patch & Build Telegram Mod

on:
  workflow_dispatch:
    inputs:
      api_id:
        description: 'APP_ID с my.telegram.org'
        required: true
        default: '6'
      api_hash:
        description: 'APP_HASH с my.telegram.org'
        required: true
        default: 'eb06d4abfb49dc3eeb1aeb98ae0f581e'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание исходников Telegram
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Подстановка APP_ID и APP_HASH
        run: |
          sed -i 's/APP_ID = .*/APP_ID = ${{ github.event.inputs.api_id }};/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i 's/APP_HASH = .*/APP_HASH = "${{ github.event.inputs.api_hash }}";/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      - name: Применение патча (Ghost Mode + 120 Гц)
        run: python3 apply_mod.py

      - name: Генерация тестового google-services.json
        run: |
          if [ ! -f TMessagesProj/google-services.json ]; then
            echo '{"project_info":{"project_number":"0","project_id":"tg-mod"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"org.telegram.messenger.beta"}},"api_key":[{"current_key":"AIzaSyDummyKeyForCompileOnly0000000"}]}]}' > TMessagesProj/google-services.json
          fi

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Настройка Android SDK и NDK
        uses: android-actions/setup-android@v3

      - name: Сборка APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleAfatDebug --no-daemon --max-workers=2

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-GhostMod-APK
          path: TMessagesProj/build/outputs/apk/afat/debug/*.apk

