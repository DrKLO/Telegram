name: Android source checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Source-check mode always uses ID 0 / empty hash and cannot package an APK.
      AMEGRAM_API_ID: ''
      AMEGRAM_API_HASH: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate configuration boundaries
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 tools/check_build_contract.py
      - name: Fetch only source-check submodules at recorded revisions
        run: git submodule update --init --recursive --depth=1 -- TMessagesProj_Modules/media TMessagesProj/lib/jlatexmath
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true
      - name: Verify variant IDs, compile sources/resources and run unit tests
        run: >-
          ./gradlew -PamegramSourceChecks=true --no-daemon --no-parallel --max-workers=1
          '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'
          --console=plain checkAmeGramApplicationIds
          :TMessagesProj:compileDebugJavaWithJavac
          :TMessagesProj:compileDebugLibraryResources
          :TMessagesProj:testDebugUnitTest
          :TMessagesProj_App:processAfatDebugResources
      - name: Retain unit-test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-results
          path: |
            TMessagesProj/build/reports/tests/testDebugUnitTest/
            TMessagesProj/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
