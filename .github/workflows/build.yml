      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Pandroid.injected.build.abi=arm64-v8a :TMessagesProj_App:assembleAfatRelease

      - name: Collect single APK
        run: |
          mkdir -p out
          echo "=== all APK/AAB files ==="
          find . -type f \( -name '*.apk' -o -name '*.aab' \) -not -path './.git/*' -print
          APK=$(find . -type f -name '*.apk' -path '*/outputs/apk/*' -path '*elease*' -not -path './.git/*' | head -n 1)
          if [ -z "$APK" ]; then APK=$(find . -type f -name '*.apk' -path '*elease*' -not -path './.git/*' | grep -i arm64 | head -n 1); fi
          if [ -z "$APK" ]; then APK=$(find . -type f -name '*.apk' -path '*elease*' -not -path './.git/*' | head -n 1); fi
          if [ -z "$APK" ]; then APK=$(find . -type f -name '*.apk' -not -path './.git/*' | head -n 1); fi
          if [ -z "$APK" ]; then
            echo "No APK found. Build output dirs:"
            find . -type d -name outputs -path '*build*' -not -path './.git/*'
            exit 1
          fi
          echo "Using $APK"
          cp "$APK" "out/TG app.apk"

      # ---------- هم‌ترازسازی و امضای نهایی (برای رفع ارور invalid هنگام نصب) ----------
      - name: Align and sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BT"
          PASS=$(grep '^RELEASE_STORE_PASSWORD=' gradle.properties | tail -n 1 | cut -d= -f2-)
          ALIAS=$(grep '^RELEASE_KEY_ALIAS=' gradle.properties | tail -n 1 | cut -d= -f2-)
          cd out
          "$BT/zipalign" -f -P 16 4 "TG app.apk" aligned.apk
          "$BT/apksigner" sign \
            --ks ../TMessagesProj/config/release.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --v4-signing-enabled false \
            --out signed.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs signed.apk
          mv -f signed.apk "TG app.apk"
          rm -f aligned.apk
          "$BT/aapt" dump badging "TG app.apk" | head -n 3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: TG-app
          path: out/TG app.apk
          if-no-files-found: error

      # ---------- ساخت ریلیز خودکار (اولی 1.0.0، هر بیلد موفق بعدی 0.1 بالاتر) ----------
      - name: Create release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].tag_name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$LAST" ]; then
            VER="1.0.0"
          else
            L="${LAST#v}"
            MAJOR=$(echo "$L" | cut -d. -f1)
            MINOR=$(echo "$L" | cut -d. -f2)
            VER="$MAJOR.$((MINOR + 1)).0"
          fi
          echo "Previous: ${LAST:-none} -> New: v$VER"
          cp "out/TG app.apk" "out/TG-app-v$VER.apk"
          gh release create "v$VER" "out/TG-app-v$VER.apk" \
            --target "${{ github.sha }}" \
            --title "TG app v$VER" \
            --notes "Build #${{ github.run_number }} (commit ${{ github.sha }})"
