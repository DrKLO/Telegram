            esac
            if [ -e "out/TG-app-$N.apk" ]; then N="$N-$i"; fi
            i=$((i + 1))
            echo "Using $APK -> out/TG-app-$N.apk"
            cp "$APK" "out/TG-app-$N.apk"
          done < apks.txt
          ls -la out

      # ---------- هم‌ترازسازی و امضای نهایی همه APK ها (برای رفع ارور invalid هنگام نصب) ----------
      - name: Align and sign APKs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BT"
          PASS=$(grep '^RELEASE_STORE_PASSWORD=' gradle.properties | tail -n 1 | cut -d= -f2-)
          ALIAS=$(grep '^RELEASE_KEY_ALIAS=' gradle.properties | tail -n 1 | cut -d= -f2-)
          KS="$GITHUB_WORKSPACE/TMessagesProj/config/release.keystore"
          cd out
          for f in TG-app-*.apk; do
            echo "=== $f ==="
            "$BT/zipalign" -f -P 16 4 "$f" "aligned-$f"
            "$BT/apksigner" sign \
              --ks "$KS" \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
              --v4-signing-enabled false \
              --out "signed-$f" "aligned-$f"
            "$BT/apksigner" verify --verbose --print-certs "signed-$f"
            mv -f "signed-$f" "$f"
            rm -f "aligned-$f"
            "$BT/aapt" dump badging "$f" | head -n 3 || true
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: TG-app
          path: out/TG-app-*.apk
          if-no-files-found: error

      # ---------- ساخت ریلیز خودکار (اولی 1.0.0، هر بیلد موفق بعدی 0.1 بالاتر) ----------
      - name: Create release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].tag_name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$LAST" ]; then
            VER="1.0.0"
          else
            L="${LAST#v}"
            MAJOR=$(echo "$L" | cut -d. -f1)
            MINOR=$(echo "$L" | cut -d. -f2)
            VER="$MAJOR.$((MINOR + 1)).0"
          fi
          echo "Previous: ${LAST:-none} -> New: v$VER"
          FILES=()
          for f in out/TG-app-*.apk; do
            N="${f#out/TG-app-}"
            N="${N%.apk}"
            cp "$f" "out/TG-app-v$VER-$N.apk"
            FILES+=("out/TG-app-v$VER-$N.apk")
          done
          gh release create "v$VER" "${FILES[@]}" \
            --target "${{ github.sha }}" \
            --title "TG app v$VER" \
            --notes "Build #${{ github.run_number }} (commit ${{ github.sha }}) - ABI mode: $ABI_MODE"
