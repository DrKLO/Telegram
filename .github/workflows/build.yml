name: Build HakoGram

on:
  push:
    branches: [ master, arena/* ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and SDK packages
        run: |
          yes | sdkmanager --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" --sdk_root=$ANDROID_SDK_ROOT
          sdkmanager --list --sdk_root=$ANDROID_SDK_ROOT | head -50
          echo "NDK installed"
          ls $ANDROID_SDK_ROOT/ndk/ || true
          ls $ANDROID_SDK_ROOT/cmake/ || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build HakoGram (universal afatRelease)
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --info
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HakoGram-apk
          path: |
            TMessagesProj_App/build/outputs/apk/afat/release/*.apk
            TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Build summary
        run: |
          ls -lh TMessagesProj_App/build/outputs/apk/ || true
          find TMessagesProj_App/build/outputs -name "*.apk" -type f | xargs ls -lh || true
