name: Build TG app

on:
  push:
  workflow_dispatch:
    inputs:
      abis:
        description: "Which CPU types to build (all = arm64 + v7a + x86 + x86_64, covers every device)"
        type: choice
        options:
          - all
          - arm64+v7a
          - arm64
        default: all

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ABI_MODE: ${{ github.event.inputs.abis || 'all' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK / NDK
        run: |
          SDKM=$(command -v sdkmanager || ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      # ---------- امضا ----------
      # اگر سکرت KEYSTORE_B64 و KEYSTORE_PASSWORD تنظیم شده باشد از همان استفاده می‌شود
      # (برای اینکه امضا بین بیلدها ثابت بماند و آپدیت روی هم نصب شود).
      # اگر نباشد، یک keystore یک‌بار ساخته و در ریپو (ci/tgapp.keystore) ذخیره می‌شود تا امضا همیشه ثابت بماند.
      - name: Prepare keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          mkdir -p TMessagesProj/config
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > TMessagesProj/config/release.keystore
            ALIAS="${KS_ALIAS:-tgapp}"
            PASS="$KS_PASS"
          elif [ -f ci/tgapp.keystore ]; then
            echo "Using persistent keystore from repo (ci/tgapp.keystore)"
            cp ci/tgapp.keystore TMessagesProj/config/release.keystore
            ALIAS=tgapp
            PASS=tgapp-ci-key-2026
          else
            echo "No keystore found, generating a PERSISTENT keystore and saving it to the repo (ci/tgapp.keystore)"
            rm -f TMessagesProj/config/release.keystore
            ALIAS=tgapp
            PASS=tgapp-ci-key-2026
            keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore \
              -storetype PKCS12 -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=TG app"
            mkdir -p ci
            cp TMessagesProj/config/release.keystore ci/tgapp.keystore
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -f ci/tgapp.keystore
            git commit -m "Add persistent signing keystore [skip ci]" || true
            git push || echo "WARNING: could not push keystore; next build will generate a new key again"
          fi
          {
            echo "RELEASE_KEY_PASSWORD=$PASS"
            echo "RELEASE_KEY_ALIAS=$ALIAS"
            echo "RELEASE_STORE_PASSWORD=$PASS"
            echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8"
          } >> gradle.properties

      - name: google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            for d in TMessagesProj TMessagesProj_App; do echo "$GS_JSON" > $d/google-services.json; done
          fi

      - name: Patch BuildVars
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [ -n "$API_ID" ]; then
            sed -i -E "s/(APP_ID *= *)[0-9]+;/\1$API_ID;/" $F
            sed -i -E "s/(APP_HASH *= *\")[^\"]*(\")/\1$API_HASH\2/" $F
          fi

      - name: Rename app
        run: |
          echo "=== applicationId BEFORE ==="
          grep -rnE '[aA]pplicationId' --include=*.gradle --include=*.kts --include=*.kt --include=*.properties . 2>/dev/null | grep -v '/build/' | head -30 || true
          grep -rlE '[aA]pplicationId' --include=*.gradle --include=*.kts --include=*.kt --include=*.properties . 2>/dev/null | grep -v '/build/' | while read f; do
            sed -i -E 's/([aA]pplicationId[[:space:]]*(=|\()?[[:space:]]*)"[^"]+"/\1"org.tgapp"/g' "$f"
            sed -i -E "s/([aA]pplicationId[[:space:]]*(=|\()?[[:space:]]*)'[^']+'/\1\"org.tgapp\"/g" "$f"
          done
          echo "=== applicationId AFTER ==="
          grep -rnE '[aA]pplicationId' --include=*.gradle --include=*.kts --include=*.kt --include=*.properties . 2>/dev/null | grep -v '/build/' | head -30 || true
          sed -i -E 's#(<string name="AppName">)[^<]*(</string>)#\1TG app\2#' TMessagesProj/src/main/res/values/strings.xml
          sed -i -E 's#(<string name="AppName">)[^<]*(</string>)#\1TG app\2#' TMessagesProj/src/main/res/values*/strings.xml || true

      - name: Select ABIs
        run: |
          python3 - <<'PYEOF'
          import re, glob, os
          mode = os.environ.get('ABI_MODE', 'all')
          filters = {
              'arm64': 'abiFilters "arm64-v8a"',
              'arm64+v7a': 'abiFilters "armeabi-v7a", "arm64-v8a"',
              'all': 'abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"',
          }
          filt = filters.get(mode, filters['all'])
          print('ABI mode:', mode, '->', filt)
          for f in glob.glob('TMessagesProj*/build.gradle') + glob.glob('build.gradle'):
              s = open(f, encoding='utf-8').read()
              n = re.sub(r'abiFilters[ \t(]+[^\n]*', lambda m: filt, s)
              if n != s:
                  open(f, 'w', encoding='utf-8').write(n)
                  print('abiFilters patched in', f)
          PYEOF

      # ---------- افکت سیاه‌چاله (ساخت فایل + قلاب در ChatActivity) ----------
      - name: Add BlackHole effect
        run: |
          cat > TMessagesProj/src/main/java/org/telegram/ui/Components/BlackHoleClearEffect.java <<'JAVAEOF'
          package org.telegram.ui.Components;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.RadialGradient;
          import android.graphics.Shader;
          import android.graphics.SweepGradient;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          import org.telegram.messenger.AndroidUtilities;
          import org.telegram.messenger.MessageObject;
          import org.telegram.ui.ActionBar.SimpleTextView;
          import org.telegram.ui.Cells.ChatMessageCell;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Random;

          /**
           * سیاه‌چاله‌ای که از «اسم کاربر» بالای چت باز می‌شود.
           * حالت ۱ (پاک کردن کل تاریخچه): والپیپر/تم به سمت سیاه‌چاله خم می‌شود و پیام‌ها کشیده و بلعیده می‌شوند.
           * حالت ۲ (پاک کردن پیام): پیام به ذرات پودر تبدیل می‌شود و بعد سیاه‌چاله می‌آید و پودر را می‌بلعد.
           * فقط Canvas ساده، بدون OpenGL.
           */
          public class BlackHoleClearEffect extends View {

              private static final int MODE_CLEAR = 0;
              private static final int MODE_DELETE = 1;

              private static final float EMERGE = 0.6f;
              private static final float COLLAPSE = 0.35f;

              // حالت پاک کردن کل تاریخچه
              private static final float SWALLOW_START = 0.25f;
              private static final float SWALLOW = 1.1f;
              private static final float CLEAR_COLLAPSE_AT = SWALLOW_START + SWALLOW;
              private static final float CLEAR_TOTAL = CLEAR_COLLAPSE_AT + COLLAPSE;
              private static final float STAGGER = 0.45f;

              // حالت پاک کردن پیام
              private static final float DEL_HOLE_START = 0.3f;
              private static final float DEL_ATTRACT_START = 0.7f;
              private static final float DEL_MAX = 3.4f;
              private static final int MAX_PARTICLES = 2600;

              private static final int COLS = 4;
              private static final int ROWS = 16;
              private static final int BC = 8;
              private static final int BR = 16;

              private static boolean running;

              public static boolean isRunning() {
                  return running;
              }

              private static class Item {
                  Bitmap bmp;
                  float x, y, w, h;
                  float delay;
                  float[] src = new float[(COLS + 1) * (ROWS + 1) * 2];
                  float[] dst = new float[(COLS + 1) * (ROWS + 1) * 2];
              }

              private final int mode;
              private final ArrayList<Item> items = new ArrayList<>();
              private final Paint bmpPaint = new Paint(Paint.FILTER_BITMAP_FLAG | Paint.ANTI_ALIAS_FLAG);
              private final Paint titlePaint = new Paint(Paint.FILTER_BITMAP_FLAG | Paint.ANTI_ALIAS_FLAG);
              private final Paint holePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint glowPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint ringPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint darkPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint dustPaint = new Paint();
              private final Matrix matrix = new Matrix();
              private final RadialGradient glowShader;
              private final SweepGradient ringShader;
              private final RadialGradient darkShader = new RadialGradient(0, 0, 1f,
                      new int[]{0xCC000000, 0x66000000, 0x00000000},
                      new float[]{0f, 0.45f, 1f}, Shader.TileMode.CLAMP);
              private final float[] bgVerts = new float[(BC + 1) * (BR + 1) * 2];
              private final int[] tmpLoc = new int[2];
              private final Random rnd = new Random();

              private final float maxRadius = AndroidUtilities.dp(46);
              private long startTime;
              private float lastT;
              private boolean finished;
              private boolean cleaned;
              private View listView;
              private Runnable onFinished;
              private int hostX, hostY;
              private Bitmap bgBmp;

              // اسم کاربر (مبدا سیاه‌چاله)
              private View titleView;
              private float titleOrigAlpha = 1f;
              private Bitmap titleBmp;
              private float titleX, titleY, titleW, titleH, titleCx, titleCy;
              private float holeCx, holeCy;

              // ذرات پودر
              private int pcount;
              private float[] ppx, ppy, pvx, pvy, psz, pdelay, palpha;
              private int[] pcol;
              private boolean[] palive;
              private float collapseStart = -1f;

              private BlackHoleClearEffect(Context context, int mode) {
                  super(context);
                  this.mode = mode;
                  glowShader = new RadialGradient(0, 0, 1f,
                          new int[]{0xFF000000, 0xFF000000, 0xFFFFE2B0, 0x66FF9A40, 0x00FF9A40},
                          new float[]{0f, 0.45f, 0.5f, 0.62f, 1f}, Shader.TileMode.CLAMP);
                  ringShader = new SweepGradient(0, 0,
                          new int[]{0xFFFFFFFF, 0xFFFFC27A, 0x11FFFFFF, 0xFFFFE0B0, 0xFFFFFFFF},
                          new float[]{0f, 0.25f, 0.55f, 0.8f, 1f});
                  holePaint.setColor(0xFF000000);
                  holePaint.setStyle(Paint.Style.FILL);
                  ringPaint.setStyle(Paint.Style.STROKE);
                  ringPaint.setStrokeWidth(AndroidUtilities.dp(2.5f));
                  dustPaint.setStyle(Paint.Style.FILL);
              }

              private static float clamp(float v) {
                  return v < 0f ? 0f : (v > 1f ? 1f : v);
              }

              // ------------------------------------------------------------------------------------
              // ورودی ۱: پاک کردن کل تاریخچه
              // ------------------------------------------------------------------------------------

              /**
               * @param host        ویوی والد (contentView)
               * @param list        لیست پیام‌ها (chatListView)
               * @param titleOrigin ویوی هدر چت (avatarContainer)؛ سیاه‌چاله از اسم کاربر داخل آن باز می‌شود. می‌تواند null باشد.
               */
              public static boolean start(ViewGroup host, ViewGroup list, View titleOrigin, Runnable onCaptured, Runnable onFinished) {
                  if (running || host == null || list == null || list.getChildCount() == 0 || host.getHeight() == 0) {
                      return false;
                  }
                  BlackHoleClearEffect effect = new BlackHoleClearEffect(host.getContext(), MODE_CLEAR);
                  int[] hostLoc = new int[2];
                  int[] childLoc = new int[2];
                  host.getLocationInWindow(hostLoc);
                  float hostH = host.getHeight();

                  for (int i = 0; i < list.getChildCount(); i++) {
                      View child = list.getChildAt(i);
                      if (child.getWidth() <= 0 || child.getHeight() <= 0 || child.getVisibility() != VISIBLE) {
                          continue;
                      }
                      child.getLocationInWindow(childLoc);
                      Item item = new Item();
                      item.x = childLoc[0] - hostLoc[0];
                      item.y = childLoc[1] - hostLoc[1];
                      item.w = child.getWidth();
                      item.h = child.getHeight();
                      if (item.y + item.h < 0 || item.y > hostH) {
                          continue;
                      }
                      try {
                          item.bmp = Bitmap.createBitmap(child.getWidth(), child.getHeight(), Bitmap.Config.ARGB_8888);
                          child.draw(new Canvas(item.bmp));
                      } catch (Throwable e) {
                          continue;
                      }
                      float cy = Math.max(0f, Math.min(1f, (item.y + item.h / 2f) / hostH));
                      item.delay = STAGGER * cy;
                      int k = 0;
                      for (int r = 0; r <= ROWS; r++) {
                          for (int c = 0; c <= COLS; c++) {
                              item.src[k++] = item.x + item.w * c / COLS;
                              item.src[k++] = item.y + item.h * r / ROWS;
                          }
                      }
                      effect.items.add(item);
                  }
                  if (effect.items.isEmpty()) {
                      return false;
                  }

                  effect.listView = list;
                  effect.onFinished = onFinished;
                  effect.hostX = hostLoc[0];
                  effect.hostY = hostLoc[1];
                  effect.setupTitle(host, titleOrigin);   // اسم را می‌گیرد و پنهان می‌کند
                  list.setAlpha(0f);
                  try {
                      int bw = Math.max(1, host.getWidth() / 2);
                      int bh = Math.max(1, host.getHeight() / 2);
                      Bitmap bg = Bitmap.createBitmap(bw, bh, Bitmap.Config.ARGB_8888);
                      Canvas bc = new Canvas(bg);
                      bc.scale(0.5f, 0.5f);
                      host.draw(bc);
                      effect.bgBmp = bg;
                  } catch (Throwable ignore) {
                      effect.bgBmp = null;
                  }
                  if (!effect.attach(host)) {
                      return false;
                  }
                  if (onCaptured != null) {
                      onCaptured.run();
                  }
                  return true;
              }

              // ------------------------------------------------------------------------------------
              // ورودی ۲: پاک شدن پیام (از NotificationCenter.messagesDeleted صدا زده می‌شود)
              // ------------------------------------------------------------------------------------

              public static boolean onMessagesDeleted(ViewGroup host, ViewGroup list, View titleOrigin, Object[] args) {
                  if (running || host == null || list == null || host.getHeight() == 0
                          || args == null || args.length == 0 || !(args[0] instanceof List)) {
                      return false;
                  }
                  List<?> ids = (List<?>) args[0];
                  if (ids.isEmpty()) {
                      return false;
                  }
                  int[] hostLoc = new int[2];
                  int[] childLoc = new int[2];
                  host.getLocationInWindow(hostLoc);
                  float hostH = host.getHeight();

                  ArrayList<Bitmap> bitmaps = new ArrayList<>();
                  ArrayList<float[]> origins = new ArrayList<>();
                  long totalArea = 0;
                  for (int i = 0; i < list.getChildCount(); i++) {
                      View child = list.getChildAt(i);
                      if (!(child instanceof ChatMessageCell) || child.getWidth() <= 0 || child.getHeight() <= 0) {
                          continue;
                      }
                      MessageObject mo = ((ChatMessageCell) child).getMessageObject();
                      if (mo == null || !ids.contains(mo.getId())) {
                          continue;
                      }
                      child.getLocationInWindow(childLoc);
                      float y = childLoc[1] - hostLoc[1];
                      if (y + child.getHeight() < 0 || y > hostH) {
                          continue;
                      }
                      try {
                          Bitmap b = Bitmap.createBitmap(child.getWidth(), child.getHeight(), Bitmap.Config.ARGB_8888);
                          child.draw(new Canvas(b));
                          bitmaps.add(b);
                          origins.add(new float[]{childLoc[0] - hostLoc[0], y});
                          totalArea += (long) b.getWidth() * b.getHeight();
                      } catch (Throwable e) {
                          // ignore
                      }
                  }
                  if (bitmaps.isEmpty()) {
                      return false;
                  }

                  BlackHoleClearEffect effect = new BlackHoleClearEffect(host.getContext(), MODE_DELETE);
                  int step = Math.max(3, (int) Math.ceil(Math.sqrt((double) totalArea / MAX_PARTICLES)));
                  int cap = 0;
                  for (Bitmap b : bitmaps) {
                      cap += (b.getWidth() / step + 1) * (b.getHeight() / step + 1);
                  }
                  effect.ppx = new float[cap];
                  effect.ppy = new float[cap];
                  effect.pvx = new float[cap];
                  effect.pvy = new float[cap];
                  effect.psz = new float[cap];
                  effect.pdelay = new float[cap];
                  effect.palpha = new float[cap];
                  effect.pcol = new int[cap];
                  effect.palive = new boolean[cap];

                  float u = AndroidUtilities.dp(1);
                  int n = 0;
                  for (int bi = 0; bi < bitmaps.size(); bi++) {
                      Bitmap b = bitmaps.get(bi);
                      float[] o = origins.get(bi);
                      int w = b.getWidth();
                      int h = b.getHeight();
                      int[] pix = new int[w * h];
                      b.getPixels(pix, 0, w, 0, 0, w, h);
                      b.recycle();
                      for (int y = 0; y < h; y += step) {
                          for (int x = 0; x < w; x += step) {
                              int c = pix[y * w + x];
                              int a = c >>> 24;
                              if (a < 70 || n >= cap) {
                                  continue;
                              }
                              effect.ppx[n] = o[0] + x;
                              effect.ppy[n] = o[1] + y;
                              effect.pcol[n] = c & 0x00FFFFFF;
                              effect.palpha[n] = a / 255f;
                              effect.psz[n] = step * 0.9f;
                              effect.pdelay[n] = 0.5f * x / w + 0.2f * effect.rnd.nextFloat();
                              effect.pvx[n] = (effect.rnd.nextFloat() * 1.3f - 0.3f) * u * 120f;
                              effect.pvy[n] = (effect.rnd.nextFloat() * 1.1f - 0.9f) * u * 100f;
                              effect.palive[n] = true;
                              n++;
                          }
                      }
                  }
                  if (n == 0) {
                      return false;
                  }
                  effect.pcount = n;
                  effect.hostX = hostLoc[0];
                  effect.hostY = hostLoc[1];
                  effect.setupTitle(host, titleOrigin);
                  return effect.attach(host);
              }

              // ------------------------------------------------------------------------------------

              private boolean attach(ViewGroup host) {
                  try {
                      host.addView(this, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  } catch (Throwable e) {
                      cleanup();
                      return false;
                  }
                  running = true;
                  startTime = System.nanoTime();
                  lastT = 0f;
                  invalidate();
                  return true;
              }

              /** اسم کاربر را پیدا می‌کند، از آن عکس می‌گیرد، پنهانش می‌کند و محل سیاه‌چاله را مشخص می‌کند. */
              private void setupTitle(ViewGroup host, View origin) {
                  int[] hl = new int[2];
                  int[] tl = new int[2];
                  host.getLocationInWindow(hl);
                  View found = null;
                  if (origin instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) origin;
                      for (int i = 0; i < g.getChildCount(); i++) {
                          View c = g.getChildAt(i);
                          if (c instanceof SimpleTextView && c.getVisibility() == VISIBLE && c.getWidth() > 0 && c.getHeight() > 0) {
                              found = c;
                              break;
                          }
                      }
                  }
                  if (found == null && origin != null && origin.getWidth() > 0 && origin.getHeight() > 0) {
                      found = origin;
                  }
                  float W = host.getWidth();
                  if (found != null) {
                      found.getLocationInWindow(tl);
                      titleX = tl[0] - hl[0];
                      titleY = tl[1] - hl[1];
                      titleW = Math.min(found.getWidth(), AndroidUtilities.dp(180));
                      titleH = found.getHeight();
                      try {
                          titleBmp = Bitmap.createBitmap(found.getWidth(), found.getHeight(), Bitmap.Config.ARGB_8888);
                          found.draw(new Canvas(titleBmp));
                      } catch (Throwable e) {
                          titleBmp = null;
                      }
                      titleView = found;
                      titleOrigAlpha = found.getAlpha();
                      found.setAlpha(0f);
                  } else {
                      titleW = AndroidUtilities.dp(120);
                      titleH = AndroidUtilities.dp(20);
                      titleX = (W - titleW) / 2f;
                      titleY = AndroidUtilities.statusBarHeight + AndroidUtilities.dp(18);
                  }
                  titleCx = titleX + titleW / 2f;
                  titleCy = titleY + titleH / 2f;
                  float m = maxRadius + AndroidUtilities.dp(6);
                  holeCx = Math.max(m, Math.min(W - m, titleCx));
                  holeCy = Math.max(m, titleCy);
              }

              private float holeAmount(float t) {
                  float cs = mode == MODE_CLEAR ? CLEAR_COLLAPSE_AT : collapseStart;
                  if (cs >= 0f && t >= cs) {
                      float p = clamp((t - cs) / COLLAPSE);
                      return 1f - p * p;
                  }
                  float start = mode == MODE_CLEAR ? 0f : DEL_HOLE_START;
                  if (t < start) {
                      return 0f;
                  }
                  float p = clamp((t - start) / EMERGE);
                  return 1f - (1f - p) * (1f - p);
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  if (finished) {
                      return;
                  }
                  float t = (System.nanoTime() - startTime) / 1_000_000_000f;
                  float dt = Math.min(Math.max(t - lastT, 0f), 1f / 30f);
                  lastT = t;
                  getLocationInWindow(tmpLoc);
                  canvas.save();
                  canvas.translate(hostX - tmpLoc[0], hostY - tmpLoc[1]);

                  float h = holeAmount(t);
                  if (mode == MODE_CLEAR) {
                      drawClear(canvas, t, h);
                  } else {
                      drawDust(canvas, t, dt, h);
                  }
                  drawHole(canvas, t, h);

                  canvas.restore();

                  boolean done = mode == MODE_CLEAR ? t >= CLEAR_TOTAL : (collapseStart >= 0f && t >= collapseStart + COLLAPSE);
                  if (done) {
                      finish();
                  } else {
                      invalidate();
                  }
              }

              // ---------------------------- حالت پاک کردن کل تاریخچه ----------------------------

              private void drawClear(Canvas canvas, float t, float h) {
                  float cx = holeCx;
                  float cy = holeCy;
                  float T = clamp((t - SWALLOW_START) / SWALLOW);
                  drawBackground(canvas, h, cx, cy, maxRadius * (0.3f + 0.7f * h));
                  for (int n = 0; n < items.size(); n++) {
                      Item item = items.get(n);
                      float p = clamp((T - item.delay) / (1f - STAGGER));
                      if (p >= 1f) {
                          continue;
                      }
                      float alpha = 1f - clamp((p - 0.85f) / 0.15f);
                      int len = item.src.length;
                      for (int k = 0; k < len; k += 2) {
                          float vx = item.src[k];
                          float vy = item.src[k + 1];
                          float frac = clamp((vy - item.y) / item.h);
                          float pv = clamp(p * 1.25f - 0.25f * frac);
                          float e = pv * pv;
                          float px = vx + (cx - vx) * e;
                          float py = vy + (cy - vy) * e;
                          float ang = 1.5f * e * (1f - e);
                          float dx = px - cx;
                          float dy = py - cy;
                          float cos = (float) Math.cos(ang);
                          float sin = (float) Math.sin(ang);
                          item.dst[k] = cx + dx * cos - dy * sin;
                          item.dst[k + 1] = cy + dx * sin + dy * cos;
                      }
                      bmpPaint.setAlpha((int) (alpha * 255));
                      canvas.drawBitmapMesh(item.bmp, COLS, ROWS, item.dst, 0, null, 0, bmpPaint);
                  }
              }

              /** خم شدن والپیپر/تم و کل صفحه به سمت سیاه‌چاله. */
              private void drawBackground(Canvas canvas, float h, float cx, float cy, float radius) {
                  if (bgBmp == null) {
                      return;
                  }
                  float w = getWidth();
                  float hh = getHeight();
                  float r0 = w * 0.85f;
                  float border = Math.min(w, hh) * 0.12f;
                  int k = 0;
                  for (int r = 0; r <= BR; r++) {
                      for (int c = 0; c <= BC; c++) {
                          float x = w * c / BC;
                          float y = hh * r / BR;
                          float dx = x - cx;
                          float dy = y - cy;
                          float d = (float) Math.sqrt(dx * dx + dy * dy);
                          float q = d / r0;
                          float fall = (float) Math.exp(-q * q);
                          float edge = Math.min(Math.min(x, w - x), Math.min(y, hh - y)) / border;
                          edge = edge > 1f ? 1f : edge;
                          float pin = edge * edge * (3f - 2f * edge);
                          float pull = h * 0.6f * fall * pin;
                          float ang = h * 0.9f * fall * pin;
                          float px = dx * (1f - pull);
                          float py = dy * (1f - pull);
                          float cos = (float) Math.cos(ang);
                          float sin = (float) Math.sin(ang);
                          bgVerts[k++] = cx + px * cos - py * sin;
                          bgVerts[k++] = cy + px * sin + py * cos;
                      }
                  }
                  canvas.drawBitmapMesh(bgBmp, BC, BR, bgVerts, 0, null, 0, null);
                  drawVignette(canvas, h, cx, cy, radius);
              }

              private void drawVignette(Canvas canvas, float h, float cx, float cy, float radius) {
                  if (h > 0.01f) {
                      float dr = radius * 3.5f;
                      matrix.setScale(dr, dr);
                      matrix.postTranslate(cx, cy);
                      darkShader.setLocalMatrix(matrix);
                      darkPaint.setShader(darkShader);
                      darkPaint.setAlpha((int) (255 * h));
                      canvas.drawCircle(cx, cy, dr, darkPaint);
                  }
              }

              // ---------------------------- حالت پاک کردن پیام (پودر) ----------------------------

              private void drawDust(Canvas canvas, float t, float dt, float h) {
                  float cx = holeCx;
                  float cy = holeCy;
                  drawVignette(canvas, h, cx, cy, maxRadius * (0.3f + 0.7f * h));

                  float u = AndroidUtilities.dp(1);
                  float R = Math.max(maxRadius * h, u * 6f);
                  float ramp = clamp((t - DEL_ATTRACT_START) / 0.5f);
                  boolean pulling = ramp > 0f && h > 0.2f;
                  float damp = 1f - Math.min(0.9f, (pulling ? 1.6f : 0.8f) * dt);
                  boolean forceKill = t > DEL_MAX;
                  int aliveCount = 0;

                  for (int i = 0; i < pcount; i++) {
                      if (!palive[i]) {
                          continue;
                      }
                      if (forceKill) {
                          palive[i] = false;
                          continue;
                      }
                      if (t >= pdelay[i]) {
                          pvx[i] += (rnd.nextFloat() - 0.5f) * u * 220f * dt;
                          pvy[i] += (rnd.nextFloat() - 0.5f) * u * 220f * dt;
                          if (pulling) {
                              float dx = cx - ppx[i];
                              float dy = cy - ppy[i];
                              float d = (float) Math.sqrt(dx * dx + dy * dy) + 0.001f;
                              float a = u * 1400f * ramp;
                              pvx[i] += (dx / d * a - dy / d * a * 0.7f) * dt;
                              pvy[i] += (dy / d * a + dx / d * a * 0.7f) * dt;
                          }
                          pvx[i] *= damp;
                          pvy[i] *= damp;
                          ppx[i] += pvx[i] * dt;
                          ppy[i] += pvy[i] * dt;
                      }
                      float dx = cx - ppx[i];
                      float dy = cy - ppy[i];
                      float d = (float) Math.sqrt(dx * dx + dy * dy);
                      if (h > 0.3f && d < R * 0.5f) {
                          palive[i] = false;
                          continue;
                      }
                      aliveCount++;
                      float shrink = 1f;
                      float fade = 1f;
                      if (h > 0.2f && d < R * 2.4f) {
                          shrink = 0.3f + 0.7f * clamp(d / (R * 2.4f));
                          fade = 0.35f + 0.65f * clamp(d / (R * 2.4f));
                      }
                      int a = (int) (255f * palpha[i] * fade);
                      dustPaint.setColor((pcol[i] & 0x00FFFFFF) | (a << 24));
                      float s = psz[i] * shrink;
                      canvas.drawRect(ppx[i], ppy[i], ppx[i] + s, ppy[i] + s, dustPaint);
                  }

                  if (aliveCount == 0 && collapseStart < 0f && t > DEL_HOLE_START + EMERGE) {
                      collapseStart = t;
                  }
              }

              // ---------------------------- سیاه‌چاله (از اسم کاربر) ----------------------------

              private void drawHole(Canvas canvas, float t, float h) {
                  float cx = titleCx + (holeCx - titleCx) * h;
                  float cy = titleCy + (holeCy - titleCy) * h;
                  if (h > 0.001f) {
                      float rad = maxRadius * h;
                      float glowR = rad * 2.2f;
                      matrix.setScale(glowR, glowR);
                      matrix.postTranslate(cx, cy);
                      glowShader.setLocalMatrix(matrix);
                      glowPaint.setShader(glowShader);
                      canvas.drawCircle(cx, cy, glowR, glowPaint);

                      // کپسولِ اندازهٔ اسم به دایره تبدیل می‌شود
                      float rw = titleW / 2f + (maxRadius - titleW / 2f) * h;
                      float rh = titleH / 2f + (maxRadius - titleH / 2f) * h;
                      canvas.drawRoundRect(cx - rw, cy - rh, cx + rw, cy + rh, rh, rh, holePaint);

                      float ringA = clamp((h - 0.35f) / 0.65f);
                      if (ringA > 0.01f) {
                          matrix.setRotate(t * 250f);
                          matrix.postTranslate(cx, cy);
                          ringShader.setLocalMatrix(matrix);
                          ringPaint.setShader(ringShader);
                          ringPaint.setAlpha((int) (255 * ringA));
                          canvas.drawCircle(cx, cy, rad * 1.02f, ringPaint);
                      }
                  }
                  // خود اسم: قبل از باز شدن سیاه‌چاله دیده می‌شود، بعد در آن حل می‌شود (و در بسته شدن برمی‌گردد)
                  float ta = 1f - clamp(h / 0.4f);
                  if (titleBmp != null && ta > 0.01f) {
                      float sc = 1f - 0.5f * clamp(h / 0.4f);
                      canvas.save();
                      canvas.scale(sc, sc, titleCx, titleCy);
                      titlePaint.setAlpha((int) (255 * ta));
                      canvas.drawBitmap(titleBmp, titleX, titleY, titlePaint);
                      canvas.restore();
                  }
              }

              // ------------------------------------------------------------------------------------

              private void cleanup() {
                  if (cleaned) {
                      return;
                  }
                  cleaned = true;
                  finished = true;
                  running = false;
                  for (Item item : items) {
                      if (item.bmp != null) {
                          item.bmp.recycle();
                      }
                  }
                  items.clear();
                  if (bgBmp != null) {
                      bgBmp.recycle();
                      bgBmp = null;
                  }
                  if (titleBmp != null) {
                      titleBmp.recycle();
                      titleBmp = null;
                  }
                  if (listView != null) {
                      listView.setAlpha(1f);
                  }
                  if (titleView != null) {
                      titleView.setAlpha(titleOrigAlpha);
                  }
              }

              private void finish() {
                  cleanup();
                  final Runnable done = onFinished;
                  post(() -> {
                      if (getParent() instanceof ViewGroup) {
                          ((ViewGroup) getParent()).removeView(this);
                      }
                      if (done != null) {
                          done.run();
                      }
                  });
              }

              @Override
              protected void onDetachedFromWindow() {
                  super.onDetachedFromWindow();
                  cleanup();
              }
          }
