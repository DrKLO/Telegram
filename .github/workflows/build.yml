                      @Override
                      public boolean onInterceptTouchEvent(androidx.recyclerview.widget.RecyclerView rv, android.view.MotionEvent e) {
                          int a = e.getActionMasked();
                          if (a == android.view.MotionEvent.ACTION_POINTER_DOWN && e.getPointerCount() == 2) {
                              startY = (e.getY(0) + e.getY(1)) / 2f;
                              tracking = true;
