name: Build FireGram APK
on:
'on':
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-22.04
steps:
- name: Checkout source
uses: actions/checkout@v4
  - name: Checkout source
    uses: actions/checkout@v4
    with:
      submodules: recursive
  - name: Set up JDK
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
  - name: Build debug APK
  - name: Build APK
    run: |
      chmod +x ./gradlew
      ./gradlew assembleAfatDebug --no-daemon
      chmod +x gradlew
      ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug --no-daemon
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: FireGram-APK
      path: TMessagesProj/build/outputs/apk/**/*.apk
      path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
      if-no-files-found: error
