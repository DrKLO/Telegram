name: Build XGram APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive || true
          ls -la TMessagesProj_Modules/media | head -20 || true
          test -f TMessagesProj_Modules/media/core_settings.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache NDK build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            TMessagesProj/.cxx
          key: ${{ runner.os }}-ndk-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-ndk-

      - name: Setup config files
        run: |
          [ -f gradle.properties.example ] && cp gradle.properties.example gradle.properties || touch gradle.properties
          [ -f local.properties.example ] && cp local.properties.example local.properties || touch local.properties
          echo "TELEGRAM_APP_ID=33758413" >> local.properties
          echo "TELEGRAM_APP_HASH=e9fe420e4e170ff123fd27c3f63c440e" >> local.properties
          echo "RELEASE_KEY_ALIAS=androiddebugkey" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=android" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=android" >> gradle.properties

      - name: Setup google-services.json
        run: |
          python3 - << 'PYEOF'
          import json
          bases = ["org.telegram.messenger", "me.chat_t.messenger", "me.xgram.messenger"]
          suffixes = ["", ".beta", ".web"]
          clients = []
          n = 0
          for b in bases:
              for s in suffixes:
                  n += 1
                  clients.append({
                      "client_info": {
                          "mobilesdk_app_id": "1:1:android:a%d" % n,
                          "android_client_info": {"package_name": b + s}
                      },
                      "api_key": [{"current_key": "test"}],
                      "services": {"appinvite_service": {"other_platform_oauth_client": []}}
                  })
          data = {
              "project_info": {
                  "project_id": "xgram",
                  "project_number": "1",
                  "firebase_url": "https://xgram.firebaseio.com",
                  "storage_bucket": "xgram.appspot.com"
              },
              "client": clients,
              "configuration_version": "1"
          }
          with open("/tmp/google-services.json", "w") as f:
              json.dump(data, f)
          PYEOF
          find . -name "google-services.json" -not -path "*/build/*" -not -path "./.git/*" -exec cp /tmp/google-services.json {} \;
          for d in TMessagesProj TMessagesProj_App TMessagesProj_AppStandalone; do
            if [ -d "$d" ]; then cp /tmp/google-services.json "$d/google-services.json"; fi
          done

      - name: Verify google-services
        run: |
          find . -name "google-services.json" -not -path "*/build/*" -not -path "./.git/*" | while read -r f; do
            echo "== $f"
            grep -o '"package_name": "[^"]*"' "$f"
          done

      - name: Enable buildConfig
        run: |
          if ! grep -qE "buildConfig[[:space:]]*(=[[:space:]]*)?true" TMessagesProj/build.gradle; then
            sed -i '/android {/a\    buildFeatures { buildConfig true }' TMessagesProj/build.gradle
          fi

      - name: Create debug keystore
        run: |
          mkdir -p TMessagesProj/config
          rm -f TMessagesProj/config/release.keystore
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=XGram,O=RK,C=IR"

      - name: Rename Telegram to XGram
        run: |
          find . -name "strings.xml" -not -path "*/build/*" -print0 | xargs -0 -r perl -0pi -e 's/>([^<]*)</">" . ($1 =~ s{Telegram}{XGram}gr) . "<"/ge'

      - name: Rename package name
        run: |
          grep -rl --include="*.gradle" --include="gradle.properties" --include="AndroidManifest.xml" --include="*.java" --include="*.kt" --include="*.xml" --exclude-dir=build --exclude-dir=.git --exclude-dir=.gradle "me.chat_t.messenger" . | xargs -r sed -i 's/me\.chat_t\.messenger/me.xgram.messenger/g' || true

      - name: Quick pre-check google-services
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:processDebugGoogleServices :TMessagesProj_App:processAfatDebugGoogleServices --no-daemon -x lint --console=plain

      - name: Build APK
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon -x lint --stacktrace --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show errors
        if: failure()
        run: |
          grep -nE "What went wrong|FAILED|error:|e: file|fatal error|undefined reference" -A6 build.log | head -120

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: List APKs
        if: always()
        run: find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xgram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          
