name: Build All Branches

on:
  push:
    branches:
      - main
      - master
      - dev
      - assets
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK for ${{ github.ref_name }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tajgram-APK-${{ github.ref_name }}
          path: TMessagesProj/build/outputs/apk/debug/app-debug.apk
