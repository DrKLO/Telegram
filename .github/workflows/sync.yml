name: Sync Fork

on:
  schedule:
    - cron: '0 */12 * * *' # every 12 hours
  workflow_dispatch: # on button click

jobs:
  sync:

    runs-on: ubuntu-latest

    steps:
      - uses: tgymnich/fork-sync@v2.0
        with:
          owner: DrKLO
          repo: Telegram
          base: master
          head: main
          merge_method: rebase
          auto_approve: true
          ignore_fail: true