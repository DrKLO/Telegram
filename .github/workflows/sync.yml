name: Sync Fork

on:
  schedule:
    - cron: '0 */12 * * *' # every 12 hours
  workflow_dispatch: # on button click

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Path form — use this if the action lives in this same repo,
      # e.g. at .github/actions/sync-fork-action/action.yml
      - name: Sync fork
        uses: ./.github/actions/sync-fork
        with:
          sync_method: 'rebase'
          upstream_repo: 'DrKLO/Telegram'
          upstream_branch: 'master'
          target_branch: 'main'
          pr_title: 'chore: sync with upstream'
          pr_body: 'Automated sync from upstream repository.'
          auto_approve: true
          auto_merge: true
          merge_method: 'rebase'
          github_token: ${{ secrets.GITHUB_TOKEN }}
