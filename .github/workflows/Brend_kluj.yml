name: Ultimate Permanent Rename and App Branding to Tajgram

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_brand:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Fresh
        uses: actions/checkout@v4

      # 1. ТАНҲО ДАР ГРАДЛ ПРОПЕРТИЗ НOМИ ПАКЕТ ВА КАЛИДҲOРО ТИБҚИ СУРАТИ 1000064583.JPG ИВАЗ МЕКУНАД
      - name: Inject Tajgram Configuration to gradle.properties
        run: |
          if [ -f gradle.properties ]; then
            sed -i 's|^APP_PACKAGE=.*|APP_PACKAGE=org.tajgram.messenger|g' gradle.properties
            sed -i 's|^RELEASE_KEY_PASSWORD=.*|RELEASE_KEY_PASSWORD=android|g' gradle.properties
            sed -i 's|^RELEASE_KEY_ALIAS=.*|RELEASE_KEY_ALIAS=tajgram_key|g' gradle.properties
            sed -i 's|^RELEASE_STORE_PASSWORD=.*|RELEASE_STORE_PASSWORD=android|g' gradle.properties
          fi

      # 2. ИВАЗ КАРДАНИ ТАМОМИ ЗАБОНҲО ДАР STRINGS.XML (ҲАМАИ ПАПКАҲО, ТАНҲО МАТН, БЕ ХАРОБ КАРДАНИ КАЛИДҲО)
      - name: Global Safe Case-Insensitive and Multi-Language Rename
        run: |
          # Ёфтани тамоми файлҳои strings.xml (Акнун папкаи асосии values/ ва ҳама забонҳоро дар бар мегирад)
          find . -type f -name "strings.xml" | while read file; do
            
            # ЗАШИТА АЗ ДУБЛИКАТ: Агар аллакай калимаи Tajgram бошад, он сатрро дигар даст намерасонад
            
            # 1. Ивази бехатари Telegram Premium ба Tajgram Premium VIP (Танҳо дар байни тирчаҳои матн)
            sed -i -E '/Tajgram Premium VIP/! s/(>[^<]*)[Tt][Ee][Ll][Ee][Gg][Rr][Aa][Mm]\s+[Pp][Rr][Ee][Mm][Ii][Uu][Mm]([^<]*<)/\1Tajgram Premium VIP\2/g' "$file" 2>/dev/null || true
            
            # 2. Ивази бехатари калимаи лотинии Telegram ба Tajgram (Дар тамоми забонҳо, аз ҷумла англисӣ, БЕ вайрон кардани name="...")
            sed -i -E '/Tajgram/! s/(>[^<]*)[Tt][Ee][Ll][Ee][Gg][Rr][Aa][Mm]([^<]*<)/\1Tajgram\2/g' "$file" 2>/dev/null || true
            
            # 3. Ивази калимаҳо бо забони Арабӣ (Маҳз калимаи тоза, бе рам ва бе хато)
            sed -i -E '/Tajgram/! s/(>[^<]*)تيليجرام([^<]*<)/\1Tajgram\2/g' "$file" 2>/dev/null || true
            
            # 4. 🚀 Ивази калима бо забони Форсӣ
            sed -i -E '/Tajgram/! s/(>[^<]*)تلگرام([^<]*<)/\1Tajgram\2/g' "$file" 2>/dev/null || true

            # 5. Ивази калима бо забони Хитоӣ / Чини
            sed -i -E '/Tajgram/! s/(>[^<]*)电报([^<]*<)/\1Tajgram\2/g' "$file" 2>/dev/null || true
          done

      # 3. САБТ ВА ПУШ КАРДАНИ ТАҒЙИРОТҲО БА РЕПОЗИТОРИЯ
      - name: Commit and Push Changes Safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git add **/strings.xml 2>/dev/null || true
          git commit -m "🚀 TAJGRAM BRANDING OVERHAUL: Complete multi-language text renaming with key protection" || echo "Ҳеҷ тағйироте нест"
          git push origin HEAD:${{ github.ref }}
