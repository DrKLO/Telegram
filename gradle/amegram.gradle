// AmeGram-only build policy. Credentials are supplied by the build environment.
def apiId = providers.environmentVariable('AMEGRAM_API_ID').orElse('0').get()
def apiHash = providers.environmentVariable('AMEGRAM_API_HASH').orElse('').get()
if (!(apiId ==~ /[0-9]{1,9}/) || !(apiHash.isEmpty() || apiHash ==~ /[a-fA-F0-9]{32}/)) {
    throw new GradleException('Invalid AmeGram API configuration. See docs/BUILDING.md; values are intentionally omitted.')
}
ext.amegramApiId = Integer.parseInt(apiId)
ext.amegramApiHash = apiHash

if (APP_PACKAGE != 'dev.umi.amegram') {
    throw new GradleException('AmeGram builds require the independent dev.umi.amegram application ID.')
}

gradle.taskGraph.whenReady { graph ->
    def packaging = graph.allTasks.findAll { task ->
        task.project.plugins.hasPlugin('com.android.application') &&
                task.name ==~ /(?i)(assemble|bundle|package).*(Debug|Release|Standalone|HA_private|HA_public|HA_hardcore)(Bundle)?/
    }
    if (!packaging.isEmpty()) {
        if (packaging.any { !(it.project.name in ['TMessagesProj_App', 'TMessagesProj_AppTests']) }) {
            throw new GradleException('Only regular AmeGram debug and test APK targets are supported. Other upstream service/distribution modules need a separate audit.')
        }
        if (rootProject.ext.amegramApiId <= 0 || rootProject.ext.amegramApiHash.isEmpty()) {
            throw new GradleException('APK packaging blocked: set your own AMEGRAM_API_ID and AMEGRAM_API_HASH in the build environment. Source/resource checks need no credentials.')
        }
        if (packaging.any { !it.name.contains('Debug') }) {
            throw new GradleException('Distribution packaging is not configured for AmeGram yet. Review signing and service integrations first; see docs/BUILDING.md.')
        }
    }
}
