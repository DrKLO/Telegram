<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #1f2937; }
  .card { max-width: 400px; margin: 0 auto; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .toggle { display: flex; background: #e5e7eb; border-radius: 999px; padding: 3px; margin-bottom: 16px; }
  .toggle button { flex: 1; border: none; background: transparent; padding: 8px; border-radius: 999px; font-size: 14px; cursor: pointer; color: #4b5563; }
  .toggle button.on { background: #fff; color: #111; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .field { margin-bottom: 12px; }
  .field .lbl { display: block; font-size: 13px; color: #6b7280; margin-bottom: 4px; }
  .num { display: flex; align-items: center; padding: 3px; border: 1px solid #d1d5db; border-radius: 8px; }
  .num span { flex: 1; text-align: center; font-size: 16px; font-variant-numeric: tabular-nums; }
  .num button { width: 34px; height: 32px; padding: 0; border: none; border-radius: 6px; background: #f3f4f6; color: #111; font-size: 18px; cursor: pointer; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .result { text-align: center; margin-top: 16px; }
  .bmi { font-size: 40px; font-weight: 700; }
  .cat { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .scale { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin-top: 14px; position: relative; }
  .scale div { flex: 1; }
  .marker { position: absolute; top: -6px; width: 4px; height: 26px; background: #111; border-radius: 2px; transition: left .3s; margin-left: -2px; }
  .labels { display: flex; justify-content: space-between; font-size: 11px; color: #6b7280; margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <h2>⚖️ BMI Calculator</h2>
  <div class="toggle"><button class="on" data-u="metric">Metric</button><button data-u="imperial">Imperial</button></div>
  <div id="metric">
    <div class="two">
      <div class="field"><span class="lbl">Height (cm)</span><div class="num" data-k="cm"><button data-d="-1">−</button><span id="cm"></span><button data-d="1">+</button></div></div>
      <div class="field"><span class="lbl">Weight (kg)</span><div class="num" data-k="kg"><button data-d="-1">−</button><span id="kg"></span><button data-d="1">+</button></div></div>
    </div>
  </div>
  <div id="imperial" style="display:none">
    <div class="two">
      <div class="field"><span class="lbl">Height (ft)</span><div class="num" data-k="ft"><button data-d="-1">−</button><span id="ft"></span><button data-d="1">+</button></div></div>
      <div class="field"><span class="lbl">Height (in)</span><div class="num" data-k="in"><button data-d="-1">−</button><span id="in"></span><button data-d="1">+</button></div></div>
    </div>
    <div class="field"><span class="lbl">Weight (lb)</span><div class="num" data-k="lb"><button data-d="-1">−</button><span id="lb"></span><button data-d="1">+</button></div></div>
  </div>
  <div class="result">
    <div class="bmi" id="bmi">—</div>
    <div class="cat" id="cat"></div>
  </div>
  <div class="scale">
    <div style="background:#60a5fa"></div><div style="background:#4ade80"></div><div style="background:#facc15"></div><div style="background:#f87171"></div>
    <div class="marker" id="marker" style="left:0"></div>
  </div>
  <div class="labels"><span>Under</span><span>Normal</span><span>Over</span><span>Obese</span></div>
</div>
<script>
  let unit = 'metric';
  // No number fields in a widget: each value has − / + steppers.
  const v = { cm: 175, kg: 70, ft: 5, in: 9, lb: 154 };
  const limits = { cm: [100, 230], kg: [30, 250], ft: [3, 7], in: [0, 11], lb: [66, 550] };
  const $ = id => document.getElementById(id);
  document.querySelectorAll('.toggle button').forEach(b => b.onclick = () => {
    unit = b.dataset.u;
    document.querySelectorAll('.toggle button').forEach(x => x.classList.toggle('on', x === b));
    $('metric').style.display = unit === 'metric' ? '' : 'none';
    $('imperial').style.display = unit === 'imperial' ? '' : 'none';
    calc();
  });
  function calc() {
    let h, w;
    for (const k in v) $(k).textContent = v[k];
    if (unit === 'metric') { h = v.cm / 100; w = v.kg; }
    else { h = (v.ft * 12 + v.in) * 0.0254; w = v.lb * 0.4536; }
    if (!h || !w) return;
    const bmi = w / (h * h);
    $('bmi').textContent = bmi.toFixed(1);
    const cats = [[18.5, 'Underweight', '#3b82f6'], [25, 'Normal weight', '#16a34a'], [30, 'Overweight', '#ca8a04'], [Infinity, 'Obese', '#dc2626']];
    const c = cats.find(x => bmi < x[0]);
    $('cat').textContent = c[1]; $('cat').style.color = c[2]; $('bmi').style.color = c[2];
    const pct = Math.max(0, Math.min(100, (bmi - 10) / 30 * 100));
    $('marker').style.left = pct + '%';
  }
  document.querySelectorAll('.num').forEach(n => n.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const k = n.dataset.k, [lo, hi] = limits[k];
    v[k] = Math.max(lo, Math.min(hi, v[k] + +b.dataset.d));
    calc();
  }));
  calc();
</script>
</body>
</html>
