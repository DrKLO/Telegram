<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f0fdf4; text-align: center; }
  h2 { font-size: 18px; margin: 0 0 8px; }
  .status { font-size: 15px; color: #374151; margin-bottom: 12px; min-height: 22px; }
  .board { display: grid; grid-template-columns: repeat(3, 90px); gap: 6px; justify-content: center; }
  .cell { width: 90px; height: 90px; background: #fff; border: 2px solid #bbf7d0; border-radius: 12px; font-size: 44px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s; }
  .cell:hover { background: #dcfce7; }
  .cell.x { color: #16a34a; } .cell.o { color: #ea580c; }
  .cell.win { background: #bbf7d0; }
  button { margin-top: 14px; padding: 10px 20px; background: #16a34a; color: #fff; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; }
  .score { margin-top: 10px; font-size: 13px; color: #6b7280; }
</style>
</head>
<body>
<h2>❌⭕ Tic-Tac-Toe</h2>
<div class="status" id="status">Your turn — you are X</div>
<div class="board" id="board"></div>
<button id="reset">New game</button>
<div class="score" id="score">You 0 · Computer 0 · Draws 0</div>
<script>
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let board, over, busy = false, score = { x: 0, o: 0, d: 0 };
  const boardEl = document.getElementById('board'), status = document.getElementById('status');
  function winner(b) { for (const [a, c, d] of LINES) if (b[a] && b[a] === b[c] && b[a] === b[d]) return { p: b[a], line: [a, c, d] }; return b.every(Boolean) ? { p: 'draw' } : null; }
  function render(win) {
    boardEl.innerHTML = board.map((v, i) => `<div class="cell ${v ? v.toLowerCase() : ''} ${win && win.line && win.line.includes(i) ? 'win' : ''}" data-i="${i}">${v || ''}</div>`).join('');
  }
  function finish(w) {
    over = true;
    if (w.p === 'draw') { status.textContent = "It's a draw!"; score.d++; }
    else if (w.p === 'X') { status.textContent = '🎉 You win!'; score.x++; }
    else { status.textContent = '🤖 Computer wins!'; score.o++; }
    document.getElementById('score').textContent = `You ${score.x} · Computer ${score.o} · Draws ${score.d}`;
    render(w);
  }
  function computerMove() {
    busy = false;
    if (over) return;
    const empty = board.map((v, i) => v ? -1 : i).filter(i => i >= 0);
    const tryWin = p => { for (const i of empty) { const b = [...board]; b[i] = p; if (winner(b)?.p === p) return i; } return -1; };
    let m = tryWin('O'); if (m < 0) m = tryWin('X');
    if (m < 0 && !board[4]) m = 4;
    if (m < 0) { const corners = [0, 2, 6, 8].filter(i => !board[i]); m = corners.length ? corners[Math.floor(Math.random() * corners.length)] : empty[Math.floor(Math.random() * empty.length)]; }
    board[m] = 'O';
    const w = winner(board);
    if (w) finish(w); else { status.textContent = 'Your turn'; render(); }
  }
  boardEl.addEventListener('click', e => {
    const c = e.target.closest('.cell'); if (!c || over || busy) return;
    const i = +c.dataset.i; if (board[i]) return;
    board[i] = 'X';
    const w = winner(board);
    if (w) return finish(w);
    busy = true;
    status.textContent = 'Computer is thinking…'; render();
    setTimeout(computerMove, 400);
  });
  function reset() { board = Array(9).fill(''); over = false; busy = false; status.textContent = 'Your turn — you are X'; render(); }
  document.getElementById('reset').onclick = reset;
  reset();
</script>
</body>
</html>
