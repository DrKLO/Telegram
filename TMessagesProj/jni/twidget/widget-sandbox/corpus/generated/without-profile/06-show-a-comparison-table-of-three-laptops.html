<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laptop Comparison</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f8fafc; color: #0f172a; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); font-size: 14px; }
  th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #e2e8f0; }
  th { background: #1e293b; color: #fff; cursor: pointer; white-space: nowrap; }
  th:hover { background: #334155; }
  th .arrow { opacity: .4; font-size: 11px; margin-left: 4px; }
  th.active .arrow { opacity: 1; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f1f5f9; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .best { color: #16a34a; font-weight: 600; }
  .hint { font-size: 12px; color: #64748b; margin-top: 8px; }
</style>
</head>
<body>
<h2>💻 Laptop Comparison</h2>
<table id="t">
  <thead><tr>
    <th data-key="name">Model<span class="arrow">↕</span></th>
    <th data-key="price">Price<span class="arrow">↕</span></th>
    <th data-key="weight">Weight<span class="arrow">↕</span></th>
    <th data-key="battery">Battery<span class="arrow">↕</span></th>
    <th data-key="screen">Screen<span class="arrow">↕</span></th>
  </tr></thead>
  <tbody></tbody>
</table>
<p class="hint">Tap a column header to sort. Green = best value in that column.</p>
<script>
  const laptops = [
    { name: 'MacBook Air 13', price: 1099, weight: 1.24, battery: 18, screen: 13.6 },
    { name: 'Dell XPS 13', price: 999, weight: 1.17, battery: 12, screen: 13.4 },
    { name: 'ThinkPad X1 Carbon', price: 1449, weight: 1.12, battery: 15, screen: 14.0 },
  ];
  const lowerIsBetter = { price: true, weight: true, battery: false, screen: false };
  let sortKey = 'price', asc = true;
  const tbody = document.querySelector('tbody');
  function render() {
    const rows = [...laptops].sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      const r = typeof x === 'string' ? x.localeCompare(y) : x - y;
      return asc ? r : -r;
    });
    tbody.innerHTML = rows.map(l => `<tr>
      <td>${l.name}</td>
      <td class="num ${isBest('price', l)}">$${l.price.toLocaleString()}</td>
      <td class="num ${isBest('weight', l)}">${l.weight} kg</td>
      <td class="num ${isBest('battery', l)}">${l.battery} h</td>
      <td class="num ${isBest('screen', l)}">${l.screen}"</td>
    </tr>`).join('');
    document.querySelectorAll('th').forEach(th => {
      th.classList.toggle('active', th.dataset.key === sortKey);
      th.querySelector('.arrow').textContent = th.dataset.key === sortKey ? (asc ? '▲' : '▼') : '↕';
    });
  }
  function isBest(key, l) {
    const vals = laptops.map(x => x[key]);
    const best = lowerIsBetter[key] ? Math.min(...vals) : Math.max(...vals);
    return l[key] === best ? 'best' : '';
  }
  document.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
    if (sortKey === th.dataset.key) asc = !asc; else { sortKey = th.dataset.key; asc = true; }
    render();
  }));
  render();
</script>
</body>
</html>
