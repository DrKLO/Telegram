<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Palette Generator</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fafafa; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .pick { display: flex; gap: 6px; margin-bottom: 8px; }
  .pick button { flex: 1; height: 30px; padding: 0; border: 2px solid #fff; border-radius: 8px; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .pick button.active { border-color: #111; }
  .modes { display: flex; gap: 4px; margin-bottom: 14px; }
  .modes button { flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; color: #111; font-size: 12px; cursor: pointer; }
  .modes button.active { background: #111; color: #fff; border-color: #111; }
  .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .swatch { aspect-ratio: 1 / 1.4; border-radius: 10px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; cursor: pointer; transition: transform .15s; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .swatch:active { transform: scale(.95); }
  .swatch span { font-size: 10px; font-family: ui-monospace, monospace; background: rgba(255,255,255,.85); padding: 2px 4px; border-radius: 4px; }
  .saved { margin-top: 12px; font-size: 12px; color: #6b7280; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 22px; }
  .saved b { font-family: ui-monospace, monospace; font-weight: 400; font-size: 11px; color: #111; padding: 2px 6px 2px 4px; border-radius: 4px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .saved b i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: #111; color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: all .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<h2>🎨 Palette Generator</h2>
<div class="pick" id="base"></div>
<div class="modes" id="mode">
  <button data-mode="analogous" class="active">Analogous</button><button data-mode="mono">Mono</button><button data-mode="complementary">Complement</button><button data-mode="triadic">Triadic</button>
</div>
<div class="palette" id="p"></div>
<div class="saved" id="saved"></div>
<div class="toast" id="toast">Saved!</div>
<script>
  // No colour input, <select> or clipboard in a widget: the base colour and harmony are buttons,
  // and a tapped hex code goes to a "Saved" strip kept in localStorage.
  const bases = ['#3b82f6', '#8b5cf6', '#ec4899', '#ef4444', '#f59e0b', '#10b981', '#14b8a6', '#64748b'];
  let base = bases[0], mode = 'analogous';
  let saved = (() => { try { return JSON.parse(localStorage.getItem('palette-saved') || '[]'); } catch { return []; } })();
  function hexToHsl(hex) {
    let r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b); let h, s, l = (max + min) / 2;
    if (max === min) h = s = 0; else { const d = max - min; s = l > .5 ? d / (2 - max - min) : d / (max + min); h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
    return [h, s * 100, l * 100];
  }
  function hslToHex(h, s, l) {
    s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return '#' + [f(0), f(8), f(4)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('');
  }
  function generate() {
    document.querySelectorAll('#base button').forEach(b => b.classList.toggle('active', b.dataset.c === base));
    document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    const [h, s, l] = hexToHsl(base);
    let shades;
    if (mode === 'analogous') shades = [-40, -20, 0, 20, 40].map(d => [(h + d + 360) % 360, s, l]);
    else if (mode === 'mono') shades = [20, 35, 50, 65, 80].map(L => [h, s, L]);
    else if (mode === 'complementary') shades = [[h, s, l - 15], [h, s, l], [h, s, l + 15], [(h + 180) % 360, s, l], [(h + 180) % 360, s, l + 15]];
    else shades = [[h, s, l], [(h + 120) % 360, s, l], [(h + 240) % 360, s, l], [h, s, l + 20], [(h + 120) % 360, s, l + 20]];
    const p = document.getElementById('p');
    p.innerHTML = shades.map(([H, S, L]) => { const hex = hslToHex(H, Math.max(0, Math.min(100, S)), Math.max(5, Math.min(95, L))); return `<div class="swatch" style="background:${hex}" data-hex="${hex}"><span>${hex}</span></div>`; }).join('');
  }
  function showSaved() {
    document.getElementById('saved').innerHTML = saved.length ? 'Saved: ' + saved.map(h => `<b><i style="background:${h}"></i>${h}</b>`).join('') : 'Tap a swatch to save its hex code';
  }
  document.getElementById('base').innerHTML = bases.map(c => `<button data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('');
  document.getElementById('base').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { base = b.dataset.c; generate(); } });
  document.getElementById('mode').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { mode = b.dataset.mode; generate(); } });
  document.getElementById('p').addEventListener('click', e => {
    const sw = e.target.closest('.swatch'); if (!sw) return;
    saved = [sw.dataset.hex, ...saved.filter(h => h !== sw.dataset.hex)].slice(0, 5);
    try { localStorage.setItem('palette-saved', JSON.stringify(saved)); } catch { }
    showSaved();
    const t = document.getElementById('toast'); t.textContent = sw.dataset.hex + ' saved'; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1200);
  });
  generate();
  showSaved();
</script>
</body>
</html>
