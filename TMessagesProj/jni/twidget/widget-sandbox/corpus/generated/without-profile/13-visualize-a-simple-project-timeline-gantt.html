<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Build Timeline</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111827; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .gantt { display: grid; grid-template-columns: 110px 1fr; row-gap: 6px; font-size: 13px; }
  .head { display: grid; grid-template-columns: repeat(6, 1fr); text-align: center; color: #6b7280; font-size: 11px; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; }
  .label { padding: 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track { position: relative; height: 28px; background: repeating-linear-gradient(90deg, transparent 0 calc(100% / 6 - 1px), #f3f4f6 calc(100% / 6 - 1px) calc(100% / 6)); }
  .bar { position: absolute; top: 4px; height: 20px; border-radius: 6px; color: #fff; font-size: 11px; line-height: 20px; padding-left: 6px; box-sizing: border-box; white-space: nowrap; overflow: hidden; cursor: pointer; transition: transform .15s; }
  .bar:hover { transform: scaleY(1.15); }
  .today { position: absolute; top: 0; bottom: 0; width: 2px; background: #ef4444; }
  .detail { margin-top: 12px; padding: 10px 12px; background: #f9fafb; border-radius: 8px; font-size: 13px; color: #374151; min-height: 36px; }
</style>
</head>
<body>
<h2>🗓️ Website Build — 6 Weeks</h2>
<div class="gantt" id="g"></div>
<div class="detail" id="detail">Tap a bar for details.</div>
<script>
  const tasks = [
    { name: 'Discovery', start: 0, len: 1, color: '#6366f1', desc: 'Kick-off, requirements, sitemap' },
    { name: 'Wireframes', start: 1, len: 1, color: '#8b5cf6', desc: 'Low-fidelity layouts for key pages' },
    { name: 'Visual design', start: 1.5, len: 1.5, color: '#ec4899', desc: 'Style guide, high-fidelity mockups' },
    { name: 'Development', start: 2.5, len: 2.5, color: '#10b981', desc: 'Front-end build, CMS integration' },
    { name: 'Content', start: 3, len: 2, color: '#f59e0b', desc: 'Copywriting, images, SEO' },
    { name: 'QA & launch', start: 5, len: 1, color: '#ef4444', desc: 'Cross-browser testing, go-live' },
  ];
  const g = document.getElementById('g');
  g.innerHTML = '<div></div><div class="head">' + [1, 2, 3, 4, 5, 6].map(w => `<div>W${w}</div>`).join('') + '</div>';
  tasks.forEach(t => {
    g.insertAdjacentHTML('beforeend', `<div class="label">${t.name}</div><div class="track"><div class="bar" style="left:${t.start / 6 * 100}%;width:${t.len / 6 * 100}%;background:${t.color}" data-name="${t.name}">${t.name}</div></div>`);
  });
  g.querySelectorAll('.track').forEach((tr, i) => { if (i === 0) { const d = document.createElement('div'); d.className = 'today'; d.style.left = (2.3 / 6 * 100) + '%'; tr.appendChild(d); } });
  g.addEventListener('click', e => {
    const b = e.target.closest('.bar'); if (!b) return;
    const t = tasks.find(x => x.name === b.dataset.name);
    document.getElementById('detail').innerHTML = `<b>${t.name}</b> · week ${t.start + 1}–${Math.ceil(t.start + t.len)} (${t.len} wk)<br>${t.desc}`;
  });
</script>
</body>
</html>
