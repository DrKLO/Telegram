<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System Quiz</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: linear-gradient(135deg, #0f172a, #1e293b); color: #f1f5f9; }
  .quiz { max-width: 420px; margin: 0 auto; }
  h2 { font-size: 20px; margin: 0 0 4px; }
  .progress { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
  .question { font-size: 17px; font-weight: 600; margin-bottom: 16px; line-height: 1.4; }
  .option { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 10px; background: #334155; border: 2px solid transparent; color: #f1f5f9; border-radius: 10px; font-size: 15px; cursor: pointer; transition: all .2s; }
  .option:hover { background: #475569; }
  .option.correct { border-color: #22c55e; background: #14532d; }
  .option.wrong { border-color: #ef4444; background: #7f1d1d; }
  .option[disabled] { cursor: default; }
  .next { margin-top: 8px; padding: 12px 20px; background: #3b82f6; color: #fff; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; display: none; }
  .score { text-align: center; padding: 30px 0; }
  .score .num { font-size: 56px; font-weight: 700; color: #fbbf24; }
</style>
</head>
<body>
<div class="quiz" id="quiz">
  <h2>🪐 Solar System Quiz</h2>
  <div class="progress" id="progress"></div>
  <div class="question" id="question"></div>
  <div id="options"></div>
  <button class="next" id="next">Next →</button>
</div>
<div class="quiz score" id="result" style="display:none"></div>
<script>
  const questions = [
    { q: 'Which planet is closest to the Sun?', a: ['Venus', 'Mercury', 'Earth', 'Mars'], c: 1 },
    { q: 'Which planet has the most moons?', a: ['Jupiter', 'Saturn', 'Uranus', 'Neptune'], c: 1 },
    { q: 'What is the largest planet?', a: ['Saturn', 'Neptune', 'Jupiter', 'Earth'], c: 2 },
    { q: 'Which planet is known as the Red Planet?', a: ['Mars', 'Venus', 'Mercury', 'Jupiter'], c: 0 },
    { q: 'How many planets are in the Solar System?', a: ['7', '8', '9', '10'], c: 1 },
  ];
  let i = 0, score = 0;
  const qEl = document.getElementById('question'), oEl = document.getElementById('options'), nEl = document.getElementById('next'), pEl = document.getElementById('progress');
  function show() {
    const q = questions[i];
    pEl.textContent = `Question ${i + 1} of ${questions.length}`;
    qEl.textContent = q.q;
    oEl.innerHTML = '';
    nEl.style.display = 'none';
    q.a.forEach((text, idx) => {
      const b = document.createElement('button');
      b.className = 'option';
      b.textContent = text;
      b.onclick = () => {
        [...oEl.children].forEach(x => x.disabled = true);
        if (idx === q.c) { b.classList.add('correct'); score++; }
        else { b.classList.add('wrong'); oEl.children[q.c].classList.add('correct'); }
        nEl.style.display = 'inline-block';
        nEl.textContent = i === questions.length - 1 ? 'See results' : 'Next →';
      };
      oEl.appendChild(b);
    });
  }
  const quiz = document.getElementById('quiz'), result = document.getElementById('result');
  nEl.onclick = () => {
    i++;
    if (i < questions.length) show();
    else {
      // A widget cannot reload itself: "Try again" restarts the quiz in place.
      quiz.style.display = 'none';
      result.style.display = '';
      result.innerHTML = `<div>Your score</div><div class="num">${score}/${questions.length}</div><div>${score === 5 ? '🌟 Perfect!' : score >= 3 ? '👍 Nice work!' : '📚 Keep exploring!'}</div><button class="next" id="again" style="display:inline-block;margin-top:20px">Try again</button>`;
      document.getElementById('again').onclick = () => { i = 0; score = 0; result.style.display = 'none'; quiz.style.display = ''; show(); };
    }
  };
  show();
</script>
</body>
</html>
