<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berlin vs Madrid Temperatures</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; }
  h2 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 12px; font-size: 13px; color: #666; }
  .chart { position: relative; }
  canvas { display: block; width: 100%; height: auto; }
  .legend { display: flex; justify-content: center; gap: 16px; font-size: 12px; color: #666; margin-top: 6px; }
  .legend i { display: inline-block; width: 30px; height: 10px; margin-right: 6px; vertical-align: -1px; border: 2px solid; box-sizing: border-box; }
</style>
</head>
<body>
<h2>🌡️ Monthly Average Temperatures</h2>
<p>Berlin vs Madrid (°C) · tap the chart for a month's values</p>
<div class="chart"><canvas id="c" width="736" height="520"></canvas></div>
<div class="legend"><span><i style="border-color:#2563eb;background:rgba(37,99,235,.15)"></i>Berlin</span><span><i style="border-color:#dc2626;background:rgba(220,38,38,.12)"></i>Madrid</span></div>
<script>
  // Drawn by hand on a 2D canvas: no chart library is available in a widget.
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const datasets = [
    { label: 'Berlin', data: [0.5, 1.5, 5, 10, 15, 18, 20, 19.5, 15, 10, 5, 2], borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,.15)' },
    { label: 'Madrid', data: [6, 8, 11, 13, 17, 23, 26, 25.5, 21, 15, 9.5, 6.5], borderColor: '#dc2626', backgroundColor: 'rgba(220,38,38,.12)' },
  ];
  const W = 368, H = 260, L = 34, R = 10, T = 10, B = 26, MAX = 30, TENSION = 0.35;
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const x = i => L + i * (W - L - R) / (months.length - 1);
  const y = v => T + (MAX - v) * (H - T - B) / MAX;
  function curve(data) {
    const px = i => x(Math.max(0, Math.min(data.length - 1, i))), py = i => y(data[Math.max(0, Math.min(data.length - 1, i))]);
    const k = TENSION / 2;
    ctx.moveTo(px(0), py(0));
    for (let i = 0; i < data.length - 1; i++) {
      ctx.bezierCurveTo(px(i) + (px(i + 1) - px(i - 1)) * k, py(i) + (py(i + 1) - py(i - 1)) * k,
        px(i + 1) - (px(i + 2) - px(i)) * k, py(i + 1) - (py(i + 2) - py(i)) * k, px(i + 1), py(i + 1));
    }
  }
  function draw(pick) {
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillStyle = '#666';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let v = 0; v <= MAX; v += 5) {
      ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(L, y(v) + 0.5); ctx.lineTo(W - R, y(v) + 0.5); ctx.stroke();
      ctx.fillText(v + '°', L - 6, y(v));
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    months.forEach((m, i) => ctx.fillText(m, x(i), H - B + 8));
    for (const d of datasets) {
      ctx.beginPath(); curve(d.data); ctx.lineTo(x(months.length - 1), y(0)); ctx.lineTo(x(0), y(0)); ctx.closePath();
      ctx.fillStyle = d.backgroundColor; ctx.fill();
      ctx.beginPath(); curve(d.data);
      ctx.strokeStyle = d.borderColor; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = d.backgroundColor; ctx.lineWidth = 1;
      d.data.forEach((v, i) => { ctx.beginPath(); ctx.arc(x(i), y(v), 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); });
    }
    if (pick == null) return;
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(x(pick), T); ctx.lineTo(x(pick), H - B); ctx.stroke();
    ctx.setLineDash([]);
    const bw = 116, bh = 52, bx = Math.min(W - R - bw, Math.max(L, x(pick) + (pick > 6 ? -bw - 8 : 8))), by = T + 4;
    ctx.fillStyle = 'rgba(0,0,0,.8)';
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 6); ctx.fill();
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.fillText(months[pick], bx + 8, by + 6);
    ctx.font = '11px system-ui, sans-serif';
    datasets.forEach((d, j) => {
      ctx.fillStyle = d.borderColor; ctx.fillRect(bx + 8, by + 23 + j * 14, 8, 8);
      ctx.fillStyle = '#fff'; ctx.fillText(`${d.label}: ${d.data[pick]}°C`, bx + 21, by + 21 + j * 14);
    });
  }
  canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect();
    const cx = (e.clientX - r.left) / r.width * W;
    draw(Math.max(0, Math.min(months.length - 1, Math.round((cx - L) / ((W - L - R) / (months.length - 1))))));
  });
  draw(null);
</script>
</body>
</html>
