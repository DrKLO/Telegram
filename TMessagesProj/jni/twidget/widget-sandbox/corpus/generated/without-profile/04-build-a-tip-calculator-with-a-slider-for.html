<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tip Calculator</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #ecfdf5; }
  .card { background: #fff; border-radius: 14px; padding: 20px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
  h2 { margin: 0 0 16px; font-size: 18px; color: #065f46; }
  .label { display: flex; justify-content: space-between; font-size: 14px; color: #374151; margin: 12px 0 6px; }
  .bill { display: flex; align-items: center; gap: 6px; border: 1px solid #d1d5db; border-radius: 8px; padding: 3px; }
  .bill span { flex: 1; text-align: center; font-size: 16px; font-variant-numeric: tabular-nums; }
  .bill button { padding: 0 10px; height: 32px; border: none; border-radius: 6px; background: #d1fae5; color: #065f46; font-size: 14px; cursor: pointer; }
  .tips { display: flex; gap: 6px; }
  .tips button { flex: 1; padding: 8px 0; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; color: #374151; font-size: 14px; cursor: pointer; }
  .tips button.active { background: #10b981; border-color: #10b981; color: #fff; }
  .people { display: flex; align-items: center; gap: 12px; }
  .people button { width: 36px; height: 36px; padding: 0; border-radius: 50%; border: none; background: #d1fae5; color: #065f46; font-size: 20px; cursor: pointer; }
  .people span { font-size: 18px; font-weight: 600; min-width: 24px; text-align: center; }
  .out { margin-top: 18px; background: #065f46; color: #fff; border-radius: 10px; padding: 14px; }
  .out div { display: flex; justify-content: space-between; padding: 4px 0; }
  .out .per { font-size: 22px; font-weight: 700; border-top: 1px solid rgba(255,255,255,.3); margin-top: 6px; padding-top: 10px; }
</style>
</head>
<body>
<div class="card">
  <h2>🧾 Tip Calculator</h2>
  <div class="label">Bill amount</div>
  <div class="bill" id="billSteps"><button data-d="-5">−5</button><button data-d="-1">−1</button><span id="bill">$84.50</span><button data-d="1">+1</button><button data-d="5">+5</button></div>
  <div class="label">Tip <span id="tipPct">15%</span></div>
  <div class="tips" id="tips"><button data-p="0">0%</button><button data-p="10">10%</button><button data-p="15">15%</button><button data-p="18">18%</button><button data-p="20">20%</button><button data-p="25">25%</button></div>
  <div class="label">Split between</div>
  <div class="people">
    <button id="minus">−</button><span id="people">2</span><button id="plus">+</button>
    <span style="font-size:14px;color:#6b7280;font-weight:400">people</span>
  </div>
  <div class="out">
    <div><span>Tip</span><span id="tipAmt">$0.00</span></div>
    <div><span>Total</span><span id="total">$0.00</span></div>
    <div class="per"><span>Each pays</span><span id="each">$0.00</span></div>
  </div>
</div>
<script>
  // Taps only: the bill has − / + buttons and the tip is a row of presets (no number field or slider).
  let people = 2, bill = 84.5, pct = 15;
  const el = id => document.getElementById(id);
  const money = n => '$' + n.toFixed(2);
  function update() {
    el('bill').textContent = money(bill);
    document.querySelectorAll('#tips button').forEach(b => b.classList.toggle('active', +b.dataset.p === pct));
    el('tipPct').textContent = pct + '%';
    el('people').textContent = people;
    const tip = bill * pct / 100, total = bill + tip;
    el('tipAmt').textContent = money(tip);
    el('total').textContent = money(total);
    el('each').textContent = money(total / people);
  }
  el('billSteps').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { bill = Math.max(0, Math.round((bill + +b.dataset.d) * 100) / 100); update(); } });
  el('tips').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { pct = +b.dataset.p; update(); } });
  el('minus').addEventListener('click', () => { if (people > 1) people--; update(); });
  el('plus').addEventListener('click', () => { if (people < 20) people++; update(); });
  update();
</script>
</body>
</html>
