<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f3f4f6; }
  .card { background: #fff; border-radius: 12px; padding: 18px; max-width: 400px; margin: 0 auto; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  h2 { margin: 0 0 14px; font-size: 18px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tabs button { flex: 1; padding: 8px; border: 1px solid #d1d5db; background: #fff; color: #111; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .tabs button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .row { border: 1px solid #d1d5db; border-radius: 8px; padding: 8px; }
  .value { display: flex; align-items: center; gap: 6px; }
  .value span { flex: 1; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; padding: 4px 0; }
  .value button { padding: 0 9px; height: 30px; border: none; border-radius: 6px; background: #eff6ff; color: #2563eb; font-size: 13px; cursor: pointer; }
  .units { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .units button { flex: 1; min-width: 36px; padding: 5px 0; border: 1px solid #e5e7eb; background: #fff; color: #111; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .units button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .swap { text-align: center; margin: 4px 0; }
  .swap button { background: none; border: none; padding: 2px 10px; font-size: 22px; cursor: pointer; }
  .out { font-size: 14px; color: #6b7280; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<div class="card">
  <h2>🔄 Unit Converter</h2>
  <div class="tabs"><button class="active" data-c="length">Length</button><button data-c="weight">Weight</button><button data-c="temperature">Temperature</button></div>
  <div class="row">
    <div class="value" id="steps"><button data-d="-10">−10</button><button data-d="-1">−1</button><span id="from">1</span><button data-d="1">+1</button><button data-d="10">+10</button></div>
    <div class="units" id="fromU"></div>
  </div>
  <div class="swap"><button id="swap" title="Swap">⇅</button></div>
  <div class="row">
    <div class="value"><span id="to"></span></div>
    <div class="units" id="toU"></div>
  </div>
  <div class="out" id="formula"></div>
</div>
<script>
  // Taps only: a stepper for the value and rows of unit buttons (no number field or <select>).
  const units = {
    length: { m: 1, km: 1000, cm: 0.01, mm: 0.001, mi: 1609.344, yd: 0.9144, ft: 0.3048, in: 0.0254 },
    weight: { kg: 1, g: 0.001, mg: 1e-6, t: 1000, lb: 0.45359237, oz: 0.028349523 },
    temperature: { '°C': 1, '°F': 1, K: 1 },
  };
  let cat = 'length', value = 1, a, b;
  const $ = id => document.getElementById(id);
  const chips = (el, sel) => { el.innerHTML = Object.keys(units[cat]).map(k => `<button data-u="${k}" class="${k === sel ? 'active' : ''}">${k}</button>`).join(''); };
  function fill() {
    [a, b] = Object.keys(units[cat]);
    convert();
  }
  function toC(v, u) { return u === '°C' ? v : u === '°F' ? (v - 32) * 5 / 9 : v - 273.15; }
  function fromC(v, u) { return u === '°C' ? v : u === '°F' ? v * 9 / 5 + 32 : v + 273.15; }
  function convert() {
    chips($('fromU'), a); chips($('toU'), b);
    const r = cat === 'temperature' ? fromC(toC(value, a), b) : value * units[cat][a] / units[cat][b];
    $('from').textContent = value;
    $('to').textContent = +r.toPrecision(8);
    $('formula').textContent = `${value} ${a} = ${+r.toPrecision(6)} ${b}`;
  }
  document.querySelectorAll('.tabs button').forEach(t => t.onclick = () => { cat = t.dataset.c; document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === t)); fill(); });
  $('steps').addEventListener('click', e => { const s = e.target.closest('button'); if (s) { value = Math.round((value + +s.dataset.d) * 1000) / 1000; convert(); } });
  $('fromU').addEventListener('click', e => { const u = e.target.closest('button'); if (u) { a = u.dataset.u; convert(); } });
  $('toU').addEventListener('click', e => { const u = e.target.closest('button'); if (u) { b = u.dataset.u; convert(); } });
  $('swap').onclick = () => { [a, b] = [b, a]; convert(); };
  fill();
</script>
</body>
</html>
