<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Converter</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #eff6ff; }
  .card { background: #fff; border-radius: 12px; padding: 18px; max-width: 400px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  h2 { margin: 0 0 14px; font-size: 18px; }
  .row { border: 1px solid #d1d5db; border-radius: 8px; padding: 8px; }
  .amt { display: flex; align-items: center; gap: 6px; }
  .amt span { flex: 1; text-align: center; font-size: 17px; font-variant-numeric: tabular-nums; padding: 4px 0; }
  .amt button { padding: 0 9px; height: 30px; border: none; border-radius: 6px; background: #dbeafe; color: #1e3a8a; font-size: 13px; cursor: pointer; }
  .cur { display: flex; gap: 4px; margin-top: 6px; }
  .cur button { flex: 1; padding: 5px 0; border: 1px solid #e5e7eb; border-radius: 6px; background: #fff; color: #111; font-size: 13px; cursor: pointer; }
  .cur button.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  .swap { text-align: center; margin: 6px 0; }
  .swap button { background: #dbeafe; border: none; border-radius: 50%; width: 36px; height: 36px; padding: 0; font-size: 18px; cursor: pointer; }
  .rate { font-size: 13px; color: #6b7280; text-align: center; margin-top: 10px; }
  details { margin-top: 14px; font-size: 13px; }
  summary { cursor: pointer; color: #2563eb; }
  .rates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .rates .lbl { display: block; font-size: 12px; color: #6b7280; margin-bottom: 2px; }
  .rates .step { display: flex; align-items: center; border: 1px solid #d1d5db; border-radius: 6px; }
  .rates .step span { flex: 1; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; }
  .rates .step button { width: 28px; height: 28px; padding: 0; border: none; background: none; color: #2563eb; font-size: 16px; cursor: pointer; }
  .updated { font-size: 11px; color: #9ca3af; margin-top: 8px; }
</style>
</head>
<body>
<div class="card">
  <h2>💱 Currency Converter</h2>
  <div class="row">
    <div class="amt" id="amtSteps"><button data-d="-10">−10</button><button data-d="-1">−1</button><span id="amt"></span><button data-d="1">+1</button><button data-d="10">+10</button></div>
    <div class="cur" id="from"></div>
  </div>
  <div class="swap"><button id="swap">⇅</button></div>
  <div class="row">
    <div class="amt"><span id="out"></span></div>
    <div class="cur" id="to"></div>
  </div>
  <div class="rate" id="rate"></div>
  <details>
    <summary>Edit rates (per 1 USD)</summary>
    <div class="rates" id="rates"></div>
    <div class="updated" id="updated">Using built-in rates (a widget has no network access)</div>
  </details>
</div>
<script>
  // Taps only (no text fields or <select>): steppers for the amount and the rates, a row of
  // currency buttons per side. No live rates: a widget cannot fetch anything.
  const codes = ['USD', 'EUR', 'GBP', 'JPY'];
  const rates = { USD: 1, EUR: 0.92, GBP: 0.79, JPY: 149.5 };
  const steps = { EUR: 0.01, GBP: 0.01, JPY: 0.5 };
  const symbols = { USD: '$', EUR: '€', GBP: '£', JPY: '¥' };
  let amt = 100, from = 'USD', to = 'EUR';
  const $ = id => document.getElementById(id);
  const money = (v, c) => symbols[c] + v.toLocaleString('en-US', { minimumFractionDigits: c === 'JPY' ? 0 : 2, maximumFractionDigits: c === 'JPY' ? 0 : 2 });
  const chips = (el, sel) => { el.innerHTML = codes.map(c => `<button data-c="${c}" class="${c === sel ? 'active' : ''}">${c}</button>`).join(''); };
  function convert() {
    chips($('from'), from); chips($('to'), to);
    const r = rates[to] / rates[from];
    $('amt').textContent = money(amt, from);
    $('out').textContent = money(amt * r, to);
    $('rate').textContent = `1 ${from} = ${r.toFixed(4)} ${to}`;
    $('rates').innerHTML = ['EUR', 'GBP', 'JPY'].map(c => `<div><span class="lbl">${c}</span><div class="step" data-c="${c}"><button data-d="-1">−</button><span>${rates[c].toFixed(c === 'JPY' ? 1 : 2)}</span><button data-d="1">+</button></div></div>`).join('');
  }
  $('amtSteps').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { amt = Math.max(0, amt + +b.dataset.d); convert(); } });
  $('from').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { from = b.dataset.c; convert(); } });
  $('to').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { to = b.dataset.c; convert(); } });
  $('rates').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const c = b.closest('.step').dataset.c;
    rates[c] = Math.max(steps[c], Math.round((rates[c] + steps[c] * +b.dataset.d) * 100) / 100);
    $('updated').textContent = 'Rates edited ' + new Date().toLocaleTimeString('en-US');
    convert();
  });
  $('swap').onclick = () => { [from, to] = [to, from]; convert(); };
  convert();
</script>
</body>
</html>
