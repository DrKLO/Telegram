<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Budget</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .wrap { position: relative; width: 100%; max-width: 420px; margin: 0 auto; text-align: center; }
  canvas { width: 220px; height: 220px; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: #444; }
  .legend span { cursor: pointer; }
  .legend i { display: inline-block; width: 28px; height: 10px; margin-right: 5px; vertical-align: -1px; border: 2px solid #fff; box-sizing: border-box; }
  .total { text-align: center; font-size: 14px; color: #555; margin-top: 10px; min-height: 22px; }
  .total b { color: #111; font-size: 18px; }
</style>
</head>
<body>
<h2>💰 Weekly Budget</h2>
<div class="wrap"><canvas id="budget" width="440" height="440"></canvas><div class="legend" id="legend"></div></div>
<div class="total" id="total">Total: <b>$2,450</b> / week</div>
<script>
  // Drawn by hand on a 2D canvas: no chart library is available in a widget.
  const data = { Rent: 1200, Groceries: 450, Transport: 180, Entertainment: 220, Savings: 400 };
  const colors = ['#6366f1', '#22c55e', '#f59e0b', '#ec4899', '#06b6d4'];
  const labels = Object.keys(data), values = Object.values(data);
  const total = values.reduce((a, b) => a + b, 0);
  const canvas = document.getElementById('budget'), ctx = canvas.getContext('2d');
  let picked = -1;
  function draw() {
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.clearRect(0, 0, 220, 220);
    let a = -Math.PI / 2;
    values.forEach((v, i) => {
      const b = a + v / total * Math.PI * 2;
      const r = i === picked ? 106 : 100;
      ctx.beginPath();
      ctx.arc(110, 110, r, a, b);
      ctx.arc(110, 110, 52, b, a, true);
      ctx.closePath();
      ctx.globalAlpha = picked < 0 || picked === i ? 1 : 0.45;
      ctx.fillStyle = colors[i];
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
      a = b;
    });
  }
  function pick(i) {
    picked = i;
    draw();
    document.getElementById('total').innerHTML = `${labels[i]}: <b>$${values[i]}</b> (${Math.round(values[i] / total * 100)}%)`;
  }
  document.getElementById('legend').innerHTML = labels.map((l, i) => `<span data-i="${i}"><i style="background:${colors[i]}"></i>${l}</span>`).join('');
  document.getElementById('legend').addEventListener('click', e => { const s = e.target.closest('[data-i]'); if (s) pick(+s.dataset.i); });
  canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 220 - 110, y = (e.clientY - r.top) / r.height * 220 - 110;
    const d = Math.hypot(x, y); if (d < 52 || d > 106) return;
    let ang = Math.atan2(y, x) + Math.PI / 2; if (ang < 0) ang += Math.PI * 2;
    let acc = 0;
    for (let i = 0; i < values.length; i++) { acc += values[i] / total * Math.PI * 2; if (ang <= acc) return pick(i); }
  });
  draw();
</script>
</body>
</html>
