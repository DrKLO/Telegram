<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #111827; --muted: #6b7280; --line: #d1d5db; --accent: #2563eb; --soft: #eff6ff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #f3f4f6; --muted: #9ca3af; --line: #374151; --accent: #60a5fa; --soft: #1e293b; } }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); }
  h2 { margin: 0 0 12px; font-size: 17px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button { flex: 1; padding: 8px; border: 1px solid var(--line); background: transparent; color: inherit; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .box { border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .value { display: flex; align-items: center; gap: 6px; }
  .value span { flex: 1; text-align: center; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 4px 0; overflow-wrap: anywhere; }
  .value button { padding: 0 9px; height: 32px; border: none; border-radius: 6px; background: var(--soft); color: var(--accent); font-size: 13px; cursor: pointer; }
  .units { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .units button { flex: 1; min-width: 38px; padding: 5px 0; border: 1px solid var(--line); background: transparent; color: inherit; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .units button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .swap { text-align: center; margin: 2px 0; }
  .swap button { background: none; border: none; padding: 2px 10px; font-size: 22px; cursor: pointer; color: var(--accent); }
  .out { font-size: 14px; color: var(--muted); text-align: center; margin-top: 8px; min-height: 18px; }
</style>
</head>
<body>
<h2>🔄 Unit Converter</h2>
<div class="tabs"><button class="active" data-c="length" id="tab-length">Length</button><button data-c="weight" id="tab-weight">Weight</button><button data-c="temperature" id="tab-temp">Temperature</button></div>
<div class="box">
  <div class="value"><button data-d="-10">−10</button><button data-d="-1">−1</button><span id="from">1</span><button data-d="1">+1</button><button data-d="10">+10</button></div>
  <div class="units" id="fromU"></div>
</div>
<div class="swap"><button id="swap" title="Swap units">⇅</button></div>
<div class="box">
  <div class="value"><span id="to"></span></div>
  <div class="units" id="toU"></div>
</div>
<div class="out" id="formula"></div>
<script>
  // Taps only: the value has steppers and the units are rows of buttons (no text fields or <select> in a widget).
  var units = {
    length: { m: 1, km: 1000, cm: 0.01, mm: 0.001, mi: 1609.344, yd: 0.9144, ft: 0.3048, 'in': 0.0254 },
    weight: { kg: 1, g: 0.001, mg: 1e-6, t: 1000, lb: 0.45359237, oz: 0.028349523 },
    temperature: { '°C': 1, '°F': 1, K: 1 },
  };
  var cat = 'length', value = 1, a = 'm', b = 'km';
  var $ = function (id) { return document.getElementById(id); };
  function chips(el, sel) {
    el.innerHTML = Object.keys(units[cat]).map(function (k) { return '<button data-u="' + k + '"' + (k === sel ? ' class="on"' : '') + '>' + k + '</button>'; }).join('');
  }
  function fill() {
    var keys = Object.keys(units[cat]);
    a = keys[0]; b = keys[1];
    convert();
  }
  function toC(v, u) { return u === '°C' ? v : u === '°F' ? (v - 32) * 5 / 9 : v - 273.15; }
  function fromC(v, u) { return u === '°C' ? v : u === '°F' ? v * 9 / 5 + 32 : v + 273.15; }
  function convert() {
    chips($('fromU'), a); chips($('toU'), b);
    var r = cat === 'temperature' ? fromC(toC(value, a), b) : value * units[cat][a] / units[cat][b];
    $('from').textContent = value;
    $('to').textContent = +r.toPrecision(8);
    $('formula').textContent = value + ' ' + a + ' = ' + (+r.toPrecision(6)) + ' ' + b;
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (t) {
    t.onclick = function () { cat = t.getAttribute('data-c'); Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (x) { x.classList.toggle('active', x === t); }); fill(); };
  });
  document.querySelector('.value').addEventListener('click', function (e) { var s = e.target.closest('button'); if (s) { value = Math.round((value + +s.getAttribute('data-d')) * 1000) / 1000; convert(); } });
  $('fromU').addEventListener('click', function (e) { var u = e.target.closest('button'); if (u) { a = u.getAttribute('data-u'); convert(); } });
  $('toU').addEventListener('click', function (e) { var u = e.target.closest('button'); if (u) { b = u.getAttribute('data-u'); convert(); } });
  $('swap').onclick = function () { var t = a; a = b; b = t; convert(); };
  fill();
</script>
</body>
</html>
