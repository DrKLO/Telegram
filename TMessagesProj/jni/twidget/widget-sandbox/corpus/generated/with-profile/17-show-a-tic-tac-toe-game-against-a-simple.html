<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #111827; --muted: #6b7280; --cell: #f0fdf4; --line: #bbf7d0; --hover: #dcfce7; --x: #16a34a; --o: #ea580c; --btn: #16a34a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #f3f4f6; --muted: #9ca3af; --cell: #1f2937; --line: #166534; --hover: #14532d; --x: #4ade80; --o: #fb923c; --btn: #15803d; } }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); text-align: center; }
  h2 { font-size: 17px; margin: 0 0 6px; }
  .status { font-size: 15px; color: var(--muted); margin-bottom: 12px; min-height: 22px; }
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 290px; margin: 0 auto; }
  .cell { aspect-ratio: 1; background: var(--cell); border: 2px solid var(--line); border-radius: 12px; font-size: 42px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; color: var(--fg); }
  .cell:hover { background: var(--hover); }
  .cell.x { color: var(--x); } .cell.o { color: var(--o); }
  .cell.win { background: var(--hover); }
  .reset { margin-top: 14px; padding: 10px 20px; background: var(--btn); color: #fff; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; }
  .score { margin-top: 10px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<h2>❌⭕ Tic-Tac-Toe</h2>
<div class="status" id="status">Your turn — you are X</div>
<div class="board" id="board"></div>
<button class="reset" id="reset">New game</button>
<div class="score" id="score">You 0 · Computer 0 · Draws 0</div>
<script>
  var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  // The running score is kept in this message's localStorage (restored when the widget is re-created).
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  var board, over, busy = false, score = store.get('ttt-score') || { x: 0, o: 0, d: 0 };
  function showScore() { document.getElementById('score').textContent = 'You ' + score.x + ' · Computer ' + score.o + ' · Draws ' + score.d; }
  var boardEl = document.getElementById('board'), status = document.getElementById('status');
  function winner(b) {
    for (var k = 0; k < LINES.length; k++) { var l = LINES[k]; if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { p: b[l[0]], line: l }; }
    return b.every(Boolean) ? { p: 'draw' } : null;
  }
  function render(win) {
    boardEl.innerHTML = board.map(function (v, i) { return '<button class="cell ' + (v ? v.toLowerCase() : '') + (win && win.line && win.line.indexOf(i) >= 0 ? ' win' : '') + '" id="cell-' + i + '">' + (v || '') + '</button>'; }).join('');
  }
  function finish(w) {
    over = true;
    if (w.p === 'draw') { status.textContent = "It's a draw!"; score.d++; }
    else if (w.p === 'X') { status.textContent = '🎉 You win!'; score.x++; }
    else { status.textContent = '🤖 Computer wins!'; score.o++; }
    store.set('ttt-score', score);
    showScore();
    render(w);
  }
  var rnd = function (n) { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  function computerMove() {
    busy = false;
    if (over) return;
    var empty = board.map(function (v, i) { return v ? -1 : i; }).filter(function (i) { return i >= 0; });
    var tryWin = function (p) { for (var k = 0; k < empty.length; k++) { var b = board.slice(); b[empty[k]] = p; var w = winner(b); if (w && w.p === p) return empty[k]; } return -1; };
    var m = tryWin('O'); if (m < 0) m = tryWin('X');
    if (m < 0 && !board[4]) m = 4;
    if (m < 0) { var corners = [0, 2, 6, 8].filter(function (i) { return !board[i]; }); m = corners.length ? corners[rnd(corners.length)] : empty[rnd(empty.length)]; }
    board[m] = 'O';
    var w = winner(board);
    if (w) finish(w); else { status.textContent = 'Your turn'; render(); }
  }
  boardEl.addEventListener('click', function (e) {
    var c = e.target.closest('.cell'); if (!c || over || busy) return;
    var i = +c.id.split('-')[1]; if (board[i]) return;
    board[i] = 'X';
    var w = winner(board);
    if (w) return finish(w);
    busy = true;
    status.textContent = 'Computer is thinking…'; render();
    setTimeout(computerMove, 350);
  });
  function reset() { board = ['', '', '', '', '', '', '', '', '']; over = false; busy = false; status.textContent = 'Your turn — you are X'; render(); }
  document.getElementById('reset').onclick = reset;
  showScore();
  reset();
</script>
</body>
</html>
