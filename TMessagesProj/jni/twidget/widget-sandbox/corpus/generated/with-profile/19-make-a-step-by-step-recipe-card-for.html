<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pancake Recipe</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1f2937; --muted: #6b7280; --accent: #ea580c; --line: #fed7aa; --hero1: #fdba74; --hero2: #f97316; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #f3f4f6; --muted: #9ca3af; --accent: #fb923c; --line: #7c2d12; --hero1: #9a3412; --hero2: #c2410c; } }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: var(--bg); color: var(--fg); }
  .hero { height: 90px; border-radius: 14px; background: linear-gradient(135deg, var(--hero1), var(--hero2)); display: flex; align-items: flex-end; padding: 12px; color: #fff; font-size: 22px; font-weight: 700; box-sizing: border-box; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); margin: 14px 0 6px; display: flex; justify-content: space-between; }
  h3 small { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); }
  .ing { display: flex; flex-wrap: wrap; gap: 6px; }
  .ing button { display: flex; align-items: center; gap: 6px; padding: 5px 9px 5px 6px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: inherit; font-size: 13px; cursor: pointer; }
  .ing button i { width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 4px; font-style: normal; font-size: 11px; line-height: 14px; text-align: center; color: #fff; }
  .ing button.checked { color: var(--muted); text-decoration: line-through; }
  .ing button.checked i { background: var(--accent); }
  .step { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; min-height: 64px; }
  .step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; font-size: 13px; }
  .step .t { flex: 1; }
  .timer { margin-top: 6px; display: flex; align-items: center; gap: 8px; }
  .timer button { padding: 4px 10px; border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 6px; font-size: 12px; cursor: pointer; }
  .timer button.running { background: var(--accent); color: #fff; }
  .timer span { font-family: ui-monospace, monospace; font-size: 13px; }
  .nav { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
  .nav button { padding: 7px 14px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 13px; cursor: pointer; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--accent); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="hero">🥞 Fluffy Pancakes</div>
<div class="meta">⏱ 25 min · 🍽 Serves 4 · 🔥 Easy</div>
<h3>Ingredients <small id="have"></small></h3>
<div class="ing" id="ing"></div>
<h3>Steps <small id="stepOf"></small></h3>
<div id="step"></div>
<div class="nav"><button id="prev">← Back</button><div class="dots" id="dots"></div><button id="next">Next →</button></div>
<script>
  // Ingredient check-offs are toggle buttons (no checkboxes in a widget); the steps are shown one
  // at a time. Checks, the current step and finished timers stay in this message's localStorage.
  var ingredients = ['1½ cups flour', '3½ tsp baking powder', '1 tbsp sugar', '¼ tsp salt', '1¼ cups milk', '1 egg', '3 tbsp melted butter'];
  var steps = [
    { t: 'Whisk flour, baking powder, sugar and salt in a large bowl.', m: 0 },
    { t: 'Add milk, egg and melted butter; stir until just combined (lumps are fine).', m: 0 },
    { t: 'Let the batter rest.', m: 5 },
    { t: 'Heat a lightly oiled pan over medium heat.', m: 2 },
    { t: 'Pour ¼ cup batter per pancake; cook until bubbles form, then flip.', m: 2 },
    { t: 'Cook the other side until golden. Repeat with remaining batter.', m: 1 },
  ];
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  var st = store.get('pancakes') || {};
  var checked = st.checked || [], cur = Math.min(Math.max(0, st.step | 0), steps.length - 1), done = st.done || [];
  var timers = steps.map(function (x) { return { left: 0, iv: null }; });
  function save() { store.set('pancakes', { checked: checked, step: cur, done: done }); }
  function renderIng() {
    document.getElementById('ing').innerHTML = ingredients.map(function (x, k) { var on = checked.indexOf(k) >= 0; return '<button id="ing-' + k + '"' + (on ? ' class="checked"' : '') + '><i>' + (on ? '✓' : '') + '</i>' + x + '</button>'; }).join('');
    document.getElementById('have').textContent = checked.length + ' / ' + ingredients.length + ' ready';
  }
  function clock(t) { return Math.floor(t.left / 60) + ':' + (t.left % 60 < 10 ? '0' : '') + (t.left % 60); }
  function renderStep() {
    var s = steps[cur], t = timers[cur], label = t.iv ? '■ Stop' : done.indexOf(cur) >= 0 ? '✓ Done' : '▶ ' + s.m + ' min';
    document.getElementById('step').innerHTML = '<div class="step"><div class="n">' + (cur + 1) + '</div><div class="t">' + s.t +
      (s.m ? '<div class="timer"><button id="timer"' + (t.iv ? ' class="running"' : '') + '>' + label + '</button><span id="left">' + (t.iv ? clock(t) : '') + '</span></div>' : '') + '</div></div>';
    document.getElementById('stepOf').textContent = 'Step ' + (cur + 1) + ' of ' + steps.length;
    document.getElementById('dots').innerHTML = steps.map(function (x, k) { return '<i' + (k === cur ? ' class="on"' : '') + '></i>'; }).join('');
    document.getElementById('prev').disabled = cur === 0;
    document.getElementById('next').disabled = cur === steps.length - 1;
  }
  document.getElementById('ing').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var k = +b.id.split('-')[1], at = checked.indexOf(k);
    if (at >= 0) checked.splice(at, 1); else checked.push(k);
    save(); renderIng();
  });
  document.getElementById('step').addEventListener('click', function (e) {
    if (!e.target.closest('#timer')) return;
    var i = cur, t = timers[i];
    if (t.iv) { clearInterval(t.iv); t.iv = null; renderStep(); return; }
    t.left = steps[i].m * 60;
    t.iv = setInterval(function () {
      t.left--;
      if (t.left <= 0) { clearInterval(t.iv); t.iv = null; if (done.indexOf(i) < 0) done.push(i); save(); if (cur === i) renderStep(); return; }
      if (cur === i) document.getElementById('left').textContent = clock(t);
    }, 1000);
    renderStep();
  });
  document.getElementById('prev').onclick = function () { if (cur > 0) { cur--; save(); renderStep(); } };
  document.getElementById('next').onclick = function () { if (cur < steps.length - 1) { cur++; save(); renderStep(); } };
  renderIng();
  renderStep();
</script>
</body>
</html>
