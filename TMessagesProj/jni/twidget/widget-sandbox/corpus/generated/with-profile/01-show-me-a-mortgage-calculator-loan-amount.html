<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mortgage Calculator</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1f2937; --muted: #6b7280; --line: #d1d5db; --accent: #4338ca; --panel: #eef2ff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f2937; --fg: #f3f4f6; --muted: #9ca3af; --line: #4b5563; --accent: #a5b4fc; --panel: #312e81; } }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); }
  h2 { margin: 0 0 12px; font-size: 17px; }
  .label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 3px; margin-bottom: 12px; }
  .stepper span { flex: 1; text-align: center; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stepper button { width: 38px; height: 32px; padding: 0; border: none; border-radius: 6px; background: var(--panel); color: var(--accent); font-size: 20px; cursor: pointer; }
  .seg { display: flex; gap: 6px; margin-bottom: 12px; }
  .seg button { flex: 1; padding: 8px 0; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font-size: 14px; cursor: pointer; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .result { background: var(--panel); border-radius: 10px; padding: 14px; }
  .big { font-size: 26px; font-weight: 600; color: var(--accent); }
  .row { display: flex; justify-content: space-between; font-size: 14px; margin-top: 6px; }
  .save { margin-top: 12px; width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--accent); color: var(--bg); font-size: 14px; cursor: pointer; }
  .saved { margin-top: 8px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<h2>🏠 Mortgage Calculator</h2>
<div class="label">Loan amount</div>
<div class="stepper"><button id="amount-dec" aria-label="less">−</button><span id="amount">$300,000</span><button id="amount-inc" aria-label="more">+</button></div>
<div class="label">Interest rate</div>
<div class="stepper"><button id="rate-dec" aria-label="lower">−</button><span id="rate">6.50%</span><button id="rate-inc" aria-label="higher">+</button></div>
<div class="label">Term</div>
<div class="seg" id="years">
  <button data-y="10">10 yr</button><button data-y="15">15 yr</button><button data-y="20">20 yr</button><button data-y="25">25 yr</button><button data-y="30">30 yr</button>
</div>
<div class="result">
  <div style="font-size:13px;color:var(--muted)">Monthly payment</div>
  <div class="big" id="monthly">$0</div>
  <div class="row"><span>Total paid</span><strong id="total">$0</strong></div>
  <div class="row"><span>Total interest</span><strong id="interest">$0</strong></div>
</div>
<button class="save" id="save">Save this estimate</button>
<div class="saved" id="saved" hidden></div>
<script>
  // No text fields or sliders in a widget: steppers and presets set the values. A saved
  // estimate stays in this message's localStorage and comes back when the widget is re-created.
  var $ = function (id) { return document.getElementById(id); };
  var fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  var P = 300000, rate = 6.5, years = 30, last = {};
  function calc() {
    var r = rate / 100 / 12, n = years * 12;
    var m = r === 0 ? P / n : P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
    last = { P: P, rate: rate, years: years, m: m, interest: m * n - P };
    $('amount').textContent = fmt.format(P);
    $('rate').textContent = rate.toFixed(2) + '%';
    Array.prototype.forEach.call(document.querySelectorAll('#years button'), function (b) { b.classList.toggle('on', +b.getAttribute('data-y') === years); });
    $('monthly').textContent = fmt.format(m);
    $('total').textContent = fmt.format(m * n);
    $('interest').textContent = fmt.format(m * n - P);
  }
  function showSaved(s) {
    $('saved').hidden = !s;
    if (s) $('saved').textContent = 'Saved: ' + fmt.format(s.P) + ' at ' + s.rate.toFixed(2) + '% over ' + s.years + ' years → ' + fmt.format(s.m) + '/month, ' + fmt.format(s.interest) + ' interest';
  }
  $('amount-dec').onclick = function () { P = Math.max(10000, P - 10000); calc(); };
  $('amount-inc').onclick = function () { P = Math.min(2000000, P + 10000); calc(); };
  $('rate-dec').onclick = function () { rate = Math.max(0.5, Math.round((rate - 0.25) * 100) / 100); calc(); };
  $('rate-inc').onclick = function () { rate = Math.min(15, Math.round((rate + 0.25) * 100) / 100); calc(); };
  $('years').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { years = +b.getAttribute('data-y'); calc(); } });
  $('save').addEventListener('click', function () { store.set('mortgage-estimate', last); showSaved(last); });
  var saved = store.get('mortgage-estimate');
  if (saved && typeof saved.m !== 'number') saved = null;
  if (saved) { P = saved.P; rate = saved.rate; years = saved.years; }
  calc();
  showSaved(saved);
  if (window.TelegramWidget) TelegramWidget.ready();
</script>
</body>
</html>
