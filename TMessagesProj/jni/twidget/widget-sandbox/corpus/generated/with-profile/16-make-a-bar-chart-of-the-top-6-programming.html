<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Programming Languages</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #111; --muted: #6b7280; --track: #f3f4f6; --tick: #374151; --grid: #e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #f3f4f6; --muted: #9ca3af; --track: #1f2937; --tick: #d1d5db; --grid: #374151; } }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); }
  h2 { font-size: 17px; margin: 0 0 2px; }
  p { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  svg { display: block; width: 100%; height: auto; }
  .grid line { stroke: var(--grid); }
  .axis text { fill: var(--tick); font-size: 11px; }
  .bar { cursor: pointer; transition: opacity .15s; }
  svg.picked .bar { opacity: .4; }
  svg.picked .bar.on { opacity: 1; }
  .tip { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 16px; }
</style>
</head>
<body>
<h2>📊 Top 6 Programming Languages</h2>
<p>Share of developers using each language (illustrative) · tap a bar</p>
<svg id="chart" viewBox="0 0 372 250" role="img" aria-label="Bar chart of programming language popularity"></svg>
<div class="tip" id="tip"></div>
<script>
  // Drawn by hand with inline SVG: no chart library is bundled in a widget.
  var langs = [['JavaScript', 62, '#f7df1e', 'Web, Node.js'], ['Python', 51, '#3776ab', 'Data science, AI'], ['Java', 30, '#e76f00', 'Enterprise, Android'], ['TypeScript', 38, '#3178c6', 'Typed JavaScript'], ['C#', 27, '#68217a', '.NET, Unity'], ['Go', 14, '#00add8', 'Cloud, backend']];
  var svg = document.getElementById('chart'), NS = 'http://www.w3.org/2000/svg';
  var L = 76, R = 12, T = 6, B = 24, W = 372, H = 250, MAX = 70;
  var x = function (v) { return L + v / MAX * (W - L - R); };
  var row = (H - T - B) / langs.length;
  function el(tag, attrs, parent, text) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; (parent || svg).appendChild(e); return e; }
  var grid = el('g', { 'class': 'grid' }), axis = el('g', { 'class': 'axis' });
  for (var v = 0; v <= MAX; v += 10) {
    el('line', { x1: x(v), x2: x(v), y1: T, y2: H - B }, grid);
    el('text', { x: x(v), y: H - 8, 'text-anchor': 'middle' }, axis, v + '%');
  }
  langs.forEach(function (l, i) {
    var y = T + i * row + row * 0.18, h = row * 0.64;
    el('text', { x: L - 8, y: y + h / 2 + 4, 'text-anchor': 'end' }, axis, l[0]);
    el('rect', { 'class': 'bar', x: L, y: y.toFixed(1), width: (x(l[1]) - L).toFixed(1), height: h.toFixed(1), rx: 6, fill: l[2], 'data-i': i });
  });
  svg.addEventListener('click', function (e) {
    var b = e.target.closest('.bar'); if (!b) return;
    var i = +b.getAttribute('data-i');
    svg.classList.add('picked');
    Array.prototype.forEach.call(svg.querySelectorAll('.bar'), function (x) { x.classList.toggle('on', x === b); });
    document.getElementById('tip').textContent = langs[i][0] + ': ' + langs[i][1] + '% of developers · ' + langs[i][3];
  });
</script>
</body>
</html>
