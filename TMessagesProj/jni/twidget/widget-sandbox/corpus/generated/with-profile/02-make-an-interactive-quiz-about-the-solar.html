<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System Quiz</title>
<style>
  :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #64748b; --card: #fff; --opt: #e2e8f0; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --fg: #f1f5f9; --muted: #94a3b8; --card: #1e293b; --opt: #334155; --accent: #60a5fa; } }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); }
  h2 { font-size: 18px; margin: 0 0 2px; }
  .progress { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .bar { height: 4px; background: var(--opt); border-radius: 2px; margin-bottom: 14px; overflow: hidden; }
  .bar div { height: 100%; background: var(--accent); transition: width .3s; }
  .question { font-size: 16px; font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
  .option { display: block; width: 100%; text-align: left; padding: 11px 13px; margin-bottom: 8px; background: var(--opt); border: 2px solid transparent; color: inherit; border-radius: 10px; font-size: 15px; cursor: pointer; }
  .option.correct { border-color: #22c55e; }
  .option.wrong { border-color: #ef4444; }
  .next { margin-top: 6px; padding: 11px 18px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; }
  .score { text-align: center; padding: 24px 0; }
  .score .num { font-size: 52px; font-weight: 700; color: var(--accent); }
  .score .best { margin-top: 6px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div id="quiz">
  <h2>🪐 Solar System Quiz</h2>
  <div class="progress" id="progress"></div>
  <div class="bar"><div id="fill" style="width:0%"></div></div>
  <div class="question" id="question"></div>
  <div id="options"></div>
  <button class="next" id="next" hidden>Next →</button>
</div>
<script>
  var questions = [
    { q: 'Which planet is closest to the Sun?', a: ['Venus', 'Mercury', 'Earth', 'Mars'], c: 1 },
    { q: 'Which planet has the most known moons?', a: ['Jupiter', 'Saturn', 'Uranus', 'Neptune'], c: 1 },
    { q: 'What is the largest planet?', a: ['Saturn', 'Neptune', 'Jupiter', 'Earth'], c: 2 },
    { q: 'Which planet is known as the Red Planet?', a: ['Mars', 'Venus', 'Mercury', 'Jupiter'], c: 0 },
    { q: 'How many planets are in the Solar System?', a: ['7', '8', '9', '10'], c: 1 },
  ];
  // The best score is kept in this message's localStorage (it survives the widget being re-created).
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  var i = 0, score = 0;
  var qEl = document.getElementById('question'), oEl = document.getElementById('options'), nEl = document.getElementById('next'), pEl = document.getElementById('progress');
  function show() {
    var q = questions[i];
    pEl.textContent = 'Question ' + (i + 1) + ' of ' + questions.length;
    document.getElementById('fill').style.width = (i / questions.length * 100) + '%';
    qEl.textContent = q.q;
    oEl.innerHTML = '';
    nEl.hidden = true;
    q.a.forEach(function (text, idx) {
      var b = document.createElement('button');
      b.className = 'option'; b.id = 'opt-' + idx; b.textContent = text;
      b.onclick = function () {
        Array.prototype.forEach.call(oEl.children, function (x) { x.disabled = true; });
        if (idx === q.c) { b.classList.add('correct'); score++; }
        else { b.classList.add('wrong'); oEl.children[q.c].classList.add('correct'); }
        nEl.hidden = false;
        nEl.textContent = i === questions.length - 1 ? 'See results' : 'Next →';
      };
      oEl.appendChild(b);
    });
  }
  var finished = false;
  nEl.onclick = function () {
    if (finished) { finished = false; i = 0; score = 0; nEl.textContent = 'Next →'; return show(); }
    i++;
    if (i < questions.length) return show();
    finished = true;
    var msg = score === 5 ? '🌟 Perfect!' : score >= 3 ? '👍 Nice work!' : '📚 Keep exploring!';
    document.getElementById('fill').style.width = '100%';
    pEl.textContent = 'Done';
    qEl.textContent = '';
    var best = Math.max(score, store.get('quiz-best') || 0);
    store.set('quiz-best', best);
    oEl.innerHTML = '<div class="score"><div>Your score</div><div class="num">' + score + '/' + questions.length + '</div><div>' + msg + '</div><div class="best">Best so far: ' + best + '/' + questions.length + '</div></div>';
    nEl.textContent = 'Play again';
  };
  show();
</script>
</body>
</html>
