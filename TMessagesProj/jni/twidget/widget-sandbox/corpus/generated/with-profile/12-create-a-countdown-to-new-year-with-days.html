<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Year Countdown</title>
<style>
  :root { color-scheme: light dark; --bg: #eef2ff; --fg: #1e1b4b; --muted: #4338ca; --box: #fff; --line: #c7d2fe; --num: #4338ca; --dim: rgba(67,56,202,.2); }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0a2e; --fg: #fff; --muted: #a5b4fc; --box: rgba(255,255,255,.08); --line: rgba(255,255,255,.15); --num: #fbbf24; --dim: rgba(251,191,36,.2); } }
  body { margin: 0; padding: 20px 14px; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); text-align: center; }
  h2 { font-size: 19px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .box { background: var(--box); border: 1px solid var(--line); border-radius: 12px; padding: 12px 4px; }
  .num { font-size: 28px; font-weight: 700; color: var(--num); font-variant-numeric: tabular-nums; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-top: 4px; }
  .stars { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: -1; }
  .star { position: absolute; width: 2px; height: 2px; background: var(--num); border-radius: 50%; animation: twinkle 2s infinite alternate; }
  @keyframes twinkle { from { background: var(--dim); } to { background: var(--num); } }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<h2>🎆 Countdown to New Year</h2>
<div class="sub" id="target"></div>
<div class="grid">
  <div class="box"><div class="num" id="d">00</div><div class="lbl">Days</div></div>
  <div class="box"><div class="num" id="h">00</div><div class="lbl">Hours</div></div>
  <div class="box"><div class="num" id="m">00</div><div class="lbl">Minutes</div></div>
  <div class="box"><div class="num" id="s">00</div><div class="lbl">Seconds</div></div>
</div>
<script>
  var stars = document.getElementById('stars');
  for (var i = 0; i < 30; i++) { var s = document.createElement('div'); s.className = 'star'; s.style.left = (i * 37 % 100) + '%'; s.style.top = (i * 53 % 100) + '%'; s.style.animationDelay = (i % 7) / 3 + 's'; stars.appendChild(s); }
  var now = new Date();
  var target = new Date(now.getFullYear() + 1, 0, 1, 0, 0, 0);
  document.getElementById('target').textContent = 'Until ' + new Intl.DateTimeFormat(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).format(target);
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  function tick() {
    var diff = Math.max(0, target - Date.now());
    var d = Math.floor(diff / 864e5); diff -= d * 864e5;
    var h = Math.floor(diff / 36e5); diff -= h * 36e5;
    var m = Math.floor(diff / 6e4); diff -= m * 6e4;
    document.getElementById('d').textContent = d;
    document.getElementById('h').textContent = pad(h);
    document.getElementById('m').textContent = pad(m);
    document.getElementById('s').textContent = pad(Math.floor(diff / 1e3));
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
