<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spanish Flashcards</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1f2937; --muted: #6b7280; --front: #a21caf; --back: #faf5ff; --backfg: #581c87; --line: #e9d5ff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #f3f4f6; --muted: #9ca3af; --front: #86198f; --back: #1f2937; --backfg: #e9d5ff; --line: #581c87; } }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); text-align: center; }
  h2 { font-size: 17px; margin: 0 0 4px; }
  .prog { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .scene { width: 100%; height: 170px; }
  .card { position: relative; width: 100%; height: 100%; cursor: pointer; border: none; padding: 0; background: none; border-radius: 16px; }
  /* A 2D flip: the face in front folds to a line (scaleX 0), then the other one unfolds. */
  .face { position: absolute; inset: 0; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 30px; font-weight: 600; transition: transform .2s ease-in .2s; }
  .front { background: var(--front); color: #fff; }
  .back { background: var(--back); color: var(--backfg); border: 2px solid var(--line); transform: scaleX(0); transition-delay: 0s; transition-timing-function: ease-out; }
  .card.flipped .front { transform: scaleX(0); transition-delay: 0s; transition-timing-function: ease-out; }
  .card.flipped .back { transform: none; transition-delay: .2s; transition-timing-function: ease-in; }
  .face small { font-size: 12px; font-weight: 400; opacity: .7; margin-top: 8px; }
  .btns { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
  .btns button { padding: 10px 18px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; color: #fff; }
  .no { background: #ef4444; } .yes { background: #22c55e; }
  .done { padding: 24px 10px; }
  .done b { font-size: 40px; display: block; color: var(--front); }
  .review { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .again { margin-top: 14px; padding: 9px 16px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; background: var(--front); color: #fff; }
</style>
</head>
<body>
<h2>🇪🇸 Spanish Flashcards</h2>
<div class="prog" id="prog"></div>
<div id="stage">
  <div class="scene"><button class="card" id="card" aria-label="flip card"><div class="face front" id="front"></div><div class="face back" id="back"></div></button></div>
  <div class="btns"><button class="no" id="no">✗ Don't know</button><button class="yes" id="yes">✓ Know</button></div>
</div>
<script>
  var words = [['hola', 'hello'], ['gracias', 'thank you'], ['perro', 'dog'], ['gato', 'cat'], ['agua', 'water'], ['libro', 'book'], ['casa', 'house'], ['amigo', 'friend']];
  // Progress, the best result and the words to review are kept in this message's localStorage,
  // so a re-created widget resumes where it was.
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  var st = store.get('flashcards') || {};
  var i = st.i || 0, known = st.known || 0, missed = st.missed || [], best = st.best || 0;
  var stage = document.getElementById('stage'), deck = stage.innerHTML, card;
  function save() { store.set('flashcards', { i: i, known: known, missed: missed, best: best }); }
  function show() {
    card.classList.remove('flipped');
    document.getElementById('prog').textContent = 'Card ' + (i + 1) + ' of ' + words.length + ' · ' + known + ' known';
    document.getElementById('front').innerHTML = words[i][0] + '<small>tap to flip</small>';
    document.getElementById('back').innerHTML = words[i][1] + '<small>' + words[i][0] + '</small>';
  }
  function finish() {
    best = Math.max(best, known);
    save();
    document.getElementById('prog').textContent = 'Done · best ' + best + ' / ' + words.length;
    stage.innerHTML = '<div class="done">You know<b>' + known + ' / ' + words.length + '</b>words. ' + (known === words.length ? '¡Excelente!' : '¡Sigue practicando!') +
      (missed.length ? '<div class="review">To review: ' + missed.join(', ') + '</div>' : '') + '<button class="again" id="again">Start over</button></div>';
    document.getElementById('again').onclick = start;
  }
  function next(k) {
    if (k) known++; else missed.push(words[i][0]);
    i++;
    save();
    if (i < words.length) return show();
    finish();
  }
  function bind() {
    stage.innerHTML = deck;
    card = document.getElementById('card');
    card.onclick = function () { card.classList.toggle('flipped'); };
    document.getElementById('yes').onclick = function () { next(true); };
    document.getElementById('no').onclick = function () { next(false); };
  }
  function start() { i = 0; known = 0; missed = []; save(); bind(); show(); }
  if (i >= words.length) finish(); else { bind(); show(); }
</script>
</body>
</html>
