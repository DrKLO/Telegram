<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplication Table</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #111; --line: #e5e7eb; --head: #1d4ed8; --hl: #dbeafe; --hit: #1d4ed8; --muted: #374151; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #f3f4f6; --line: #374151; --head: #1e40af; --hl: #1e3a8a; --hit: #3b82f6; --muted: #9ca3af; } }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: var(--bg); color: var(--fg); }
  h2 { font-size: 17px; margin: 0 0 10px; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 12px; }
  td, th { text-align: center; padding: 6px 0; border: 1px solid var(--line); }
  th { background: var(--head); color: #fff; font-weight: 600; }
  td.hl, th.hl { background: var(--hl); }
  th.hl { color: #fff; filter: brightness(.8); }
  td.hit { background: var(--hit); color: #fff; font-weight: 700; }
  .info { margin-top: 10px; font-size: 14px; color: var(--muted); min-height: 20px; text-align: center; }
</style>
</head>
<body>
<h2>✖️ Multiplication Table</h2>
<table id="t"></table>
<div class="info" id="info">Hover or tap a cell to highlight its row and column</div>
<script>
  var N = 10, t = document.getElementById('t'), info = document.getElementById('info');
  var html = '<tr><th>×</th>';
  for (var j = 1; j <= N; j++) html += '<th data-c="' + j + '">' + j + '</th>';
  html += '</tr>';
  for (var i = 1; i <= N; i++) {
    html += '<tr><th data-r="' + i + '">' + i + '</th>';
    for (j = 1; j <= N; j++) html += '<td data-r="' + i + '" data-c="' + j + '">' + (i * j) + '</td>';
    html += '</tr>';
  }
  t.innerHTML = html;
  var cells = t.querySelectorAll('td, th');
  function highlight(td) {
    var r = td.getAttribute('data-r'), c = td.getAttribute('data-c');
    Array.prototype.forEach.call(cells, function (x) {
      var xr = x.getAttribute('data-r'), xc = x.getAttribute('data-c');
      var isHeader = x.tagName === 'TH';
      x.classList.toggle('hl', x !== td && ((xr === r && (isHeader || xc !== c)) || (xc === c && (isHeader || xr !== r))));
      x.classList.toggle('hit', x === td);
    });
    info.textContent = r + ' × ' + c + ' = ' + (r * c);
  }
  function clear() { Array.prototype.forEach.call(cells, function (x) { x.classList.remove('hl', 'hit'); }); info.textContent = 'Hover or tap a cell to highlight its row and column'; }
  t.addEventListener('mouseover', function (e) { var td = e.target.closest('td'); if (td) highlight(td); });
  t.addEventListener('click', function (e) { var td = e.target.closest('td'); if (td) highlight(td); });
  t.addEventListener('mouseleave', clear);
</script>
</body>
</html>
