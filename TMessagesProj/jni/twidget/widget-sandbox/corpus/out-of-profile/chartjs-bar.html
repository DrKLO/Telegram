<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>body { font-family: system-ui, sans-serif; margin: 0; padding: 10px; background: #fff; } .wrap { position: relative; height: 240px; }</style>
</head><body>
<h3 style="margin:0 0 6px;font-size:15px">Expenses by category</h3>
<div class="wrap"><canvas id="c"></canvas></div>
<script>
  new Chart(document.getElementById('c'), {
    type: 'bar',
    data: { labels: ['Rent', 'Food', 'Transport', 'Fun', 'Savings'], datasets: [
      { label: '2024', data: [1200, 450, 180, 220, 400], backgroundColor: '#2481cc' },
      { label: '2025', data: [1250, 480, 150, 300, 500], backgroundColor: '#f59e0b' } ] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, scales: { y: { beginAtZero: true, ticks: { callback: function (v) { return '$' + v; } } } }, plugins: { tooltip: { enabled: true }, legend: { position: 'top' } } }
  });
</script>
</body></html>
