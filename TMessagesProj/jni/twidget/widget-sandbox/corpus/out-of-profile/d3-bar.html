<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>body { font-family: system-ui, sans-serif; margin: 0; padding: 10px; background: #fff; } #info { font-size: 13px; color: #444; min-height: 18px; } .bar:hover { opacity: .8; }</style>
</head><body>
<div id="chart"></div><div id="info">Click a bar</div>
<script>
  var data = [{ k: 'A', v: 30 }, { k: 'B', v: 86 }, { k: 'C', v: 54 }, { k: 'D', v: 72 }, { k: 'E', v: 45 }, { k: 'F', v: 97 }];
  var W = 380, H = 220, m = { t: 24, r: 10, b: 30, l: 36 };
  var svg = d3.select('#chart').append('svg').attr('viewBox', [0, 0, W, H]).attr('width', '100%');
  var x = d3.scaleBand().domain(data.map(function (d) { return d.k; })).range([m.l, W - m.r]).padding(0.25);
  var y = d3.scaleLinear().domain([0, 100]).range([H - m.b, m.t]);
  svg.append('g').attr('transform', 'translate(0,' + (H - m.b) + ')').call(d3.axisBottom(x));
  svg.append('g').attr('transform', 'translate(' + m.l + ',0)').call(d3.axisLeft(y).ticks(5));
  svg.selectAll('.bar').data(data).join('rect').attr('class', 'bar').attr('id', function (d) { return 'bar-' + d.k; })
    .attr('x', function (d) { return x(d.k); }).attr('y', function (d) { return y(d.v); }).attr('width', x.bandwidth()).attr('height', function (d) { return y(0) - y(d.v); })
    .attr('fill', '#2481cc')
    .on('click', function (e, d) { d3.select('#info').text(d.k + ' = ' + d.v); d3.selectAll('.bar').attr('fill', '#2481cc'); d3.select(this).attr('fill', '#f59e0b'); });
  var title = svg.append('text').attr('x', W / 2).attr('y', 14).attr('text-anchor', 'middle').attr('font-size', 13).attr('font-weight', 600).text('Scores by group');
  // position a frame around the title using its measured box
  var b = title.node().getBBox();
  svg.insert('rect', 'text').attr('x', b.x - 6).attr('y', b.y - 2).attr('width', b.width + 12).attr('height', b.height + 4).attr('rx', 4).attr('fill', '#f3f4f6');
</script>
</body></html>
