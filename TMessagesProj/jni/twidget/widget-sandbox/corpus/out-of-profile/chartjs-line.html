<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body { font-family: system-ui, sans-serif; margin: 0; padding: 10px; background: #fff; } .wrap { position: relative; height: 220px; }</style>
</head><body>
<div class="wrap"><canvas id="c"></canvas></div>
<p id="note" style="font-size:12px;color:#666;margin:6px 0 0">Hover a point for a tooltip. <button id="add">Add point</button></p>
<script>
  var labels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var chart = new Chart(document.getElementById('c'), {
    type: 'line',
    data: { labels: labels, datasets: [
      { label: 'Visits', data: [120, 190, 150, 220, 300, 260, 180], borderColor: '#2481cc', backgroundColor: 'rgba(36,129,204,.15)', fill: true, tension: .3 },
      { label: 'Signups', data: [12, 25, 18, 30, 42, 35, 20], borderColor: '#f59e0b', tension: .3 } ] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'bottom' } } }
  });
  document.getElementById('add').addEventListener('click', function () {
    chart.data.labels.push('D' + (chart.data.labels.length + 1));
    chart.data.datasets.forEach(function (ds) { ds.data.push(Math.round(Math.random() * 200 + 50)); });
    chart.update();
  });
</script>
</body></html>
