<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; background: #fff; color: #222; }
  form { display: grid; gap: 10px; }
  label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
  input, select { font: 14px system-ui; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  input.invalid { border-color: #dc2626; background: #fef2f2; }
  .error { color: #dc2626; font-size: 12px; font-weight: 400; min-height: 14px; }
  button { padding: 10px; border: 0; border-radius: 6px; background: #2481cc; color: #fff; font-size: 14px; cursor: pointer; }
  #ok { display: none; background: #dcfce7; color: #166534; padding: 10px; border-radius: 6px; }
</style></head><body>
<form id="f" novalidate>
  <label>Name <input id="name" name="name" placeholder="Jane Doe"><span class="error" id="e-name"></span></label>
  <label>Email <input id="email" name="email" type="email" placeholder="jane@example.com"><span class="error" id="e-email"></span></label>
  <label>Age <input id="age" name="age" type="number" min="1" max="120"><span class="error" id="e-age"></span></label>
  <label>Plan <select id="plan" name="plan"><option value="">Choose…</option><option value="free">Free</option><option value="pro">Pro</option></select><span class="error" id="e-plan"></span></label>
  <button type="submit" id="submit">Sign up</button>
  <div id="ok"></div>
</form>
<script>
  var f = document.getElementById('f');
  function setError(id, msg) {
    document.getElementById('e-' + id).textContent = msg;
    document.getElementById(id).classList.toggle('invalid', !!msg);
    return !msg;
  }
  function validate() {
    var fd = new FormData(f);
    var ok = true;
    ok = setError('name', fd.get('name').trim().length < 2 ? 'At least 2 characters' : '') && ok;
    ok = setError('email', /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(fd.get('email')) ? '' : 'Enter a valid email') && ok;
    var age = Number(fd.get('age'));
    ok = setError('age', fd.get('age') === '' || age < 1 || age > 120 ? 'Age must be 1–120' : '') && ok;
    ok = setError('plan', fd.get('plan') ? '' : 'Pick a plan') && ok;
    return ok;
  }
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var ok = document.getElementById('ok');
    if (validate()) { ok.style.display = 'block'; ok.textContent = 'Thanks, ' + document.getElementById('name').value + '! Plan: ' + document.getElementById('plan').value; }
    else ok.style.display = 'none';
  });
  f.addEventListener('input', function (e) { if (e.target.classList.contains('invalid')) validate(); });
</script>
</body></html>
