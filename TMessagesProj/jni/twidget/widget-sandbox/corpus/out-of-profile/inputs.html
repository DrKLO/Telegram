<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; background: #fff; color: #222; }
  .ctl { display: grid; grid-template-columns: 70px 1fr 50px; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 13px; }
  input[type=range] { width: 100%; }
  #preview { height: 70px; border-radius: 12px; background: #2481cc; transition: none; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; margin-top: 8px; }
  output { font-variant-numeric: tabular-nums; text-align: right; }
</style></head><body>
<div class="ctl"><label for="color">Color</label><input type="color" id="color" value="#2481cc"><output id="o-color">#2481cc</output></div>
<div class="ctl"><label for="radius">Radius</label><input type="range" id="radius" min="0" max="35" value="12"><output id="o-radius">12</output></div>
<div class="ctl"><label for="opacity">Opacity</label><input type="range" id="opacity" min="0" max="100" value="100" step="5"><output id="o-opacity">100</output></div>
<div class="ctl"><label for="size">Height</label><input type="range" id="size" min="40" max="120" value="70"><output id="o-size">70</output></div>
<div class="ctl"><label>Options</label><span><label><input type="checkbox" id="border"> border</label> <label><input type="checkbox" id="shadow" checked> shadow</label></span><span></span></div>
<div id="preview">preview</div>
<script>
  function apply() {
    var p = document.getElementById('preview');
    var c = document.getElementById('color').value, r = document.getElementById('radius').value, o = document.getElementById('opacity').value, s = document.getElementById('size').value;
    p.style.background = c; p.style.borderRadius = r + 'px'; p.style.opacity = o / 100; p.style.height = s + 'px';
    p.style.border = document.getElementById('border').checked ? '3px solid #222' : 'none';
    p.style.boxShadow = document.getElementById('shadow').checked ? '0 4px 12px rgba(0,0,0,.3)' : 'none';
    document.getElementById('o-color').textContent = c; document.getElementById('o-radius').textContent = r; document.getElementById('o-opacity').textContent = o; document.getElementById('o-size').textContent = s;
  }
  document.querySelectorAll('input').forEach(function (i) { i.addEventListener('input', apply); i.addEventListener('change', apply); });
  apply();
</script>
</body></html>
