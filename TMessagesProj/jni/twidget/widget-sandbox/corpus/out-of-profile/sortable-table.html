<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #fff; color: #222; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 8px; font: 14px system-ui; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; cursor: pointer; background: #f3f4f6; padding: 8px; user-select: none; white-space: nowrap; }
  th.asc::after { content: ' ▲'; } th.desc::after { content: ' ▼'; }
  td { padding: 8px; border-top: 1px solid #eee; }
  tr:nth-child(even) td { background: #fafafa; }
  #count { font-size: 12px; color: #666; margin-top: 6px; }
</style></head><body>
<input id="filter" placeholder="Filter by name or city…">
<table id="t">
  <thead><tr><th data-key="name" id="h-name">Name</th><th data-key="city" id="h-city">City</th><th data-key="score" id="h-score">Score</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="count"></div>
<script>
  var data = [
    { name: 'Alice', city: 'Berlin', score: 82 }, { name: 'Bob', city: 'Lisbon', score: 67 }, { name: 'Chen', city: 'Taipei', score: 91 },
    { name: 'Dana', city: 'Austin', score: 74 }, { name: 'Eve', city: 'Berlin', score: 58 }, { name: 'Farid', city: 'Dubai', score: 88 },
  ];
  var sortKey = 'name', dir = 1, query = '';
  function render() {
    var rows = data.filter(function (r) { return (r.name + ' ' + r.city).toLowerCase().indexOf(query.toLowerCase()) >= 0; });
    rows.sort(function (a, b) { return (a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0) * dir; });
    var tbody = document.getElementById('rows');
    tbody.innerHTML = rows.map(function (r) { return '<tr><td>' + r.name + '</td><td>' + r.city + '</td><td>' + r.score + '</td></tr>'; }).join('');
    document.querySelectorAll('th').forEach(function (th) { th.className = th.dataset.key === sortKey ? (dir > 0 ? 'asc' : 'desc') : ''; });
    document.getElementById('count').textContent = rows.length + ' of ' + data.length + ' rows';
  }
  document.querySelectorAll('th').forEach(function (th) {
    th.addEventListener('click', function () { if (sortKey === th.dataset.key) dir = -dir; else { sortKey = th.dataset.key; dir = 1; } render(); });
  });
  document.getElementById('filter').addEventListener('input', function (e) { query = e.target.value; render(); });
  render();
</script>
</body></html>
