<!-- bot-demos/07, Gram Wallet test on mainnet (tw-bot gram): the protocol is in README.md -->
<meta name="tw-bot" content="gram">
<style>
body{margin:0;padding:12px 14px}
.hd,.r{display:flex;align-items:center;gap:10px}
.ic{width:40px;height:40px;border-radius:50%;background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color);display:grid;place-items:center;font-size:20px;flex:none}
h3{margin:0;font-size:16px}
small,.w{font-size:13px;color:var(--tg-theme-hint-color)}
.r{padding:10px 0 9px;border-top:1px solid var(--tg-theme-section-separator-color)}
.hd{margin-bottom:8px}
.r div{flex:1;min-width:0}
.r b{display:block;font-size:15px;font-weight:500}
.w{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bad{color:var(--tg-theme-destructive-text-color)}
button{flex:none;min-width:74px}
#n{white-space:normal;min-height:17px}
</style>
<div class="hd"><div class="ic">💎</div><div><h3>Gram Wallet test</h3><small>Mainnet: your wallet, a signature, 0.01 TON to yourself</small></div></div>
<div class="r"><div><b>My wallet</b><span class="w" id="mw"></span></div><button id="me">Show</button></div>
<div class="r"><div><b>Sign a text</b><span class="w" id="sw"></span></div><button id="sg">Sign</button></div>
<div class="r"><div><b>0.01 TON to myself</b><span class="w" id="tw"></span></div><button id="pay">Send</button></div>
<span class="w" id="n"></span>
<script>
var T = TelegramWidget, st = {}, busy = 0, timer = 0;
function $(id) { return document.getElementById(id); }
function J(s) { try { return JSON.parse(s) || {}; } catch (e) { return {}; } }
function note(s) { $('n').textContent = s; }
function line(id, text, bad) { var e = $(id); e.textContent = text; e.className = bad ? 'w bad' : 'w'; }
function ton(n) { return +(Number(n) / 1e9).toFixed(4) + ' TON'; }
function short(a) { return a.slice(0, 4) + '…' + a.slice(-4); }

// The bot's state for this chat (chatData) and its answers carry the same parts: m (the wallet card), s (the last
// signature check), t (the last transfer: wait | ok | fail).
function render() {
  var m = st.m, s = st.s, t = st.t;
  line('mw', m ? short(m.a) + ' · ' + ton(m.b) : 'The card in your profile');
  line('sw', s ? (s.ok ? '✓ ' : '✗ ') + s.w : 'The bot checks the signature', s && !s.ok);
  line('tw', t ? { wait: '⏳ ', ok: '✓ ', fail: '✗ ' }[t.st] + t.w : 'From the wallet on this device', t && t.st == 'fail');
  if (t && t.st == 'wait') poll();
}
function take(a) {
  var r = J(a && a.result);
  if (r.err) throw { bot: r.err };
  for (var k in r) if (k == 'm' || k == 's' || k == 't') st[k] = r[k];
  render();
  return r;
}
function load() { st = J(T.chatData); render(); }

var WHY = {
  REJECTED: 'You declined in the wallet.',
  BAD_REQUEST: 'The wallet refused it.',
  NOT_ALLOWED: 'Not allowed here.',
  BUSY: 'One moment…',
  TIMEOUT: 'The bot did not answer.',
  RATE_LIMITED: 'Too fast: try again.'
};
function fail(e) { busy = 0; note(e && e.bot || WHY[e && e.code] || e && e.message || 'Something went wrong.'); }
function ask(data, options) { return T.request(data, options).then(take); }
// One tap, one request; its answer allows the one wallet call that follows (the grant, 10 s).
function tap(f) {
  return function () {
    if (busy || !T.wallet) return;
    busy = 1;
    note('');
    f().then(function () { busy = 0; note(''); }, fail);
  };
}
$('me').onclick = tap(function () { return ask('w:me', { wallet: true }); });
$('sg').onclick = tap(function () {
  return ask('w:text').then(function (r) {
    note('Confirm in your wallet…');
    return T.wallet.signData({ type: 'text', text: r.text, network: '-239' }, 'w:sign');
  }).then(take);
});
$('pay').onclick = tap(function () {
  return ask('w:pay', { wallet: true }).then(function (r) {
    note('Confirm in your wallet…');
    return T.wallet.sendTransaction(r.tx, 'w:sent');
  }).then(take);
});
// While the transfer waits for the chain: a background request every 5 s (the bot looks it up on toncenter).
function poll() {
  if (timer) return;
  timer = setTimeout(function () {
    timer = 0;
    T.request('w:st').then(take).catch(function () {}).then(function () { if (st.t && st.t.st == 'wait') poll(); });
  }, 5200);
}

if (!T.wallet) {
  ['me', 'sg', 'pay'].forEach(function (id) { $(id).disabled = true; });
  note(T.isPreview ? 'A preview: send it to try.' : 'No Gram Wallet in this client yet (TelegramWidget.wallet is null).');
}
T.onEvent('chatDataChanged', load);
load();
</script>
