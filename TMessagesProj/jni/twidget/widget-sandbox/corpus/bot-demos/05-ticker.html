<!-- bot-demos/05, live quote (tw-bot quote): the protocol is in README.md -->
<meta name="tw-bot" content="quote">
<style>
:root{--g:light-dark(#1f9d4a,#3cc56b);--r:var(--tg-theme-destructive-text-color);--h:var(--tg-theme-hint-color);--c:var(--g)}
body{margin:0;padding:14px 16px 12px;font:15px/1.3 system-ui,sans-serif;font-variant-numeric:tabular-nums}
.dn{--c:var(--r)}
.hd{display:flex;align-items:center;gap:10px}
.lg{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(150deg,rgba(255,255,255,.28),rgba(255,255,255,0) 60%),var(--tg-theme-button-color);color:var(--tg-theme-button-text-color);font-weight:700;font-size:13px;letter-spacing:-.03em}
.nm{flex:1;min-width:0}
.nm b,.nm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm b{font-size:16px;font-weight:600}
.nm span,.ft,.rg span{font-size:13px;color:var(--h)}
.lv{display:flex;align-items:center;gap:6px;padding:4px 9px 4px 8px;border-radius:12px;background:var(--tg-theme-secondary-bg-color);font-size:12px;font-weight:600;color:var(--h)}
.lv i{position:relative;width:7px;height:7px;border-radius:50%;background:var(--g)}
.lv i::after,.pu{animation:pu 1.8s ease-out infinite}
.pu{transform-box:fill-box;transform-origin:center}
.lv i::after{content:'';position:absolute;inset:0;border-radius:50%;background:inherit}
@keyframes pu{from{transform:scale(1);opacity:.55}to{transform:scale(3);opacity:0}}
.px{margin-top:12px;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;transition:color .9s}
.px.u{color:var(--g);transition:none}.px.d{color:var(--r);transition:none}
.ch{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--h)}
.pl{position:relative;display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;color:var(--c);font-weight:600;transition:color .4s}
.pl::before{content:'';position:absolute;inset:0;border-radius:8px;background:currentColor;opacity:.13}
.pl svg{transition:transform .4s}
.dn .pl svg{transform:rotate(180deg)}
.cw{margin:8px -16px 0}
#sv{display:block;width:100%;height:96px}
#ln{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;transition:stroke .4s}
#op{stroke:var(--h);stroke-dasharray:2 4;opacity:.6}
stop{stop-color:var(--c);transition:stop-color .4s}
.dt{fill:var(--c);stroke:var(--tg-theme-bg-color);stroke-width:2;transition:fill .4s}
.rg{margin-top:10px}
.rg div{display:flex;justify-content:space-between}
.bar{position:relative;height:4px;margin:6px 0 2px;border-radius:2px;background:var(--tg-theme-secondary-bg-color)}
.bar i{position:absolute;top:-3px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--tg-theme-bg-color);transition:left .7s cubic-bezier(.2,.8,.2,1),background .4s}
.ft{margin-top:10px;display:flex;justify-content:space-between}
.nd .ch,.nd .rg,.nd .dt,.nd #ar,.nd #op,.nd .lv{display:none}
.nd .lg{color:var(--h)}.nd .lg,.nd .px::before{background:var(--tg-theme-secondary-bg-color)}
.nd .px::before{content:'';display:block;width:140px;height:37px;border-radius:10px}
.nd #ln{stroke:var(--h);animation:sk 1.4s ease-in-out infinite alternate}
@keyframes sk{from{opacity:.4}to{opacity:.1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="hd"><div class="lg" id="lg"></div><div class="nm"><b id="nm"></b><span id="sy"></span></div><div class="lv" id="lv"><i></i>Live</div></div>
<div class="px" id="px"></div>
<div class="ch"><span class="pl"><svg width="9" height="9" viewBox="0 0 10 10"><path d="M5 1 9.5 8.5H.5z" fill="currentColor"/></svg><span id="cv"></span></span>Today</div>
<div class="cw"><svg id="sv" viewBox="0 0 300 96" preserveAspectRatio="none"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-opacity=".3"/><stop offset="1" stop-opacity="0"/></linearGradient></defs><line id="op" x1="0" x2="300"/><path id="ar" fill="url(#gr)"/><path id="ln"/><circle class="dt pu" id="d2" r="4"/><circle class="dt" id="d1" r="4"/></svg></div>
<div class="rg"><div><span id="lo"></span><span id="hi"></span></div><div class="bar"><i id="mk"></i></div></div>
<div class="ft"><span id="up"></span><span id="on"></span></div>
<script>
const T=window.TelegramWidget,$=i=>document.getElementById(i),B=document.body,
J=(s,d)=>{try{return s?JSON.parse(s):d}catch(e){return d}},
RM=matchMedia('(prefers-reduced-motion: reduce)').matches,
N=v=>typeof v=='number'&&isFinite(v),
SAMPLE={s:'TON',n:'Toncoin',c:'$',p:5.4321,o:5.31,h:[...'204759ca8bfdgecadhfigef'].map(c=>5.29+parseInt(c,36)/100).concat(5.4321),t:'21:59:30'};
let W=300,H=96,q=null,S=null,raf=0,ft=0,dp=2,OP=0;
const dec=v=>(String(v).split('.')[1]||'').length,
F=v=>{const[i,d]=Math.abs(v).toFixed(dp).split('.');return(v<0?'−':'')+q.c+i.replace(/\B(?=(\d{3})+$)/g,',')+(d?'.'+d:'')};
function geo(h,lo,hi){const n=h.length,st=(W-16)/(n-1),d=hi-lo,Y=v=>d?8+(hi-v)/d*(H-16):H/2;return{st,Y,P:h.map((v,i)=>[i*st,Y(v)])}}
function paint(P,yo,v){
  const f=x=>x.toFixed(1),n=P.length;let d='M'+f(P[0][0])+' '+f(P[0][1]);
  for(let i=1;i<n-1;i++)d+='Q'+f(P[i][0])+' '+f(P[i][1])+' '+f((P[i][0]+P[i+1][0])/2)+' '+f((P[i][1]+P[i+1][1])/2);
  const e=P[n-1];d+='L'+f(e[0])+' '+f(e[1]);
  $('ln').setAttribute('d',d);$('ar').setAttribute('d',d+'L'+f(e[0])+' '+H+'L'+f(P[0][0])+' '+H+'Z');
  for(const k of['d1','d2']){$(k).setAttribute('cx',f(e[0]));$(k).setAttribute('cy',f(e[1]))}
  $('op').setAttribute('y1',f(yo));$('op').setAttribute('y2',f(yo));
  if(v!=null){$('px').textContent=F(v);const c=v-OP;$('cv').textContent=F(Math.abs(c))+' · '+Math.abs(OP?c/OP*100:0).toFixed(2)+'%'}
}
function draw(anim){
  const o=q,r=T?J(T.publicData,null):SAMPLE,ok=r&&N(r.p);
  if(ok&&o&&(r.r|0)<(o.r|0))return;
  B.classList.toggle('nd',!ok);
  $('lv').style.display=T&&!T.isPreview?'':'none';
  if(!ok){q=null;S=null;cancelAnimationFrame(raf);$('lg').textContent='…';$('nm').textContent='Live quote';$('sy').textContent='Waiting for the bot';$('px').textContent='';$('up').textContent='Not updated yet';$('on').textContent='';paint(geo([...Array(24)].map((_,i)=>Math.sin(i/2.5)+i/9),-1.5,4).P,0);return}
  r.c=typeof r.c=='string'?r.c.slice(0,3):'';r.s=String(r.s||'').slice(0,5);
  let h=Array.isArray(r.h)?r.h.filter(N).slice(-48):[];
  if(h.length<2)h=[N(r.o)?r.o:r.p,r.p];
  h[h.length-1]!==r.p&&h.push(r.p);
  const op=N(r.o)?r.o:h[0],lo=Math.min(...h,op),hi=Math.max(...h,op),G=geo(h,lo,hi);
  q=r;OP=op;dp=Math.min(4,Math.max(2,dec(r.p),dec(op),...h.map(dec)));
  $('lg').textContent=r.s||'?';$('lg').style.fontSize=r.s.length>3?'11px':'';
  $('nm').textContent=r.n||r.s;$('sy').textContent=r.n?r.s:'';
  B.classList.toggle('dn',r.p<op);
  $('lo').textContent='Low '+F(lo);$('hi').textContent='High '+F(hi);
  $('mk').style.left=((r.p-lo)/(hi-lo||1)*100).toFixed(1)+'%';
  $('up').textContent=r.t?'Updated '+String(r.t).slice(0,16):'';$('on').textContent='Open '+F(op);
  const T1={P:G.P,yo:G.Y(op),v:r.p,h};
  if(o&&o.p!==r.p&&anim){const px=$('px');px.className='px '+(r.p>o.p?'u':'d');clearTimeout(ft);ft=setTimeout(()=>px.className='px',650)}
  if(!S||!anim||RM){S=T1;cancelAnimationFrame(raf);paint(T1.P,T1.yo,T1.v);return}
  let U=S.P,V=T1.P;const oh=S.h,n=oh.length;
  if(n==h.length&&oh.slice(1).every((v,i)=>v===h[i])){U=U.concat([U[n-1]]);V=[[-G.st,G.Y(oh[0])]].concat(V)}
  else if(U.length!=V.length)U=V;
  const yo=S.yo,v0=S.v,t0=performance.now(),L=(a,b,t)=>a+(b-a)*t;S=T1;cancelAnimationFrame(raf);
  (function st(){const k=Math.min(1,(performance.now()-t0)/750),e=1-Math.pow(1-k,3);
    paint(U.map((p,i)=>[L(p[0],V[i][0],e),L(p[1],V[i][1],e)]),L(yo,T1.yo,e),L(v0,T1.v,e));
    if(k<1)raf=requestAnimationFrame(st)})();
}
new ResizeObserver(e=>{const w=Math.round(e[0].contentRect.width);if(w&&w!=W){W=w;$('sv').setAttribute('viewBox','0 0 '+W+' '+H);$('op').setAttribute('x2',W);S=null;draw(false)}}).observe($('sv'));
draw(false);
if(T){T.onEvent('publicDataChanged',()=>draw(true));T.isPreview||T.watchPublicData();T.ready&&T.ready()}
</script>
