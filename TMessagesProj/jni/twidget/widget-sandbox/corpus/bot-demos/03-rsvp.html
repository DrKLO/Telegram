<!-- bot-demos/03, who's in (tw-bot rsvp): the protocol is in README.md -->
<meta name="tw-bot" content="rsvp">
<style>
:root{--b:var(--tg-theme-button-color);--h:var(--tg-theme-hint-color)}
body{margin:0;padding:14px 14px 10px;font-variant-numeric:tabular-nums}
.x{display:none!important}
.tn{position:relative;z-index:0}
.tn:before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--k,var(--b));opacity:var(--a,.12)}
.hd{display:flex;gap:12px;align-items:center}
.hd>div{min-width:0;flex:1}
#cal{flex:none;width:48px;height:52px;border-radius:12px;text-align:center;line-height:1}
#cal b{display:block;padding:9px 0 3px;font-size:10px;letter-spacing:.08em;color:var(--b)}
#cal i{font:600 22px system-ui}
h1{margin:0 0 3px;font-size:17px;line-height:1.2}
.m{display:flex;align-items:center;gap:6px;color:var(--h);font-size:13px}
svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sp{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 7px;color:var(--h);font-size:14px}
.sp b{color:var(--tg-theme-text-color);font-size:22px;margin-right:2px}
#lf.f{color:var(--b);font-weight:600}
#br{height:6px;border-radius:3px;overflow:hidden}
#fl{display:block;height:100%;width:0;border-radius:3px;background:var(--b);transition:width .7s cubic-bezier(.2,.8,.2,1)}
#av{display:flex;margin:14px 0 8px}
#av i{width:28px;height:28px;margin-right:-5px;border-radius:50%;box-shadow:0 0 0 2px var(--tg-theme-bg-color);display:grid;place-items:center;font:600 12px system-ui;color:#fff;background:var(--h)}
#av .p{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}}
#nm b{color:var(--b)}
.h{color:var(--h);font-size:13px;margin-top:2px}
#sg{display:flex;margin-top:14px;padding:3px;border-radius:12px;--k:var(--h);--a:.14}
#sg button{position:relative;flex:1;padding:9px 0;border-radius:9px;background:none;color:var(--tg-theme-text-color);font:600 14px system-ui;transition:color .25s}
#sg .on{color:var(--tg-theme-button-text-color)}
#th{position:absolute;left:3px;top:3px;bottom:3px;width:calc(33.33% - 2px);border-radius:9px;background:var(--b);opacity:0;transition:transform .4s cubic-bezier(.3,1.25,.5,1),opacity .2s,background .3s}
#th.o{background:var(--h)}
.p #th{animation:pl .8s ease-in-out infinite alternate}
@keyframes pl{to{opacity:.55}}
#st{min-height:17px;margin-top:8px;text-align:center}
#st.e{color:var(--tg-theme-destructive-text-color)}
#fw{justify-content:center;margin-top:14px;padding-top:11px;border-top:1px solid var(--tg-theme-section-separator-color)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class=hd><div id=cal class=tn><b id=mo></b><i id=dy></i></div><div>
<h1 id=t></h1>
<div class=m id=wr><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id=w></span></div>
<div class=m id=pr><svg viewBox="0 0 24 24"><path d="M12 21s-7-6-7-11.5a7 7 0 0 1 14 0C19 15 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span id=p></span></div>
</div></div>
<div class=sp><span><b id=n></b><span id=of></span></span><span id=lf></span></div>
<div id=br class=tn><i id=fl></i></div>
<div id=pe><div id=av></div><div id=nm></div><div class=h id=mb></div></div>
<div id=sg class=tn><i id=th></i><button data-k=in>I'm in</button><button data-k=may>Maybe</button><button data-k=out>Can't</button></div>
<div id=st class=h></div>
<div id=fw class=m><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6 6 0 0 1 3.5 5.5"/></svg>Join in the group chat</div>
<script>
let T=window.TelegramWidget||0,V=T.viewer,F=T.isForward,P=T.isPreview,sh=!F&&(!T||V||P),K=['in','may','out'],busy=0,over,pend,seen,ME,msg,bad,tm,
C='ff885e,ff516a,ffcd6a,ffa85c,82b1ff,665fff,a0de7e,54cb68,53edd6,28c9b7,72d5fd,2a9ef1,e0a2f3,d669ed'.split(','),
E={NOT_ALLOWED:'Answers are closed here',BUSY:'Still sending',RATE_LIMITED:'Too many taps, wait a bit',TIMEOUT:'No answer from the bot',FAILED:"Couldn't reach the bot",INVALID_ANSWER:'Bad answer from the bot',Full:'Sorry, no spots left'},
OK={in:"You're in!",may:'Marked as maybe',out:"Marked as can't"};
const $=i=>typeof i=='string'?document.getElementById(i):i,
J=(s,d)=>{try{return s?JSON.parse(s):d}catch(e){return d}},
hp=(k,v)=>{try{T.HapticFeedback[k](v)}catch(e){}},
tx=(i,s)=>$(i).textContent=s,
cl=(e,c,on)=>$(e).classList.toggle(c,!!on),
el=(t,s,c)=>{let e=document.createElement(t);e.textContent=s;e.className=c||'';return e},
st=(s,e)=>{msg=s;bad=e;clearTimeout(tm);tm=setTimeout(()=>{msg='';draw()},3500);draw()};
function draw(){
let p=J(T.publicData,0)||{},c=J(T.chatData,0),L={},m=/([A-Z][a-z]{2})[a-z]* (\d\d?)\b/.exec(p.w),max=+p.max||0,now={},av=$('av'),nm=$('nm'),n,a,i;
ME=null;
for(const k of K)L[k]=(c&&c[k]instanceof Array?c[k]:[]).filter(e=>V&&e&&e[0]==V.id?(ME=k,0):e instanceof Array);
if(over!==undefined)ME=over;
if(V&&L[ME])L[ME].unshift([V.id,V.first_name,1]);
n=c?L.in.length:+p.n||0;
tx('t',p.t||"Who's in?");
cl('cal','x',!m);if(m){tx('mo',m[1].toUpperCase());tx('dy',m[2])}
tx('w',p.w||'');cl('wr','x',!p.w);tx('p',p.p||'');cl('pr','x',!p.p);
tx('n',n);tx('of',max?' of '+max+(F?' going':' spots'):' going');
tx('lf',max?n<max?max-n+' left':'Full':'');cl('lf','f',max&&n>=max);
cl('br','x',!max);$('fl').style.width=(max?Math.min(100,n/max*100):0)+'%';
av.textContent=nm.textContent='';
L.in.slice(0,L.in[8]?7:8).forEach(e=>{let g=Math.abs(e[0]|0)%7*2,d=el('i',([...String(e[1]||'?')][0]||'?').toUpperCase(),seen&&!seen[e[0]]?'p':'');d.style.background=`linear-gradient(#${C[g]},#${C[g+1]})`;now[e[0]]=1;av.append(d)});
if(L.in[8])av.append(el('i','+'+(L.in.length-7)));
seen=now;cl(av,'x',!L.in[0]);cl(nm,'h',!L.in[0]);
if(!L.in[0])nm.textContent='Nobody is in yet';
L.in.slice(0,10).forEach((e,i)=>nm.append(i?', ':'',el(e[2]?'b':'span',e[2]?'You':e[1])));
if(L.in[10])nm.append(` and ${L.in.length-10} more`);
a=L.may.slice(0,6).map(e=>e[2]?'you':e[1]).join(', ');
tx('mb',(a?'Maybe: '+a+(L.may[6]?'…':''):'')+(a&&L.out[0]?' · ':'')+(L.out[0]?L.out.length+" can't":''));
cl('pe','x',F);cl('sg','x',!sh);cl('fw','x',!F);cl('st','x',F);
a=pend!==undefined?pend:ME;i=K.indexOf(a);
$('th').style.opacity=i<0?0:1;if(i>=0)$('th').style.transform=`translateX(${i*100}%)`;cl('th','o',a=='out');
$('sg').querySelectorAll('button').forEach((b,j)=>cl(b,'on',j==i));
cl('sg','p',busy);
tx('st',busy?'Sending…':msg||(!sh?E.NOT_ALLOWED:ME?'Tap your answer again to clear it':'Are you coming?'));cl('st','e',!busy&&msg&&bad);
}
$('sg').addEventListener('click',e=>{
let b=e.target.closest('button'),k,r;
if(!b||!V||F||P)return;
if(busy)return st(E.BUSY,1);
k=b.getAttribute('data-k');
try{r=T.request('rsvp:'+k)}catch(x){r=Promise.reject(x)}
hp('impactOccurred','light');pend=k==ME?null:k;busy=1;msg='';draw();
r.then(a=>{let d=J(a&&a.result,0)||{};busy=0;pend=undefined;if('me'in d)over=d.me;
if(d.err)throw{code:d.err};hp('notificationOccurred','success');st(d.me?OK[d.me]:'Answer cleared')}).catch(x=>{busy=0;pend=undefined;hp('notificationOccurred','error');st(E[x.code]||x.code||E.FAILED,1)});
});
if(T){T.onEvent('chatDataChanged',()=>{over=undefined;draw()});T.onEvent('publicDataChanged',draw)}
draw();
T.ready&&T.ready();
</script>
