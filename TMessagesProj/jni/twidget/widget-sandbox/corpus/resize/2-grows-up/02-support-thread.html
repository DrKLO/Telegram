<!--
  resize: setResizeAnchor('bottom') before anything grows: the bubble grows upward (corpus/resize/README.md)
  idea: a support thread with a courier service: tap a quick reply and your question and the answer appear at the bottom. The widget calls setResizeAnchor('bottom'), so the bubble grows upward: its bottom and the quick replies stay under your finger while the older messages and the chat above move up. The thread is kept in localStorage, so a re-created bubble comes back as it was.
-->
<title>Courier help</title>
<style>
  body { margin: 0; padding: 10px 10px 8px }
  .an { margin: 0 0 10px; padding: 6px 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; background: var(--tg-theme-secondary-bg-color); color: var(--tg-theme-hint-color) }
  .an b { color: var(--tg-theme-text-color) }
  .hd { display: flex; gap: 8px; align-items: center; margin: 0 2px 8px }
  .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; background: var(--tg-theme-secondary-bg-color) }
  .nm { font-size: 14px; font-weight: 600 }
  .st { font-size: 12px; color: var(--tg-theme-hint-color) }
  .old { margin: 0 0 6px; font-size: 11.5px; text-align: center; color: var(--tg-theme-hint-color) }
  #th { display: flex; flex-direction: column; gap: 4px }
  .m { max-width: 80%; padding: 6px 10px 5px; border-radius: 14px; font-size: 13.5px; line-height: 1.35 }
  .m i { display: block; margin-top: 1px; font-size: 10.5px; font-style: normal; text-align: right; opacity: .6 }
  .in { align-self: flex-start; border-bottom-left-radius: 4px; background: var(--tg-theme-secondary-bg-color) }
  .me { align-self: flex-end; border-bottom-right-radius: 4px; background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color) }
  .qr { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px }
  .qr button { padding: 6px 11px; font-size: 13px }
  .qr .x { background: none; color: var(--tg-theme-hint-color) }
</style>
<div class="an"><b>Anchor: bottom</b> (setResizeAnchor('bottom')). Tap a quick reply: new messages appear at the bottom, the bubble grows upward and the replies stay under your finger.</div>
<div class="hd"><div class="av">🛵</div><div><div class="nm">Courier help</div><div class="st">Order #4821 · usually replies at once</div></div></div>
<div class="old" id="old" hidden></div>
<div id="th"></div>
<div class="qr" id="qr"></div>
<script>
  // Before the first message: every height change from here on keeps the bubble's bottom where it is.
  if (window.TelegramWidget && typeof TelegramWidget.setResizeAnchor === 'function') TelegramWidget.setResizeAnchor('bottom');

  var HELLO = 'Hi Alex! Your order #4821 left the depot this morning. How can I help?';
  var ANSWERS = {
    'Where is my parcel?': 'It is in Sam’s van, three stops away: about 25 minutes. You will get a message when Sam is around the corner.',
    'Change the time': 'I can move it to tonight 18:00–20:00 or tomorrow 09:00–12:00. Tell me which and I will let Sam know.',
    'Leave it at the door': 'Done: Sam will leave it at your door and send you a photo of where it is.',
    'Talk to a person': 'I have asked a colleague to join this chat. The wait right now is about 4 minutes.',
  };
  var KEY = 'thread', CAP = 540;
  var th = document.getElementById('th'), old = document.getElementById('old');
  var msgs, hidden = 0;
  try { msgs = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!Array.isArray(msgs)) msgs = [['in', HELLO, '09:41']];

  // The last 20 messages are plenty for a bubble that shows about ten.
  function save() { msgs = msgs.slice(-20); try { localStorage.setItem(KEY, JSON.stringify(msgs)); } catch (e) {} }
  function bubble(m) {
    var d = document.createElement('div');
    d.className = 'm ' + m[0];
    d.textContent = m[1];
    var t = document.createElement('i');
    t.textContent = m[2];
    d.appendChild(t);
    th.appendChild(d);
  }
  // The bubble has room for about 540 px: older messages fold into the line above the thread.
  function fit() {
    for (;;) {
      old.hidden = !hidden;
      old.textContent = hidden + (hidden === 1 ? ' earlier message' : ' earlier messages');
      if (th.children.length <= 2 || document.documentElement.offsetHeight <= CAP) return;
      th.removeChild(th.firstChild);
      hidden++;
    }
  }
  // A minute after the last message.
  function clock() {
    var t = msgs[msgs.length - 1][2].split(':'), m = (t[0] * 60 + +t[1] + 1) % 1440;
    return String(m / 60 | 0).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  }
  function ask(q) {
    var at = clock();
    msgs.push(['me', q, at], ['in', ANSWERS[q], at]);
    bubble(msgs[msgs.length - 2]);
    bubble(msgs[msgs.length - 1]);
    save();
    fit();
  }
  msgs.forEach(bubble);
  fit();

  var qr = document.getElementById('qr');
  Object.keys(ANSWERS).forEach(function (q) {
    var b = document.createElement('button');
    b.textContent = q;
    b.addEventListener('click', function () { ask(q); });
    qr.appendChild(b);
  });
  var x = document.createElement('button');
  x.className = 'x';
  x.textContent = 'Start over';
  // Shrinking keeps the bottom too: the top of the bubble moves down.
  x.addEventListener('click', function () {
    msgs = [['in', HELLO, '09:41']];
    hidden = 0;
    th.replaceChildren();
    msgs.forEach(bubble);
    save();
    fit();
  });
  qr.appendChild(x);
</script>
