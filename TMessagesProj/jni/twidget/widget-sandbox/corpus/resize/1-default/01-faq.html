<!--
  resize: no setResizeAnchor call, so the default anchor, top (corpus/resize/README.md)
  idea: a delivery FAQ whose answers open on a tap. The widget never calls setResizeAnchor, so the anchor is the default, top: the bubble grows and shrinks downward, its top edge stays put and the messages below it move.
-->
<title>Delivery FAQ</title>
<style>
  body { margin: 0; padding: 12px 14px 6px }
  .an { margin: 0 0 10px; padding: 6px 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; background: var(--tg-theme-secondary-bg-color); color: var(--tg-theme-hint-color) }
  .an b { color: var(--tg-theme-text-color) }
  h1 { margin: 0 0 2px; font-size: 17px }
  .sub { margin: 0 0 4px; font-size: 13px; color: var(--tg-theme-hint-color) }
  .q { border-bottom: 1px solid var(--tg-theme-section-separator-color) }
  .q:last-child { border-bottom: 0 }
  .t { display: flex; gap: 10px; align-items: baseline; padding: 10px 0; font-size: 14px; font-weight: 600; cursor: pointer }
  .t span { flex: 1 }
  .t::after { content: '+'; font-size: 18px; line-height: 1; color: var(--tg-theme-link-color); transition: transform .2s }
  .open .t::after { transform: rotate(45deg) }
  .a { display: none; margin: -4px 0 12px; font-size: 13px; line-height: 1.45; color: var(--tg-theme-subtitle-text-color) }
  .open .a { display: block }
  .a b { color: var(--tg-theme-text-color); font-weight: 600 }
</style>
<div class="an"><b>Anchor: top</b> (the default, no call). Tap a question: its answer opens below, the bubble grows downward and the messages under it move; its top stays.</div>
<h1>📦 Delivery questions</h1>
<p class="sub">Parcel Express · answers from our help centre</p>
<div id="faq"></div>
<script>
  var QA = [
    ['When will my parcel arrive?', 'Most parcels arrive in <b>2–4 working days</b>. The evening before, we send the courier’s two-hour window.'],
    ['Can I change the address?', 'Yes, until the parcel leaves the depot: open the tracking page and tap <b>Change address</b>. After that the courier can only redirect it to a pickup point.'],
    ['What if I am not at home?', 'The courier tries once more the next working day, then the parcel waits <b>7 days</b> at the nearest pickup point. Bring the code from your message.'],
    ['How do I return an item?', 'Pack it, print the label from your order page and drop it at any pickup point within <b>30 days</b>. The refund arrives 3–5 days after we scan it.'],
    ['Is there a fee for heavy parcels?', 'Up to 20 kg delivery is included. Above that we add <b>€4.90</b> for a two-person delivery, shown before you pay.'],
  ];
  var faq = document.getElementById('faq');
  QA.forEach(function (qa) {
    var q = document.createElement('div');
    q.className = 'q';
    q.innerHTML = '<div class="t" role="button"><span></span></div><div class="a"></div>';
    q.firstChild.firstChild.textContent = qa[0];
    q.lastChild.innerHTML = qa[1];
    // One answer open at a time: a tap opens it (and closes the open one), a second tap closes it.
    q.firstChild.addEventListener('click', function () {
      var was = q.classList.contains('open');
      [].forEach.call(faq.children, function (c) { c.classList.remove('open'); });
      if (!was) q.classList.add('open');
    });
    faq.appendChild(q);
  });
</script>
