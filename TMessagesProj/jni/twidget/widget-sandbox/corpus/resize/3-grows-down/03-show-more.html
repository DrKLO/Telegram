<!--
  resize: setResizeAnchor('top') said explicitly (the default) (corpus/resize/README.md)
  idea: hotel search results that open two more at a time with Show more and fold back with Show fewer. The widget calls setResizeAnchor('top') (the default, said explicitly), so the bubble grows and shrinks downward: its top and the results you were reading stay put, the button and the messages below move.
-->
<title>Hotels in Lisbon</title>
<style>
  body { margin: 0; padding: 12px 12px 10px }
  .an { margin: 0 0 10px; padding: 6px 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; background: var(--tg-theme-secondary-bg-color); color: var(--tg-theme-hint-color) }
  .an b { color: var(--tg-theme-text-color) }
  h1 { margin: 0; font-size: 17px }
  .sub { margin: 2px 0 6px; font-size: 13px; color: var(--tg-theme-hint-color) }
  .r[hidden] { display: none }
  .r { display: flex; gap: 10px; align-items: center; padding: 5px 0; border-top: 1px solid var(--tg-theme-section-separator-color) }
  .ph { flex: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 18px; background: var(--tg-theme-secondary-bg-color) }
  .tx { flex: 1; min-width: 0 }
  .nm { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .ds { font-size: 12px; color: var(--tg-theme-hint-color) }
  .pr { flex: none; text-align: right; font-size: 14px; font-weight: 600 }
  .pr small { display: block; font-size: 11px; font-weight: 400; color: var(--tg-theme-hint-color) }
  .more { display: block; width: 100%; margin-top: 6px }
</style>
<div class="an"><b>Anchor: top</b> (setResizeAnchor('top'), the default said explicitly). Tap Show more: results open below and the bubble grows downward, its top stays.</div>
<h1>🏨 Hotels in Lisbon</h1>
<p class="sub">12–14 Nov · 2 guests · 7 found, cheapest first</p>
<div id="list"></div>
<button class="more" id="more"></button>
<script>
  // The default, said explicitly: this widget always grows downward.
  if (window.TelegramWidget && typeof TelegramWidget.setResizeAnchor === 'function') TelegramWidget.setResizeAnchor('top');

  var HOTELS = [
    ['🌿', 'Casa do Jardim', 'Príncipe Real · 8.9 · 0.4 km', 74],
    ['🚋', 'Tram 28 Rooms', 'Graça · 8.4 · 1.2 km', 81],
    ['🌊', 'Ribeira Flats', 'Cais do Sodré · 8.7 · 0.9 km', 96],
    ['🏰', 'Hotel Baixa Real', 'Baixa · 9.1 · 0.2 km', 112],
    ['🎨', 'Lx Design Hostel', 'Alcântara · 8.2 · 3.1 km', 119],
    ['🌞', 'Miradouro Suites', 'Alfama · 9.3 · 1.0 km', 138],
    ['🍷', 'Bairro Alto Loft', 'Bairro Alto · 8.8 · 0.6 km', 145],
  ];
  var STEP = 2, shown = 3;
  var list = document.getElementById('list'), more = document.getElementById('more');
  HOTELS.forEach(function (h) {
    var r = document.createElement('div');
    r.className = 'r';
    r.innerHTML = '<div class="ph"></div><div class="tx"><div class="nm"></div><div class="ds"></div></div><div class="pr"><small>per night</small></div>';
    r.querySelector('.ph').textContent = h[0];
    r.querySelector('.nm').textContent = h[1];
    r.querySelector('.ds').textContent = h[2];
    r.querySelector('.pr').prepend('€' + h[3]);
    list.appendChild(r);
  });
  function render() {
    [].forEach.call(list.children, function (r, i) { r.hidden = i >= shown; });
    var left = HOTELS.length - shown;
    more.textContent = left > 0 ? 'Show ' + Math.min(STEP, left) + ' more' : 'Show fewer';
  }
  more.addEventListener('click', function () {
    shown = shown < HOTELS.length ? Math.min(HOTELS.length, shown + STEP) : 3;
    render();
  });
  render();
</script>
