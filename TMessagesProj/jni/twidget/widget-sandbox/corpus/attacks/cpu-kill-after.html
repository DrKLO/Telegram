<!DOCTYPE html>
<!-- Sustained CPU hog for the opt-in kill: with cpuKillAfterMs > 0 (off by
     default; the dev UI takes ?cpuKillAfterMs=2000) the widget is terminated
     after that much uninterrupted throttling and its last render stays. -->
<html><head><meta charset="utf-8"></head><body>
<h3 id="keep">Price alert: BTC 61 240 USD</h3><p>ticks: <span id="ticks">0</span></p>
<script>
  var ticks = 0;
  setInterval(function () {
    var t = performance.now();
    while (performance.now() - t < 45) {}
    document.getElementById('ticks').textContent = ++ticks;
  }, 50);
</script>
</body></html>
