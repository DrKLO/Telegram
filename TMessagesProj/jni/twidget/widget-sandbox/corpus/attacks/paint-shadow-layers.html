<!-- Paint limit (docs/decisions.md, "Heavy boxes"): 120 dots, each with 1000 blurred box-shadow layers, and the container
     moved by a pixel every frame so all of it repaints (the paint-limits draft measured 2–8 fps for a whole page in
     Chrome). The renderer counts 120 heavy boxes before the first frame with them and stops the widget ("Paint limit
     exceeded: 120 boxes …"); the frozen frame has no blurred shadow, and the page keeps its frame rate. compat counts
     nothing. -->
<style>body{margin:0}#r{display:flex;flex-wrap:wrap;gap:6px;padding:8px}</style>
<div id="r"></div>
<script>
var L = [];
for (var i = 0; i < 1000; i++) L.push((i % 9 - 4) + 'px ' + (i % 7 - 3) + 'px ' + (8 + i % 24) + 'px #48f1');
var s = document.createElement('style');
s.textContent = '.d{width:22px;height:22px;border-radius:50%;background:#48f;box-shadow:' + L.join(',') + '}';
document.head.appendChild(s);
var r = document.getElementById('r');
for (var j = 0; j < 120; j++) { var d = document.createElement('div'); d.className = 'd'; r.appendChild(d); }
var n = 0;
function f() { r.style.paddingLeft = (8 + (n++ & 1)) + 'px'; requestAnimationFrame(f); }
requestAnimationFrame(f);
</script>
