<!-- the wallet without a real tap (docs/sdk-v1.md §2.18). Timers, promise jobs, frames, a scripted click, a synthetic
     pointer event, animation events and the answer to a background request (the attack suite opens it in the private
     chat with the bot, where background requests are allowed, and its answer grants nothing) all try to open the
     wallet window; none may reach the client. A canary URL as the address never leaves the widget. Only the real tap
     on #go opens the window, once. -->
<div class="widget"><button id="go">pay once</button><div id="anim" style="animation: a .01s 3"></div><p id="log"></p></div>
<style>@keyframes a { to { opacity: .5; } }</style>
<script>
var T = TelegramWidget, log = [];
var TX = { messages: [{ address: 'EQ' + '9'.repeat(46), amount: '1' }] };
function note(t) { log.push(t); document.getElementById('log').textContent = log.slice(-8).join(' · '); }
function pay(from) {
  try { T.wallet.sendTransaction(TX, from).then(function () { note(from + ':sent'); }, function (e) { note(from + ':' + e.code); }); } catch (e) { note(from + ':' + e.name); }
}
setTimeout(function () { pay('timer'); }, 0);
Promise.resolve().then(function () { pay('promise'); });
requestAnimationFrame(function () { pay('frame'); });
document.getElementById('anim').addEventListener('animationiteration', function () { pay('animation'); });
T.request('bg').then(function () { pay('background-answer'); }, function (e) { note('bg:' + e.code); });
try { T.wallet.sendTransaction({ messages: [{ address: 'http://127.0.0.1:9999/hit/wallet-address', amount: '1' }] }, 'canary'); } catch (e) { note('canary:' + e.name); }
setTimeout(function () {
  var b = document.getElementById('go');
  b.addEventListener('pointerdown', function (e) { if (!e.isTrusted) pay('synthetic-pointerdown'); });
  b.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
  b.click();
}, 50);
document.getElementById('go').addEventListener('click', function (e) { pay(e.isTrusted ? 'tap' : 'synthetic-click'); });
</script>
