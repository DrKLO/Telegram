<!-- two requests in flight. A tap sends one; the widget then tries a second one in the same tap, from the
     answer-less wait (timers), and with a forged id on the wire. While the first is unanswered the client must see
     exactly one. -->
<div class="widget"><button id="go">tap</button><p id="log"></p></div>
<script>
var T = TelegramWidget, stringify = JSON.stringify, forge = false, codes = [];
// The shim keeps one request of its own in flight; a second one can only be forged onto the wire, here in place of ready().
JSON.stringify = function (v) { if (forge && Array.isArray(v) && v[0] === 'ready') v = ['request', [999, 'forged second']]; return stringify(v); };
function note(c) { codes.push(c); document.getElementById('log').textContent = codes.join(' '); }
document.getElementById('go').addEventListener('click', function () {
  T.request('first').then(function () { note('first:ok'); }, function (e) { note('first:' + e.code); });
  T.request('second').catch(function (e) { note('second:' + e.code); });
  forge = true; T.ready(); forge = false;
  setTimeout(function () { T.request('timer').catch(function (e) { note('timer:' + e.code); }); }, 10);
});
</script>
