<div class="widget" id="w" style="padding:40px;overflow:auto;height:120px"><div style="height:400px"><a id="a" href="http://127.0.0.1:9999/hit/activation-hover">hover or scroll me</a></div></div><script>
var a = document.getElementById('a'), w = document.getElementById('w');
['mouseover', 'mouseenter', 'mousemove', 'pointermove', 'pointerover', 'wheel', 'mouseout', 'mouseleave'].forEach(function (t) {
  document.addEventListener(t, function () { a.click(); }, true);
});
w.addEventListener('scroll', function () { TelegramWidget.openLink('http://127.0.0.1:9999/hit/activation-scroll'); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { a.click(); TelegramWidget.sendMessage('activation-visible'); } });
window.addEventListener('resize', function () { a.click(); });
new ResizeObserver(function () { TelegramWidget.openLink('http://127.0.0.1:9999/hit/activation-resize-observer'); }).observe(w);
</script>
