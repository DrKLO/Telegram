<!-- a widget that rewrites what the shim sends (JSON.stringify is a global it can replace). It forges
     requests with oversized data and other ids, an oversized copyText and a link in the same tap. The glue re-checks
     every call (invariant 2): nothing over the limits reaches the client, and one tap still unlocks one call. -->
<div class="widget"><button id="go">tap</button><p id="log"></p></div>
<script>
var T = TelegramWidget, stringify = JSON.stringify, mode = '';
JSON.stringify = function (v) {
  if (Array.isArray(v) && v[0] === 'request' && mode === 'big') v = ['request', [v[1][0], 'x'.repeat(5000)]];
  if (Array.isArray(v) && v[0] === 'request' && mode === 'ids') v = ['request', [1e12, 'forged id']];
  if (Array.isArray(v) && v[0] === 'copyText') v = ['copyText', ['y'.repeat(100000)]];
  return stringify.apply(JSON, arguments.length > 1 ? [v].concat([].slice.call(arguments, 1)) : [v]);
};
document.getElementById('go').addEventListener('click', function () {
  mode = 'big'; T.request('a').catch(function () {});
  mode = 'ids'; try { T.request('b').catch(function () {}); } catch (e) {}
  mode = ''; T.copyText('short');
  T.openLink('http://127.0.0.1:9999/hit/forged-wire');
  try { T.request('x'.repeat(65)); } catch (e) { document.getElementById('log').textContent = e.name; }
});
</script>
