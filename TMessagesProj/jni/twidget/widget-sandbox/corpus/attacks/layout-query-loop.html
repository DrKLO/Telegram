<!DOCTYPE html>
<!-- A forced-layout loop: every iteration writes a style and reads
     `offsetHeight`, which the shim answers with a synchronous query to the
     renderer. The widget burns almost no JS CPU of its own, so the CPU slice
     alone would never fire, while the host answers queries for as long as the
     loop runs. The layout-query budget (docs/decisions.md, Runtime limits)
     kills it within the task's slice: "Layout query limit exceeded" when the
     renderer's round trip dominates (the iframe renderer, the native WebViews),
     "CPU limit exceeded" when it answers fast enough for the loop's own CPU to
     reach the slice first (the Shadow DOM renderer, headless twidget-run). Either
     way the renderer stays responsive, the last render is kept, 0 canary hits. -->
<html><head><meta charset="utf-8"></head><body>
<div id="a" style="height:20px;background:#9cf">layout loop</div>
<p>queries: <span id="n">0</span></p>
<script>
  var a = document.getElementById('a'), n = document.getElementById('n'), i = 0;
  for (;;) {
    a.style.width = (i % 300) + 'px';
    a.offsetHeight;
    if (++i % 50 === 0) n.textContent = String(i);
  }
</script>
</body></html>
