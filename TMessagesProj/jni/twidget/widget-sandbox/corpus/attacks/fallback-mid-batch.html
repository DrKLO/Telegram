<!DOCTYPE html>
<!-- A task that mutates the DOM and then hangs: none of its mutations may reach
     the renderer (the shim flushes ops at the end of a task only), so the
     previous consistent state stays on screen. -->
<html><head><meta charset="utf-8"></head><body>
<p id="status">ready</p><ul id="list"></ul><button id="go">Go</button>
<script>
  document.getElementById('go').addEventListener('click', function () {
    document.getElementById('status').textContent = 'mutating';
    var list = document.getElementById('list');
    for (var i = 0; i < 500; i++) { var li = document.createElement('li'); li.textContent = 'item ' + i; list.appendChild(li); }
    for (;;) {}
  });
</script>
</body></html>
