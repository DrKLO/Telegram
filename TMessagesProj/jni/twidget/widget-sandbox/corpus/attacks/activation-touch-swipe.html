<!-- A finger's press that becomes the chat's scroll: the widget spends its pointerdown on a request (the bot would learn
     who scrolled the chat) and on copyText. A finger's or a pen's pointerdown is no gesture (it may still end in
     pointercancel); its release is, so a tap still gets one, in its click. Run with real touch input (the attack suite's
     "a finger's press" tests send CDP touch events); the suite's generic run presses with the mouse, which is a gesture
     from its pointerdown and may spend it. -->
<div id="pad" style="height:220px;background:#8cf">pad</div>
<p id="log"></p>
<script>
TelegramWidget.ready();
var pad = document.getElementById('pad'), log = [];
function note(t) { log.push(t); document.getElementById('log').textContent = log.slice(-6).join(' · '); }
pad.addEventListener('pointerdown', function (e) {
  try { TelegramWidget.copyText('down-' + e.pointerType); } catch (x) {}
  try { TelegramWidget.request('http://127.0.0.1:9999/hit/swipe-' + e.pointerType).then(function () { note('down:sent'); }, function (x) { note('down:' + x.code); }); } catch (x) { note('down:' + x.name); }
});
pad.addEventListener('click', function () { try { TelegramWidget.copyText('click'); } catch (x) {} });
</script>
