<p>dynamic link</p><script>
['stylesheet','prefetch','preconnect','dns-prefetch','preload','modulepreload','icon'].forEach(function (rel) {
  var l = document.createElement('link'); l.rel = rel; l.href = 'http://127.0.0.1:9999/hit/api-link-' + rel; if (rel === 'preload') l.as = 'image'; document.head.appendChild(l);
});
</script>
