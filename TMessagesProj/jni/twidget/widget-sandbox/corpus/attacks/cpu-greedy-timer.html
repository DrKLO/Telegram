<!DOCTYPE html>
<!-- CPU hog within the per-task limit: a 100 ms interval whose every tick burns
     40 ms (40 % of a core, legal under cpuLimitMs alone). The quota (300 ms/s)
     must throttle it — ticks are deferred, not killed — and clicks must still
     be handled. -->
<html><head><meta charset="utf-8"></head><body>
<p>ticks: <span id="ticks">0</span></p><button id="btn">click me</button> <span id="clicks">0</span>
<script>
  var ticks = 0, clicks = 0;
  setInterval(function () {
    var t = performance.now();
    while (performance.now() - t < 40) {}
    document.getElementById('ticks').textContent = ++ticks;
  }, 100);
  document.getElementById('btn').addEventListener('click', function () { document.getElementById('clicks').textContent = ++clicks; });
</script>
</body></html>
