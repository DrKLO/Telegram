<!DOCTYPE html>
<!-- Memory exhaustion, steady growth: retain an ever-larger array of 1 MB
     typed-array chunks until the engine refuses to allocate. The sandbox must
     stop THIS widget (memoryLimitBytes, 64 MB default) with an "out of memory"
     that the worker turns into a clean kill — the host process must NOT grow
     unbounded and other widgets must keep running. The last good render stays
     on screen as the frozen fallback. -->
<html><head><meta charset="utf-8"></head><body>
<script>
  // Engine memory-cap probe. No DOM, no framework — pure JS.
// Run it in ANY JS engine: JSC directly, QuickJS, or wrap the call in render():
//    function render() { return '<p>' + memCapProbe() + '</p>'; }
// Returns a one-line verdict string. A capped engine refuses the allocation
// (throws) and reports where it stopped. An uncapped engine grows the process
// until the OS steps in (on iOS: jetsam kills the whole app).
function memCapProbe() {
  // 1) steady growth: retain 1 MB chunks until the engine refuses
  var kept = [], steady;
  try {
    for (var i = 0; i < 8192; i++) {                 // up to 8 GB of intent
      var c = new Uint8Array(1048576);
      c[0] = 1; c[c.length - 1] = 1;                 // touch pages, make them real
      kept.push(c);
    }
    steady = 'steady: NOT CAPPED, reached ' + kept.length + ' MB';
  } catch (e) {
    steady = 'steady: capped at ' + kept.length + ' MB (' + e.name + ')';
  }
  kept = null;

  // 2) single burst in one synchronous call — the 256 MB case from the
  //    QuickJS-vs-JSC doc. A between-ticks footprint poller cannot catch this.
  var burst;
  try {
    var b = new Uint8Array(256 * 1048576);
    b[0] = 1; b[b.length - 1] = 1;
    burst = 'burst: NOT CAPPED, 256 MB allocated';
  } catch (e) {
    burst = 'burst: refused (' + e.name + ')';
  }
  return steady + ' | ' + burst;
}

// Node / standalone:
if (typeof print === 'function') print(memCapProbe());
else if (typeof console !== 'undefined') console.log(memCapProbe());

</script>
</body></html>
