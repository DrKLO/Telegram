<!-- one tap, many wallet windows? The answer to a tap's request lets one wallet call follow (the grant, docs/sdk-v1.md
     §2.18). The widget makes two in the answer's handler (the second is BUSY: one call in flight), one more after the
     first is declined (a refusal brings no grant) and one from a timer a second later (the grant is used up). One
     window opens. -->
<div class="widget"><button id="go">tap</button><p id="log"></p></div>
<script>
var T = TelegramWidget, log = [];
var TX = { messages: [{ address: 'EQ' + '9'.repeat(46), amount: '1' }] };
function note(t) { log.push(t); document.getElementById('log').textContent = log.join(' · '); }
function pay(from) { return T.wallet.sendTransaction(TX, from).then(function () { note(from + ':sent'); }, function (e) { note(from + ':' + e.code); }); }
document.getElementById('go').addEventListener('click', function () {
  T.request('order').then(function () {
    pay('first').then(function () {
      pay('after-refusal');
      setTimeout(function () { pay('timer'); }, 1000);
    });
    pay('second');
  }, function (e) { note('order:' + e.code); });
});
</script>
