<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabs & accordion</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #fff; color: #222; }
  .tabs { display: flex; gap: 4px; border-bottom: 2px solid #ddd; }
  .tab { padding: 8px 14px; border: 0; background: none; cursor: pointer; font-size: 14px; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab.active { color: #2481cc; border-bottom-color: #2481cc; font-weight: 600; }
  .panel { display: none; padding: 12px 4px; }
  .panel.active { display: block; }
  .acc { border: 1px solid #ddd; border-radius: 8px; margin-top: 12px; overflow: hidden; }
  .acc-h { padding: 10px 12px; background: #f5f6f8; cursor: pointer; display: flex; justify-content: space-between; }
  .acc-b { display: none; padding: 10px 12px; border-top: 1px solid #ddd; }
  .acc.open .acc-b { display: block; }
  .acc.open .acc-h span { transform: rotate(90deg); }
  .acc-h span { transition: transform .2s; display: inline-block; }
</style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" id="tab-1" onclick="showTab(1)">Overview</button>
    <button class="tab" id="tab-2" onclick="showTab(2)">Details</button>
    <button class="tab" id="tab-3" onclick="showTab(3)">FAQ</button>
  </div>
  <div class="panel active" id="panel-1">This widget uses <code>onclick</code> attributes and plain DOM toggling.</div>
  <div class="panel" id="panel-2">Details panel. Counter: <b id="count">0</b> <button onclick="bump()">+1</button></div>
  <div class="panel" id="panel-3">
    <div class="acc" id="acc-1"><div class="acc-h" onclick="toggleAcc('acc-1')">What is this? <span>▸</span></div><div class="acc-b">An accordion.</div></div>
    <div class="acc" id="acc-2"><div class="acc-h" onclick="toggleAcc('acc-2')">Does it work? <span>▸</span></div><div class="acc-b">Yes, if you can read this.</div></div>
  </div>
  <script>
    var n = 0;
    function showTab(i) {
      document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.id === 'tab-' + i); });
      document.querySelectorAll('.panel').forEach(function (p) { p.classList.toggle('active', p.id === 'panel-' + i); });
    }
    function bump() { document.getElementById('count').textContent = ++n; }
    function toggleAcc(id) { document.getElementById(id).classList.toggle('open'); }
  </script>
</body>
</html>
