<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #fff; } #fallback { display: none; padding: 20px; background: #fef3c7; border-radius: 8px; color: #92400e; } canvas { width: 100%; height: 200px; display: block; }</style>
</head><body>
<canvas id="c"></canvas>
<div id="fallback">3D preview isn't available here. (WebGL / Three.js not supported in this runtime.)</div>
<script>
  if (typeof THREE === 'undefined' || !document.getElementById('c').getContext('webgl')) {
    document.getElementById('c').style.display = 'none';
    document.getElementById('fallback').style.display = 'block';
  } else {
    var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c') });
    var scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(60, 2, 0.1, 100); camera.position.z = 3;
    var cube = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshNormalMaterial()); scene.add(cube);
    (function loop() { cube.rotation.x += 0.01; cube.rotation.y += 0.02; renderer.render(scene, camera); requestAnimationFrame(loop); })();
  }
</script>
</body></html>
