<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; background: #fff; color: #222; }
  .row { display: flex; align-items: center; gap: 16px; }
  .spinner { width: 36px; height: 36px; border: 4px solid #e5e7eb; border-top-color: #2481cc; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card { margin-top: 14px; padding: 12px; border-radius: 10px; background: #f3f4f6; transition: transform .3s, background .3s; transform-origin: left center; }
  .card.big { transform: scale(1.08); background: #dbeafe; }
  .pulse { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #16a34a; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.7); } }
  button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
  .slide { animation: slide .6s ease-out both; } @keyframes slide { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: none; } }
</style></head><body>
<div class="row"><div class="spinner" id="spinner"></div><span class="pulse"></span> <span>CSS keyframes, no JS involved</span></div>
<div class="card slide" id="card">Transition on class toggle → <button id="toggle">toggle</button> <span id="events">0 transitionend</span></div>
<script>
  var card = document.getElementById('card'), n = 0;
  document.getElementById('toggle').addEventListener('click', function () { card.classList.toggle('big'); });
  card.addEventListener('transitionend', function () { document.getElementById('events').textContent = (++n) + ' transitionend'; });
</script>
</body></html>
