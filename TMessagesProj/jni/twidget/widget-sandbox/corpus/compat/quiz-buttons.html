<!DOCTYPE html>
<!-- out-of-profile/quiz.html on profile 1: the radio buttons and checkboxes (form controls, out of the profile)
     become answer buttons — one choice for questions 1 and 2, any number for question 3 — with aria-pressed as
     the state. Check answers marks each question right or wrong; the answers and the result are kept in
     localStorage (SDK v1 per-message state) and restored on load. -->
<html><head><meta charset="utf-8"><style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; background: #fff; color: #222; }
  .q { border: 1px solid #ddd; border-radius: 8px; margin: 0 0 10px; padding: 10px 12px; }
  .q h4 { margin: 0 0 6px; font-size: 14px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 16px; background: #fff; color: #222; font: 14px system-ui, sans-serif; cursor: pointer; }
  .multi .opt { border-radius: 6px; }
  .opt[aria-pressed="true"] { background: #2481cc; border-color: #2481cc; color: #fff; }
  .q.correct { border-color: #16a34a; background: #f0fdf4; } .q.wrong { border-color: #dc2626; background: #fef2f2; }
  #submit { padding: 10px 16px; border: 0; border-radius: 6px; background: #2481cc; color: #fff; font-size: 14px; cursor: pointer; }
  #score { margin-top: 10px; font-size: 18px; font-weight: 700; min-height: 22px; }
</style></head><body>
<div id="quiz">
  <section class="q" id="q1"><h4>1. Capital of Australia?</h4><div class="opts">
    <button class="opt" data-q="q1" data-v="sydney">Sydney</button>
    <button class="opt" data-q="q1" data-v="canberra" id="q1-right">Canberra</button>
    <button class="opt" data-q="q1" data-v="melbourne">Melbourne</button></div></section>
  <section class="q" id="q2"><h4>2. 7 × 8 = ?</h4><div class="opts">
    <button class="opt" data-q="q2" data-v="54">54</button>
    <button class="opt" data-q="q2" data-v="56" id="q2-right">56</button>
    <button class="opt" data-q="q2" data-v="58" id="q2-wrong">58</button></div></section>
  <section class="q multi" id="q3"><h4>3. Which are primes? (two answers)</h4><div class="opts">
    <button class="opt" data-q="q3" data-v="2" id="q3-a">2</button>
    <button class="opt" data-q="q3" data-v="9">9</button>
    <button class="opt" data-q="q3" data-v="11" id="q3-b">11</button></div></section>
  <button id="submit">Check answers</button>
  <div id="score"></div>
</div>
<script>
  var KEY = 'quiz-buttons';
  var answers = { q1: ['canberra'], q2: ['56'], q3: ['2', '11'] }, multi = { q3: true };
  var state = { chosen: { q1: [], q2: [], q3: [] }, checked: false };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && saved.chosen) Object.keys(state.chosen).forEach(function (q) { if (Array.isArray(saved.chosen[q])) state.chosen[q] = saved.chosen[q].map(String); });
    state.checked = !!(saved && saved.checked);
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function render() {
    document.querySelectorAll('.opt').forEach(function (b) { b.setAttribute('aria-pressed', String(state.chosen[b.dataset.q].indexOf(b.dataset.v) >= 0)); });
    var score = 0;
    Object.keys(answers).forEach(function (q) {
      var ok = state.chosen[q].slice().sort().join(',') === answers[q].slice().sort().join(',');
      if (ok) score++;
      document.getElementById(q).className = 'q' + (multi[q] ? ' multi' : '') + (state.checked ? (ok ? ' correct' : ' wrong') : '');
    });
    document.getElementById('score').textContent = state.checked ? 'Score: ' + score + ' / 3' + (score === 3 ? ' 🎉' : '') : '';
  }
  document.getElementById('quiz').addEventListener('click', function (e) {
    var b = e.target.closest('.opt');
    if (b) {
      var list = state.chosen[b.dataset.q], at = list.indexOf(b.dataset.v);
      if (multi[b.dataset.q]) { if (at >= 0) list.splice(at, 1); else list.push(b.dataset.v); }
      else state.chosen[b.dataset.q] = at >= 0 ? [] : [b.dataset.v];
      state.checked = false;
    } else if (e.target.closest('#submit')) state.checked = true;
    else return;
    save(); render();
  });
  render();
</script>
</body></html>
