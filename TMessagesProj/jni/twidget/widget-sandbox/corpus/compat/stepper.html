<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; background: #fff; color: #222; }
  .bar { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; } .bar i { display: block; height: 100%; background: #2481cc; width: 0; transition: width .3s; }
  .steps { display: flex; justify-content: space-between; margin: 8px 0 14px; font-size: 12px; color: #999; } .steps b { color: #2481cc; }
  .panel { min-height: 60px; padding: 12px; background: #f9fafb; border-radius: 8px; }
  .nav { display: flex; justify-content: space-between; margin-top: 12px; }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; } button:disabled { opacity: .4; cursor: default; } button.primary { background: #2481cc; color: #fff; border-color: #2481cc; }
</style></head><body>
<div class="bar"><i id="fill"></i></div>
<div class="steps" id="steps"></div>
<div class="panel" id="panel"></div>
<div class="nav"><button id="back">Back</button><button id="next" class="primary">Next</button></div>
<script>
  // SDK v1: the step and the finished state are local state in localStorage (restored on load); nothing is sent.
  var KEY = 'onboarding-stepper';
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ step: i, done: done })); } catch (e) {} }
  var steps = [['Account', 'Create your account with an email address.'], ['Profile', 'Tell us a little about yourself.'], ['Preferences', 'Choose notification settings.'], ['Done', 'All set! 🎉']];
  var saved = load();
  var i = Math.max(0, Math.min(steps.length - 1, Number(saved.step) || 0)), done = saved.done === true;
  function render() {
    document.getElementById('fill').style.width = (i / (steps.length - 1) * 100) + '%';
    document.getElementById('steps').innerHTML = steps.map(function (s, j) { return j === i ? '<b>' + s[0] + '</b>' : '<span>' + s[0] + '</span>'; }).join('');
    document.getElementById('panel').innerHTML = '<h3 style="margin:0 0 6px">' + steps[i][0] + '</h3>' + (done ? 'Onboarding complete. Saved for this message: it stays finished when you come back.' : steps[i][1]);
    document.getElementById('back').disabled = i === 0;
    document.getElementById('back').textContent = done ? 'Start over' : 'Back';
    document.getElementById('next').disabled = done;
    document.getElementById('next').textContent = done ? 'Finished' : i === steps.length - 1 ? 'Finish' : 'Next';
  }
  document.getElementById('back').addEventListener('click', function () { if (done) { i = 0; done = false; } else if (i > 0) i--; save(); render(); });
  document.getElementById('next').addEventListener('click', function () { if (done) return; if (i < steps.length - 1) i++; else done = true; save(); render(); });
  render();
</script>
</body></html>
