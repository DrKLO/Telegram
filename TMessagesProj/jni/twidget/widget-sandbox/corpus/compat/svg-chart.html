<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #fff; color: #222; }
  svg { width: 100%; height: auto; display: block; }
  .bar { fill: #2481cc; transition: fill .15s; cursor: pointer; } .bar:hover, .bar.active { fill: #f59e0b; }
  .label { font-size: 11px; fill: #555; } .value { font-size: 11px; fill: #222; font-weight: 600; }
  #tip { font-size: 13px; color: #444; min-height: 18px; margin-top: 6px; }
</style></head><body>
<h3 style="margin:0 0 6px;font-size:15px">Monthly revenue</h3>
<svg id="chart" viewBox="0 0 380 200" role="img"></svg>
<div id="tip">Hover or tap a bar</div>
<script>
  var NS = 'http://www.w3.org/2000/svg';
  var data = [['Jan', 42], ['Feb', 58], ['Mar', 35], ['Apr', 71], ['May', 64], ['Jun', 90]];
  var svg = document.getElementById('chart');
  var W = 380, H = 200, pad = { l: 36, r: 10, t: 10, b: 30 };
  var max = Math.max.apply(null, data.map(function (d) { return d[1]; }));
  var bw = (W - pad.l - pad.r) / data.length;
  function el(name, attrs, parent) { var e = document.createElementNS(NS, name); for (var k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; }
  [0, 25, 50, 75, 100].forEach(function (v) {
    var y = pad.t + (H - pad.t - pad.b) * (1 - v / 100);
    el('line', { x1: pad.l, x2: W - pad.r, y1: y, y2: y, stroke: '#eee' });
    var t = el('text', { x: pad.l - 6, y: y + 4, 'text-anchor': 'end', class: 'label' }); t.textContent = v;
  });
  data.forEach(function (d, i) {
    var h = (H - pad.t - pad.b) * d[1] / max, x = pad.l + i * bw + bw * 0.15, y = H - pad.b - h;
    var r = el('rect', { class: 'bar', x: x, y: y, width: bw * 0.7, height: h, rx: 3, id: 'bar-' + i });
    var lbl = el('text', { x: x + bw * 0.35, y: H - pad.b + 14, 'text-anchor': 'middle', class: 'label' }); lbl.textContent = d[0];
    var val = el('text', { x: x + bw * 0.35, y: y - 4, 'text-anchor': 'middle', class: 'value' }); val.textContent = d[1] + 'k';
    // nudge the value label if it overflows the top (uses getBBox)
    var box = val.getBBox();
    if (box.y < 0) val.setAttribute('y', y + 12);
    function show() { document.querySelectorAll('.bar').forEach(function (b) { b.classList.remove('active'); }); r.classList.add('active'); document.getElementById('tip').textContent = d[0] + ': $' + d[1] + 'k (' + Math.round(d[1] / max * 100) + '% of best month)'; }
    r.addEventListener('mouseenter', show); r.addEventListener('click', show);
  });
</script>
</body></html>
