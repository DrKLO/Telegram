<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #fafafa; }
  .calc { width: 240px; margin: 0 auto; background: #222; border-radius: 12px; padding: 12px; }
  #display { background: #111; color: #fff; font: 28px/1 ui-monospace, monospace; text-align: right; padding: 12px 10px; border-radius: 6px; min-height: 28px; overflow: hidden; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  button { font-size: 18px; padding: 12px 0; border: 0; border-radius: 6px; background: #444; color: #fff; cursor: pointer; }
  button.op { background: #f59e0b; } button.eq { background: #16a34a; grid-column: span 2; } button:active { filter: brightness(1.2); }
</style></head><body>
<div class="calc">
  <div id="display">0</div>
  <div class="keys">
    <button onclick="clearAll()">C</button><button onclick="press('(')">(</button><button onclick="press(')')">)</button><button class="op" onclick="press('/')">÷</button>
    <button id="k7" onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="op" onclick="press('*')">×</button>
    <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="op" id="kminus" onclick="press('-')">−</button>
    <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button id="k3" onclick="press('3')">3</button><button class="op" id="kplus" onclick="press('+')">+</button>
    <button onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="eq" id="keq" onclick="calc()">=</button>
  </div>
</div>
<script>
  var expr = '';
  var display = document.getElementById('display');
  function render() { display.textContent = expr || '0'; }
  function press(ch) { if (display.dataset.result) { expr = ''; delete display.dataset.result; } expr += ch; render(); }
  function clearAll() { expr = ''; delete display.dataset.result; render(); }
  function calc() {
    try {
      if (!/^[\d+\-*/().\s]+$/.test(expr)) throw new Error('bad');
      var v = Function('"use strict"; return (' + expr + ')')();
      expr = String(Math.round(v * 1e10) / 1e10);
      display.dataset.result = '1';
    } catch (e) { expr = 'Error'; display.dataset.result = '1'; }
    render();
  }
</script>
</body></html>
