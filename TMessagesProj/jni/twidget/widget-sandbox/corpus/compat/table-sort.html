<!DOCTYPE html>
<!-- out-of-profile/sortable-table.html on profile 1: tap a column header to sort (again to reverse, ▲/▼ from
     ::after content); the text filter (a form control, out of the profile) becomes a row of city chips. The table
     body is rebuilt with innerHTML; the sort and the filter are kept in localStorage and restored on load. -->
<html><head><meta charset="utf-8"><style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #fff; color: #222; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chips button { padding: 4px 10px; border: 1px solid #ccc; border-radius: 14px; background: #fff; color: #222; font: 13px system-ui, sans-serif; cursor: pointer; }
  .chips button.on { background: #2481cc; border-color: #2481cc; color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; cursor: pointer; background: #f3f4f6; padding: 8px; white-space: nowrap; }
  th.asc::after { content: ' ▲'; } th.desc::after { content: ' ▼'; }
  td { padding: 8px; border-top: 1px solid #eee; }
  tr:nth-child(even) td { background: #fafafa; }
  #count { font-size: 12px; color: #666; margin-top: 6px; }
</style></head><body>
<div class="chips" id="chips"></div>
<table id="t">
  <thead><tr><th data-key="name" id="h-name">Name</th><th data-key="city" id="h-city">City</th><th data-key="score" id="h-score">Score</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="count"></div>
<script>
  var KEY = 'table-sort';
  var data = [
    { name: 'Alice', city: 'Berlin', score: 82 }, { name: 'Bob', city: 'Lisbon', score: 67 }, { name: 'Chen', city: 'Taipei', score: 91 },
    { name: 'Dana', city: 'Austin', score: 74 }, { name: 'Eve', city: 'Berlin', score: 58 }, { name: 'Farid', city: 'Dubai', score: 88 },
  ];
  var cities = data.map(function (r) { return r.city; }).filter(function (c, i, all) { return all.indexOf(c) === i; }).sort();
  var sortKey = 'name', dir = 1, city = '';
  try {
    var saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && ['name', 'city', 'score'].indexOf(saved.sortKey) >= 0) { sortKey = saved.sortKey; dir = saved.dir === -1 ? -1 : 1; }
    if (saved && cities.indexOf(saved.city) >= 0) city = saved.city;
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ sortKey: sortKey, dir: dir, city: city })); } catch (e) {} }
  document.getElementById('chips').innerHTML = ['<button data-city="" id="f-all">All</button>'].concat(cities.map(function (c) {
    return '<button data-city="' + c + '" id="f-' + c.toLowerCase() + '">' + c + '</button>';
  })).join('');
  function render() {
    var rows = data.filter(function (r) { return !city || r.city === city; });
    rows.sort(function (a, b) { return (a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0) * dir; });
    document.getElementById('rows').innerHTML = rows.map(function (r) { return '<tr><td>' + r.name + '</td><td>' + r.city + '</td><td>' + r.score + '</td></tr>'; }).join('');
    document.querySelectorAll('th').forEach(function (th) { th.className = th.dataset.key === sortKey ? (dir > 0 ? 'asc' : 'desc') : ''; });
    document.querySelectorAll('#chips button').forEach(function (b) { b.classList.toggle('on', b.dataset.city === city); });
    document.getElementById('count').textContent = rows.length + ' of ' + data.length + ' rows';
  }
  document.querySelectorAll('th').forEach(function (th) {
    th.addEventListener('click', function () { if (sortKey === th.dataset.key) dir = -dir; else { sortKey = th.dataset.key; dir = 1; } save(); render(); });
  });
  document.getElementById('chips').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) { city = b.dataset.city; save(); render(); }
  });
  render();
</script>
</body></html>
