<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #fff; } canvas { width: 100%; height: 160px; display: block; border-radius: 8px; } #fallback { display: none; padding: 16px; background: #fee2e2; color: #991b1b; border-radius: 8px; }</style></head><body>
<canvas id="gl"></canvas>
<div id="fallback">WebGL is not available — showing the 2D fallback below.</div>
<canvas id="c2d" style="display:none;height:120px"></canvas>
<script>
  var canvas = document.getElementById('gl');
  var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (gl) {
    gl.clearColor(0.1, 0.5, 0.8, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  } else {
    canvas.style.display = 'none';
    document.getElementById('fallback').style.display = 'block';
    var c = document.getElementById('c2d'); c.style.display = 'block'; c.width = 360; c.height = 120;
    var ctx = c.getContext('2d');
    var g = ctx.createLinearGradient(0, 0, 360, 0); g.addColorStop(0, '#1d4ed8'); g.addColorStop(1, '#60a5fa');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 360, 120);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'center'; ctx.fillText('2D fallback rendering', 180, 66);
  }
</script>
</body></html>
