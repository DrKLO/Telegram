<!DOCTYPE html>
<!-- out-of-profile/local-storage.html on profile 1 and SDK v1: no text field (no form controls, no keyboard), so
     notes come from preset chips. The list, the done marks and a visit counter live in localStorage — the
     per-message storage the client keeps when the widget is destroyed and re-created — and are restored on load;
     the footer shows the bytes used of the 16 KB quota, and a QuotaExceededError is reported, not thrown. -->
<html><head><meta charset="utf-8"><style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; background: #fff; color: #222; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .presets button { padding: 6px 10px; border: 1px solid #cfe0f1; border-radius: 14px; background: #eef5fc; color: #1f6fb2; font: 13px system-ui, sans-serif; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 0; } li { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid #eee; }
  li .text { flex: 1; cursor: pointer; } li.done .text { color: #999; text-decoration: line-through; }
  li button { padding: 2px 8px; border: 0; border-radius: 6px; background: #ef4444; color: #fff; font-size: 12px; cursor: pointer; }
  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  #meta { font-size: 12px; color: #666; font-variant-numeric: tabular-nums; }
  #clear { padding: 4px 10px; font-size: 12px; }
</style></head><body>
<div class="presets" id="presets">
  <button id="add-milk">Buy milk</button><button id="add-sam">Call Sam</button><button id="add-tests">Write tests</button><button id="add-flights">Book flights</button><button id="add-plants">Water plants</button>
</div>
<ul id="list"></ul>
<div class="foot"><span id="meta"></span><button id="clear">Clear</button></div>
<script>
  var KEY = 'notes-widget';
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); return ''; } catch (e) { return e && e.name === 'QuotaExceededError' ? 'storage full' : 'storage unavailable'; } },
  };
  // A list of strings is what out-of-profile/local-storage.html kept under the same key.
  function load() {
    try {
      var v = JSON.parse(store.get(KEY));
      return Array.isArray(v) ? v.map(function (n) { return typeof n === 'string' ? { text: n, done: false } : { text: String(n && n.text), done: !!(n && n.done) }; }) : null;
    } catch (e) { return null; }
  }
  var notes = load(), problem = '';
  var visits = (Number(store.get(KEY + ':visits')) || 0) + 1;
  store.set(KEY + ':visits', String(visits));
  function used() {
    var bytes = 0, enc = new TextEncoder();
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); bytes += enc.encode(k).length + enc.encode(localStorage.getItem(k) || '').length; } } catch (e) {}
    return bytes;
  }
  function save() { problem = store.set(KEY, JSON.stringify(notes)); render(); }
  function render() {
    var ul = document.getElementById('list'); ul.innerHTML = '';
    notes.forEach(function (n, i) {
      var li = document.createElement('li'); if (n.done) li.className = 'done';
      var t = document.createElement('span'); t.className = 'text'; t.textContent = n.text;
      t.addEventListener('click', function () { n.done = !n.done; save(); });
      var b = document.createElement('button'); b.textContent = '✕'; b.className = 'del';
      b.addEventListener('click', function () { notes.splice(i, 1); save(); });
      li.appendChild(t); li.appendChild(b); ul.appendChild(li);
    });
    document.getElementById('meta').textContent = notes.length + (notes.length === 1 ? ' note' : ' notes') + ' · visit #' + visits + ' · ' + (problem || used() + ' B of 16 KB');
  }
  document.getElementById('presets').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) { notes.push({ text: b.textContent, done: false }); save(); }
  });
  document.getElementById('clear').addEventListener('click', function () { notes = []; save(); });
  if (!notes) { notes = [{ text: 'Buy milk', done: false }, { text: 'Call Sam', done: false }]; save(); } else render();
</script>
</body></html>
