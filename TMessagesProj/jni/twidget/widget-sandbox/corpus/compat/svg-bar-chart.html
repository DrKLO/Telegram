<!DOCTYPE html>
<!-- out-of-profile/d3-bar.html without D3 (profile 1 bundles no library): the same chart built by hand with
     createElementNS — band and linear scales, axes as <g transform> groups with tick lines and labels, bars
     with ids, a click that recolours the bar, :hover, and a frame inserted before the title from its getBBox. -->
<html><head><meta charset="utf-8">
<style>body { font-family: system-ui, sans-serif; margin: 0; padding: 10px; background: #fff; } #info { font-size: 13px; color: #444; min-height: 18px; } .bar { cursor: pointer; } .bar:hover { opacity: .8; }</style>
</head><body>
<div id="chart"></div><div id="info">Click a bar</div>
<script>
  var NS = 'http://www.w3.org/2000/svg';
  var data = [{ k: 'A', v: 30 }, { k: 'B', v: 86 }, { k: 'C', v: 54 }, { k: 'D', v: 72 }, { k: 'E', v: 45 }, { k: 'F', v: 97 }];
  var W = 380, H = 220, m = { t: 24, r: 10, b: 30, l: 36 };
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  // scaleBand().padding(0.25) and scaleLinear() as D3 computes them.
  var pad = 0.25, step = (W - m.r - m.l) / (data.length - pad + pad * 2), bandwidth = step * (1 - pad);
  var x0 = m.l + (W - m.r - m.l - step * (data.length - pad)) / 2;
  function x(i) { return x0 + i * step; }
  function y(v) { return (H - m.b) + (m.t - (H - m.b)) * v / 100; }
  var svg = el('svg', { viewBox: [0, 0, W, H].join(' '), width: '100%' }, document.getElementById('chart'));
  // axisBottom: domain path with outer ticks, one tick per band at its centre.
  var bottom = el('g', { transform: 'translate(0,' + (H - m.b) + ')', fill: 'none', 'font-size': 10, 'font-family': 'sans-serif', 'text-anchor': 'middle' }, svg);
  el('path', { class: 'domain', stroke: 'currentColor', d: 'M' + m.l + ',6V0H' + (W - m.r) + 'V6' }, bottom);
  data.forEach(function (d, i) {
    var t = el('g', { class: 'tick', transform: 'translate(' + (x(i) + bandwidth / 2) + ',0)' }, bottom);
    el('line', { stroke: 'currentColor', y2: 6 }, t);
    el('text', { fill: 'currentColor', y: 9, dy: '0.71em' }, t).textContent = d.k;
  });
  // axisLeft().ticks(5): 0, 20, … 100.
  var left = el('g', { transform: 'translate(' + m.l + ',0)', fill: 'none', 'font-size': 10, 'font-family': 'sans-serif', 'text-anchor': 'end' }, svg);
  el('path', { class: 'domain', stroke: 'currentColor', d: 'M-6,' + y(0) + 'H0V' + y(100) + 'H-6' }, left);
  for (var v = 0; v <= 100; v += 20) {
    var t = el('g', { class: 'tick', transform: 'translate(0,' + y(v) + ')' }, left);
    el('line', { stroke: 'currentColor', x2: -6 }, t);
    el('text', { fill: 'currentColor', x: -9, dy: '0.32em' }, t).textContent = v;
  }
  data.forEach(function (d, i) {
    var r = el('rect', { class: 'bar', id: 'bar-' + d.k, x: x(i), y: y(d.v), width: bandwidth, height: y(0) - y(d.v), fill: '#2481cc' }, svg);
    r.addEventListener('click', function () {
      document.getElementById('info').textContent = d.k + ' = ' + d.v;
      svg.querySelectorAll('.bar').forEach(function (b) { b.setAttribute('fill', '#2481cc'); });
      this.setAttribute('fill', '#f59e0b');
    });
  });
  var title = el('text', { x: W / 2, y: 14, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 600 }, svg);
  title.textContent = 'Scores by group';
  // position a frame around the title using its measured box
  var b = title.getBBox();
  svg.insertBefore(el('rect', { x: b.x - 6, y: b.y - 2, width: b.width + 12, height: b.height + 4, rx: 4, fill: '#f3f4f6' }), title);
</script>
</body></html>
