<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  :root { --bg: #fff; --fg: #222; --card: #f3f4f6; --accent: #2481cc; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --fg: #e2e8f0; --card: #1e293b; --accent: #60a5fa; } }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); }
  .card { background: var(--card); border-radius: 10px; padding: 12px; border-left: 4px solid var(--accent); }
  #mode { font-weight: 700; color: var(--accent); }
  button { margin-top: 10px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); background: transparent; color: var(--fg); cursor: pointer; }
</style></head><body>
<div class="card">Current scheme: <span id="mode">?</span><br><small id="js">JS sees: …</small><br><small id="tg">TelegramWidget theme: …</small></div>
<button id="check">Re-check</button>
<script>
  var mql = window.matchMedia('(prefers-color-scheme: dark)');
  function update() {
    document.getElementById('mode').textContent = mql.matches ? 'dark 🌙' : 'light ☀️';
    document.getElementById('js').textContent = 'JS sees: matchMedia.matches = ' + mql.matches;
  }
  mql.addEventListener('change', update);
  document.getElementById('check').addEventListener('click', update);
  if (window.TelegramWidget) TelegramWidget.onTheme(function (t) { document.getElementById('tg').textContent = 'TelegramWidget theme: ' + t; });
  else document.getElementById('tg').textContent = 'TelegramWidget theme: (no bridge)';
  update();
</script>
</body></html>
