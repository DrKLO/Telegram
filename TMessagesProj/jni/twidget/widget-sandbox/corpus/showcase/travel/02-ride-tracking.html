<!--
  showcase: widget profile 1, SDK v1 (corpus/showcase/README.md)
  idea: a ride on its way — a stylised map (streets are one SVG path, no pattern) with the car moving along the route (a JS polyline, no layout query), the ETA counting down, status steps lighting up, Call / Message open the ride's page
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#0a0a0a, #f5f5f7); --muted: light-dark(#6e6e73, #98989d); --card: light-dark(#fff, #1c1c1e); --card2: light-dark(#f2f2f7, #2c2c2e);
    --border: light-dark(rgba(0,0,0,.08), rgba(255,255,255,.12)); --blue: #007aff; --green: #34c759; --orange: #ff9500;
    --map: light-dark(#eef2ea, #1a2420); --road: light-dark(#fff, #2b3a33); --block: light-dark(#dfe6d8, #223029); --water: light-dark(#cfe3f7, #15283a);
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.10); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.35; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .card { width: 100%; box-sizing: border-box; background: var(--card); overflow: hidden; }
  .map { position: relative; height: 200px; background: var(--map); }
  .map svg { width: 100%; height: 100%; display: block; }
  .eta { position: absolute; left: 14px; top: 14px; background: var(--card); padding: 8px 12px; border-radius: 12px; box-shadow: var(--shadow); }
  .eta b { font-size: 20px; font-variant-numeric: tabular-nums; } .eta span { font-size: 11px; color: var(--muted); display: block; }
  .route { stroke: var(--blue); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .35; }
  .done { stroke: var(--blue); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .car { filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .pin { animation: bob 1.6s ease-in-out infinite; transform-origin: center bottom; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  .body { padding: 14px 16px 16px; }
  .driver { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #f7971e, #ffd200); display: grid; place-items: center; font-weight: 800; color: #3a2a00; font-size: 16px; flex-shrink: 0; }
  .name { font-weight: 700; font-size: 16px; } .sub { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .plate { margin-left: auto; text-align: right; } .plate b { display: inline-block; font-family: ui-monospace, monospace; font-size: 15px; padding: 3px 8px; border-radius: 6px; border: 1.5px solid var(--fg); letter-spacing: .06em; }
  .plate span { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .steps { display: flex; margin: 16px 0 6px; position: relative; }
  .steps::before { content: ''; position: absolute; left: 10%; right: 10%; top: 7px; height: 2px; background: var(--border); }
  .steps .fill { position: absolute; left: 10%; top: 7px; height: 2px; background: var(--green); width: 0; transition: width .8s cubic-bezier(.33,1,.68,1); }
  .step { flex: 1; text-align: center; font-size: 11px; color: var(--muted); position: relative; }
  .step i { display: block; width: 12px; height: 12px; margin: 1px auto 6px; border-radius: 50%; background: var(--card); border: 2px solid var(--border); box-sizing: border-box; transition: background .3s, border-color .3s, transform .3s; }
  .step.on i { background: var(--green); border-color: var(--green); transform: scale(1.1); } .step.on { color: var(--fg); font-weight: 600; }
  .step.cur i { box-shadow: 0 0 0 4px rgba(52,199,89,.25); }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px; border-radius: 12px; border: 0; font: inherit; font-weight: 700; cursor: pointer; background: var(--card2); color: var(--fg); transition: transform .15s; }
  .btn:active { transform: scale(.97); } .btn svg { width: 16px; height: 16px; fill: currentColor; }
  .btn.cancel { flex: 0 0 auto; color: var(--muted); background: transparent; }
  .toast { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 16px; transition: opacity .3s; }
</style>
<div class="card">
  <div class="map">
    <svg viewBox="0 0 392 200" id="map">
      <defs>
        <linearGradient id="carG" x1="0" x2="1"><stop offset="0" stop-color="#1c1c1e"/><stop offset="1" stop-color="#3a3a3c"/></linearGradient>
      </defs>
      <path id="streets" fill="none" stroke="var(--road)" stroke-width="2.5"/>
      <path d="M0 182 C 70 170, 130 196, 210 184 S 330 158, 392 170 V200 H0z" fill="var(--water)"/>
      <rect x="40" y="30" width="60" height="40" rx="4" fill="var(--block)"/><rect x="130" y="20" width="50" height="60" rx="4" fill="var(--block)"/>
      <rect x="210" y="40" width="80" height="30" rx="4" fill="var(--block)"/><rect x="320" y="20" width="50" height="60" rx="4" fill="var(--block)"/>
      <rect x="60" y="100" width="40" height="30" rx="4" fill="var(--block)"/><rect x="240" y="95" width="60" height="40" rx="4" fill="var(--block)"/>
      <path id="route" class="route" d="M30 172 L30 86 Q30 80 36 80 L110 80 Q118 80 118 88 L118 108 Q118 116 126 116 L195 116 Q203 116 203 108 L203 86 Q203 80 211 80 L300 80 Q310 80 310 90 L310 128"/>
      <path id="doneP" class="done" d="M30 172 L30 86 Q30 80 36 80 L110 80 Q118 80 118 88 L118 108 Q118 116 126 116 L195 116 Q203 116 203 108 L203 86 Q203 80 211 80 L300 80 Q310 80 310 90 L310 128"/>
      <g transform="translate(310 128)"><g class="pin"><path d="M0 0 C -9 -10 -10 -14 -10 -18 A10 10 0 1 1 10 -18 C 10 -14 9 -10 0 0z" fill="#ff3b30"/><circle cx="0" cy="-18" r="4" fill="#fff"/></g></g>
      <g id="car" class="car"><rect x="-11" y="-6" width="22" height="12" rx="3" fill="url(#carG)"/><rect x="-6" y="-4" width="9" height="8" rx="1.5" fill="#8ec5ff"/><circle cx="-7" cy="6.5" r="2" fill="#111"/><circle cx="7" cy="6.5" r="2" fill="#111"/></g>
    </svg>
    <div class="eta"><b id="eta">6 min</b><span id="dist">2.1 km away</span></div>
  </div>
  <div class="body">
    <div class="driver">
      <div class="avatar">GK</div>
      <div><div class="name">Giorgi K.</div><div class="sub">★ 4.96 · Toyota Prius, white</div></div>
      <div class="plate"><b>TB 471 GK</b><span>Comfort</span></div>
    </div>
    <div class="steps">
      <div class="fill" id="fill"></div>
      <div class="step on" data-i="0"><i></i>Accepted</div>
      <div class="step on cur" data-i="1"><i></i>On the way</div>
      <div class="step" data-i="2"><i></i>Arriving</div>
      <div class="step" data-i="3"><i></i>Picked up</div>
    </div>
    <div class="actions">
      <button class="btn" id="call"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>Call</button>
      <button class="btn" id="msg"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 2-2z"/></svg>Message</button>
      <button class="btn cancel" id="cancel">Cancel</button>
    </div>
    <div class="toast" id="toast"></div>
  </div>
</div>
<script>
  // SDK v1: no sendMessage. Call and Message open the ride's page (a link per tap, confirmed by the client).
  // window.TelegramWidget is absent when the dev app renders the file natively (reference mode).
  const tw = window.TelegramWidget, RIDE = 'https://ride.example.com/trips/R-5521';
  // Streets: a 28 px grid of lines, drawn once.
  let streets = ''; for (let y = 1.25; y < 200; y += 28) streets += 'M0 ' + y + 'H392'; for (let x = 1.25; x < 392; x += 28) streets += 'M' + x + ' 0V200';
  document.getElementById('streets').setAttribute('d', streets);
  // The route is a polyline in JS too, so the car's position is pure arithmetic: no layout query per frame.
  const PTS = [[30,172],[30,84],[34,80],[112,80],[118,86],[118,110],[124,116],[197,116],[203,110],[203,86],[209,80],[302,80],[310,88],[310,128]];
  const segs = []; let len = 0;
  for (let i = 1; i < PTS.length; i++) { const d = Math.hypot(PTS[i][0] - PTS[i-1][0], PTS[i][1] - PTS[i-1][1]); segs.push({ a: PTS[i-1], b: PTS[i], d, at: len }); len += d; }
  const at = s => { s = Math.max(0, Math.min(len, s)); let g = segs[segs.length - 1]; for (const x of segs) if (s <= x.at + x.d) { g = x; break; } const f = g.d ? (s - g.at) / g.d : 0; return { x: g.a[0] + (g.b[0] - g.a[0]) * f, y: g.a[1] + (g.b[1] - g.a[1]) * f, ang: Math.atan2(g.b[1] - g.a[1], g.b[0] - g.a[0]) * 180 / Math.PI }; };
  const doneP = document.getElementById('doneP'), car = document.getElementById('car');
  doneP.style.strokeDasharray = len + ' ' + len;
  const steps = [...document.querySelectorAll('.step')], fill = document.getElementById('fill');
  const eta = document.getElementById('eta'), dist = document.getElementById('dist');
  // The ride takes 90 s of demo time; the UI says 6 minutes and counts down proportionally.
  const DUR = 90000, start = performance.now();
  let stage = 1;
  function setStage(n) {
    if (n === stage) return;
    stage = n;
    steps.forEach((s, i) => { s.classList.toggle('on', i <= n); s.classList.toggle('cur', i === n); });
    fill.style.width = (n / 3 * 80) + '%';
  }
  fill.style.width = (1 / 3 * 80) + '%';
  function frame() {
    const t = Math.min(1, (performance.now() - start) / DUR);
    const e = t < 1 ? 1 - Math.pow(1 - t, 1.6) : 1; // slows down towards the pin
    const p = at(e * len);
    car.setAttribute('transform', 'translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ') rotate(' + p.ang.toFixed(1) + ')');
    doneP.style.strokeDashoffset = String(len * (1 - e));
    const minutes = Math.ceil((1 - e) * 6), km = ((1 - e) * 2.1);
    eta.textContent = e >= 1 ? 'Arrived' : minutes <= 1 ? '< 1 min' : minutes + ' min';
    dist.textContent = e >= 1 ? 'Driver is at the pin' : km < 0.1 ? 'Just around the corner' : km.toFixed(1) + ' km away';
    if (e > 0.72 && stage < 2) setStage(2);
    if (e >= 1) { setStage(3); return; }
    requestAnimationFrame(frame);
  }
  frame();
  const toast = document.getElementById('toast');
  const say = s => { toast.textContent = s; toast.style.opacity = '1'; setTimeout(() => (toast.style.opacity = '0'), 2200); };
  document.getElementById('call').addEventListener('click', () => { say('Calling Giorgi through the ride page…'); tw?.openLink(RIDE + '/call'); });
  document.getElementById('msg').addEventListener('click', () => { say('Opening the chat with Giorgi…'); tw?.openLink(RIDE + '/chat'); });
  document.getElementById('cancel').addEventListener('click', e => { e.currentTarget.textContent = 'Sure?'; say('Cancellation fee ₾3 applies after 2 min — tap again to confirm'); });
</script>
