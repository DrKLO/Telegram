<!--
  showcase: widget profile 1, SDK v1 (corpus/showcase/README.md)
  idea: an airline boarding pass — gate closes in a live countdown, the pass flips over to its QR code on a tap (a 2D flip: one face folds to a line, the other unfolds), "Add to Wallet" opens the pass file and settles into a done state kept locally, Share opens Telegram's share sheet
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#0a0a0a, #f5f5f7); --muted: light-dark(#6e6e73, #98989d); --card: light-dark(#fff, #1c1c1e); --card2: light-dark(#f2f2f7, #2c2c2e);
    --border: light-dark(rgba(0,0,0,.08), rgba(255,255,255,.12)); --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.10); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.35; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .wrap { width: 100%; background: var(--card); overflow: hidden; }
  /* Both faces share one grid cell (the pass is as tall as the taller one). The flip is 2D: the face on show folds
     to a vertical line, then the other unfolds from it. */
  .pass { display: grid; cursor: pointer; }
  .face { grid-area: 1 / 1; box-sizing: border-box; width: 100%; background: var(--card); overflow: hidden; }
  .pass .back, .pass.flipped .front { transform: scaleX(0); visibility: hidden; transition: transform .25s cubic-bezier(.4,0,1,1), visibility 0s .25s; }
  .pass .front, .pass.flipped .back { transform: none; visibility: visible; transition: transform .25s .25s cubic-bezier(0,0,.6,1), visibility 0s .25s; }
  .face.back { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px; }
  .head { padding: 16px 18px 12px; background: linear-gradient(135deg, #0b3d91, #1e6fe0 60%, #52a8ff); color: #fff; position: relative; overflow: hidden; }
  .head::after { content: ''; position: absolute; width: 260px; height: 260px; right: -90px; top: -150px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .airline { display: flex; align-items: center; justify-content: space-between; font-weight: 700; letter-spacing: .04em; font-size: 12px; opacity: .9; }
  .route { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .code { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .city { font-size: 12px; opacity: .85; margin-top: 4px; }
  .plane { flex: 1; display: flex; align-items: center; margin: 0 14px; position: relative; height: 24px; }
  .plane .line { flex: 1; border-top: 2px dashed rgba(255,255,255,.5); }
  .plane svg { position: absolute; left: 0; top: 2px; width: 20px; height: 20px; fill: #fff; animation: fly 6s ease-in-out infinite; }
  @keyframes fly { 0% { left: 0; transform: translateY(0) rotate(90deg); } 50% { left: calc(100% - 20px); transform: translateY(-3px) rotate(94deg); } 100% { left: 0; transform: translateY(0) rotate(90deg); } }
  .body { padding: 14px 18px 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 10px; }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .val { font-size: 17px; font-weight: 700; margin-top: 2px; }
  .val.big { font-size: 22px; }
  .gate { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: var(--card2); }
  .gate .t { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 20px; color: var(--green); transition: color .4s; }
  .gate.soon .t { color: var(--orange); } .gate.now .t { color: var(--red); animation: blink 1s steps(2) infinite; }
  @keyframes blink { to { opacity: .5; } }
  .gate .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 8px; box-shadow: 0 0 0 0 rgba(52,199,89,.5); animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { to { box-shadow: 0 0 0 10px rgba(52,199,89,0); } }
  .tear { position: relative; height: 0; border-top: 2px dashed var(--border); margin: 0 18px; }
  .tear::before, .tear::after { content: ''; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: light-dark(#e9ebf0, #0f0f10); }
  .tear::before { left: -28px; } .tear::after { right: -28px; }
  .foot { display: flex; gap: 10px; padding: 14px 18px 18px; align-items: center; }
  .btn { flex: 1; padding: 11px 14px; border-radius: 12px; border: 0; font: inherit; font-weight: 700; cursor: pointer; background: var(--card2); color: var(--fg); transition: transform .15s, background .3s, color .3s; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: #0a0a0a; color: #fff; } .btn.primary.done { background: var(--green); }
  @media (prefers-color-scheme: dark) { .btn.primary { background: #fff; color: #000; } .btn.primary.done { background: var(--green); color: #fff; } }
  .hint { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 12px; }
  .qr { width: 196px; height: 196px; border-radius: 12px; background: #fff; padding: 12px; box-sizing: border-box; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .qr svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
  .back .name { margin-top: 16px; font-weight: 700; font-size: 16px; } .back .seq { color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
</style>
<div class="wrap">
  <div class="pass" id="pass" role="button" aria-label="flip the boarding pass">
    <div class="face front">
      <div class="head">
        <div class="airline"><span>NORDWIND · NW 1472</span><span>BOARDING PASS</span></div>
        <div class="route">
          <div><div class="code">LIS</div><div class="city">Lisbon</div></div>
          <div class="plane"><span class="line"></span><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></div>
          <div style="text-align:right"><div class="code">TBS</div><div class="city">Tbilisi</div></div>
        </div>
      </div>
      <div class="body">
        <div class="grid">
          <div><div class="lbl">Passenger</div><div class="val">M. Vasquez</div></div>
          <div><div class="lbl">Date</div><div class="val">24 May</div></div>
          <div><div class="lbl">Boarding</div><div class="val">18:05</div></div>
          <div><div class="lbl">Gate</div><div class="val big">B22</div></div>
          <div><div class="lbl">Seat</div><div class="val big">14A</div></div>
          <div><div class="lbl">Group</div><div class="val big">2</div></div>
        </div>
        <div class="gate" id="gate"><span style="display:flex;align-items:center"><span class="dot"></span><span id="gateText">Gate closes in</span></span><span class="t" id="count">--:--</span></div>
      </div>
    </div>
    <div class="face back">
      <div class="qr"><svg viewBox="0 0 29 29" id="qr"></svg></div>
      <div class="name">NW1472 · 14A · M. VASQUEZ</div>
      <div class="seq">SEQ 042 · ETKT 724 2403 981 227</div>
    </div>
  </div>
  <div class="tear"></div>
  <div class="foot">
    <button class="btn primary" id="wallet">Add to Wallet</button>
    <button class="btn" id="share">Share</button>
  </div>
  <div class="hint">Tap the pass to show the QR code</div>
</div>
<script>
  // SDK v1: no sendMessage. "In Wallet" is local state in localStorage (kept by the client per message, restored on
  // load); the wallet file and the share sheet are links, opened from the tap's own handler. window.TelegramWidget is
  // absent when the dev app renders the file natively (reference mode).
  const tw = window.TelegramWidget, KEY = 'pass-nw1472';
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  // A deterministic QR-looking pattern (finder squares + LCG modules); not a real QR, no scanner needed for a demo.
  (function () {
    const n = 29, cells = [];
    let s = 1472;
    const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
    const finder = (x, y) => (x >= 0 && x < 7 && y >= 0 && y < 7) && (x === 0 || x === 6 || y === 0 || y === 6 || (x >= 2 && x <= 4 && y >= 2 && y <= 4));
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      let on;
      if (x < 8 && y < 8) on = finder(x, y);
      else if (x >= n - 8 && y < 8) on = finder(x - (n - 7), y);
      else if (x < 8 && y >= n - 8) on = finder(x, y - (n - 7));
      else on = rnd() < 0.45;
      if (on) cells.push('<rect x="' + x + '" y="' + y + '" width="1" height="1"/>');
    }
    document.getElementById('qr').innerHTML = cells.join('');
  })();

  const pass = document.getElementById('pass');
  pass.addEventListener('click', () => pass.classList.toggle('flipped'));

  // Gate countdown: 12:34 left at load, ticking every second.
  let left = 12 * 60 + 34;
  const count = document.getElementById('count'), gate = document.getElementById('gate'), gateText = document.getElementById('gateText');
  function tick() {
    const m = Math.floor(left / 60), sec = left % 60;
    count.textContent = String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    gate.classList.toggle('soon', left <= 10 * 60 && left > 60);
    gate.classList.toggle('now', left <= 60);
    gateText.textContent = left <= 60 ? 'Final call' : 'Gate closes in';
    if (left > 0) left--;
  }
  tick();
  setInterval(tick, 1000);

  const wallet = document.getElementById('wallet');
  const inWallet = () => { wallet.classList.add('done'); wallet.textContent = '✓ In Wallet'; };
  if (store.get(KEY, {}).wallet) inWallet();
  wallet.addEventListener('click', () => {
    if (wallet.classList.contains('done')) return;
    tw?.openLink('https://nordwind.example.com/passes/NW1472-14A.pkpass');
    wallet.textContent = 'Adding…'; store.set(KEY, { wallet: true });
    setTimeout(inWallet, 300);
  });
  document.getElementById('share').addEventListener('click', () => {
    tw?.openTelegramLink?.('https://t.me/share/url?url=' + encodeURIComponent('https://nordwind.example.com/trips/NW1472') + '&text=' + encodeURIComponent('My flight NW 1472 · LIS → TBS · 24 May, boarding 18:05'));
  });
</script>
