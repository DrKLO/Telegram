<!--
  showcase: widget profile 1, SDK v1 (corpus/showcase/README.md)
  idea: a smart-home panel — animated toggles, a dimmer (a drawn slider dragged with pointer events) that lights the tile, a thermostat dial dragged with pointer events (SVG arc), scene buttons that set everything at once; the panel's state is kept locally
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#0a0a0a, #f5f5f7); --muted: light-dark(#6e6e73, #98989d); --card: light-dark(#fff, #1c1c1e); --card2: light-dark(#f2f2f7, #2c2c2e);
    --border: light-dark(rgba(0,0,0,.08), rgba(255,255,255,.12)); --blue: #007aff; --orange: #ff9500; --yellow: #ffcc00; --green: #34c759;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.10); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.35; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .card { width: 100%; box-sizing: border-box; background: var(--card); overflow: hidden; padding: 16px 16px 14px; }
  .hd { display: flex; justify-content: space-between; align-items: center; } h3 { margin: 0; font-size: 18px; } .hd span { font-size: 12px; color: var(--muted); }
  .scenes { display: flex; gap: 8px; margin: 12px 0; } .scene { flex: 1; padding: 9px 0; border-radius: 12px; border: 1.5px solid var(--border); background: transparent; color: var(--fg); font: inherit; font-weight: 700; font-size: 12px; cursor: pointer; transition: all .25s; }
  .scene.on { background: var(--fg); color: var(--card); border-color: var(--fg); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { border-radius: 16px; background: var(--card2); padding: 12px; position: relative; overflow: hidden; transition: background .5s, color .5s; }
  .tile .ic { font-size: 22px; } .tile .nm { font-weight: 700; margin-top: 6px; } .tile .st { font-size: 12px; color: var(--muted); transition: color .5s; }
  .tile.lit { background: light-dark(#fff3cc, #4a3a0a); } .tile.lit .glow { position: absolute; inset: 0; background: radial-gradient(circle at 30% 20%, rgba(255,204,0,var(--a, .5)), transparent 60%); pointer-events: none; transition: opacity .5s; }
  .tog { position: absolute; top: 12px; right: 12px; width: 44px; height: 26px; border-radius: 13px; background: var(--border); cursor: pointer; transition: background .3s; border: 0; padding: 0; }
  .tog::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
  .tog.on { background: var(--green); } .tog.on::after { transform: translateX(18px); }
  .dim { position: relative; height: 22px; margin: 6px 0 0; touch-action: none; cursor: pointer; --v: .6; }
  .dim::before { content: ''; position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--border); }
  .dim i { position: absolute; left: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--orange); width: calc(9px + (100% - 18px) * var(--v)); }
  .dim b { position: absolute; top: 2px; left: calc((100% - 18px) * var(--v)); width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .therm { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; touch-action: none; }
  .dial { width: 130px; height: 130px; flex-shrink: 0; position: relative; cursor: grab; } .dial svg { width: 100%; height: 100%; }
  .dial .tr { fill: none; stroke: var(--border); stroke-width: 10; stroke-linecap: round; }
  .dial .arc { fill: none; stroke: url(#heat); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .25s; }
  .dial .knob { fill: #fff; stroke: var(--orange); stroke-width: 3; filter: drop-shadow(0 1px 3px rgba(0,0,0,.3)); }
  .dial .v { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; } .dial .v b { font-size: 30px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; display: block; line-height: 1; } .dial .v small { color: var(--muted); font-size: 11px; }
  .tinfo { flex: 1; } .tinfo .nm { font-weight: 700; font-size: 16px; } .tinfo .st { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .mode { display: inline-flex; gap: 6px; margin-top: 10px; } .mode button { padding: 6px 10px; border-radius: 8px; border: 0; background: var(--card); color: var(--muted); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; } .mode button.on { color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .mode button.heat.on { color: var(--orange); } .mode button.cool.on { color: var(--blue); }
  .pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); margin-right: 5px; animation: pulse 1.4s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .3; } }
</style>
<div class="card">
  <div class="hd"><h3>Living room</h3><span id="power">3 devices on · 0.6 kW</span></div>
  <div class="scenes" id="scenes"><button class="scene" data-s="morning" role="button">☀️ Morning</button><button class="scene on" data-s="relax" role="button">🛋 Relax</button><button class="scene" data-s="movie" role="button">🎬 Movie</button><button class="scene" data-s="away" role="button">🚪 Away</button></div>
  <div class="grid">
    <div class="tile lit" id="tLamp"><div class="glow"></div><div class="ic">💡</div><div class="nm">Floor lamp</div><div class="st" id="lampSt">On · 60%</div><div class="dim" id="dim"><i></i><b></b></div><button class="tog on" id="togLamp" aria-label="lamp"></button></div>
    <div class="tile" id="tTv"><div class="ic">📺</div><div class="nm">TV</div><div class="st" id="tvSt">Off</div><button class="tog" id="togTv" aria-label="tv"></button></div>
    <div class="tile lit" id="tStrip" style="--a:.35"><div class="glow"></div><div class="ic">🌈</div><div class="nm">LED strip</div><div class="st" id="stripSt">On · Warm</div><button class="tog on" id="togStrip" aria-label="strip"></button></div>
    <div class="tile" id="tBlinds"><div class="ic">🪟</div><div class="nm">Blinds</div><div class="st" id="blindSt">Open</div><button class="tog on" id="togBlinds" aria-label="blinds"></button></div>
    <div class="tile therm" id="therm">
      <div class="dial" id="dial"><svg viewBox="0 0 130 130"><defs><linearGradient id="heat" x1="0" x2="1"><stop offset="0" stop-color="#007aff"/><stop offset=".5" stop-color="#ffcc00"/><stop offset="1" stop-color="#ff3b30"/></linearGradient></defs><path class="tr" id="trk"/><path class="arc" id="arc"/><circle class="knob" id="knob" r="8"/></svg><div class="v"><div><b id="tv">21.5°</b><small>target</small></div></div></div>
      <div class="tinfo"><div class="nm">Thermostat</div><div class="st" id="tst"><span class="pulse"></span>Heating to 21.5° · now 19.8°</div><div class="mode" id="mode"><button class="heat on" data-m="heat">Heat</button><button class="cool" data-m="cool">Cool</button><button data-m="off">Off</button></div></div>
    </div>
  </div>
</div>
<script>
  // SDK v1: no sendMessage. The panel's state (devices, dimmer, thermostat, scene) is local state in localStorage,
  // kept by the client per message and restored on load; it is saved on taps and at the end of a drag.
  const KEY = 'living-room';
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  const $ = id => document.getElementById(id);
  const state = { lamp: true, dim: 60, tv: false, strip: true, blinds: true, temp: 21.5, mode: 'heat' }, saved = store.get(KEY, {});
  let scene = typeof saved.scene === 'string' ? saved.scene : 'relax';
  if (saved.state && typeof saved.state === 'object') for (const k in state) if (typeof saved.state[k] === typeof state[k]) state[k] = saved.state[k];
  const save = () => store.set(KEY, { state, scene });
  const tiles = { lamp: ['tLamp', 'togLamp'], tv: ['tTv', 'togTv'], strip: ['tStrip', 'togStrip'], blinds: ['tBlinds', 'togBlinds'] };
  function render() {
    for (const k in tiles) { const [t, g] = tiles[k]; $(g).classList.toggle('on', state[k]); }
    $('tLamp').classList.toggle('lit', state.lamp && state.dim > 0); $('tLamp').style.setProperty('--a', (state.dim / 100 * 0.7).toFixed(2)); $('dim').style.setProperty('--v', (state.dim / 100).toFixed(2));
    $('lampSt').textContent = state.lamp ? 'On · ' + state.dim + '%' : 'Off';
    $('tTv').classList.toggle('lit', false); $('tvSt').textContent = state.tv ? 'On · Apple TV' : 'Off';
    $('tStrip').classList.toggle('lit', state.strip); $('stripSt').textContent = state.strip ? 'On · Warm' : 'Off';
    $('blindSt').textContent = state.blinds ? 'Open' : 'Closed';
    const on = ['lamp', 'tv', 'strip'].filter(k => state[k]).length + (state.mode !== 'off' ? 1 : 0);
    $('power').textContent = on + ' device' + (on === 1 ? '' : 's') + ' on · ' + ((state.lamp ? state.dim * 0.0008 : 0) + (state.tv ? 0.12 : 0) + (state.strip ? 0.02 : 0) + (state.mode === 'heat' ? 0.9 : state.mode === 'cool' ? 0.7 : 0)).toFixed(1) + ' kW';
    [...$('mode').children].forEach(b => b.classList.toggle('on', b.dataset.m === state.mode));
    [...$('scenes').children].forEach(b => b.classList.toggle('on', b.dataset.s === scene));
    $('tv').textContent = state.mode === 'off' ? '—' : state.temp.toFixed(1) + '°';
    $('tst').innerHTML = state.mode === 'off' ? 'Off · now 19.8°' : '<span class="pulse"' + (state.mode === 'cool' ? ' style="background:var(--blue)"' : '') + '></span>' + (state.mode === 'heat' ? 'Heating' : 'Cooling') + ' to ' + state.temp.toFixed(1) + '° · now 19.8°';
    dial();
  }
  // Dial: 270° arc from 10° to 30°C
  const R = 52, CX = 65, CY = 65, A0 = 135, A1 = 405, MIN = 10, MAX = 30;
  const pt = a => { const r = a * Math.PI / 180; return [CX + R * Math.cos(r), CY + R * Math.sin(r)]; };
  const arcPath = (a, b) => { const [x0, y0] = pt(a), [x1, y1] = pt(b); return 'M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + R + ' ' + R + ' 0 ' + (b - a > 180 ? 1 : 0) + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2); };
  $('trk').setAttribute('d', arcPath(A0, A1 - 0.01));
  function dial() {
    const f = (state.temp - MIN) / (MAX - MIN), a = A0 + f * (A1 - A0);
    $('arc').setAttribute('d', f > 0.001 ? arcPath(A0, a) : ''); $('arc').style.opacity = state.mode === 'off' ? '.25' : '1';
    const [kx, ky] = pt(a); $('knob').setAttribute('cx', kx.toFixed(2)); $('knob').setAttribute('cy', ky.toFixed(2)); $('knob').style.stroke = state.mode === 'cool' ? 'var(--blue)' : 'var(--orange)';
  }
  const dialEl = $('dial'); let drag = false;
  function fromPointer(e) {
    const r = dialEl.getBoundingClientRect(); if (!r.width) return;
    const x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
    let a = Math.atan2(y, x) * 180 / Math.PI; if (a < 0) a += 360; if (a < A0 - 90) a += 360; // map to [A0, A1]
    const f = Math.max(0, Math.min(1, (a - A0) / (A1 - A0)));
    state.temp = Math.round((MIN + f * (MAX - MIN)) * 2) / 2; if (state.mode === 'off') state.mode = 'heat';
    render();
  }
  dialEl.addEventListener('pointerdown', e => { drag = true; dialEl.setPointerCapture(e.pointerId); fromPointer(e); });
  dialEl.addEventListener('pointermove', e => { if (drag) fromPointer(e); });
  const up = () => { if (drag) save(); drag = false; }; dialEl.addEventListener('pointerup', up); dialEl.addEventListener('pointercancel', up);
  // Dimmer: a drawn slider. The track is measured once per press, not on every move.
  const dimEl = $('dim'); let dimRect = null;
  const dimTo = e => { if (!dimRect || !dimRect.width) return; state.dim = Math.round(Math.max(0, Math.min(1, (e.clientX - dimRect.left - 9) / (dimRect.width - 18))) * 20) * 5; state.lamp = state.dim > 0; render(); };
  dimEl.addEventListener('pointerdown', e => { dimRect = dimEl.getBoundingClientRect(); dimEl.setPointerCapture(e.pointerId); dimTo(e); });
  dimEl.addEventListener('pointermove', e => { if (dimRect) dimTo(e); });
  const dimUp = () => { if (dimRect) save(); dimRect = null; }; dimEl.addEventListener('pointerup', dimUp); dimEl.addEventListener('pointercancel', dimUp);
  for (const k in tiles) $(tiles[k][1]).addEventListener('click', () => { state[k] = !state[k]; if (k === 'lamp' && state.lamp && !state.dim) state.dim = 60; render(); save(); });
  $('mode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.mode = b.dataset.m; render(); save(); });
  const SCENES = { morning: { lamp: true, dim: 100, tv: false, strip: false, blinds: true, temp: 22, mode: 'heat' }, relax: { lamp: true, dim: 60, tv: false, strip: true, blinds: true, temp: 21.5, mode: 'heat' }, movie: { lamp: true, dim: 15, tv: true, strip: true, blinds: false, temp: 21, mode: 'heat' }, away: { lamp: false, dim: 0, tv: false, strip: false, blinds: false, temp: 17, mode: 'off' } };
  $('scenes').addEventListener('click', e => { const b = e.target.closest('.scene'); if (!b) return; scene = b.dataset.s; Object.assign(state, SCENES[scene]); render(); save(); });
  render();
</script>
