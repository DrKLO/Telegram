<!--
  showcase: widget profile 1, SDK v1 (corpus/showcase/README.md)
  idea: a cooking recipe — a servings stepper rescales every quantity, ingredients tick off, step cards slide left/right with a progress bar, a step's built-in timer counts down with a ring; servings, ticks and the step are kept locally
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#0a0a0a, #f5f5f7); --muted: light-dark(#6e6e73, #98989d); --card: light-dark(#fff, #1c1c1e); --card2: light-dark(#f2f2f7, #2c2c2e);
    --border: light-dark(rgba(0,0,0,.08), rgba(255,255,255,.12)); --acc: #e07a2f; --green: #34c759;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.10); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.35; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .card { width: 100%; box-sizing: border-box; background: var(--card); overflow: hidden; }
  .hero { height: 130px; background: radial-gradient(circle at 80% 20%, #ffd89b, transparent 45%), linear-gradient(135deg, #c94b2b, #e07a2f 60%, #f2b05e); position: relative; color: #fff; padding: 16px 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; }
  .hero h3 { margin: 0; font-size: 22px; letter-spacing: -.01em; } .hero .meta { font-size: 12px; opacity: .9; margin-top: 3px; display: flex; gap: 12px; }
  .hero .emoji { position: absolute; right: 18px; top: 14px; font-size: 54px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.25)); animation: wob 5s ease-in-out infinite; } @keyframes wob { 50% { transform: rotate(6deg) translateY(-3px); } }
  .tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 18px; position: relative; }
  .tabs button { padding: 12px 0; margin-right: 18px; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 700; cursor: pointer; transition: color .2s; } .tabs button.on { color: var(--fg); }
  .tabs .ink { position: absolute; bottom: -1px; height: 2px; background: var(--acc); transition: left .3s cubic-bezier(.22,1,.36,1), width .3s; }
  .pane { display: none; padding: 14px 18px 16px; } .pane.on { display: block; animation: fade .3s; } @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  .serv { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; } .serv span { color: var(--muted); font-size: 13px; }
  .stepper { display: flex; align-items: center; gap: 12px; } .stepper button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--fg); font-size: 18px; line-height: 1; cursor: pointer; } .stepper b { min-width: 16px; text-align: center; }
  .ing { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); cursor: pointer; } .ing:last-child { border-bottom: 0; }
  .ing .ck { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); box-sizing: border-box; display: grid; place-items: center; transition: all .25s; flex-shrink: 0; } .ing .ck svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; }
  .ing.on .ck { background: var(--green); border-color: var(--green); } .ing.on .ck svg { animation: draw .3s forwards; } @keyframes draw { to { stroke-dashoffset: 0; } }
  .ing .nm { flex: 1; transition: color .25s, text-decoration-color .25s; } .ing.on .nm { color: var(--muted); text-decoration: line-through; }
  .ing .q { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 64px; text-align: right; transition: transform .25s; } .ing .q.bump { animation: bump .35s; } @keyframes bump { 50% { transform: scale(1.15); color: var(--acc); } }
  .prog { height: 4px; background: var(--card2); border-radius: 2px; overflow: hidden; margin-bottom: 12px; } .prog i { display: block; height: 100%; background: var(--acc); border-radius: 2px; transition: width .4s cubic-bezier(.22,1,.36,1); }
  .deck { position: relative; overflow: hidden; }
  .track { display: flex; transition: transform .45s cubic-bezier(.22,1,.36,1); } .step { flex: 0 0 100%; box-sizing: border-box; min-height: 150px; visibility: hidden; transition: visibility 0s .45s; } .step.cur { visibility: visible; transition-delay: 0s; }
  .step .n { font-size: 11px; font-weight: 800; color: var(--acc); letter-spacing: .1em; } .step p { margin: 6px 0 0; font-size: 15px; line-height: 1.45; }
  .tm { display: inline-flex; align-items: center; gap: 10px; margin-top: 12px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--card2); border: 0; font: inherit; font-weight: 700; color: var(--fg); cursor: pointer; }
  .tm svg { width: 28px; height: 28px; transform: rotate(-90deg); } .tm circle { fill: none; stroke-width: 3; } .tm .t { stroke: var(--border); } .tm .p { stroke: var(--acc); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .tm.done { background: var(--green); color: #fff; }
  .nav { display: flex; justify-content: space-between; margin-top: 14px; } .nav button { padding: 10px 16px; border-radius: 12px; border: 0; background: var(--card2); color: var(--fg); font: inherit; font-weight: 700; cursor: pointer; transition: transform .15s, opacity .2s; } .nav button:active { transform: scale(.97); } .nav button:disabled { opacity: .4; }
  .nav .next { background: var(--acc); color: #fff; }
</style>
<div class="card">
  <div class="hero"><span class="emoji">🍝</span><h3>Cacio e pepe</h3><div class="meta"><span>⏱ 20 min</span><span>🔥 Easy</span><span>★ 4.8 · 1.2k</span></div></div>
  <div class="tabs" id="tabs"><button class="on" data-t="0" role="button">Ingredients</button><button data-t="1" role="button">Steps</button><span class="ink" id="ink" style="left:18px;width:84px"></span></div>
  <div class="pane on" id="p0">
    <div class="serv"><span>Servings</span><span class="stepper"><button id="minus" aria-label="fewer">−</button><b id="servN">2</b><button id="plus" aria-label="more">+</button></span></div>
    <div id="ings"></div>
  </div>
  <div class="pane" id="p1">
    <div class="prog"><i id="prog"></i></div>
    <div class="deck"><div class="track" id="track"></div></div>
    <div class="nav"><button id="prev" disabled>‹ Back</button><button class="next" id="next">Next ›</button></div>
  </div>
</div>
<script>
  // SDK v1: no sendMessage. Servings, ticked ingredients, the current step and "cooked" are local state in
  // localStorage, kept by the client per message and restored on load.
  const KEY = 'cacio-e-pepe';
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  const ING = [['Spaghetti or tonnarelli', 200, 'g'], ['Pecorino Romano, finely grated', 100, 'g'], ['Black pepper, whole', 2, 'tsp'], ['Salt for the water', 1, 'tbsp'], ['Pasta water, reserved', 150, 'ml']];
  const STEPS = [
    { t: 'Toast the pepper. Crush the peppercorns coarsely and toast them in a dry pan over medium heat until fragrant.', tm: 90 },
    { t: 'Boil the pasta in slightly less salted water than usual — the cheese is salty. Cook 1 minute short of al dente.', tm: 540 },
    { t: 'Make the paste. Mix the pecorino with a few spoons of warm (not boiling) pasta water into a thick cream. No lumps.', tm: 0 },
    { t: 'Combine off the heat. Pasta into the pepper pan, then the cheese cream. Toss hard, add water a splash at a time until glossy.', tm: 60 },
    { t: 'Serve at once with more pepper and a little pecorino on top. The sauce waits for no one.', tm: 0 },
  ];
  const saved = store.get(KEY, {});
  let serv = Number.isInteger(saved.serv) ? Math.max(1, Math.min(8, saved.serv)) : 2, step = 0, timer = null, cooked = saved.cooked === true;
  const save = () => store.set(KEY, { serv, step, cooked, ticked: [...ings.querySelectorAll('.ing')].map(r => r.classList.contains('on') ? 1 : 0) });
  const ings = document.getElementById('ings');
  const fmtQ = (q, u) => (q >= 10 ? Math.round(q) : Math.round(q * 4) / 4) + ' ' + u;
  ings.innerHTML = ING.map((x, i) => '<div class="ing" data-i="' + i + '"><span class="ck"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="nm">' + x[0] + '</span><span class="q">' + fmtQ(x[1], x[2]) + '</span></div>').join('');
  ings.addEventListener('click', e => { const r = e.target.closest('.ing'); if (r) { r.classList.toggle('on'); save(); } });
  if (Array.isArray(saved.ticked)) [...ings.querySelectorAll('.ing')].forEach((r, i) => r.classList.toggle('on', !!saved.ticked[i]));
  function reserve(bump) { document.getElementById('servN').textContent = serv; [...ings.querySelectorAll('.q')].forEach((q, i) => { q.textContent = fmtQ(ING[i][1] * serv / 2, ING[i][2]); if (!bump) return; q.classList.remove('bump'); setTimeout(() => q.classList.add('bump'), 10 + i * 40); }); }
  document.getElementById('minus').addEventListener('click', () => { serv = Math.max(1, serv - 1); reserve(true); save(); });
  document.getElementById('plus').addEventListener('click', () => { serv = Math.min(8, serv + 1); reserve(true); save(); });
  reserve(false);
  const tabs = document.getElementById('tabs'), ink = document.getElementById('ink');
  tabs.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const t = Number(b.dataset.t);
    [...tabs.querySelectorAll('button')].forEach((x, i) => x.classList.toggle('on', i === t));
    document.getElementById('p0').classList.toggle('on', t === 0); document.getElementById('p1').classList.toggle('on', t === 1);
    ink.style.left = (t === 0 ? 18 : 18 + 84 + 18) + 'px'; ink.style.width = (t === 0 ? 84 : 44) + 'px';
  });
  const track = document.getElementById('track');
  track.innerHTML = STEPS.map((s, i) => '<div class="step"><div class="n">STEP ' + (i + 1) + ' OF ' + STEPS.length + '</div><p>' + s.t + '</p>' + (s.tm ? '<button class="tm" data-i="' + i + '"><svg viewBox="0 0 28 28"><circle class="t" cx="14" cy="14" r="11"/><circle class="p" cx="14" cy="14" r="11" style="stroke-dasharray:69.1 69.1;stroke-dashoffset:0"/></svg><span>Start ' + (s.tm >= 60 ? Math.round(s.tm / 60) + ' min' : s.tm + ' s') + ' timer</span></button>' : '') + '</div>').join('');
  function go(n) {
    step = Math.max(0, Math.min(STEPS.length - 1, n)); track.style.transform = 'translateX(' + (-step * 100) + '%)';
    [...track.children].forEach((el, i) => el.classList.toggle('cur', i === step));
    document.getElementById('prog').style.width = ((step + 1) / STEPS.length * 100) + '%';
    document.getElementById('prev').disabled = step === 0; document.getElementById('next').textContent = step === STEPS.length - 1 ? (cooked ? '✓ Cooked' : 'Done 🎉') : 'Next ›';
  }
  document.getElementById('prev').addEventListener('click', () => { go(step - 1); save(); });
  document.getElementById('next').addEventListener('click', () => { if (step === STEPS.length - 1) cooked = true; go(step + 1); save(); });
  track.addEventListener('click', e => {
    const b = e.target.closest('.tm'); if (!b || b.dataset.on) return; b.dataset.on = '1';
    const total = STEPS[Number(b.dataset.i)].tm, p = b.querySelector('.p'), lbl = b.querySelector('span'); let left = total;
    const C = 69.1, speed = 10; // demo speed ×10
    const t = setInterval(() => { left = Math.max(0, left - speed); p.style.strokeDashoffset = String(C * (1 - left / total)); lbl.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0') + ' left'; if (left <= 0) { clearInterval(t); b.classList.add('done'); lbl.textContent = 'Time is up!'; } }, 1000);
  });
  go(Number.isInteger(saved.step) ? saved.step : 0);
</script>
