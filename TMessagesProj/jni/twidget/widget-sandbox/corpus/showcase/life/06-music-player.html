<!--
  showcase: widget profile 1, SDK v1 (corpus/showcase/README.md)
  idea: a music player — spinning vinyl art, a waveform progress bar you can seek with pointer events, play/pause that morphs its icon, a tracklist with an equaliser on the playing row (no audio: the sandbox has none, the UI is the demo); likes and the current track are kept locally
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#0a0a0a, #f5f5f7); --muted: light-dark(#6e6e73, #98989d); --card: light-dark(#fff, #1c1c1e); --card2: light-dark(#f2f2f7, #2c2c2e);
    --border: light-dark(rgba(0,0,0,.08), rgba(255,255,255,.12)); --acc: #ff2d55;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.10); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.35; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .card { width: 100%; box-sizing: border-box; background: var(--card); overflow: hidden; }
  .top { display: flex; gap: 16px; padding: 18px 18px 10px; align-items: center; }
  .art { width: 110px; height: 110px; border-radius: 50%; flex-shrink: 0; position: relative; background: repeating-radial-gradient(circle at 50% 50%, #111 0 1.5px, #1c1c1e 1.5px 3px); box-shadow: 0 10px 24px rgba(0,0,0,.3); animation: spin 4s linear infinite; animation-play-state: paused; }
  .playing .art { animation-play-state: running; } @keyframes spin { to { transform: rotate(360deg); } }
  .art::before { content: ''; position: absolute; inset: 30%; border-radius: 50%; background: conic-gradient(from 180deg, #ff2d55, #ff9500, #ffcc00, #34c759, #007aff, #af52de, #ff2d55); }
  .art::after { content: ''; position: absolute; inset: 46%; border-radius: 50%; background: var(--card); }
  .info { flex: 1; min-width: 0; } .info .t { font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .info .a { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .info .al { font-size: 11px; color: var(--muted); margin-top: 8px; display: inline-block; padding: 3px 8px; background: var(--card2); border-radius: 6px; }
  .like { margin-top: 10px; border: 0; background: transparent; cursor: pointer; padding: 0; } .like svg { width: 22px; height: 22px; fill: none; stroke: var(--muted); stroke-width: 2; transition: all .25s; } .like.on svg { fill: var(--acc); stroke: var(--acc); animation: pop .4s; } @keyframes pop { 40% { transform: scale(1.3); } }
  .wave { padding: 6px 18px 0; touch-action: none; cursor: pointer; } .wave svg { width: 100%; height: 44px; display: block; }
  .wave rect { fill: var(--border); transition: fill .2s; } .wave rect.on { fill: var(--acc); }
  .time { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 4px 18px 0; font-variant-numeric: tabular-nums; }
  .ctl { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 10px 0 14px; }
  .ctl button { border: 0; background: transparent; cursor: pointer; padding: 0; display: grid; place-items: center; color: var(--fg); transition: transform .15s; } .ctl button:active { transform: scale(.92); }
  .ctl svg { width: 26px; height: 26px; fill: currentColor; }
  .ctl .pp { width: 58px; height: 58px; border-radius: 50%; background: var(--fg); color: var(--card); box-shadow: 0 6px 16px rgba(0,0,0,.2); } .ctl .pp svg { width: 26px; height: 26px; }
  .ctl .sm svg { width: 20px; height: 20px; color: var(--muted); } .ctl .sm.on svg { color: var(--acc); }
  .list { border-top: 1px solid var(--border); padding: 6px 10px 10px; }
  .tr { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; cursor: pointer; transition: background .2s; } .tr:hover { background: var(--card2); } .tr.cur { background: var(--card2); }
  .tr .n { width: 18px; text-align: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .eq { display: none; width: 18px; height: 14px; align-items: flex-end; justify-content: center; gap: 2px; } .tr.cur .eq { display: flex; } .tr.cur .n { display: none; }
  .eq i { width: 3px; background: var(--acc); border-radius: 1px; height: 30%; animation: eq .9s ease-in-out infinite; animation-play-state: paused; } .playing .eq i { animation-play-state: running; }
  .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; } @keyframes eq { 50% { height: 100%; } }
  .tr .tt { flex: 1; min-width: 0; } .tr .tt b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; } .tr.cur .tt b { color: var(--acc); } .tr .tt span { font-size: 11px; color: var(--muted); }
  .tr .d { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
<div class="card" id="card">
  <div class="top"><div class="art"></div><div class="info"><div class="t" id="title">—</div><div class="a" id="artist">—</div><span class="al">Nightswim · 2026</span><br><button class="like" id="like" aria-label="like"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9A5.3 5.3 0 0 1 12 6.4 5.3 5.3 0 0 1 21.3 12C19 16.4 12 21 12 21z"/></svg></button></div></div>
  <div class="wave" id="wave"><svg viewBox="0 0 356 44" preserveAspectRatio="none" id="bars"></svg></div>
  <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl">
    <button class="sm" id="shuf" aria-label="shuffle"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6a3 3 0 0 0-2.4 1.2L7.6 15A5 5 0 0 1 3.6 17H2v-2h1.6a3 3 0 0 0 2.4-1.2L10.4 8A5 5 0 0 1 14.4 6H17V3zM2 6h1.6c1 0 2 .3 2.8.9l-1.3 1.7A3 3 0 0 0 3.6 8H2V6zm15 10h-2.6c-.6 0-1.2-.2-1.7-.5l1.3-1.7c.1.1.3.2.4.2H17v-3l4 4-4 4v-3z"/></svg></button>
    <button id="prev" aria-label="previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
    <button class="pp" id="pp" aria-label="play"><svg viewBox="0 0 24 24" id="ppIcon"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="next" aria-label="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    <button class="sm" id="rep" aria-label="repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
  </div>
  <div class="list" id="list"></div>
</div>
<script>
  // SDK v1: no sendMessage. Liked tracks and the current track are local state in localStorage, kept by the client
  // per message and restored on load.
  const KEY = 'nightswim-player';
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  const TRACKS = [['Low Tide', 'Mara Vos', 214, 11], ['Glass Houses', 'Mara Vos', 187, 23], ['Nightswim', 'Mara Vos feat. Kito', 243, 41], ['Sodium Lights', 'Mara Vos', 201, 5], ['Harbour', 'Mara Vos', 268, 77]];
  const saved = store.get(KEY, {}), liked = new Set(Array.isArray(saved.liked) ? saved.liked : []);
  const N = 72; let cur = Number.isInteger(saved.cur) && TRACKS[saved.cur] ? saved.cur : 2, pos = 61, playing = true, last = performance.now();
  const save = () => store.set(KEY, { cur, liked: [...liked] });
  const bars = document.getElementById('bars'), card = document.getElementById('card');
  function waveFor(seed) { let s = seed; const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; return Array.from({ length: N }, (_, i) => 0.25 + 0.75 * Math.abs(Math.sin(i / 5 + seed)) * (0.5 + r() * 0.5)); }
  function drawWave() { const w = waveFor(TRACKS[cur][3]); bars.innerHTML = w.map((h, i) => '<rect x="' + (i * 356 / N).toFixed(1) + '" y="' + (22 - h * 20).toFixed(1) + '" width="3" height="' + (h * 40).toFixed(1) + '" rx="1.5"/>').join(''); }
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  function paint() {
    const dur = TRACKS[cur][2], f = pos / dur; [...bars.children].forEach((r, i) => r.classList.toggle('on', i / N < f));
    document.getElementById('cur').textContent = fmt(pos); document.getElementById('dur').textContent = '−' + fmt(dur - pos);
  }
  function load(i, keepPos) {
    cur = (i + TRACKS.length) % TRACKS.length; if (!keepPos) pos = 0;
    document.getElementById('title').textContent = TRACKS[cur][0]; document.getElementById('artist').textContent = TRACKS[cur][1];
    drawWave(); paint();
    [...document.getElementById('list').children].forEach((r, k) => r.classList.toggle('cur', k === cur));
    document.getElementById('like').classList.toggle('on', liked.has(TRACKS[cur][0]));
  }
  const list = document.getElementById('list');
  list.innerHTML = TRACKS.map((t, i) => '<div class="tr" data-i="' + i + '" role="button"><span class="n">' + (i + 1) + '</span><span class="eq"><i></i><i></i><i></i></span><span class="tt"><b>' + t[0] + '</b><span>' + t[1] + '</span></span><span class="d">' + fmt(t[2]) + '</span></div>').join('');
  list.addEventListener('click', e => { const r = e.target.closest('.tr'); if (!r) return; load(Number(r.dataset.i)); setPlaying(true); save(); });
  const PLAY = 'M8 5v14l11-7z', PAUSE = 'M6 5h4v14H6zm8 0h4v14h-4z';
  function setPlaying(p) { playing = p; card.classList.toggle('playing', p); document.getElementById('ppIcon').firstElementChild.setAttribute('d', p ? PAUSE : PLAY); last = performance.now(); }
  document.getElementById('pp').addEventListener('click', () => setPlaying(!playing));
  document.getElementById('next').addEventListener('click', () => { load(cur + 1); save(); });
  document.getElementById('prev').addEventListener('click', () => { if (pos > 3) { pos = 0; paint(); } else { load(cur - 1); save(); } });
  document.getElementById('shuf').addEventListener('click', e => e.currentTarget.classList.toggle('on'));
  document.getElementById('rep').addEventListener('click', e => e.currentTarget.classList.toggle('on'));
  document.getElementById('like').addEventListener('click', e => { const t = TRACKS[cur][0]; if (e.currentTarget.classList.toggle('on')) liked.add(t); else liked.delete(t); save(); });
  // Seek on the waveform
  const wave = document.getElementById('wave'); let seeking = false;
  const seek = e => { const r = wave.getBoundingClientRect(); if (!r.width) return; const f = Math.max(0, Math.min(1, (e.clientX - r.left - 18) / (r.width - 36))); pos = f * TRACKS[cur][2]; paint(); };
  wave.addEventListener('pointerdown', e => { seeking = true; wave.setPointerCapture(e.pointerId); seek(e); });
  wave.addEventListener('pointermove', e => { if (seeking) seek(e); });
  const stop = () => { seeking = false; }; wave.addEventListener('pointerup', stop); wave.addEventListener('pointercancel', stop);
  // Playback clock: 4 Hz is plenty for a progress bar
  setInterval(() => { if (!playing) return; const now = performance.now(); pos += (now - last) / 1000; last = now; if (pos >= TRACKS[cur][2]) { load(cur + 1); } else paint(); }, 250);
  load(cur, true); setPlaying(true);
</script>
