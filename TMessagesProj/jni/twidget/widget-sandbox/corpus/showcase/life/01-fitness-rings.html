<!--
  showcase: widget profile 1, SDK v1 (corpus/showcase/README.md)
  idea: an activity summary — three rings sweep in on load (SVG stroke-dashoffset with staggered easing), the step count rolls up, a week of bars; tapping a day replays its rings
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#0a0a0a, #f5f5f7); --muted: light-dark(#6e6e73, #98989d); --card: light-dark(#fff, #1c1c1e); --card2: light-dark(#f2f2f7, #2c2c2e);
    --border: light-dark(rgba(0,0,0,.08), rgba(255,255,255,.12)); --move: #ff2d55; --ex: #a8ff04; --stand: #00d5ff; --track: light-dark(rgba(0,0,0,.07), rgba(255,255,255,.10));
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.10);
    --move-90: rgba(255,45,85,.9); --ex-90: rgba(168,255,4,.9); --stand-90: rgba(0,213,255,.9); }
  @media (prefers-color-scheme: dark) { :root { --ex: #b4ff39; --ex-90: rgba(180,255,57,.9); } }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.35; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .card { width: 100%; box-sizing: border-box; background: var(--card); overflow: hidden; padding: 16px 18px; }
  .hd { display: flex; justify-content: space-between; align-items: baseline; } h3 { margin: 0; font-size: 18px; } .hd span { color: var(--muted); font-size: 12px; }
  .top { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
  .rings { width: 150px; height: 150px; flex-shrink: 0; } .rings svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .rings circle { fill: none; stroke-width: 13; stroke-linecap: round; } .rings .tr { stroke: var(--track); }
  .rings .mv { stroke: var(--move); } .rings .ex { stroke: var(--ex); } .rings .st { stroke: var(--stand); }
  .stats { flex: 1; } .stat { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); } .stat:last-child { border-bottom: 0; }
  .stat .l { font-size: 12px; font-weight: 600; } .stat .l i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; font-style: normal; }
  .stat b { font-size: 17px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; } .stat small { color: var(--muted); font-size: 11px; font-weight: 400; }
  .steps { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .steps b { font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: -.03em; } .steps span { color: var(--muted); font-size: 12px; }
  .steps .goal { height: 6px; flex: 1; margin: 0 14px; background: var(--card2); border-radius: 3px; overflow: hidden; align-self: center; } .steps .goal i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--stand), var(--move)); border-radius: 3px; transition: width 1.4s cubic-bezier(.4,0,.2,1); }
  .week { display: flex; gap: 6px; margin-top: 14px; height: 70px; align-items: flex-end; }
  .day { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; border-radius: 8px; padding: 4px 0 0; transition: background .2s; }
  .day:hover, .day.on { background: var(--card2); }
  .day .b { width: 10px; border-radius: 5px; background: var(--move-90); height: 0; transition: height .9s cubic-bezier(.22,1,.36,1); }
  .day .b.e { background: var(--ex-90); margin-top: 2px; } .day .b.s { background: var(--stand-90); margin-top: 2px; }
  .day.on .b { background: var(--move); } .day.on .b.e { background: var(--ex); } .day.on .b.s { background: var(--stand); }
  .day span { font-size: 10px; color: var(--muted); margin-top: 5px; font-weight: 600; } .day.on span { color: var(--fg); }
  .badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 12px; font-weight: 600; color: var(--muted); } .badge i { font-style: normal; }
</style>
<div class="card">
  <div class="hd"><h3 id="title">Today</h3><span id="date">Thu 21 May</span></div>
  <div class="top">
    <div class="rings"><svg viewBox="0 0 150 150">
      <circle class="tr" cx="75" cy="75" r="66"/><circle class="tr" cx="75" cy="75" r="50"/><circle class="tr" cx="75" cy="75" r="34"/>
      <circle class="mv" id="rm" cx="75" cy="75" r="66"/><circle class="ex" id="re" cx="75" cy="75" r="50"/><circle class="st" id="rs" cx="75" cy="75" r="34"/>
    </svg></div>
    <div class="stats">
      <div class="stat"><span class="l"><i style="background:var(--move)"></i>Move</span><b><span id="vm">0</span><small>/620 kcal</small></b></div>
      <div class="stat"><span class="l"><i style="background:var(--ex)"></i>Exercise</span><b><span id="ve">0</span><small>/30 min</small></b></div>
      <div class="stat"><span class="l"><i style="background:var(--stand)"></i>Stand</span><b><span id="vs">0</span><small>/12 h</small></b></div>
    </div>
  </div>
  <div class="steps"><b id="stepsV">0</b><div class="goal"><i id="goal"></i></div><span><span id="km">0.0</span> km · goal 8 000</span></div>
  <div class="week" id="week"></div>
  <div class="badge"><i>🔥</i><span id="streak">Move goal met 4 days in a row</span></div>
</div>
<script>
  const DAYS = [
    { n: 'Fri', m: 540, e: 22, s: 10, st: 6800 }, { n: 'Sat', m: 910, e: 61, s: 13, st: 14200 }, { n: 'Sun', m: 380, e: 8, s: 7, st: 3900 },
    { n: 'Mon', m: 640, e: 35, s: 12, st: 8600 }, { n: 'Tue', m: 700, e: 41, s: 11, st: 9100 }, { n: 'Wed', m: 655, e: 30, s: 12, st: 8200 }, { n: 'Thu', m: 486, e: 24, s: 9, st: 6410, today: true },
  ];
  const GOAL = { m: 620, e: 30, s: 12 }, C = r => 2 * Math.PI * r;
  const rings = [['rm', 66, 'm'], ['re', 50, 'e'], ['rs', 34, 's']].map(([id, r, k]) => { const el = document.getElementById(id); el.style.strokeDasharray = C(r) + ' ' + C(r); el.style.strokeDashoffset = C(r); return { el, r, k }; });
  let run = 0;
  const ease = t => 1 - Math.pow(1 - t, 3);
  function show(d) {
    const me = ++run, t0 = performance.now(), DUR = 1300;
    document.getElementById('title').textContent = d.today ? 'Today' : ({ Fri: 'Friday', Sat: 'Saturday', Sun: 'Sunday', Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday' })[d.n];
    document.getElementById('goal').style.width = Math.min(100, d.st / 8000 * 100) + '%';
    (function step() {
      if (me !== run) return;
      const t = Math.min(1, (performance.now() - t0) / DUR);
      rings.forEach(({ el, r, k }, i) => {
        const tt = Math.max(0, Math.min(1, (t - i * 0.08) / 0.84)), e = ease(tt), frac = Math.min(1, d[k] / GOAL[k]) * e; // rings can overshoot in Fitness; cap at 1 here
        el.style.strokeDashoffset = String(C(r) * (1 - Math.min(1, frac)));
      });
      const e = ease(t);
      document.getElementById('vm').textContent = Math.round(d.m * e); document.getElementById('ve').textContent = Math.round(d.e * e); document.getElementById('vs').textContent = Math.round(d.s * e);
      document.getElementById('stepsV').textContent = Math.round(d.st * e).toLocaleString('en-US').replace(/,/g, ' ');
      document.getElementById('km').textContent = (d.st * e * 0.00074).toFixed(1);
      if (t < 1) requestAnimationFrame(step);
    })();
  }
  const week = document.getElementById('week');
  week.innerHTML = DAYS.map((d, i) => '<div class="day' + (d.today ? ' on' : '') + '" data-i="' + i + '" role="button"><div class="b m"></div><div class="b e"></div><div class="b s"></div><span>' + d.n[0] + '</span></div>').join('');
  const bars = [...week.querySelectorAll('.day')];
  setTimeout(() => bars.forEach((b, i) => { const d = DAYS[i]; b.querySelector('.m').style.height = Math.round(Math.min(1, d.m / GOAL.m) * 26) + 'px'; b.querySelector('.e').style.height = Math.round(Math.min(1, d.e / GOAL.e) * 14) + 'px'; b.querySelector('.s').style.height = Math.round(Math.min(1, d.s / GOAL.s) * 10) + 'px'; }), 100);
  week.addEventListener('click', e => { const b = e.target.closest('.day'); if (!b) return; bars.forEach(x => x.classList.toggle('on', x === b)); const d = DAYS[Number(b.dataset.i)]; document.getElementById('date').textContent = (d.today ? 'Thu 21' : d.n + ' ' + (15 + Number(b.dataset.i))) + ' May'; show(d); });
  show(DAYS[6]);
</script>
