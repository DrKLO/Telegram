<!--
  showcase: widget profile 1, SDK v1 (corpus/showcase/README.md)
  idea: pricing plans — a monthly / yearly segmented toggle slides its thumb, prices roll to the new numbers, the chosen plan lifts with a gradient border, feature rows reveal; the choice is kept locally, Start opens the subscription page
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#0a0a0a, #f5f5f7); --muted: light-dark(#6e6e73, #98989d); --card: light-dark(#fff, #1c1c1e); --card2: light-dark(#f2f2f7, #2c2c2e);
    --border: light-dark(rgba(0,0,0,.08), rgba(255,255,255,.12)); --blue: #007aff; --green: #34c759; --purple: #af52de;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.10); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.35; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .card { width: 100%; box-sizing: border-box; background: var(--card); overflow: hidden; padding: 18px; }
  h3 { margin: 0; font-size: 20px; letter-spacing: -.01em; } .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .seg { position: relative; display: flex; margin: 14px 0 16px; background: var(--card2); border-radius: 12px; padding: 3px; }
  .seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); background: var(--card); border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.12); transition: transform .35s cubic-bezier(.22,1,.36,1); }
  .seg.y .thumb { transform: translateX(100%); }
  .seg button { flex: 1; position: relative; padding: 9px; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 700; cursor: pointer; transition: color .3s; }
  .seg button.on { color: var(--fg); } .seg button em { font-style: normal; font-size: 10px; background: var(--green); color: #fff; padding: 1px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 1px; }
  .plans { display: flex; flex-direction: column; gap: 10px; }
  .plan { position: relative; border-radius: 16px; padding: 14px 16px; background: var(--card2); cursor: pointer; transition: transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s; border: 2px solid transparent; }
  .plan.on { transform: scale(1.02); box-shadow: var(--shadow); background: var(--card); border-color: var(--blue); }
  .plan.pro.on { border-color: transparent; background: linear-gradient(var(--card), var(--card)) padding-box, linear-gradient(120deg, #007aff, #af52de, #ff2d55) border-box; }
  .plan .hd { display: flex; align-items: center; gap: 10px; } .plan .nm { font-weight: 800; font-size: 16px; } .plan .tag { font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 3px 7px; border-radius: 6px; background: linear-gradient(120deg, #007aff, #af52de); color: #fff; }
  .plan .pr { margin-left: auto; text-align: right; } .plan .pr b { font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; } .plan .pr small { display: block; color: var(--muted); font-size: 11px; }
  .plan .was { font-size: 11px; color: var(--muted); text-decoration: line-through; margin-right: 4px; opacity: 0; transition: opacity .3s; } .y .plan .was { opacity: 1; }
  .plan .rd { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); box-sizing: border-box; display: grid; place-items: center; transition: border-color .2s; } .plan.on .rd { border-color: var(--blue); } .plan.on .rd::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); animation: pop .3s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { from { transform: scale(0); } }
  .feats { max-height: 0; overflow: hidden; transition: max-height .4s cubic-bezier(.4,0,.2,1); } .plan.on .feats { max-height: 140px; }
  .feats ul { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; } .feats li { padding: 3px 0 3px 22px; position: relative; color: var(--muted); } .feats li::before { content: '✓'; position: absolute; left: 2px; color: var(--green); font-weight: 800; }
  .feats li.hi { color: var(--fg); font-weight: 600; }
  .go { margin-top: 16px; width: 100%; padding: 14px; border: 0; border-radius: 14px; background: var(--blue); color: #fff; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer; transition: transform .15s, background .3s; }
  .go:active { transform: scale(.98); }
  .fine { text-align: center; font-size: 11px; color: var(--muted); margin-top: 8px; }
</style>
<div class="card">
  <h3>Choose your plan</h3><div class="sub">7-day free trial on every plan · cancel any time</div>
  <div class="seg" id="seg"><div class="thumb"></div><button class="on" data-y="0" role="button">Monthly</button><button data-y="1" role="button">Yearly<em>−25%</em></button></div>
  <div class="plans" id="plans"></div>
  <button class="go" id="go">Start free trial · Plus</button>
  <div class="fine" id="fine">Then €7.99 / month · billed monthly</div>
</div>
<script>
  // SDK v1: no sendMessage. The plan and the billing period are local state in localStorage (kept by the client per
  // message, restored on load); Start opens the service's page. window.TelegramWidget is absent in reference mode.
  const tw = window.TelegramWidget, KEY = 'plan-choice';
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  const PLANS = [
    { k: 'basic', nm: 'Basic', m: 3.99, f: ['1 device', '720p streaming', 'Ads between episodes'] },
    { k: 'plus', nm: 'Plus', m: 7.99, tag: 'POPULAR', f: ['2 devices at once', '1080p, no ads', 'Downloads for offline'], hi: [1] },
    { k: 'pro', nm: 'Pro', m: 12.99, f: ['4 devices · family profiles', '4K HDR + spatial audio', 'Downloads, early access'], hi: [0, 1] },
  ];
  const saved = store.get(KEY, {});
  let yearly = saved.yearly === true, sel = [0, 1, 2].includes(saved.sel) ? saved.sel : 1;
  const plans = document.getElementById('plans'), seg = document.getElementById('seg');
  plans.innerHTML = PLANS.map((p, i) => '<div class="plan ' + p.k + (i === sel ? ' on' : '') + '" data-i="' + i + '" role="button"><div class="hd"><span class="rd"></span><span class="nm">' + p.nm + '</span>' + (p.tag ? '<span class="tag">' + p.tag + '</span>' : '') + '<span class="pr"><span class="was">€' + p.m.toFixed(2) + '</span><b>€<span class="v">' + p.m.toFixed(2) + '</span></b><small class="per">per month</small></span></div><div class="feats"><ul>' + p.f.map((f, j) => '<li' + ((p.hi || []).includes(j) ? ' class="hi"' : '') + '>' + f + '</li>').join('') + '</ul></div></div>').join('');
  const vals = [...plans.querySelectorAll('.v')], pers = [...plans.querySelectorAll('.per')], runs = new Map();
  function roll(el, to) {
    const from = Number(el.textContent) || 0, me = (runs.get(el) || 0) + 1; runs.set(el, me); const t0 = performance.now();
    (function s() { if (runs.get(el) !== me) return; const t = Math.min(1, (performance.now() - t0) / 550); el.textContent = (from + (to - from) * (1 - Math.pow(1 - t, 3))).toFixed(2); if (t < 1) requestAnimationFrame(s); })();
  }
  function price(p) { return yearly ? p.m * 0.75 : p.m; }
  function update() {
    seg.classList.toggle('y', yearly); [...seg.querySelectorAll('button')].forEach(b => b.classList.toggle('on', Boolean(Number(b.dataset.y)) === yearly));
    PLANS.forEach((p, i) => { roll(vals[i], price(p)); pers[i].textContent = yearly ? 'per month, billed yearly' : 'per month'; });
    [...plans.children].forEach((el, i) => el.classList.toggle('on', i === sel));
    const p = PLANS[sel];
    document.getElementById('go').textContent = 'Start free trial · ' + p.nm;
    document.getElementById('fine').textContent = 'Then €' + price(p).toFixed(2) + ' / month · ' + (yearly ? 'billed €' + (price(p) * 12).toFixed(2) + ' yearly' : 'billed monthly');
  }
  seg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; yearly = b.dataset.y === '1'; update(); store.set(KEY, { sel, yearly }); });
  plans.addEventListener('click', e => { const p = e.target.closest('.plan'); if (!p) return; sel = Number(p.dataset.i); update(); store.set(KEY, { sel, yearly }); });
  document.getElementById('go').addEventListener('click', () => tw?.openLink('https://stream.example.com/subscribe?plan=' + PLANS[sel].k + '&billing=' + (yearly ? 'yearly' : 'monthly') + '&trial=7d'));
  update();
</script>
