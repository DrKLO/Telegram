<!--
  showcase: widget profile 1, SDK v1 (corpus/showcase/README.md)
  idea: a stock card — the price ticks live with a green/red flash, the sparkline (SVG path + gradient area) grows with each tick, range chips 1D / 1W / 1M / 1Y morph the curve, a scrubber shows the price at a point, Buy / Sell open the broker's page, the price alert is kept locally
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#0a0a0a, #f5f5f7); --muted: light-dark(#6e6e73, #98989d); --card: light-dark(#fff, #1c1c1e); --card2: light-dark(#f2f2f7, #2c2c2e);
    --border: light-dark(rgba(0,0,0,.08), rgba(255,255,255,.12)); --green: #34c759; --red: #ff3b30; --blue: #007aff;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.10); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.35; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .card { width: 100%; box-sizing: border-box; background: var(--card); overflow: hidden; padding: 16px 18px 14px; }
  .hd { display: flex; align-items: center; gap: 12px; } .logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #111, #444); color: #fff; display: grid; place-items: center; font-weight: 900; letter-spacing: -.04em; font-size: 15px; }
  @media (prefers-color-scheme: dark) { .logo { background: linear-gradient(135deg, #e5e5ea, #a1a1a6); color: #000; } }
  .hd .n { font-weight: 800; font-size: 16px; } .hd .s { font-size: 12px; color: var(--muted); }
  .price { margin-left: auto; text-align: right; } .price b { font-size: 24px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; display: block; line-height: 1.1; transition: color .3s; border-radius: 6px; padding: 0 4px; margin-right: -4px; }
  .price b.up, .price b.up2 { animation: flashUp .6s; } .price b.dn, .price b.dn2 { animation: flashDn .6s; } @keyframes flashUp { 0% { background: rgba(52,199,89,.35); } } @keyframes flashDn { 0% { background: rgba(255,59,48,.35); } }
  .price span { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; } .pos { color: var(--green); } .neg { color: var(--red); }
  .chart { margin: 12px -6px 0; position: relative; touch-action: none; } .chart svg { width: 100%; height: 130px; display: block; overflow: visible; }
  .line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: d .5s cubic-bezier(.4,0,.2,1), stroke .3s; }
  .area { transition: d .5s cubic-bezier(.4,0,.2,1); }
  .ref { stroke: var(--border); stroke-dasharray: 3 4; }
  .dot { r: 4; fill: var(--fg); stroke: var(--card); stroke-width: 2; } .dot.live { animation: pulse 1.5s ease-out infinite; transform-origin: center; transform-box: fill-box; } @keyframes pulse { 0% { r: 4; opacity: 1; } 100% { r: 12; opacity: 0; } }
  .scrub { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--muted); display: none; } .scrub b { position: absolute; top: -2px; left: 6px; font-size: 11px; background: var(--fg); color: var(--card); padding: 2px 6px; border-radius: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; } .scrub.r b { left: auto; right: 6px; }
  .chart.on .scrub { display: block; }
  .ranges { display: flex; gap: 4px; margin-top: 8px; background: var(--card2); padding: 3px; border-radius: 10px; }
  .ranges button { flex: 1; padding: 6px 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: all .2s; } .ranges button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; } .stats div { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; } .stats b { display: block; font-size: 13px; color: var(--fg); text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .acts { display: flex; gap: 10px; margin-top: 14px; } .acts button { flex: 1; padding: 12px; border: 0; border-radius: 12px; font: inherit; font-weight: 800; cursor: pointer; color: #fff; transition: transform .15s; } .acts button:active { transform: scale(.97); }
  .acts .buy { background: var(--green); } .acts .sell { background: var(--card2); color: var(--fg); } .acts .alert { flex: 0 0 46px; background: var(--card2); color: var(--fg); font-size: 16px; } .acts .alert.on { background: var(--blue); color: #fff; }
  .note { font-size: 11px; color: var(--muted); text-align: center; margin-top: 10px; }
</style>
<div class="card">
  <div class="hd"><div class="logo">NW</div><div><div class="n">Nordwind Air</div><div class="s">NWND · Frankfurt · <span id="mkt">market open</span></div></div><div class="price"><b id="px">0.00</b><span id="chg"></span></div></div>
  <div class="chart" id="chart"><svg viewBox="0 0 380 130" id="svg"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" id="g0" stop-opacity=".3"/><stop offset="1" id="g1" stop-opacity="0"/></linearGradient></defs><line class="ref" id="ref" x1="0" x2="380"/><path class="area" id="area" fill="url(#g)"/><path class="line" id="line"/><circle class="dot live" id="dotLive"/><circle class="dot" id="dot"/></svg><div class="scrub" id="scrub"><b id="scrubV"></b></div></div>
  <div class="ranges" id="ranges"><button class="on" data-r="1D" role="button">1D</button><button data-r="1W" role="button">1W</button><button data-r="1M" role="button">1M</button><button data-r="1Y" role="button">1Y</button></div>
  <div class="stats"><div>Open<b id="sOpen"></b></div><div>High<b id="sHigh"></b></div><div>Low<b id="sLow"></b></div><div>Vol<b>2.4M</b></div></div>
  <div class="acts"><button class="buy" id="buy">Buy</button><button class="sell" id="sell">Sell</button><button class="alert" id="alert" aria-label="price alert">🔔</button></div>
  <div class="note">Demo data. Not investment advice — just pixels.</div>
</div>
<script>
  // SDK v1: no sendMessage. Buy and Sell open the broker's page (a link per tap, confirmed by the client); the price
  // alert is local state in localStorage, kept by the client per message. window.TelegramWidget is absent in
  // reference mode.
  const tw = window.TelegramWidget, KEY = 'nwnd-alert';
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  // Seeded random-walk series per range; 1D keeps ticking live.
  const mk = (n, start, vol, seed, drift) => { let s = seed, v = start; const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; return Array.from({ length: n }, () => (v = Math.max(1, v + (r() - .5 + drift) * vol))); };
  const SERIES = { '1D': mk(60, 48.2, 0.5, 11, 0.02), '1W': mk(70, 46.9, 0.9, 5, 0.02), '1M': mk(90, 44.1, 1.3, 8, 0.03), '1Y': mk(120, 31.5, 2.2, 3, 0.05) };
  let range = '1D', s = 99; const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const W = 380, H = 130, PAD = 10;
  const $ = id => document.getElementById(id);
  let lastPx = 0;
  function paint(flash) {
    const d = SERIES[range], open = d[0], last = d[d.length - 1], min = Math.min(...d), max = Math.max(...d), up = last >= open;
    const X = i => i * W / (d.length - 1), Y = v => PAD + (max - v) / ((max - min) || 1) * (H - PAD * 2);
    const path = d.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
    $('line').setAttribute('d', path); $('area').setAttribute('d', path + 'L' + W + ' ' + H + 'L0 ' + H + 'Z');
    const col = up ? '#34c759' : '#ff3b30'; $('line').style.stroke = col; $('g0').setAttribute('stop-color', col); $('g1').setAttribute('stop-color', col);
    $('ref').setAttribute('y1', Y(open).toFixed(1)); $('ref').setAttribute('y2', Y(open).toFixed(1));
    ['dot', 'dotLive'].forEach(id => { $(id).setAttribute('cx', W); $(id).setAttribute('cy', Y(last).toFixed(1)); });
    $('dotLive').style.display = range === '1D' ? '' : 'none';
    const px = $('px'); px.textContent = '€' + last.toFixed(2);
    if (flash && lastPx) { const k = last >= lastPx ? 'up' : 'dn', alt = px.classList.contains(k); px.className = alt ? k + '2' : k; /* alternate class names to restart the animation without a reflow query */ } lastPx = last;
    const chg = last - open, chgEl = $('chg'); chgEl.textContent = (chg >= 0 ? '+' : '−') + '€' + Math.abs(chg).toFixed(2) + ' (' + (chg >= 0 ? '+' : '−') + Math.abs(chg / open * 100).toFixed(2) + '%) ' + range; chgEl.className = chg >= 0 ? 'pos' : 'neg';
    $('sOpen').textContent = '€' + open.toFixed(2); $('sHigh').textContent = '€' + max.toFixed(2); $('sLow').textContent = '€' + min.toFixed(2);
  }
  $('ranges').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; range = b.dataset.r; [...$('ranges').children].forEach(x => x.classList.toggle('on', x === b)); lastPx = 0; paint(false); });
  // Live ticks on the 1D series every 1.5 s
  setInterval(() => { const d = SERIES['1D']; d.push(Math.max(1, d[d.length - 1] + (rnd() - .48) * 0.35)); d.shift(); if (range === '1D') paint(true); }, 1500);
  // Scrubber
  const chart = $('chart'), scrub = $('scrub');
  const move = e => { const r = chart.getBoundingClientRect(); if (!r.width) return; const f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); const d = SERIES[range], i = Math.round(f * (d.length - 1)); scrub.style.left = (f * 100) + '%'; scrub.classList.toggle('r', f > .6); $('scrubV').textContent = '€' + d[i].toFixed(2) + (range === '1D' ? ' · ' + String(9 + Math.floor(i / 7.5)).padStart(2, '0') + ':' + String(Math.round(i % 7.5 * 8)).padStart(2, '0') : ''); chart.classList.add('on'); };
  chart.addEventListener('pointerdown', e => { chart.setPointerCapture(e.pointerId); move(e); }); chart.addEventListener('pointermove', e => { if (chart.classList.contains('on')) move(e); });
  const off = () => chart.classList.remove('on'); chart.addEventListener('pointerup', off); chart.addEventListener('pointercancel', off);
  $('buy').addEventListener('click', () => tw?.openLink('https://broker.example.com/trade/NWND?side=buy'));
  $('sell').addEventListener('click', () => tw?.openLink('https://broker.example.com/trade/NWND?side=sell'));
  // The alert: a toggle (above €50) shown on the bell; the widget only remembers it, the broker would send it.
  const alertOn = on => { $('alert').classList.toggle('on', on); $('alert').textContent = on ? '✓' : '🔔'; };
  alertOn(store.get(KEY, {}).above === 50);
  $('alert').addEventListener('click', () => { const on = !$('alert').classList.contains('on'); alertOn(on); store.set(KEY, { above: on ? 50 : null }); });
  paint(false);
</script>
