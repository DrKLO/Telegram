<!--
  showcase: widget profile 1, SDK v1 (corpus/showcase/README.md)
  idea: a CI run in progress — stages spin, pass and (one) fail in sequence, log lines stream in under the running stage, durations tick, "Re-run failed" starts it again
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#0a0a0a, #f5f5f7); --muted: light-dark(#6e6e73, #98989d); --card: light-dark(#fff, #1c1c1e); --card2: light-dark(#f2f2f7, #2c2c2e);
    --border: light-dark(rgba(0,0,0,.08), rgba(255,255,255,.12)); --green: #34c759; --red: #ff3b30; --blue: #007aff; --orange: #ff9500; --term: light-dark(#0f1419, #0a0c10);
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.10); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.35; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .card { width: 100%; box-sizing: border-box; background: var(--card); overflow: hidden; }
  .hd { padding: 14px 16px 12px; display: flex; align-items: center; gap: 12px; }
  .st { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; transition: background .4s; background: var(--blue); color: #fff; }
  .st svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .st.run svg { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  .st.ok { background: var(--green); } .st.fail { background: var(--red); }
  .hd h3 { margin: 0; font-size: 15px; } .hd .sub { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: ui-monospace, monospace; }
  .hd .dur { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .stages { display: flex; padding: 0 16px 12px; gap: 6px; }
  .stage { flex: 1; text-align: center; font-size: 10px; color: var(--muted); font-weight: 600; } .stage i { display: block; height: 5px; border-radius: 3px; background: var(--card2); margin-bottom: 5px; transition: background .4s; position: relative; overflow: hidden; }
  .stage.run i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--blue), transparent); animation: slide 1s linear infinite; } @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .stage.ok i { background: var(--green); } .stage.fail i { background: var(--red); } .stage.ok, .stage.fail, .stage.run { color: var(--fg); }
  .jobs { border-top: 1px solid var(--border); }
  .job { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .job .ic { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; border: 2px solid var(--border); box-sizing: border-box; transition: all .3s; }
  .job.run .ic { border-color: var(--blue); border-top-color: transparent; animation: spin .8s linear infinite; }
  .job.ok .ic { background: var(--green); border-color: var(--green); } .job.fail .ic { background: var(--red); border-color: var(--red); }
  .job .ic svg { width: 10px; height: 10px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; display: none; } .job.ok .ic .ck, .job.fail .ic .x { display: block; }
  .job .nm { flex: 1; font-weight: 600; } .job.wait .nm { color: var(--muted); font-weight: 400; } .job .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; min-width: 38px; text-align: right; }
  .job.fail .nm { color: var(--red); }
  .term { background: var(--term); color: #c9d1d9; font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.55; padding: 10px 14px; height: 118px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .term div { white-space: pre; overflow: hidden; text-overflow: ellipsis; animation: in .2s; } @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  .term .g { color: #7ee787; } .term .r { color: #ff7b72; } .term .y { color: #e3b341; } .term .d { color: #6e7681; }
  .cur::after { content: '▍'; animation: blink 1s steps(2) infinite; color: #58a6ff; } @keyframes blink { to { opacity: 0; } }
  .foot { display: flex; gap: 10px; padding: 12px 16px 14px; align-items: center; }
  .btn { padding: 9px 14px; border-radius: 10px; white-space: nowrap; border: 0; background: var(--card2); color: var(--fg); font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; transition: transform .15s; } .btn:active { transform: scale(.97); }
  .btn.p { background: var(--fg); color: var(--card); } .btn:disabled { opacity: .4; cursor: default; }
  .foot .who { margin-left: auto; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; } .foot .av { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #f7971e, #ffd200); }
</style>
<div class="card">
  <div class="hd"><div class="st run" id="st"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9" id="stPath"/></svg></div><div><h3>twidget · <span id="title">Running</span></h3><div class="sub">main · a3f9c21 · "validator: strip CSS nesting"</div></div><div class="dur" id="dur">0:00</div></div>
  <div class="stages" id="stages"></div>
  <div class="jobs" id="jobs"></div>
  <div class="term" id="term"></div>
  <div class="foot"><button class="btn p" id="rerun" disabled>Re-run failed</button><button class="btn" id="open">Open</button><span class="who"><span class="av"></span>pushed by mira · 2 min ago</span></div>
</div>
<script>
  // SDK v1: no sendMessage (a failure is the bot's to report, not the widget's); Open is a link, opened from the tap's
  // own handler. window.TelegramWidget is absent when the dev app renders the file natively (reference mode).
  const tw = window.TelegramWidget;
  const JOBS = [
    { s: 'Build', n: 'Install & typecheck', d: 3.2, log: ['$ corepack pnpm install --frozen-lockfile', '<span class="d">Lockfile is up to date, resolution step is skipped</span>', 'Progress: resolved 412, reused 412, downloaded 0', '$ tsc --noEmit', '<span class="g">✓</span> 0 errors'] },
    { s: 'Test', n: 'Unit tests', d: 2.6, log: ['$ tsx --test tests/unit/*.test.ts', '<span class="g">✓</span> validator (48 ms)', '<span class="g">✓</span> css-sanitizer (131 ms)', '<span class="g">✓</span> cpu-budget (12 ms)', '<span class="g">✓</span> 61 passed'] },
    { s: 'Test', n: 'Attack suite · 100 files', d: 4.1, log: ['$ playwright test tests/attacks.spec.ts', '<span class="d">[canary] listening on 127.0.0.1:9999</span>', '<span class="g">✓</span> api-fetch · css-url-image · markup-img-src …', '<span class="g">✓</span> 100 passed, canary hits: <b>0</b>'] },
    { s: 'Test', n: 'Compat · generated corpus', d: 3.4, fail: true, log: ['$ playwright test tests/generated.spec.ts', '<span class="g">✓</span> with-profile/03-pricing (diff 0.4 %)', '<span class="g">✓</span> with-profile/07-kanban (diff 1.1 %)', '<span class="r">✗</span> without-profile/12-globe (diff <span class="y">4.8 %</span> > 3 %)', '<span class="r">1 failed</span>, 39 passed'] },
    { s: 'Deploy', n: 'Preview deploy', d: 2.0, log: ['<span class="d">skipped: a previous stage failed</span>'] },
  ];
  const STAGES = ['Build', 'Test', 'Deploy'];
  const jobs = document.getElementById('jobs'), term = document.getElementById('term'), stages = document.getElementById('stages');
  jobs.innerHTML = JOBS.map((j, i) => '<div class="job wait" data-i="' + i + '"><span class="ic"><svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><svg class="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span><span class="nm">' + j.n + '</span><span class="t"></span></div>').join('');
  stages.innerHTML = STAGES.map(s => '<div class="stage" data-s="' + s + '"><i></i>' + s + '</div>').join('');
  const rows = [...jobs.children], st = document.getElementById('st'), title = document.getElementById('title'), dur = document.getElementById('dur');
  let t0, timers = [], total = 0, attempt = 0;
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const after = (ms, f) => timers.push(setTimeout(f, ms));
  function setStage(name, cls) { const s = stages.querySelector('[data-s="' + name + '"]'); s.className = 'stage ' + cls; }
  function run(fromFailed) {
    clear(); attempt++; t0 = performance.now(); term.innerHTML = ''; document.getElementById('rerun').disabled = true;
    st.className = 'st run'; title.textContent = 'Running'; STAGES.forEach(s => setStage(s, ''));
    rows.forEach((r, i) => { r.className = 'job ' + (fromFailed && !JOBS[i].fail && i < 4 ? 'ok' : 'wait'); r.querySelector('.t').textContent = fromFailed && !JOBS[i].fail && i < 4 ? JOBS[i].d.toFixed(1) + 's' : ''; });
    if (fromFailed) setStage('Build', 'ok');
    const dt = setInterval(() => { const s = (performance.now() - t0) / 1000; dur.textContent = Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }, 500); timers.push(dt);
    let at = 400, failed = false;
    JOBS.forEach((j, i) => {
      if (fromFailed && !j.fail && i < 4) return;
      const willFail = j.fail && attempt === 1;
      after(at, () => { if (failed) return; rows[i].className = 'job run'; setStage(j.s, 'run'); term.innerHTML = '<div class="d">▶ ' + j.n + '</div><div class="cur"></div>'; });
      const lines = willFail || !j.fail ? j.log : j.log.slice(0, 3).concat(['<span class="g">✓</span> without-profile/12-globe (diff 1.9 %)', '<span class="g">✓</span> 40 passed']);
      lines.forEach((l, k) => after(at + 300 + k * (j.d * 1000 - 500) / lines.length, () => { if (failed) return; const c = term.querySelector('.cur'); if (c) c.insertAdjacentHTML('beforebegin', '<div>' + l + '</div>'); if (term.children.length > 7) term.removeChild(term.firstChild); }));
      after(at + j.d * 1000, () => {
        if (failed) return;
        if (j.s === 'Deploy' && failed) return;
        rows[i].className = 'job ' + (willFail ? 'fail' : 'ok'); rows[i].querySelector('.t').textContent = j.d.toFixed(1) + 's';
        const sameStage = JOBS.filter(x => x.s === j.s), lastOfStage = sameStage[sameStage.length - 1] === j;
        if (willFail) { failed = true; setStage(j.s, 'fail'); st.className = 'st fail'; title.textContent = 'Failed'; clearInterval(dt); rows[4].className = 'job wait'; rows[4].querySelector('.t').textContent = 'skipped'; document.getElementById('rerun').disabled = false; term.querySelector('.cur')?.remove(); }
        else if (lastOfStage) setStage(j.s, 'ok');
        if (i === JOBS.length - 1 && !failed) { st.className = 'st ok'; title.textContent = 'Passed'; clearInterval(dt); term.querySelector('.cur')?.remove(); term.insertAdjacentHTML('beforeend', '<div class="g">✓ preview deployed → twidget-a3f9c21.preview</div>'); }
      });
      at += j.d * 1000 + 250;
    });
  }
  document.getElementById('rerun').addEventListener('click', () => run(true));
  document.getElementById('open').addEventListener('click', () => tw?.openLink('https://ci.example.com/twidget/runs/8841'));
  run(false);
</script>
