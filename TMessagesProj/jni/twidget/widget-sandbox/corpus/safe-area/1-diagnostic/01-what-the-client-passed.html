<!--
  safe-area: the diagnostic: the six numbers and the band and corner drawn from them (corpus/safe-area/README.md)
  idea: what your client passed for this bubble. The table shows TelegramWidget.contentSafeAreaInset, the striped strip at the bottom is the band (env(safe-area-inset-bottom)) and the red box is the corner (--tg-content-safe-area-corner-right or -left), all live: your time must sit inside the red box, over the stripes, and nothing else. Posted without a caption: a band and a corner on your interface's side (the same with a caption above the widget). With a caption below every number is 0 and there is no strip.
-->
<title>What the client passed</title>
<style>
  /* Each env() after a plain value: a client older than v0.4.0 drops a declaration with env() whole; var(…, 0px) where it has no variables. */
  body { margin: 0; padding: 12px 14px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)) }
  .an { margin: 0 0 10px; padding: 6px 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; background: var(--tg-theme-secondary-bg-color); color: var(--tg-theme-hint-color) }
  .an b { color: var(--tg-theme-text-color) }
  table { width: 100%; border-collapse: collapse; font: 13px/1.5 ui-monospace, monospace }
  td { padding: 1px 0; border-bottom: 1px solid var(--tg-theme-section-separator-color) }
  td + td { text-align: right; font-weight: 600 }
  .z { color: var(--tg-theme-hint-color); font-weight: 400 }
  .ft { margin-top: 8px; font-size: 12px; color: var(--tg-theme-hint-color) }
  .band { position: fixed; left: 0; right: 0; bottom: 0; height: 0; height: env(safe-area-inset-bottom); background: repeating-linear-gradient(135deg, var(--tg-theme-secondary-bg-color) 0 6px, transparent 6px 12px) }
  /* An inset outline: a corner of 0 px draws nothing (a border would leave a 2 px stub). */
  .c { position: fixed; bottom: 0; height: 0; height: env(safe-area-inset-bottom); box-shadow: inset 0 0 0 2px var(--tg-theme-destructive-text-color) }
  .c.r { right: 0; width: var(--tg-content-safe-area-corner-right, 0px) }
  .c.l { left: 0; width: var(--tg-content-safe-area-corner-left, 0px) }
</style>
<div class="an"><b>What your client passed.</b> With no caption below, your time must sit in the red box over the striped band, and cover nothing else. With a caption below: all 0, no band.</div>
<table id="t"></table>
<div class="ft" id="ft"></div>
<div class="band"></div><div class="c r"></div><div class="c l"></div>
<script>
  var TW = window.TelegramWidget, changes = 0;
  var KEYS = [['top', 'inset-top'], ['right', 'inset-right'], ['bottom', 'inset-bottom'], ['left', 'inset-left'], ['cornerLeft', 'corner-left'], ['cornerRight', 'corner-right']];
  // The SDK's numbers, or the same numbers from the root variables where there is no TelegramWidget (a browser).
  function area() {
    if (TW && TW.contentSafeAreaInset) return TW.contentSafeAreaInset;
    var s = getComputedStyle(document.documentElement), a = {};
    KEYS.forEach(function (k) { a[k[0]] = parseFloat(s.getPropertyValue('--tg-content-safe-area-' + k[1])) || 0; });
    return a;
  }
  function draw() {
    var a = area();
    document.getElementById('t').innerHTML = KEYS.map(function (k) {
      return '<tr><td>' + k[0] + '</td><td' + (a[k[0]] ? '' : ' class="z"') + '>' + a[k[0]] + ' px</td></tr>';
    }).join('');
    var side = a.cornerRight ? 'right' : a.cornerLeft ? 'left' : '';
    document.getElementById('ft').textContent = (a.bottom ? 'A ' + a.bottom + ' px band' + (side ? ', the time over the ' + side + ' corner' : ', no corner') : 'No band: the time is in the caption below') + ' · changes: ' + changes;
  }
  if (TW && TW.onEvent) TW.onEvent('contentSafeAreaChanged', function () { changes++; draw(); });
  draw();
</script>
