<!--
  safe-area: CSS as models write it: calc() and max() around env(), @supports, another env() name with a fallback (corpus/safe-area/README.md)
  idea: an order summary styled the way a model writes for a phone: side padding max(16px, env(safe-area-inset-left)) and -right, a footer bar to the bubble's edge with padding-bottom calc(12px + env(safe-area-inset-bottom)), an @supports block, and env(keyboard-inset-height, 0px), which no client has. Every client rewrites the safe-area insets to its own band and the other name to its fallback, so the Pay button ends above your time and nothing is lost.
-->
<title>Your order</title>
<style>
  /* padding: 0 too: this widget handles the band itself, so the renderer's default bottom padding would be a second band. */
  body { margin: 0; padding: 0 }
  .wrap { padding: 12px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); margin-bottom: env(keyboard-inset-height, 0px) }
  .an { margin: 0 0 10px; padding: 6px 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; background: var(--tg-theme-secondary-bg-color); color: var(--tg-theme-hint-color) }
  .an b { color: var(--tg-theme-text-color) }
  h2 { margin: 0 0 8px; font-size: 17px }
  .li { display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px; border-bottom: 1px solid var(--tg-theme-section-separator-color) }
  .li span:last-child { color: var(--tg-theme-hint-color) }
  .tot { display: flex; justify-content: space-between; margin-top: 8px; font-size: 16px; font-weight: 700 }
  .ft { display: flex; gap: 10px; align-items: center; margin-top: 12px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--tg-theme-secondary-bg-color) }
  .ft button { flex: 1; padding: 9px 0; background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); font-weight: 600 }
  .ok { display: none; font-size: 12px; color: var(--tg-theme-hint-color) }
  @supports (padding: env(safe-area-inset-bottom)) { .ok { display: block } }
</style>
<div class="wrap">
  <div class="an"><b>CSS as a model writes it:</b> max() and calc() around env(safe-area-inset-*), @supports. The Pay button ends above your time.</div>
  <h2>Your order</h2>
  <div class="li"><span>2 × Flat white</span><span>€7.00</span></div>
  <div class="li"><span>Almond croissant</span><span>€3.40</span></div>
  <div class="li"><span>Pickup at 12:40</span><span>Rua Augusta</span></div>
  <div class="tot"><span>Total</span><span>€10.40</span></div>
  <div class="ok">@supports (padding: env(safe-area-inset-bottom)): yes</div>
</div>
<div class="ft"><button id="p">Pay €10.40</button></div>
<script>
  document.getElementById('p').onclick = function () { this.textContent = 'Paid ✓'; };
</script>
