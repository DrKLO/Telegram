<!--
  safe-area: a full-bleed card whose action row keeps out of the corner, not the band (corpus/safe-area/README.md)
  idea: a trip offer painted to the bubble's edges. Its bottom row runs into the band of the time: the Book button sits in it, beside the time, and the row ends before the corner (padding on the corner's side), so nothing of the card is under your time and no line of the band is wasted. Tap Book or Save: nothing happens under the time.
-->
<title>Weekend in Lisbon</title>
<style>
  /* padding: 0 too: this widget handles the band itself, so the renderer's default bottom padding would be a second band. */
  body { margin: 0; padding: 0 }
  .card { padding: 16px 16px 0; background: linear-gradient(160deg, var(--tg-theme-button-color), var(--tg-theme-accent-text-color)); color: var(--tg-theme-button-text-color) }
  .an { margin: 0 0 12px; padding: 6px 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; background: var(--tg-theme-bg-color); color: var(--tg-theme-hint-color) }
  .an b { color: var(--tg-theme-text-color) }
  .k { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; opacity: .8 }
  h1 { margin: 4px 0 2px; font-size: 22px; line-height: 1.2 }
  .d { font-size: 14px; opacity: .9 }
  .p { margin: 14px 0 0; font-size: 28px; font-weight: 700 }
  .p small { font-size: 13px; font-weight: 500; opacity: .85 }
  /* The bottom row: into the band, out of the corner (the physical side the client draws its time on); 0px where a client
     older than v0.4.0 has no such variables. */
  .row { display: flex; gap: 8px; align-items: center; padding: 14px max(16px, var(--tg-content-safe-area-corner-right, 0px)) 6px max(16px, var(--tg-content-safe-area-corner-left, 0px)); margin: 0 -16px }
  .row button { padding: 7px 16px; background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); font-weight: 600 }
  .row .g { background: none; color: var(--tg-theme-button-text-color); border: 1px solid; padding: 6px 14px }
  .row .s { flex: 1; text-align: end; font-size: 12px; opacity: .85 }
</style>
<div class="card">
  <div class="an"><b>The row runs into the time's band</b> beside the time and ends before its corner: no button under your time.</div>
  <div class="k">Tap Air · 3 nights</div>
  <h1>Weekend in Lisbon</h1>
  <div class="d">14–17 November · hotel in Alfama · breakfast</div>
  <div class="p">€420 <small>per person</small></div>
  <div class="row"><button id="b">Book</button><button class="g" id="s">Save</button><span class="s" id="st">2 seats left</span></div>
</div>
<script>
  document.getElementById('b').onclick = function () { document.getElementById('st').textContent = 'Held for 15 min'; };
  document.getElementById('s').onclick = function () { this.textContent = 'Saved ✓'; };
</script>
