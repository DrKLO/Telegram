<!--
  gestures: touch-action: none on the stick pad, so every press there is the widget's (corpus/gestures/README.md); 02-joystick-x is the same game on pan-y
  idea: Star catcher, a joystick mini-game on touch-action: none. Drag the stick in any direction to fly the dot and collect the stars: start up or down, circle, rest your thumb on it; the chat never scrolls, swipes or opens the menu from the pad. Compare with 02, the same game on pan-y.
-->
<title>Star catcher</title>
<style>
  .ta { margin: 0 0 8px; font-size: 13px; color: var(--tg-theme-hint-color) }
  #ar { position: relative; height: 190px; margin: 0 8px; border-radius: 12px; background: var(--tg-theme-secondary-bg-color); overflow: hidden }
  #sh, .s { position: absolute }
  #sh { width: 22px; height: 22px; margin: -11px; border-radius: 50%; background: var(--tg-theme-button-color) }
  .s { width: 18px; height: 18px; margin: -9px; text-align: center; font-size: 18px; line-height: 1; color: #f5a700 }
  #pad { position: relative; height: 130px; margin: 10px 8px 0; border-radius: 12px; border: 1px dashed var(--tg-theme-hint-color); touch-action: none }
  #base, #knob { position: absolute; left: 50%; top: 50%; border-radius: 50%; pointer-events: none }
  #base { width: 92px; height: 92px; margin: -46px; background: rgba(128, 128, 128, .15) }
  #knob { width: 44px; height: 44px; margin: -22px; background: var(--tg-theme-button-color) }
  .st { margin: 8px 0 0; font-size: 13px }
</style>
<p class="ta"><code>touch-action: none</code> · the xy stick: drag it any way, start up or down, hold it still; the chat never takes it</p>
<div id="ar"><div id="sh"></div></div>
<div id="pad"><div id="base"></div><div id="knob"></div></div>
<p class="st">★ <b id="sc">0</b> · presses taken by the chat: <b id="tk">0</b></p>
<script>
var $ = function (id) { return document.getElementById(id); };
var ar = $('ar'), sh = $('sh'), pad = $('pad'), base = $('base'), knob = $('knob');
var R = 40, seed = 7, score = 0, took = 0;
var ship = { x: 50, y: 50 }, stars = [], press = null, w = 296, h = 190, last = 0;
function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }
function place(el, p) { el.style.left = p.x + '%'; el.style.top = p.y + '%'; }
function addStar() {
  var s = { x: 8 + rnd() * 84, y: 10 + rnd() * 80, el: document.createElement('div') };
  s.el.className = 's';
  s.el.textContent = '★';
  place(s.el, s);
  ar.appendChild(s.el);
  stars.push(s);
}
for (var i = 0; i < 3; i++) addStar();
place(sh, ship);
function center() {
  base.style.left = knob.style.left = '50%';
  base.style.top = knob.style.top = '50%';
}
pad.addEventListener('pointerdown', function (e) {
  press = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: e.offsetX, oy: e.offsetY, kx: 0, ky: 0 };
  try { pad.setPointerCapture(e.pointerId); } catch (_) {}
  w = ar.clientWidth || w;
  h = ar.clientHeight || h;
  base.style.left = knob.style.left = press.ox + 'px';
  base.style.top = knob.style.top = press.oy + 'px';
  last = 0;
  requestAnimationFrame(tick);
});
pad.addEventListener('pointermove', function (e) {
  if (!press || e.pointerId !== press.id) return;
  var dx = e.clientX - press.sx, dy = e.clientY - press.sy, d = Math.sqrt(dx * dx + dy * dy);
  if (d > R) { dx *= R / d; dy *= R / d; }
  press.kx = dx / R;
  press.ky = dy / R;
  knob.style.left = press.ox + dx + 'px';
  knob.style.top = press.oy + dy + 'px';
});
function end(e) {
  if (!press || e.pointerId !== press.id) return;
  if (e.type === 'pointercancel') $('tk').textContent = ++took;
  press = null;
  center();
}
pad.addEventListener('pointerup', end);
pad.addEventListener('pointercancel', end);
function tick(t) {
  if (!press) return;
  var dt = last ? Math.min(t - last, 50) / 1000 : 0;
  last = t;
  // 140 px/s at full deflection, in % of the arena on each axis
  ship.x = Math.max(3, Math.min(97, ship.x + press.kx * 14000 / w * dt));
  ship.y = Math.max(5, Math.min(95, ship.y + press.ky * 14000 / h * dt));
  place(sh, ship);
  for (var i = stars.length - 1; i >= 0; i--) {
    var s = stars[i];
    if (Math.abs(s.x - ship.x) * w / 100 < 18 && Math.abs(s.y - ship.y) * h / 100 < 18) {
      ar.removeChild(s.el);
      stars.splice(i, 1);
      $('sc').textContent = ++score;
      addStar();
    }
  }
  requestAnimationFrame(tick);
}
</script>
