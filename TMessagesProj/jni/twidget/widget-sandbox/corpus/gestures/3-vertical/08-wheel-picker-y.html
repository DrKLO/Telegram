<!--
  gestures: touch-action: pan-x on the wheels, so they claim vertical drags only (corpus/gestures/README.md)
  idea: an alarm time picker with two spinning wheels, hours and minutes, on touch-action: pan-x. Spin a wheel up or down, flick it and let it coast; tap a number to jump to it. A drag that starts sideways is the chat's swipe-to-reply. Under a rule that only horizontal drags may be claimed, a wheel like this could not spin.
-->
<title>Alarm</title>
<style>
  .ta { margin: 0 0 8px; font-size: 13px; color: var(--tg-theme-hint-color) }
  #pk { position: relative; display: flex; justify-content: center; gap: 8px; height: 180px; margin: 0 8px; overflow: hidden }
  #band { position: absolute; left: 0; right: 0; top: 72px; height: 36px; border-radius: 10px; background: rgba(128, 128, 128, .16); pointer-events: none }
  .wh { position: relative; width: 84px; touch-action: pan-x }
  .col { position: relative }
  .col.snap { transition: top .25s ease-out }
  .it { height: 36px; line-height: 36px; text-align: center; font-size: 22px; font-variant-numeric: tabular-nums; color: var(--tg-theme-hint-color) }
  .it.on { color: var(--tg-theme-text-color); font-weight: 600 }
  .sep { align-self: center; font-size: 22px; font-weight: 600 }
  #out { margin: 10px 0 0; text-align: center; font-size: 15px }
  .st { margin: 6px 0 0; font-size: 13px }
</style>
<p class="ta"><code>touch-action: pan-x</code> · spin a wheel up or down, flick it; sideways is the chat's swipe</p>
<div id="pk"><div id="band"></div></div>
<p id="out"></p>
<p class="st">Presses taken by the chat: <b id="tk">0</b></p>
<script>
var $ = function (id) { return document.getElementById(id); };
var IH = 36, took = 0, wheels = [];
var now = typeof performance !== 'undefined' ? function () { return performance.now(); } : Date.now;
function hap() { try { TelegramWidget.HapticFeedback.selectionChanged(); } catch (_) {} }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function out() { $('out').textContent = '⏰ Wake me at ' + wheels[0].label() + ':' + wheels[1].label(); }
function wheel(values, start) {
  var wh = document.createElement('div'), col = document.createElement('div'), items = [];
  wh.className = 'wh';
  col.className = 'col';
  values.forEach(function (v) {
    var it = document.createElement('div');
    it.className = 'it';
    it.textContent = pad(v);
    items.push(col.appendChild(it));
  });
  wh.appendChild(col);
  // y: the column's offset in px; item k sits in the band at y = (2 - k) * IH
  var w = { y: (2 - start) * IH, sel: start, press: null, v: 0, moved: false, raf: 0 };
  var minY = (2 - (values.length - 1)) * IH, maxY = 2 * IH;
  function draw() {
    col.style.top = w.y + 'px';
    var k = Math.max(0, Math.min(values.length - 1, Math.round(2 - w.y / IH)));
    if (k !== w.sel) { items[w.sel].className = 'it'; w.sel = k; hap(); out(); }
    items[k].className = 'it on';
  }
  function snapTo(k) {
    w.y = (2 - k) * IH;
    col.className = 'col snap';
    draw();
  }
  function coast() {
    var last = now();
    function step() {
      var t = now(), dt = Math.min(t - last, 40);
      last = t;
      w.y += w.v * dt;
      w.v *= Math.pow(0.994, dt);
      if (w.y > maxY || w.y < minY) w.v = 0;
      if (Math.abs(w.v) < 0.05) { snapTo(Math.round(2 - Math.max(minY, Math.min(maxY, w.y)) / IH)); return; }
      draw();
      w.raf = requestAnimationFrame(step);
    }
    w.raf = requestAnimationFrame(step);
  }
  wh.addEventListener('pointerdown', function (e) {
    cancelAnimationFrame(w.raf);
    col.className = 'col';
    // the pointer is captured, so the tap's click goes to the wheel: remember the number pressed
    w.press = { id: e.pointerId, sy: e.clientY, y: w.y, ly: e.clientY, lt: now(), k: items.indexOf(e.target) };
    w.v = 0;
    w.moved = false;
    try { wh.setPointerCapture(e.pointerId); } catch (_) {}
  });
  wh.addEventListener('pointermove', function (e) {
    var p = w.press;
    if (!p || e.pointerId !== p.id) return;
    var y = p.y + e.clientY - p.sy, t = now();
    // past the ends the wheel gives way at a third of the finger
    if (y > maxY) y = maxY + (y - maxY) / 3;
    if (y < minY) y = minY + (y - minY) / 3;
    if (t > p.lt) w.v = 0.6 * w.v + 0.4 * (e.clientY - p.ly) / (t - p.lt);
    p.ly = e.clientY;
    p.lt = t;
    if (Math.abs(e.clientY - p.sy) > 6) w.moved = true;
    w.y = y;
    draw();
  });
  wh.addEventListener('pointerup', function () {
    var p = w.press;
    if (!p) return;
    w.press = null;
    if (w.moved) coast();
    else snapTo(p.k >= 0 ? p.k : w.sel);
  });
  wh.addEventListener('pointercancel', function () {
    if (!w.press) return;
    w.y = w.press.y;
    w.press = null;
    snapTo(Math.round(2 - w.y / IH));
    $('tk').textContent = ++took;
  });
  w.label = function () { return pad(values[w.sel]); };
  w.el = wh;
  w.draw = draw;
  return w;
}
var hours = [], mins = [];
for (var h = 0; h < 24; h++) hours.push(h);
for (var m = 0; m < 60; m += 5) mins.push(m);
wheels = [wheel(hours, 7), wheel(mins, 6)];
var sep = document.createElement('div');
sep.className = 'sep';
sep.textContent = ':';
$('pk').append(wheels[0].el, sep, wheels[1].el);
wheels.forEach(function (w) { w.draw(); });
out();
</script>
