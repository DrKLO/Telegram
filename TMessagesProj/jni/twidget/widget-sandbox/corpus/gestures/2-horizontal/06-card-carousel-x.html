<!--
  gestures: touch-action: pan-y on the carousel, so it claims horizontal drags only (corpus/gestures/README.md)
  idea: a card carousel of trips on touch-action: pan-y. Swipe left and right to flip through the cards (a flick goes one card on), tap a card to pick it. Up or down over a card scrolls the chat, a hold opens the message menu, and a swipe here is never swipe-to-reply.
-->
<title>Weekend trips</title>
<style>
  .ta { margin: 0 0 8px; font-size: 13px; color: var(--tg-theme-hint-color) }
  #vp { margin: 0 8px; overflow: hidden; touch-action: pan-y }
  #tr { display: flex; gap: 10px }
  #tr.snap { transition: transform .3s cubic-bezier(.2, .8, .3, 1) }
  .card { flex: 0 0 78%; box-sizing: border-box; height: 190px; padding: 14px; border-radius: 14px; color: #fff }
  .card .e { font-size: 38px; line-height: 1.1 }
  .card h3 { margin: 18px 0 2px }
  .card p { margin: 0; font-size: 13px; opacity: .9 }
  .card.on { box-shadow: inset 0 0 0 3px #fff }
  #dots { display: flex; justify-content: center; gap: 6px; margin: 10px 0 0 }
  #dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--tg-theme-hint-color); opacity: .4 }
  #dots i.on { background: var(--tg-theme-button-color); opacity: 1 }
  .st { margin: 8px 0 0; font-size: 13px }
</style>
<p class="ta"><code>touch-action: pan-y</code> · swipe sideways through the cards, tap one to pick it; up or down scrolls the chat</p>
<div id="vp"><div id="tr"></div></div>
<div id="dots"></div>
<p class="st"><span id="pk">No trip picked</span> · presses taken by the chat: <b id="tk">0</b></p>
<script>
var $ = function (id) { return document.getElementById(id); };
var trips = [
  ['🏔️', 'Dolomites', '2 nights · hiking · from €240', '#5c6bc0, #26a69a'],
  ['🌊', 'Lisbon', '3 nights · surf and tiles · from €310', '#1e88e5, #00acc1'],
  ['🏯', 'Kyoto', '4 nights · temples · from €890', '#d81b60, #8e24aa'],
  ['🌋', 'Reykjavík', '3 nights · hot springs · from €520', '#455a64, #ef6c00'],
  ['🍷', 'Tbilisi', '2 nights · food and wine · from €190', '#6d4c41, #c62828'],
];
var vp = $('vp'), tr = $('tr'), dots = $('dots'), cards = [], ds = [];
var i = 0, press = null, took = 0, w = 280, tapped = -1;
trips.forEach(function (t) {
  var c = document.createElement('div');
  c.className = 'card';
  c.style.background = 'linear-gradient(135deg, ' + t[3] + ')';
  var e = document.createElement('div');
  e.className = 'e';
  e.textContent = t[0];
  var h = document.createElement('h3');
  h.textContent = t[1];
  var p = document.createElement('p');
  p.textContent = t[2];
  c.append(e, h, p);
  tr.appendChild(c);
  cards.push(c);
  ds.push(dots.appendChild(document.createElement('i')));
});
// the current card in the middle, its neighbours peeking in at the sides; dx: the finger, in px
function draw(dx) {
  tr.style.transform = 'translateX(calc(11% - ' + i + ' * (78% + 10px) + ' + (dx || 0) + 'px))';
}
function go(n) {
  i = Math.max(0, Math.min(trips.length - 1, n));
  tr.className = 'snap';
  draw(0);
  ds.forEach(function (d, k) { d.className = k === i ? 'on' : ''; });
}
go(0);
tr.className = '';
vp.addEventListener('pointerdown', function (e) {
  w = vp.clientWidth || w;
  press = { id: e.pointerId, sx: e.clientX, dx: 0, t: Date.now() };
  // the pointer is captured, so the tap's click goes to the carousel: remember the card pressed
  for (var el = e.target; el && cards.indexOf(el) < 0; el = el.parentNode);
  tapped = el ? cards.indexOf(el) : -1;
  tr.className = '';
  try { vp.setPointerCapture(e.pointerId); } catch (_) {}
});
vp.addEventListener('pointermove', function (e) {
  if (!press || e.pointerId !== press.id) return;
  press.dx = e.clientX - press.sx;
  // resistance past the first and the last card
  var edge = (i === 0 && press.dx > 0) || (i === trips.length - 1 && press.dx < 0);
  draw(edge ? press.dx / 3 : press.dx);
});
vp.addEventListener('pointerup', function () {
  if (!press) return;
  var dx = press.dx, fast = Math.abs(dx) > 24 && Date.now() - press.t < 250;
  press = null;
  if (Math.abs(dx) > 6) tapped = -1; // a mouse drag still ends with a click
  go(dx < -w * 0.25 || (fast && dx < 0) ? i + 1 : dx > w * 0.25 || (fast && dx > 0) ? i - 1 : i);
});
vp.addEventListener('click', function () {
  if (tapped < 0) return;
  cards.forEach(function (x, k) { x.className = 'card' + (k === tapped ? ' on' : ''); });
  $('pk').textContent = '✓ ' + trips[tapped][1];
  go(tapped);
});
vp.addEventListener('pointercancel', function () {
  if (!press) return;
  press = null;
  $('tk').textContent = ++took;
  go(i);
});
</script>
