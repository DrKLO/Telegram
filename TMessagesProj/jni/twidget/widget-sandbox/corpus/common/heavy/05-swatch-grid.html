<!--
  common profile: only what WebView, Blitz and litehtml all render (corpus/common/README.md)
  idea: many-small-boxes stress — a 16 × 14 palette of 224 cells (flex rows, inline styles with hsl()), tap a cell to show its value and tint the header
-->
<style>
  :root { --fg: #000; --muted: #6e6e73; --card: #fff; --fill: rgba(127,127,127,0.12); --fill2: rgba(127,127,127,0.22); --border: rgba(0,0,0,0.10);
    --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9500; --purple: #af52de; --teal: #30b0c7; }
  @media (prefers-color-scheme: dark) { :root { --fg: #fff; --muted: #98989d; --card: #1c1c1e; --border: rgba(255,255,255,0.14); } }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { width: 392px; max-width: 100%; box-sizing: border-box; background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .grow { flex-grow: 1; flex-basis: 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; } .bold { font-weight: 700; }
  .btn { display: inline-block; padding: 6px 14px; border-radius: 9px; font-weight: 600; text-align: center; background-color: var(--fill); color: var(--fg); cursor: pointer; }
  .btn.primary { background-color: var(--blue); color: #fff; }
  .btn:active { background-color: var(--fill2); }
  [hidden] { display: none; }

  .pick { height: 56px; border-radius: 12px; margin-top: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-family: ui-monospace, monospace; font-weight: 700; background-color: #4a6cf7; }
  .pal { margin-top: 10px; }
  .r { display: flex; }
  .s { flex-grow: 1; flex-basis: 0; height: 20px; margin: 1px; border-radius: 3px; cursor: pointer; }
  .s.on { border: 2px solid #fff; margin: -1px; }
  .axis { display: flex; margin-top: 4px; }
  .axis span { flex-grow: 1; flex-basis: 0; font-size: 9px; color: var(--muted); text-align: center; }
  .legend { display: flex; align-items: center; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin: 0 4px 0 10px; }
</style>
<div class="card">
  <div class="row between"><span class="bold" style="font-size: 16px">Palette explorer</span><span class="tiny muted">224 swatches · hue × lightness</span></div>
  <div class="pick" id="pick">hsl(228, 90%, 63%)</div>
  <div class="pal" id="pal"></div>
  <div class="axis"><span>0°</span><span>45°</span><span>90°</span><span>135°</span><span>180°</span><span>225°</span><span>270°</span><span>315°</span></div>
  <div class="legend">rows: lightness 92% at the top to 14% at the bottom<i style="background-color: hsl(228, 90%, 92%)"></i>light<i style="background-color: hsl(228, 90%, 14%)"></i>dark</div>
</div>
<script>
const COLS = 16, ROWS = 14;
const pal = document.getElementById('pal');
let h = '';
for (let r = 0; r < ROWS; r++) {
  h += '<div class="r">';
  for (let c = 0; c < COLS; c++) {
    const hue = Math.round(c * 360 / COLS), light = Math.round(92 - r * 6), sat = 60 + Math.round(30 * (1 - Math.abs(r - 6) / 7));
    h += `<span class="s" data-v="hsl(${hue}, ${sat}%, ${light}%)" style="background-color: hsl(${hue}, ${sat}%, ${light}%)"></span>`;
  }
  h += '</div>';
}
pal.innerHTML = h;
let cur = null;
pal.addEventListener('click', e => {
  const s = e.target.closest('.s');
  if (!s) return;
  if (cur) cur.classList.remove('on');
  cur = s; s.classList.add('on');
  const pick = document.getElementById('pick');
  pick.textContent = s.dataset.v;
  pick.style.backgroundColor = s.dataset.v;
  pick.style.color = /, (9|8|7)\d%\)$/.test(s.dataset.v) ? '#000' : '#fff';
});
</script>
