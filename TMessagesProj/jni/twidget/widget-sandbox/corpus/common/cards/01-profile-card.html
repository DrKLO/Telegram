<!--
  common profile: only what WebView, Blitz and litehtml all render (corpus/common/README.md)
  idea: a contact card — avatar from a gradient circle, stats row, tags, two actions
  (Portfolio links out with openLink; Follow is local state in localStorage, restored on load)
-->
<style>
  :root { --fg: #000; --muted: #6e6e73; --card: #fff; --fill: rgba(127,127,127,0.12); --fill2: rgba(127,127,127,0.22); --border: rgba(0,0,0,0.10);
    --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9500; --purple: #af52de; --teal: #30b0c7; }
  @media (prefers-color-scheme: dark) { :root { --fg: #fff; --muted: #98989d; --card: #1c1c1e; --border: rgba(255,255,255,0.14); } }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { width: 392px; max-width: 100%; box-sizing: border-box; background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .grow { flex-grow: 1; flex-basis: 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; } .bold { font-weight: 700; }
  .btn { display: inline-block; padding: 6px 14px; border-radius: 9px; font-weight: 600; text-align: center; background-color: var(--fill); color: var(--fg); cursor: pointer; }
  .btn.primary { background-color: var(--blue); color: #fff; }
  .btn:active { background-color: var(--fill2); }
  [hidden] { display: none; }

  .cover { height: 72px; margin: -12px -14px 0 -14px; border-radius: 13px 13px 0 0; background: linear-gradient(120deg, #5b8def 0%, #8f5bff 55%, #ff6fb1 100%); }
  .avatar { width: 64px; height: 64px; margin-top: -32px; border-radius: 32px; border: 3px solid var(--card); background: linear-gradient(145deg, #ffb86b, #ff5e62); color: #fff; font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .name { font-size: 18px; font-weight: 800; margin-top: 6px; }
  .bio { margin-top: 6px; }
  .stats { margin-top: 12px; padding: 8px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .stats .grow { text-align: center; }
  .stats .n { font-size: 17px; font-weight: 800; }
  .tags { margin-top: 10px; display: flex; flex-wrap: wrap; }
  .tag { padding: 3px 9px; margin: 0 6px 6px 0; border-radius: 8px; font-size: 12px; font-weight: 600; background-color: var(--fill); }
  .tag.blue { background-color: rgba(0,122,255,0.14); color: var(--blue); }
  .tag.purple { background-color: rgba(175,82,222,0.14); color: var(--purple); }
  .tag.teal { background-color: rgba(48,176,199,0.16); color: var(--teal); }
  .actions { margin-top: 10px; display: flex; }
  .actions .btn { flex-grow: 1; flex-basis: 0; margin-right: 8px; }
  .actions .btn:last-child { margin-right: 0; }
  .online { display: inline-block; width: 8px; height: 8px; border-radius: 4px; background-color: var(--green); margin-right: 5px; }
</style>
<div class="card">
  <div class="cover"></div>
  <div class="avatar">MK</div>
  <div class="name">Maya Kowalski</div>
  <div class="small muted">@maya · Product designer at Northwind</div>
  <div class="bio">Designs the onboarding flow and the rich-message kit. Talks in sketches, ships in Figma.</div>
  <div class="row stats">
    <div class="grow"><div class="n">128</div><div class="tiny muted">Posts</div></div>
    <div class="grow"><div class="n">4.2k</div><div class="tiny muted">Followers</div></div>
    <div class="grow"><div class="n">311</div><div class="tiny muted">Following</div></div>
  </div>
  <div class="tags">
    <span class="tag blue">Design systems</span><span class="tag purple">Motion</span><span class="tag teal">Accessibility</span><span class="tag">Berlin</span><span class="tag">UTC+1</span>
  </div>
  <div class="actions">
    <span class="btn primary" role="button" data-act="portfolio">Portfolio</span>
    <span class="btn" role="button" data-act="follow" id="follow">Follow</span>
  </div>
  <div class="tiny muted" style="margin-top: 8px"><span class="online"></span>Online now · last seen just now</div>
</div>
<script>
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const follow = document.getElementById('follow');
let following = !!(store.get('profile-card') || {}).following;
function paint() {
  follow.textContent = following ? 'Following' : 'Follow';
  follow.classList.toggle('primary', following);
}
if (following) paint();
document.querySelector('.card').addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.dataset.act === 'portfolio' && typeof TelegramWidget !== 'undefined') TelegramWidget.openLink('https://example.com/maya');
  if (t.dataset.act === 'follow') {
    following = !following;
    store.set('profile-card', { following });
    paint();
  }
});
</script>
