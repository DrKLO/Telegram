<!--
  common profile: only what WebView, Blitz and litehtml all render (corpus/common/README.md)
  idea: a weekly timetable — a bordered <table> with coloured cells, a legend of chips, today's column tinted
-->
<style>
  :root { --fg: #000; --muted: #6e6e73; --card: #fff; --fill: rgba(127,127,127,0.12); --fill2: rgba(127,127,127,0.22); --border: rgba(0,0,0,0.10);
    --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9500; --purple: #af52de; --teal: #30b0c7; }
  @media (prefers-color-scheme: dark) { :root { --fg: #fff; --muted: #98989d; --card: #1c1c1e; --border: rgba(255,255,255,0.14); } }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { width: 392px; max-width: 100%; box-sizing: border-box; background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .grow { flex-grow: 1; flex-basis: 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; } .bold { font-weight: 700; }
  .btn { display: inline-block; padding: 6px 14px; border-radius: 9px; font-weight: 600; text-align: center; background-color: var(--fill); color: var(--fg); cursor: pointer; }
  .btn.primary { background-color: var(--blue); color: #fff; }
  .btn:active { background-color: var(--fill2); }
  [hidden] { display: none; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th { width: 18%; font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 2px; border-bottom: 1px solid var(--border); }
  th.h { width: 10%; }
  th.today { color: var(--blue); }
  td { padding: 4px 2px; border-bottom: 1px solid var(--border); font-size: 10px; text-align: center; vertical-align: middle; }
  td.h { color: var(--muted); font-size: 10px; text-align: right; padding-right: 6px; }
  td.today { background-color: rgba(0,122,255,0.06); }
  .ev { border-radius: 6px; padding: 7px 2px; font-weight: 700; line-height: 1.15; }
  .ev.m { background-color: rgba(0,122,255,0.18); color: #0a5ad1; }
  .ev.d { background-color: rgba(52,199,89,0.22); color: #1f8f3e; }
  .ev.f { background-color: rgba(255,149,0,0.22); color: #b36400; }
  .ev.r { background-color: rgba(175,82,222,0.2); color: #7c2ca8; }
  @media (prefers-color-scheme: dark) { .ev.m { color: #7fb6ff; } .ev.d { color: #7fe39a; } .ev.f { color: #ffc266; } .ev.r { color: #d9a3ff; } }
  .legend { display: flex; flex-wrap: wrap; margin-top: 8px; }
  .legend span { font-size: 11px; margin-right: 12px; display: flex; align-items: center; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; }
</style>
<div class="card">
  <div class="row between"><span class="bold" style="font-size: 16px">Week 41</span><span class="small muted">6–10 Oct · 14 events</span></div>
  <table>
    <tr><th class="h"></th><th>Mon</th><th>Tue</th><th>Wed</th><th class="today">Thu</th><th>Fri</th></tr>
    <tr><td class="h">9:00</td><td><div class="ev m">Standup</div></td><td><div class="ev m">Standup</div></td><td><div class="ev m">Standup</div></td><td class="today"><div class="ev m">Standup</div></td><td><div class="ev m">Standup</div></td></tr>
    <tr><td class="h">10:00</td><td></td><td><div class="ev d">Design crit</div></td><td></td><td class="today"><div class="ev d">Design crit</div></td><td></td></tr>
    <tr><td class="h">11:00</td><td><div class="ev f">Focus</div></td><td></td><td><div class="ev r">1:1 Leo</div></td><td class="today"></td><td><div class="ev f">Focus</div></td></tr>
    <tr><td class="h">13:00</td><td></td><td><div class="ev r">Interview</div></td><td></td><td class="today"><div class="ev d">Kit review</div></td><td></td></tr>
    <tr><td class="h">15:00</td><td><div class="ev d">Planning</div></td><td></td><td><div class="ev f">Focus</div></td><td class="today"></td><td><div class="ev m">Demo</div></td></tr>
    <tr><td class="h">17:00</td><td></td><td></td><td></td><td class="today"><div class="ev r">Retro</div></td><td></td></tr>
  </table>
  <div class="legend"><span><i style="background-color: var(--blue)"></i>Team</span><span><i style="background-color: var(--green)"></i>Design</span><span><i style="background-color: var(--orange)"></i>Focus time</span><span><i style="background-color: var(--purple)"></i>People</span></div>
</div>
