<!--
  common profile: only what WebView, Blitz and litehtml all render (corpus/common/README.md)
  idea: three big numbers counting up on load (requestAnimationFrame, 1.4 s, text only), then a sparkline-ish row of div bars that grows; Replay
-->
<style>
  :root { --fg: #000; --muted: #6e6e73; --card: #fff; --fill: rgba(127,127,127,0.12); --fill2: rgba(127,127,127,0.22); --border: rgba(0,0,0,0.10);
    --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9500; --purple: #af52de; --teal: #30b0c7; }
  @media (prefers-color-scheme: dark) { :root { --fg: #fff; --muted: #98989d; --card: #1c1c1e; --border: rgba(255,255,255,0.14); } }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { width: 392px; max-width: 100%; box-sizing: border-box; background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .grow { flex-grow: 1; flex-basis: 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; } .bold { font-weight: 700; }
  .btn { display: inline-block; padding: 6px 14px; border-radius: 9px; font-weight: 600; text-align: center; background-color: var(--fill); color: var(--fg); cursor: pointer; }
  .btn.primary { background-color: var(--blue); color: #fff; }
  .btn:active { background-color: var(--fill2); }
  [hidden] { display: none; }

  .nums { display: flex; margin-top: 10px; }
  .num { flex-grow: 1; flex-basis: 0; padding: 10px 8px; border-radius: 12px; background-color: var(--fill); margin-right: 8px; }
  .num:last-child { margin-right: 0; }
  .num .v { font-size: 26px; font-weight: 800; line-height: 1.1; font-family: ui-monospace, monospace; }
  .num .l { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .num .d { font-size: 11px; font-weight: 700; color: var(--green); }
  .spark { display: flex; align-items: flex-end; height: 56px; margin-top: 12px; }
  .spark i { flex-grow: 1; flex-basis: 0; margin: 0 1px; border-radius: 2px 2px 0 0; background-color: var(--blue); height: 0; }
  .spark i.now { background-color: var(--green); }
</style>
<div class="card">
  <div class="row between"><span class="bold" style="font-size: 16px">Launch day so far</span><span class="tiny muted" id="t">live</span></div>
  <div class="nums">
    <div class="num"><div class="v" data-to="18432" data-fmt="int">0</div><div class="l">Installs</div><div class="d">+212% vs avg</div></div>
    <div class="num"><div class="v" data-to="4.87" data-fmt="rating">0.00</div><div class="l">Rating</div><div class="d">1,204 reviews</div></div>
    <div class="num"><div class="v" data-to="96300" data-fmt="money">€0</div><div class="l">Revenue</div><div class="d">goal €80k</div></div>
  </div>
  <div class="spark" id="spark"></div>
  <div class="row between tiny muted" style="margin-top: 3px"><span>00:00</span><span>installs per hour</span><span>now</span></div>
  <div style="text-align: right; margin-top: 10px"><span class="btn" role="button" id="replay">Replay</span></div>
</div>
<script>
const HOURS = [120, 95, 80, 70, 90, 180, 420, 900, 1400, 1650, 1700, 1850, 1900, 1750, 1600, 1500, 1450, 1300, 1200, 1100, 980, 820, 700, 560];
const spark = document.getElementById('spark');
spark.innerHTML = HOURS.map((_, i) => `<i${i === 23 ? ' class="now"' : ''}></i>`).join('');
const bars = [...spark.children], nums = [...document.querySelectorAll('.v')];
const group = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const fmt = (v, kind) => kind === 'int' ? group(v) : kind === 'rating' ? v.toFixed(2) : '€' + group(v);
const ease = t => 1 - Math.pow(1 - t, 3);
let run = 0;
function play() {
  const me = ++run, t0 = performance.now(), max = Math.max(...HOURS);
  const frame = () => {
    if (me !== run) return;
    const t = Math.min(1, (performance.now() - t0) / 1400), e = ease(t);
    for (const n of nums) n.textContent = fmt(Number(n.dataset.to) * e, n.dataset.fmt);
    const upto = t * 24;
    bars.forEach((b, i) => { const k = Math.max(0, Math.min(1, upto - i)); b.style.height = (HOURS[i] / max * 100 * k).toFixed(0) + '%'; });
    document.getElementById('t').textContent = t < 1 ? 'updating' : 'live';
    if (t < 1) requestAnimationFrame(frame);
  };
  frame();
}
document.getElementById('replay').addEventListener('click', play);
setTimeout(play, 200);
</script>
