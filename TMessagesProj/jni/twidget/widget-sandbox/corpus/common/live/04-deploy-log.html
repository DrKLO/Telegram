<!--
  common profile: only what WebView, Blitz and litehtml all render (corpus/common/README.md)
  idea: a deploy that unfolds — a log line appended every 550 ms (12 lines, insertAdjacentHTML), stage pills flip state, a final badge; Run again
-->
<style>
  :root { --fg: #000; --muted: #6e6e73; --card: #fff; --fill: rgba(127,127,127,0.12); --fill2: rgba(127,127,127,0.22); --border: rgba(0,0,0,0.10);
    --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9500; --purple: #af52de; --teal: #30b0c7; }
  @media (prefers-color-scheme: dark) { :root { --fg: #fff; --muted: #98989d; --card: #1c1c1e; --border: rgba(255,255,255,0.14); } }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { width: 392px; max-width: 100%; box-sizing: border-box; background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .grow { flex-grow: 1; flex-basis: 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; } .bold { font-weight: 700; }
  .btn { display: inline-block; padding: 6px 14px; border-radius: 9px; font-weight: 600; text-align: center; background-color: var(--fill); color: var(--fg); cursor: pointer; }
  .btn.primary { background-color: var(--blue); color: #fff; }
  .btn:active { background-color: var(--fill2); }
  [hidden] { display: none; }

  .badge { display: inline-block; padding: 2px 9px; border-radius: 9px; font-size: 11px; font-weight: 700; background-color: var(--fill); }
  .badge.run { background-color: rgba(0,122,255,0.16); color: var(--blue); }
  .badge.ok { background-color: rgba(52,199,89,0.18); color: var(--green); }
  .stages { display: flex; margin-top: 10px; }
  .stg { flex-grow: 1; flex-basis: 0; text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 5px 0; border-radius: 8px; background-color: var(--fill); margin-right: 5px; }
  .stg:last-child { margin-right: 0; }
  .stg.run { background-color: var(--blue); color: #fff; }
  .stg.ok { background-color: rgba(52,199,89,0.2); color: var(--green); }
  .log { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background-color: #0f1117; color: #d6deeb; font-family: ui-monospace, monospace; font-size: 11.5px; line-height: 1.5; min-height: 180px; }
  .ln { display: flex; }
  .ln .ts { color: #6b7280; width: 54px; flex-shrink: 0; }
  .ln.ok .msg { color: #7ee787; } .ln.warn .msg { color: #ffd166; } .ln.info .msg { color: #79c0ff; }
  .ln .msg { white-space: nowrap; overflow: hidden; }
  .cursor { display: inline-block; width: 7px; height: 12px; background-color: #d6deeb; margin-left: 2px; }
</style>
<div class="card">
  <div class="row between"><span class="bold" style="font-size: 16px">Deploy <span style="font-family: ui-monospace, monospace">v2.14.0</span></span><span class="badge" id="badge">queued</span></div>
  <div class="tiny muted">web · eu-west-1 · triggered by Leo</div>
  <div class="stages" id="stages"><span class="stg">Build</span><span class="stg">Test</span><span class="stg">Push</span><span class="stg">Rollout</span><span class="stg">Verify</span></div>
  <div class="log" id="log"></div>
  <div class="row between" style="margin-top: 10px"><span class="tiny muted" id="dur"></span><span class="btn" role="button" id="again">Run again</span></div>
</div>
<script>
const STEPS = [
  [0, 'info', 'checking out 7db28f2 (main)'],
  [0, '', 'pnpm install · 412 packages, cached'],
  [0, 'ok', 'build ok · 1.8 MB gzip, 14 chunks'],
  [1, '', 'vitest · 268 tests'],
  [1, 'warn', '1 flaky retry: feed.spec.ts > snapshot-and-drop'],
  [1, 'ok', 'tests ok · 268 passed'],
  [2, '', 'docker build web:v2.14.0'],
  [2, 'ok', 'pushed sha256:9f3a…c21e (92 MB)'],
  [3, 'info', 'rolling 1/6 pods'],
  [3, 'info', 'rolling 4/6 pods · readiness ok'],
  [3, 'ok', '6/6 pods healthy'],
  [4, 'ok', 'smoke checks ok · p95 142 ms · deployed'],
];
const log = document.getElementById('log'), badge = document.getElementById('badge'), stages = [...document.getElementById('stages').children];
let timer = 0, i = 0, t0 = 0;
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ts = () => { const s = (performance.now() - t0) / 1000; return s.toFixed(1).padStart(5, ' ') + 's'; };
function step() {
  const cur = log.querySelector('.cursor'); if (cur) cur.remove();
  if (i >= STEPS.length) {
    badge.textContent = 'deployed'; badge.className = 'badge ok';
    document.getElementById('dur').textContent = 'finished in ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s';
    return;
  }
  const [stage, kind, msg] = STEPS[i++];
  stages.forEach((s, k) => { s.className = 'stg' + (k < stage ? ' ok' : k === stage ? ' run' : ''); });
  if (i === STEPS.length) stages[4].className = 'stg ok';
  log.insertAdjacentHTML('beforeend', `<div class="ln ${kind}"><span class="ts">${ts()}</span><span class="msg">${esc(msg)}</span></div>`);
  if (i < STEPS.length) log.insertAdjacentHTML('beforeend', '<span class="cursor"></span>');
  timer = setTimeout(step, 550);
}
function start() {
  clearTimeout(timer); i = 0; t0 = performance.now();
  log.innerHTML = ''; badge.textContent = 'running'; badge.className = 'badge run';
  document.getElementById('dur').textContent = '';
  timer = setTimeout(step, 300);
}
document.getElementById('again').addEventListener('click', start);
start();
</script>
