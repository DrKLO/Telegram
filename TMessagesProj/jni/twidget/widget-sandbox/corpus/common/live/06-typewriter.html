<!--
  common profile: only what WebView, Blitz and litehtml all render (corpus/common/README.md)
  idea: an assistant reply typed out character by character (setTimeout 28 ms, textContent), then a second bubble with a list; Replay
-->
<style>
  :root { --fg: #000; --muted: #6e6e73; --card: #fff; --fill: rgba(127,127,127,0.12); --fill2: rgba(127,127,127,0.22); --border: rgba(0,0,0,0.10);
    --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9500; --purple: #af52de; --teal: #30b0c7; }
  @media (prefers-color-scheme: dark) { :root { --fg: #fff; --muted: #98989d; --card: #1c1c1e; --border: rgba(255,255,255,0.14); } }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { width: 392px; max-width: 100%; box-sizing: border-box; background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .grow { flex-grow: 1; flex-basis: 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; } .bold { font-weight: 700; }
  .btn { display: inline-block; padding: 6px 14px; border-radius: 9px; font-weight: 600; text-align: center; background-color: var(--fill); color: var(--fg); cursor: pointer; }
  .btn.primary { background-color: var(--blue); color: #fff; }
  .btn:active { background-color: var(--fill2); }
  [hidden] { display: none; }

  .msg { display: flex; align-items: flex-start; margin-top: 10px; }
  .av { width: 28px; height: 28px; border-radius: 14px; margin-right: 8px; flex-shrink: 0; background: linear-gradient(135deg, #5b8def, #8f5bff); color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .bub { padding: 8px 12px; border-radius: 12px; background-color: var(--fill); min-height: 18px; }
  .bub.me { background-color: var(--blue); color: #fff; margin-left: auto; }
  .caret { display: inline-block; width: 2px; height: 14px; background-color: var(--fg); margin-left: 1px; }
  .bub ul { margin: 6px 0 0 0; padding-left: 18px; }
  .bub li { margin: 2px 0; }
  .typing { display: flex; align-items: center; height: 18px; }
  .typing i { width: 6px; height: 6px; border-radius: 3px; background-color: var(--muted); margin-right: 4px; }
  .typing i.on { background-color: var(--fg); }
</style>
<div class="card">
  <div class="row between"><span class="bold" style="font-size: 16px">Assistant</span><span class="tiny muted" id="st">typing</span></div>
  <div class="msg"><div class="bub me">Which renderer should I use for a chat bubble?</div></div>
  <div class="msg"><div class="av">AI</div><div class="bub" id="b1"><div class="typing" id="dots"><i class="on"></i><i></i><i></i></div></div></div>
  <div class="msg" id="m2" hidden><div class="av">AI</div><div class="bub" id="b2"></div></div>
  <div style="text-align: right; margin-top: 10px"><span class="btn" role="button" id="replay">Replay</span></div>
</div>
<script>
const TEXT1 = 'It depends on what the widget needs. A system WebView renders everything but costs a process and a cold start. Blitz keeps the modern CSS profile and lays out a card in a few milliseconds. litehtml is the lightest, but it re-parses the document on every update and has no grid, SVG or transforms.';
const TEXT2 = 'For this corpus all three draw the same picture, so the numbers compare fairly:';
const ITEMS = ['start-up to first paint', 'cost of a text-only update', 'cost of a full re-layout', 'memory per bubble'];
let timer = 0, run = 0;
const b1 = document.getElementById('b1'), b2 = document.getElementById('b2'), st = document.getElementById('st');
function type(el, text, done) {
  const me = run;
  let i = 0;
  const caret = document.createElement('span'); caret.className = 'caret';
  const node = document.createTextNode('');
  el.textContent = ''; el.appendChild(node); el.appendChild(caret);
  const step = () => {
    if (me !== run) return;
    node.data = text.slice(0, ++i);
    if (i < text.length) timer = setTimeout(step, text[i - 1] === '.' ? 180 : text[i - 1] === ',' ? 90 : 28);
    else { caret.remove(); done(); }
  };
  step();
}
function start() {
  clearTimeout(timer); run++;
  const me = run;
  st.textContent = 'typing';
  document.getElementById('m2').hidden = true; b2.textContent = '';
  b1.innerHTML = '<div class="typing" id="dots"><i class="on"></i><i></i><i></i></div>';
  let k = 0;
  const dots = () => { if (me !== run) return; const d = b1.querySelectorAll('.typing i'); if (!d.length) return; d.forEach((x, j) => x.classList.toggle('on', j === k % 3)); k++; timer = setTimeout(dots, 220); };
  dots();
  setTimeout(() => {
    if (me !== run) return;
    clearTimeout(timer);
    type(b1, TEXT1, () => {
      document.getElementById('m2').hidden = false;
      type(b2, TEXT2, () => {
        const ul = document.createElement('ul');
        b2.appendChild(ul);
        let n = 0;
        const add = () => { if (me !== run) return; const li = document.createElement('li'); li.textContent = ITEMS[n++]; ul.appendChild(li); if (n < ITEMS.length) timer = setTimeout(add, 260); else st.textContent = 'done'; };
        add();
      });
    });
  }, 900);
}
document.getElementById('replay').addEventListener('click', start);
start();
</script>
