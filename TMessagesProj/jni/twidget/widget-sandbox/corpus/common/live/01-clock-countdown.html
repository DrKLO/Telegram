<!--
  common profile: only what WebView, Blitz and litehtml all render (corpus/common/README.md)
  idea: a live clock and a launch countdown — one setInterval at 1 Hz updating text only (the cheapest possible update, forever)
-->
<style>
  :root { --fg: #000; --muted: #6e6e73; --card: #fff; --fill: rgba(127,127,127,0.12); --fill2: rgba(127,127,127,0.22); --border: rgba(0,0,0,0.10);
    --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9500; --purple: #af52de; --teal: #30b0c7; }
  @media (prefers-color-scheme: dark) { :root { --fg: #fff; --muted: #98989d; --card: #1c1c1e; --border: rgba(255,255,255,0.14); } }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { width: 392px; max-width: 100%; box-sizing: border-box; background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .grow { flex-grow: 1; flex-basis: 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; } .bold { font-weight: 700; }
  .btn { display: inline-block; padding: 6px 14px; border-radius: 9px; font-weight: 600; text-align: center; background-color: var(--fill); color: var(--fg); cursor: pointer; }
  .btn.primary { background-color: var(--blue); color: #fff; }
  .btn:active { background-color: var(--fill2); }
  [hidden] { display: none; }

  .hero { border-radius: 12px; padding: 14px; color: #fff; background: linear-gradient(135deg, #0b1b3a 0%, #1a3a7a 60%, #3b6fd6 100%); }
  .clock { font-size: 40px; font-weight: 800; line-height: 1; font-family: ui-monospace, monospace; }
  .zones { display: flex; margin-top: 10px; }
  .zones div { flex-grow: 1; flex-basis: 0; font-size: 11px; color: rgba(255,255,255,0.75); }
  .zones b { display: block; font-size: 15px; color: #fff; font-family: ui-monospace, monospace; }
  .cd { display: flex; margin-top: 12px; }
  .cd div { flex-grow: 1; flex-basis: 0; text-align: center; padding: 8px 0; border-radius: 10px; background-color: var(--fill); margin-right: 6px; }
  .cd div:last-child { margin-right: 0; }
  .cd b { display: block; font-size: 24px; font-weight: 800; font-family: ui-monospace, monospace; }
  .cd span { font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .bar { height: 6px; border-radius: 3px; background-color: var(--fill); margin-top: 10px; overflow: hidden; }
  .bar div { height: 6px; background-color: var(--orange); }
</style>
<div class="card">
  <div class="hero">
    <div class="tiny" style="color: rgba(255,255,255,0.75)">Berlin · local time</div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="zones"><div>Lisbon<b id="z0">--:--</b></div><div>New York<b id="z1">--:--</b></div><div>Tbilisi<b id="z2">--:--</b></div><div>Tokyo<b id="z3">--:--</b></div></div>
  </div>
  <div class="row between" style="margin-top: 12px"><span class="bold">Kit v2 launch</span><span class="tiny muted">1 Dec 2026, 10:00</span></div>
  <div class="cd"><div><b id="d">0</b><span>days</span></div><div><b id="h">0</b><span>hours</span></div><div><b id="m">0</b><span>min</span></div><div><b id="s">0</b><span>sec</span></div></div>
  <div class="bar"><div id="prog" style="width: 0"></div></div>
  <div class="tiny muted" style="margin-top: 4px" id="note"></div>
</div>
<script>
const TARGET = Date.UTC(2026, 11, 1, 9, 0, 0), START = Date.UTC(2026, 9, 1, 0, 0, 0);
const OFF = [1, 0, -5, 3, 8]; // hours from UTC: Berlin (display), Lisbon, New York, Tbilisi, Tokyo (illustrative, no DST)
const pad = n => (n < 10 ? '0' : '') + n;
const hm = (t, off) => { const d = new Date(t + off * 3600000); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); };
const el = id => document.getElementById(id);
function tick() {
  const now = Date.now();
  const b = new Date(now + OFF[0] * 3600000);
  el('clock').textContent = pad(b.getUTCHours()) + ':' + pad(b.getUTCMinutes()) + ':' + pad(b.getUTCSeconds());
  for (let i = 0; i < 4; i++) el('z' + i).textContent = hm(now, OFF[i + 1]);
  let left = Math.max(0, TARGET - now);
  const d = Math.floor(left / 86400000); left -= d * 86400000;
  const h = Math.floor(left / 3600000); left -= h * 3600000;
  const m = Math.floor(left / 60000); left -= m * 60000;
  el('d').textContent = d; el('h').textContent = pad(h); el('m').textContent = pad(m); el('s').textContent = pad(Math.floor(left / 1000));
  const p = Math.min(100, Math.max(0, (now - START) / (TARGET - START) * 100));
  el('prog').style.width = p.toFixed(1) + '%';
  el('note').textContent = p.toFixed(1) + '% of the countdown elapsed';
}
tick();
setInterval(tick, 1000);
</script>
