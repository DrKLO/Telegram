<!--
  common profile: only what WebView, Blitz and litehtml all render (corpus/common/README.md)
  idea: a loading skeleton (grey blocks that alternate two shades every 400 ms) replaced by the real card after 1.4 s: one big innerHTML swap; Reload
-->
<style>
  :root { --fg: #000; --muted: #6e6e73; --card: #fff; --fill: rgba(127,127,127,0.12); --fill2: rgba(127,127,127,0.22); --border: rgba(0,0,0,0.10);
    --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9500; --purple: #af52de; --teal: #30b0c7; }
  @media (prefers-color-scheme: dark) { :root { --fg: #fff; --muted: #98989d; --card: #1c1c1e; --border: rgba(255,255,255,0.14); } }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { width: 392px; max-width: 100%; box-sizing: border-box; background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .grow { flex-grow: 1; flex-basis: 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; } .bold { font-weight: 700; }
  .btn { display: inline-block; padding: 6px 14px; border-radius: 9px; font-weight: 600; text-align: center; background-color: var(--fill); color: var(--fg); cursor: pointer; }
  .btn.primary { background-color: var(--blue); color: #fff; }
  .btn:active { background-color: var(--fill2); }
  [hidden] { display: none; }

  .sk { background-color: var(--fill); border-radius: 6px; }
  .pulse .sk { background-color: var(--fill2); }
  .sk.line { height: 12px; margin-top: 8px; }
  .sk.img { height: 140px; border-radius: 12px; }
  .sk.av { width: 36px; height: 36px; border-radius: 18px; margin-right: 10px; }
  .hero { height: 140px; border-radius: 12px; background: linear-gradient(135deg, #1d3557 0%, #457b9d 50%, #a8dadc 100%); }
  .meta { display: flex; align-items: center; margin-top: 10px; }
  .meta .av { width: 36px; height: 36px; border-radius: 18px; margin-right: 10px; background: linear-gradient(135deg, #ffb86b, #ff5e62); color: #fff; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .title { font-size: 17px; font-weight: 800; margin-top: 10px; }
  .chips { display: flex; flex-wrap: wrap; margin-top: 8px; }
  .chip { padding: 3px 9px; margin: 0 6px 6px 0; border-radius: 8px; font-size: 12px; font-weight: 600; background-color: var(--fill); }
  .facts { display: flex; margin-top: 8px; }
  .facts div { flex-grow: 1; flex-basis: 0; padding: 7px 0; text-align: center; border-radius: 10px; background-color: var(--fill); margin-right: 6px; }
  .facts div:last-child { margin-right: 0; }
  .facts b { display: block; font-size: 15px; }
</style>
<div class="card" id="root"></div>
<script>
const root = document.getElementById('root');
let pulse = 0, loadT = 0;
const SKELETON = `<div class="sk img"></div><div class="row" style="margin-top: 10px"><div class="sk av"></div><div class="grow"><div class="sk line" style="width: 40%; margin-top: 0"></div><div class="sk line" style="width: 25%"></div></div></div>
  <div class="sk line" style="width: 70%; height: 16px; margin-top: 12px"></div><div class="sk line"></div><div class="sk line" style="width: 92%"></div><div class="sk line" style="width: 60%"></div>
  <div class="row" style="margin-top: 10px"><div class="sk line" style="width: 70px; height: 22px; margin: 0 6px 0 0"></div><div class="sk line" style="width: 54px; height: 22px; margin: 0 6px 0 0"></div><div class="sk line" style="width: 80px; height: 22px; margin: 0"></div></div>
  <div class="facts"><div class="sk" style="height: 44px"></div><div class="sk" style="height: 44px"></div><div class="sk" style="height: 44px"></div></div>
  <div class="tiny muted" style="margin-top: 10px" id="st">loading…</div>`;
const CONTENT = `<div class="hero"></div>
  <div class="meta"><div class="av">AC</div><div class="grow"><div class="bold">Ana Costa</div><div class="tiny muted">Lisbon · posted 2 h ago</div></div><span class="tiny muted">1.2k views</span></div>
  <div class="title">Three days in Lisbon on a designer's budget</div>
  <div class="small muted" style="margin-top: 6px">Pastéis for breakfast, a tram you never catch, two museums that are free on Sunday and the one miradouro worth the climb. Everything below is walkable from Baixa; the one exception is a 20-minute ferry.</div>
  <div class="chips"><span class="chip">Travel</span><span class="chip">Lisbon</span><span class="chip">Budget</span><span class="chip">12 min read</span></div>
  <div class="facts"><div><b>€164</b><span class="tiny muted">3 days, all in</span></div><div><b>23 km</b><span class="tiny muted">walked</span></div><div><b>4</b><span class="tiny muted">pastéis</span></div></div>
  <div class="row between" style="margin-top: 10px"><span class="tiny muted" id="st"></span><span class="btn" role="button" id="reload">Reload</span></div>`;
function load() {
  clearInterval(pulse); clearTimeout(loadT);
  root.innerHTML = SKELETON;
  let n = 0;
  pulse = setInterval(() => { root.classList.toggle('pulse', (++n & 1) === 1); }, 400);
  loadT = setTimeout(() => {
    clearInterval(pulse); root.classList.remove('pulse');
    root.innerHTML = CONTENT;
    document.getElementById('st').textContent = 'loaded in 1.4 s · skeleton swapped in one innerHTML';
  }, 1400);
}
root.addEventListener('click', e => { if (e.target.closest('#reload')) load(); });
load();
</script>
