<!--
  common profile: only what WebView, Blitz and litehtml all render (corpus/common/README.md)
  idea: a poll — vote once, the result bars grow with requestAnimationFrame (style.width), "Change vote" goes back
-->
<style>
  :root { --fg: #000; --muted: #6e6e73; --card: #fff; --fill: rgba(127,127,127,0.12); --fill2: rgba(127,127,127,0.22); --border: rgba(0,0,0,0.10);
    --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9500; --purple: #af52de; --teal: #30b0c7; }
  @media (prefers-color-scheme: dark) { :root { --fg: #fff; --muted: #98989d; --card: #1c1c1e; --border: rgba(255,255,255,0.14); } }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { width: 392px; max-width: 100%; box-sizing: border-box; background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .grow { flex-grow: 1; flex-basis: 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; } .bold { font-weight: 700; }
  .btn { display: inline-block; padding: 6px 14px; border-radius: 9px; font-weight: 600; text-align: center; background-color: var(--fill); color: var(--fg); cursor: pointer; }
  .btn.primary { background-color: var(--blue); color: #fff; }
  .btn:active { background-color: var(--fill2); }
  [hidden] { display: none; }

  .opt { position: relative; margin-top: 8px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; }
  .opt .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background-color: rgba(0,122,255,0.14); }
  .opt.mine .fill { background-color: rgba(0,122,255,0.3); }
  .opt .lbl { position: relative; display: flex; align-items: center; padding: 9px 12px; }
  .opt .pct { margin-left: auto; font-weight: 800; }
  .opt .radio { width: 14px; height: 14px; border-radius: 7px; border: 2px solid var(--fill2); margin-right: 10px; flex-shrink: 0; box-sizing: border-box; }
  .opt.mine .radio { border: 4px solid var(--blue); }
  .foot { margin-top: 10px; display: flex; align-items: center; }
  .link { color: var(--blue); font-weight: 600; cursor: pointer; }
</style>
<div class="card">
  <div class="bold" style="font-size: 16px">Where should the offsite be?</div>
  <div class="tiny muted" id="sub">Anonymous · pick one</div>
  <div id="opts">
    <div class="opt" data-i="0" role="button"><div class="fill"></div><div class="lbl"><span class="radio"></span><span>Lisbon, late May</span><span class="pct" hidden></span></div></div>
    <div class="opt" data-i="1" role="button"><div class="fill"></div><div class="lbl"><span class="radio"></span><span>Tbilisi, early June</span><span class="pct" hidden></span></div></div>
    <div class="opt" data-i="2" role="button"><div class="fill"></div><div class="lbl"><span class="radio"></span><span>Cabin in the Harz, any week</span><span class="pct" hidden></span></div></div>
    <div class="opt" data-i="3" role="button"><div class="fill"></div><div class="lbl"><span class="radio"></span><span>Stay remote, bigger party budget</span><span class="pct" hidden></span></div></div>
  </div>
  <div class="foot"><span class="tiny muted grow" id="total">27 votes so far</span><span class="link small" id="change" hidden>Change vote</span></div>
</div>
<script>
const base = [11, 7, 6, 3];
let mine = -1, run = 0;
const opts = [...document.querySelectorAll('.opt')];
const ease = t => 1 - Math.pow(1 - t, 3);
function show(voted) {
  const votes = base.map((v, i) => v + (i === mine ? 1 : 0)), total = votes.reduce((a, b) => a + b, 0);
  document.getElementById('total').textContent = total + ' votes' + (voted ? '' : ' so far');
  document.getElementById('change').hidden = !voted;
  document.getElementById('sub').textContent = voted ? 'Anonymous · you voted' : 'Anonymous · pick one';
  opts.forEach((o, i) => {
    o.classList.toggle('mine', voted && i === mine);
    o.querySelector('.pct').hidden = !voted;
    if (!voted) o.querySelector('.fill').style.width = '0';
  });
  if (!voted) return;
  const me = ++run, start = performance.now();
  const step = () => {
    if (me !== run) return;
    const t = Math.min(1, (performance.now() - start) / 600), e = ease(t);
    opts.forEach((o, i) => {
      const p = votes[i] / total * 100;
      o.querySelector('.fill').style.width = (p * e).toFixed(1) + '%';
      o.querySelector('.pct').textContent = Math.round(p * e) + '%';
    });
    if (t < 1) requestAnimationFrame(step);
  };
  step();
}
document.getElementById('opts').addEventListener('click', e => {
  const o = e.target.closest('.opt');
  if (!o || mine >= 0) return;
  mine = Number(o.dataset.i);
  show(true);
});
document.getElementById('change').addEventListener('click', () => { mine = -1; run++; show(false); });
</script>
