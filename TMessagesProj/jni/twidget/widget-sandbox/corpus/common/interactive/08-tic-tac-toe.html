<!--
  common profile: only what WebView, Blitz and litehtml all render (corpus/common/README.md)
  idea: tic-tac-toe against a one-move-lookahead opponent — a 3×3 board of flex rows, marks drawn as coloured discs and bars, score tally, restart
-->
<style>
  :root { --fg: #000; --muted: #6e6e73; --card: #fff; --fill: rgba(127,127,127,0.12); --fill2: rgba(127,127,127,0.22); --border: rgba(0,0,0,0.10);
    --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9500; --purple: #af52de; --teal: #30b0c7; }
  @media (prefers-color-scheme: dark) { :root { --fg: #fff; --muted: #98989d; --card: #1c1c1e; --border: rgba(255,255,255,0.14); } }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { width: 392px; max-width: 100%; box-sizing: border-box; background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .grow { flex-grow: 1; flex-basis: 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; } .bold { font-weight: 700; }
  .btn { display: inline-block; padding: 6px 14px; border-radius: 9px; font-weight: 600; text-align: center; background-color: var(--fill); color: var(--fg); cursor: pointer; }
  .btn.primary { background-color: var(--blue); color: #fff; }
  .btn:active { background-color: var(--fill2); }
  [hidden] { display: none; }

  .board { width: 270px; margin: 12px auto 0 auto; }
  .r { display: flex; }
  .c { width: 84px; height: 84px; margin: 3px; border-radius: 12px; background-color: var(--fill); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .c.win { background-color: rgba(52,199,89,0.3); }
  .o { width: 50px; height: 50px; border-radius: 25px; border: 9px solid var(--blue); box-sizing: border-box; }
  .x { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; }
  .x i { display: block; width: 10px; height: 46px; border-radius: 5px; background-color: var(--red); }
  .x i.l { margin-right: 10px; }
  .status { text-align: center; margin-top: 10px; font-weight: 700; min-height: 18px; }
  .tally { display: flex; margin-top: 8px; }
  .tally div { flex-grow: 1; flex-basis: 0; text-align: center; padding: 6px 0; border-radius: 10px; background-color: var(--fill); margin-right: 6px; }
  .tally div:last-child { margin-right: 0; }
  .tally b { font-size: 18px; }
</style>
<div class="card">
  <div class="row between"><span class="bold" style="font-size: 16px">Tic-tac-toe</span><span class="tiny muted">you are X · bot is O</span></div>
  <div class="board" id="board"></div>
  <div class="status" id="status">Your move</div>
  <div class="tally"><div><b id="tw">0</b><div class="tiny muted">You</div></div><div><b id="td">0</b><div class="tiny muted">Draws</div></div><div><b id="tb">0</b><div class="tiny muted">Bot</div></div></div>
  <div style="text-align: center; margin-top: 10px"><span class="btn primary" role="button" id="reset">New game</span></div>
</div>
<script>
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let cells = Array(9).fill(''), over = false, tally = { X: 0, D: 0, O: 0 };
const board = document.getElementById('board'), status = document.getElementById('status');
function winner(c) { for (const l of LINES) if (c[l[0]] && c[l[0]] === c[l[1]] && c[l[0]] === c[l[2]]) return l; return null; }
function draw(winLine) {
  let html = '';
  for (let r = 0; r < 3; r++) {
    html += '<div class="r">';
    for (let k = r * 3; k < r * 3 + 3; k++) {
      const m = cells[k] === 'X' ? '<div class="x"><i class="l"></i><i></i></div>' : cells[k] === 'O' ? '<div class="o"></div>' : '';
      html += `<div class="c${winLine && winLine.includes(k) ? ' win' : ''}" data-k="${k}" role="button">${m}</div>`;
    }
    html += '</div>';
  }
  board.innerHTML = html;
}
function botMove() {
  const free = cells.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  const tryWin = who => { for (const i of free) { cells[i] = who; const w = winner(cells); cells[i] = ''; if (w) return i; } return -1; };
  let i = tryWin('O'); if (i < 0) i = tryWin('X');
  if (i < 0) i = free.includes(4) ? 4 : [0, 2, 6, 8].find(c => free.includes(c)) ?? free[0];
  cells[i] = 'O';
}
function finish() {
  const w = winner(cells);
  if (w) { over = true; const who = cells[w[0]]; tally[who]++; status.textContent = who === 'X' ? 'You win!' : 'Bot wins.'; draw(w); }
  else if (cells.every(Boolean)) { over = true; tally.D++; status.textContent = 'Draw.'; draw(null); }
  else return false;
  document.getElementById('tw').textContent = tally.X; document.getElementById('td').textContent = tally.D; document.getElementById('tb').textContent = tally.O;
  return true;
}
board.addEventListener('click', e => {
  const c = e.target.closest('[data-k]');
  if (!c || over) return;
  const k = Number(c.dataset.k);
  if (cells[k]) return;
  cells[k] = 'X';
  if (finish()) return;
  botMove();
  if (!finish()) { draw(null); status.textContent = 'Your move'; }
});
document.getElementById('reset').addEventListener('click', () => { cells = Array(9).fill(''); over = false; status.textContent = 'Your move'; draw(null); });
draw(null);
</script>
