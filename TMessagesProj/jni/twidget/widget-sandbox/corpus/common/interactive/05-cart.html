<!--
  common profile: only what WebView, Blitz and litehtml all render (corpus/common/README.md)
  idea: a shopping cart — plus/minus steppers per line, line totals, delivery threshold bar;
  the quantities are kept in localStorage (restored on load), Checkout opens the shop's checkout with openLink
-->
<style>
  :root { --fg: #000; --muted: #6e6e73; --card: #fff; --fill: rgba(127,127,127,0.12); --fill2: rgba(127,127,127,0.22); --border: rgba(0,0,0,0.10);
    --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9500; --purple: #af52de; --teal: #30b0c7; }
  @media (prefers-color-scheme: dark) { :root { --fg: #fff; --muted: #98989d; --card: #1c1c1e; --border: rgba(255,255,255,0.14); } }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { width: 392px; max-width: 100%; box-sizing: border-box; background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .grow { flex-grow: 1; flex-basis: 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; } .bold { font-weight: 700; }
  .btn { display: inline-block; padding: 6px 14px; border-radius: 9px; font-weight: 600; text-align: center; background-color: var(--fill); color: var(--fg); cursor: pointer; }
  .btn.primary { background-color: var(--blue); color: #fff; }
  .btn:active { background-color: var(--fill2); }
  [hidden] { display: none; }

  .line { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .thumb { width: 48px; height: 48px; border-radius: 10px; margin-right: 10px; flex-shrink: 0; }
  .step { display: flex; align-items: center; margin-left: 10px; }
  .step span { width: 26px; height: 26px; border-radius: 13px; background-color: var(--fill); text-align: center; line-height: 26px; font-weight: 800; cursor: pointer; }
  .step b { width: 26px; text-align: center; }
  .lt { width: 60px; text-align: right; font-weight: 700; }
  .line.gone { color: var(--muted); }
  .ship { margin-top: 10px; }
  .ship .tr { height: 6px; border-radius: 3px; background-color: var(--fill); overflow: hidden; margin-top: 4px; }
  .ship .fl { height: 6px; border-radius: 3px; background-color: var(--green); }
  .tot { display: flex; align-items: center; margin-top: 10px; }
  .tot .n { font-size: 22px; font-weight: 800; margin-left: auto; }
</style>
<div class="card">
  <div class="row between"><span class="bold" style="font-size: 16px">Your cart</span><span class="tiny muted" id="count">4 items</span></div>
  <div id="lines">
    <div class="line" data-price="129"><div class="thumb" style="background: linear-gradient(160deg, #1b4332, #52b788)"></div><div class="grow"><div class="bold">Trailhead Rain Jacket</div><div class="tiny muted">M · Moss · €129</div></div><div class="step"><span role="button" data-d="-1">−</span><b class="q">1</b><span role="button" data-d="1">+</span></div><div class="lt">€129</div></div>
    <div class="line" data-price="34"><div class="thumb" style="background: linear-gradient(175deg, #a8dadc, #1d3557)"></div><div class="grow"><div class="bold">Tide Water Bottle</div><div class="tiny muted">750 ml · €34</div></div><div class="step"><span role="button" data-d="-1">−</span><b class="q">2</b><span role="button" data-d="1">+</span></div><div class="lt">€68</div></div>
    <div class="line" data-price="19.5"><div class="thumb" style="background: linear-gradient(160deg, #ffe3a3, #b85a1f)"></div><div class="grow"><div class="bold">Wool Socks, 3 pack</div><div class="tiny muted">41–43 · €19.50</div></div><div class="step"><span role="button" data-d="-1">−</span><b class="q">1</b><span role="button" data-d="1">+</span></div><div class="lt">€19.50</div></div>
  </div>
  <div class="ship"><div class="row between tiny"><span id="shipmsg">Free delivery unlocked</span><span class="muted">€150</span></div><div class="tr"><div class="fl" id="shipbar" style="width: 100%"></div></div></div>
  <div class="tot"><span class="muted">Total incl. VAT</span><span class="n" id="total">€216.50</span></div>
  <span class="btn primary" role="button" id="checkout" style="display: block; margin-top: 10px">Checkout</span>
</div>
<script>
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const money = n => '€' + (Number.isInteger(n) ? n : n.toFixed(2));
const qtys = () => Array.prototype.map.call(document.querySelectorAll('.line .q'), q => Number(q.textContent));
function recalc() {
  let total = 0, items = 0;
  for (const l of document.querySelectorAll('.line')) {
    const q = Number(l.querySelector('.q').textContent), p = Number(l.dataset.price);
    total += q * p; items += q;
    l.querySelector('.lt').textContent = money(q * p);
    l.classList.toggle('gone', q === 0);
  }
  document.getElementById('total').textContent = money(total);
  document.getElementById('count').textContent = items + (items === 1 ? ' item' : ' items');
  const left = Math.max(0, 150 - total);
  document.getElementById('shipmsg').textContent = left ? money(left) + ' more for free delivery' : 'Free delivery unlocked';
  document.getElementById('shipbar').style.width = Math.min(100, total / 150 * 100).toFixed(0) + '%';
  document.getElementById('shipbar').style.backgroundColor = left ? '#ff9500' : '#34c759';
}
const saved = store.get('cart');
if (Array.isArray(saved)) {
  let i = 0;
  for (const q of document.querySelectorAll('.line .q')) { const n = Number(saved[i++]); if (n >= 0 && n <= 9) q.textContent = n; }
  recalc();
}
document.getElementById('lines').addEventListener('click', e => {
  const s = e.target.closest('[data-d]');
  if (!s) return;
  const q = s.parentNode.querySelector('.q'), n = Math.max(0, Math.min(9, Number(q.textContent) + Number(s.dataset.d)));
  q.textContent = n;
  store.set('cart', qtys());
  recalc();
});
document.getElementById('checkout').addEventListener('click', () => {
  if (typeof TelegramWidget !== 'undefined') TelegramWidget.openLink('https://example.com/checkout?cart=' + qtys().join('-'));
});
</script>
