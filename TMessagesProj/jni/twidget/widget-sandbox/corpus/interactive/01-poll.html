<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="tw-bot" content="poll">
<style>
  h3 { margin: 0 0 8px; }
  .opt { position: relative; display: block; width: 100%; margin: 6px 0; padding: 10px 12px; text-align: left; overflow: hidden; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--tg-theme-button-color); opacity: .18; transition: width .4s ease; }
  .opt span { position: relative; }
  .n { float: right; color: var(--tg-theme-hint-color); }
  .mine { box-shadow: inset 0 0 0 2px var(--tg-theme-button-color); }
  .mine .n { color: var(--tg-theme-button-color); font-weight: 600; }
  #hint { margin-top: 6px; color: var(--tg-theme-hint-color); font-size: .87em; }
</style></head>
<body>
<h3>Tea, coffee or juice?</h3>
<div id="opts"></div>
<div id="hint"></div>
<script>
var T = TelegramWidget, names = ['Tea', 'Coffee', 'Juice'], busy = false;
// publicData (every carrier, forwards too): {v: counts}; chatData (the original only): {u: {viewer id: option}}.
// A forward knows its own vote only from the bot's answer, kept in localStorage.
function parse(s, d) { try { return JSON.parse(s || 'null') || d; } catch (e) { return d; } }
function hint(text) { document.getElementById('hint').textContent = text; }
function render() {
  var v = parse(T.publicData, { v: [0, 0, 0] }).v, total = v.reduce(function (a, b) { return a + b; }, 0);
  var u = parse(T.chatData, {}).u, mine = u && T.viewer ? u[T.viewer.id] : T.isForward ? parse(localStorage.getItem('mine'), undefined) : undefined;
  var p = { v: v };
  var box = document.getElementById('opts');
  box.textContent = '';
  names.forEach(function (name, i) {
    var b = document.createElement('button'), bar = document.createElement('div'), label = document.createElement('span'), n = document.createElement('span');
    b.className = 'opt' + (mine === i ? ' mine' : '');
    bar.className = 'bar';
    bar.style.width = (total ? Math.round(100 * p.v[i] / total) : 0) + '%';
    label.textContent = name + (mine === i ? ' ✓' : '');
    n.className = 'n';
    n.textContent = p.v[i] + (total ? ' · ' + Math.round(100 * p.v[i] / total) + '%' : '');
    b.append(bar, label, n);
    b.addEventListener('click', function () { vote(i); });
    box.appendChild(b);
  });
  if (!busy) hint(total + ' votes · tap to vote, tap again to take it back');
}
function vote(i) {
  if (busy) return;
  busy = true;
  hint('Sending…');
  // The answer says how this viewer voted; the counts come with the bot's data edit (publicDataChanged).
  T.request('vote:' + i).then(function (a) { busy = false; var r = parse(a.result, {}); localStorage.setItem('mine', JSON.stringify(r.voted)); render(); }, function (e) {
    busy = false;
    hint(e.code === 'NOT_ALLOWED' && T.isForward ? 'A forwarded copy: vote in the chat with the bot.' : e.code === 'TIMEOUT' ? 'The bot did not answer. Try again.' : 'Not sent: ' + e.code);
  });
}
// The bot's edits (this vote, or anyone else's) arrive as events: the widget redraws, nothing restarts.
T.onEvent('chatDataChanged', render);
T.onEvent('publicDataChanged', render);
// Others vote too: the counts are live shared data, so the client polls them while the poll is on screen.
T.watchPublicData();
render();
</script>
</body></html>
