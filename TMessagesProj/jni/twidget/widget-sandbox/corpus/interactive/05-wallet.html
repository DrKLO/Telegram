<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="tw-bot" content="shop">
<style>
  h3 { margin: 0 0 4px; font-size: 1.07em; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--tg-theme-section-separator-color); }
  .item span { flex: 1; }
  .item small { color: var(--tg-theme-hint-color); }
  #note { min-height: 1.35em; margin: 8px 0; color: var(--tg-theme-hint-color); font-size: .87em; }
  #paid { color: var(--tg-theme-hint-color); font-size: .87em; margin-top: 6px; }
</style></head>
<body>
<h3>Corner café</h3>
<div id="items"></div>
<div id="note"></div>
<button id="terms">Sign the terms</button>
<div id="paid"></div>
<script>
var T = TelegramWidget, busy = false;
function $(id) { return document.getElementById(id); }
function parse(s) { try { return JSON.parse(s) || {}; } catch (e) { return {}; } }
function note(s) { $('note').textContent = s; }
var WHY = {
  REJECTED: 'You declined in the wallet.',
  BAD_REQUEST: 'The wallet refused it.',
  NOT_ALLOWED: 'Open the bot to pay.',
  BUSY: 'One moment…',
  TIMEOUT: 'No answer yet: check the order in the bot.'
};
// A TypeError: the transaction or the payload broke TON Connect's format (the call never left the widget).
function fail(e) { busy = false; note(e && e.shop || WHY[e && e.code] || (e && e.name === 'TypeError' ? 'The café sent a broken order.' : 'Something went wrong.')); }

function render() {
  var items = parse(T.publicData).items || [], paid = parse(T.chatData).paid || [];
  var list = $('items');
  while (list.firstChild) list.removeChild(list.firstChild);
  items.forEach(function (it, i) {
    var row = document.createElement('div'), name = document.createElement('span'), b = document.createElement('button');
    row.className = 'item';
    name.textContent = it[0] + ' ';
    var price = document.createElement('small');
    price.textContent = it[1] + ' TON';
    name.appendChild(price);
    b.textContent = 'Pay';
    b.onclick = function () { pay(i); };
    row.appendChild(name); row.appendChild(b);
    list.appendChild(row);
  });
  $('paid').textContent = paid.length ? 'Paid: ' + paid.join(', ') : '';
  if (!T.wallet) note(T.isPreview ? '' : 'No wallet here: pay in the bot.');
}

// A tap asks the shop with the wallet; its answer is a fresh transaction, which goes to the wallet without a new tap.
function pay(i) {
  if (busy) return;
  if (!T.wallet) return note('No wallet here: pay in the bot.');
  busy = true;
  note('Asking the café…');
  T.request('pay:' + i, { wallet: true }).then(function (a) {
    var r = parse(a.result);
    if (!r.tx) throw { shop: r.err || 'The café could not take the order.' };
    note('Confirm in your wallet…');
    return T.wallet.sendTransaction(r.tx, 'paid:' + i);
  }).then(function (a) {
    busy = false;
    note('Paid for ' + parse(a.result).paid + '. Thank you!');
  }, fail);
}

$('terms').onclick = function () {
  if (busy) return;
  if (!T.wallet) return note('No wallet here.');
  busy = true;
  T.wallet.signData({ type: 'text', text: 'I accept the Corner café terms of 30 October 2026.' }, 'terms').then(function (a) {
    busy = false;
    note('Signed for ' + parse(a.result).signed + '.');
  }, fail);
};

T.onEvent('chatDataChanged', render);
T.onEvent('publicDataChanged', render);
render();
T.ready();
</script>
</body></html>
