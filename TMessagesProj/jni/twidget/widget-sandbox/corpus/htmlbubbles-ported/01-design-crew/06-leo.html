<style>
  :root { color-scheme: light dark; --fg: light-dark(#000, #fff); --kbd: light-dark(#f2f2f7, #2c2c2e); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  p { margin: 0 0 8px 0; }
  pre { font-family: ui-monospace, monospace; font-size: 12.5px; line-height: 1.45; background-color: var(--kbd); padding: 8px 10px; border-radius: 8px; margin: 4px 0 8px 0; white-space: pre-wrap; }
  pre code { font-family: ui-monospace, monospace; background-color: transparent; padding: 0; font-size: 12.5px; }
  body > *:first-child { margin-top: 0; }
  body > *:last-child { margin-bottom: 0; }
</style>
<p>Here's roughly how a bubble gets its size:</p>
<pre><code><span style="color:#af52de">let</span> doc  = <span style="color:#007aff">LHDocument</span>(html: msg.html, css: bubbleCSS)
<span style="color:#af52de">let</span> size = doc.<span style="color:#ff9500">layout</span>(maxWidth: <span style="color:#34c759">480</span>) <span style="color:#8e8e93">// shrink-to-fit</span>
bubble.frame.size = size + insets</code></pre>
<p style="font-size: 12px; color: #8e8e93">(it's Objective-C++ really, but you get the idea)</p>
