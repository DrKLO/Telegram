<style>
  :root { color-scheme: light dark; --fg: light-dark(#000, #fff); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  p { margin: 0 0 8px 0; }
  table { border-collapse: collapse; }
  body > *:first-child { margin-top: 0; }
  body > *:last-child { margin-bottom: 0; }
  /* app:aurora | ocean | dunes | forest, 118×118 each */
  .tile { width: 118px; height: 118px; display: block; }
  .aurora { background: linear-gradient(165deg, #06122b 0%, #0f2d5c 35%, #1fd1a3 62%, #7b5cff 85%, #2a1a5e 100%); }
  .ocean { background: linear-gradient(180deg, #8ed6ff 0%, #2f9ff0 35%, #0b63c1 70%, #063a7a 100%); }
  .dunes { background: linear-gradient(170deg, #ffe8a3 0%, #f3c15e 40%, #d9903a 72%, #a8601f 100%); }
  .forest { background: linear-gradient(180deg, #b7e36b 0%, #4caf50 40%, #2e7d32 72%, #14402a 100%); }
</style>
<p>Moodboard for the offsite deck 🎨</p>
<table style="border-collapse: separate; border-spacing: 4px; margin: -4px">
  <tr><td><div class="tile aurora" style="border-radius: 12px 4px 4px 4px"></div></td><td><div class="tile ocean" style="border-radius: 4px 12px 4px 4px"></div></td></tr>
  <tr><td><div class="tile dunes" style="border-radius: 4px 4px 4px 12px"></div></td><td><div class="tile forest" style="border-radius: 4px 4px 12px 4px"></div></td></tr>
</table>
