<!--
  source: Telegram macOS 12.10 (283300), 01-design-crew.chat, message 12
  author: maya 09:52 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9500; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .grow { flex-grow: 1; }
  .t-blue { color: var(--blue); } .t-green { color: var(--green); } .t-red { color: var(--red); } .t-orange { color: var(--orange); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 700; background-color: rgba(127,127,127,0.18); }
  .badge.green { background-color: rgba(52,199,89,0.18); color: var(--green); }
  .badge.red { background-color: rgba(255,59,48,0.16); color: var(--red); }
  .badge.orange { background-color: rgba(255,149,0,0.18); color: var(--orange); }
  [data-act] { cursor: pointer; }

  .inv { width: 320px; max-width: 100%; }
  .inv .top { display: flex; padding: 12px; }
  .inv .cal { width: 52px; margin-right: 12px; border-radius: 10px; border: 1px solid rgba(127,127,127,0.3); text-align: center; }
  .inv .mon { padding: 2px 0; border-radius: 9px 9px 0 0; background-color: #ff3b30; color: #ffffff; font-size: 10px; font-weight: 700; }
  .inv .dwin { height: 32px; overflow: hidden; }
  .inv .dnum { height: 32px; line-height: 32px; font-size: 24px; font-weight: 700; }
  .inv .ti { font-size: 15px; font-weight: 700; }
  .inv .map { position: relative; height: 132px; overflow: hidden; }
  .inv .map svg { display: block; width: 320px; height: 132px; }
  .inv .pin { position: absolute; font-size: 26px; left: 146px; top: 44px; }
  .inv .ppl { display: flex; align-items: center; height: 26px; padding: 6px 12px; border-top: 1px solid rgba(127,127,127,0.2); }
  .inv .ppl:hover { background-color: rgba(127,127,127,0.07); }
  .inv .face { display: inline-block; margin-right: 3px; border-radius: 12px; text-align: center; color: #ffffff; font-weight: 700; vertical-align: middle; width: 22px; height: 22px; line-height: 22px; font-size: 10px; }
  .inv .faces { display: inline-block; width: 110px; }
  .inv .who { display: flex; align-items: center; position: relative; padding: 4px 12px; font-size: 13px; }
  .inv .acts { display: flex; border-top: 1px solid rgba(127,127,127,0.2); }
  .inv .act { flex-grow: 1; padding: 9px 0; text-align: center; font-weight: 600; }
  .inv .act:hover { background-color: rgba(127,127,127,0.10); }
  .inv .act.bl { border-left: 1px solid rgba(127,127,127,0.2); }
  .inv .act.dis:hover { background-color: transparent; }
  .inv .strip { display: flex; align-items: center; padding: 9px 12px; border-top: 1px solid rgba(127,127,127,0.2); font-size: 13px; }
  .inv .reply { margin: 0 12px 10px 12px; padding: 6px 10px; border-radius: 10px; background-color: rgba(127,127,127,0.10); font-size: 12.5px; }
  .inv .reply span { position: relative; }
  .inv .mini { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 8px; background-color: rgba(127,127,127,0.14); }
  .inv .mini:hover { background-color: rgba(127,127,127,0.26); }
  .inv .prop { display: block; padding: 8px 12px; border-top: 1px solid rgba(127,127,127,0.2); font-size: 12.5px; font-weight: 600; }
  .inv .prop:hover { background-color: rgba(127,127,127,0.07); }
  .inv .days { display: flex; padding: 0 9px; }
  .inv .day { flex-grow: 1; margin: 0 3px; padding: 5px 0; border-radius: 10px; text-align: center; background-color: rgba(127,127,127,0.10); }
  .inv .day:hover { background-color: rgba(127,127,127,0.20); }
  .inv .day.on { background-color: #007aff; color: #ffffff; }
  .inv .slot { display: flex; align-items: center; margin: 6px 12px 0 12px; padding: 7px 10px; border-radius: 10px; border: 1px solid rgba(127,127,127,0.25); font-size: 13px; }
  .inv .slot.free:hover { background-color: rgba(0,122,255,0.08); }
  .inv .slot.off { color: #8e8e93; }

  /* app:map, 320×132 */
  .m-bg { fill: light-dark(#e8ede4, #262a27); } .m-block { fill: light-dark(#dde3d7, #31362f); }
  .m-park { fill: light-dark(#cde6bf, #2f4a33); } .m-water { fill: light-dark(#bcd9f0, #27405a); }
  .m-road { stroke: light-dark(#ffffff, #3f453e); stroke-width: 6; fill: none; stroke-linecap: round; }
  .m-main { stroke: light-dark(#fff1bf, #5a5233); stroke-width: 9; fill: none; stroke-linecap: round; }
  .m-lbl { font-size: 8px; font-weight: 600; fill: light-dark(#7a7f78, #8e948c); font-family: system-ui, sans-serif; }

  /* ported motion: the date rolls up (650ms outBack), the pin drops with a bounce (900ms outBounce), avatars pop in
     (350/450ms outBack), attendee rows and the reply text slide in (outCubic), a picked slot tints in (320ms), and the
     whole card gets the host's bubble transitions (fade / slide-* / pop) via .fx; paired keyframe names restart on re-trigger. */
  @keyframes roll-a { from { transform: none; } to { transform: translateY(-32px); } }
  @keyframes roll-b { from { transform: none; } to { transform: translateY(-32px); } }
  .inv .roll.a { animation: roll-a 650ms cubic-bezier(.34,1.56,.64,1) both; }
  .inv .roll.b { animation: roll-b 650ms cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes drop {
    0% { transform: translateY(-84px); animation-timing-function: cubic-bezier(.11,0,.5,0); }
    36.4% { transform: none; animation-timing-function: cubic-bezier(.5,1,.89,1); }
    54.5% { transform: translateY(-21px); animation-timing-function: cubic-bezier(.11,0,.5,0); }
    72.7% { transform: none; animation-timing-function: cubic-bezier(.5,1,.89,1); }
    81.8% { transform: translateY(-5.25px); animation-timing-function: cubic-bezier(.11,0,.5,0); }
    90.9% { transform: none; animation-timing-function: cubic-bezier(.5,1,.89,1); }
    95.5% { transform: translateY(-1.3px); animation-timing-function: cubic-bezier(.11,0,.5,0); }
    100% { transform: none; } }
  .inv .pin { animation: drop 900ms linear 250ms both; }
  @keyframes grow { from { width: 0; height: 0; line-height: 0; font-size: 0; } to { width: 22px; height: 22px; line-height: 22px; font-size: 10px; } }
  .inv .faces .face { animation: grow 350ms cubic-bezier(.34,1.56,.64,1) both; }
  .inv .faces .face.me { animation-duration: 450ms; animation-delay: 0ms; }
  @keyframes row-in { from { transform: translateX(40px); } to { transform: none; } }
  .inv .who { animation: row-in 375ms cubic-bezier(.33,1,.68,1) both; }
  @keyframes slide-in { from { left: 14px; } to { left: 0; } }
  .inv .reply .text { animation: slide-in 380ms cubic-bezier(.33,1,.68,1); }
  @keyframes sel-in { from { background-color: rgba(0,122,255,0); } to { background-color: rgba(0,122,255,0.16); } }
  .inv .slot.sel { border-color: #007aff; animation: sel-in 320ms cubic-bezier(.33,1,.68,1) both; }
  @keyframes fx-a { from { opacity: 0; transform: var(--fx-from); } to { opacity: 1; transform: none; } }
  @keyframes fx-b { from { opacity: 0; transform: var(--fx-from); } to { opacity: 1; transform: none; } }
  .fx { animation: fx-a 220ms cubic-bezier(.33,1,.68,1); } .fx.alt { animation-name: fx-b; }
  .fx-fade { --fx-from: none; } .fx-pop { --fx-from: scale(.96); }
  .fx-slide-left { --fx-from: translateX(24px); } .fx-slide-right { --fx-from: translateX(-24px); }
  .fx-slide-up { --fx-from: translateY(16px); } .fx-slide-down { --fx-from: translateY(-16px); }
</style>
<div class="card inv" id="root">
  <div id="main">
    <div class="top">
      <div class="cal"><div class="mon">OCT</div><div class="dwin"><div class="roll" id="roll"><div class="dnum" id="prevNum">&nbsp;</div><div class="dnum" id="curNum">09</div></div></div></div>
      <div class="grow"><div class="ti">Design review — Bubbles v2</div>
        <div class="small muted" style="margin-top: 2px" id="whenLine">🕑 Thu 14:00 – 15:00</div>
        <div class="small muted">📍 Room “Ada”, 4th floor</div></div>
    </div>
    <div class="map">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 132">
        <rect class="m-bg" width="320" height="132"/>
        <rect class="m-block" x="14" y="12" width="70" height="34" rx="3"/><rect class="m-block" x="14" y="62" width="70" height="52" rx="3"/>
        <rect class="m-block" x="104" y="12" width="88" height="34" rx="3"/><rect class="m-block" x="104" y="62" width="40" height="52" rx="3"/>
        <rect class="m-block" x="160" y="62" width="32" height="52" rx="3"/><rect class="m-block" x="212" y="12" width="48" height="34" rx="3"/>
        <rect class="m-park" x="212" y="62" width="48" height="52" rx="6"/>
        <path class="m-water" d="M278 0h42v132h-42c6-24-8-44 4-66s-10-44-4-66z"/>
        <path class="m-road" d="M0 54h272M0 0v132M96 0v132M200 0v132M0 120h272"/>
        <path class="m-main" d="M150 0v132M0 54h272"/>
        <text class="m-lbl" x="20" y="100">Ada St</text><text class="m-lbl" x="216" y="92">Park</text><text class="m-lbl" x="288" y="70" transform="rotate(90 288 70)">River</text>
      </svg>
      <div class="pin" id="pin">📍</div>
    </div>
    <div class="ppl" data-act="people"><span class="faces" id="faces"><span class="face" style="background-color: #ff2d55; animation-delay: 500ms">M</span><span class="face" style="background-color: #34c759; animation-delay: 630ms">L</span><span class="face" style="background-color: #af52de; animation-delay: 760ms">P</span></span><span class="small muted grow" id="summary">2 going · 1 maybe</span><span class="small muted" id="pplLnk">Attendees ▾</span></div>
    <div id="attendees" style="padding-bottom: 6px" hidden></div>
    <div id="prop"></div>
    <div id="bottom"></div>
  </div>
  <div id="slots" hidden>
    <div class="row between" style="padding: 10px 12px"><span class="mini" data-act="back">‹ Back</span><b>Propose a new time</b><span style="width: 52px">&nbsp;</span></div>
    <div class="days" id="days"></div>
    <div style="padding-bottom: 12px" id="slotList"></div>
    <div class="acts"><span class="act muted dis" id="send">Pick a free slot</span></div>
  </div>
</div>
<script>
const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const alpha = (c, a) => { const n = parseInt(c.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a.toFixed(3)})`; };
const root = document.getElementById('root');
let fxAlt = false;
function fx(kind) {
  root.className = 'card inv fx fx-' + kind + (fxAlt ? '' : ' alt');
  fxAlt = !fxAlt;
}

// --- state (same data and rules as the original) ---
const DAYS = [
  { name: 'Wed', long: 'Wednesday', date: 8, busy: { '11:30': 'Leo busy', '16:30': 'Priya busy' } },
  { name: 'Thu', long: 'Thursday', date: 9, busy: { '10:00': 'Maya busy' } },
  { name: 'Fri', long: 'Friday', date: 10, busy: { '14:00': 'Leo busy' } },
];
const TIMES = ['10:00', '11:30', '14:00', '16:30'];
const END = { '10:00': '11:00', '11:30': '12:30', '14:00': '15:00', '16:30': '17:30' };
const TEAM = [
  { name: 'Maya Chen', i: 'M', c: '#ff2d55', rsvp: 'yes', org: true },
  { name: 'Leo Park', i: 'L', c: '#34c759', rsvp: 'yes' },
  { name: 'Priya Nair', i: 'P', c: '#af52de', rsvp: 'maybe' },
];
const RSVP = {
  yes: { label: "✓ You're going", c: '#28a745', badge: 'green', word: 'Going' },
  maybe: { label: '? You might come', c: '#e08a00', badge: 'orange', word: 'Maybe' },
  no: { label: '✕ You declined', c: '#ff3b30', badge: 'red', word: 'Declined' },
};
const REPLY = {
  yes: d => `Great, see you ${d}! I'll bring 🍩`,
  maybe: () => 'No pressure, just let me know by tomorrow 🙏',
  no: () => "No worries, I'll share the notes afterwards 📝",
};
let when = { d: 1, t: '14:00' }, rsvp = null, view = 'main', people = false, pickDay = 1, pick = null;
let proposal = null, reply = null, replyRun = 0, propRun = 0, rollAlt = false, replyDots = 0, propDots = 0;

const two = n => String(n).padStart(2, '0');
const slotLabel = (d, t) => `${DAYS[d].name} ${DAYS[d].date} · ${t}`;
const dots = () => '•'.repeat(1 + Math.floor(performance.now() / 250) % 3);
const face = (i, c, extra = '') => `<span class="face${extra}" style="background-color: ${c}">${i}</span>`;
const $ = id => document.getElementById(id);

// --- main view ---
function rollDate(prev) {
  $('prevNum').innerHTML = prev === '' ? '&nbsp;' : two(prev);
  $('curNum').textContent = two(DAYS[when.d].date);
  const r = $('roll');
  r.classList.remove(rollAlt ? 'a' : 'b');
  r.classList.add(rollAlt ? 'b' : 'a');
  rollAlt = !rollAlt;
}
function drawHeader() {
  const D = DAYS[when.d];
  $('whenLine').textContent = `🕑 ${D.name} ${when.t} – ${END[when.t]}`;
}
function drawPeople() {
  const all = TEAM.map(p => p.rsvp).concat(rsvp ? [rsvp] : []);
  const n = k => all.filter(r => r === k).length;
  $('summary').textContent = [`${n('yes')} going`, n('maybe') ? `${n('maybe')} maybe` : '', n('no') ? `${n('no')} declined` : ''].filter(Boolean).join(' · ');
  $('pplLnk').textContent = people ? 'Hide ▴' : 'Attendees ▾';
  const old = $('faces').querySelector('.me');
  if (old) old.remove();
  if (rsvp && rsvp !== 'no') $('faces').insertAdjacentHTML('beforeend', face('Y', '#007aff', ' me'));
  const you = $('youBadge');
  if (you) { const st = rsvp ? RSVP[rsvp] : null; you.className = 'badge ' + (st ? st.badge : ''); you.textContent = st ? st.word : 'No reply'; }
}
function drawAttendees() {
  const el = $('attendees');
  el.hidden = !people;
  if (!people) { el.innerHTML = ''; return; }
  const rows = TEAM.map(p => [p.i, p.c, esc(p.name) + (p.org ? ' <span class="muted">· organizer</span>' : ''), p.rsvp]).concat([['Y', '#007aff', 'You', rsvp]]);
  el.innerHTML = rows.map((r, k) => {
    const st = r[3] ? RSVP[r[3]] : null;
    return `<div class="who" style="animation-delay: ${Math.round(k * 67.5)}ms">${face(r[0], r[1])}<span class="grow">&nbsp;${r[2]}</span><span class="badge ${st ? st.badge : ''}"${k === 3 ? ' id="youBadge"' : ''}>${st ? st.word : 'No reply'}</span></div>`;
  }).join('');
}
function drawProposal() {
  const el = $('prop');
  clearInterval(propDots); propDots = 0;
  if (!proposal) { el.innerHTML = ''; return; }
  if (proposal.state === 'pending') {
    el.innerHTML = `<div class="strip" style="background-color: rgba(0,122,255,0.10)"><span class="grow">⏳ Proposed <b>${slotLabel(proposal.d, proposal.t)}</b> · waiting for Maya <span class="dots">${dots()}</span></span><span class="mini" data-act="cancel">Cancel</span></div>`;
    const d = el.querySelector('.dots');
    propDots = setInterval(() => { d.textContent = dots(); }, 250);
  } else {
    el.innerHTML = `<div class="strip" style="background-color: rgba(52,199,89,0.12)"><span class="grow"><b class="t-green">✓ Maya moved it</b> to ${DAYS[when.d].long} ${when.t}</span><span class="mini" data-act="dismiss">OK</span></div>`;
  }
}
function drawBottom() {
  const el = $('bottom');
  if (rsvp) {
    const R = RSVP[rsvp];
    el.innerHTML = `<div class="strip" style="background-color: ${alpha(R.c, 0.13)}"><b class="grow" style="color: ${R.c}">${R.label}</b><span class="mini" data-act="undo">Undo</span></div>
      <div class="reply" id="reply" hidden></div>
      <div class="prop t-blue" data-act="propose">🗓 Propose new time ›</div>`;
  } else {
    el.innerHTML = `<div class="acts"><span class="act t-blue" data-act="rsvp" data-value="yes">Accept</span><span class="act bl t-orange" data-act="rsvp" data-value="maybe">Maybe</span><span class="act bl t-red" data-act="rsvp" data-value="no">Decline</span></div>
      <div class="prop t-blue" data-act="propose">🗓 Propose new time ›</div>`;
  }
  drawReply();
}
function drawReply() {
  const el = $('reply');
  clearInterval(replyDots); replyDots = 0;
  if (!el) return;
  if (!reply) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  if (reply.typing) {
    el.innerHTML = `<b style="color: #ff2d55">Maya</b> <span class="muted">is typing ${dots()}</span>`;
    const t = el.querySelector('.muted');
    replyDots = setInterval(() => { t.textContent = `is typing ${dots()}`; }, 250);
  } else {
    el.innerHTML = `<b style="color: #ff2d55">Maya</b> <span class="text">${esc(reply.text)}</span>`;
  }
}
function typeReply(text) {
  const token = ++replyRun;
  reply = { text, typing: true };
  drawReply();
  setTimeout(() => {
    if (token !== replyRun) return;
    reply.typing = false;
    drawReply();
  }, 1100);
}
function waitForMaya() {
  const token = ++propRun;
  setTimeout(() => {
    if (token !== propRun || !proposal) return;
    const prev = DAYS[when.d].date;
    when = { d: proposal.d, t: proposal.t };
    proposal.state = 'accepted';
    rollDate(prev);
    drawHeader(); drawProposal();
  }, 1800);
}

// --- slots view ---
function drawSlots() {
  const D = DAYS[pickDay];
  $('days').innerHTML = DAYS.map((d, i) => `<div class="day ${i === pickDay ? 'on' : ''}" data-act="pday" data-value="${i}"><div class="tiny">${d.name}</div><b>${d.date}</b></div>`).join('');
  $('slotList').innerHTML = TIMES.map(t => {
    const current = pickDay === when.d && t === when.t, busy = D.busy[t];
    if (current || busy) return `<div class="slot off"><b class="grow">${t} – ${END[t]}</b><span class="small">${current ? 'current time' : busy}</span></div>`;
    const chosen = pick && pick.d === pickDay && pick.t === t;
    return `<div class="slot free${chosen ? ' sel' : ''}" data-act="slot" data-value="${t}"><b class="grow">${t} – ${END[t]}</b><span class="small ${chosen ? 't-blue' : 't-green'}">${chosen ? '✓ selected' : 'everyone free'}</span></div>`;
  }).join('');
  const send = $('send');
  send.className = 'act ' + (pick ? 't-blue' : 'muted dis');
  if (pick) send.setAttribute('data-act', 'send'); else send.removeAttribute('data-act');
  send.textContent = pick ? `Send proposal · ${slotLabel(pick.d, pick.t)}` : 'Pick a free slot';
}
function showView(v) {
  view = v;
  $('main').hidden = v !== 'main';
  $('slots').hidden = v !== 'slots';
}

// --- actions ---
root.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const name = el.dataset.act, value = el.dataset.value;
  if (name === 'rsvp' && RSVP[value] && !rsvp) {
    fx('pop');
    rsvp = value;
    drawPeople(); drawBottom();
    typeReply(REPLY[value](DAYS[when.d].long));
  } else if (name === 'undo') {
    fx('fade');
    rsvp = null; reply = null; replyRun++;
    drawPeople(); drawBottom();
  } else if (name === 'people') {
    fx(people ? 'slide-up' : 'slide-down');
    people = !people;
    drawAttendees(); drawPeople();
  } else if (name === 'propose') {
    fx('slide-left');
    pickDay = when.d; pick = null;
    drawSlots(); showView('slots');
  } else if (name === 'back') {
    fx('slide-right');
    showView('main');
  } else if (name === 'pday') {
    const i = Number(value);
    if (i === pickDay || !DAYS[i]) return;
    fx(i > pickDay ? 'slide-left' : 'slide-right');
    pickDay = i;
    drawSlots();
  } else if (name === 'slot') {
    pick = { d: pickDay, t: value };
    drawSlots();
  } else if (name === 'send' && pick) {
    fx('slide-right');
    showView('main');
    proposal = { d: pick.d, t: pick.t, state: 'pending' };
    drawProposal();
    waitForMaya();
  } else if (name === 'cancel' || name === 'dismiss') {
    fx('fade');
    proposal = null; propRun++;
    drawProposal();
  }
});

drawHeader(); drawPeople(); drawBottom();
setTimeout(() => { rollDate(''); }, 250);
</script>
