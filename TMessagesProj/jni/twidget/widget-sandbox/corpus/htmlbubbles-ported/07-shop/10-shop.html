<!--
  source: Telegram macOS 12.10 (283300), 07-shop.chat, message 10
  author: shop 14:12
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --kbd: light-dark(#f2f2f7, #2c2c2e); --blue: #007aff; --blue-h: #0a6ee0; --green: #34c759; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
  .caps { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; align-items: center; } .grow { flex-grow: 1; } .center { text-align: center; }
  .t-green { color: var(--green); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 700; background-color: rgba(127,127,127,0.18); }
  .badge.green { background-color: rgba(52,199,89,0.18); color: var(--green); }
  button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 5px 13px; border: 0; border-radius: 9px; background-color: rgba(127,127,127,0.16); color: var(--fg); text-align: center; cursor: pointer; }
  button:hover { background-color: rgba(127,127,127,0.28); }
  button.primary { background-color: var(--blue); color: #ffffff; } button.primary:hover { background-color: var(--blue-h); }
  button:active { background-color: rgba(127,127,127,0.40); } button.primary:active { background-color: var(--blue-h); }
  kbd { font-family: ui-monospace, monospace; font-size: 12px; padding: 0 6px; border-radius: 5px; border: 1px solid var(--border); border-bottom-width: 2px; background-color: var(--kbd); color: var(--fg); }

  .cp { width: 380px; max-width: 100%; border: 2px dashed #34c759; border-radius: 16px; padding: 14px 16px; background-color: rgba(52,199,89,0.07); box-sizing: border-box; }
  .cp .ring { position: relative; width: 64px; height: 64px; flex-shrink: 0; margin-right: 14px; border-radius: 32px; }
  .cp .hole { position: absolute; left: 8px; top: 8px; width: 48px; height: 48px; line-height: 48px; border-radius: 24px; text-align: center; font-weight: 800; }
  .cp .code { position: relative; height: 42px; line-height: 42px; margin-top: 12px; overflow: hidden; border-radius: 10px; text-align: center; font-family: ui-monospace, monospace; font-weight: 800; border: 1px dashed rgba(52,199,89,0.6); background-color: rgba(52,199,89,0.10); }
  .cp .code.foil { cursor: pointer; }
  .cp .code.foil:hover { border-color: #34c759; border-style: solid; }
  .cp .cv { display: inline-block; color: light-dark(#248a3d, #30d158); font-size: 20px; }
  .cp .fb { position: absolute; width: 8.34%; height: 21px; transition: opacity 240ms cubic-bezier(.5,1,.89,1); }
  .cp .lab { position: absolute; left: 0; top: 0; width: 100%; height: 42px; line-height: 42px; text-align: center; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; color: rgba(60,60,67,1); transition: color 560ms linear; }
  .cp .acts { display: flex; margin-top: 10px; }
  .cp .acts button { flex-grow: 1; flex-basis: 0; line-height: 20px; }
  .cp .acts button:first-child { margin-right: 8px; }
  .cp .acts button.ok { background-color: #34c759; color: #ffffff; }
  .cp .bagl { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background-color: rgba(127,127,127,0.10); font-size: 13px; }
  .cp .old { text-decoration: line-through; }
  .cp .cd { font-family: ui-monospace, monospace; }
  [hidden] { display: none !important; }

  /* tween(fx, {code: 1}, 500, ease.outBack) from 1.4 */
  @keyframes reveal { 0% { transform: scale(1.4); } 60% { transform: scale(0.93); } 85% { transform: scale(1.02); } 100% { transform: scale(1); } }
  .cp .cv.reveal { animation: reveal 500ms cubic-bezier(.33,1,.68,1) both; }
  /* fx.copy 1.3 → 1, 400 ms outBack */
  @keyframes popbig { 0% { transform: scale(1.3); } 60% { transform: scale(0.95); } 100% { transform: scale(1); } }
  .cp .acts button.pop { animation: popbig 400ms cubic-bezier(.33,1,.68,1) both; }
  /* fx.save 0.2 → 1, 520 ms outBack */
  @keyframes grow { 0% { transform: scale(0.2); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .cp .badge.grow { animation: grow 520ms cubic-bezier(.33,1,.68,1) both; }
  /* fx.gold 0.4 → 1, 600 ms outBack */
  @keyframes gold { 0% { transform: scale(0.75); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
  .cp .hole.gold { font-size: 13px; animation: gold 600ms cubic-bezier(.33,1,.68,1) both; }
  /* transition('fade') on the bubble */
  @keyframes fade { from { opacity: 0.25; } to { opacity: 1; } }
  .cp.fx-fade, .cp.fx-fade2 { animation: fade 220ms ease-out; }
</style>
<div class="cp" id="root">
  <div class="row">
    <div class="ring" id="ring" style="background-color: rgba(127,127,127,0.2)"><div class="hole card" id="hole" style="font-size: 16px">0%</div></div>
    <div class="grow">
      <div class="caps t-green">Thanks for your order</div>
      <div style="font-size: 16px; font-weight: 800">15% off your next trip</div>
      <div class="small muted" id="sub">3 of 4 orders to Gold ✦</div>
    </div>
  </div>
  <div class="code foil" id="code"><span class="cv" id="cv">NEXTTRAIL</span><span class="lab" id="lab">✦ Tap to scratch ✦</span></div>
  <div class="tiny muted center" id="hint" style="margin-top: 6px">Scratch the foil to reveal your code</div>
  <div id="after" hidden>
    <div class="acts">
      <button id="copy">Copy code</button>
      <button id="apply" class="primary">Apply to bag</button></div>
    <div class="bagl">
      <div class="row"><span class="grow">Saved bag <span class="muted">· socks ×3, sun hat</span></span><span class="small muted old" id="old" hidden>€74.00</span><b id="price" style="margin-left: 6px">€74.00</b></div>
      <div class="row small" id="saved" style="margin-top: 3px" hidden><span class="grow t-green">NEXTTRAIL · 15% off</span><span class="badge green" id="savebadge">You save €11.10</span></div>
    </div>
  </div>
  <div class="row tiny muted" style="margin-top: 8px"><span class="grow">⏳ Expires 31 Dec</span><span class="cd" id="cd"></span></div>
</div>
<script>
const CODE = 'NEXTTRAIL', COLS_N = 12, N = 24, BASE = 74, OFF = 0.15;
const EXPIRES = new Date(2026, 11, 31, 23, 59, 59).getTime();
const order = Array.from({ length: N }, (_, i) => [i, (i % COLS_N) + Math.random() * 4]).sort((a, b) => a[1] - b[1]).map(p => p[0]);
let scratched = 0, taps = 0, revealed = false, copied = false, applied = false, copyRun = 0;
const fx = { ring: 0, pct: 0, price: BASE };
const pad = n => String(n).padStart(2, '0');
const r2 = x => Math.round(x * 100) / 100;
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const $ = id => document.getElementById(id);
const root = $('root'), ringEl = $('ring'), hole = $('hole'), sub = $('sub'), codeEl = $('code'), cv = $('cv'), lab = $('lab');

// --- prelude-style easing + tween (numbers only; everything visual is CSS) ---
const ease = {
  linear: t => t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
};
const animate = (duration, onFrame, easing = ease.inOutCubic) => new Promise(resolve => {
  const start = performance.now();
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / Math.max(1, duration));
    onFrame(easing(t), t);
    if (t < 1) requestAnimationFrame(step); else resolve();
  };
  step();
});
const owners = new Map();
function tween(target, props, duration, easing, onFrame) {
  const token = {}, from = {}, to = {};
  for (const key of Object.keys(props)) { from[key] = Number(target[key]) || 0; to[key] = Number(props[key]); owners.set(key, token); }
  return animate(duration, p => {
    for (const key in to) if (owners.get(key) === token) target[key] = from[key] + (to[key] - from[key]) * p;
    onFrame();
  }, easing).then(() => { for (const key in to) if (owners.get(key) === token) { target[key] = to[key]; owners.delete(key); } onFrame(); });
}
// transition('fade') → short animation on the widget root (alternate class names so it restarts)
function fade() { const a = root.classList.contains('fx-fade'); root.classList.remove('fx-fade', 'fx-fade2'); root.classList.add(a ? 'fx-fade2' : 'fx-fade'); }
root.addEventListener('animationend', e => { if (e.target === root) root.classList.remove('fx-fade', 'fx-fade2'); });
// restartable one-shot animation class
function pop(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

// --- foil blocks ---
const blocks = [];
for (let i = 0; i < N; i++) {
  const b = document.createElement('span');
  b.className = 'fb';
  b.style.left = ((i % COLS_N) * 100 / COLS_N).toFixed(2) + '%';
  b.style.top = Math.floor(i / COLS_N) * 21 + 'px';
  b.style.backgroundColor = (i + Math.floor(i / COLS_N)) % 2 ? 'rgb(170,170,176)' : 'rgb(188,188,194)';
  codeEl.insertBefore(b, lab);
  blocks.push(b);
}

// --- ring / progress / price (animated numbers) ---
function paintRing() {
  const deg = fx.ring * 360, gold = applied && fx.ring > 0.995;
  ringEl.style.background = deg < 0.5 ? 'rgba(127,127,127,0.2)' : `conic-gradient(${gold ? '#ff9f0a' : '#34c759'} ${deg.toFixed(1)}deg, rgba(127,127,127,0.2) ${deg.toFixed(1)}deg)`;
  if (gold) {
    if (!hole.classList.contains('gold')) { hole.textContent = 'GOLD'; hole.style.fontSize = ''; hole.classList.add('gold'); sub.textContent = 'This order unlocks Gold ✦'; }
  } else {
    if (hole.classList.contains('gold')) { hole.classList.remove('gold'); sub.textContent = '3 of 4 orders to Gold ✦'; }
    hole.style.fontSize = '16px';
    hole.textContent = Math.round(fx.pct) + '%';
  }
}
function paintPrice() { $('price').textContent = '€' + fx.price.toFixed(2); }

setTimeout(() => tween(fx, { ring: 0.75, pct: 15 }, 900, ease.outCubic, paintRing), 250);

// --- countdown ---
function tick() {
  const left = Math.max(0, EXPIRES - Date.now());
  $('cd').textContent = left ? `${Math.floor(left / 86400000)}d ${pad(Math.floor(left / 3600000) % 24)}:${pad(Math.floor(left / 60000) % 60)}:${pad(Math.floor(left / 1000) % 60)}` : 'expired';
}
tick();
setInterval(tick, 1000);

// --- scratch ---
function scratch() {
  if (revealed || scratched >= N) return;
  taps++;
  const take = taps >= 3 ? N - scratched : taps === 1 ? 10 : 9;
  const batch = order.slice(scratched, scratched + take);
  scratched += take;
  const last = scratched >= N;
  // foil[b] → 0 over 240 ms (outQuad), block j delayed by j × 30 ms; the whole batch is done at 560 ms
  batch.forEach((b, j) => { blocks[b].style.transitionDelay = (j * 30) + 'ms'; blocks[b].style.opacity = '0'; });
  const rest = (N - scratched) / N;
  lab.textContent = 'Keep scratching ✦';
  lab.style.color = `rgba(60,60,67,${clamp(rest * 1.6 - 0.5, 0, 1).toFixed(2)})`;
  setTimeout(() => {
    if (!last || revealed) return;
    fade();
    revealed = true;
    lab.remove();
    for (const b of blocks) b.remove();
    codeEl.classList.remove('foil');
    cv.classList.add('reveal');
    $('hint').hidden = true;
    $('after').hidden = false;
  }, 560);
}
codeEl.addEventListener('click', scratch);

// --- copy / apply ---
$('copy').addEventListener('click', () => {
  // copyText(CODE): the clipboard is a no-op in the sandbox; visual feedback only
  copied = true;
  const btn = $('copy');
  btn.classList.add('ok'); btn.textContent = '✓ Copied!';
  pop(btn, 'pop');
  const me = ++copyRun;
  setTimeout(() => { if (me === copyRun) { copied = false; btn.classList.remove('ok'); btn.textContent = 'Copy code'; } }, 1800);
});
$('apply').addEventListener('click', () => {
  fade();
  applied = !applied;
  const btn = $('apply');
  btn.classList.toggle('primary', !applied); btn.textContent = applied ? 'Remove' : 'Apply to bag';
  $('old').hidden = !applied;
  $('saved').hidden = !applied;
  tween(fx, { price: applied ? r2(BASE * (1 - OFF)) : BASE }, 900, ease.outCubic, paintPrice);
  tween(fx, { ring: applied ? 1 : 0.75 }, 800, ease.inOutCubic, paintRing);
  if (applied) pop($('savebadge'), 'grow');
});
</script>
