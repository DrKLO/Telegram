<!--
  source: Telegram macOS 12.10 (283300), 07-shop.chat, message 8
  author: shop 14:10 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --blue: #007aff; --orange: #ff9500; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  p { margin: 0 0 8px 0; }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .pad { padding: 12px 14px; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
  .caps { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  .grow { flex-grow: 1; } .center { text-align: center; }
  .t-orange { color: var(--orange); }
  .av { display: inline-block; width: 24px; height: 24px; border-radius: 12px; text-align: center; line-height: 24px; color: #ffffff; font-size: 10px; font-weight: 700; background-color: #8e8e93; }
  [data-action] { cursor: pointer; }

  .rv { width: 460px; max-width: 100%; box-sizing: border-box; }
  .rv .big { font-size: 44px; font-weight: 800; line-height: 1; }
  .rv .stars { position: relative; display: inline-block; white-space: nowrap; font-size: 15px; color: rgba(127,127,127,0.35); }
  .rv .stars div { position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap; color: #ff9f0a; transition: width 900ms cubic-bezier(.33,1,.68,1); }
  .rv .hist { display: flex; align-items: center; font-size: 12px; padding: 2px 4px; border-radius: 6px; }
  .rv .hist:hover { background-color: rgba(127,127,127,0.10); }
  .rv .hist.on { background-color: rgba(255,159,10,0.16); }
  .rv .hist .lab { width: 26px; }
  .rv .hist .b { flex-grow: 1; height: 7px; border-radius: 4px; background-color: rgba(127,127,127,0.18); margin: 0 8px; }
  .rv .hist .b div { height: 7px; border-radius: 4px; background-color: #ff9f0a; transition: width 520ms cubic-bezier(.33,1,.68,1); }
  .rv .hist.dim .b div { background-color: rgba(255,159,10,0.35); }
  .rv .hist .n { width: 30px; text-align: right; }
  .rv .fit { margin-top: 10px; }
  .rv .trk { position: relative; height: 4px; margin: 6px 0 4px 0; border-radius: 2px; background-color: rgba(127,127,127,0.2); }
  .rv .mk { position: absolute; top: -4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 6px; background-color: #ff9f0a; transition: left 900ms cubic-bezier(.33,1,.68,1); }
  .rv .ctl { margin-top: 12px; }
  .rv .seg { display: inline-block; padding: 2px; border-radius: 9px; white-space: nowrap; background-color: rgba(127,127,127,0.14); }
  .rv .seg span { display: inline-block; padding: 3px 9px; border-radius: 7px; font-size: 12px; font-weight: 600; }
  .rv .seg span:hover { background-color: rgba(127,127,127,0.18); }
  .rv .seg span.on { background-color: light-dark(#ffffff, #636366); color: light-dark(#1c1c1e, #ffffff); }
  .rv .chip2 { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 12px; font-weight: 700; background-color: rgba(255,159,10,0.18); color: light-dark(#c76a00, #ffb340); }
  .rv .chip2:hover { background-color: rgba(255,159,10,0.3); }
  .rv .list { margin-top: 8px; }
  .rv .rw { overflow: hidden; }
  .rv .rev { position: relative; border-top: 1px solid rgba(127,127,127,0.18); padding: 10px 0 4px 0; }
  .rv .rev.in { animation: slidein 320ms cubic-bezier(.33,1,.68,1) both; }
  @keyframes slidein { from { transform: translateX(460px); } to { transform: translateX(0); } }
  .rv .who2 { font-weight: 700; font-size: 13px; }
  .rv .rev p { font-size: 13px; margin: 4px 0 6px 0; }
  .rv .more { color: #007aff; font-weight: 600; }
  .rv .more:hover { text-decoration: underline; }
  .rv .help { font-size: 11px; }
  .rv .hb { display: inline-block; height: 18px; line-height: 18px; padding: 1px 9px; border-radius: 10px; font-size: 11px; background-color: rgba(127,127,127,0.12); }
  .rv .hb:hover { background-color: rgba(127,127,127,0.24); }
  .rv .hb.on { background-color: rgba(0,122,255,0.16); color: #007aff; }
  .rv .hb b { display: inline-block; }
  /* pops[id].s: 1.7 → 1 (vote) or 0.7 → 1 (unvote), 420 ms outBack */
  @keyframes hbup { 0% { transform: scale(1.7); } 60% { transform: scale(0.92); } 100% { transform: scale(1); } }
  @keyframes hbdown { 0% { transform: scale(0.7); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .rv .hb b.up { animation: hbup 420ms cubic-bezier(.33,1,.68,1) both; }
  .rv .hb b.down { animation: hbdown 420ms cubic-bezier(.33,1,.68,1) both; }
  .rv .pg { margin-top: 8px; padding: 7px 0; text-align: center; border-radius: 9px; font-size: 12px; font-weight: 600; color: #007aff; background-color: rgba(0,122,255,0.08); }
  .rv .pg:hover { background-color: rgba(0,122,255,0.16); }
  [hidden] { display: none !important; }
  @keyframes fade { from { opacity: 0.25; } to { opacity: 1; } }
  .rv .fx-fade, .rv .fx-fade2 { animation: fade 220ms ease-out; }
</style>
<div class="card pad rv" id="root">
  <div class="row" style="align-items: flex-start">
    <div style="width: 120px; text-align: center; margin-right: 14px">
      <div class="big" id="avg">0.0</div>
      <div class="stars">★★★★★<div id="starfill" style="width: 0%">★★★★★</div></div>
      <div class="tiny muted"><span id="total">0</span> reviews</div>
    </div>
    <div class="grow" id="hist"></div>
  </div>
  <div class="fit row"><span class="caps" style="width: 40px">Fit</span><div class="grow">
    <div class="trk"><div class="mk" id="mk" style="left: 0%"></div></div>
    <div class="row between tiny muted"><span>Runs small</span><span>True to size</span><span>Runs large</span></div></div></div>
  <div class="row ctl"><span class="grow small" id="filt"><span class="muted">Tap a bar to filter</span></span><span class="seg" id="seg"></span></div>
  <div class="list" id="list"></div>
  <div class="pg" id="pg" data-action="page" hidden></div>
</div>
<script>
const HIST = [[5, 192], [4, 19], [3, 4], [2, 2], [1, 1]], TOTAL = 218, AVG = 4.9, FIT = 0.66;
const R = [
  { who: 'Julia K.', ini: 'JK', col: '#af52de', stars: 5, days: 3, variant: 'Forest, M', helpful: 48, text: 'Wore it for a week in the Scottish Highlands. Sideways rain, zero leaks. The hood actually stays put in wind, which is rare. We walked from Fort William to Kinlochleven in one of the wettest Augusts on record and my base layer was dry every single evening. The pit zips are small, but the fabric breathes far better than my old 2-layer shell.' },
  { who: 'Marco R.', ini: 'MR', col: '#30b0c7', stars: 4, days: 12, variant: 'Tide, M', helpful: 31, text: 'Great jacket, runs slightly large. I’m usually an L and the M fits perfectly with a fleece underneath.' },
  { who: 'Sofia L.', ini: 'SL', col: '#ff9500', stars: 5, days: 20, variant: 'Dune, S', helpful: 22, text: 'Packs down to the size of a burrito 🌯 — lives in my daypack permanently now.' },
  { who: 'Henrik B.', ini: 'HB', col: '#5856d6', stars: 3, days: 6, variant: 'Forest, L', helpful: 17, text: 'Totally waterproof, no complaints there. On steep climbs it gets clammy though: I was soaked from the inside on a fast hike up Snowdon. Fine for walking in the rain, less so for running or anything high-output. Proper pit zips would fix it.' },
  { who: 'Aiko T.', ini: 'AT', col: '#ff2d55', stars: 5, days: 1, variant: 'Tide, S', helpful: 9, text: 'Third Northwind jacket I own. The Tide colour is even nicer in person.' },
  { who: 'Tom H.', ini: 'TH', col: '#34c759', stars: 4, days: 33, variant: 'Dune, XL', helpful: 14, text: 'Solid shell and a great hood. One star off because the hand pockets sit under a hip belt, so you can’t reach them with a pack on.' },
  { who: 'Dan P.', ini: 'DP', col: '#8e8e93', stars: 2, days: 45, variant: 'Forest, XL', helpful: 6, text: 'The zip started snagging after a month of daily commuting. Customer service sent a replacement within a week, which was great, but I expected better at this price. The new one has been fine so far, so maybe I was just unlucky with the first.' },
  { who: 'Lea W.', ini: 'LW', col: '#ff3b30', stars: 1, days: 58, variant: 'Dune, M', helpful: 3, text: 'Arrived in the wrong colour and the exchange took three weeks.' },
].map((r, id) => Object.assign(r, { id }));
const SORTS = [['helpful', 'Helpful'], ['newest', 'Newest'], ['critical', 'Critical']];
const BY = {
  helpful: (a, b) => b.helpful - a.helpful,
  newest: (a, b) => a.days - b.days,
  critical: (a, b) => a.stars - b.stars || b.helpful - a.helpful,
};
let filter = 0, sort = 'helpful', limit = 3, introDone = false;
const open = new Set(), voted = new Set();
const ago = d => d === 1 ? 'yesterday' : d < 14 ? d + ' days ago' : d < 60 ? Math.round(d / 7) + ' weeks ago' : Math.round(d / 30) + ' months ago';
const stars = n => '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
const visible = () => R.filter(r => !filter || r.stars === filter).sort(BY[sort]);
const esc = v => String(v === undefined || v === null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const outCubic = t => 1 - Math.pow(1 - t, 3);
const $ = id => document.getElementById(id);
const root = $('root');
function pop(el, cls, other) { el.classList.remove(cls, other); void el.offsetWidth; el.classList.add(cls); }

// --- static parts ---
$('hist').innerHTML = HIST.map(([s, n], i) => `<div class="hist" data-action="filter" data-value="${s}"><span class="lab">${s}★</span><div class="b"><div style="width: 0%; transition-delay: ${i * 80}ms"></div></div><span class="n muted">0</span></div>`).join('');
$('seg').innerHTML = SORTS.map(([key, label]) => `<span class="${sort === key ? 'on' : ''}" data-action="sort" data-value="${key}">${label}</span>`).join('');
const histRows = [...document.querySelectorAll('.hist')];

// --- intro (250 ms delay, 900 ms linear t; sizes via CSS transitions, numbers via rAF) ---
setTimeout(() => {
  $('starfill').style.width = (AVG / 5 * 100).toFixed(1) + '%';
  $('mk').style.left = (FIT * 100).toFixed(1) + '%';
  histRows.forEach((row, i) => { row.querySelector('.b div').style.width = Math.max(HIST[i][1] / TOTAL * 100, 1.5).toFixed(1) + '%'; });
  const start = performance.now();
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / 900), k = outCubic(t);
    $('avg').textContent = (AVG * k).toFixed(1);
    $('total').textContent = Math.round(TOTAL * k);
    histRows.forEach((row, i) => { const e = outCubic(clamp((t * 900 - i * 80) / 520, 0, 1)); row.querySelector('.n').textContent = Math.round(HIST[i][1] * e); });
    if (t < 1) requestAnimationFrame(step); else introDone = true;
  };
  step();
}, 250);

// --- reviews ---
function textHTML(r) {
  const long = r.text.length > 150, isOpen = open.has(r.id);
  const text = long && !isOpen ? esc(r.text.slice(0, r.text.lastIndexOf(' ', 130))) + '… ' : esc(r.text) + ' ';
  const more = long ? `<span class="more" data-action="more" data-value="${r.id}">${isOpen ? 'Show less' : 'Read more'}</span>` : '';
  return text + more;
}
function review(r, i) {
  const on = voted.has(r.id);
  const anim = introDone ? '' : ` class="rev in" style="animation-delay: ${300 + i * 110}ms"`;
  return `<div class="rw"><div${anim || ' class="rev"'} data-id="${r.id}">
    <div class="row"><span class="av" style="background-color: ${r.col}; margin-right: 8px">${r.ini}</span><span class="who2 grow">${esc(r.who)} <span class="tiny muted">· ${ago(r.days)}</span></span><span class="t-orange small">${stars(r.stars)}</span></div>
    <p>${textHTML(r)}</p>
    <div class="row"><span class="help muted grow">Verified purchase · ${esc(r.variant)}</span><span class="hb${on ? ' on' : ''}" data-action="help" data-value="${r.id}">👍 Helpful · <b>${r.helpful + (on ? 1 : 0)}</b></span></div>
  </div></div>`;
}
function renderList() {
  const all = visible(), rest = all.length - limit;
  $('list').innerHTML = all.slice(0, limit).map(review).join('') || '<div class="small muted center" style="padding: 14px 0">No written reviews with that rating yet</div>';
  const pg = $('pg');
  pg.hidden = !(rest > 0 || limit > 3);
  pg.textContent = rest > 0 ? `Show ${Math.min(3, rest)} more · ${rest} left` : 'Show fewer';
  $('filt').innerHTML = filter ? `<span class="chip2" data-action="filter" data-value="${filter}">${filter}★ only · ${all.length} ✕</span>` : '<span class="muted">Tap a bar to filter</span>';
  histRows.forEach((row, i) => { row.classList.toggle('on', filter === HIST[i][0]); row.classList.toggle('dim', !!filter && filter !== HIST[i][0]); });
  for (const s of $('seg').children) s.classList.toggle('on', s.dataset.value === sort);
}
renderList();

root.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !root.contains(el)) return;
  const name = el.dataset.action, value = el.dataset.value;
  if (name === 'filter') { const s = Number(value); introDone = true; filter = filter === s ? 0 : s; limit = 3; renderList(); }
  else if (name === 'sort') { if (sort === value) return; sort = value; limit = 3; renderList(); }
  else if (name === 'more') {
    const id = Number(value);
    if (open.has(id)) open.delete(id); else open.add(id);
    const p = root.querySelector(`.rev[data-id="${id}"] p`);
    if (p) { p.innerHTML = textHTML(R[id]);  }
  }
  else if (name === 'page') { limit = visible().length > limit ? limit + 3 : 3; renderList(); }
  else if (name === 'help') {
    const id = Number(value), was = voted.has(id);
    if (was) voted.delete(id); else voted.add(id);
    el.classList.toggle('on', !was);
    const b = el.querySelector('b');
    b.textContent = R[id].helpful + (was ? 0 : 1);
    pop(b, was ? 'down' : 'up', was ? 'up' : 'down');
  }
});
</script>
