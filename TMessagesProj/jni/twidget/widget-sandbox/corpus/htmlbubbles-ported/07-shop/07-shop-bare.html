$('r-stops').innerHTML = Array.from({ length: TOTAL - 1 }, (_, j) => { const [x, y] = at((j + 1) / TOTAL); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#ff9500" stroke="#ffffff" stroke-width="1.5"/>`; }).join('');
const stops = [...$('r-stops').children];
const [hx, hy] = ROUTE[ROUTE.length - 1];
$('home').style.left = (hx - 14) + 'px'; $('home').style.top = (hy - 14) + 'px';
$('truckico').innerHTML = ico('truck.box.fill', 13, 'ffffff');
$('hdrico').innerHTML = ico('shippingbox.fill', 20, '34c759');
$('steps').innerHTML = STAGES.map((s, i) => `<div class="st${i >= 3 ? ' late' : ''}" data-action="stage" data-value="${i}">${i < 4 ? '<div class="ln"><div></div></div>' : ''}<div class="dot"><span class="halo"></span><span class="num">${i + 1}</span></div><span class="lbl">${s.name}</span></div>`).join('');
const steps = [...$('steps').children];

// --- per-frame geometry (prog.v) ---
function paintProg() {
  const f = clamp(prog.v - 3, 0, 1), [tx, ty] = at(f);
  const truck = $('truck');
  truck.style.left = (tx - 14).toFixed(1) + 'px'; truck.style.top = (ty - 14).toFixed(1) + 'px';
  truck.hidden = delivered && f > 0.98;
  $('r-prog').setAttribute('points', line(along(f)));
  stops.forEach((c, j) => c.setAttribute('display', (j + 1) / TOTAL > f + 0.002 ? '' : 'none'));
  steps.forEach((st, i) => {
    const done = delivered || prog.v >= i + 1;
    const now = !done && prog.v >= i - 0.001;
    if (st.classList.contains('done') !== done) { st.classList.toggle('done', done); st.querySelector('.num').textContent = done ? '✓' : String(i + 1); }
    if (st.classList.contains('now') !== now) st.classList.toggle('now', now);
    const lbl = st.querySelector('.lbl'), cls = now ? 'lbl now' : done ? 'lbl' : 'lbl todo';
    if (lbl.className !== cls) lbl.className = cls;
    st.querySelector('.halo').hidden = !(now && pulsing);
    if (i < 4) {
      const ln = st.querySelector('.ln div');
      ln.style.width = (clamp(prog.v - i, 0, 1) * 100).toFixed(1) + '%';
      ln.style.backgroundColor = i === 3 && !delivered ? '#007aff' : '#34c759';
    }
  });
  $('thalo').hidden = delivered || !pulsing;
}

// --- state-driven parts ---
function paintState() {
  const left = stopsLeft();
  $('badge').className = 'badge ' + (delivered ? 'green' : 'blue');
  $('badge').textContent = delivered ? 'DELIVERED' : 'OUT FOR DELIVERY';
  $('subline').innerHTML = delivered ? 'DHL Express · delivered <b class="fg">today, 16:21</b>' : `DHL Express · arriving <b class="fg">today, ${eta}</b>`;
  $('pref').hidden = pref < 0;
  if (pref >= 0) $('pref').textContent = `📦 ${PREFS[pref][1]}`;
  $('home').style.backgroundColor = delivered ? '#34c759' : '#ffffff';
  $('homeico').innerHTML = ico('house.fill', 13, delivered ? 'ffffff' : '34c759');
  $('eta').textContent = delivered ? '✓ Delivered at 16:21' : `${left} stop${left === 1 ? '' : 's'} before you · ETA ${eta}`;
  $('lv').hidden = !live;
  steps.forEach((st, i) => st.classList.toggle('sel', sel === i));
  // detail
  if (sel >= 0) {
    const s = STAGES[sel];
    const text = sel === 3 ? `Driver Jonas · van B-NW 5821 · ${delivered ? 'route finished' : left + ' stop' + (left === 1 ? '' : 's') + ' before you'}`
      : sel === 4 ? (delivered ? DELIVERED[pref + 1] : `Expected today ${eta}` + (pref >= 0 ? ' · ' + PREFS[pref][1].toLowerCase() : ' · no signature needed'))
      : s.text;
    const when = sel === 4 ? (delivered ? 'Today 16:21' : 'Pending') : s.when;
    $('detail').innerHTML = `<div class="det">${ico(s.icon, 16, '007aff')}<div class="grow"><b>${s.name}</b> <span class="tiny muted">${when}</span><div class="small" style="margin-top: 2px">${esc(text)}</div></div><span class="x" data-action="stage" data-value="${sel}">✕</span></div>`;
  } else $('detail').innerHTML = '';
  // feed
  const list = showAll ? events : events.slice(0, 3);
  const age = performance.now() - freshAt;
  $('feed').innerHTML = list.map((e, i) => `<div class="ev${e.id === freshId && age < 1800 ? ' fresh' : ''}"${e.id === freshId && age < 1800 ? ` style="animation-delay: -${Math.round(age)}ms"` : ''}><span class="t muted">${e.time}</span>${ico(e.icon, 15, i === 0 ? e.color : '8e8e93')}<div class="grow">${i === 0 ? `<b>${esc(e.title)}</b>` : esc(e.title)}<div class="tiny muted">${esc(e.sub)}</div></div></div>`).join('');
  $('more').hidden = events.length <= 3;
  $('more').textContent = showAll ? 'Show less' : `Show all ${events.length} updates`;
  // rating
  $('rate').hidden = !delivered;
  $('ratetxt').innerHTML = rating ? `Thanks! You rated Jonas <b>${rating}★</b>` : 'How was your delivery?';
  [...$('rate').querySelectorAll('.s')].forEach((s, n) => s.classList.toggle('on', n + 1 <= rating));
  // actions
  $('livebtn').hidden = delivered;
  $('livebtn').classList.toggle('liveon', live);
  $('livebtn').textContent = live ? '⏸ Pause' : '● Live';
  $('nextbtn').textContent = delivered ? '↻ Replay' : 'Next update ›';
  // options page
  $('main').hidden = page !== 'main';
  $('opts').hidden = page !== 'opts';
  $('optsub').textContent = delivered ? 'Saved for your next deliveries' : 'Jonas sees your choice on his scanner';
  $('savebtn').textContent = pick >= 0 && pick !== pref ? 'Save' : 'Done';
}
function paintOpts() {
  $('optlist').innerHTML = PREFS.map(([icon, title, subtitle], i) => {
    const on = pick === i;
    return `<div class="opt${on ? ' on' : ''}" data-action="pick" data-value="${i}">${ico(icon, 18, on ? '007aff' : '8e8e93')}<div class="grow"><b>${title}</b><div class="tiny muted">${subtitle}</div></div><span class="radio">${on ? '<span class="rd"></span>' : ''}</span></div>`;
  }).join('');
}

// --- motion ---
function pulse() {
  pulsing = true;
  if (pulseTimer) clearTimeout(pulseTimer);
  const halos = [...root.querySelectorAll('.halo')];
  for (const h of halos) h.classList.remove('go');
  paintProg();
  void root.offsetWidth;
  for (const h of halos) h.classList.add('go');
  pulseTimer = setTimeout(() => { pulsing = false; pulseTimer = 0; paintProg(); }, 2850);
}
function arrive() {
  tween(prog, { v: goal() }, 900, ease.inOutCubic, paintProg);
  setTimeout(pulse, 900);
}
function freshen() {
  events = events.slice(0, 12);
  freshId = events[0].id; freshAt = performance.now();
  paintState();
}
function reach(m) {
  if (m.delivered) {
    bubble('pop');
    delivered = true;
    setLive(false);
    events.unshift(ev(m.time, 'checkmark.circle.fill', '34c759', 'Delivered', DELIVERED[pref + 1]));
    $('home').classList.remove('in'); void root.offsetWidth; $('home').classList.add('in');
  } else {
    eta = m.eta;
    events.unshift(ev(m.time, 'truck.box.fill', '007aff', m.title, m.sub + ' · ETA ' + m.eta));
  }
  freshen();
}
function move() {
  tween(prog, { v: goal() }, 1000, ease.inOutCubic, paintProg);
  const m = MILESTONES[nextEv];
  if (m && pos >= m.pos) { nextEv++; reach(m); }
  if (!delivered) pulse();
  paintState();
}
function setLive(on) {
  live = on;
  if (liveTimer) { clearInterval(liveTimer); liveTimer = 0; }
  if (on) liveTimer = setInterval(() => { if (delivered) return setLive(false); pos++; move(); }, 1400);
  paintState();
}

paintProg(); paintState();
setTimeout(arrive, 250);

root.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !root.contains(el)) return;
  const name = el.dataset.action, value = el.dataset.value;
  if (name === 'next') {
    if (delivered) {
      bubble('fade');
      setLive(false); reset(); sel = -1; showAll = false;
      $('home').classList.remove('in');
      paintProg(); paintState();
      arrive();
      return;
    }
    pos = MILESTONES[nextEv].pos;
    move();
  } else if (name === 'live') setLive(!live);
  else if (name === 'stage') { const i = Number(value); bubble('fade'); sel = sel === i ? -1 : i; paintState(); }
  else if (name === 'all') { bubble('fade'); showAll = !showAll; paintState(); }
  else if (name === 'opts') { bubble('slide-left'); page = 'opts'; pick = pref; paintOpts(); paintState(); }
  else if (name === 'pick') { pick = Number(value); paintOpts(); paintState(); }
  else if (name === 'back' || name === 'save') {
    bubble('slide-right');
    page = 'main';
    if (name === 'save' && pick >= 0 && pick !== pref) {
      pref = pick;
      events.unshift(ev('Just now', 'pencil.circle.fill', 'af52de', 'Delivery instructions updated', PREFS[pref][1]));
      freshen();
      pop($('pref'), 'pop');
    }
    paintState();
  } else if (name === 'rate') { rating = Number(value); paintState(); pop(el, 'pop'); }
});
</script>
