<script>
const COLS = [
  { id: 'green', name: 'Forest', hex: '#2d6a4f', photo: 'forest', where: 'Sintra, after the rain' },
  { id: 'blue', name: 'Tide', hex: '#2a5298', photo: 'ocean', where: 'Atlantic coast' },
  { id: 'sand', name: 'Dune', hex: '#e07b39', photo: 'dunes', where: 'Comporta dunes' },
];
const SIZES = ['S', 'M', 'L', 'XL', 'XXL'];
const STOCK = { green: [6, 2, 9, 4, 0], blue: [0, 7, 3, 0, 1], sand: [5, 1, 0, 6, 0] };
const SLIDES = ['Studio', 'On location', 'Packs small'];
const FEATS = [
  ['drop.fill', '007aff', '20,000 mm waterproof, taped seams'],
  ['wind', '8e8e93', 'Breathable 3-layer shell'],
  ['leaf.fill', '34c759', '100% recycled face fabric'],
  ['scalemass.fill', 'af52de', 'Packs into its own pocket · 310 g'],
];
const PRICE = 129, FREE_SHIP = 150, MAX_QTY = 5;

let col = 0, size = 1, qty = 1, slide = 0, nextId = 1, bag = [], toast = null, toastRun = 0, bagOpen = false, placed = null;
const notify = {};
const price = { v: 0 }, sub = { v: 0 };

const ICONS = {
  'checkmark.circle.fill': '<circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  'drop.fill': '<path d="M12 2.5C12 2.5 5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5Z"/>',
  'wind': '<path d="M3 8h9a2.5 2.5 0 1 0-2.5-2.5M3 12h14a2.5 2.5 0 1 1-2.5 2.5M3 16h8a2 2 0 1 1-2 2" fill="none" stroke="COLOR" stroke-width="2" stroke-linecap="round"/>',
  'leaf.fill': '<path d="M20.5 3.5C9 3.5 4 10 4 20c10 0 16.5-5 16.5-16.5Z"/><path d="M4 20c3-6 7-9.5 11-12" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.4"/>',
  'scalemass.fill': '<path d="M9 2.5h6l1.2 5H7.8Z"/><path d="M5 8.5h14l2.2 11.3a1 1 0 0 1-1 1.2H3.8a1 1 0 0 1-1-1.2Z"/>',
};
const ico = (name, size, color) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="#${color}">${ICONS[name].replace(/COLOR/g, '#' + color)}</svg>`;
const esc = v => String(v === undefined || v === null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const $ = id => document.getElementById(id);
const root = $('root');
const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => '#' + rgb(a).map((q, i) => Math.round(q + (rgb(b)[i] - q) * t).toString(16).padStart(2, '0')).join('');
const shade = (c, t) => mix(c, '#000000', t);
const tint = (c, t) => mix(c, '#ffffff', t);
const stock = () => STOCK[COLS[col].id][size];
const maxQty = () => Math.min(MAX_QTY, stock());
const count = () => bag.reduce((s, l) => s + l.qty, 0);

const ease = { outCubic: t => 1 - Math.pow(1 - t, 3) };
const owners = new Map();
function tween(target, props, duration, easing, onFrame) {
  const token = {}, from = {}, to = {};
  for (const key of Object.keys(props)) { from[key] = Number(target[key]) || 0; to[key] = Number(props[key]); owners.set(key, token); }
  const start = performance.now();
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / duration), p = easing(t);
    for (const key in to) if (owners.get(key) === token) target[key] = t >= 1 ? to[key] : from[key] + (to[key] - from[key]) * p;
    onFrame();
    if (t < 1) requestAnimationFrame(step); else for (const key in to) if (owners.get(key) === token) owners.delete(key);
  };
  step();
}
function bubble(kind) { const a = root.classList.contains('fx-' + kind); root.classList.remove('fx-fade', 'fx-fade2', 'fx-pop', 'fx-pop2'); root.classList.add('fx-' + kind + (a ? '2' : '')); }
root.addEventListener('animationend', e => { if (e.target === root) root.classList.remove('fx-fade', 'fx-fade2', 'fx-pop', 'fx-pop2'); });
function pop(el, cls, ...others) { el.classList.remove(cls, ...others); void el.offsetWidth; el.classList.add(cls); }

// --- tone (paint.k is a CSS transition on the --c/--d/--l/--z fills) ---
function paintTone() {
  const c = COLS[col].hex;
  root.style.setProperty('--c', c); root.style.setProperty('--d', shade(c, 0.28)); root.style.setProperty('--l', tint(c, 0.16)); root.style.setProperty('--z', shade(c, 0.55));
}
function swapPhoto(prev, next) {
  for (const w of $('slide1').querySelectorAll('.wipe')) w.remove();
  if (prev === next) return;
  const w = document.createElement('div');
  w.className = 'wipe';
  w.innerHTML = `<div class="ph ${next}"></div>`;
  w.addEventListener('animationend', () => { $('ph').className = 'ph ' + next; w.remove(); });
  $('slide1').appendChild(w);
}

// --- carousel ---
$('dots').innerHTML = SLIDES.map((_, i) => `<span class="dot${i === 0 ? ' on' : ''}" data-action="slide" data-value="${i}"></span>`).join('');
function paintSlide() {
  $('track').style.transform = `translateX(${-slide * 100}%)`;
  [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === slide));
  $('cap').textContent = slide === 1 ? COLS[col].name + ' · ' + COLS[col].where : SLIDES[slide];
}

// --- options ---
$('swatches').innerHTML = COLS.map((k, i) => `<span class="sw${i === col ? ' sel' : ''}" data-action="col" data-value="${i}"><span style="background-color: ${k.hex}"></span></span>`).join('');
$('sizes').innerHTML = SIZES.map((s, i) => `<span class="size" data-action="size" data-value="${i}"><span>${s}</span><span class="lo" hidden></span></span>`).join('');
function paintOptions() {
  const c = COLS[col], st = stock(), sel = SIZES[size], key = c.id + sel;
  $('colname').textContent = c.name; $('sizename').textContent = sel;
  [...$('swatches').children].forEach((s, i) => s.classList.toggle('sel', i === col));
  [...$('sizes').children].forEach((s, i) => {
    const left = STOCK[c.id][i];
    s.classList.toggle('sel', i === size); s.classList.toggle('out', left === 0);
    s.lastElementChild.hidden = !(left > 0 && left <= 3);
  });
  $('stock').innerHTML = st === 0 ? `<span class="t-red">●</span> ${sel} is sold out in ${c.name}${notify[key] ? ' · we’ll email you when it’s back' : ''}`
    : st <= 3 ? `<span class="t-orange">●</span> Only <b>${st}</b> left in ${c.name} · ${sel}`
    : '<span class="t-green">●</span> In stock · ships in 1–2 days';
  $('qminus').classList.toggle('dim', qty <= 1); $('qplus').classList.toggle('dim', qty >= maxQty());
  $('qn').textContent = qty;
  $('qnote').textContent = qty > 1 ? `${qty} × €${PRICE}` : 'Free returns · 60 days';
  const buy = $('buy');
  if (st === 0) {
    buy.dataset.action = 'notify'; buy.classList.remove('primary'); buy.classList.toggle('ok', !!notify[key]);
    buy.textContent = notify[key] ? '✓ We’ll email you' : '🔔 Notify me when it’s back';
  } else {
    buy.dataset.action = 'add'; buy.classList.add('primary'); buy.classList.remove('ok');
    buy.textContent = `Add to bag · €${Math.round(price.v)}`;
  }
  $('cap').textContent = slide === 1 ? c.name + ' · ' + c.where : SLIDES[slide];
}
function paintPrice() { $('price').textContent = `€${Math.round(price.v)}`; if ($('buy').dataset.action === 'add') $('buy').textContent = `Add to bag · €${Math.round(price.v)}`; }
function retarget() { tween(price, { v: PRICE * qty }, 450, ease.outCubic, paintPrice); pop($('price'), 'pop'); }
function clampQty() { const m = Math.max(1, maxQty()); if (qty > m) { qty = m; retarget(); } }

// --- bag ---
function paintSub() {
  $('subv').textContent = `€${sub.v.toFixed(2)}`;
  const need = FREE_SHIP - sub.v;
  $('need').innerHTML = need > 0.5 ? `Add <b>€${need.toFixed(0)}</b> more for free express shipping` : '✓ <b class="t-green">Free express shipping</b> unlocked';
}
function syncBag() {
  const total = count() * PRICE, ship = Math.min(1, total / FREE_SHIP);
  tween(sub, { v: total }, 600, ease.outCubic, paintSub);
  $('shipbar').style.width = (ship * 100).toFixed(1) + '%';
  $('shipbar').style.backgroundColor = ship >= 0.999 ? '#34c759' : '#ff9500';
}
function paintBag() {
  const n = count();
  $('bagn').textContent = n || '';
  $('placed').hidden = !(bagOpen && placed);
  $('bagp').hidden = !(bagOpen && !placed);
  if (placed) $('placedtxt').textContent = `${placed.items} item${placed.items > 1 ? 's' : ''} · €${placed.total.toFixed(2)} · free express delivery`;
  $('bagcount').textContent = `${n} item${n === 1 ? '' : 's'}`;
  $('baglines').innerHTML = bag.map(l => `<div class="bl"><span class="swd" style="background-color: ${COLS[l.col].hex}"></span><span class="grow">Rain Jacket <span class="muted">· ${COLS[l.col].name} · ${SIZES[l.size]}</span></span><span class="muted" style="margin-right: 10px">${l.qty} × €${PRICE}</span><b>€${l.qty * PRICE}</b><span class="rm" data-action="remove" data-value="${l.id}">✕</span></div>`).join('')
    || '<div class="small muted" style="padding: 8px 0">Your bag is empty</div>';
  $('checkout').hidden = !n;
  $('toastbag').hidden = bagOpen;
}

// --- toast (life.toast: 5 s linear bar, then the toast goes away) ---
function showToast(line) {
  const me = ++toastRun;
  toast = line;
  const t = $('toast'), bar = $('tbar');
  t.hidden = false;
  $('toasttxt').textContent = `${COLS[line.col].name} · ${SIZES[line.size]} · ${line.qty} × €${PRICE}`;
  bar.classList.remove('run'); void bar.offsetWidth; bar.classList.add('run');
  setTimeout(() => { if (me !== toastRun) return; bubble('fade'); toast = null; t.hidden = true; }, 5000);
}
function hideToast() { toastRun++; toast = null; $('toast').hidden = true; }
$('toastico').innerHTML = ico('checkmark.circle.fill', 18, '34c759');

// --- features (intro.rows: slide in, row i at 250 + 180 + i × 110 ms) ---
$('feats').innerHTML = FEATS.map(([icon, tintHex, text], i) => `<div class="fr"><div style="animation-delay: ${430 + i * 110}ms">${ico(icon, 13, tintHex)}${text}</div></div>`).join('');

paintTone(); paintSlide(); paintOptions(); paintBag(); paintSub();
setTimeout(() => tween(price, { v: PRICE * qty }, 700, ease.outCubic, paintPrice), 250);

root.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !root.contains(el)) return;
  const name = el.dataset.action, value = el.dataset.value, c = COLS[col];
  if (name === 'col') {
    const i = Number(value);
    if (i === col) return;
    const prev = c.photo;
    col = i;
    paintTone(); swapPhoto(prev, COLS[col].photo);
    clampQty(); paintOptions();
  } else if (name === 'size') {
    size = Number(value);
    clampQty(); paintOptions();
    pop($('sizes').children[size].firstElementChild, 'pop');
  } else if (name === 'qty') {
    const n = clamp(qty + Number(value), 1, Math.max(1, maxQty()));
    if (n === qty) return pop($('qn'), 'down', 'up');
    qty = n;
    pop($('qn'), 'up', 'down');
    retarget(); paintOptions();
  } else if (name === 'slide') {
    slide = value === 'next' ? (slide + 1) % SLIDES.length : value === 'prev' ? (slide + SLIDES.length - 1) % SLIDES.length : Number(value);
    paintSlide();
  } else if (name === 'add') {
    const left = stock();
    if (!left) return;
    const n = Math.min(qty, left);
    STOCK[c.id][size] -= n;
    const line = { id: nextId++, col, size, qty: n };
    bag.push(line);
    bubble('fade');
    placed = null;
    showToast(line);
    pop($('bagb'), 'up', 'down');
    clampQty(); syncBag(); paintOptions(); paintBag();
  } else if (name === 'undo' || name === 'remove') {
    const id = name === 'undo' ? (toast ? toast.id : -1) : Number(value);
    const line = bag.find(l => l.id === id);
    if (!line) return;
    bag = bag.filter(l => l !== line);
    STOCK[COLS[line.col].id][line.size] += line.qty;
    bubble('fade');
    if (toast && toast.id === id) hideToast();
    pop($('bagb'), 'down', 'up');
    syncBag(); paintOptions(); paintBag();
  } else if (name === 'notify') {
    const key = c.id + SIZES[size];
    notify[key] = !notify[key];
    paintOptions();
    pop($('buy'), 'pop');
  } else if (name === 'bag') {
    bubble('fade');
    bagOpen = !bagOpen;
    if (!bagOpen) placed = null;
    paintBag();
  } else if (name === 'checkout') {
    if (!bag.length) return;
    bubble('pop');
    placed = { items: count(), total: count() * PRICE };
    bag = []; hideToast();
    syncBag(); paintOptions(); paintBag();
  } else if (name === 'done') {
    bubble('fade');
    placed = null; bagOpen = false;
    paintBag();
  }
});
</script>
