<!--
  source: Telegram macOS 12.10 (283300), 09-code-review.chat, message 4
  author: leo 16:10 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md

<style>
  :root { color-scheme: light dark; --fg: light-dark(#000, #fff); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  [hidden] { display: none !important; }
  .grow { flex-grow: 1; }
  [data-action] { cursor: pointer; }

  .term { width: 420px; max-width: 100%; border-radius: 12px; background-color: #1e1e2e; color: #cdd6f4; overflow: hidden; }
  @media (prefers-color-scheme: dark) { .term { border: 1px solid #313244; } }
  .term .bar { display: flex; align-items: center; padding: 7px 10px; background-color: #313244; font-size: 11px; color: #a6adc8; }
  .term .dot { display: inline-block; width: 11px; height: 11px; border-radius: 6px; margin-right: 6px; }
  .term .prog { height: 2px; background-color: #313244; }
  .term .prog div { height: 2px; background-color: #a6e3a1; transition: width 260ms cubic-bezier(.33,1,.68,1); }
  .term .prog div.nt { transition: none; }
  .term .scr { padding: 10px 12px; font-family: ui-monospace, monospace; font-size: 10.5px; line-height: 1.5; }
  .term .scr div { white-space: pre-wrap; }
  .term .scr div.v { display: none; }
  .term.verbose .scr div.v { display: block; }
  .term .g { color: #a6e3a1; } .term .b { color: #89b4fa; } .term .m { color: #cba6f7; } .term .y { color: #f9e2af; }
  .term .w { color: #ffffff; font-weight: 700; } .term .dim { color: #6c7086; } .term .u { color: #89dceb; text-decoration: underline; }
  .term .cur { display: inline-block; width: 7px; height: 12px; vertical-align: middle; background-color: #cdd6f4; }
  .term .cur.blink { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { background-color: rgba(205,214,244,0); } }
  .term .foot { display: flex; align-items: center; padding: 6px 8px; border-top: 1px solid #313244; font-size: 11px; }
  .term .tb { display: inline-block; padding: 2px 8px; margin-right: 4px; border-radius: 6px; color: #cdd6f4; background-color: #313244; font-weight: 600; }
  .term .tb:hover { background-color: #45475a; }
  .term .tb.on { background-color: #89b4fa; color: #1e1e2e; }
  .term .tb.on:hover { background-color: #a6c8ff; }
  .term .st { color: #6c7086; }
  .tr-fade { animation: trFade 220ms ease-out; } .tr-slide-up { animation: trUp 220ms ease-out; }
  @keyframes trFade { from { opacity: 0; } }
  @keyframes trUp { from { opacity: 0; transform: translateY(8px); } }
</style>
<div class="term" id="root">
  <div class="bar"><span class="dot" style="background-color: #ff5f57"></span><span class="dot" style="background-color: #febc2e"></span><span class="dot" style="background-color: #28c840"></span><span class="grow" style="margin-left: 8px">zsh — litechat — 120×32</span><span id="state">idle</span></div>
  <div class="prog"><div id="pv" style="width: 0%"></div></div>
  <div class="scr" id="scr"><div id="cur"></div></div>
  <div class="foot"><span class="tb" data-action="rerun" id="rerun">↻ Rerun</span><span class="tb" data-action="skip" id="skip" hidden>⏭ Skip</span><span class="tb" data-action="clear" id="clear">⌘K Clear</span><span class="tb" data-action="verbose" id="verbose">Verbose</span><span class="tb" data-action="speed" id="speedBtn">1× speed</span><span class="grow"></span><span class="st" id="lines">0 lines</span></div>
</div>
<script>
const $ = id => document.getElementById(id);
const root = $('root'), scr = $('scr'), cur = $('cur'), pvEl = $('pv');
const esc = v => String(v === undefined || v === null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const ease = { linear: t => t, outQuad: t => t * (2 - t), outCubic: t => 1 - Math.pow(1 - t, 3) };
const animate = (duration, onFrame, easing = ease.outCubic) => new Promise(resolve => {
  const start = performance.now();
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / Math.max(1, duration));
    onFrame(easing(t), t);
    if (t < 1) requestAnimationFrame(step); else resolve();
  };
  step();
});
const sleep = ms => new Promise(r => setTimeout(r, ms));
const TR = ['fade', 'slide-up'];
function transition(kind) { for (const k of TR) root.classList.remove('tr-' + k); requestAnimationFrame(() => root.classList.add('tr-' + kind)); }

const P = '<span class="g">~/litechat</span> <span class="m">(feature/html-bubbles)</span> <span class="w">$</span> ';
const E = [];
const cmd = (text, make) => E.push({ cmd: text, make: !!make });
const out = (html, d, v, pct) => E.push({ html, d: d || 90, v: !!v, pct: pct || 0 });
const obj = (pct, kind, file, v) => out(`[${String(pct).padStart(3)}%] <span class="g">Building ${kind} object</span> ${file}`, 170, v, pct);
cmd('make dev', true);
out('<span class="dim">cmake -S . -B build -DCMAKE_BUILD_TYPE=Release</span>', 160);
out('-- The CXX compiler identification is AppleClang 17.0.0', 70, true);
out('-- Detecting CXX compile features - done', 70, true);
out('-- Configuring done (0.4s)', 110);
out('-- Generating done (0.1s)', 60, true);
out('-- Build files have been written to: build', 80);
obj(12, 'C', 'gumbo/parser.c.o');
obj(23, 'C', 'gumbo/tokenizer.c.o', true);
obj(35, 'CXX', 'litehtml/document.cpp.o', true);
obj(47, 'CXX', 'litehtml/render_flex.cpp.o');
obj(61, 'CXX', 'litehtml/render_table.cpp.o', true);
obj(74, 'CXX', 'litehtml/style.cpp.o', true);
obj(89, 'OBJCXX', 'lhmac/LHContainer.mm.o');
out('<span class="y">src/LHContainer.mm:418:21: warning: unused variable \'isSystemFamily\' [-Wunused-variable]</span>', 120);
out('<span class="dim">  418 |     bool isSystemFamily = false;</span>', 50, true);
out('[100%] <span class="b">Linking OBJCXX executable LiteChat.app/Contents/MacOS/LiteChat</span>', 380, false, 100);
out('[100%] Built target LiteChat', 120);
cmd('./build/lhrender tests/kitchen_sink.html out.png 460 --dark');
out('<span class="dim">fonts: SF Pro, SF Mono, Apple Color Emoji · images: 2 decoded</span>', 140, true);
out('render: 460x736 parse 2.84 ms, layout 0.06 ms -&gt; out.png', 260);
cmd('ls -lh build/LiteChat.app/Contents/MacOS');
out('total 4024', 90);
out('-rwxr-xr-x  1 alex  staff   <span class="g">1.9M</span> Oct  7 16:10 LiteChat', 60);
cmd('git push -u origin feature/html-bubbles');
out('Enumerating objects: 31, done.', 160);
out('Counting objects: 100% (31/31), done.', 70, true);
out('Delta compression using up to 10 threads', 60, true);
out('Compressing objects: 100% (17/17), done.', 90, true);
E.push({ live: p => `Writing objects: ${String(Math.round(p * 100)).padStart(3)}% (${Math.round(p * 19)}/19)${p >= 1 ? ', 14.21 KiB | 14.21 MiB/s, done.' : ''}`, ms: 700, d: 60 });
out('remote: Create a pull request for \'feature/html-bubbles\':', 220);
out('remote:   <span class="u">https://github.com/acme/litechat/pull/128</span>', 60);
out('To github.com:acme/litechat.git', 90, true);
out(' * [new branch]      feature/html-bubbles -&gt; feature/html-bubbles', 60, true);

let shown = 0, typed = 0, running = false, done = false, cleared = false, verbose = false, speed = 1, fast = false;
let run = 0, t0 = 0, t1 = 0, livep = 0, liveIdx = -1, blinkTimer = 0, secsTimer = 0, rendered = 0;

// ---- DOM sync: rows are appended as `shown` grows, the current line is rewritten in place ----
const CARET = '<span class="cur" id="caret"></span>';
function setProg(x, instant) {
  if (instant) pvEl.classList.add('nt');
  pvEl.style.width = (x * 100).toFixed(1) + '%';
  if (instant) requestAnimationFrame(() => pvEl.classList.remove('nt'));
}
function clearRows() { for (const d of [...scr.children]) if (d !== cur) d.remove(); rendered = 0; }
function syncRows() {
  if (cleared) return;
  for (; rendered < shown && rendered < E.length; rendered++) {
    const e = E[rendered], div = document.createElement('div');
    if (e.v) div.className = 'v';
    div.innerHTML = e.cmd ? P + esc(e.cmd) : e.live ? e.live(1) : e.html;
    cur.before(div);
  }
  let n = 0;
  if (!cleared) for (let i = 0; i < shown && i < E.length; i++) if (verbose || !E[i].v) n++;
  $('lines').textContent = `${n} lines`;
}
function syncCur() {
  if (running) {
    const c = E[shown];
    if (c && c.cmd) cur.innerHTML = P + esc(c.cmd.slice(0, typed)) + CARET;
    else if (c && c.live && liveIdx === shown) cur.innerHTML = c.live(livep);
    else cur.innerHTML = CARET;
  } else cur.innerHTML = P + CARET;
  const caret = $('caret');
  if (caret) caret.classList.toggle('blink', running || !!blinkTimer);
}
function syncState() {
  const now = performance.now();
  const secs = (((running ? now : t1) - t0) / 1000).toFixed(1);
  $('state').innerHTML = running ? `<span class="y">● running${fast ? '' : ' ' + secs + 's'}</span>`
    : done && !cleared ? `<span class="g">✓ exit 0</span>${fast ? '' : ' · ' + secs + 's'}` : 'idle';
  $('rerun').textContent = `↻ ${running ? 'Restart' : 'Rerun'}`;
  $('skip').hidden = !running; $('clear').hidden = running;
  $('verbose').textContent = `${verbose ? '✓ ' : ''}Verbose`;
  $('verbose').classList.toggle('on', verbose);
  $('speedBtn').textContent = `${speed}× speed`;
}
function syncAll() { syncRows(); syncCur(); syncState(); }

function reset(isFast) {
  shown = 0; typed = 0; running = true; done = false; cleared = false; fast = isFast; t0 = performance.now(); liveIdx = -1;
  clearRows(); setProg(0, true);
  if (blinkTimer) { clearTimeout(blinkTimer); blinkTimer = 0; }
  if (!secsTimer && !isFast) secsTimer = setInterval(syncState, 100);
  syncAll();
}
function finish() {
  running = false; done = true; t1 = performance.now(); shown = E.length; typed = 0; liveIdx = -1;
  if (secsTimer) { clearInterval(secsTimer); secsTimer = 0; }
  setProg(0);
  // the caret keeps blinking for 4 s after the run, then stays solid
  if (blinkTimer) clearTimeout(blinkTimer);
  blinkTimer = setTimeout(() => { blinkTimer = 0; syncCur(); }, 4000);
  syncAll();
}
async function typeCmd(i, perChar, ok) {
  const n = E[i].cmd.length;
  await animate(n * perChar / speed, (_, t) => { if (ok()) { typed = Math.round(t * n); syncCur(); } }, ease.linear);
}
async function intro() {
  const me = ++run, ok = () => me === run;
  reset(true);
  await typeCmd(0, 30, ok);
  if (!ok()) return;
  shown = 1; syncAll();
  await animate(560, p => { if (ok()) { shown = Math.max(shown, 1 + Math.floor(p * (E.length - 1))); syncAll(); } }, ease.outQuad);
  if (ok()) finish();
}
async function play() {
  const me = ++run, ok = () => me === run;
  const wait = async ms => { await sleep(Math.max(50, ms / speed)); return ok(); };
  reset(false);
  for (let i = 0; i < E.length; i++) {
    const e = E[i];
    if (e.cmd) {
      typed = 0; syncCur();
      if (!(await wait(420))) return;
      await typeCmd(i, 45, ok);
      if (!ok() || !(await wait(240))) return;
      setProg(0, true);
    } else if (e.live) {
      if (!(await wait(e.d))) return;
      liveIdx = i; livep = 0; syncCur();
      pvEl.classList.add('nt');
      await animate(e.ms / speed, p => { if (ok()) { livep = p; pvEl.style.width = (p * 100).toFixed(1) + '%'; syncCur(); } }, ease.outCubic);
      pvEl.classList.remove('nt');
      if (!ok()) return;
      liveIdx = -1;
    } else if (verbose || !e.v) {
      if (!(await wait(e.d))) return;
      if (e.pct) setProg(e.pct / 100);
    }
    shown = i + 1; syncAll();
  }
  finish();
}
setTimeout(intro, 250);

function handleAction(name) {
  if (name === 'rerun') { transition('fade'); play(); }
  else if (name === 'skip') { if (!running) return; run++; transition('slide-up'); finish(); }
  else if (name === 'clear') { if (running || cleared) return; transition('slide-up'); cleared = true; clearRows(); syncAll(); }
  else if (name === 'verbose') { transition('fade'); verbose = !verbose; root.classList.toggle('verbose', verbose); syncAll(); }
  else if (name === 'speed') { speed = speed >= 4 ? 1 : speed * 2; syncState(); }
}
root.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (t && root.contains(t)) handleAction(t.dataset.action);
});
syncAll();
</script>
