<!--
  source: Telegram macOS 12.10 (283300), 11-live-scripts.chat, message 10
  author: pixel 10:12 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  [hidden] { display: none !important; }
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --blue: #007aff; --blue-h: #0a6ee0; --green: #34c759; --red: #ff3b30; --orange: #ff9500; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .pad { padding: 12px 14px; }
  .muted { color: var(--muted); } .tiny { font-size: 11px; } .center { text-align: center; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  .t-green { color: var(--green); } .t-red { color: var(--red); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 700; background-color: rgba(127,127,127,0.18); }
  .badge.green { background-color: rgba(52,199,89,0.18); color: var(--green); } .badge.orange { background-color: rgba(255,149,0,0.18); color: var(--orange); }
  button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 5px 13px; border: 0; border-radius: 9px; background-color: rgba(127,127,127,0.16); color: var(--fg); text-align: center; cursor: pointer; }
  button:hover { background-color: rgba(127,127,127,0.28); }
  button.primary { background-color: var(--blue); color: #fff; } button.primary:hover { background-color: var(--blue-h); }
  button:active { background-color: rgba(127,127,127,0.40); } button.primary:active { background-color: var(--blue-h); }

  .sw { width: 100%; box-sizing: border-box; }
  .sw .ring { width: 128px; height: 128px; border-radius: 75px; margin: 12px auto 10px auto; padding: 11px; background-color: rgba(127,127,127,0.18); }
  .sw .face { width: 128px; height: 128px; border-radius: 64px; background-color: light-dark(#ffffff, #1c1c1e); text-align: center; }
  .sw .big { font-size: 28px; font-weight: 700; font-family: ui-monospace, monospace; padding-top: 30px; line-height: 32px; }
  .sw .cs { font-size: 15px; color: #8e8e93; font-family: ui-monospace, monospace; }
  .sw .now { font-size: 11px; font-family: ui-monospace, monospace; margin-top: 3px; }
  .sw .btns { display: flex; justify-content: center; gap: 8px; }
  .sw .btns button { flex: 1; min-width: 0; max-width: 104px; padding: 5px 10px; white-space: nowrap; }
  .sw .tabs { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .sw .tab { display: inline-block; padding: 2px 9px; margin-right: 3px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .sw .tab:hover { background-color: rgba(127,127,127,0.16); }
  .sw .tab.on { background-color: rgba(255,149,0,0.18); color: var(--orange); }
  .sw .laps { margin-top: 4px; font-family: ui-monospace, monospace; font-size: 12.5px; }
  .sw .l { display: flex; padding: 4px 4px; border-top: 1px solid rgba(127,127,127,0.18); }
  .sw .l.fresh { animation: sw-fresh 900ms cubic-bezier(.5,1,.89,1); }
  @keyframes sw-fresh { from { background-color: rgba(255,149,0,0.22); } to { background-color: rgba(255,149,0,0); } }
  .sw .l .a { width: 40%; } .sw .l .b { width: 30%; text-align: right; } .sw .l .c { width: 30%; text-align: right; }
  .sw .bars { margin-top: 6px; }
  .sw .br { display: flex; align-items: center; height: 18px; font-size: 11px; font-family: ui-monospace, monospace; }
  .sw .br .n { width: 30px; } .sw .br .v { width: 64px; text-align: right; }
  .sw .br .track { flex: 1; min-width: 0; height: 10px; }
  .sw .br .fill { height: 10px; border-radius: 3px; width: 2px; transition: width 400ms cubic-bezier(.33,1,.68,1); }

</style>
<div class="card pad sw" id="root">
  <div class="row between"><b>⏱ Stopwatch</b><span class="badge" id="badge">ready</span></div>
  <div class="ring" id="ring">
    <div class="face"><div class="big" id="big">00:00</div><div class="cs" id="cs">.00</div><div class="now muted" id="now" hidden></div></div>
  </div>
  <div class="btns">
    <button id="left">Reset</button>
    <button class="primary" id="right">Start</button>
  </div>
  <div class="tabs" id="tabs" hidden><span><span class="tab on" data-view="laps">Laps</span><span class="tab" data-view="chart">Chart</span></span>
    <span class="tiny muted" id="lapinfo"></span></div>
  <div id="list"></div>
</div>
<script>
let running = false, startedAt = 0, banked = 0, laps = [], view = 'laps', looping = false, unwind = null;
const sweep = { a: -1 };
const $ = id => document.getElementById(id);
const root = $('root'), badge = $('badge'), ring = $('ring'), big = $('big'), csEl = $('cs'), nowEl = $('now'), left = $('left'), right = $('right'), tabs = $('tabs'), lapinfo = $('lapinfo'), list = $('list');
const elapsed = () => banked + (running ? performance.now() - startedAt : 0);
const lapBase = () => laps.length ? laps[laps.length - 1].total : 0;
const fmt = ms => {
  const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60, cs = Math.floor(ms / 10) % 100;
  return [String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'), String(cs).padStart(2, '0')];
};
const full = ms => fmt(ms).join('.');
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const ease = { outCubic: t => 1 - Math.pow(1 - t, 3), inOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2 };
function animate(duration, onFrame, easing) {
  const start = performance.now();
  const step = () => { const t = Math.min(1, (performance.now() - start) / Math.max(1, duration)); onFrame(easing(t), t); if (t < 1) requestAnimationFrame(step); };
  step();
}
let panelAnimation = null;
function transition(kind, target = list) {
  if (panelAnimation) panelAnimation.cancel();
  const from = kind === 'slide-left' ? 'translateX(6px)' : kind === 'slide-right' ? 'translateX(-6px)' : kind === 'slide-up' ? 'translateY(4px)' : kind === 'pop' ? 'scale(0.985)' : 'none';
  if (from === 'none') return;
  panelAnimation = target.animate([{ transform: from }, { transform: 'none' }], { duration: 140, easing: 'cubic-bezier(.2,.8,.2,1)' });
}

function bestWorst() {
  let best = -1, worst = -1;
  if (laps.length > 1) laps.forEach((l, i) => { if (best < 0 || l.t < laps[best].t) best = i; if (worst < 0 || l.t > laps[worst].t) worst = i; });
  return [best, worst];
}

// The clock face: every frame while running, and once after each action.
function paintFace() {
  const ms = unwind ? unwind.from * unwind.k : elapsed();
  const deg = (ms % 60000) / 60000 * 360;
  const [main, cs] = fmt(ms);
  big.textContent = main; csEl.textContent = '.' + cs;
  if (sweep.a >= 0 && !ms) {
    const s = sweep.a * 360, a = (0.15 + 0.6 * (1 - sweep.a)).toFixed(3);
    ring.style.background = `conic-gradient(rgba(255,149,0,${a}) ${s.toFixed(1)}deg, rgba(127,127,127,0.18) ${s.toFixed(1)}deg)`;
  } else ring.style.background = deg < 0.5 ? 'rgba(127,127,127,0.18)' : `conic-gradient(#ff9500 ${deg.toFixed(1)}deg, rgba(127,127,127,0.18) ${deg.toFixed(1)}deg)`;
  if (laps.length) {
    const [best] = bestWorst();
    const cur = ms - lapBase();
    const delta = laps.length > 1 && running ? cur - laps[best].t : null;
    nowEl.className = 'now ' + (delta === null ? 'muted' : delta > 0 ? 't-red' : 't-green');
    nowEl.textContent = `L${laps.length + 1} ${full(cur)}`;
    nowEl.hidden = false;
  } else nowEl.hidden = true;
  const state = running ? 'running' : ms ? 'paused' : 'ready';
  badge.className = 'badge ' + (running ? 'green' : ms ? 'orange' : '');
  badge.textContent = state;
  right.textContent = running ? 'Stop' : ms ? 'Resume' : 'Start';
}

let lastList = "";
function paintLaps(fresh) {
  const [best, worst] = bestWorst();
  left.textContent = running ? 'Lap' : 'Reset';
  tabs.hidden = !laps.length;
  if (!laps.length) { lastList = ''; list.innerHTML = ''; return; }
  for (const t of tabs.querySelectorAll('.tab')) t.classList.toggle('on', t.dataset.view === view);
  lapinfo.textContent = `${laps.length} lap${laps.length > 1 ? 's' : ''}${best >= 0 ? ` · best ${full(laps[best].t)}` : ''}`;
  const renderKey = view + '|' + laps.map(l => l.t + ':' + l.total).join(',');
  if (lastList === renderKey && !fresh) return;
  lastList = renderKey;
  if (view === 'laps') {
    const rows = laps.slice().reverse().slice(0, 5).map((l, k) => {
      const n = laps.length - k, i = n - 1;
      const tone = i === best ? 't-green' : i === worst ? 't-red' : '';
      const tag = i === best ? ' ▲' : i === worst ? ' ▼' : '';
      return `<div class="l${k === 0 && fresh ? ' fresh' : ''}"><span class="a ${tone}">Lap ${n}${tag}</span><span class="b ${tone}">${full(l.t)}</span><span class="c muted">${full(l.total)}</span></div>`;
    }).join('');
    const more = laps.length > 5 ? `<div class="tiny muted center" style="margin-top: 3px">+${laps.length - 5} earlier laps</div>` : '';
    list.innerHTML = `<div class="laps">${rows}</div>${more}`;
  } else {
    const shown = laps.slice(-8), max = Math.max(...shown.map(l => l.t));
    const offset = laps.length - shown.length;
    list.innerHTML = `<div class="bars">${shown.map((l, k) => {
      const i = offset + k, c = i === best ? '#34c759' : i === worst ? '#ff3b30' : '#ff9500';
      return `<div class="br"><span class="n muted">L${i + 1}</span><div class="track"><div class="fill" style="width: ${Math.max(2, 100 * l.t / max).toFixed(1)}%; background-color: ${c}"></div></div><span class="v">${full(l.t)}</span></div>`;
    }).join('')}</div>`;
    // Bars grow from 2px to their width, staggered (grow.k tween in the original).
  }
}

function frame() { paintFace(); if (running) requestAnimationFrame(frame); else looping = false; }

function handleAction(name, value) {
  if (name === 'toggle') {
    if (running) { banked = elapsed(); running = false; paintFace(); paintLaps(); return; }
    unwind = null;
    startedAt = performance.now(); running = true;
    if (!looping) { looping = true; requestAnimationFrame(frame); }
    paintFace(); paintLaps();
  } else if (name === 'lap' && running) {
    const total = elapsed();
    laps.push({ t: total - lapBase(), total });
    paintLaps(true);
  } else if (name === 'reset' && !running) {
    if (laps.length) transition('fade');
    const u = unwind = { from: banked, k: 1 };
    animate(550, (p, raw) => { if (unwind === u) { u.k = 1 - p; if (raw >= 1) unwind = null; paintFace(); } }, ease.outCubic);
    banked = 0; laps = []; view = 'laps';
    paintFace(); paintLaps();
  } else if (name === 'view' && value !== view) {
    view = value;
    paintLaps();
  }
}
left.addEventListener('click', () => handleAction(running ? 'lap' : 'reset'));
right.addEventListener('click', () => handleAction('toggle'));
tabs.addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) handleAction('view', t.dataset.view); });

paintFace();
setTimeout(() => { if (!running && !banked) animate(800, (p, raw) => { sweep.a = raw >= 1 ? -1 : p; paintFace(); }, ease.inOutCubic); }, 250);
</script>
