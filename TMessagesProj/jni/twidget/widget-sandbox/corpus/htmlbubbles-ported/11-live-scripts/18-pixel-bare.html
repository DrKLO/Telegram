<!--
  source: Telegram macOS 12.10 (283300), 11-live-scripts.chat, message 18
  author: pixel 10:21 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
  The original probed the LiteChat globals; this port probes the same names and shows
  what twidget's sandbox really answers (checked at runtime, nothing is hard-coded).
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --green: #34c759; --red: #ff3b30; --orange: #ff9500; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .pad { padding: 12px 14px; }
  .muted { color: var(--muted); } .tiny { font-size: 11px; }
  .caps { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .t-green { color: var(--green); } .t-red { color: var(--red); } .t-orange { color: var(--orange); }
  .seen { width: 380px; max-width: 100%; }
  .seen .g { display: flex; flex-wrap: wrap; }
  .seen .g span { width: 50%; font-size: 12px; font-family: ui-monospace, monospace; padding: 1px 0; white-space: nowrap; }
  .seen .g span i { font-style: normal; font-size: 10px; color: var(--muted); }
  .seen #io span { width: 100%; } /* the verdicts are too long for a half-width monospace column */
</style>
<div class="card pad seen">
  <b>🔍 What can a script see?</b>
  <div class="caps" style="margin: 8px 0 3px 0">I/O: present as a name, but every call is refused</div>
  <div class="g" id="io"></div>
  <div class="caps" style="margin: 8px 0 3px 0">Not there</div>
  <div class="g" id="absent"></div>
  <div class="caps" style="margin: 8px 0 3px 0">Provided by the sandbox</div>
  <div class="g" id="present"></div>
  <div class="caps" style="margin: 8px 0 3px 0">LiteChat-only helpers (not in twidget)</div>
  <div class="g" id="helpers"></div>
  <div class="tiny muted" style="margin-top: 6px">Plus the standard built-ins: Math, Date, JSON, Map, Promise, Intl… ● = defined, ○ = undefined; green = the sandbox's intended answer.</div>
</div>
<script>
// The same names the original probed, grouped by what twidget actually does with them.
const IO = ['fetch', 'XMLHttpRequest', 'WebSocket'];                   // defined, throw NetworkDisabledError
const ABSENT = ['require', 'process', 'WebAssembly'];                  // undefined
const PRESENT = ['document', 'window', 'localStorage', 'navigator',   // a real (in-memory) DOM, no I/O behind it
  'setTimeout', 'setInterval', 'requestAnimationFrame', 'performance', 'console'];
const HELPERS = ['animate', 'tween', 'transition', 'ease', 'sleep', 'lerp', 'clamp', 'mix', 'alpha', 'esc', 'update'];
const check = name => { try { return typeof globalThis[name] !== 'undefined'; } catch (e) { return false; } };
const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function rows(id, names, want, note) {
  document.getElementById(id).innerHTML = names.map(n => {
    const has = check(n);
    return `<span class="${has === want ? 't-green' : 't-red'}" data-name="${esc(n)}">${has ? '●' : '○'} ${esc(n)} <i>${esc(note ? note(n, has) : '')}</i></span>`;
  }).join('');
}
rows('absent', ABSENT, false);
rows('present', PRESENT, true, n => n === 'localStorage' ? 'per message' : n === 'navigator' ? 'no network' : '');
rows('helpers', HELPERS, false, () => 'not needed');

// For the I/O names, actually try: a name that exists is only fine if the call is refused.
const ioEl = document.getElementById('io');
const verdict = {};
function paintIO() {
  ioEl.innerHTML = IO.map(n => {
    const v = verdict[n];
    const cls = v === undefined ? 't-orange' : v.ok ? 't-green' : 't-red';
    return `<span class="${cls}">${check(n) ? '●' : '○'} ${esc(n)} <i>${esc(v ? v.text : 'checking…')}</i></span>`;
  }).join('');
}
function refused(e) { return e && e.name === 'NetworkDisabledError'; }
try { new XMLHttpRequest(); verdict.XMLHttpRequest = { ok: false, text: 'constructed!' }; }
catch (e) { verdict.XMLHttpRequest = { ok: refused(e), text: refused(e) ? 'throws NetworkDisabledError' : 'throws ' + e.name }; }
try { new WebSocket('wss://example.invalid'); verdict.WebSocket = { ok: false, text: 'constructed!' }; }
catch (e) { verdict.WebSocket = { ok: refused(e), text: refused(e) ? 'throws NetworkDisabledError' : 'throws ' + e.name }; }
paintIO();
if (typeof fetch === 'function') {
  fetch('https://example.invalid/').then(() => { verdict.fetch = { ok: false, text: 'resolved!' }; paintIO(); },
    e => { verdict.fetch = { ok: refused(e), text: refused(e) ? 'rejects with NetworkDisabledError' : 'rejects with ' + e.name }; paintIO(); });
} else { verdict.fetch = { ok: true, text: 'undefined' }; paintIO(); }
console.log('probe', [...IO, ...ABSENT, ...PRESENT, ...HELPERS].map(n => n + '=' + (check(n) ? '1' : '0')).join(' '));
</script>
