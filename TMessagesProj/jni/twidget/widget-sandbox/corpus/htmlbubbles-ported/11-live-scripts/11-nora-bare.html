<!--
  source: Telegram macOS 12.10 (283300), 11-live-scripts.chat, message 11
  author: nora 10:14 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --blue: #007aff; --blue-h: #0a6ee0; --orange: #ff9500; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  a { color: var(--blue); text-decoration: none; }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .pad { padding: 12px 14px; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 700; background-color: rgba(127,127,127,0.18); }
  .badge.orange { background-color: rgba(255,149,0,0.18); color: var(--orange); }
  button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 5px 13px; border: 0; border-radius: 9px; background-color: rgba(127,127,127,0.16); color: var(--fg); text-align: center; cursor: pointer; }
  button:hover { background-color: rgba(127,127,127,0.28); }
  button.primary { background-color: var(--blue); color: #fff; } button.primary:hover { background-color: var(--blue-h); }
  button:active { background-color: rgba(127,127,127,0.40); } button.primary:active { background-color: var(--blue-h); }

  .dice { width: 340px; max-width: 100%; }
  .dice .tray { height: 132px; text-align: center; margin: 8px 0 6px 0; border-radius: 14px; background: radial-gradient(ellipse at 50% 35%, #2f8a57 0%, #1d5a39 100%); }
  .dice .d { display: inline-block; vertical-align: top; margin: 0 3px; border-radius: 10px; transition: transform 260ms cubic-bezier(.34,1.56,.64,1); }
  .dice .d[hidden] { display: none; }
  .dice .d.held { transform: translateY(-8px); }
  .dice .d.can { cursor: pointer; }
  .dice .d.can:hover { background-color: rgba(255,255,255,0.14); }
  .dice .d svg { display: block; }
  .dice .tag { height: 12px; line-height: 12px; font-size: 9px; font-weight: 800; color: #ffd60a; }
  .dice .sum { display: flex; justify-content: space-between; align-items: center; height: 34px; border-radius: 8px; transition: background-color 1400ms cubic-bezier(.11,0,.5,0); }
  .dice .sum.hot { background-color: rgba(255,214,10,0.25); transition: none; }
  .dice .total { font-weight: 800; font-size: 20px; display: inline-block; transform-origin: 50% 50%; }
  .dice .total.pop { animation: dice-pop 520ms cubic-bezier(.34,1.56,.64,1); }
  @keyframes dice-pop { from { transform: scale(1.5); } to { transform: none; } }
  .dice .step { display: flex; align-items: center; }
  .dice .step button { width: 28px; padding: 3px 0; }
  .dice .step b { width: 30px; text-align: center; }
  .dice .lnk { font-size: 12px; }
  .dice .lnk:hover { text-decoration: underline; }
  .dice .hist { margin-top: 6px; }
  .dice .hist span { display: inline-block; width: 26px; line-height: 22px; margin: 2px; border-radius: 6px; text-align: center; font-size: 12px; font-weight: 700; background-color: rgba(127,127,127,0.14); }
  .dice .hist span.hi { background-color: rgba(52,199,89,0.22); }

</style>
<div class="card pad dice" id="root">
  <div class="row between"><b>🎲 Dice</b>
    <span class="step"><span class="small muted">Dice&nbsp;</span><button id="less">−</button><b id="count">2</b><button id="more">+</button></span></div>
  <div class="tray" id="tray"></div>
  <div class="sum" id="sum">
    <span><span id="totalWrap">Total <span class="total" id="total">0</span></span><span class="muted" id="rolling" hidden>Rolling…</span>
      <span class="badge orange" id="label" hidden></span></span>
    <span><a class="lnk" href="#" id="release" hidden>Release all</a><span id="relSpace" hidden>&nbsp; </span><button class="primary" id="roll">Roll</button></span>
  </div>
  <div class="tiny muted" id="tip">Roll, then tap dice to hold them</div>
  <div class="hist" id="hist" hidden></div>
  <div class="row between tiny muted" id="histFoot" hidden><span id="histInfo"></span><a class="lnk" href="#" id="clear">Clear</a></div>
</div>
<script>
const PIPS = {
  1: [[50, 50]], 2: [[30, 30], [70, 70]], 3: [[30, 30], [50, 50], [70, 70]],
  4: [[30, 30], [70, 30], [30, 70], [70, 70]], 5: [[30, 30], [70, 30], [50, 50], [30, 70], [70, 70]],
  6: [[30, 28], [70, 28], [30, 50], [70, 50], [30, 72], [70, 72]],
};
const PIP = ['#ff2d55', '#5e5ce6', '#34c759', '#ff9500', '#00c7be'], SIZE = [84, 84, 76, 64, 54];
const d6 = () => 1 + Math.floor(Math.random() * 6);
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const ease = {
  linear: t => t, outCubic: t => 1 - Math.pow(1 - t, 3),
  outBounce: t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375; return n * (t -= 2.625 / d) * t + 0.984375; },
};
function animate(duration, onFrame, easing = ease.outCubic) {
  return new Promise(resolve => {
    const start = performance.now();
    const step = () => { const t = Math.min(1, (performance.now() - start) / Math.max(1, duration)); onFrame(easing(t), t); if (t < 1) requestAnimationFrame(step); else resolve(); };
    step();
  });
}
let totalToken = null;
function tweenTotal(to, ms) {
  const token = totalToken = {}, from = total.v;
  animate(ms, p => { if (totalToken === token) { total.v = from + (to - from) * p; totalEl.textContent = String(Math.round(total.v)); } }, ease.outCubic);
}
const $ = id => document.getElementById(id);
const root = $('root'), tray = $('tray'), totalEl = $('total'), totalWrap = $('totalWrap'), rollingEl = $('rolling'), labelEl = $('label'), release = $('release'), relSpace = $('relSpace'), rollBtn = $('roll'), tip = $('tip'), hist = $('hist'), histFoot = $('histFoot'), histInfo = $('histInfo'), countEl = $('count'), sumEl = $('sum');
let panelAnimation = null;
function transition(kind, target = tray) {
  if (panelAnimation) panelAnimation.cancel();
  const from = kind === 'slide-left' ? 'translateX(6px)' : kind === 'slide-right' ? 'translateX(-6px)' : kind === 'slide-up' ? 'translateY(4px)' : kind === 'pop' ? 'scale(0.985)' : 'none';
  if (from === 'none') return;
  panelAnimation = target.animate([{ transform: from }, { transform: 'none' }], { duration: 140, easing: 'cubic-bezier(.2,.8,.2,1)' });
}
function replay(el, cls) { el.classList.remove(cls); requestAnimationFrame(() => el.classList.add(cls)); }

let n = 2, faces = [3, 5, 1, 6, 2], spin = [0, 0, 0, 0, 0], drop = [1, 1, 1, 1, 1], held = [false, false, false, false, false];
let rolling = false, rolled = false, history = [], label = '';
const total = { v: 0 };
const sum = () => faces.slice(0, n).reduce((s, f) => s + f, 0);

// Five dice as inline SVG, built once; the roll only touches the transform, the pips and the margins.
const dice = [0, 1, 2, 3, 4].map(i => {
  const el = document.createElement('span');
  el.className = 'd'; el.dataset.i = String(i);
  el.innerHTML = `<svg width="84" height="84" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
     <g class="rot"><rect x="14" y="14" width="72" height="72" rx="15" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/><g class="pips"></g></g></svg><div class="tag">&nbsp;</div>`;
  tray.appendChild(el);
  return { el, svg: el.querySelector('svg'), rot: el.querySelector('.rot'), rect: el.querySelector('rect'), pips: el.querySelector('.pips'), tag: el.querySelector('.tag'), face: 0 };
});
function paintDie(i) {
  const d = dice[i], size = SIZE[n - 1], room = 132 - size - 18;
  if (d.face !== faces[i]) { d.face = faces[i]; d.pips.innerHTML = PIPS[faces[i]].map(([x, y]) => `<circle cx='${x}' cy='${y}' r='7.5' fill='${PIP[i]}'/>`).join(''); }
  d.rot.setAttribute('transform', `rotate(${spin[i].toFixed(1)} 50 50)`);
  d.svg.setAttribute('width', size); d.svg.setAttribute('height', size);
  d.el.style.marginTop = Math.round(4 + room * (1 - drop[i])) + 'px';
}
function paintTray() {
  for (let i = 0; i < 5; i++) {
    const d = dice[i];
    d.el.hidden = i >= n;
    if (i >= n) continue;
    paintDie(i);
    d.el.classList.toggle('can', rolled && !rolling);
    d.el.classList.toggle('held', held[i]);
    d.rect.setAttribute('stroke', held[i] ? '#ffd60a' : '#c7c7cc'); d.rect.setAttribute('stroke-width', held[i] ? 6 : 2);
    d.tag.innerHTML = held[i] ? 'HELD' : '&nbsp;';
  }
}
function paintRest() {
  countEl.textContent = String(n);
  const all = held.slice(0, n).every(Boolean), anyHeld = held.slice(0, n).some(Boolean);
  totalWrap.hidden = rolling; rollingEl.hidden = !rolling;
  labelEl.hidden = !(label && !rolling); labelEl.textContent = label;
  release.hidden = relSpace.hidden = !(anyHeld && !rolling);
  rollBtn.textContent = rolling ? '…' : all ? 'All held' : 'Roll';
  tip.textContent = rolled ? 'Tap a die to hold it between rolls' : 'Roll, then tap dice to hold them';
  hist.hidden = histFoot.hidden = !history.length;
  if (history.length) {
    hist.innerHTML = history.map(h => `<span class="${h.special ? 'hi' : ''}">${h.s}</span>`).join('');
    const avg = (history.reduce((s, h) => s + h.s, 0) / history.length).toFixed(1);
    histInfo.textContent = `${history.length} rolls · avg ${avg}`;
  }
}

function settle(i, ms, delay = 0) {
  return animate(ms, (_, raw) => { drop[i] = 1 - ease.outBounce(clamp(raw * (1 + delay), 0, 1)); paintDie(i); }, ease.linear);
}
setTimeout(() => {
  for (let i = 0; i < n; i++) settle(i, 900, i * 0.15);
  tweenTotal(sum(), 700);
}, 250);

function judge(f) {
  if (f.length < 2) return '';
  const s = f.slice().sort();
  if (s.every(v => v === s[0])) return ['', '', 'Doubles!', 'Triple!', 'Four of a kind!', 'Yahtzee! 🎉'][f.length];
  if (f.length === 5 && s.every((v, i) => i === 0 || v === s[i - 1] + 1)) return 'Straight! 🔥';
  return '';
}

function roll() {
  const idx = [...Array(n).keys()].filter(i => !held[i]);
  if (rolling || !idx.length) return;
  rolling = true; label = '';
  paintTray(); paintRest();
  const final = faces.slice();
  idx.forEach(i => { final[i] = d6(); });
  const turns = idx.map((_, k) => (k % 2 ? -1 : 1) * (360 + Math.random() * 360));
  animate(1100, (p, raw) => {
    idx.forEach((i, k) => {
      spin[i] = turns[k] * (1 - p);
      drop[i] = 1 - ease.outBounce(clamp(raw * (1 + 0.07 * k), 0, 1));
      faces[i] = raw >= 0.8 ? final[i] : Math.random() < 0.5 ? d6() : faces[i];
      paintDie(i);
    });
    if (raw >= 1) land(final);
  }, ease.outCubic);
}

function land(final) {
  faces = final; rolling = false; rolled = true;
  transition('pop', sumEl);
  const s = sum();
  label = judge(faces.slice(0, n));
  history = [{ s, n, special: !!label }, ...history].slice(0, 12);
  total.v = 0;
  tweenTotal(s, 450);
  replay(totalEl, 'pop');
  if (label) { sumEl.classList.add('hot'); requestAnimationFrame(() => requestAnimationFrame(() => sumEl.classList.remove('hot'))); }
  paintTray(); paintRest();
}

function handleAction(name, value) {
  if (name === 'roll') return roll();
  if (rolling) return;
  if (name === 'hold' && rolled) {
    const i = Number(value);
    held[i] = !held[i];
  } else if (name === 'release') {
    held = held.map(() => false);
  } else if (name === 'dice') {
    const next = clamp(n + Number(value), 1, 5);
    if (next === n) return;
    if (next < n) { transition('fade'); held[n - 1] = false; }
    else { faces[next - 1] = d6(); spin[next - 1] = 0; n = next; settle(next - 1, 800); }
    n = next; label = '';
    tweenTotal(sum(), 400);
  } else if (name === 'clear') {
    transition('slide-up', hist);
    history = [];
  }
  paintTray(); paintRest();
}
rollBtn.addEventListener('click', () => handleAction('roll'));
release.addEventListener('click', e => { e.preventDefault(); handleAction('release'); });
$('clear').addEventListener('click', e => { e.preventDefault(); handleAction('clear'); });
$('less').addEventListener('click', () => handleAction('dice', -1));
$('more').addEventListener('click', () => handleAction('dice', 1));
tray.addEventListener('click', e => { const d = e.target.closest('.d'); if (d && rolled && !rolling) handleAction('hold', d.dataset.i); });

paintTray(); paintRest();
</script>
