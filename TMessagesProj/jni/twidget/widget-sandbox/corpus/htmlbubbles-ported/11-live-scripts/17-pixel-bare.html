<!--
  source: Telegram macOS 12.10 (283300), 11-live-scripts.chat, message 17
  author: pixel 10:20 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
  "Throw" really throws an uncaught ReferenceError from the click listener; twidget logs it
  and dispatches a window "error" event, which this card uses to show the message underneath
  (LiteChat drew that line itself).
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --blue: #007aff; --blue-h: #0a6ee0; --orange: #ff9500; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  p { margin: 0 0 8px 0; }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .pad { padding: 12px 14px; }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 5px 13px; border: 0; border-radius: 9px; background-color: rgba(127,127,127,0.16); color: var(--fg); text-align: center; cursor: pointer; }
  button:hover { background-color: rgba(127,127,127,0.28); }
  button.primary { background-color: var(--blue); color: #fff; } button.primary:hover { background-color: var(--blue-h); }
  button:active { background-color: rgba(127,127,127,0.40); } button.primary:active { background-color: var(--blue-h); }
  .lc-script-error { margin-top: 6px; padding: 3px 8px; border-radius: 7px; font-size: 11.5px; line-height: 1.3; background-color: rgba(255,149,0,0.16); color: var(--orange); }
  .wrap { width: 330px; max-width: 100%; }
</style>
<div class="wrap">
  <div class="card pad">
    <div class="row between"><b>🐛 Buggy button</b><span class="small muted"><span id="ok">0</span> good clicks</span></div>
    <p class="small muted" style="margin: 6px 0 8px 0">An exception isn't fatal. The error shows under the card until a later action succeeds.</p>
    <button id="bug">Throw</button> <button class="primary" id="works">Works</button>
  </div>
  <div class="lc-script-error" id="err" hidden></div>
</div>
<script>
let ok = 0;
const okEl = document.getElementById('ok'), errEl = document.getElementById('err');
function handleAction(name) {
  if (name === 'bug') frobnicate(42); // ReferenceError, uncaught on purpose
  ok++;
  okEl.textContent = String(ok);
  errEl.hidden = true;
}
document.getElementById('bug').addEventListener('click', () => handleAction('bug'));
document.getElementById('works').addEventListener('click', () => handleAction('ok'));
window.addEventListener('error', e => {
  errEl.textContent = (e.error && e.error.name ? e.error.name + ': ' : '') + (e.message || 'Script error');
  errEl.hidden = false;
});
</script>
