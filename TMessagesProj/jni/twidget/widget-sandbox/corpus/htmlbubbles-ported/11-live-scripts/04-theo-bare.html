<!--
  source: Telegram macOS 12.10 (283300), 11-live-scripts.chat, message 4
  author: theo 10:03 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>[hidden]{display:none!important}
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --blue: #007aff; --blue-h: #0a6ee0; --red: #ff3b30; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  a { color: var(--blue); text-decoration: none; }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .pad { padding: 12px 14px; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 700; background-color: rgba(127,127,127,0.18); }
  .badge.red { background-color: rgba(255,59,48,0.16); color: var(--red); }
  .av { display: inline-block; width: 24px; height: 24px; border-radius: 12px; text-align: center; line-height: 24px; color: #ffffff; font-size: 10px; font-weight: 700; background-color: #8e8e93; }
  button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 5px 13px; border: 0; border-radius: 9px; background-color: rgba(127,127,127,0.16); color: var(--fg); text-align: center; cursor: pointer; }
  button:hover { background-color: rgba(127,127,127,0.28); }
  button.primary { background-color: var(--blue); color: #fff; } button.primary:hover { background-color: var(--blue-h); }
  button:active { background-color: rgba(127,127,127,0.40); } button.primary:active { background-color: var(--blue-h); }

  .poll { width: 380px; max-width: 100%; }
  .poll .bar2 { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .poll .tab { display: inline-block; padding: 2px 10px; margin-right: 4px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .poll .tab:hover { background-color: rgba(127,127,127,0.14); }
  .poll .tab.on { background-color: rgba(0,122,255,0.16); color: var(--blue); }
  .poll .lnk { font-size: 12px; }
  .poll .lnk:hover { text-decoration: underline; }
  .poll .list { position: relative; margin-top: 8px; }
  .poll .opt { position: absolute; left: 0; width: 328px; height: 36px; line-height: 36px; padding: 0 12px; display: flex; align-items: center; border-radius: 10px; font-size: 14px;
               transition: top 650ms cubic-bezier(.33,1,.68,1); }
  .poll .opt.mine { border: 2px solid var(--blue); padding: 0 10px; height: 32px; line-height: 32px; }
  .poll .opt.open { cursor: pointer; }
  .poll .lbl { flex-grow: 1; font-weight: 600; }
  .poll .open:hover .lbl { color: var(--blue); }
  .poll .pc { width: 44px; text-align: right; font-weight: 700; }
  .poll .plus { width: 26px; font-size: 12px; font-weight: 800; }
  .poll .who { padding: 7px 0; border-top: 1px solid rgba(127,127,127,0.16); }
  .poll .who:first-child { border-top: 0; }
  .poll .who .av { margin: 4px 4px 0 0; }
  .poll .win { margin-top: 8px; padding: 9px 12px; border-radius: 10px; background-color: rgba(52,199,89,0.16); }
  .poll .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .poll .ticker { font-size: 11.5px; margin-top: 2px; color: #8e8e93; transition: color 1800ms cubic-bezier(.11,0,.5,0); }
  .poll .ticker.hot { color: var(--blue); transition: none; }

</style>
<div class="card pad poll" id="root">
  <div class="row between"><b>📍 Offsite location</b>
    <span><span class="small muted"><span id="total">0</span> votes</span> <span class="badge red" id="live">● live</span></span></div>
  <div class="ticker" id="ticker">Votes are coming in…</div>
  <div class="bar2"><span id="tabs"><span class="tab on" data-tab="results">Results</span><span class="tab" data-tab="voters">Voters</span></span><a class="lnk" href="#" id="sort">⇅ Top first</a></div>
  <div class="list" id="list" style="height: 162px"></div>
  <div class="win" id="win" hidden><b id="winT"></b><div class="small muted" id="winS"></div></div>
  <div id="voters" style="margin-top: 6px" hidden></div>
  <div class="foot"><span class="tiny muted" id="hintText">Tap an option to vote</span>
    <span><a class="lnk" href="#" id="reset">↻ Reset</a>&nbsp; <button class="primary" id="close">Close poll</button></span></div>
</div>
<script>
const SEED = [
  { id: 'lis', label: '🇵🇹 Lisbon', voters: ['Nora', 'Gus', 'Ivo', 'Pia'] },
  { id: 'kyo', label: '🇯🇵 Kyoto', voters: ['Theo', 'Hana', 'Jun', 'Kai', 'Lea', 'Omar'] },
  { id: 'mex', label: '🇲🇽 Mexico City', voters: ['Rui', 'Sam', 'Uma'] },
  { id: 'rey', label: '🇮🇸 Reykjavík', voters: ['Vik', 'Wren'] },
];
const INCOMING = [['Ana', 'lis'], ['Ben', 'mex'], ['Chloé', 'lis'], ['Dev', 'rey'], ['Emil', 'lis']];
const COLORS = ['#ff2d55', '#ff9500', '#34c759', '#00c7be', '#5e5ce6', '#af52de', '#a2845e'];
const ROW = 42;
let options, mine = null, closed = false, tab = 'results', sortTop = true, queue = [], timer = 0;
const total = { v: 0 };
const esc = v => String(v === undefined || v === null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const $ = id => document.getElementById(id);
const root = $('root'), list = $('list'), totalEl = $('total'), live = $('live'), ticker = $('ticker'), sortEl = $('sort'), win = $('win'), votersEl = $('voters'), hintText = $('hintText'), closeBtn = $('close');

// Numeric tweens for the things CSS can't transition (gradient stops, the vote counter, the +1 flash).
const ease = { outCubic: t => 1 - Math.pow(1 - t, 3), outQuad: t => t * (2 - t) };
const active = new Map(); // target -> Map(key -> token), so a newer tween takes a key over
let frameOn = false;
const tweens = [];
function tween(target, props, duration, easing) {
  let owners = active.get(target);
  if (!owners) { owners = new Map(); active.set(target, owners); }
  const token = {}, from = {}, to = {};
  for (const key of Object.keys(props)) { from[key] = Number(target[key]) || 0; to[key] = Number(props[key]); owners.set(key, token); }
  tweens.push({ target, owners, token, from, to, start: performance.now(), duration, easing });
  if (!frameOn) { frameOn = true; requestAnimationFrame(frame); }
}
function frame() {
  const now = performance.now();
  for (let k = tweens.length - 1; k >= 0; k--) {
    const tw = tweens[k], t = Math.min(1, (now - tw.start) / Math.max(1, tw.duration)), p = tw.easing(t);
    for (const key in tw.to) if (tw.owners.get(key) === tw.token) { tw.target[key] = tw.from[key] + (tw.to[key] - tw.from[key]) * p; if (t >= 1) tw.owners.delete(key); }
    if (t >= 1) tweens.splice(k, 1);
  }
  paintLive();
  if (tweens.length) requestAnimationFrame(frame); else frameOn = false;
}
let panelAnimation = null;
function transition(kind, target = list) {
  if (panelAnimation) panelAnimation.cancel();
  const from = kind === 'slide-left' ? 'translateX(6px)' : kind === 'slide-right' ? 'translateX(-6px)' : kind === 'slide-up' ? 'translateY(4px)' : kind === 'pop' ? 'scale(0.985)' : 'none';
  if (from === 'none') return;
  panelAnimation = target.animate([{ transform: from }, { transform: 'none' }], { duration: 140, easing: 'cubic-bezier(.2,.8,.2,1)' });
}

const count = () => options.reduce((s, o) => s + o.voters.length, 0);
const byId = id => options.find(o => o.id === id);
const order = () => sortTop ? options.slice().sort((a, b) => b.voters.length - a.voters.length || a.idx - b.idx) : options;
function seed() {
  const old = options;
  options = SEED.map((o, idx) => ({ ...o, idx, voters: o.voters.slice(), fx: old ? old[idx].fx : { share: 0, y: 0, flash: 0 } }));
  if (!old) order().forEach((o, rank) => { o.fx.y = rank * ROW; });
}
seed();

// One persistent row per option; only its position, fill and numbers change.
list.innerHTML = options.map(o => `<div class="opt" data-id="${o.id}" style="top: ${o.fx.y}px">
  <span class="lbl"></span><span class="plus"></span><span class="small muted cnt"></span><span class="pc"></span></div>`).join('');
const rowEl = {};
for (const el of list.querySelectorAll('.opt')) rowEl[el.dataset.id] = { el, lbl: el.querySelector('.lbl'), plus: el.querySelector('.plus'), cnt: el.querySelector('.cnt'), pc: el.querySelector('.pc') };

function relayout(ms = 650) {
  const sum = count();
  order().forEach((o, rank) => {
    o.fx.y = rank * ROW;
    rowEl[o.id].el.style.transitionDuration = ms + 'ms';
    rowEl[o.id].el.style.top = o.fx.y + 'px';
    tween(o.fx, { share: o.voters.length / sum }, ms, ease.outCubic);
  });
  tween(total, { v: sum }, 450, ease.outCubic);
  paintRows();
}

function arrive() {
  timer = 0;
  if (closed || !queue.length) return;
  const [name, id] = queue.shift();
  const o = byId(id);
  o.voters.push(name);
  o.fx.flash = 1;
  tween(o.fx, { flash: 0 }, 1100, ease.outQuad);
  ticker.textContent = `${name} voted ${o.label}`;
  ticker.classList.add('hot');
  requestAnimationFrame(() => requestAnimationFrame(() => ticker.classList.remove('hot')));
  relayout();
  if (queue.length) timer = setTimeout(arrive, 1700 + Math.random() * 1500);
}
function startArrivals(delay) {
  if (timer) clearTimeout(timer);
  timer = queue.length && !closed ? setTimeout(arrive, delay) : 0;
}

setTimeout(() => {
  relayout(800);
  queue = INCOMING.slice();
  startArrivals(1600);
}, 250);

const initials = n => esc(n.slice(0, 2));
const color = n => n === 'You' ? '#007aff' : COLORS[[...n].reduce((s, c) => s + c.charCodeAt(0), 0) % COLORS.length];

// Per-frame part: gradient fills, +1 flashes, the vote counter.
function paintLive() {
  totalEl.textContent = String(Math.round(total.v));
  if (tab !== 'results') return;
  const [lead, second] = options.slice().sort((a, b) => b.voters.length - a.voters.length);
  const tie = lead.voters.length === second.voters.length;
  for (const o of options) {
    const r = rowEl[o.id], pc = o.fx.share * 100, me = o.id === mine, won = closed && (o === lead || (tie && o === second));
    const base = won ? '52,199,89' : '0,122,255';
    const fill = `rgba(${base},${((me ? 0.3 : 0.16) + 0.26 * o.fx.flash).toFixed(3)})`;
    r.el.style.background = `linear-gradient(90deg, ${fill} ${pc.toFixed(1)}%, rgba(127,127,127,0.10) ${pc.toFixed(1)}%)`;
    if (o.fx.flash > 0.05) { r.plus.textContent = '+1'; r.plus.style.color = `rgba(52,199,89,${o.fx.flash.toFixed(3)})`; } else r.plus.textContent = '';
    r.pc.textContent = `${Math.round(pc)}%`;
  }
}
// Structural part: classes, labels, counts, banner, tabs, footer.
function paintRows() {
  const sum = count();
  const [lead, second] = options.slice().sort((a, b) => b.voters.length - a.voters.length);
  const tie = lead.voters.length === second.voters.length;
  for (const o of options) {
    const r = rowEl[o.id], me = o.id === mine, won = closed && (o === lead || (tie && o === second));
    r.el.className = 'opt' + (me ? ' mine' : '') + (closed ? '' : ' open');
    r.lbl.textContent = `${o.label}${me ? ' ✓' : ''}${won ? ' 🏆' : ''}`;
    r.cnt.textContent = String(o.voters.length);
  }
  list.style.height = (options.length * ROW - 6) + 'px';
  win.hidden = !(closed && tab === 'results');
  if (closed) {
    $('winT').textContent = tie ? `🤝 Tie: ${lead.label} and ${second.label}` : `🏆 ${lead.label} wins`;
    $('winS').textContent = `${lead.voters.length} of ${sum} votes · ${Math.round(lead.voters.length / sum * 100)}%${mine ? ` · you picked ${byId(mine).label}` : ''}`;
  }
  paintLive();
}
function paintVoters() {
  votersEl.innerHTML = order().map(o => {
    const avs = o.voters.slice(-8).map(n => `<span class="av" style="background-color: ${color(n)}">${initials(n)}</span>`).join('');
    const more = o.voters.length > 8 ? `<span class="small muted">+${o.voters.length - 8}</span>` : '';
    return `<div class="who"><div class="row between"><b class="small">${o.label}</b><span class="small muted">${o.voters.length} · ${esc(o.voters.slice(-3).join(', '))}</span></div>
      <div>${avs || '<span class="small muted">No votes yet</span>'}${more}</div></div>`;
  }).join('');
}
function paintChrome() {
  for (const t of $('tabs').querySelectorAll('.tab')) t.classList.toggle('on', t.dataset.tab === tab);
  sortEl.hidden = tab !== 'results';
  sortEl.textContent = `⇅ ${sortTop ? 'Top first' : 'Original order'}`;
  list.hidden = tab !== 'results'; votersEl.hidden = tab !== 'voters';
  if (tab === 'voters') paintVoters();
  live.className = 'badge' + (closed ? '' : ' red'); live.textContent = closed ? 'closed' : '● live';
  hintText.textContent = closed ? 'Voting is closed' : mine ? 'You voted · tap your choice again to take it back' : 'Tap an option to vote';
  closeBtn.className = closed ? '' : 'primary'; closeBtn.textContent = closed ? 'Reopen' : 'Close poll';
  paintRows();
}

function handleAction(name, value) {
  if (name === 'tab') {
    if (value === tab) return;
    transition(value === 'voters' ? 'slide-left' : 'slide-right', value === 'voters' ? votersEl : list);
    tab = value;
    return paintChrome();
  }
  if (name === 'sort') { sortTop = !sortTop; relayout(); return paintChrome(); }
  if (name === 'close') {
    transition(closed ? 'fade' : 'pop', win);
    closed = !closed;
    if (!closed) startArrivals(1400);
    else if (timer) { clearTimeout(timer); timer = 0; }
    return paintChrome();
  }
  if (name === 'reset') {
    transition('fade');
    seed();
    mine = null; closed = false; tab = 'results';
    queue = INCOMING.slice();
    ticker.textContent = 'Poll reset · votes are coming in…'; ticker.classList.remove('hot');
    relayout(800);
    startArrivals(1600);
    return paintChrome();
  }
  if (closed) return;
  if (mine) byId(mine).voters = byId(mine).voters.filter(v => v !== 'You');
  mine = mine === value ? null : value;
  if (mine) {
    byId(mine).voters.push('You');
    byId(mine).fx.flash = 0.8;
    tween(byId(mine).fx, { flash: 0 }, 700, ease.outQuad);
  }
  relayout();
  paintChrome();
}
root.addEventListener('click', e => {
  const t = e.target.closest('.tab, #sort, #reset, #close, .opt');
  if (!t) return;
  if (t.tagName === 'A') e.preventDefault();
  if (t.dataset.tab) return handleAction('tab', t.dataset.tab);
  if (t.id === 'sort') return handleAction('sort');
  if (t.id === 'reset') return handleAction('reset');
  if (t.id === 'close') return handleAction('close');
  if (t.classList.contains('opt') && !closed) handleAction('vote', t.dataset.id);
});
paintChrome();
</script>
