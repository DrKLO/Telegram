<!--
  source: Telegram macOS 12.10 (283300), 12-motion-lab.chat, message 12
  author: mo 14:15 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14)); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .pad { padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  a { color: #007aff; text-decoration: none; }
  button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 5px 13px; border: 0; border-radius: 9px; background-color: rgba(127,127,127,0.16); color: var(--fg); text-align: center; cursor: pointer; }
  [data-action] { cursor: pointer; }
  [hidden] { display: none !important; }

  .ar { width: 340px; max-width: 100%; box-sizing: border-box; background-color: #000000; border-color: #000000; color: #ffffff; }
  .ar .wrap { display: flex; align-items: center; margin-top: 10px; }
  .ar .ring { border-radius: 50%; }
  .ar .mask { background-color: #000000; }
  .ar .lbl { margin-left: 14px; }
  .ar .it { padding: 3px 8px; margin-bottom: 3px; border-radius: 8px; }
  .ar .it:hover { background-color: #1c1c1e; }
  .ar .k { font-size: 11px; font-weight: 700; }
  .ar .v { font-size: 20px; font-weight: 700; color: #ffffff; }
  .ar .u { font-size: 12px; color: #8e8e93; }
  .ar .week { display: flex; justify-content: space-between; margin-top: 12px; }
  .ar .day { width: 40px; padding: 4px 0 3px 0; border-radius: 8px; text-align: center; font-size: 10px; font-weight: 700; color: #8e8e93; }
  .ar .day:hover { background-color: #1c1c1e; }
  .ar .day.on { background-color: #2c2c2e; color: #ffffff; }
  .ar .day svg { display: block; margin: 0 auto; }
  .ar .hint { font-size: 11px; color: #8e8e93; margin-top: 6px; }
  .ar button { background-color: #2c2c2e; color: #ffffff; }
  .ar button:hover { background-color: #3a3a3c; }
  .ar .back { font-size: 12px; color: #8e8e93; }
  .ar .back:hover { color: #ffffff; text-decoration: none; }
  .ar .pct { text-align: center; font-weight: 800; }
  .ar .side { margin-left: 16px; }
  .ar .big { font-size: 26px; font-weight: 800; }
  .ar .hours { display: flex; align-items: flex-end; height: 64px; margin: 12px 0 3px 0; }
  .ar .hours div { width: 10px; margin-right: 3px; border-radius: 2px; }
  .ar .axis { display: flex; justify-content: space-between; font-size: 10px; color: #8e8e93; }
  /* the conic-gradient rings as SVG strokes: track at 22 % alpha, the fill clockwise from 12 o'clock;
     tween(vals, …, ms, ease.outCubic) → a stroke-dashoffset transition of the same length (set inline) */
  .ar .rings { position: relative; flex-shrink: 0; }
  .ar .rings svg { display: block; }
  .ar .rings .pct { position: absolute; left: 20px; top: 20px; width: 70px; height: 70px; line-height: 70px; border-radius: 35px; font-size: 18px; }
  /* goal closed: tween(flash, {a: 0}, 1200, ease.inQuad) — the fill starts at mix(colour, #fff, 0.6) */
  .ar .fill-0.flash { animation: flash-0 1200ms cubic-bezier(.11,0,.5,0); }
  .ar .fill-1.flash { animation: flash-1 1200ms cubic-bezier(.11,0,.5,0); }
  .ar .fill-2.flash { animation: flash-2 1200ms cubic-bezier(.11,0,.5,0); }
  @keyframes flash-0 { from { stroke: rgb(253,160,185); } to { stroke: rgb(250,17,79); } }
  @keyframes flash-1 { from { stroke: rgb(211,246,170); } to { stroke: rgb(146,232,42); } }
  @keyframes flash-2 { from { stroke: rgb(165,247,249); } to { stroke: rgb(30,234,239); } }
  /* transition('slide-left' | 'slide-right' | 'pop') on the bubble */
  .tr-slide-left { animation: tr-slide-left 300ms cubic-bezier(.33,1,.68,1); }
  .tr-slide-right { animation: tr-slide-right 300ms cubic-bezier(.33,1,.68,1); }
  .tr-pop { animation: tr-pop 320ms cubic-bezier(.34,1.56,.64,1); }
  @keyframes tr-slide-left { from { opacity: 0; transform: translateX(28px); } }
  @keyframes tr-slide-right { from { opacity: 0; transform: translateX(-28px); } }
  @keyframes tr-pop { from { opacity: 0; transform: scale(0.94); } }
</style>
<div class="card pad ar" id="w">
  <div class="row between"><b>Activity</b><span class="u" id="dayname"></span></div>
  <div id="p-rings">
    <div class="wrap">
      <div class="rings" style="width: 160px; height: 160px"><svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" id="big"></svg></div>
      <div class="lbl" id="labels"></div></div>
    <div class="week" id="week"></div><div class="hint">Tap a ring for details · tap a day to compare</div>
  </div>
  <div id="p-detail" hidden>
    <div class="row between" style="margin-top: 4px"><a class="back" href="#" data-action="back">‹ Summary</a><span class="k" id="d-title"></span></div>
    <div class="wrap">
      <div class="rings" style="width: 110px; height: 110px"><svg width="110" height="110" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg" id="one"></svg><div class="pct" id="d-pct"></div></div>
      <div class="side"><div><span class="big" id="d-big"></span><span class="u" id="d-goal"></span></div>
        <div class="u" id="d-togo"></div>
        <div class="u" id="d-streak"></div>
        <div style="margin-top: 8px" id="d-act"></div></div></div>
    <div class="hours" id="hours"></div>
    <div class="axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
  </div>
</div>
<script>
const RINGS = [
  { name: 'MOVE', unit: 'CAL', goal: 500, color: [250, 17, 79], hex: '#fa114f', step: 60, log: '+60 cal' },
  { name: 'EXERCISE', unit: 'MIN', goal: 30, color: [146, 232, 42], hex: '#92e82a', step: 5, log: '+5 min workout' },
  { name: 'STAND', unit: 'HRS', goal: 12, color: [30, 234, 239], hex: '#1eeaef', step: 1, log: '+1 hour stood' },
];
const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Today'], TODAY = 6, NOW = 15;
let seed = 11;
const rand = () => (seed = seed * 16807 % 2147483647) / 2147483647;
const HOURS = DAYS.map((_, d) => RINGS.map((r, i) => {
  const target = d === TODAY ? [0.72, 0.9, 0.58][i] : 0.35 + rand() * 0.85;
  const w = Array.from({ length: 24 }, (_, h) => h < 7 || h > 22 || (d === TODAY && h > NOW) ? 0 : 0.2 + rand() * (h % 6 === 0 ? 2.2 : 1));
  const sum = w.reduce((a, b) => a + b, 0);
  return w.map(x => x / sum * target * r.goal);
}));
const total = (d, i) => HOURS[d][i].reduce((a, b) => a + b, 0);
const frac = (d, i) => total(d, i) / RINGS[i].goal;
let day = TODAY, view = 'rings', focus = 0, minis = {};
const vals = { 0: 0, 1: 0, 2: 0 };
const OUT = 'cubic-bezier(.33,1,.68,1)';

const root = document.getElementById('w');
const $ = id => document.getElementById(id);
const ease = { outCubic: t => 1 - Math.pow(1 - t, 3) };
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function bubble(kind) {
  for (const c of [...root.classList]) if (c.startsWith('tr-')) root.classList.remove(c);
  void root.offsetWidth;
  root.classList.add('tr-' + kind);
}

// --- the big rings (d = 160: strokes 16 wide at r 72 / 54 / 36, a 2 px gap between them) and the single detail ring (d = 110: r 47)
function circles(cx, radii, clickable) {
  return radii.map((r, i) => {
    const c = RINGS[i].color.join(','), len = (2 * Math.PI * r).toFixed(2), act = clickable ? `data-action="ring" data-value="${i}"` : '';
    return `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="rgba(${c},0.22)" stroke-width="16" ${act}/>
      <circle class="fill fill-${clickable ? i : focus}" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="rgb(${c})" stroke-width="16" stroke-dasharray="${len} ${len}" stroke-dashoffset="${len}" transform="rotate(-90 ${cx} ${cx})" ${act}/>`;
  }).join('');
}
$('big').innerHTML = circles(80, [72, 54, 36], true) + '<circle cx="80" cy="80" r="28" fill="#000000" data-action="ring" data-value="2"/>';
const bigFills = Array.from($('big').querySelectorAll('.fill'));

function setRing(el, r, f, ms) {
  const len = 2 * Math.PI * r;
  el.style.transition = ms ? `stroke-dashoffset ${ms}ms ${OUT}` : 'none';
  el.style.strokeDashoffset = (len * (1 - Math.min(1, f))).toFixed(2);
}
// animated numbers: the same outCubic curve as the ring strokes
let tweenId = 0;
function show(ms) {
  const from = { ...vals }, to = { 0: frac(day, 0), 1: frac(day, 1), 2: frac(day, 2) }, start = performance.now(), me = ++tweenId;
  if (view === 'rings') bigFills.forEach((el, i) => setRing(el, [72, 54, 36][i], to[i], ms));
  else setRing($('one').querySelector('.fill'), 47, to[focus], ms);
  const step = () => {
    if (me !== tweenId) return;
    const t = Math.min(1, (performance.now() - start) / Math.max(1, ms));
    for (const i of [0, 1, 2]) vals[i] = from[i] + (to[i] - from[i]) * ease.outCubic(t);
    numbers();
    if (t < 1) requestAnimationFrame(step);
  };
  step();
}
setTimeout(() => show(900), 250);

function mini(d) {
  if (minis[d]) return minis[d];
  let body = '';
  [42, 29, 16].forEach((r, i) => {
    const len = 2 * Math.PI * r, f = Math.min(1, frac(d, i));
    body += `<circle cx='50' cy='50' r='${r}' fill='none' stroke='${RINGS[i].hex}' stroke-opacity='0.28' stroke-width='11'/>`;
    if (f > 0.01) body += `<circle cx='50' cy='50' r='${r}' fill='none' stroke='${RINGS[i].hex}' stroke-width='11' stroke-linecap='round' stroke-dasharray='${(len * f).toFixed(1)} ${len.toFixed(1)}' transform='rotate(-90 50 50)'/>`;
  });
  return minis[d] = `<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 100 100'>${body}</svg>`;
}

$('labels').innerHTML = RINGS.map((r, i) => `<div class="it" data-action="ring" data-value="${i}"><div class="k" style="color: rgb(${r.color.join(',')})">${r.name} ›</div>
    <span class="v" id="v-${i}">0</span><span class="u">/${r.goal} ${r.unit}</span></div>`).join('');
function week() {
  $('week').innerHTML = DAYS.map((n, d) => `<div class="day ${d === day ? 'on' : ''}" data-action="day" data-value="${d}">${mini(d)}<div>${d === TODAY ? 'Today' : n.slice(0, 3)}</div></div>`).join('');
}
week();

function numbers() {
  $('dayname').textContent = DAYS[day];
  if (view === 'rings') { for (const i of [0, 1, 2]) $('v-' + i).textContent = Math.round(vals[i] * RINGS[i].goal); return; }
  const r = RINGS[focus], f = vals[focus];
  $('d-pct').textContent = Math.round(f * 100) + '%';
  $('d-big').textContent = Math.round(f * r.goal);
  $('d-togo').innerHTML = f >= 1 ? '<span style="color: #ffffff">Goal closed 🎉</span>' : `${Math.max(0, Math.round((1 - f) * r.goal))} ${r.unit.toLowerCase()} to go`;
}

// --- detail: bars.k tweened 0 → 1 over 700 ms outCubic, bar k grows with outCubic(clamp(k·1.8 − k/24)) — each bar gets its own
//     delay / duration from the inverse of that curve
const inv = y => 700 * (1 - Math.cbrt(1 - y));
function detail(grow) {
  const r = RINGS[focus], c = r.color.join(','), h = HOURS[day][focus], max = Math.max(...h, r.goal / 12);
  let streak = 0;
  for (let d = day; d >= 0 && frac(d, focus) >= 1; d--) streak++;
  $('d-title').textContent = `${r.name} · ${DAYS[day]}`;
  $('d-title').style.color = `rgb(${c})`;
  $('d-pct').style.color = `rgb(${c})`;
  $('d-goal').textContent = ` / ${r.goal} ${r.unit}`;
  $('d-streak').textContent = streak ? `${streak}-day streak 🔥` : 'No streak yet';
  $('d-act').innerHTML = day === TODAY ? `<button data-action="log">${r.log}</button>` : '<span class="u">Past days are read-only</span>';
  if (grow) {
    $('one').innerHTML = circles(55, [47], false);
    setRing($('one').querySelector('.fill'), 47, vals[focus], 0);
    $('hours').innerHTML = h.map(v => `<div style="height: 2px; background-color: ${v ? `rgb(${c})` : 'rgba(255,255,255,0.12)'}"></div>`).join('');
    void root.offsetWidth;
  }
  Array.from($('hours').children).forEach((el, k) => {
    if (grow) { const s = inv(k / 43.2), e = inv(Math.min(1, (1 + k / 24) / 1.8)); el.style.transition = `height ${(e - s).toFixed(0)}ms ${OUT} ${s.toFixed(0)}ms`; }
    el.style.height = Math.max(2, 62 * h[k] / max).toFixed(1) + 'px';
  });
  if (grow) setTimeout(() => { for (const el of $('hours').children) el.style.transition = 'none'; }, 720);
  numbers();
}

function showView(v) {
  view = v;
  $('p-rings').hidden = v !== 'rings';
  $('p-detail').hidden = v !== 'detail';
  if (v === 'rings') { bigFills.forEach((el, i) => setRing(el, [72, 54, 36][i], vals[i], 0)); numbers(); }
}

root.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  const name = el.dataset.action, value = el.dataset.value;
  if (name === 'day') {
    day = Number(value);
    week();
    return show(700);
  }
  if (name === 'ring') {
    bubble('slide-left');
    focus = Number(value);
    showView('detail');
    detail(true);
    return;
  }
  if (name === 'back') { bubble('slide-right'); showView('rings'); return; }
  if (name === 'log' && day === TODAY) {
    const r = RINGS[focus], before = frac(TODAY, focus);
    HOURS[TODAY][focus][NOW] += r.step;
    delete minis[TODAY];
    week();
    if (before < 1 && frac(TODAY, focus) >= 1) {
      bubble('pop');
      restart($('one').querySelector('.fill'), 'flash');
    }
    detail(false);
    show(500);
  }
});
numbers();
</script>
