<!--
  source: Telegram macOS 12.10 (283300), 12-motion-lab.chat, message 2
  author: mo 14:00 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --blue: #007aff; --blue-h: #0a6ee0; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .pad { padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
  button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 5px 13px; border: 0; border-radius: 9px; background-color: rgba(127,127,127,0.16); color: var(--fg); text-align: center; cursor: pointer; }
  button:hover { background-color: rgba(127,127,127,0.28); } button:active { background-color: rgba(127,127,127,0.40); }
  [data-action] { cursor: pointer; }
  [hidden] { display: none !important; }

  .eg { width: 400px; max-width: 100%; box-sizing: border-box; }
  .eg .tab { display: inline-block; padding: 2px 10px; margin-left: 3px; border-radius: 7px; font-size: 12px; font-weight: 600; }
  .eg .tab:hover { background-color: rgba(127,127,127,0.16); }
  .eg .tab.on { background-color: rgba(0,122,255,0.16); color: #007aff; }
  .eg .r { display: flex; align-items: center; height: 21px; border-radius: 6px; }
  .eg .r:hover { background-color: rgba(127,127,127,0.10); }
  .eg .r.sel { background-color: rgba(0,122,255,0.10); }
  .eg .n { width: 84px; padding-left: 6px; font-family: ui-monospace, monospace; font-size: 11px; color: #8e8e93; }
  .eg .r.sel .n { font-weight: 700; }
  .eg .track { position: relative; width: 204px; height: 2px; margin-left: 4px; background-color: rgba(127,127,127,0.25); }
  .eg .dot { position: absolute; border-radius: 8px; left: 2px; top: -5px; width: 12px; height: 12px; }
  .eg .r.sel .dot { left: 0; top: -7px; width: 16px; height: 16px; }
  .eg .graph { position: relative; width: 372px; max-width: 100%; height: 180px; margin-top: 10px; }
  .eg .graph svg { display: block; }
  .eg .cursor { position: absolute; left: 0; top: 10px; width: 1px; height: 160px; background-color: rgba(142,142,147,0.45); }
  .eg .gdot { position: absolute; width: 12px; height: 12px; border-radius: 6px; margin: -6px 0 0 -6px; }
  .eg .lane { position: relative; height: 22px; margin-top: 5px; border-radius: 6px; background-color: rgba(127,127,127,0.10); }
  .eg .box { position: absolute; left: 26px; top: 3px; width: 16px; height: 16px; border-radius: 4px; }
  .eg .ln { position: absolute; right: 8px; top: 0; line-height: 22px; font-size: 11px; font-family: ui-monospace, monospace; color: #8e8e93; }
  .eg .chips { margin-top: 8px; }
  .eg .chips span { display: inline-block; padding: 1px 7px; margin: 2px 3px 2px 0; border-radius: 7px; font-size: 11px; font-family: ui-monospace, monospace; background-color: rgba(127,127,127,0.12); }
  .eg .chips span:hover { background-color: rgba(127,127,127,0.26); }
  .eg .durs span { display: inline-block; padding: 1px 7px; margin-left: 3px; border-radius: 7px; font-size: 11px; font-weight: 600; }
  .eg .durs span:hover { background-color: rgba(127,127,127,0.16); }
  .eg .durs span.on { background-color: rgba(127,127,127,0.22); }
  /* transition('slide-left' | 'slide-right') on the bubble */
  .tr-slide-left { animation: tr-slide-left 300ms cubic-bezier(.33,1,.68,1); }
  .tr-slide-right { animation: tr-slide-right 300ms cubic-bezier(.33,1,.68,1); }
  @keyframes tr-slide-left { from { opacity: 0; transform: translateX(28px); } }
  @keyframes tr-slide-right { from { opacity: 0; transform: translateX(-28px); } }
</style>
<div class="card pad eg" id="w">
  <div class="row between"><span><b>Easing gallery</b><span class="tab on" data-action="tab" data-value="race">Race</span><span class="tab" data-action="tab" data-value="curve">Curve</span></span><button data-action="play">↻ Replay</button></div>
  <div id="race" style="margin-top: 8px">
    <div id="rows"></div>
    <div class="tiny muted" style="margin-top: 6px">Tap a curve to plot it against linear</div>
  </div>
  <div id="curve" hidden>
    <div class="graph">
      <svg width="372" height="180" viewBox="0 0 372 180" xmlns="http://www.w3.org/2000/svg">
        <rect x="0.5" y="0.5" width="371" height="179" rx="10" fill="#8e8e93" fill-opacity="0.07" stroke="#8e8e93" stroke-opacity="0.25"/>
        <line x1="8" y1="150" x2="364" y2="150" stroke="#8e8e93" stroke-opacity="0.5" stroke-dasharray="3 4"/>
        <line x1="8" y1="50" x2="364" y2="50" stroke="#8e8e93" stroke-opacity="0.5" stroke-dasharray="3 4"/>
        <line x1="8" y1="150" x2="364" y2="50" stroke="#8e8e93" stroke-opacity="0.55" stroke-width="1.5"/>
        <path id="cpath" d="" fill="none" stroke="#007aff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <div class="cursor" id="cursor"></div>
      <div class="gdot" id="gdot"></div>
    </div>
    <div class="row between" style="margin-top: 6px"><span class="small"><b id="selname"></b> <span class="muted" id="note"></span></span></div>
    <div class="lane"><div class="box" id="box1"></div><span class="ln" id="ln1"></span></div>
    <div class="lane"><div class="box" id="box2" style="background-color: #8e8e93"></div><span class="ln">linear</span></div>
    <div class="row between" style="margin-top: 6px"><span class="tiny muted" id="tv" style="font-family: ui-monospace, monospace">t 0.00 → 0.00</span><span class="durs" id="durs"></span></div>
    <div class="chips" id="chips"></div>
  </div>
</div>
<script>
const NAMES = ['linear', 'inQuad', 'outQuad', 'inOutQuad', 'outCubic', 'inOutCubic', 'outQuint', 'outExpo', 'inOutSine', 'outBack', 'inOutBack', 'outElastic', 'outBounce', 'spring'];
const COLORS = ['#8e8e93', '#ff9500', '#ffcc00', '#ff6b22', '#34c759', '#30b0c7', '#00c7be', '#32ade6', '#64d2ff', '#007aff', '#5e5ce6', '#af52de', '#ff2d55', '#ff6482'];
const NOTES = {
  linear: 'Constant speed. Robotic, but honest for progress bars.',
  inQuad: 'Starts slow, ends fast. For things leaving the screen.',
  outQuad: 'Fast start, gentle stop. A safe default for UI.',
  inOutQuad: 'Slow at both ends, symmetric.',
  outCubic: 'A softer landing than outQuad. The default of tween().',
  inOutCubic: 'A stronger symmetric ease. The default of animate().',
  outQuint: 'A very quick start and a long glide.',
  outExpo: 'Snappy: 90% of the way in the first third.',
  inOutSine: 'The gentlest symmetric curve. Great for loops.',
  outBack: 'Overshoots by about 10%, then settles.',
  inOutBack: 'Pulls back first, overshoots at the end.',
  outElastic: 'Wobbles past the target like a plucked string.',
  outBounce: 'Drops and bounces three times.',
  spring: 'A damped spring with one soft overshoot.',
};
// The same curves the host prelude ships, used for the graph, the CSS linear() samples and the live numbers.
const ease = {
  linear: t => t,
  inQuad: t => t * t,
  outQuad: t => t * (2 - t),
  inOutQuad: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outQuint: t => 1 - Math.pow(1 - t, 5),
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
  inOutBack: t => { const c = 1.70158 * 1.525; return t < 0.5 ? (Math.pow(2 * t, 2) * ((c + 1) * 2 * t - c)) / 2 : (Math.pow(2 * t - 2, 2) * ((c + 1) * (t * 2 - 2) + c) + 2) / 2; },
  spring: t => t === 0 || t === 1 ? t : 1 - Math.exp(-7 * t) * Math.cos(9.5 * t),
  outElastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1,
  outBounce: t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375; return n * (t -= 2.625 / d) * t + 0.984375; },
};
const lerp = (a, b, t) => a + (b - a) * t;
const DURS = [[600, '0.6 s'], [1200, '1.2 s'], [2400, '2.4 s']];
const R = 190, LANE = 240, gx = t => 8 + t * 356, gy = v => 10 + (1.4 - v) / 1.6 * 160;
let tab = 'race', sel = 'outBack', prev = 'outBack', dur = 1200, run = 0, morphRun = 0;
const morph = { k: 1 };
const color = n => COLORS[NAMES.indexOf(n)];
const value = t => lerp(ease[prev](t), ease[sel](t), morph.k);
// CSS linear() with 65 samples of a curve: the browser then moves the element exactly along it.
const cssEase = fn => 'linear(' + Array.from({ length: 65 }, (_, i) => fn(i / 64).toFixed(3)).join(',') + ')';
const CSS_EASE = Object.fromEntries(NAMES.map(n => [n, cssEase(ease[n])]));

const root = document.getElementById('w');
const $ = id => document.getElementById(id);
function bubble(kind) {
  for (const c of [...root.classList]) if (c.startsWith('tr-')) root.classList.remove(c);
  void root.offsetWidth;
  root.classList.add('tr-' + kind);
}
function animate(duration, onFrame, easing) {
  return new Promise(resolve => {
    const start = performance.now();
    const step = () => {
      const t = Math.min(1, (performance.now() - start) / Math.max(1, duration));
      onFrame(easing(t), t);
      if (t < 1) requestAnimationFrame(step); else resolve();
    };
    step();
  });
}

// --- race: one CSS transition per dot, eased by its own curve, 1.5 s per round, 2 s per round including the rest
$('rows').innerHTML = NAMES.map((n, i) => `<div class="r" data-action="pick" data-value="${n}"><span class="n">${n}</span><div class="track"><div class="dot" style="background-color: ${COLORS[i]}"></div></div></div>`).join('');
const rowEls = Array.from($('rows').children), dots = rowEls.map(r => r.querySelector('.dot'));
let roundTimers = [];
function play(rounds) {
  const me = ++run;
  roundTimers.forEach(clearTimeout); roundTimers = [];
  dots.forEach(d => { d.style.transition = 'none'; d.style.transform = 'translateX(0)'; });
  void root.offsetWidth;
  for (let round = 0; round < rounds; round++) {
    roundTimers.push(setTimeout(() => {
      if (me !== run) return;
      const forward = round % 2 === 0;
      dots.forEach((d, i) => { d.style.transition = `transform 1500ms ${CSS_EASE[NAMES[i]]}`; d.style.transform = `translateX(${forward ? R : 0}px)`; });
    }, round * 2000));
  }
  roundTimers.push(setTimeout(() => {
    if (me !== run) return;
    dots.forEach(d => { d.style.transition = 'none'; d.style.transform = 'translateX(0)'; });
  }, rounds * 2000));
}
function markSel() {
  rowEls.forEach((r, i) => {
    const on = NAMES[i] === sel;
    r.classList.toggle('sel', on);
    r.querySelector('.n').style.color = on ? COLORS[i] : '';
  });
}

// --- curve
$('durs').innerHTML = DURS.map(([ms, label]) => `<span data-action="dur" data-value="${ms}">${label}</span>`).join('');
$('chips').innerHTML = NAMES.map(n => `<span data-action="pick" data-value="${n}">${n}</span>`).join('');
const cpath = $('cpath'), cursor = $('cursor'), gdot = $('gdot'), box1 = $('box1'), box2 = $('box2'), tv = $('tv');
function drawPath() {
  let d = '';
  for (let i = 0; i <= 64; i++) d += `${i ? ' L' : 'M'}${gx(i / 64).toFixed(1)} ${gy(value(i / 64)).toFixed(1)}`;
  cpath.setAttribute('d', d);
}
function applySel() {
  const c = color(sel);
  cpath.setAttribute('stroke', c);
  gdot.style.backgroundColor = c; box1.style.backgroundColor = c;
  $('selname').textContent = sel; $('selname').style.color = c;
  $('note').textContent = NOTES[sel]; $('ln1').textContent = sel;
  for (const ch of $('chips').children) { const on = ch.dataset.value === sel; ch.style.backgroundColor = on ? c : ''; ch.style.color = on ? '#ffffff' : ''; }
  for (const d of $('durs').children) d.classList.toggle('on', Number(d.dataset.value) === dur);
  markSel();
}
function placeTrace(t, transitionMs) {
  const v = value(t);
  const tr = transitionMs ? `${transitionMs}ms` : null;
  cursor.style.transition = tr ? `transform ${tr} linear` : 'none';
  cursor.style.transform = `translateX(${gx(t).toFixed(1)}px)`;
  gdot.style.transition = tr ? `left ${tr} linear, top ${tr} ${cssEase(value)}` : 'none';
  gdot.style.left = gx(t).toFixed(1) + 'px'; gdot.style.top = gy(v).toFixed(1) + 'px';
  box1.style.transition = tr ? `transform ${tr} ${cssEase(value)}` : 'none';
  box1.style.transform = `translateX(${(v * LANE).toFixed(1)}px)`;
  box2.style.transition = tr ? `transform ${tr} linear` : 'none';
  box2.style.transform = `translateX(${(t * LANE).toFixed(1)}px)`;
  tv.textContent = `t ${t.toFixed(2)} → ${v.toFixed(2)}`;
}
function traceIt() {
  const me = ++run;
  placeTrace(0, 0);
  void root.offsetWidth;
  setTimeout(() => {
    if (me !== run) return;
    placeTrace(1, dur);
    // the readout is an animated number: it keeps a frame loop
    animate(dur, (_, t) => { if (me === run) tv.textContent = `t ${t.toFixed(2)} → ${value(t).toFixed(2)}`; }, ease.linear);
  }, 180);
}
function showTab(id) {
  tab = id;
  $('race').hidden = id !== 'race'; $('curve').hidden = id !== 'curve';
  for (const t of root.querySelectorAll('.tab')) t.classList.toggle('on', t.dataset.value === id);
}

drawPath(); applySel(); markSel(); placeTrace(1, 0);
setTimeout(() => play(4), 250);

root.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const name = el.dataset.action, value_ = el.dataset.value;
  if (name === 'tab') {
    if (value_ === tab) return;
    bubble(value_ === 'curve' ? 'slide-left' : 'slide-right');
    showTab(value_);
    return tab === 'race' ? play(2) : traceIt();
  }
  if (name === 'play') return tab === 'race' ? play(2) : traceIt();
  if (name === 'dur') { dur = Number(value_); applySel(); return traceIt(); }
  if (name !== 'pick') return;
  if (tab === 'race') {
    bubble('slide-left');
    showTab('curve'); prev = sel = value_; morph.k = 1; morphRun++;
    drawPath(); applySel();
    return traceIt();
  }
  if (value_ === sel) return traceIt();
  prev = sel; sel = value_;
  const me = ++run, mm = ++morphRun;
  applySel();
  placeTrace(1, 0);
  // the path morph has no CSS equivalent (65-point SVG path): 450 ms inOutCubic frame loop
  animate(450, (p, t) => { if (mm !== morphRun) return; morph.k = p; drawPath(); if (t >= 1 && me === run) traceIt(); }, ease.inOutCubic);
});
</script>
