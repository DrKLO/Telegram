<!--
  source: Telegram macOS 12.10 (283300), 12-motion-lab.chat, message 3
  author: mo 14:01 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --blue: #007aff; --blue-h: #0a6ee0; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .pad { padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  .fg { color: var(--fg); } .muted { color: var(--muted); }
  a { color: var(--blue); text-decoration: none; }
  button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 5px 13px; border: 0; border-radius: 9px; background-color: rgba(127,127,127,0.16); color: var(--fg); text-align: center; cursor: pointer; }
  button:hover { background-color: rgba(127,127,127,0.28); } button:active { background-color: rgba(127,127,127,0.40); }
  button.primary { background-color: var(--blue); color: #ffffff; } button.primary:hover { background-color: var(--blue-h); }
  [data-action] { cursor: pointer; }
  [hidden] { display: none !important; }

  .cf { width: 380px; max-width: 100%; box-sizing: border-box; }
  .cf .stage { position: relative; height: 200px; overflow: hidden; border-radius: 12px; text-align: center;
               background: linear-gradient(160deg, #1d1b4b, #3b1d5e 55%, #6b2a63); }
  .cf .title { color: #ffffff; font-weight: 800; font-size: 30px; padding-top: 62px; height: 52px; line-height: 52px; }
  /* tween(title, {s: 1}, 1000, ease.outElastic) from 0.2 */
  .cf .title.pop { animation: title-pop 1000ms linear(0,0.272,0.646,1,1.25,1.364,1.354,1.257,1.125,1,0.912,0.871,0.875,0.909,0.956,1,1.031,1.046,1.044,1.032,1.016,1,0.989,0.984,0.984,0.989,0.994,1,1.004,1.006,1.006,1.004,1.002,1,0.999,0.998,0.998,0.999,0.999,1,1); }
  @keyframes title-pop { from { transform: scale(0.2); } to { transform: scale(1); } }
  .cf .sub { color: rgba(255,255,255,0.75); font-size: 13px; }
  .cf canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
  .cf .hand { display: inline-block; }
  /* tween(cheer, {s: 1}, 420, ease.outBack) from 1.5 */
  .cf .hand.pop { animation: hand-pop 420ms cubic-bezier(.34,1.56,.64,1); }
  @keyframes hand-pop { from { transform: scale(1.5); } to { transform: scale(1); } }
  .cf .modes { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .cf .m { display: inline-block; padding: 3px 9px; margin-right: 4px; border-radius: 8px; font-size: 12px; font-weight: 600; background-color: rgba(127,127,127,0.12); }
  .cf .m:hover { background-color: rgba(127,127,127,0.24); }
  .cf .m.on { background-color: #5e5ce6; color: #ffffff; }
  .cf .lnk { font-size: 12px; }
  .cf .lnk:hover { text-decoration: underline; }
  .cf .note { display: flex; align-items: center; padding: 6px 0; border-top: 1px solid rgba(127,127,127,0.16); font-size: 13px; }
  .cf .note .ic { width: 26px; font-size: 15px; }
  /* tween(row, {k: 1}, 420, ease.outCubic) after 60 + i * 80 ms: margin 24 → 0, colour flips at k > 0.6 (≈110 ms in) */
  .cf .note .tx { color: var(--muted); margin-left: 24px; transition: margin-left 420ms cubic-bezier(.33,1,.68,1), color 0s linear; }
  .cf .note.in .tx { color: var(--fg); margin-left: 0; }
  /* transition('slide-down' | 'slide-up') on the bubble */
  .tr-slide-down { animation: tr-slide-down 300ms cubic-bezier(.33,1,.68,1); }
  .tr-slide-up { animation: tr-slide-up 300ms cubic-bezier(.33,1,.68,1); }
  @keyframes tr-slide-down { from { opacity: 0; transform: translateY(-14px); } }
  @keyframes tr-slide-up { from { opacity: 0; transform: translateY(14px); } }
</style>
<div class="card pad cf" id="w">
  <div class="row between" style="margin-bottom: 8px"><b>🚀 Release party</b>
    <span><button data-action="cheer"><span class="hand" id="hand">🙌</span> <span id="cheers">0</span></button> <button class="primary" data-action="burst">🎉 Again</button></span></div>
  <div class="stage">
    <div class="title" id="title">v2.0 shipped!</div>
    <div class="sub" id="sub">42 PRs · 9 contributors · 0 regressions</div>
    <canvas id="fx" width="352" height="200"></canvas>
  </div>
  <div class="modes"><span id="modes"></span><a class="lnk" href="#" data-action="notes" id="noteslnk">What's new ▾</a></div>
  <div id="notes" hidden style="margin-top: 6px"></div>
</div>
<script>
const PALETTE = [[255, 45, 85], [255, 204, 0], [52, 199, 89], [10, 132, 255], [191, 90, 242], [255, 159, 10], [100, 210, 255]];
const MODES = [['cannons', '🎊 Cannons'], ['rain', '🌧 Rain'], ['fireworks', '🎆 Fireworks']];
const NOTES = [['✨', 'Scripted bubbles now animate at 60 fps'], ['🧭', 'Native transitions between states'], ['🎨', 'tween(), mix() and alpha() helpers'], ['🐛', '42 fixes, 0 regressions']];
const MAX = 150;
let bits = [], last = 0, flying = false, bursts = 0, mode = 'cannons', rainUntil = 0, cheers = 0, open = false, rockets = [];
const rgb = () => PALETTE[Math.floor(Math.random() * PALETTE.length)];

const root = document.getElementById('w');
const $ = id => document.getElementById(id);
const canvas = $('fx'), ctx = canvas.getContext('2d');
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function bubble(kind) {
  for (const c of [...root.classList]) if (c.startsWith('tr-')) root.classList.remove(c);
  void root.offsetWidth;
  root.classList.add('tr-' + kind);
}

$('modes').innerHTML = MODES.map(([id, label]) => `<span class="m ${mode === id ? 'on' : ''}" data-action="mode" data-value="${id}">${label}</span>`).join('');
$('notes').innerHTML = NOTES.map(([ic, text], i) => `<div class="note" style="transition-delay: ${60 + i * 80}ms, ${60 + i * 80 + 110}ms"><span class="ic">${ic}</span><span class="tx" style="transition-delay: ${60 + i * 80}ms, ${60 + i * 80 + 110}ms">${text}</span></div>`).join('');

function add(b) { bits.push(b); if (bits.length > MAX) bits.splice(0, bits.length - MAX); }
function conf(x, y, vx, vy, born, life) {
  add({ kind: 'conf', x, y, vx, vy, w: 6 + Math.random() * 5, h: 9 + Math.random() * 6, spin: Math.random() * 6,
        spinRate: 5 + Math.random() * 9, rgb: rgb(), born, life, emoji: Math.random() < 0.06 ? ['🎉', '✨', '⭐️'][bits.length % 3] : null });
}
function go() { if (!flying) { flying = true; last = performance.now(); requestAnimationFrame(step); } }

function burst() {
  bursts++;
  const now = performance.now();
  if (mode === 'cannons') for (let i = 0; i < 64; i++) {
    const left = i % 2 === 0, a = ((left ? -62 : -118) + (Math.random() - 0.5) * 40) * Math.PI / 180, v = 330 + Math.random() * 260;
    conf(left ? 8 : 344, 205, Math.cos(a) * v, Math.sin(a) * v, now, 2600 + Math.random() * 1200);
  }
  if (mode === 'rain') rainUntil = now + 1800;
  if (mode === 'fireworks') for (let k = 0; k < 3; k++)
    rockets.push({ x: 60 + Math.random() * 232, y: 205, vy: -(300 + Math.random() * 70), fuse: now + 650 + k * 380 + Math.random() * 150, launch: now + k * 380, rgb: rgb() });
  restart($('title'), 'pop');
  $('sub').textContent = bursts > 1 ? `${bursts} rounds of confetti 🥳` : '42 PRs · 9 contributors · 0 regressions';
  go();
}

function explode(r, now) {
  for (let i = 0; i < 34; i++) {
    const a = i / 34 * Math.PI * 2, v = 80 + Math.random() * 90;
    add({ kind: 'spark', x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rgb: r.rgb, born: now, life: 1100 + Math.random() * 500 });
  }
}

function step(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  if (t < rainUntil) for (let i = 0; i < 2; i++) conf(Math.random() * 352, -12, (Math.random() - 0.5) * 40, 60 + Math.random() * 80, t, 2600);
  rockets = rockets.filter(r => {
    if (t < r.launch) return true;
    if (t >= r.fuse) { explode(r, t); return false; }
    r.y += r.vy * dt; r.vy += 240 * dt;
    return true;
  });
  for (const b of bits) {
    if (b.kind === 'spark') { b.vx *= 1 - 1.8 * dt; b.vy = b.vy * (1 - 1.8 * dt) + 90 * dt; }
    else { b.vx *= 1 - 1.6 * dt; b.vy = Math.min(b.vy + 700 * dt, 95 + 45 * Math.sin(b.spin)); b.spin += b.spinRate * dt; }
    b.x += b.vx * dt; b.y += b.vy * dt;
  }
  bits = bits.filter(b => t - b.born < b.life && b.y < 215);
  draw(t);
  if (bits.length || rockets.length || t < rainUntil) requestAnimationFrame(step); else flying = false;
}

// the particles are drawn on a canvas over the stage (same shapes, colours and fade as the original divs)
function draw(t) {
  ctx.clearRect(0, 0, 352, 200);
  ctx.fillStyle = 'rgba(255,230,160,0.9)';
  for (const r of rockets) if (t >= r.launch) ctx.fillRect(Math.round(r.x), Math.round(r.y), 3, 12);
  ctx.font = '16px system-ui, sans-serif';
  ctx.textBaseline = 'top';
  for (const b of bits) {
    const age = (t - b.born) / b.life, a = age > 0.7 ? Math.max(0, (1 - age) / 0.3) : 1;
    if (b.emoji) { ctx.fillStyle = '#ffffff'; ctx.fillText(b.emoji, Math.round(b.x), Math.round(b.y)); continue; }
    ctx.fillStyle = `rgba(${b.rgb.join(',')},${a.toFixed(2)})`;
    if (b.kind === 'spark') { ctx.fillRect(Math.round(b.x), Math.round(b.y), 4, 4); continue; }
    const w = Math.max(1.5, b.w * Math.abs(Math.cos(b.spin)));
    ctx.fillRect(Math.round(b.x - w / 2), Math.round(b.y), w, Math.round(b.h));
  }
}

setTimeout(burst, 250);

root.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  const name = el.dataset.action, value = el.dataset.value;
  if (name === 'mode') {
    mode = value;
    for (const m of $('modes').children) m.classList.toggle('on', m.dataset.value === mode);
    return burst();
  }
  if (name === 'burst') return burst();
  if (name === 'cheer') {
    cheers++;
    $('cheers').textContent = cheers;
    restart($('hand'), 'pop');
    const now = performance.now();
    for (let i = 0; i < 14; i++) {
      const a = (-90 + (Math.random() - 0.5) * 70) * Math.PI / 180, v = 220 + Math.random() * 160;
      conf(176, 205, Math.cos(a) * v, Math.sin(a) * v, now, 1800 + Math.random() * 600);
    }
    return go();
  }
  if (name === 'notes') {
    bubble(open ? 'slide-up' : 'slide-down');
    open = !open;
    $('noteslnk').textContent = `What's new ${open ? '▴' : '▾'}`;
    const notes = $('notes'), rows = Array.from(notes.children);
    rows.forEach(r => r.classList.remove('in'));
    notes.hidden = !open;
    if (open) { void notes.offsetWidth; rows.forEach(r => r.classList.add('in')); }
  }
});
</script>
