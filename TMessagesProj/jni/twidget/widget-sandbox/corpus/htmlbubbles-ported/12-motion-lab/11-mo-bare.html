<div class="card pad rx" id="w">
  <div class="row between"><b>Live reactions</b><span id="tabs"><span class="tab on" data-action="tab" data-value="live">Live</span><span class="tab" data-action="tab" data-value="stats">Stats</span></span></div>
  <div id="live">
    <div class="stage" id="stage"><span class="live badge red">● LIVE · <span id="watch">1.2</span>k watching<span id="hype"></span></span><div class="combo" id="combo" hidden></div></div>
    <div class="btns" id="btns"></div>
  </div>
  <div id="stats" hidden>
    <div style="margin-top: 8px" id="rows"></div>
    <div class="sum muted"><span id="sum-l"></span><span id="sum-r"></span></div>
  </div>
</div>
<script>
const KINDS = ['❤️', '😂', '🔥', '👏'], TINT = ['255,45,85', '255,204,0', '255,149,0', '94,92,230'];
const counts = [128, 41, 77, 63];
let floats = [], pending = [], flying = false, tab = 'live', taps = 0, lastTap = -9999, streak = 0, bestStreak = 0, hypeUntil = 0, hypes = 0;
const watchers = { v: 1200 };
let statsOrder = '';

const root = document.getElementById('w');
const $ = id => document.getElementById(id);
const ease = { outCubic: t => 1 - Math.pow(1 - t, 3) };
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function bubble(kind) {
  for (const c of [...root.classList]) if (c.startsWith('tr-')) root.classList.remove(c);
  void root.offsetWidth;
  root.classList.add('tr-' + kind);
}
function tween(obj, key, to, duration, easing, onFrame) {
  const from = obj[key], start = performance.now();
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / Math.max(1, duration));
    obj[key] = from + (to - from) * easing(t);
    onFrame();
    if (t < 1) requestAnimationFrame(step);
  };
  step();
}

$('btns').innerHTML = KINDS.map((k, i) => `<span class="r" data-action="react" data-value="${i}"><span class="em">${k}</span> <span class="n">${counts[i]}</span></span>`).join('')
  + '<span class="r hype" data-action="hype">📣 Hype</span>';
const nums = Array.from($('btns').querySelectorAll('.n')), ems = Array.from($('btns').querySelectorAll('.em'));

function bump(i) { counts[i]++; nums[i].textContent = counts[i]; if (tab === 'stats') stats(false); }
function spawn(i, t) {
  const size = 22 + Math.random() * 10, x0 = 40 + i * 84 + (Math.random() - 0.5) * 30, life = 1700 + Math.random() * 700;
  const el = document.createElement('div');
  el.className = 'fl';
  el.style.cssText = `left: ${(x0 - size / 2).toFixed(0)}px; font-size: ${size.toFixed(0)}px; --w: ${(14 + Math.random() * 14).toFixed(1)}; animation: wob-${Math.floor(Math.random() * 6)} ${life.toFixed(0)}ms linear forwards`;
  el.innerHTML = `<span style="animation-duration: ${life.toFixed(0)}ms">${KINDS[i]}</span>`;
  $('stage').appendChild(el);
  floats.push({ el, born: t, life });
  if (floats.length > 60) floats.shift().el.remove();
}
function sweep(t) {
  floats = floats.filter(f => { if (t - f.born < f.life) return true; f.el.remove(); return false; });
}
function fly(t) {
  pending = pending.filter(p => { if (p.at > t) return true; bump(p.i); spawn(p.i, t); return false; });
  if (t < hypeUntil && Math.random() < 0.35) { const k = Math.floor(Math.random() * 4); bump(k); spawn(k, t); }
  sweep(t);
  if (floats.length || pending.length || t < hypeUntil) requestAnimationFrame(fly); else flying = false;
}
function wake() { if (!flying) { flying = true; requestAnimationFrame(fly); } }
function crowd(i, n) {
  let at = performance.now();
  for (let k = 0; k < n; k++) { at += 180 + Math.random() * 380; pending.push({ at, i: Math.random() < 0.6 ? i : Math.floor(Math.random() * 4) }); }
  if (pending.length > 24) pending.splice(0, pending.length - 24);
  wake();
}
setTimeout(() => crowd(0, 4), 250);

function watching() { $('watch').textContent = (watchers.v / 1000).toFixed(1); }
function hypeLabel() { $('hype').textContent = performance.now() < hypeUntil ? ' · 📣 hype!' : ''; }

function stats(grow) {
  const total = counts.reduce((s, c) => s + c, 0), max = Math.max(...counts);
  const order = KINDS.map((_, i) => i).sort((a, b) => counts[b] - counts[a]);
  const key = order.join('');
  if (grow || key !== statsOrder) {
    statsOrder = key;
    $('rows').innerHTML = order.map((i, rank) => `<div class="st"><span class="em">${KINDS[i]}</span>
      <div class="tr"><div class="fill" style="width: 0px; background-color: rgba(${TINT[i]},0.750); transition-delay: ${grow ? 60 + rank * 70 : 0}ms"></div></div>
      <span class="num"></span></div>`).join('');
    void root.offsetWidth;
  }
  const rows = Array.from($('rows').children);
  order.forEach((i, rank) => {
    const row = rows[rank], fill = row.querySelector('.fill');
    if (!grow) fill.style.transitionDelay = '0ms';
    fill.style.width = (214 * counts[i] / max).toFixed(1) + 'px';
    row.querySelector('.num').textContent = `${counts[i]} · ${Math.round(counts[i] / total * 100)}%${rank === 0 ? ' 👑' : ''}`;
  });
  $('sum-l').textContent = `${total} reactions · ${hypes} hype${hypes === 1 ? '' : 's'}`;
  $('sum-r').textContent = `You tapped ${taps}× · best streak ×${bestStreak}`;
}

function showTab(id) {
  tab = id;
  for (const t of $('tabs').children) t.classList.toggle('on', t.dataset.value === id);
  $('live').hidden = id !== 'live';
  $('stats').hidden = id !== 'stats';
  if (id === 'stats') stats(true);
  else {
    // floats kept flying while the stage was hidden: resume each one at its current age
    const now = performance.now();
    sweep(now);
    for (const f of floats) { const d = `${(f.born - now).toFixed(0)}ms`; f.el.style.animationDelay = d; f.el.firstChild.style.animationDelay = d; }
  }
}

$('combo').addEventListener('animationend', e => { if (e.animationName === 'combo-fade') $('combo').hidden = true; });

root.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  const name = el.dataset.action, value = el.dataset.value, now = performance.now();
  if (name === 'tab') {
    if (value === tab) return;
    bubble(value === 'stats' ? 'slide-left' : 'slide-right');
    showTab(value);
    return;
  }
  if (name === 'hype') {
    hypes++;
    hypeUntil = now + 3500;
    hypeLabel();
    setTimeout(hypeLabel, 3510);
    tween(watchers, 'v', 1300 + Math.random() * 700, 1400, ease.outCubic, watching);
    if (tab === 'stats') stats(false);
    return wake();
  }
  const i = Number(value);
  bump(i); taps++;
  streak = now - lastTap < 700 ? streak + 1 : 1;
  lastTap = now;
  bestStreak = Math.max(bestStreak, streak);
  const combo = $('combo');
  if (streak >= 3) { combo.textContent = `×${streak}`; combo.hidden = false; restart(combo, 'show'); }
  else { combo.hidden = true; combo.classList.remove('show'); }
  spawn(i, now);
  crowd(i, 2);
  restart(ems[i], 'pop');
});
</script>
