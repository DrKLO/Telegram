<!--
  source: Telegram macOS 12.10 (283300), 12-motion-lab.chat, message 13
  author: mo 14:17 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --blue: #007aff; --blue-h: #0a6ee0; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .pad { padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
  a { color: var(--blue); text-decoration: none; }
  button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 5px 13px; border: 0; border-radius: 9px; background-color: rgba(127,127,127,0.16); color: var(--fg); text-align: center; cursor: pointer; }
  button:hover { background-color: rgba(127,127,127,0.28); } button:active { background-color: rgba(127,127,127,0.40); }
  button.primary { background-color: var(--blue); color: #ffffff; } button.primary:hover { background-color: var(--blue-h); }
  [data-action] { cursor: pointer; }
  [hidden] { display: none !important; }

  .sl { width: 330px; max-width: 100%; box-sizing: border-box; }
  .sl .wrap { position: relative; overflow: hidden; border-radius: 14px; }
  .sl .machine { position: relative; padding: 10px 12px 12px 12px; border-radius: 14px; background: linear-gradient(180deg, #8e1d2c, #c0392b); }
  .sl .machine > * { position: relative; }
  /* flash.a: the machine top colour is mix(#8e1d2c, #ffc72c, a) — an overlay gradient whose opacity pulses |sin(p·2π)| over 700 ms (pair) or |sin(p·6π)| over 1600 ms (jackpot) */
  .sl .glow { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 14px; background: linear-gradient(180deg, #ffc72c, #c0392b); opacity: 0; pointer-events: none; }
  .sl .glow.pulse-2 { animation: pulse-2 700ms linear; }
  .sl .glow.pulse-6 { animation: pulse-6 1600ms linear; }
  @keyframes pulse-2 { 0% { opacity: 0; } 12.5% { opacity: .707; } 25% { opacity: 1; } 37.5% { opacity: .707; } 50% { opacity: 0; } 62.5% { opacity: .707; } 75% { opacity: 1; } 87.5% { opacity: .707; } 100% { opacity: 0; } }
  @keyframes pulse-6 { 0% { opacity: 0; } 4.17% { opacity: .707; } 8.33% { opacity: 1; } 12.5% { opacity: .707; } 16.67% { opacity: 0; } 20.83% { opacity: .707; } 25% { opacity: 1; } 29.17% { opacity: .707; } 33.33% { opacity: 0; }
    37.5% { opacity: .707; } 41.67% { opacity: 1; } 45.83% { opacity: .707; } 50% { opacity: 0; } 54.17% { opacity: .707; } 58.33% { opacity: 1; } 62.5% { opacity: .707; } 66.67% { opacity: 0; }
    70.83% { opacity: .707; } 75% { opacity: 1; } 79.17% { opacity: .707; } 83.33% { opacity: 0; } 87.5% { opacity: .707; } 91.67% { opacity: 1; } 95.83% { opacity: .707; } 100% { opacity: 0; } }
  .sl .lights { display: flex; justify-content: space-between; margin: 0 4px 9px 4px; }
  .sl .lights div { width: 9px; height: 9px; border-radius: 5px; background-color: #5a1a20; }
  .sl .lights div.lit { background-color: #ffd60a; }
  /* spinning: chase advances 14 steps/s, bulb i is lit while floor(chase) ≡ i (mod 3) — one 3-step cycle is 214.3 ms */
  .sl .lights.run div { animation: chase 214.3ms step-end infinite; }
  .sl .lights.run div:nth-child(3n+2) { animation-delay: 71.4ms; }
  .sl .lights.run div:nth-child(3n+3) { animation-delay: 142.9ms; }
  @keyframes chase { 0% { background-color: #ffd60a; } 33.33% { background-color: #5a1a20; } 100% { background-color: #5a1a20; } }
  /* win flash: even bulbs lit while flash.a > 0.5, odd ones otherwise; the unlit colour is mix(#5a1a20, #ffd60a, a / 2); one hump of |sin| per iteration */
  .sl .lights.flash-2 div:nth-child(odd) { animation: bulb-even 350ms linear 2; }
  .sl .lights.flash-2 div:nth-child(even) { animation: bulb-odd 350ms linear 2; }
  .sl .lights.flash-6 div:nth-child(odd) { animation: bulb-even 266.67ms linear 6; }
  .sl .lights.flash-6 div:nth-child(even) { animation: bulb-odd 266.67ms linear 6; }
  @keyframes bulb-even { 0% { background-color: #5a1a20; } 16.6% { background-color: rgb(131,73,27); } 16.7% { background-color: #ffd60a; } 83.3% { background-color: #ffd60a; } 83.4% { background-color: rgb(131,73,27); } 100% { background-color: #5a1a20; } }
  @keyframes bulb-odd { 0% { background-color: #ffd60a; } 16.6% { background-color: #ffd60a; } 16.7% { background-color: rgb(131,73,27); } 50% { background-color: rgb(173,120,21); } 83.3% { background-color: rgb(131,73,27); } 83.4% { background-color: #ffd60a; } 100% { background-color: #ffd60a; } }
  .sl .reels { display: flex; justify-content: space-between; }
  .sl .reel { width: 88px; height: 76px; overflow: hidden; border-radius: 10px; background: linear-gradient(180deg, #d8d8d8, #ffffff 30%, #ffffff 70%, #d8d8d8); text-align: center; }
  .sl .reel div { font-size: 44px; line-height: 76px; height: 76px; }
  /* animate(1100 + i·450, …, ease.outBack): the symbol strip scrolls from the old position to the goal, overshooting a little */
  .sl .reel .strip { height: auto; line-height: normal; }
  .sl .msg { text-align: center; margin-top: 10px; height: 24px; line-height: 24px; font-weight: 800; color: #ffffff; }
  /* msgPop: tween(msgPop, {s: 1}, 700, ease.outElastic) from 0.3 at start; tween(msgPop, {s: 1}, 500, ease.outBack) from 1.5 on a win */
  .sl .msg.in { animation: msg-in 700ms linear(0,0.272,0.646,1,1.25,1.364,1.354,1.257,1.125,1,0.912,0.871,0.875,0.909,0.956,1,1.031,1.046,1.044,1.032,1.016,1,0.989,0.984,0.984,0.989,0.994,1,1.004,1.006,1.006,1.004,1.002,1,0.999,0.998,0.998,0.999,0.999,1,1); }
  .sl .msg.pop { animation: msg-pop 500ms cubic-bezier(.34,1.56,.64,1); }
  @keyframes msg-in { from { transform: scale(0.3); } to { transform: scale(1); } }
  @keyframes msg-pop { from { transform: scale(1.5); } to { transform: scale(1); } }
  /* coin rain: x moves linearly, y falls under gravity (vy += 500/s) — each coin gets its exact quadratic as a cubic-bezier */
  .sl .coin { position: absolute; font-size: 18px; pointer-events: none; }
  .sl .coin span { display: inline-block; }
  .sl .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .sl .bet { display: flex; align-items: center; }
  .sl .bet button { width: 28px; padding: 3px 0; }
  .sl .bet b { width: 34px; text-align: center; }
  /* tween(betPop, {s: 1}, 380, ease.outBack) from 1.5 */
  .sl .bet b.pop { animation: bet-pop 380ms cubic-bezier(.34,1.56,.64,1); }
  @keyframes bet-pop { from { transform: scale(1.5); } to { transform: scale(1); } }
  .sl .lnk { font-size: 12px; }
  .sl .lnk:hover { text-decoration: underline; }
  .sl .pay { margin-top: 8px; }
  .sl .pay div { display: flex; justify-content: space-between; padding: 3px 2px; font-size: 12.5px; border-top: 1px solid rgba(127,127,127,0.16); }
  /* transition('pop' | 'slide-down' | 'slide-up') on the bubble */
  .tr-pop { animation: tr-pop 320ms cubic-bezier(.34,1.56,.64,1); }
  .tr-slide-down { animation: tr-slide-down 300ms cubic-bezier(.33,1,.68,1); }
  .tr-slide-up { animation: tr-slide-up 300ms cubic-bezier(.33,1,.68,1); }
  @keyframes tr-pop { from { opacity: 0; transform: scale(0.94); } }
  @keyframes tr-slide-down { from { opacity: 0; transform: translateY(-14px); } }
  @keyframes tr-slide-up { from { opacity: 0; transform: translateY(14px); } }
</style>
<div class="card pad sl" id="w">
  <div class="wrap" id="wrap"><div class="machine"><div class="glow" id="glow"></div>
      <div class="lights" id="lights"></div>
      <div class="reels" id="reels"></div>
      <div class="msg" id="msg">Pull to play</div>
    </div></div>
  <div class="foot"><span>🪙 <b id="coins">100</b></span>
    <span class="bet"><span class="small muted">Bet&nbsp;</span><button data-action="bet" data-value="-1">−</button><b id="bet">5</b><button data-action="bet" data-value="1">+</button>&nbsp;<a class="lnk" href="#" data-action="bet" data-value="max">max</a></span>
    <button class="primary" id="spin" data-action="spin" style="background-color: #ff3b30">SPIN · 5</button></div>
  <div class="row between" style="margin-top: 6px"><span class="tiny muted" id="hint">Three of a kind pays ×10 or more</span><a class="lnk" href="#" data-action="pay" id="paylnk">Paytable ▾</a></div>
  <div class="pay" id="pay" hidden>
    <div><span>7️⃣ 7️⃣ 7️⃣</span><b>×50</b></div><div><span>💎 💎 💎</span><b>×25</b></div><div><span>⭐️ ⭐️ ⭐️</span><b>×15</b></div>
    <div><span>Any three of a kind</span><b>×10</b></div><div><span>Any pair</span><b>×2</b></div>
    <div class="muted"><span id="paystat">0 spins · biggest win 0</span><span>&nbsp;</span></div></div>
</div>
<script>
const SYM = ['🍒', '🍋', '🔔', '⭐️', '🍇', '7️⃣', '💎'];
const PAY = { '7️⃣': 50, '💎': 25, '⭐️': 15 }, BETS = [1, 2, 5, 10, 25], BULBS = 11;
let pos = [0, 2, 4], spinning = false, coins = 100, bi = 2, spins = 0, bestWin = 0, paytable = false;
let chase = 0, big = false, spinStart = 0;
const shown = { v: 100 };

const root = document.getElementById('w');
const $ = id => document.getElementById(id);
const ease = { outCubic: t => 1 - Math.pow(1 - t, 3) };
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function bubble(kind, target = $('msg')) {
  for (const c of [...target.classList]) if (c.startsWith('tr-')) target.classList.remove(c);
  void target.offsetWidth;
  target.classList.add('tr-' + kind);
}
function animate(duration, onFrame, easing) {
  const start = performance.now();
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / Math.max(1, duration));
    onFrame(easing(t), t);
    if (t < 1) requestAnimationFrame(step);
  };
  step();
}
// animated coin counter: tween(shown, {v: coins}, ms, ease.outCubic)
let countId = 0;
function count(ms) {
  const from = shown.v, to = coins, me = ++countId;
  animate(ms, p => { if (me !== countId) return; shown.v = from + (to - from) * p; $('coins').textContent = Math.round(shown.v); }, ease.outCubic);
}

$('lights').innerHTML = Array.from({ length: BULBS }, () => '<div></div>').join('');
const bulbs = Array.from($('lights').children);
function lights() { bulbs.forEach((b, i) => b.classList.toggle('lit', (Math.floor(chase) - i) % 3 === 0)); }
lights();

const sym = k => SYM[(k % SYM.length + SYM.length) % SYM.length];
$('reels').innerHTML = pos.map(() => '<div class="reel"><div class="strip"></div></div>').join('');
const strips = Array.from($('reels').querySelectorAll('.strip'));
function still() {
  strips.forEach((s, i) => { s.style.transition = 'none'; s.style.transform = 'translateY(0)'; s.innerHTML = `<div>${sym(pos[i])}</div><div>${sym(pos[i] + 1)}</div>`; });
}
still();

function ui() {
  const bet = BETS[bi], broke = coins < BETS[0];
  $('bet').textContent = bet;
  const b = $('spin');
  b.style.backgroundColor = spinning ? '#8e8e93' : broke ? '#34c759' : '#ff3b30';
  b.textContent = spinning ? 'Spinning…' : broke ? '↻ Refill' : `SPIN · ${bet}`;
  $('hint').textContent = big ? '🎉 Big win!' : 'Three of a kind pays ×10 or more';
  $('paylnk').textContent = `Paytable ${paytable ? '▴' : '▾'}`;
  $('paystat').textContent = `${spins} spins · biggest win ${bestWin}`;
}

function spin() {
  const bet = BETS[bi];
  if (spinning || coins < bet) return;
  spinning = true; spins++; big = false;
  coins -= bet; $('msg').textContent = '';
  count(300);
  let result = [0, 1, 2].map(() => Math.floor(Math.random() * SYM.length));
  if (Math.random() < 0.16) result = [result[0], result[0], result[0]];
  else if (Math.random() < 0.3) result[1] = result[0];
  const from = pos.slice();
  const goals = result.map((r, i) => Math.ceil(from[i] / SYM.length) * SYM.length + (3 + i) * SYM.length + r);
  strips.forEach((s, i) => {
    const n = goals[i] - from[i];
    s.style.transition = 'none'; s.style.transform = 'translateY(0)';
    s.innerHTML = Array.from({ length: n + 7 }, (_, j) => `<div>${sym(from[i] + j)}</div>`).join('');
  });
  void root.offsetWidth;
  strips.forEach((s, i) => { s.style.transition = `transform ${1100 + i * 450}ms cubic-bezier(.34,1.56,.64,1)`; s.style.transform = `translateY(${-(goals[i] - from[i]) * 76}px)`; });
  spinStart = performance.now();
  $('lights').classList.remove('flash-2', 'flash-6');
  $('lights').classList.add('run');
  setTimeout(() => settle(result, goals), 1100 + 2 * 450);
  ui();
}

function settle(result, goals) {
  pos = goals.map(g => g % SYM.length);
  still();
  spinning = false;
  chase += 14 * (performance.now() - spinStart) / 1000;
  $('lights').classList.remove('run');
  lights();
  const [a, b, c] = result, bet = BETS[bi];
  const mult = a === b && b === c ? PAY[SYM[a]] || 10 : a === b || b === c || a === c ? 2 : 0;
  if (mult) {
    const win = bet * mult;
    coins += win;
    bestWin = Math.max(bestWin, win);
    big = mult >= 10;
    $('msg').textContent = big ? `JACKPOT ${SYM[a]}${SYM[a]}${SYM[a]} +${win}` : `Pair! +${win}`;
    $('msg').classList.remove('in');
    restart($('msg'), 'pop');
    count(big ? 1200 : 600);
    const humps = big ? 6 : 2;
    restart($('glow'), 'pulse-' + humps);
    restart($('lights'), 'flash-' + humps);
    setTimeout(() => $('lights').classList.remove('flash-' + humps), big ? 1600 : 700);
    if (big) rain();
  } else $('msg').textContent = ['So close…', 'Nothing this time', 'Try again'][spins % 3];
  if (coins < BETS[bi]) bi = Math.max(0, BETS.filter(x => x <= coins).length - 1);
  ui();
}

function rain() {
  const wrap = $('wrap'), coinsEls = [];
  for (let k = 0; k < 24; k++) {
    const x = 10 + Math.random() * 270, y = -20 - Math.random() * 120, vx = (Math.random() - 0.5) * 40, vy = 40 + Math.random() * 80;
    const d = 190 - y, T = (-vy + Math.sqrt(vy * vy + 1000 * d)) / 500, a = vy * T / d;   // 250·T² + vy·T = d; y/d = a·s + (1 − a)·s²
    const el = document.createElement('div');
    el.className = 'coin';
    el.style.cssText = `left: ${x.toFixed(0)}px; top: ${y.toFixed(0)}px; transition: transform ${(T * 1000).toFixed(0)}ms linear`;
    el.innerHTML = `<span style="transition: transform ${(T * 1000).toFixed(0)}ms cubic-bezier(.333,${(a / 3).toFixed(3)},.667,${((a + 1) / 3).toFixed(3)})">🪙</span>`;
    wrap.appendChild(el);
    coinsEls.push([el, vx * T, d, T]);
  }
  void wrap.offsetWidth;
  for (const [el, dx, dy, T] of coinsEls) {
    el.style.transform = `translateX(${dx.toFixed(1)}px)`;
    el.firstChild.style.transform = `translateY(${dy.toFixed(1)}px)`;
    setTimeout(() => el.remove(), T * 1000);
  }
}

root.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  const name = el.dataset.action, value = el.dataset.value;
  if (name === 'spin') {
    if (coins < BETS[0] && !spinning) {
      bubble('pop');
      coins = 100; $('msg').textContent = 'Refilled 🪙 Pull to play';
      count(700);
      return ui();
    }
    return spin();
  }
  if (name === 'bet' && !spinning) {
    const next = value === 'max' ? Math.max(0, BETS.filter(x => x <= coins).length - 1) : clamp(bi + Number(value), 0, BETS.length - 1);
    if (next === bi || BETS[next] > coins) return;
    bi = next;
    restart($('bet'), 'pop');
    return ui();
  }
  if (name === 'pay') { paytable = !paytable; $('pay').hidden = !paytable; ui(); }
});
// intro: the message springs in and the bulbs sweep once (chase 0 → 11 over 800 ms outCubic)
setTimeout(() => {
  restart($('msg'), 'in');
  chase = 0;
  animate(800, p => { chase = p * 11; lights(); }, ease.outCubic);
}, 250);
</script>
