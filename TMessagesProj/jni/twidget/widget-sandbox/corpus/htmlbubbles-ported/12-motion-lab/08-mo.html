<!--
  source: Telegram macOS 12.10 (283300), 12-motion-lab.chat, message 8
  author: mo 14:07
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d); --kbd: light-dark(#f2f2f7, #2c2c2e); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  p { margin: 0 0 8px 0; }
  code { font-family: ui-monospace, monospace; font-size: 13px; background-color: var(--kbd); padding: 1px 4px; border-radius: 4px; }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  [data-action] { cursor: pointer; }
  .ai-acts { margin-top: 2px; }
  .ai-acts span { display: inline-block; padding: 1px 8px; margin: 0 4px 2px 0; border-radius: 8px; font-size: 12px; font-weight: 600; background-color: rgba(127,127,127,0.12); }
  .ai-acts span:hover { background-color: rgba(127,127,127,0.24); }
  .ai-acts span.on { background-color: rgba(255,159,10,0.24); }
  .ai-acts span.off, .ai-acts span.off:hover, .ai-acts span.pg, .ai-acts span.pg:hover { background-color: rgba(127,127,127,0); color: #8e8e93; }
  /* tween(thumb, {s: 1}, 420, ease.outBack) from 1.6 */
  .ai-acts span.pop { animation: thumb 420ms cubic-bezier(.34,1.56,.64,1); }
  @keyframes thumb { from { transform: scale(1.6); } to { transform: scale(1); } }
  /* mix('#8e8e93', '#ff9f0a', 0.5 + 0.5 * sin(now / 160)): a 1005 ms sine between the two colours */
  .think { animation: think 503ms ease-in-out infinite alternate; }
  @keyframes think { from { color: #8e8e93; } to { color: #ff9f0a; } }
  /* caret: 400 ms on, 400 ms off */
  .caret { color: #ff9f0a; animation: blink 800ms linear infinite; }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  /* transition('fade' | 'slide-left' | 'slide-right') on the bubble */
  .tr-fade { animation: tr-fade 260ms ease-out; }
  .tr-slide-left { animation: tr-slide-left 300ms cubic-bezier(.33,1,.68,1); }
  .tr-slide-right { animation: tr-slide-right 300ms cubic-bezier(.33,1,.68,1); }
  @keyframes tr-fade { from { opacity: 0; } }
  @keyframes tr-slide-left { from { opacity: 0; transform: translateX(28px); } }
  @keyframes tr-slide-right { from { opacity: 0; transform: translateX(-28px); } }
</style>
<div id="w">
  <p id="out">Typing…</p>
  <div class="ai-acts" id="acts"></div>
</div>
<script>
const ANSWERS = [
  "Sure! This bubble re-renders itself every frame: <b>render()</b> returns a slightly longer string each time, and LiteChat lays out a fresh litehtml document. The bubble grows line by line, so the transcript re-flows around it, <i>just like a streamed reply</i>. ✨",
  "Yes. Nothing comes from a server here: a <code>requestAnimationFrame</code> loop reveals a few more characters on every frame, up to 60 times a second, and <b>render()</b> closes any tag that is cut in half. Press <b>Stop</b> and the loop simply ends.",
  "Short version: <b>state → render() → HTML</b>. The script keeps a cursor into the answer and moves it forward each frame, so the bubble's height follows the text. <i>Regenerate</i> starts another draft, and the arrows flip between drafts with a native slide. 🙂",
];
const tokenize = text => text.match(/<[^>]+>|&[a-z]+;|[\s\S]/gu);
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
let drafts = [], cur = 0, phase = 'idle', run = 0, think0 = 0;

const root = document.getElementById('w'), out = document.getElementById('out'), acts = document.getElementById('acts');
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function bubble(kind) {
  for (const c of [...root.classList]) if (c.startsWith('tr-')) root.classList.remove(c);
  void root.offsetWidth;
  root.classList.add('tr-' + kind);
}

function stream() {
  const me = ++run, d = drafts[cur];
  phase = 'thinking';
  think0 = performance.now();
  showThinking();
  let dots = 1, shown = -1;
  const f = t => {
    if (me !== run) return;
    if (phase === 'thinking') {
      const n = 1 + Math.floor((t - think0) / 220) % 3;
      if (n !== dots) { dots = n; out.querySelector('#dots').textContent = '.'.repeat(n); }
      if (t - think0 > 650) { phase = 'typing'; d.t0 = t; showTyping(d); }
    }
    if (phase === 'typing') {
      d.shown = Math.min(d.chars, Math.floor((t - d.t0) / 20));
      if (d.shown !== shown) { shown = d.shown; out.querySelector('#txt').innerHTML = cut(d); }
      if (d.shown >= d.chars) { phase = 'done'; showDone(d); return; }
    }
    requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}
function newDraft() {
  const idx = drafts.length ? (drafts[drafts.length - 1].idx + 1) % ANSWERS.length : 0;
  const tokens = tokenize(ANSWERS[idx]);
  drafts.push({ idx, tokens, chars: tokens.filter(t => t[0] !== '<').length, shown: 0, t0: 0, stopped: false, vote: null });
  if (drafts.length > 5) drafts.shift();
  cur = drafts.length - 1;
  stream();
}
setTimeout(newDraft, 250);

function cut(d) {
  let n = 0, out = '';
  const open = [];
  for (const t of d.tokens) {
    if (t[0] === '<') {
      if (t[1] === '/') open.pop(); else open.push(t.slice(1).split(/[\s>]/)[0]);
      out += t;
      continue;
    }
    if (n >= d.shown) break;
    n++;
    out += t;
  }
  return out + open.reverse().map(tag => `</${tag}>`).join('');
}

function showThinking() {
  out.className = 'think';
  out.innerHTML = 'Thinking<span id="dots">.</span>';
  acts.innerHTML = '<span data-action="stop">■ Stop</span>';
}
function showTyping(d) {
  out.className = '';
  out.innerHTML = `<span id="txt">${cut(d)}</span><span class="caret">▍</span>`;
  acts.innerHTML = '<span data-action="stop">■ Stop</span>';
}
function showDone(d) {
  out.className = '';
  out.innerHTML = `<span id="txt">${cut(d)}</span>${d.stopped ? ' <span class="small muted">(stopped)</span>' : ''}`;
  const pager = drafts.length > 1 ? `<span class="${cur ? '' : 'off'}" ${cur ? 'data-action="page" data-value="-1"' : ''}>‹</span><span class="pg">${cur + 1} / ${drafts.length}</span><span class="${cur < drafts.length - 1 ? '' : 'off'}" ${cur < drafts.length - 1 ? 'data-action="page" data-value="1"' : ''}>›</span>` : '';
  const thumbBtn = (v, icon) => `<span class="${d.vote === v ? 'on' : ''}" data-action="vote" data-value="${v}">${icon}</span>`;
  acts.innerHTML = `<span data-action="regen">↻ Regenerate</span>${pager}${thumbBtn('up', '👍')}${thumbBtn('down', '👎')}`;
}

root.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const name = el.dataset.action, value = el.dataset.value;
  const busy = phase === 'thinking' || phase === 'typing';
  if (name === 'stop' && busy) { run++; drafts[cur].stopped = true; phase = 'done'; showDone(drafts[cur]); return; }
  if (busy) return;
  if (name === 'regen') { bubble('fade'); return newDraft(); }
  if (name === 'page') {
    const next = clamp(cur + Number(value), 0, drafts.length - 1);
    if (next === cur) return;
    bubble(next > cur ? 'slide-left' : 'slide-right');
    cur = next;
    showDone(drafts[cur]);
    return;
  }
  if (name === 'vote') {
    const d = drafts[cur];
    d.vote = d.vote === value ? null : value;
    for (const s of acts.querySelectorAll('[data-action="vote"]')) {
      const on = s.dataset.value === d.vote;
      s.classList.toggle('on', on);
      if (on) restart(s, 'pop'); else s.classList.remove('pop');
    }
  }
});
</script>
