<!--
  source: Telegram macOS 12.10 (283300), 06-trip-lisbon.chat, message 12
  author: ana 09:10
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --blue: #007aff; --blue-h: #0a6ee0; --orange: #ff9500; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  [hidden] { display: none !important; }
  .fg { color: var(--fg); } .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
  .row { display: flex; align-items: center; } .grow { flex-grow: 1; min-width: 0; } .center { text-align: center; }
  .t-orange { color: var(--orange); }
  button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 5px 13px; border: 0; border-radius: 9px; background-color: rgba(127,127,127,0.16); color: var(--fg); text-align: center; cursor: pointer; }
  button:hover { background-color: rgba(127,127,127,0.28); }
  button.primary { background-color: var(--blue); color: #ffffff; } button.primary:hover { background-color: var(--blue-h); }
  button:active { background-color: rgba(127,127,127,0.40); } button.primary:active { background-color: var(--blue-h); }
  .cat, .pr, .qcard, .close { cursor: pointer; }

  .pb { width: 100%; box-sizing: border-box; }
  .pb #v-list, .pb #v-quiz, .pb #v-done, .pb #rows { width: 100%; box-sizing: border-box; }
  .pb .cats { display: flex; margin: 8px 0 6px 0; }
  .pb .cat { flex: 1; min-width: 0; box-sizing: border-box; text-align: center; padding: 3px 0; margin-right: 4px; border-radius: 8px; font-size: 12px; font-weight: 600; background-color: rgba(127,127,127,0.12); }
  .pb .cat:last-child { margin-right: 0; }
  .pb .cat:hover { background-color: rgba(127,127,127,0.24); }
  .pb .cat.on { background-color: #ff9500; color: #ffffff; }
  .pb .pr { width: 100%; box-sizing: border-box; padding: 5px 8px; border-bottom: 1px solid rgba(127,127,127,0.2); border-radius: 6px; }
  .pb .pr:hover { background-color: rgba(255,149,0,0.15); }
  .pb .pr.on { background-color: rgba(255,149,0,0.08); }
  .pb .rv { display: none; }
  .pb .rvi { padding-top: 3px; }
  .pb .pr.on .rv { display: block; }
  .pb .say { font-style: italic; color: #8e8e93; font-size: 13px; }
  .pb .lbar { height: 4px; border-radius: 2px; margin-top: 3px; background-color: rgba(127,127,127,0.2); }
  .pb .lbar div { height: 4px; border-radius: 2px; width: 0; background-color: #ff9500; transition: width 500ms cubic-bezier(.33,1,.68,1); }
  .pb .qcard { height: 132px; width: 330px; margin: 8px auto 10px auto; border-radius: 14px; overflow: hidden; color: #ffffff; text-align: center; background: linear-gradient(135deg, #ff9500, #ff2d55); }
  .pb .qcard.back { background: linear-gradient(135deg, #0a84ff, #5e5ce6); }
  .pb .qin { width: 330px; padding-top: 26px; }
  .pb .qtag { font-size: 11px; font-weight: 700; text-transform: uppercase; color: rgba(255,255,255,0.75); }
  .pb .qbig { font-size: 22px; font-weight: 800; margin: 8px 0 6px 0; }
  .pb .qsay { font-size: 14px; font-style: italic; color: rgba(255,255,255,0.9); }
  .pb .qcard b.t-orange { color: #ffd60a; }
  .pb .qd { display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin-left: 4px; }
  .pb .qscore { font-size: 40px; font-weight: 800; color: #ff9500; }
  .pb .close { margin-left: 10px; padding: 2px 6px; border-radius: 6px; }
  .pb .close:hover { background-color: rgba(127,127,127,0.18); }

  .tr-pop { animation: tr-pop 300ms cubic-bezier(.33,1,.68,1); }
  .tr-slide-left { animation: tr-slide-left 280ms cubic-bezier(.33,1,.68,1); }
  .tr-slide-right { animation: tr-slide-right 280ms cubic-bezier(.33,1,.68,1); }
  @keyframes tr-pop { from { opacity: 0; transform: scale(.94); } }
  @keyframes tr-slide-left { from { opacity: 0; transform: translateX(24px); } }
  @keyframes tr-slide-right { from { opacity: 0; transform: translateX(-24px); } }
</style>
<div class="pb" id="root">
  <div id="v-list">
    <div class="row"><b class="grow">Survival Portuguese 🇵🇹</b><span class="tiny muted">hover a row, tap to reveal</span></div>
    <div class="cats" id="cats"></div>
    <div id="rows"></div>
    <div class="row" style="margin-top: 8px"><div class="grow" style="margin-right: 10px"><div class="tiny muted">Learned <span id="learned">0</span> / 12</div><div class="lbar"><div id="lbar"></div></div></div>
      <button id="all">Reveal all</button>&nbsp;<button class="primary" id="quiz">🎯 Quiz me</button></div>
  </div>
  <div id="v-quiz" hidden>
    <div class="row"><b class="grow" id="q-title"></b><span id="dots"></span><span class="tiny muted close" id="exit">✕ Close</span></div>
    <div class="qcard" id="qcard"><div class="qin" id="qin"></div></div>
    <div class="center" id="q-btns"></div>
  </div>
  <div class="center" id="v-done" hidden>
    <div class="tiny muted" style="margin-top: 4px">QUIZ DONE</div>
    <div class="qscore" id="score"></div>
    <div><b id="msg"></b></div>
    <div class="small muted" style="margin-top: 2px" id="d-learned"></div>
    <div style="margin-top: 10px"><button id="exit2">‹ Phrases</button>&nbsp;<button class="primary" id="again">↻ Again</button></div>
  </div>
</div>
<script>
const CATS = [['all', 'All'], ['basics', '👋 Basics'], ['food', '☕ Food'], ['around', '🧭 Around']];
const PH = [
  { c: 'basics', pt: 'Olá / Bom dia', say: 'oh-LAH / bong DEE-ah', en: 'Hi / Good morning' },
  { c: 'basics', pt: 'Obrigado / Obrigada', say: 'oh-bree-GAH-doo / -dah', en: 'Thank you (m / f)' },
  { c: 'basics', pt: 'Por favor', say: 'poor fah-VOR', en: 'Please' },
  { c: 'basics', pt: 'Desculpe', say: 'desh-KOOL-peh', en: 'Excuse me / sorry' },
  { c: 'food', pt: 'Uma bica, por favor', say: 'OO-mah BEE-kah', en: 'An espresso, please' },
  { c: 'food', pt: 'Uma mesa para três', say: 'OO-mah MEH-zah PAH-rah TRESH', en: 'A table for three' },
  { c: 'food', pt: 'A conta, por favor', say: 'ah KON-tah', en: 'The bill, please' },
  { c: 'food', pt: 'Saúde! 🥂', say: 'sah-OO-deh', en: 'Cheers!' },
  { c: 'around', pt: 'Onde fica…?', say: 'ON-deh FEE-kah', en: 'Where is…?' },
  { c: 'around', pt: 'Quanto custa?', say: 'KWAN-too KOOSH-tah', en: 'How much is it?' },
  { c: 'around', pt: 'Fala inglês?', say: 'FAH-lah een-GLAYSH', en: 'Do you speak English?' },
  { c: 'around', pt: 'Não percebo', say: 'nowng per-SEH-boo', en: "I don't understand" },
];
const CW = 330;
let cat = 'all', mode = 'list', deck = [], marks = [], qi = 0, flipped = false, flipping = false, qrun = 0, flipV = 0;
const open = new Set(), seen = new Set();

const $ = id => document.getElementById(id);
const root = $('root');
const ease = { outCubic: t => 1 - Math.pow(1 - t, 3), inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2 };
const animate = (duration, onFrame, easing) => new Promise(resolve => {
  const start = performance.now();
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / Math.max(1, duration));
    onFrame(easing(t), t);
    if (t < 1) requestAnimationFrame(step); else resolve();
  };
  step();
});
const esc = v => String(v === undefined || v === null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const stress = s => esc(s).replace(/[A-Z]{2,}/g, m => `<b class="t-orange">${m}</b>`);
const visible = () => PH.map((p, i) => i).filter(i => cat === 'all' || PH[i].c === cat);


// --- list ---
function renderCats() {
  $('cats').innerHTML = CATS.map(([k, label]) => `<div class="cat ${k === cat ? 'on' : 'fg'}" data-cat="${k}">${label}</div>`).join('');
}
function renderRows(intro) {
  $('rows').innerHTML = visible().map((i, k) => {
    const p = PH[i];
    return `<div class="pr${open.has(i) ? ' on' : ''}${intro ? ' in' : ''}" data-row="${i}" style="transition-delay: ${intro ? k * 45 : 0}ms">
      <div class="row"><b class="grow">${esc(p.pt)}</b><span class="tiny muted arrow">${open.has(i) ? '▴' : seen.has(i) ? '✓ ▾' : '▾'}</span></div>
      <div class="rv"><div class="rvi"><div class="say">🗣 ${stress(p.say)}</div><div class="small">${esc(p.en)}</div></div></div></div>`;
  }).join('');
  renderFooter();
}
function renderFooter() {
  const list = visible();
  $('learned').textContent = seen.size;
  $('lbar').style.width = (seen.size / PH.length * 100).toFixed(1) + '%';
  $('all').textContent = list.every(i => open.has(i)) ? 'Hide all' : 'Reveal all';
}
function reveal(i, on) {
  if (on) { open.add(i); seen.add(i); } else open.delete(i);
  const row = $('rows').querySelector(`.pr[data-row="${i}"]`);
  if (row) {
    row.classList.toggle('on', on);
    row.querySelector('.arrow').textContent = on ? '▴' : seen.has(i) ? '✓ ▾' : '▾';
  }
  renderFooter();
}
function showMode() {
  $('v-list').hidden = mode !== 'list';
  $('v-quiz').hidden = mode !== 'quiz';
  $('v-done').hidden = mode !== 'done';
}

// --- quiz ---
function startQuiz() {
  const pool = visible();
  for (let k = pool.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [pool[k], pool[j]] = [pool[j], pool[k]]; }
  deck = pool.slice(0, 5); marks = []; qi = 0; flipped = false; flipping = false; qrun++; flipV = 0;
  mode = 'quiz';
  renderCard(); showMode();
}
function renderFace(back) {
  const p = PH[deck[qi]];
  $('qcard').classList.toggle('back', back);
  $('qin').innerHTML = back
    ? `<div class="qtag">It means</div><div class="qbig">${esc(p.en)}</div><div class="qsay">🗣 ${stress(p.say)}</div>`
    : `<div class="qtag">What does this mean?</div><div class="qbig">${esc(p.pt)}</div><div class="qtag">tap the card to flip</div>`;
}
function setFlipWidth(t) {
  const w = Math.max(2, Math.round(CW * Math.abs(Math.cos(Math.PI * t))));
  $('qcard').style.width = w + 'px';
  $('qin').style.marginLeft = Math.round((w - CW) / 2) + 'px';
}
function renderButtons() {
  $('q-btns').innerHTML = flipped && !flipping
    ? '<button data-answer="no">✗ Again</button>&nbsp;<button class="primary" data-answer="yes">✓ Knew it</button>'
    : '<button class="primary" id="flip">Flip card</button>';
}
function renderCard() {
  $('q-title').textContent = `🎯 Quiz · card ${qi + 1} of ${deck.length}`;
  $('dots').innerHTML = deck.map((_, k) => `<span class="qd" style="background-color: ${k < marks.length ? (marks[k] ? '#34c759' : '#ff3b30') : k === qi ? '#ff9500' : 'rgba(127,127,127,0.3)'}"></span>`).join('');
  renderFace(flipV >= 0.5);
  setFlipWidth(flipV);
  renderButtons();
}
async function flip() {
  if (flipping || mode !== 'quiz') return;
  const me = qrun;
  flipping = true; renderButtons();
  const from = flipV, to = flipped ? 0 : 1;
  let back = from >= 0.5;
  await animate(560, p => {
    if (me !== qrun) return;
    flipV = from + (to - from) * p;
    const b = flipV >= 0.5;
    if (b !== back) { back = b; renderFace(back); }
    setFlipWidth(flipV);
  }, ease.inOutSine);
  if (me !== qrun) return;
  flipped = !flipped; flipping = false; renderButtons();
}
function answer(ok) {
  if (!flipped || flipping) return;
  marks.push(ok);
  if (ok) seen.add(deck[qi]);
  qrun++;
  if (qi + 1 >= deck.length) {
    mode = 'done'; showMode();
    const right = marks.filter(Boolean).length;
    $('msg').textContent = right === deck.length ? 'Perfeito! 🏆' : right >= deck.length - 1 ? 'Muito bem! 🎉' : 'Quase! Keep practising 💪';
    $('d-learned').textContent = `Learned ${seen.size} of ${PH.length} phrases so far`;
    animate(800, p => { $('score').textContent = `${Math.round(right * p)} / ${deck.length}`; }, ease.outCubic);
  } else {
    qi++; flipped = false; flipV = 0;
    renderCard();
  }
}

renderCats(); renderRows(true); showMode();
// intro: 250 ms in, the rows slide to their place 45 ms apart

root.addEventListener('click', e => {
  const t = e.target;
  const c = t.closest('[data-cat]');
  if (c) {
    const v = c.dataset.cat;
    if (v === cat) return;
    const order = CATS.map(x => x[0]);
    cat = v; renderCats(); renderRows(false);
    return;
  }
  const r = t.closest('[data-row]');
  if (r) { const i = Number(r.dataset.row); reveal(i, !open.has(i)); return; }
  if (t.closest('#all')) {
    const list = visible(), on = list.some(i => !open.has(i));
    list.forEach(i => reveal(i, on));
    return;
  }
  if (t.closest('#quiz') || t.closest('#again')) { startQuiz(); return; }
  if (t.closest('#flip') || t.closest('#qcard')) { flip(); return; }
  const a = t.closest('[data-answer]');
  if (a) { answer(a.dataset.answer === 'yes'); return; }
  if (t.closest('#exit') || t.closest('#exit2')) {
    mode = 'list'; qrun++; flipping = false;
    renderRows(false); showMode();
  }
});
</script>
