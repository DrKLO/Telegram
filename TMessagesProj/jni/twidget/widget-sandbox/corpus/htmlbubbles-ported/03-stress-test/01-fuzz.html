<!--
  source: Telegram macOS 12.10 (283300), 03-stress-test.chat, message 1
  author: fuzz 11:00
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>[hidden]{display:none!important}
  :root { color-scheme: light dark; --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  [data-action] { cursor: pointer; }
  .ty { width: 360px; max-width: 100%; }
  .ty .tabs { display: flex; margin: 8px 0 8px 0; padding: 2px; border-radius: 9px; background-color: rgba(127,127,127,0.12); }
  .ty .tab { display: block; flex-grow: 1; text-align: center; padding: 3px 0; border-radius: 7px; font-size: 12px; font-weight: 600; color: #8e8e93; }
  .ty .tab:hover { background-color: rgba(127,127,127,0.14); }
  .ty .tab.on { background-color: #007aff; color: #ffffff; }
  .ty .stage { display: flex; align-items: center; height: 120px; overflow: hidden; padding: 0 12px; border-radius: 12px; background-color: rgba(127,127,127,0.10); }
  .ty .meta { font-family: ui-monospace, monospace; font-size: 11px; margin: 5px 2px 6px 2px; }
  .ty .opts { display: flex; align-items: center; margin: 5px 0; }
  .ty .lbl { display: block; width: 56px; font-size: 10px; font-weight: 700; text-transform: uppercase; color: #8e8e93; }
  .ty .sl { position: relative; width: 288px; height: 30px; }
  .ty .trk { height: 3px; margin-top: 6px; border-radius: 2px; background-color: rgba(127,127,127,0.25); }
  .ty .trk div { height: 3px; border-radius: 2px; background-color: #007aff; }
  .ty .th { position: absolute; top: 1px; width: 9px; height: 9px; border-radius: 7px; border: 2px solid #ffffff; background-color: #007aff; }
  .ty .cells { display: flex; margin-top: 6px; }
  .ty .cells span { display: block; text-align: center; font-size: 10px; border-radius: 5px; color: #8e8e93; }
  .ty .cells span:hover { background-color: rgba(0,122,255,0.12); color: #007aff; }
  .ty .cells span.on { color: #007aff; font-weight: 700; }
  .ty .fams { display: flex; flex-wrap: wrap; width: 300px; }
  .ty .chip2 { display: block; padding: 2px 8px; margin: 0 4px 4px 0; border-radius: 8px; font-size: 12px; background-color: rgba(127,127,127,0.12); }
  .ty .chip2:hover { background-color: rgba(127,127,127,0.24); }
  .ty .chip2.on { background-color: rgba(0,122,255,0.16); color: #007aff; }
  .ty .row2 { display: flex; align-items: center; padding: 3px 6px; border-radius: 8px; }
  .ty .row2:hover { background-color: rgba(127,127,127,0.12); }
  .ty .row2.on { background-color: rgba(0,122,255,0.12); }
  .ty .tag { display: block; width: 92px; font-family: ui-monospace, monospace; font-size: 10.5px; color: #8e8e93; }
  .ty .clip { white-space: nowrap; overflow: hidden; width: 244px; }
</style>
<div class="ty" id="ty">
  <div class="row between"><b>Aa Type specimen</b><span class="small muted" id="famName">System</span></div>
  <div class="tabs" id="tabs"><span class="tab on" data-action="tab" data-value="0">Specimen</span><span class="tab" data-action="tab" data-value="1">Scale</span><span class="tab" data-action="tab" data-value="2">Weights</span></div>
  <div id="specimen">
    <div class="stage"><div id="sample">The quick brown fox</div></div>
    <div class="meta muted" id="meta"></div>
    <div class="opts"><span class="lbl">Size</span><div class="sl" id="sizeSl"></div></div>
    <div class="opts"><span class="lbl">Weight</span><div class="sl" id="weightSl"></div></div>
    <div class="opts"><span class="lbl">Style</span><span class="chip2" id="tItalic" data-action="italic"><i>Italic</i></span><span class="chip2" id="tUpper" data-action="upper">UPPER</span><span class="chip2" id="tUnder" data-action="under"><u>Underline</u></span><span class="chip2" data-action="sample">↻ Sample</span></div>
    <div class="opts" style="align-items: flex-start"><span class="lbl" style="padding-top: 3px">Family</span><div class="fams" id="fams"></div></div>
  </div>
  <div id="scale" hidden></div>
  <div id="weights" hidden></div>
</div>
<script>
// Widget profile 1 has the system generic families only (named fonts are dropped by the validator):
// the original's Georgia, Avenir Next, Helvetica Neue and Menlo chips became the remaining generics.
const FAMILIES = [
  { name: 'System', css: 'system-ui, sans-serif' }, { name: 'Rounded', css: 'ui-rounded, sans-serif' }, { name: 'New York', css: 'ui-serif, serif' },
  { name: 'Serif', css: 'serif' }, { name: 'Sans', css: 'ui-sans-serif, sans-serif' }, { name: 'Sans-serif', css: 'sans-serif' },
  { name: 'Monospace', css: 'monospace' }, { name: 'SF Mono', css: 'ui-monospace, monospace' },
];
const SIZES = [9, 12, 15, 17, 20, 28, 36];
const WEIGHTS = ['Thin', 'Ultralight', 'Light', 'Regular', 'Medium', 'Semibold', 'Bold', 'Heavy', 'Black'];
const SAMPLES = ['The quick brown fox', 'Sphinx of black quartz', 'Hamburgefonstiv', 'Aa Gg Qq 0123', 'Heading 1'];
const SCALE = [
  { tag: 'h1', size: 22, weight: 700 }, { tag: 'h2', size: 19, weight: 700 }, { tag: 'h3', size: 17, weight: 700 },
  { tag: 'h4', size: 15, weight: 700 }, { tag: 'body', size: 13, weight: 400 }, { tag: 'small', size: 12, weight: 400 },
  { tag: 'caption', size: 9, weight: 600 },
];
const TRACK = 288;

// --- animation helpers (same formulas as the HTMLBubbles prelude) ---
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const animate = (duration, onFrame, easing) => new Promise(resolve => {
  const start = performance.now();
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / Math.max(1, duration));
    onFrame(easing(t), t);
    if (t < 1) requestAnimationFrame(step); else resolve();
  };
  step();
});
const tweens = new WeakMap();
function tween(target, props, duration, easing) {
  let owners = tweens.get(target);
  if (!owners) { owners = new Map(); tweens.set(target, owners); }
  const token = {}, from = {}, to = {};
  for (const key of Object.keys(props)) { from[key] = Number(target[key]) || 0; to[key] = Number(props[key]); owners.set(key, token); }
  return animate(duration, p => {
    for (const key in to) if (owners.get(key) === token) target[key] = from[key] + (to[key] - from[key]) * p;
    invalidate();
  }, easing).then(() => {
    for (const key in to) if (owners.get(key) === token) { target[key] = to[key]; owners.delete(key); }
    invalidate();
  });
}

// --- state ---
let tab = 0, fam = 0, sample = 0, italic = false, upper = false, under = false;
const v = { size: 9, weight: 100, wave: 1 };

const weightOf = w => clamp(Math.round(w / 100) * 100, 100, 900);
const px = s => Math.round(s * 2) / 2;
function setSize(s) { tween(v, { size: s }, 520, ease.outBack); }
function setWeight(w) { tween(v, { weight: w }, 480, ease.outCubic); }

// --- DOM ---
const $ = id => document.getElementById(id);
const root = $('ty'), famName = $('famName'), tabsEl = $('tabs'), sampleEl = $('sample'), metaEl = $('meta');
const panes = [$('specimen'), $('scale'), $('weights')];
const setText = (el, s) => { if (el.textContent !== s) el.textContent = s; };
const setStyle = (el, prop, val) => { if (el.style[prop] !== val) el.style[prop] = val; };

let panelAnimation = null;
function transition(kind, target = panes[tab]) {
  if (panelAnimation) panelAnimation.cancel();
  const from = kind === 'slide-left' ? 'translateX(6px)' : kind === 'slide-right' ? 'translateX(-6px)' : kind === 'slide-up' ? 'translateY(4px)' : kind === 'pop' ? 'scale(0.985)' : 'none';
  if (from === 'none') return;
  panelAnimation = target.animate([{ transform: from }, { transform: 'none' }], { duration: 140, easing: 'cubic-bezier(.2,.8,.2,1)' });
}

function buildSlider(el, stops, action) {
  const cell = TRACK / stops.length;
  el.innerHTML = `<div class="trk" style="margin-left: ${(cell / 2).toFixed(1)}px; width: ${(TRACK - cell).toFixed(1)}px"><div></div></div><div class="th"></div>` +
    `<div class="cells">${stops.map(s => `<span style="width: ${cell.toFixed(2)}px" data-action="${action}" data-value="${s}">${s}</span>`).join('')}</div>`;
  return { stops, cell, fill: el.querySelector('.trk div'), th: el.querySelector('.th'), cells: [...el.querySelectorAll('.cells span')] };
}
function syncSlider(sl, value) {
  const { stops, cell } = sl;
  let k = 0;
  if (value <= stops[0]) k = 0;
  else if (value >= stops[stops.length - 1]) k = stops.length - 1;
  else for (let i = 0; i < stops.length - 1; i++)
    if (value >= stops[i] && value <= stops[i + 1]) { k = i + (value - stops[i]) / (stops[i + 1] - stops[i]); break; }
  const x = k * cell;
  setStyle(sl.fill, 'width', x.toFixed(1) + 'px');
  setStyle(sl.th, 'left', (cell / 2 + x - 6.5).toFixed(1) + 'px');
  const near = stops.reduce((b, s, i) => Math.abs(s - value) < Math.abs(stops[b] - value) ? i : b, 0);
  sl.cells.forEach((c, i) => c.classList.toggle('on', i === near));
}
const sizeSl = buildSlider($('sizeSl'), SIZES, 'size');
const weightSl = buildSlider($('weightSl'), [100, 200, 300, 400, 500, 600, 700, 800, 900], 'weight');

$('fams').innerHTML = FAMILIES.map((f, i) => `<span class="chip2" style="font-family: ${f.css}" data-action="fam" data-value="${i}">${f.name}</span>`).join('');
const famChips = [...$('fams').children];
const toggles = { italic: $('tItalic'), upper: $('tUpper'), under: $('tUnder') };

$('scale').innerHTML = SCALE.map((s, i) => `<div class="row2" data-action="pick" data-value="${i}"><span class="tag">${s.tag} · ${s.size}</span>
  <div class="clip" style="font-weight: ${s.weight}; line-height: ${Math.round(s.size * 1.3)}px"></div></div>`).join('');
const scaleRows = [...$('scale').children];
$('weights').innerHTML = WEIGHTS.map((n, i) => `<div class="row2" data-action="pickw" data-value="${(i + 1) * 100}"><span class="tag">${(i + 1) * 100} ${n}</span>
  <div class="clip" style="font-size: 15px"></div></div>`).join('');
const weightRows = [...$('weights').children];

function sync() {
  const F = FAMILIES[fam], w = weightOf(v.weight), text = SAMPLES[sample];
  setText(famName, F.name);
  [...tabsEl.children].forEach((t, i) => t.classList.toggle('on', i === tab));
  panes.forEach((p, i) => { if (p.hidden !== (i !== tab)) p.hidden = i !== tab; });
  if (tab === 0) {
    const st = sampleEl.style;
    setStyle(sampleEl, 'fontFamily', F.css); setStyle(sampleEl, 'fontSize', px(v.size) + 'px'); setStyle(sampleEl, 'fontWeight', String(w));
    setStyle(sampleEl, 'lineHeight', '1.12');
    setStyle(sampleEl, 'fontStyle', italic ? 'italic' : ''); setStyle(sampleEl, 'textTransform', upper ? 'uppercase' : ''); setStyle(sampleEl, 'textDecoration', under ? 'underline' : '');
    setText(sampleEl, text);
    setText(metaEl, `${F.name} · ${Math.round(v.size)}px · ${w} ${WEIGHTS[w / 100 - 1]}${italic ? ' · italic' : ''}${upper ? ' · uppercase' : ''}`);
    syncSlider(sizeSl, v.size); syncSlider(weightSl, v.weight);
    toggles.italic.classList.toggle('on', italic); toggles.upper.classList.toggle('on', upper); toggles.under.classList.toggle('on', under);
    famChips.forEach((c, i) => c.classList.toggle('on', i === fam));
  } else if (tab === 1) {
    SCALE.forEach((s, i) => {
      const k = ease.outBack(clamp(v.wave * 1.5 - i * 0.07, 0, 1));
      const row = scaleRows[i], clip = row.lastElementChild;
      row.classList.toggle('on', Math.round(v.size) === s.size && w === s.weight);
      setStyle(clip, 'fontFamily', F.css); setStyle(clip, 'fontSize', Math.max(1, px(s.size * (0.4 + 0.6 * k))) + 'px');
      setText(clip, text);
    });
  } else {
    WEIGHTS.forEach((n, i) => {
      const target = (i + 1) * 100;
      const k = clamp(v.wave * 1.6 - i * 0.07, 0, 1);
      const row = weightRows[i], clip = row.lastElementChild;
      row.classList.toggle('on', w === target);
      setStyle(clip, 'fontFamily', F.css); setStyle(clip, 'fontWeight', String(weightOf(100 + (target - 100) * k)));
      setText(clip, text);
    });
  }
}
let pending = false;
function invalidate() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; sync(); }); }

function handleAction(name, value) {
  if (name === 'tab') {
    const next = Number(value);
    if (next === tab) return;
    transition(next > tab ? 'slide-left' : 'slide-right', panes[next]);
    tab = next;
    v.wave = 1;
  } else if (name === 'fam') {
    transition('fade');
    fam = Number(value);
  } else if (name === 'size') setSize(Number(value));
  else if (name === 'weight') setWeight(Number(value));
  else if (name === 'italic') italic = !italic;
  else if (name === 'upper') upper = !upper;
  else if (name === 'under') under = !under;
  else if (name === 'sample') { transition('slide-up', sampleEl); sample = (sample + 1) % SAMPLES.length; }
  else if (name === 'pick') {
    const s = SCALE[Number(value)];
    transition('slide-right', panes[0]);
    tab = 0;
    setSize(s.size); setWeight(s.weight);
  } else if (name === 'pickw') {
    transition('slide-right', panes[0]);
    tab = 0;
    setWeight(Number(value));
  }
  sync();
}
root.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el && root.contains(el)) handleAction(el.dataset.action, el.dataset.value);
});

sync();
setTimeout(() => { tween(v, { size: 28 }, 850, ease.outBack); tween(v, { weight: 700 }, 850, ease.inOutSine); }, 250);
</script>
