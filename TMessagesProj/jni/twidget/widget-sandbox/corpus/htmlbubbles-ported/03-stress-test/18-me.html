<!--
  source: Telegram macOS 12.10 (283300), 03-stress-test.chat, message 18
  author: me 11:16
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; }
  /* outgoing bubble: the host paints it blue with white text; reproduced here so the white table borders make sense */
  .out { background-color: #3d8ee8; color: #ffffff; border-radius: 14px; padding: 8px 12px; }
  .out h3 { margin: 4px 0 6px 0; line-height: 1.2; font-size: 17px; }
  .out ul { margin: 4px 0 8px 0; padding-left: 22px; } .out li { margin: 2px 0; }
  .out code { font-family: ui-monospace, monospace; font-size: 13px; background-color: rgba(255,255,255,0.18); padding: 1px 4px; border-radius: 4px; }
  .out a { color: #ffffff; text-decoration: none; } .out a:hover { text-decoration: underline; }
  .out table { border-collapse: collapse; }
  .out > *:first-child { margin-top: 0; } .out > *:last-child { margin-bottom: 0; }
</style>
<div class="out">
<h3 style="margin-top: 0">Outgoing bubbles render HTML too</h3>
<ul><li><b>Lists</b>, <i>emphasis</i>, <code>code</code></li><li><a href="https://github.com/litehtml/litehtml">links</a> turn white</li></ul>
<table style="border-collapse: collapse; font-size: 12px"><tr><td style="border: 1px solid rgba(255,255,255,0.5); padding: 2px 8px">tables</td><td style="border: 1px solid rgba(255,255,255,0.5); padding: 2px 8px">on blue</td></tr></table>
</div>
