<style>
  :root { color-scheme: light dark; --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .grow { flex-grow: 1; } .center { text-align: center; }
  [data-action] { cursor: pointer; }
  .im { width: 340px; max-width: 100%; }
  .im .seg { display: flex; margin: 8px 0; padding: 2px; border-radius: 9px; background-color: rgba(127,127,127,0.12); }
  .im .seg span { flex-grow: 1; text-align: center; padding: 3px 0; border-radius: 7px; font-size: 12px; font-weight: 600; color: #8e8e93; }
  .im .seg span:hover { background-color: rgba(127,127,127,0.14); }
  .im .seg span.on { background-color: #007aff; color: #ffffff; }
  .im .frame { width: 340px; height: 180px; overflow: hidden; border-radius: 12px; background-color: rgba(127,127,127,0.10); }
  .im .strip { display: flex; width: 2380px; }
  .im .slot { width: 340px; height: 180px; }
  .im .pic { background-size: cover; background-position: center; margin-left: auto; margin-right: auto; }
  .im .cap { display: flex; align-items: center; margin: 6px 0 4px 0; font-size: 12px; }
  .im .nav { display: block; width: 26px; line-height: 22px; text-align: center; border-radius: 7px; font-weight: 700; background-color: rgba(127,127,127,0.14); }
  .im .nav:hover { background-color: rgba(127,127,127,0.28); }
  .im .thumbs { display: flex; align-items: center; justify-content: space-between; height: 52px; }
  .im .thumb { border-radius: 9px; background-size: cover; background-position: center; border: 2px solid rgba(0,0,0,0); }
  .im .thumb:hover { border-color: rgba(127,127,127,0.55); }
  .im .thumb.on { border-color: #007aff; }
  .im .ss { height: 3px; border-radius: 2px; margin-top: 3px; background-color: rgba(127,127,127,0.18); }
  .im .ss div { height: 3px; border-radius: 2px; background-color: #007aff; }
  .im .opts { display: flex; align-items: center; flex-wrap: wrap; margin: 4px 0; }
  .im .lbl { width: 54px; font-size: 10px; font-weight: 700; text-transform: uppercase; color: #8e8e93; }
  .im .o { padding: 2px 8px; margin-right: 4px; border-radius: 7px; font-size: 12px; background-color: rgba(127,127,127,0.12); }
  .im .o:hover { background-color: rgba(127,127,127,0.26); }
  .im .o.on { background-color: #007aff; color: #ffffff; }
  .im .big { height: 128px; text-align: center; border-radius: 12px; background-color: rgba(127,127,127,0.10); }
  .im .syms { display: flex; flex-wrap: wrap; margin: 8px 0 4px 0; }
  .im .sym { width: 30px; height: 30px; line-height: 30px; text-align: center; margin: 0 4px 4px 0; border-radius: 8px; border: 1px solid rgba(127,127,127,0.25); }
  .im .sym:hover { background-color: rgba(127,127,127,0.14); }
  .im .sym.on { background-color: rgba(0,122,255,0.16); border-color: #007aff; }
  .im .sw { width: 16px; height: 16px; margin-right: 7px; border-radius: 10px; border: 2px solid rgba(0,0,0,0); }
  .im .sw:hover { border-color: rgba(127,127,127,0.45); }
  .im .sw.on { border-color: rgba(127,127,127,0.95); }
  .im .url { font-family: ui-monospace, monospace; font-size: 10.5px; margin-top: 4px; }
  .im svg { vertical-align: middle; }
  /* app:<id> pictures → gradients of the same size */
  .p-sunset { background-image: linear-gradient(180deg, #2d1b4e 0%, #c0392b 40%, #ff6b6b 60%, #ffb347 100%); }
  .p-aurora { background-image: linear-gradient(160deg, #0b1a3a 0%, #123c6b 30%, #1fb389 55%, #8ef0c4 75%, #0b1a3a 100%); }
  .p-ocean { background-image: linear-gradient(180deg, #8fd3ff 0%, #2a9df4 45%, #0b5ea8 100%); }
  .p-dunes { background-image: linear-gradient(170deg, #ffd27a 0%, #f0a04b 45%, #c76d2b 70%, #8a4b1c 100%); }
  .p-forest { background-image: linear-gradient(180deg, #8bd17c 0%, #2e8b57 45%, #14532d 100%); }
  .p-map { background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.7) 0 1px, transparent 1px 24px), repeating-linear-gradient(90deg, rgba(255,255,255,0.7) 0 1px, transparent 1px 24px), linear-gradient(135deg, #e6ead9, #c9d9b9); }
  .p-logo { background-image: radial-gradient(circle at 50% 50%, #ffffff 0 20%, transparent 21%), linear-gradient(135deg, #2aabee, #229ed9); }
  /* bubble transitions (the host's transition(kind)) */
  @keyframes tr-slide-left { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes tr-slide-right { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  .tr-slide-left { animation: tr-slide-left 0.26s cubic-bezier(.33,1,.68,1); } .tr-slide-right { animation: tr-slide-right 0.26s cubic-bezier(.33,1,.68,1); }
</style>
<div class="im" id="im">
  <div class="row between"><b id="title">🖼 Gallery</b><span class="small muted" id="counter">2 / 7</span></div>
  <div class="seg"><span class="on" data-action="tab" data-value="0">Images</span><span data-action="tab" data-value="1">SF Symbols</span></div>
  <div id="photos">
    <div class="frame"><div class="strip" id="strip"></div></div>
    <div class="ss" id="ss" hidden><div id="ssBar"></div></div>
    <div class="cap"><span class="nav" data-action="step" data-value="-1">‹</span>
      <div class="grow center"><b id="picName"></b> <span class="muted" id="picMeta"></span></div>
      <span class="nav" data-action="step" data-value="1">›</span></div>
    <div class="thumbs" id="thumbs"></div>
    <div class="opts"><span class="lbl">Shape</span><span id="shapes"></span>
      <span class="o" id="showBtn" style="margin-left: auto" data-action="show">▶ Slideshow</span></div>
  </div>
  <div id="symbols" hidden>
    <div class="big" id="big"></div>
    <div class="url muted center" id="url"></div>
    <div class="syms" id="syms"></div>
    <div class="opts"><span class="lbl">Colour</span><span id="swatches" style="display: flex"></span></div>
    <div class="opts"><span class="lbl">Weight</span><span id="weights"></span>
      <span class="o" style="margin-left: auto" data-action="random">🎲</span></div>
  </div>
</div>
<script>
const PICS = [
  { id: 'sunset', name: 'Sunset', size: '360×180' }, { id: 'aurora', name: 'Aurora', size: '200×200' },
  { id: 'ocean', name: 'Ocean', size: '200×200' }, { id: 'dunes', name: 'Dunes', size: '200×200' },
  { id: 'forest', name: 'Forest', size: '200×200' }, { id: 'map', name: 'Map', size: '360×150' },
  { id: 'logo', name: 'Logo', size: '64×64' },
];
const SHAPES = [['Cover', 340, 180, 12], ['Square', 180, 180, 16], ['Circle', 180, 180, 90], ['Pill', 340, 96, 48]];
const SYMBOLS = [
  ['cloud.sun.rain.fill', ''], ['flame.fill', 'ff9500'], ['heart.fill', 'ff2d55'], ['bolt.fill', 'ffcc00'], ['leaf.fill', '34c759'],
  ['drop.fill', '007aff'], ['moon.stars.fill', '5856d6'], ['hare.fill', '8e8e93'], ['paperplane.fill', '30b0c7'], ['trophy.fill', ''],
];
const SWATCHES = ['ff2d55', 'ff9500', 'ffcc00', '34c759', '30b0c7', '007aff', '5856d6', 'af52de', '8e8e93', 'multi'];
const WEIGHTS = ['light', 'regular', 'semibold', 'bold'];
const SLOT = 340, SLIDE_MS = 2200;

// sf:<symbol> → inline SVG (24-unit grid). `mono` uses currentColor; `multi` is the symbol's own palette.
const ICONS = {
  'cloud.sun.rain.fill': {
    mono: '<circle cx="17.5" cy="6.5" r="3.5"/><path d="M7 16.5a4 4 0 0 1-.4-8A5.5 5.5 0 0 1 17 7.8a3.6 3.6 0 0 1 .5 8.7z"/><path d="M8 19l-1 3M12 19l-1 3M16 19l-1 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    multi: '<circle cx="17.5" cy="6.5" r="3.5" fill="#ffcc00"/><path d="M7 16.5a4 4 0 0 1-.4-8A5.5 5.5 0 0 1 17 7.8a3.6 3.6 0 0 1 .5 8.7z" fill="#a9a9ae"/><path d="M8 19l-1 3M12 19l-1 3M16 19l-1 3" fill="none" stroke="#007aff" stroke-width="1.8" stroke-linecap="round"/>',
  },
  'flame.fill': { mono: '<path d="M12 2c.5 3.5 4 5.5 5.5 9A6.5 6.5 0 0 1 12 22a6.5 6.5 0 0 1-6-9c0-2 1-3.5 2-4.5 0 2 1 3.5 2.5 3.5C12 12 10.5 7 12 2z"/>' },
  'heart.fill': { mono: '<path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2 0 3.7 1.1 4.6 2.6.9-1.5 2.6-2.6 4.6-2.6 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/>' },
  'bolt.fill': { mono: '<path d="M13 2L4 14h6l-1 8 9-12h-6z"/>' },
  'leaf.fill': { mono: '<path d="M21 3c-9 0-15 4-16 12 1-1 3-2 5-2-2 1-4 3-6 7 1 1 2 1 3 0 2-2 4-2 7-2 6 0 8-7 7-15z"/>' },
  'drop.fill': { mono: '<path d="M12 2s-7 8-7 13a7 7 0 0 0 14 0c0-5-7-13-7-13z"/>' },
  'moon.stars.fill': { mono: '<path d="M13 3a9 9 0 1 0 8 14 8 8 0 0 1-8-14z"/><path d="M19 2l.8 2.2L22 5l-2.2.8L19 8l-.8-2.2L16 5l2.2-.8z"/><path d="M15 9l.5 1.3 1.3.5-1.3.5L15 12.6l-.5-1.3-1.3-.5 1.3-.5z"/>' },
  'hare.fill': { mono: '<path d="M6 2c1.5 0 3 3 3.2 6.5C10 6 11.5 3.5 13 3.5c1.2 0-.2 4.5-1.2 7.5 3.5 0 8 2 9 6.5.3 1.8-.7 3-2.6 3H8.5C5 20.5 3 18.5 3 15.5c0-1.8.8-3 2.3-3.8C4 8.5 4.5 2 6 2z"/>' },
  'paperplane.fill': { mono: '<path d="M22 2L2 10.5l7.5 2.6L22 2zM10.5 14.1L13 21.5 22 2z"/>' },
  'trophy.fill': {
    mono: '<path d="M6 2h12v6a6 6 0 0 1-12 0z"/><path d="M4 4h2v5a3 3 0 0 1-3-3V5a1 1 0 0 1 1-1zM18 4h2a1 1 0 0 1 1 1v1a3 3 0 0 1-3 3z"/><path d="M10 14h4v3h3v3H7v-3h3z"/>',
    multi: '<path d="M6 2h12v6a6 6 0 0 1-12 0z" fill="#ffcc00"/><path d="M4 4h2v5a3 3 0 0 1-3-3V5a1 1 0 0 1 1-1zM18 4h2a1 1 0 0 1 1 1v1a3 3 0 0 1-3 3z" fill="#ffcc00"/><path d="M10 14h4v3h3v3H7v-3h3z" fill="#8e8e93"/>',
  },
};
const STROKE = { light: 0, regular: 0.4, semibold: 0.9, bold: 1.4 };
function icon(name, size, color, weight) {
  const def = ICONS[name], multi = color === 'multi';
  const body = multi && def.multi ? def.multi : def.mono;
  const style = `color: ${multi ? 'var(--fg)' : '#' + color}; stroke-width: ${STROKE[weight || 'regular']}`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor" stroke="${multi && def.multi ? 'none' : 'currentColor'}" paint-order="stroke" stroke-linejoin="round" style="${style}">${body}</svg>`;
}

// --- animation helpers (same formulas as the HTMLBubbles prelude) ---
const ease = {
  linear: t => t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const animate = (duration, onFrame, easing) => new Promise(resolve => {
  const start = performance.now();
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / Math.max(1, duration));
    onFrame(easing(t), t);
    invalidate();
    if (t < 1) requestAnimationFrame(step); else resolve();
  };
  step();
});
const tweens = new WeakMap();
function tween(target, props, duration, easing) {
  let owners = tweens.get(target);
  if (!owners) { owners = new Map(); tweens.set(target, owners); }
  const token = {}, from = {}, to = {};
  for (const key of Object.keys(props)) { from[key] = Number(target[key]) || 0; to[key] = Number(props[key]); owners.set(key, token); }
  return animate(duration, p => {
    for (const key in to) if (owners.get(key) === token) target[key] = from[key] + (to[key] - from[key]) * p;
  }, easing).then(() => {
    for (const key in to) if (owners.get(key) === token) { target[key] = to[key]; owners.delete(key); }
    invalidate();
  });
}

// --- state ---
let tab = 0, idx = 1, shape = 0, sym = 2, color = 'ff2d55', weight = 'semibold';
let show = false, showRun = 0, shown = 0;
const fx = { off: SLOT, w: 340, h: 180, r: 12, reveal: 0, pop: 1, ss: 0 };
const th = {};
PICS.forEach((_, i) => { th[i] = 0; });

function go(next) {
  idx = (next + PICS.length) % PICS.length;
  tween(fx, { off: idx * SLOT }, 520, ease.outCubic);
  PICS.forEach((_, i) => tween(th, { [i]: i === idx ? 46 : 38 }, 360, ease.outBack));
}

function stopShow() { show = false; showRun++; fx.ss = 0; }
function slide(me) {
  animate(SLIDE_MS, (p, t) => {
    if (me !== showRun) return;
    fx.ss = p;
    if (t < 1) return;
    go(idx + 1);
    if (++shown >= PICS.length) stopShow(); else slide(me);
  }, ease.linear);
}

// --- DOM ---
const $ = id => document.getElementById(id);
const root = $('im'), strip = $('strip'), ssEl = $('ss'), ssBar = $('ssBar'), big = $('big'), urlEl = $('url');
const panes = [$('photos'), $('symbols')];
const segs = [...root.querySelectorAll('.seg span')];
const setText = (el, s) => { if (el.textContent !== s) el.textContent = s; };
const setStyle = (el, prop, val) => { if (el.style[prop] !== val) el.style[prop] = val; };

const TR = ['tr-slide-left', 'tr-slide-right'];
function transition(kind) {
  root.classList.remove(...TR);
  requestAnimationFrame(() => root.classList.add('tr-' + kind));
}
root.addEventListener('animationend', () => root.classList.remove(...TR));

strip.innerHTML = PICS.map(p => `<div class="slot"><div class="pic p-${p.id}"></div></div>`).join('');
const pics = [...strip.querySelectorAll('.pic')];
$('thumbs').innerHTML = PICS.map((p, i) => `<div class="p-${p.id}" data-action="go" data-value="${i}"></div>`).join('');
const thumbs = [...$('thumbs').children];
$('shapes').innerHTML = SHAPES.map((s, i) => `<span class="o" data-action="shape" data-value="${i}">${s[0]}</span>`).join('');
const shapeEls = [...$('shapes').children];
const showBtn = $('showBtn');
$('syms').innerHTML = SYMBOLS.map(([n, c], i) => `<div class="sym" data-action="sym" data-value="${i}">${icon(n, 18, c || 'multi')}</div>`).join('');
const symEls = [...$('syms').children];
$('swatches').innerHTML = SWATCHES.map(c => `<div class="sw" style="background: ${c === 'multi' ? 'conic-gradient(#ff2d55, #ffcc00, #34c759, #007aff, #af52de, #ff2d55)' : '#' + c}" data-action="color" data-value="${c}"></div>`).join('');
const swEls = [...$('swatches').children];
$('weights').innerHTML = WEIGHTS.map(w => `<span class="o" data-action="weight" data-value="${w}">${w}</span>`).join('');
const weightEls = [...$('weights').children];
let bigKey = '';

function sync() {
  setText($('title'), tab === 0 ? '🖼 Gallery' : '✦ SF Symbols');
  setText($('counter'), tab === 0 ? `${idx + 1} / ${PICS.length}` : `${SYMBOLS.length} symbols`);
  segs.forEach((s, i) => s.classList.toggle('on', i === tab));
  panes.forEach((p, i) => { if (p.hidden !== (i !== tab)) p.hidden = i !== tab; });
  if (tab === 0) {
    const w = Math.max(1, fx.w), h = Math.max(1, fx.h), r = clamp(fx.r, 0, Math.min(w, h) / 2);
    const drop = (1 - fx.reveal) * 180;
    setStyle(strip, 'marginLeft', (-fx.off).toFixed(1) + 'px');
    pics.forEach(p => {
      setStyle(p, 'width', w.toFixed(1) + 'px'); setStyle(p, 'height', h.toFixed(1) + 'px');
      setStyle(p, 'borderRadius', r.toFixed(1) + 'px'); setStyle(p, 'marginTop', ((180 - h) / 2 + drop).toFixed(1) + 'px');
    });
    if (ssEl.hidden !== !show) ssEl.hidden = !show;
    if (show) setStyle(ssBar, 'width', (fx.ss * 100).toFixed(1) + '%');
    const P = PICS[idx];
    setText($('picName'), P.name); setText($('picMeta'), `· app:${P.id} · ${P.size}`);
    thumbs.forEach((t, i) => {
      const s = Math.max(0, th[i]);
      if (s < 1) { t.className = `p-${PICS[i].id}`; t.style.cssText = 'width: 38px; height: 0; background-image: none'; return; }
      const cls = `thumb p-${PICS[i].id}${i === idx ? ' on' : ''}`;
      if (t.className !== cls) t.className = cls;
      setStyle(t, 'backgroundImage', ''); setStyle(t, 'width', s.toFixed(1) + 'px'); setStyle(t, 'height', s.toFixed(1) + 'px');
    });
    shapeEls.forEach((e, i) => e.classList.toggle('on', i === shape));
    showBtn.classList.toggle('on', show);
    setText(showBtn, show ? '■ Stop' : '▶ Slideshow');
  } else {
    const [name] = SYMBOLS[sym];
    const query = color === 'multi' ? `size=64&weight=${weight}&mode=multicolor` : `size=64&color=${color}&weight=${weight}`;
    const H = Math.max(4, 68 * fx.pop);
    const key = `${name}|${color}|${weight}`;
    if (bigKey !== key) { bigKey = key; big.innerHTML = icon(name, 64, color, weight); }
    const svg = big.firstElementChild;
    setStyle(svg, 'height', H.toFixed(1) + 'px'); setStyle(svg, 'width', H.toFixed(1) + 'px'); setStyle(svg, 'marginTop', ((128 - H) / 2).toFixed(1) + 'px');
    setText(urlEl, `sf:${name}?${query}`);
    symEls.forEach((e, i) => e.classList.toggle('on', i === sym));
    swEls.forEach(e => e.classList.toggle('on', e.dataset.value === color));
    weightEls.forEach(e => e.classList.toggle('on', e.dataset.value === weight));
  }
}
let pending = false;
function invalidate() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; sync(); }); }

function handleAction(name, value) {
  if (name === 'tab') {
    const next = Number(value);
    if (next === tab) return;
    transition(next > tab ? 'slide-left' : 'slide-right');
    tab = next;
    stopShow();
    if (tab === 1) { fx.pop = 0.4; tween(fx, { pop: 1 }, 520, ease.outBack); }
    sync();
    return;
  }
  if (name === 'show') {
    if (show) { stopShow(); sync(); return; }
    show = true; shown = 0;
    slide(++showRun);
    sync();
    return;
  }
  if (name === 'go' || name === 'step' || name === 'shape') stopShow();
  if (name === 'go') go(Number(value));
  else if (name === 'step') go(idx + Number(value));
  else if (name === 'shape') {
    shape = Number(value);
    const [, w, h, r] = SHAPES[shape];
    tween(fx, { w, h, r }, 560, ease.outBack);
  } else {
    if (name === 'sym') sym = Number(value);
    else if (name === 'color') color = value;
    else if (name === 'weight') weight = value;
    else if (name === 'random') {
      sym = Math.floor(Math.random() * SYMBOLS.length);
      color = SWATCHES[Math.floor(Math.random() * SWATCHES.length)];
      weight = WEIGHTS[Math.floor(Math.random() * WEIGHTS.length)];
    }
    fx.pop = 0.55;
    tween(fx, { pop: 1 }, 480, ease.outBack);
  }
  sync();
}
root.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el && root.contains(el)) handleAction(el.dataset.action, el.dataset.value);
});

sync();
setTimeout(() => {
  tween(fx, { reveal: 1 }, 700, ease.outCubic);
  PICS.forEach((_, i) => setTimeout(() => tween(th, { [i]: i === idx ? 46 : 38 }, 420, ease.outBack), 60 + i * 50));
}, 250);
</script>
