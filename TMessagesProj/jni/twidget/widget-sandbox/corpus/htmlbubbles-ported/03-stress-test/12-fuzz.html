<style>
  :root { color-scheme: light dark; --fg: light-dark(#000, #fff); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  [data-action] { cursor: pointer; }
  .fx { width: 340px; max-width: 100%; }
  .fx .stage { padding: 4px; margin: 8px 0 6px 0; border-radius: 10px; background-color: rgba(127,127,127,0.14); }
  .fx .in { width: 320px; height: 104px; overflow: hidden; }
  .fx .bx { min-width: 0; border-radius: 6px; color: #ffffff; font-size: 11px; font-weight: 700; text-align: center; overflow: hidden; }
  .fx .code { font-family: ui-monospace, monospace; font-size: 10.5px; line-height: 1.45; padding: 5px 8px; margin-bottom: 6px; border-radius: 8px; background-color: rgba(127,127,127,0.10); }
  .fx .code .k { color: #af52de; } .fx .code .v { color: #007aff; }
  @media (prefers-color-scheme: dark) { .fx .code .k { color: #da8fff; } .fx .code .v { color: #64d2ff; } }
  .fx .opts { display: flex; align-items: center; margin: 3px 0; }
  .fx .lbl { width: 50px; font-size: 10px; font-weight: 700; text-transform: uppercase; color: #8e8e93; }
  .fx .o { padding: 2px 6px; margin-right: 3px; border-radius: 7px; font-size: 11px; background-color: rgba(127,127,127,0.12); }
  .fx .o:hover { background-color: rgba(127,127,127,0.26); }
  .fx .o.on { background-color: #007aff; color: #ffffff; }
  .fx .cnt { display: flex; align-items: center; }
  .fx .cnt span.b { width: 22px; line-height: 20px; text-align: center; border-radius: 7px; font-weight: 700; background-color: rgba(127,127,127,0.14); }
  .fx .cnt span.b:hover { background-color: rgba(127,127,127,0.28); }
  .fx .cnt span.n { width: 26px; height: 20px; line-height: 20px; text-align: center; font-weight: 700; }
</style>
<div class="fx" id="fx">
  <div class="row between"><b>Flexbox playground</b>
    <div class="cnt"><span class="b" data-action="count" data-value="-1">−</span><span class="n" id="count">5</span><span class="b" data-action="count" data-value="1">+</span></div></div>
  <div class="stage"><div class="in" id="stage"></div></div>
  <div class="code"><span class="k">display</span>: <span class="v">flex</span>; <span id="d-justify"><span class="k">justify-content</span>: <span class="v"></span>;</span> <span id="d-align"><span class="k">align-items</span>: <span class="v"></span>;</span> <span id="d-wrap"><span class="k">flex-wrap</span>: <span class="v"></span>;</span> <span id="d-grow"><span class="k">flex-grow</span>: <span class="v"></span>;</span></div>
  <div class="opts"><span class="lbl">Justify</span><span id="o-justify"></span></div>
  <div class="opts"><span class="lbl">Align</span><span id="o-align"></span></div>
  <div class="opts"><span class="lbl">Wrap</span><span id="o-wrap"></span><span class="lbl" style="width: auto; margin: 0 6px 0 10px">Grow</span><span id="o-grow"></span></div>
</div>
<script>
const W = 320, H = 104, M = 3, LH = 18;
const COLORS = ['#ff2d55', '#ff9500', '#34c759', '#007aff', '#5856d6', '#af52de', '#30b0c7', '#ffb300', '#ff3b30'];
const WID = [56, 40, 68, 46, 52, 62, 44, 58, 50];
const HEI = [30, 46, 22, 38, 28, 42, 24, 34, 40];
const JUSTIFY = [['flex-start', 'start'], ['center', 'center'], ['flex-end', 'end'], ['space-between', 'between'], ['space-around', 'around'], ['space-evenly', 'evenly']];
const ALIGN = [['flex-start', 'start'], ['center', 'center'], ['flex-end', 'end'], ['stretch', 'stretch']];

// --- animation helpers (same formulas as the HTMLBubbles prelude) ---
const ease = {
  linear: t => t, inQuad: t => t * t,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
  outBounce: t => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
    return n * (t -= 2.625 / d) * t + 0.984375;
  },
};
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const lerp = (a, b, t) => a + (b - a) * t;
const animate = (duration, onFrame, easing) => new Promise(resolve => {
  const start = performance.now();
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / Math.max(1, duration));
    onFrame(easing(t), t);
    invalidate();
    if (t < 1) requestAnimationFrame(step); else resolve();
  };
  step();
});
const tweens = new WeakMap();
function tween(target, props, duration, easing) {
  let owners = tweens.get(target);
  if (!owners) { owners = new Map(); tweens.set(target, owners); }
  const token = {}, from = {}, to = {};
  for (const key of Object.keys(props)) { from[key] = Number(target[key]) || 0; to[key] = Number(props[key]); owners.set(key, token); }
  return animate(duration, p => {
    for (const key in to) if (owners.get(key) === token) target[key] = from[key] + (to[key] - from[key]) * p;
  }, easing).then(() => {
    for (const key in to) if (owners.get(key) === token) { target[key] = to[key]; owners.delete(key); }
    invalidate();
  });
}

// --- state ---
let n = 5, s = { justify: 'space-between', align: 'center', wrap: false, grow: 0 };
let from = {}, to = {}, raw = 0, animating = true, easing = ease.outBounce, delay = 0.09, run = 0, changed = '';
const fx = { hl: 0, pop: 1 };

const growOf = (mode, i) => mode === 0 ? 0 : mode === 1 ? 1 : (i % 3 === 1 ? 2 : 1);

function layout(count, st) {
  const items = [];
  for (let i = 0; i < count; i++) items.push({ i, base: WID[i] + 2 * M, oh: st.align === 'stretch' ? null : HEI[i] + 2 * M, grow: growOf(st.grow, i) });
  const lines = [];
  let line = [], sum = 0;
  for (const it of items) {
    if (line.length && st.wrap && sum + it.base > W) { lines.push(line); line = []; sum = 0; }
    line.push(it); sum += it.base;
  }
  if (line.length) lines.push(line);
  for (const ln of lines) {
    const total = ln.reduce((a, it) => a + it.base, 0);
    ln.forEach(it => { it.main = it.base; });
    if (total < W) {
      const g = ln.reduce((a, it) => a + it.grow, 0);
      if (g > 0) ln.forEach(it => { if (it.grow) it.main = it.base + (W - total) * it.grow / g; });
    } else if (total > W) {
      const inner = ln.reduce((a, it) => a + it.base - 2 * M, 0);
      ln.forEach(it => { it.main = it.base + (W - total) * (it.base - 2 * M) / inner; });
    }
    ln.cross = Math.max(...ln.map(it => it.oh === null ? LH + 2 * M : it.oh));
  }
  const free = H - lines.reduce((a, ln) => a + ln.cross, 0);
  if (free > 0) lines.forEach(ln => { ln.cross += free / lines.length; });
  const rects = {};
  let y = 0;
  for (const ln of lines) {
    const freeMain = W - ln.reduce((a, it) => a + it.main, 0);
    let j = st.justify, pos = 0, before = 0, after = 0;
    if (j === 'space-between' && (ln.length === 1 || freeMain < 0)) j = 'flex-start';
    if ((j === 'space-around' || j === 'space-evenly') && (ln.length === 1 || freeMain < 0)) j = 'center';
    if (j === 'flex-end') pos = freeMain;
    else if (j === 'center') pos = freeMain / 2;
    else if (j === 'space-between') after = freeMain / (ln.length - 1);
    else if (j === 'space-around') before = after = freeMain / (ln.length * 2);
    else if (j === 'space-evenly') before = freeMain / (ln.length + 1);
    for (const it of ln) {
      pos += before;
      const oh = it.oh === null ? ln.cross : it.oh;
      const top = st.align === 'center' ? y + ln.cross / 2 - oh / 2 : st.align === 'flex-end' ? y + ln.cross - oh : y;
      rects[it.i] = { x: pos + M, y: top + M, w: it.main - 2 * M, h: oh - 2 * M, lh: st.align === 'stretch' ? LH : oh - 2 * M };
      pos += it.main + after;
    }
    y += ln.cross;
  }
  return rects;
}

const progress = i => {
  const ids = Object.keys(to).map(Number);
  const span = 1 - delay * Math.max(0, ids.length - 1);
  return easing(clamp((raw - delay * i) / Math.max(0.2, span), 0, 1));
};
function frame() {
  const out = {};
  for (const id of new Set([...Object.keys(from), ...Object.keys(to)].map(Number))) {
    const a = from[id], b = to[id], e = progress(id);
    out[id] = { x: lerp(a.x, b.x, e), y: lerp(a.y, b.y, e), w: Math.max(0, lerp(a.w, b.w, e)), h: Math.max(0, lerp(a.h, b.h, e)), lh: lerp(a.lh, b.lh, e) };
  }
  return out;
}

function play(ms) {
  const me = ++run;
  raw = 0; animating = true;
  animate(ms, (_, t) => {
    if (me !== run) return;
    raw = t;
    if (t >= 1) { animating = false; from = {}; to = {}; }
  }, ease.linear);
}

function morph(apply, curve = ease.outBack, stagger = 0.03) {
  const before = animating ? frame() : layout(n, s);
  apply();
  const after = layout(n, s);
  const dot = r => ({ x: r.x + r.w / 2, y: r.y + r.h / 2, w: 0, h: 0, lh: r.lh });
  from = {}; to = {};
  for (const id of new Set([...Object.keys(before), ...Object.keys(after)].map(Number))) {
    from[id] = before[id] || dot(after[id]);
    to[id] = after[id] || dot(before[id]);
  }
  easing = curve; delay = stagger;
  play(560);
}

function flash(key) { changed = key; fx.hl = 1; tween(fx, { hl: 0 }, 900, ease.inQuad); }

// --- DOM ---
const $ = id => document.getElementById(id);
const root = $('fx'), stage = $('stage'), countEl = $('count');
const setText = (el, s) => { if (el.textContent !== s) el.textContent = s; };
const setStyle = (el, prop, val) => { if (el.style[prop] !== val) el.style[prop] = val; };
const setCss = (el, css) => { if (el.dataset.css !== css) { el.dataset.css = css; el.style.cssText = css; } };

stage.innerHTML = COLORS.map((c, i) => `<div class="bx" style="display: none">${i + 1}</div>`).join('');
const boxes = [...stage.children];
const opts = (id, action, list) => {
  $(id).innerHTML = list.map(([v, label]) => `<span class="o" data-action="${action}" data-value="${v}">${label}</span>`).join('');
  return [...$(id).children];
};
const optEls = {
  justify: opts('o-justify', 'justify', JUSTIFY), align: opts('o-align', 'align', ALIGN),
  wrap: opts('o-wrap', 'wrap', [['0', 'nowrap'], ['1', 'wrap']]), grow: opts('o-grow', 'grow', [['0', '0'], ['1', 'all 1'], ['2', '1 · 2 · 1']]),
};
const decls = { justify: $('d-justify'), align: $('d-align'), wrap: $('d-wrap'), grow: $('d-grow') };

function sync() {
  if (animating) {
    const r = frame();
    setCss(stage, 'position: relative');
    boxes.forEach((box, id) => {
      const b = r[id];
      if (!b || b.w < 0.5 || b.h < 0.5) { setCss(box, 'display: none'); return; }
      setCss(box, `position: absolute; left: ${b.x.toFixed(1)}px; top: ${b.y.toFixed(1)}px; width: ${b.w.toFixed(1)}px; height: ${b.h.toFixed(1)}px; line-height: ${Math.min(b.lh, b.h).toFixed(1)}px; background-color: ${COLORS[id]}`);
    });
  } else {
    setCss(stage, `display: flex; justify-content: ${s.justify}; align-items: ${s.align}; flex-wrap: ${s.wrap ? 'wrap' : 'nowrap'}`);
    boxes.forEach((box, i) => {
      if (i >= n) { setCss(box, 'display: none'); return; }
      const g = growOf(s.grow, i);
      const size = s.align === 'stretch' ? `line-height: ${LH}px` : `height: ${HEI[i]}px; line-height: ${HEI[i]}px`;
      setCss(box, `width: ${WID[i]}px; ${size}; margin: ${M}px;${g ? ` flex-grow: ${g};` : ''} background-color: ${COLORS[i]}`);
    });
  }
  const values = { justify: s.justify, align: s.align, wrap: s.wrap ? 'wrap' : 'nowrap', grow: s.grow === 0 ? '0' : s.grow === 1 ? '1' : '1 | 2 | 1' };
  for (const key in decls) {
    setText(decls[key].querySelector('.v'), values[key]);
    const hl = key === changed && fx.hl > 0.01;
    setCss(decls[key], hl ? `background-color: rgba(255,204,0,${(0.45 * fx.hl).toFixed(3)}); border-radius: 3px` : '');
  }
  const current = { justify: s.justify, align: s.align, wrap: s.wrap ? '1' : '0', grow: String(s.grow) };
  for (const key in optEls) optEls[key].forEach(el => el.classList.toggle('on', el.dataset.value === current[key]));
  setText(countEl, String(n));
  setStyle(countEl, 'fontSize', Math.round(13 * fx.pop) + 'px');
}
let pending = false;
function invalidate() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; sync(); }); }

function handleAction(name, value) {
  if (name === 'justify') { morph(() => { s.justify = value; }); flash('justify'); }
  else if (name === 'align') { morph(() => { s.align = value; }); flash('align'); }
  else if (name === 'wrap') { morph(() => { s.wrap = value === '1'; }); flash('wrap'); }
  else if (name === 'grow') { morph(() => { s.grow = Number(value); }); flash('grow'); }
  else if (name === 'count') {
    const next = clamp(n + Number(value), 1, WID.length);
    if (next === n) return;
    morph(() => { n = next; }, ease.outBack, 0.02);
    fx.pop = 1.5; tween(fx, { pop: 1 }, 380, ease.outBack);
  }
  sync();
}
root.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el && root.contains(el)) handleAction(el.dataset.action, el.dataset.value);
});

(function intro() {
  to = layout(n, s);
  for (const id in to) from[id] = Object.assign({}, to[id], { y: to[id].y - 120 });
})();
sync();
setTimeout(() => play(900), 250);
</script>
