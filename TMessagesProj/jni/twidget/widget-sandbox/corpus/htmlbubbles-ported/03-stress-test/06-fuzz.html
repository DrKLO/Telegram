<!--
  source: Telegram macOS 12.10 (283300), 03-stress-test.chat, message 6
  author: fuzz 11:05
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark; --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d); --blue: #007aff; --purple: #af52de; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  p { margin: 0 0 8px 0; }
  table { border-collapse: collapse; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .grow { flex-grow: 1; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 700; background-color: rgba(127,127,127,0.18); }
  .badge.blue { background-color: rgba(0,122,255,0.16); color: var(--blue); } .badge.purple { background-color: rgba(175,82,222,0.16); color: var(--purple); }
  [data-action] { cursor: pointer; }
  .tb { width: 350px; max-width: 100%; }
  .tb .grid { width: 100%; border-collapse: collapse; font-size: 12px; margin: 6px 0; }
  .tb .grid td, .tb .grid th { border: 1px solid #b0b0b8; padding: 3px 6px; }
  @media (prefers-color-scheme: dark) { .tb .grid td, .tb .grid th { border-color: #4a4a50; } }
  .tb .grid th { background-color: #5856d6; color: #ffffff; font-weight: 600; white-space: nowrap; }
  .tb .grid th.s:hover { background-color: #706ef0; }
  .tb .grid th.on { background-color: #3f3db8; }
  .tb .grid tr.odd td { background-color: rgba(88,86,214,0.10); }
  .tb .grid tr.r:hover td { background-color: rgba(88,86,214,0.20); }
  .tb .grid td.nm { white-space: nowrap; }
  .tb .grid td.nm:hover { color: #5856d6; }
  .tb .num { text-align: right; white-space: nowrap; }
  .tb .up { color: #248a3d; } .tb .down { color: #d70015; }
  @media (prefers-color-scheme: dark) { .tb .up { color: #30d158; } .tb .down { color: #ff453a; } }
  .tb .grid tr.det td { padding: 6px 8px 4px 8px; background-color: rgba(127,127,127,0.08); }
  .tb .pt { display: flex; align-items: center; height: 18px; font-size: 11.5px; }
  .tb .pn { display: block; width: 66px; }
  .tb .pb { width: 10px; flex-grow: 1; margin-right: 8px; }
  .tb .pb div { height: 4px; border-radius: 2px; margin: 1px 0; }
  .tb .b1 { background-color: rgba(127,127,127,0.45); } .tb .b2 { background-color: #5856d6; }
  .tb .pv { display: block; width: 96px; text-align: right; font-family: ui-monospace, monospace; font-size: 10.5px; }
  .tb .status { display: flex; align-items: center; height: 22px; font-size: 12px; }
  .tb .share { width: 48px; height: 6px; border-radius: 3px; margin: 0 6px 0 8px; background-color: rgba(127,127,127,0.22); }
  .tb .share div { height: 6px; border-radius: 3px; background-color: #007aff; }
  .tb .x { display: block; padding: 0 6px; border-radius: 6px; color: #8e8e93; }
  .tb .x:hover { background-color: rgba(127,127,127,0.16); }
  /* bubble transitions (the host's transition(kind)) */
  @keyframes tr-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes tr-slide-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes tr-slide-down { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
  .tr-fade { animation: tr-fade 0.22s ease-out; }
  .tr-slide-up { animation: tr-slide-up 0.26s cubic-bezier(.33,1,.68,1); } .tr-slide-down { animation: tr-slide-down 0.26s cubic-bezier(.33,1,.68,1); }
</style>
<div class="tb" id="tb">
  <div class="row between"><b>Revenue by region</b><span><span class="badge purple">rowspan</span> <span class="badge blue">colspan</span></span></div>
  <table class="grid">
    <thead id="head">
      <tr><th class="s" rowspan="2" data-action="sort" data-value="0">Region</th><th colspan="2">Q1</th><th colspan="2">Q2</th></tr>
      <tr><th class="s" data-action="sort" data-value="1">Revenue</th><th class="s" data-action="sort" data-value="2">Δ</th><th class="s" data-action="sort" data-value="3">Revenue</th><th class="s" data-action="sort" data-value="4">Δ</th></tr>
    </thead>
    <tbody id="rows"></tbody>
    <tbody id="total"><tr><td><b>Total</b></td><td class="num"><b>$0.00M</b></td><td>&nbsp;</td><td class="num"><b>$0.00M</b></td><td class="num up"><b>+0.0%</b></td></tr></tbody>
  </table>
  <div class="status" id="status"></div>
  <div class="row between" style="margin-top: 2px"><span class="tiny muted" id="sortInfo">Original order</span>
    <a class="small" href="#" data-action="reset">↺ Reset</a></div>
</div>
<script>
const REGIONS = [
  { name: 'EMEA', q1: 1.20, d1: 4, q2: 1.31, d2: 9, parts: [['UK', 0.42, 0.45], ['Germany', 0.38, 0.43], ['France', 0.24, 0.26], ['Other', 0.16, 0.17]] },
  { name: 'Americas', q1: 2.04, d1: -2, q2: 2.10, d2: 3, parts: [['USA', 1.52, 1.58], ['Canada', 0.30, 0.29], ['Mexico', 0.22, 0.23]] },
  { name: 'APAC', q1: 0.88, d1: 12, q2: 0.97, d2: 10, parts: [['Japan', 0.36, 0.39], ['Australia', 0.24, 0.27], ['Singapore', 0.16, 0.18], ['India', 0.12, 0.13]] },
  { name: 'LATAM', q1: 0.31, d1: -8, q2: 0.30, d2: -3, parts: [['Brazil', 0.19, 0.18], ['Chile', 0.07, 0.07], ['Argentina', 0.05, 0.05]] },
];
const KEYS = ['name', 'q1', 'd1', 'q2', 'd2'];
const LABELS = ['Region', 'Q1 revenue', 'Q1 Δ', 'Q2 revenue', 'Q2 Δ'];
const T1 = REGIONS.reduce((s, r) => s + r.q1, 0), T2 = REGIONS.reduce((s, r) => s + r.q2, 0);
const GROWTH = (T2 / T1 - 1) * 100;

// --- animation helpers (same formulas as the HTMLBubbles prelude) ---
const ease = {
  linear: t => t, inQuad: t => t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const animate = (duration, onFrame, easing) => new Promise(resolve => {
  const start = performance.now();
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / Math.max(1, duration));
    onFrame(easing(t), t);
    if (t < 1) requestAnimationFrame(step); else resolve();
  };
  step();
});
const tweens = new WeakMap();
function tween(target, props, duration, easing) {
  let owners = tweens.get(target);
  if (!owners) { owners = new Map(); tweens.set(target, owners); }
  const token = {}, from = {}, to = {};
  for (const key of Object.keys(props)) { from[key] = Number(target[key]) || 0; to[key] = Number(props[key]); owners.set(key, token); }
  return animate(duration, p => {
    for (const key in to) if (owners.get(key) === token) target[key] = from[key] + (to[key] - from[key]) * p;
    invalidate();
  }, easing).then(() => {
    for (const key in to) if (owners.get(key) === token) { target[key] = to[key]; owners.delete(key); }
    invalidate();
  });
}

// --- state ---
let order = REGIONS.map((_, i) => i), sortKey = null, sortDir = 1, sel = null, open = -1, moved = new Set();
const fx = { intro: 0, flash: 0, hl: 0, grow: 0, share: 0 };

const money = v => '$' + v.toFixed(2) + 'M';
const pct = (d, digits = 0) => (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d).toFixed(digits) + '%';
const esc = v => String(v === undefined || v === null ? '' : v)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

// --- DOM ---
const $ = id => document.getElementById(id);
const root = $('tb'), rowsEl = $('rows'), statusEl = $('status'), sortInfo = $('sortInfo');
const ths = [...$('head').querySelectorAll('th.s')];
const totalCells = [...$('total').querySelectorAll('td')];
const setText = (el, s) => { if (el.textContent !== s) el.textContent = s; };
const setStyle = (el, prop, val) => { if (el.style[prop] !== val) el.style[prop] = val; };

const TR = ['tr-fade', 'tr-slide-up', 'tr-slide-down'];
function transition(kind) {
  root.classList.remove(...TR);
  requestAnimationFrame(() => root.classList.add('tr-' + kind));
}
root.addEventListener('animationend', () => root.classList.remove(...TR));

let rowRefs = [];  // per position: { ri, tds: [td×5], detail: { bars: [[b1, b2]…] } | null }
function buildRows() {
  rowsEl.innerHTML = order.map((ri, pos) => {
    const R = REGIONS[ri];
    let out = `<tr class="r ${pos % 2 ? 'odd' : ''}">
      <td class="nm" data-action="expand" data-value="${ri}">${open === ri ? '▾' : '▸'} ${esc(R.name)}</td>
      <td class="num" data-action="cell" data-value="${ri}:1"></td><td class="num ${R.d1 >= 0 ? 'up' : 'down'}" data-action="cell" data-value="${ri}:2"></td>
      <td class="num" data-action="cell" data-value="${ri}:3"></td><td class="num ${R.d2 >= 0 ? 'up' : 'down'}" data-action="cell" data-value="${ri}:4"></td></tr>`;
    if (open === ri) {
      const max = Math.max(...R.parts.map(p => Math.max(p[1], p[2])));
      const lines = R.parts.map(([n, a, b]) => {
        const d = Math.round((b / a - 1) * 100);
        return `<div class="pt"><span class="pn">${esc(n)}</span>
          <div class="pb"><div class="b1" data-w="${(a / max * 100).toFixed(1)}"></div><div class="b2" data-w="${(b / max * 100).toFixed(1)}"></div></div>
          <span class="pv">${money(b)} <span class="${d >= 0 ? 'up' : 'down'}">${pct(d)}</span></span></div>`;
      }).join('');
      out += `<tr class="det"><td colspan="5">${lines}<div class="tiny muted" style="margin-top: 2px">grey Q1 · purple Q2 · top markets in ${esc(R.name)}</div></td></tr>`;
    }
    return out;
  }).join('');
  rowRefs = [];
  const trs = [...rowsEl.children];
  let t = 0;
  for (const ri of order) {
    const ref = { ri, tds: [...trs[t++].children], detail: null };
    if (open === ri) ref.detail = { bars: [...trs[t++].querySelectorAll('.pt')].map(pt => [...pt.querySelectorAll('.pb div')]) };
    rowRefs.push(ref);
  }
}

function buildStatus() {
  if (!sel) { statusEl.innerHTML = '<span class="muted">Sort by any header · click a cell · ▸ opens a region</span>'; return; }
  const R = REGIONS[sel.r], key = KEYS[sel.c], v = R[key];
  const isRev = sel.c === 1 || sel.c === 3;
  statusEl.innerHTML = `<span><b>${esc(R.name)}</b> · ${LABELS[sel.c]} <b>${isRev ? money(v) : pct(v)}</b></span>
    <div class="share"><div id="shareBar"></div></div>
    <span class="grow muted" id="shareText"></span>
    <span class="x" data-action="clear">✕</span>`;
}

function sync() {
  const k = pos => fx.intro >= 1 ? 1 : ease.outCubic(clamp(fx.intro * 1.4 - pos * 0.12, 0, 1));
  const tint = (ri, ci) => {
    if (!sel) return '';
    const a = ri === sel.r && ci === sel.c ? 0.32 : ri === sel.r || ci === sel.c ? 0.12 : 0;
    return a ? `rgba(0,122,255,${(a * fx.hl).toFixed(3)})` : '';
  };
  ths.forEach((th, i) => {
    th.classList.toggle('on', sortKey === KEYS[i]);
    setText(th, ['Region', 'Revenue', 'Δ', 'Revenue', 'Δ'][i] + (sortKey === KEYS[i] ? (sortDir > 0 ? ' ▲' : ' ▼') : ''));
  });
  rowRefs.forEach((ref, pos) => {
    const R = REGIONS[ref.ri], kk = k(pos);
    const flash = moved.has(ref.ri) && fx.flash > 0.01 ? `rgba(255,204,0,${(0.42 * fx.flash).toFixed(3)})` : '';
    const texts = [null, money(R.q1 * kk), pct(Math.round(R.d1 * kk)), money(R.q2 * kk), pct(Math.round(R.d2 * kk))];
    ref.tds.forEach((td, ci) => {
      if (ci) setText(td, texts[ci]);
      setStyle(td, 'backgroundColor', tint(ref.ri, ci) || flash);
    });
    if (ref.detail) ref.detail.bars.forEach((pair, i) => {
      const g = ease.outCubic(clamp(fx.grow * 1.5 - i * 0.12, 0, 1));
      pair.forEach(bar => setStyle(bar, 'width', (Number(bar.dataset.w) * g).toFixed(1) + '%'));
    });
  });
  const kt = k(order.length);
  setText(totalCells[1].firstElementChild, money(T1 * kt));
  setText(totalCells[3].firstElementChild, money(T2 * kt));
  setText(totalCells[4].firstElementChild, pct(GROWTH * kt, 1));
  totalCells.forEach((td, c) => setStyle(td, 'backgroundColor', c && sel && sel.c === c ? `rgba(0,122,255,${(0.12 * fx.hl).toFixed(3)})` : ''));
  if (sel) {
    const isRev = sel.c === 1 || sel.c === 3;
    setStyle($('shareBar'), 'width', (clamp(fx.share, 0, 1) * 100).toFixed(1) + '%');
    setText($('shareText'), isRev ? (fx.share * 100).toFixed(1) + '% of total' : 'total ' + pct(GROWTH, 1));
  }
  setText(sortInfo, sortKey ? 'Sorted by ' + LABELS[KEYS.indexOf(sortKey)] + (sortDir > 0 ? ', ascending' : ', descending') : 'Original order');
}
let pending = false;
function invalidate() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; sync(); }); }

function handleAction(name, value) {
  if (name === 'sort') {
    const key = KEYS[Number(value)];
    if (sortKey === key) sortDir = -sortDir; else { sortKey = key; sortDir = key === 'name' ? 1 : -1; }
    const prev = order.slice();
    order.sort((a, b) => {
      const A = REGIONS[a][key], B = REGIONS[b][key];
      return (typeof A === 'string' ? A.localeCompare(B) : A - B) * sortDir;
    });
    moved = new Set(order.filter((r, i) => prev[i] !== r));
    transition('fade');
    fx.flash = 1;
    tween(fx, { flash: 0 }, 1100, ease.inQuad);
    buildRows();
  } else if (name === 'cell') {
    const [r, c] = value.split(':').map(Number);
    if (sel && sel.r === r && sel.c === c) { sel = null; buildStatus(); sync(); return; }
    sel = { r, c };
    buildStatus();
    fx.hl = 0;
    tween(fx, { hl: 1 }, 320, ease.outCubic);
    const R = REGIONS[r], v = R[KEYS[c]];
    tween(fx, { share: c === 1 ? v / T1 : c === 3 ? v / T2 : Math.min(1, Math.abs(v) / 12) }, 600, ease.outBack);
  } else if (name === 'expand') {
    const r = Number(value);
    transition(open === r ? 'slide-up' : 'slide-down');
    open = open === r ? -1 : r;
    fx.grow = 0;
    buildRows();
    if (open >= 0) tween(fx, { grow: 1 }, 750, ease.linear);
  } else if (name === 'clear') {
    sel = null;
    buildStatus();
  } else if (name === 'reset') {
    transition('slide-up');
    order = REGIONS.map((_, i) => i); sortKey = null; sortDir = 1; sel = null; open = -1; moved = new Set();
    buildRows(); buildStatus();
  }
  sync();
}
root.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !root.contains(el)) return;
  if (el.tagName === 'A') e.preventDefault();
  handleAction(el.dataset.action, el.dataset.value);
});

buildRows(); buildStatus(); sync();
setTimeout(() => tween(fx, { intro: 1 }, 900, ease.linear), 250);
</script>
