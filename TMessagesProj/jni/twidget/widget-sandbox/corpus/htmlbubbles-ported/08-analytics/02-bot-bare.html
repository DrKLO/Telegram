<!--
  source: Telegram macOS 12.10 (283300), 08-analytics.chat, message 2
  author: bot 09:00 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --blue: #007aff; --green: #34c759; --red: #ff3b30; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .pad { padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  .grow { flex-grow: 1; } .center { text-align: center; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
  .caps { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 700; background-color: rgba(127,127,127,0.18); }
  .badge.green { background-color: rgba(52,199,89,0.18); color: var(--green); }
  .badge.red { background-color: rgba(255,59,48,0.16); color: var(--red); }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  [data-act] { cursor: pointer; }
  [hidden] { display: none !important; }

  .kp { width: 390px; max-width: 100%; box-sizing: border-box; overflow: hidden; }
  .kp .seg { display: inline-block; padding: 2px; border-radius: 9px; background-color: rgba(127,127,127,0.14); }
  .kp .seg span { display: inline-block; padding: 3px 10px; border-radius: 7px; font-size: 12px; font-weight: 700; }
  .kp .seg span:hover { background-color: rgba(127,127,127,0.22); }
  .kp .seg span.on { background-color: #5856d6; color: #ffffff; }
  .kp .tiles { display: flex; flex-wrap: wrap; justify-content: space-between; margin-top: 10px; }
  .kp .kt { width: 168px; padding: 9px 11px 7px 11px; margin-bottom: 8px; border-radius: 12px; border: 1px solid rgba(127,127,127,0.2); background-color: rgba(127,127,127,0.04); }
  .kp .kt:hover { background-color: rgba(127,127,127,0.11); border-color: rgba(127,127,127,0.42); }
  .kp .dot { display: inline-block; width: 7px; height: 7px; border-radius: 4px; margin-right: 5px; }
  .kp .big { font-size: 22px; font-weight: 800; }
  .kp .hero { font-size: 34px; font-weight: 800; line-height: 40px; }
  .kp .back { font-size: 13px; font-weight: 600; }
  .kp .nav { display: inline-block; width: 24px; padding: 2px 0; text-align: center; border-radius: 7px; font-weight: 700; }
  .kp .nav:hover { background-color: rgba(127,127,127,0.2); }
  .kp .st { display: flex; margin-top: 8px; }
  .kp .st > div { flex-grow: 1; flex-basis: 0; padding: 6px 9px; margin-right: 6px; border-radius: 9px; background-color: rgba(127,127,127,0.09); }
  .kp .st > div:last-child { margin-right: 0; }
  .kp .note { margin-top: 8px; padding: 7px 10px; border-radius: 9px; }
  .kp svg { display: block; max-width: 100%; }
  .kp .spark { margin-top: 6px; }

  /* transition(kind) of the original, as a short animation on the widget root */
  @keyframes tw-slide-left { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes tw-slide-right { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  .tr-slide-left { animation: tw-slide-left 0.26s cubic-bezier(.33,1,.68,1); }
  .tr-slide-right { animation: tw-slide-right 0.26s cubic-bezier(.33,1,.68,1); }
</style>
<div class="card pad kp" id="root">
  <div id="overview">
    <div class="row between"><span><b style="font-size: 16px">Key numbers</b> <span class="small muted">LiteChat</span></span>
      <span class="seg" id="seg1"><span class="" data-act="period" data-value="0">Day</span><span class="on" data-act="period" data-value="1">Week</span><span class="" data-act="period" data-value="2">Month</span></span></div>
    <div class="tiles" id="tiles"></div>
    <div class="tiny muted center">Click a number to focus it</div>
  </div>
  <div id="detail" hidden>
    <div class="row between"><a class="back" href="#" data-act="back">‹ All numbers</a>
      <span class="seg" id="seg2"><span class="" data-act="period" data-value="0">Day</span><span class="on" data-act="period" data-value="1">Week</span><span class="" data-act="period" data-value="2">Month</span></span></div>
    <div class="row" style="margin-top: 12px"><span class="caps grow"><span class="dot" id="d-dot"></span><span id="d-name"></span></span>
      <span class="nav" data-act="step" data-value="-1">‹</span><span class="tiny muted" id="d-pos"></span><span class="nav" data-act="step" data-value="1">›</span></div>
    <div class="row"><span class="hero" id="d-hero"></span><span style="margin-left: 10px"><span class="badge green" id="d-badge"></span></span><span class="tiny muted" style="margin-left: 6px" id="d-vs"></span></div>
    <svg id="d-chart" width="390" height="104" viewBox="0 0 390 104" style="margin-top: 6px"></svg>
    <div class="row between tiny muted"><span id="d-from"></span><span>┄ average</span><span id="d-to"></span></div>
    <div class="st">
      <div><div class="caps">High</div><b id="d-high"></b></div>
      <div><div class="caps">Low</div><b id="d-low"></b></div>
      <div><div class="caps">Average</div><b id="d-avg"></b></div>
    </div>
    <div class="note small" id="d-note"></div>
  </div>
</div>
<script>
const PERIODS = [
  { label: 'Day', vs: 'vs yesterday', from: '24 h ago', to: 'now' },
  { label: 'Week', vs: 'vs previous week', from: '14 days ago', to: 'today' },
  { label: 'Month', vs: 'vs previous month', from: '14 weeks ago', to: 'this week' },
];
const group = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const KPIS = [
  { name: 'Active users', color: '#007aff', tint: 'rgba(0,122,255,0.1)', kind: 'pct', fmt: v => group(v), data: [[9874, 3.1], [48213, 12.4], [61540, 18.7]],
    note: 'Eighth week of growth in a row. Germany and the US bring in over a third of all usage.' },
  { name: 'Revenue', color: '#34c759', tint: 'rgba(52,199,89,0.1)', kind: 'pct', fmt: v => '€' + (v / 1000).toFixed(1) + 'k', data: [[27900, 5.6], [182400, 8.1], [702300, 11.3]],
    note: 'On track: 72% of the Q4 goal with 12 weeks to go.' },
  { name: 'Conversion', color: '#ff9500', tint: 'rgba(255,149,0,0.1)', kind: 'pp', fmt: v => v.toFixed(2) + '%', data: [[3.51, 0.1], [3.42, -0.3], [3.38, -0.5]],
    note: 'The dip is on mobile: social traffic is 41% of visits there and converts at half the desktop rate.' },
  { name: 'NPS', color: '#af52de', tint: 'rgba(175,82,222,0.1)', kind: 'abs', fmt: v => String(Math.round(v)), data: [[63, 2], [61, 4], [58, 6]],
    note: 'Up since the onboarding changes. Detractors still mention sign-in friction.' },
];

// --- the prelude's easing formulas and a rAF-driven animate() ---
const ease = {
  linear: t => t,
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
};
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
function animate(duration, onFrame, easing) {
  const start = performance.now();
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / Math.max(1, duration));
    onFrame(easing(t), t);
    if (t < 1) requestAnimationFrame(step);
  };
  step();
}

function makeSeries(k, p) {
  const [v, d] = KPIS[k].data[p];
  const start = KPIS[k].kind === 'pct' ? v / (1 + d / 100) : v - d;
  const amp = Math.abs(v - start) * 0.5 + Math.abs(v) * 0.015;
  const ph = k * 1.9 + p * 2.7;
  return Array.from({ length: 14 }, (_, i) => {
    const t = i / 13;
    const wiggle = Math.sin(t * 8.3 + ph) * 0.65 + Math.sin(t * 19.1 + ph * 1.6) * 0.35;
    return lerp(start, v, ease.inOutSine(t)) + amp * wiggle * Math.sin(Math.PI * t);
  });
}
const SERIES = KPIS.map((_, k) => PERIODS.map((_, p) => makeSeries(k, p)));

let period = 1, focus = -1, intro = 0, reveal = 1, morphRun = 0, revealRun = 0;
const cur = KPIS.map((K, k) => ({ v: K.data[1][0], s: SERIES[k][1].slice() }));
const tileP = k => ease.outCubic(clamp((intro * 900 - k * 80) / 660, 0, 1));

function deltaText(k) {
  const d = KPIS[k].data[period][1], a = Math.abs(d);
  return (d < 0 ? '−' : '+') + (KPIS[k].kind === 'pct' ? a.toFixed(1) + '%' : KPIS[k].kind === 'pp' ? a.toFixed(1) + ' pp' : a);
}

// --- inline SVG charts: elements are created once, attributes updated per frame ---
const SVG = 'http://www.w3.org/2000/svg';
const el = (tag, attrs) => { const e = document.createElementNS(SVG, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
function makeChart(svg, color, w, h, big) {
  const c = { svg, color, w, h, big };
  if (big) {
    for (const f of [0.33, 0.66]) svg.appendChild(el('line', { x1: 0, x2: w, y1: (h * f).toFixed(1), y2: (h * f).toFixed(1), stroke: '#8e8e93', 'stroke-opacity': '0.2' }));
    c.avg = svg.appendChild(el('line', { x1: 0, x2: w, y1: 0, y2: 0, stroke: '#8e8e93', 'stroke-opacity': '0.75', 'stroke-dasharray': '4 4' }));
  }
  c.area = svg.appendChild(el('polygon', { fill: color, 'fill-opacity': '0.15', points: '' }));
  c.line = svg.appendChild(el('polyline', { fill: 'none', stroke: color, 'stroke-width': big ? 2.5 : 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', points: '' }));
  if (big) c.marks = [0, 1].map(() => svg.appendChild(el('circle', { r: 4, fill: 'none', stroke: color, 'stroke-width': 1.5, visibility: 'hidden' })));
  c.end = svg.appendChild(el('circle', { r: big ? 4.5 : 3, fill: color }));
  return c;
}
function drawChart(c, vals, shown) {
  const { w, h, big } = c;
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1, n = vals.length - 1;
  const X = i => 3 + i / n * (w - 6), Y = v => h - (big ? 8 : 4) - (v - lo) / span * (h - (big ? 18 : 9));
  const last = clamp(shown, 0, 1) * n, whole = Math.floor(last);
  const pts = [];
  for (let i = 0; i <= whole; i++) pts.push([X(i), Y(vals[i])]);
  if (last > whole) pts.push([X(last), Y(lerp(vals[whole], vals[whole + 1], last - whole))]);
  const line = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const [ex, ey] = pts[pts.length - 1];
  if (big) {
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    c.avg.setAttribute('y1', Y(avg).toFixed(1)); c.avg.setAttribute('y2', Y(avg).toFixed(1));
    [vals.indexOf(hi), vals.indexOf(lo)].forEach((i, k) => {
      const m = c.marks[k];
      if (i <= last) { m.setAttribute('visibility', 'visible'); m.setAttribute('cx', X(i).toFixed(1)); m.setAttribute('cy', Y(vals[i]).toFixed(1)); }
      else m.setAttribute('visibility', 'hidden');
    });
  }
  const multi = pts.length > 1;
  c.area.setAttribute('points', multi ? `${X(0).toFixed(1)},${h} ${line} ${ex.toFixed(1)},${h}` : '');
  c.line.setAttribute('points', multi ? line : '');
  c.end.setAttribute('cx', ex.toFixed(1)); c.end.setAttribute('cy', ey.toFixed(1));
}

// --- static markup for the four tiles, built once ---
const root = document.getElementById('root');
const tilesBox = document.getElementById('tiles');
const tiles = KPIS.map((K, k) => {
  const t = document.createElement('div');
  t.className = 'kt'; t.dataset.act = 'focus'; t.dataset.value = String(k);
  t.innerHTML = `<div class="caps"><span class="dot" style="background-color: ${K.color}"></span>${K.name}</div>
    <div class="row"><span class="big grow"></span><span class="badge"></span></div>
    <svg class="spark" width="168" height="34" viewBox="0 0 168 34"></svg>
    <div class="tiny muted"></div>`;
  tilesBox.appendChild(t);
  return { el: t, big: t.querySelector('.big'), badge: t.querySelector('.badge'), vs: t.querySelector('.tiny'), chart: makeChart(t.querySelector('svg'), K.color, 168, 34, false) };
});
const D = {};
for (const id of ['overview', 'detail', 'd-dot', 'd-name', 'd-pos', 'd-hero', 'd-badge', 'd-vs', 'd-from', 'd-to', 'd-high', 'd-low', 'd-avg', 'd-note']) D[id] = document.getElementById(id);
const dChart = makeChart(document.getElementById('d-chart'), '#007aff', 390, 104, true);
const segs = [document.getElementById('seg1'), document.getElementById('seg2')];

function setBadge(b, k) {
  const neg = KPIS[k].data[period][1] < 0;
  b.className = 'badge ' + (neg ? 'red' : 'green');
  b.textContent = deltaText(k);
}

// targeted DOM updates
function paintTiles() {
  tiles.forEach((T, k) => {
    const e = tileP(k);
    T.big.textContent = KPIS[k].fmt(cur[k].v * e);
    drawChart(T.chart, cur[k].s, e);
  });
}
function paintPeriod() {
  for (const seg of segs) [...seg.children].forEach((s, i) => s.classList.toggle('on', i === period));
  tiles.forEach((T, k) => { setBadge(T.badge, k); T.vs.textContent = PERIODS[period].vs; });
  if (focus >= 0) { setBadge(D['d-badge'], focus); D['d-vs'].textContent = PERIODS[period].vs; D['d-from'].textContent = PERIODS[period].from; D['d-to'].textContent = PERIODS[period].to; }
}
function paintDetail() {
  if (focus < 0) return;
  const k = focus, K = KPIS[k], s = cur[k].s;
  D['d-hero'].textContent = K.fmt(cur[k].v * reveal);
  drawChart(dChart, s, reveal);
  D['d-high'].textContent = K.fmt(Math.max(...s));
  D['d-low'].textContent = K.fmt(Math.min(...s));
  D['d-avg'].textContent = K.fmt(s.reduce((a, b) => a + b, 0) / s.length);
}
function openDetail() {
  const k = focus, K = KPIS[k];
  D['d-dot'].style.backgroundColor = K.color;
  D['d-name'].textContent = K.name;
  D['d-pos'].textContent = `${k + 1} of ${KPIS.length}`;
  D['d-note'].textContent = '💡 ' + K.note;
  D['d-note'].style.backgroundColor = K.tint;
  for (const n of [dChart.area, dChart.line, dChart.end, ...dChart.marks]) n.setAttribute(n === dChart.area ? 'fill' : n === dChart.end ? 'fill' : 'stroke', K.color);
  paintPeriod();
  paintDetail();
  D.overview.hidden = true;
  D.detail.hidden = false;
}

function transition(kind) {
  root.classList.remove('tr-slide-left', 'tr-slide-right');
  requestAnimationFrame(() => root.classList.add('tr-' + kind));
}
root.addEventListener('animationend', e => { if (e.target === root) root.classList.remove('tr-slide-left', 'tr-slide-right'); });

function setPeriod(p) {
  if (p === period) return;
  period = p;
  paintPeriod();
  const from = cur.map(c => ({ v: c.v, s: c.s.slice() }));
  const me = ++morphRun;
  animate(650, e => {
    if (me !== morphRun) return;
    cur.forEach((c, k) => {
      c.v = lerp(from[k].v, KPIS[k].data[p][0], e);
      c.s = from[k].s.map((x, i) => lerp(x, SERIES[k][p][i], e));
    });
    paintTiles();
    paintDetail();
  }, ease.inOutCubic);
}

function replay() {
  const me = ++revealRun;
  animate(750, e => { if (me === revealRun) { reveal = e; paintDetail(); } }, ease.outCubic);
}

root.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t || !root.contains(t)) return;
  const name = t.dataset.act, value = t.dataset.value;
  if (name === 'back') ev.preventDefault();
  if (name === 'period') return setPeriod(Number(value));
  if (name === 'back' && focus >= 0) { transition('slide-right'); focus = -1; D.detail.hidden = true; D.overview.hidden = false; return; }
  if (name === 'focus' && focus < 0) { transition('slide-left'); focus = clamp(Number(value) || 0, 0, KPIS.length - 1); openDetail(); replay(); return; }
  if (name === 'step' && focus >= 0) {
    const dir = Number(value);
    transition(dir > 0 ? 'slide-left' : 'slide-right');
    focus = (focus + dir + KPIS.length) % KPIS.length;
    openDetail();
    replay();
  }
});

paintPeriod();
paintTiles();
setTimeout(() => animate(900, (_, t) => { intro = t; paintTiles(); }, ease.linear), 250);
</script>
