<!--
  source: Telegram macOS 12.10 (283300), 08-analytics.chat, message 9
  author: bot 09:13 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --green: #34c759; --red: #ff3b30; --purple: #af52de; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .pad { padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  .grow { flex-grow: 1; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
  .t-green { color: var(--green); } .t-red { color: var(--red); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 700; background-color: rgba(127,127,127,0.18); }
  .badge.purple { background-color: rgba(175,82,222,0.16); color: var(--purple); }
  table { border-collapse: collapse; }
  [data-act] { cursor: pointer; }
  [hidden] { display: none !important; }

  .co { width: 390px; max-width: 100%; box-sizing: border-box; }
  .co .seg { display: inline-block; padding: 2px; border-radius: 9px; background-color: rgba(127,127,127,0.14); }
  .co .seg span { display: inline-block; padding: 3px 10px; border-radius: 7px; font-size: 12px; font-weight: 700; }
  .co .seg span:hover { background-color: rgba(127,127,127,0.22); }
  .co .seg span.on { background-color: #5856d6; color: #ffffff; }
  .co .tog { display: inline-block; padding: 2px 9px; border-radius: 11px; font-size: 11px; font-weight: 700; border: 1px solid rgba(127,127,127,0.35); }
  .co .tog:hover { background-color: rgba(127,127,127,0.12); }
  .co table { border-collapse: separate; border-spacing: 2px; font-size: 10.5px; width: 100%; margin-top: 6px; }
  .co td, .co th { text-align: center; padding: 5px 0; border-radius: 4px; }
  .co th { font-size: 9.5px; color: #8e8e93; font-weight: 700; }
  .co td.cn { text-align: left; font-weight: 700; white-space: nowrap; padding-left: 4px; }
  .co tr.r:hover td.cn, .co tr.on td.cn { color: #5856d6; background-color: rgba(88,86,214,0.1); }
  @media (prefers-color-scheme: dark) { .co tr.r:hover td.cn, .co tr.on td.cn { color: #9a98ff; } }
  .co tr.dm td { color: #8e8e93; }
  .co td.na { background-color: rgba(127,127,127,0.06); }
  .co tr.avg td { background-color: rgba(127,127,127,0.1); font-weight: 700; }
  .co tr.avg td.cn { background-color: transparent; color: #8e8e93; }
  .co .det { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background-color: rgba(88,86,214,0.09); }
  .co .x { display: inline-block; width: 22px; margin-left: 4px; text-align: center; border-radius: 7px; font-weight: 700; }
  .co .x:hover { background-color: rgba(127,127,127,0.2); }
  .co svg { display: block; flex-shrink: 0; }

</style>
<div class="card pad co" id="root">
  <div class="row"><b class="grow" style="font-size: 16px">Retention by cohort</b><span class="badge purple" id="hbadge"></span></div>
  <div class="row between" style="margin-top: 6px"><span class="seg" id="tabs"></span><span class="tog" data-act="units" id="tog"></span></div>
  <table id="table"></table>
  <div class="tiny muted" style="margin-top: 4px" id="hint"></div>
  <div class="det" id="det" hidden>
    <div class="row"><b class="grow" id="d-name"></b><span class="small muted" id="d-n"></span><span class="x" data-act="close">×</span></div>
    <div class="row" style="margin-top: 6px; align-items: flex-start"><svg id="curve" width="150" height="56" viewBox="0 0 150 56"></svg>
      <div class="small grow" style="margin-left: 10px; line-height: 1.55" id="d-lines"></div></div>
    <div class="tiny muted" style="margin-top: 2px">━ this cohort · ┄ average of all cohorts</div>
  </div>
</div>
<script>
const MODES = [
  { label: 'Weekly', head: 'W', cohorts: [
    ['Aug 4', 1840, [100, 55, 48, 40, 35, 30, 25, 22, 17]],
    ['Aug 11', 1922, [100, 56, 50, 42, 36, 30, 28, 24]],
    ['Aug 18', 2015, [100, 54, 46, 41, 36, 33, 29]],
    ['Aug 25', 1876, [100, 58, 51, 47, 43, 38]],
    ['Sep 1', 2240, [100, 57, 50, 46, 41]],
    ['Sep 8', 2391, [100, 58, 52, 46]],
    ['Sep 15', 2410, [100, 56, 49]],
    ['Sep 22', 2532, [100, 58]],
    ['Sep 29', 2688, [100]],
  ] },
  { label: 'Monthly', head: 'M', cohorts: [
    ['Apr', 7410, [100, 41, 33, 29, 26, 24]],
    ['May', 7980, [100, 42, 34, 30, 27]],
    ['Jun', 8240, [100, 40, 33, 29]],
    ['Jul', 8610, [100, 43, 35]],
    ['Aug', 7653, [100, 44]],
    ['Sep', 12261, [100]],
  ] },
];
MODES.forEach(M => {
  M.cols = M.cohorts[0][2].length;
  M.avg = Array.from({ length: M.cols }, (_, c) => {
    let w = 0, s = 0;
    for (const [, n, v] of M.cohorts) if (c < v.length) { w += n; s += n * v[c]; }
    return s / w;
  });
});
const group = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const fmtN = v => v >= 10000 ? (v / 1000).toFixed(1) + 'k' : group(v);

const ease = { linear: t => t, outCubic: t => 1 - Math.pow(1 - t, 3), inOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2 };
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
function animate(duration, onFrame, easing) {
  const start = performance.now();
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / Math.max(1, duration));
    onFrame(easing(t), t);
    if (t < 1) requestAnimationFrame(step);
  };
  step();
}

let mode = 0, users = false, row = -1, intro = 0, introRun = 0, dimRun = 0, drawRun = 0, dim = 0, draw = 1;
const cellP = (r, c) => ease.outCubic(clamp((intro * 900 - (r + c) * 35) / 330, 0, 1));

const root = document.getElementById('root');
const $ = id => document.getElementById(id);
const tabsEl = $('tabs'), table = $('table');
tabsEl.innerHTML = MODES.map((m, k) => `<span data-act="mode" data-value="${k}">${m.label}</span>`).join('');

// --- the table is rebuilt only when the mode changes; cells are then updated in place ---
let rows = [], avgCells = [];
function buildTable() {
  const M = MODES[mode];
  table.innerHTML = `<tr><th style="text-align: left; padding-left: 4px">Cohort</th>${M.avg.map((_, c) => `<th>${M.head}${c}</th>`).join('')}</tr>` +
    M.cohorts.map(([name, n, v], r) => `<tr class="r" data-act="row" data-value="${r}"><td class="cn">${name}</td>${M.avg.map((_, c) =>
      c >= v.length ? '<td class="na">&nbsp;</td>' : '<td></td>').join('')}</tr>`).join('') +
    `<tr class="avg"><td class="cn">Avg</td>${M.avg.map(() => '<td></td>').join('')}</tr>`;
  const trs = [...table.querySelectorAll('tr.r')];
  rows = trs.map((tr, r) => ({ tr, name: tr.firstChild, cells: [...tr.children].slice(1).filter(td => !td.classList.contains('na')) }));
  avgCells = [...table.querySelector('tr.avg').children].slice(1);
  $('hbadge').textContent = `${M.head}1 ≈ ${Math.round(M.avg[1])}%`;
  [...tabsEl.children].forEach((t, k) => t.classList.toggle('on', k === mode));
}
function paintCells() {
  const M = MODES[mode];
  rows.forEach(({ cells }, r) => {
    const [, n, v] = M.cohorts[r];
    const on = row < 0 || row === r, fade = on ? 1 : 1 - 0.65 * dim;
    cells.forEach((td, c) => {
      const p = cellP(r, c), a = (0.06 + 0.87 * v[c] / 100) * p * fade;
      const white = v[c] >= 45 && p > 0.6 && fade > 0.7;
      td.style.backgroundColor = `rgba(88,86,214,${a.toFixed(3)})`;
      td.style.color = white ? '#ffffff' : '';
      td.textContent = users ? fmtN(n * v[c] / 100 * p) : Math.round(v[c] * p) + '%';
    });
  });
  avgCells.forEach((td, c) => { td.textContent = Math.round(M.avg[c] * cellP(M.cohorts.length - 1, c)) + '%'; });
}
function paintRows() {
  rows.forEach(({ tr, name }, r) => {
    tr.classList.toggle('on', row === r);
    tr.classList.toggle('dm', !(row < 0 || row === r));
    name.textContent = (row === r ? '▸ ' : '') + MODES[mode].cohorts[r][0];
  });
  $('tog').textContent = users ? 'Show %' : 'Show users';
  $('hint').textContent = (users ? 'Users still active from each cohort' : 'Share of each cohort still active') + ' · click a cohort to highlight it';
  $('hint').hidden = row >= 0;
  $('det').hidden = row < 0;
}

// --- the cohort curve: inline SVG, redrawn while it is being traced ---
const SVG = 'http://www.w3.org/2000/svg';
const svg = $('curve');
const avgLine = document.createElementNS(SVG, 'polyline'), line = document.createElementNS(SVG, 'polyline'), dots = document.createElementNS(SVG, 'g');
for (const [k, v] of [['fill', 'none'], ['stroke', '#8e8e93'], ['stroke-width', '1.5'], ['stroke-dasharray', '3 3']]) avgLine.setAttribute(k, v);
for (const [k, v] of [['fill', 'none'], ['stroke', '#5856d6'], ['stroke-width', '2.5'], ['stroke-linejoin', 'round'], ['stroke-linecap', 'round']]) line.setAttribute(k, v);
svg.appendChild(avgLine); svg.appendChild(line); svg.appendChild(dots);
function paintCurve() {
  const M = MODES[mode], v = M.cohorts[row][2];
  const w = 150, h = 56, X = c => 5 + c / (M.cols - 1) * (w - 10), Y = p => 5 + (1 - p / 100) * (h - 10);
  avgLine.setAttribute('points', M.avg.map((p, c) => `${X(c).toFixed(1)},${Y(p).toFixed(1)}`).join(' '));
  const n = (v.length - 1) * draw, whole = Math.floor(n);
  const pts = [];
  for (let c = 0; c <= whole; c++) pts.push([X(c), Y(v[c])]);
  if (n > whole) pts.push([X(n), Y(lerp(v[whole], v[whole + 1], n - whole))]);
  line.setAttribute('points', pts.length > 1 ? pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') : '');
  while (dots.children.length > pts.length) dots.removeChild(dots.lastChild);
  pts.forEach(([x, y], k) => {
    let c = dots.children[k];
    if (!c) { c = document.createElementNS(SVG, 'circle'); c.setAttribute('r', '2.5'); c.setAttribute('fill', '#5856d6'); dots.appendChild(c); }
    c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1));
  });
}
function paintDetail() {
  const M = MODES[mode], [name, n, v] = M.cohorts[row], last = v.length - 1;
  const lines = [];
  if (last === 0) lines.push('Signed up this ' + (mode ? 'month' : 'week') + '.', 'First retention reading next ' + (mode ? 'month' : 'week') + '.');
  else {
    const d1 = v[1] - M.avg[1], dl = v[last] - M.avg[last];
    const vs = d => `<span class="${d >= 0 ? 't-green' : 't-red'}">${d >= 0 ? '+' : '−'}${Math.abs(d).toFixed(1)} pp</span>`;
    lines.push(`${M.head}1 <b>${v[1]}%</b> · ${vs(d1)} vs average`);
    lines.push(`${M.head}${last} <b>${v[last]}%</b> · ${vs(dl)} vs average`);
    lines.push(`<b>${group(n * v[last] / 100)}</b> of ${group(n)} still active`);
  }
  $('d-name').textContent = name + ' cohort';
  $('d-n').textContent = group(n) + ' sign-ups';
  $('d-lines').innerHTML = lines.join('<br>');
  paintCurve();
}

function play() {
  const me = ++introRun;
  animate(900, (_, t) => { if (me === introRun) { intro = t; paintCells(); } }, ease.linear);
}
function tweenDim(to, ms) {
  const me = ++dimRun, from = dim;
  animate(ms, e => { if (me === dimRun) { dim = lerp(from, to, e); paintCells(); } }, ease.outCubic);
}
let panelAnimation = null;
function transition(kind = 'fade', target = table) {
  if (panelAnimation) panelAnimation.cancel();
  const from = kind === 'slide-left' ? 'translateX(6px)' : kind === 'slide-right' ? 'translateX(-6px)' : kind === 'slide-up' ? 'translateY(4px)' : kind === 'pop' ? 'scale(0.985)' : 'none';
  if (from === 'none') return;
  panelAnimation = target.animate([{ transform: from }, { transform: 'none' }], { duration: 140, easing: 'cubic-bezier(.2,.8,.2,1)' });
}

root.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t || !root.contains(t)) return;
  const name = t.dataset.act, value = t.dataset.value;
  if (name === 'mode') {
    const k = Number(value);
    if (k === mode) return;
    transition();
    mode = k;
    row = -1;
    dim = 0; ++dimRun;
    buildTable();
    paintRows();
    intro = 1; ++introRun;
    paintCells();
  } else if (name === 'units') {
    transition();
    users = !users;
    paintRows();
    paintCells();
  } else if (name === 'row') {
    const r = Number(value);
    if (!(r >= 0 && r < MODES[mode].cohorts.length)) return;
    transition('pop', $('det'));
    if (r === row) { row = -1; paintRows(); tweenDim(0, 300); return; }
    row = r;
    paintRows();
    tweenDim(1, 350);
    draw = 0;
    paintDetail();
    const me = ++drawRun;
    animate(700, e => { if (me === drawRun) { draw = e; paintCurve(); } }, ease.inOutCubic);
  } else if (name === 'close' && row >= 0) {
    transition();
    row = -1;
    paintRows();
    tweenDim(0, 300);
  }
});

buildTable();
paintRows();
paintCells();
setTimeout(play, 250);
</script>
