<!--
  source: Telegram macOS 12.10 (283300), 08-analytics.chat, message 3
  author: bot 09:01 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --green: #34c759; --red: #ff3b30; --purple: #af52de; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .pad { padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  .grow { flex-grow: 1; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
  .caps { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .t-green { color: var(--green); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 700; background-color: rgba(127,127,127,0.18); }
  .badge.green { background-color: rgba(52,199,89,0.18); color: var(--green); }
  .badge.red { background-color: rgba(255,59,48,0.16); color: var(--red); }
  .badge.purple { background-color: rgba(175,82,222,0.16); color: var(--purple); }
  [data-act] { cursor: pointer; }
  [hidden] { display: none !important; }

  .rv { width: 390px; max-width: 100%; box-sizing: border-box; --ms: 560ms; --st: 30ms; --e: cubic-bezier(.33,1,.68,1); --od: 350ms; }
  .rv .seg { display: inline-block; padding: 2px; border-radius: 9px; background-color: rgba(127,127,127,0.14); }
  .rv .seg span { display: inline-block; padding: 3px 10px; border-radius: 7px; font-size: 12px; font-weight: 700; }
  .rv .seg span:hover { background-color: rgba(127,127,127,0.22); }
  .rv .seg span.on { color: #ffffff; }
  .rv .tog { display: inline-block; padding: 2px 9px; border-radius: 11px; font-size: 11px; font-weight: 700; border: 1px solid rgba(127,127,127,0.35); }
  .rv .tog:hover { background-color: rgba(127,127,127,0.12); }
  .rv .tog.on { border-color: #ff9500; color: #ff9500; background-color: rgba(255,149,0,0.12); }
  .rv .plot { position: relative; height: 150px; margin: 12px 0 0 34px; border-bottom: 1px solid rgba(127,127,127,0.35); }
  .rv .gl { position: absolute; left: 0; width: 356px; max-width: 100%; height: 0; border-top: 1px dashed rgba(127,127,127,0.25); }
  .rv .gl span { position: absolute; left: -34px; top: -7px; width: 30px; text-align: right; font-size: 9px; color: #8e8e93; }
  .rv .cols { display: flex; position: relative; height: 150px; }
  .rv .col { flex-grow: 1; flex-basis: 0; height: 150px; overflow: hidden; text-align: center; border-radius: 6px 6px 0 0; display: flex; flex-direction: column; justify-content: flex-end; }
  .rv .col:hover { background-color: rgba(127,127,127,0.08); }
  .rv .val { height: 11px; line-height: 11px; margin-bottom: 2px; font-size: 9px; font-weight: 700; white-space: nowrap; visibility: hidden; }
  .rv .col:hover .val, .rv .val.show { visibility: visible; }
  .rv .bars { display: flex; justify-content: center; align-items: flex-end; }
  .rv .b { border-radius: 4px 4px 0 0; height: 0;
    transition: height var(--ms) var(--e) calc(var(--i) * var(--st)), width 450ms cubic-bezier(.65,0,.35,1), margin-right 450ms cubic-bezier(.65,0,.35,1), background-color 500ms cubic-bezier(.65,0,.35,1), opacity var(--od) cubic-bezier(.33,1,.68,1); }
  .rv .b.cur { width: 20px; }
  .rv .b.g { width: 0; margin-right: 0; opacity: 0.32; }
  .rv.cmp .b.cur { width: 11px; }
  .rv.cmp .b.g { width: 11px; margin-right: 2px; }
  .rv.dim .col:not(.sel) .b.cur { opacity: 0.5; }
  .rv.dim .b.g { opacity: 0.18; }
  .rv .col:hover .b.cur { background-color: #ff9500 !important; }
  .rv .mo { display: flex; margin-left: 34px; font-size: 9.5px; color: #8e8e93; }
  .rv .mo span { flex-grow: 1; flex-basis: 0; text-align: center; padding-top: 3px; }
  .rv .mo span.on { color: #ff9500; font-weight: 700; }
  .rv .foot { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background-color: rgba(127,127,127,0.08); }
  .rv .sm { display: flex; }
  .rv .sm > div { flex-grow: 1; flex-basis: 0; }
  .rv .stk { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 8px 0 6px 0; background-color: rgba(127,127,127,0.15); }
  .rv .stk div { height: 10px; }
  .rv .parts { display: flex; font-size: 11px; }
  .rv .parts > div { flex-grow: 1; flex-basis: 0; }
  .rv .parts i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 4px; }
  .rv .x { display: inline-block; width: 22px; text-align: center; border-radius: 7px; font-weight: 700; }
  .rv .x:hover { background-color: rgba(127,127,127,0.2); }

  @keyframes tw-fade { from { opacity: 0; } to { opacity: 1; } }
  .tr-fade { animation: tw-fade 0.25s ease-out; }
</style>
<div class="card pad rv" id="root">
  <div class="row between"><b style="font-size: 16px">Last 12 months</b><span class="seg" id="tabs"></span></div>
  <div class="row between" style="margin-top: 4px"><span class="tiny muted" id="hint">Hover a column for its value, click it for the breakdown</span>
    <span class="tog" id="tog" data-act="compare">vs last year</span></div>
  <div class="plot" id="plot"><div class="cols" id="cols"></div></div>
  <div class="mo" id="months"></div>
  <div class="foot" id="summary"><div class="sm">
    <div><div class="caps" id="s-label"></div><b style="font-size: 17px" id="s-sum"></b></div>
    <div><div class="caps">Best month</div><b style="font-size: 17px" id="s-best"></b> <span class="small muted" id="s-bestv"></span></div>
    <div><div class="caps">vs last year</div><b class="t-green" style="font-size: 17px" id="s-yoy"></b></div>
  </div></div>
  <div class="foot" id="breakdown" hidden>
    <div class="row"><b class="grow" id="b-name"></b><span class="x" data-act="step" data-value="-1">‹</span><span class="x" data-act="step" data-value="1">›</span><span class="x" data-act="close">×</span></div>
    <div class="row" style="margin-top: 2px"><b style="font-size: 20px; margin-right: 8px" id="b-val"></b>
      <span class="badge" style="margin-right: 4px" id="b-mom"></span><span class="badge purple" id="b-yoy"></span></div>
    <div class="stk" id="b-stk"></div>
    <div class="parts" id="b-parts"></div>
  </div>
</div>
<script>
const MONTHS = ['Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];
const LONG = ['November 2025', 'December 2025', 'January 2026', 'February 2026', 'March 2026', 'April 2026', 'May 2026', 'June 2026', 'July 2026', 'August 2026', 'September 2026', 'October 2026'];
const sum = a => a.reduce((x, y) => x + y, 0);
const SERIES = [
  { label: 'Revenue', color: '#5856d6', top: 200, unit: v => '€' + Math.round(v) + 'k',
    now: [96, 121, 88, 92, 110, 118, 131, 127, 140, 152, 168, 182], prev: [61, 83, 58, 60, 72, 77, 85, 83, 91, 99, 109, 117],
    total: ['12-month total', a => sum(a), v => '€' + (Math.round(v / 10) / 100).toFixed(2) + 'M'],
    parts: [['Subscriptions', '#5856d6'], ['Marketplace', '#30b0c7'], ['Ads', '#ff9500']],
    split: i => { const s = 0.56 + i * 0.007, m = 0.25 + 0.03 * Math.sin(i * 1.7); return [s, m, 1 - s - m]; } },
  { label: 'Users', color: '#30b0c7', top: 60, unit: v => Math.round(v) + 'k',
    now: [21, 24, 22, 25, 28, 30, 33, 35, 39, 42, 45, 48], prev: [12, 14, 13, 14, 16, 17, 19, 20, 22, 24, 26, 28],
    total: ['Average MAU', a => sum(a) / a.length, v => v.toFixed(1) + 'k'],
    parts: [['Returning', '#30b0c7'], ['New', '#34c759'], ['Reactivated', '#af52de']],
    split: i => { const n = 0.27 + 0.04 * Math.sin(i * 1.3 + 1), r = 0.08 + 0.02 * Math.cos(i * 0.9); return [1 - n - r, n, r]; } },
];
const PLOT = 128;
const pct = x => (x < 0 ? '▼ ' : '▲ ') + Math.abs(x).toFixed(1) + '%';
const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const ease = { outCubic: t => 1 - Math.pow(1 - t, 3) };
const lerp = (a, b, t) => a + (b - a) * t;
function animate(duration, onFrame, easing) {
  const start = performance.now();
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / Math.max(1, duration));
    onFrame(easing(t), t);
    if (t < 1) requestAnimationFrame(step);
  };
  step();
}
// one running number tween per key (later tweens on the same key cancel earlier ones)
const tweenRun = {};
function tweenNum(key, from, to, ms, apply) {
  const me = (tweenRun[key] = (tweenRun[key] || 0) + 1);
  animate(ms, e => { if (me === tweenRun[key]) apply(lerp(from, to, e)); }, ease.outCubic);
}

let series = 0, compare = false, sel = -1, pickRun = 0;
let shares = [0, 0, 0], sumShown = 0, selShown = 0;
const heights = (s, key) => SERIES[s][key].map(v => v / SERIES[s].top * PLOT);

// --- static markup, built once ---
const root = document.getElementById('root');
const $ = id => document.getElementById(id);
const tabsEl = $('tabs'), plot = $('plot'), colsEl = $('cols'), monthsEl = $('months'), hint = $('hint'), tog = $('tog');
tabsEl.innerHTML = SERIES.map((s, i) => `<span data-act="series" data-value="${i}">${s.label}</span>`).join('');
const gridLabels = [0.25, 0.5, 0.75, 1].map(f => {
  const g = document.createElement('div');
  g.className = 'gl'; g.style.top = Math.round(150 - PLOT * f) + 'px';
  g.innerHTML = '<span></span>';
  plot.insertBefore(g, colsEl);
  return g.firstChild;
});
const cols = MONTHS.map((m, i) => {
  const c = document.createElement('div');
  c.className = 'col'; c.dataset.act = 'pick'; c.dataset.value = String(i); c.style.setProperty('--i', String(i));
  c.innerHTML = `<div class="val"></div><div class="bars"><div class="b g"></div><div class="b cur"></div></div>`;
  colsEl.appendChild(c);
  return { el: c, val: c.querySelector('.val'), ghost: c.querySelector('.b.g'), bar: c.querySelector('.b.cur') };
});
monthsEl.innerHTML = MONTHS.map(m => `<span>${m}</span>`).join('');
const monthEls = [...monthsEl.children];

// --- targeted updates ---
function paintSeries() {
  const S = SERIES[series];
  [...tabsEl.children].forEach((t, i) => { t.classList.toggle('on', i === series); t.style.backgroundColor = i === series ? S.color : ''; });
  gridLabels.forEach((g, k) => { g.textContent = S.unit(S.top * [0.25, 0.5, 0.75, 1][k]); });
  cols.forEach((c, i) => {
    c.val.textContent = S.unit(S.now[i]);
    c.bar.style.backgroundColor = i === sel ? '#ff9500' : S.color;
    c.ghost.style.backgroundColor = S.color;
  });
  $('s-label').textContent = S.total[0];
  const best = S.now.indexOf(Math.max(...S.now));
  $('s-best').textContent = MONTHS[best];
  $('s-bestv').textContent = S.unit(S.now[best]);
  $('s-yoy').textContent = pct((sum(S.now) / sum(S.prev) - 1) * 100);
}
function paintBars() {
  const H = heights(series, 'now'), G = heights(series, 'prev');
  cols.forEach((c, i) => {
    c.bar.style.height = H[i].toFixed(1) + 'px';
    c.ghost.style.height = (compare ? G[i] : 0).toFixed(1) + 'px';
  });
}
function paintSelection() {
  cols.forEach((c, i) => {
    c.el.classList.toggle('sel', i === sel);
    c.val.classList.toggle('show', i === sel || (sel < 0 && i === 11));
    c.bar.style.backgroundColor = i === sel ? '#ff9500' : SERIES[series].color;
  });
  monthEls.forEach((m, i) => m.classList.toggle('on', i === sel));
  $('summary').hidden = sel >= 0;
  $('breakdown').hidden = sel < 0;
}
function paintBreakdown() {
  if (sel < 0) return;
  const S = SERIES[series], i = sel, v = S.now[i];
  const mom = i ? (v / S.now[i - 1] - 1) * 100 : null, yoy = (v / S.prev[i] - 1) * 100;
  $('b-name').textContent = LONG[i];
  const momEl = $('b-mom');
  momEl.hidden = mom === null;
  if (mom !== null) { momEl.className = 'badge ' + (mom < 0 ? 'red' : 'green'); momEl.textContent = pct(mom) + ' MoM'; }
  $('b-yoy').textContent = pct(yoy) + ' YoY';
  $('b-stk').innerHTML = shares.map((s, k) => `<div style="width: ${(s * 100).toFixed(2)}%; background-color: ${S.parts[k][1]}"></div>`).join('');
  $('b-parts').innerHTML = S.parts.map(([n, c], k) => `<div><i style="background-color: ${c}"></i>${esc(n)}<br><b>${S.unit(v * shares[k])}</b> <span class="muted">${Math.round(shares[k] * 100)}%</span></div>`).join('');
}
function paintShares() {
  const S = SERIES[series], v = S.now[sel];
  [...$('b-stk').children].forEach((d, k) => { d.style.width = (shares[k] * 100).toFixed(2) + '%'; });
  [...$('b-parts').children].forEach((d, k) => {
    d.querySelector('b').textContent = S.unit(v * shares[k]);
    d.querySelector('span').textContent = Math.round(shares[k] * 100) + '%';
  });
}

function transition() {
  root.classList.remove('tr-fade');
  requestAnimationFrame(() => root.classList.add('tr-fade'));
}
root.addEventListener('animationend', e => { if (e.target === root) root.classList.remove('tr-fade'); });

function morph(ms, stagger) {
  root.style.setProperty('--ms', ms + 'ms');
  root.style.setProperty('--st', stagger + 'ms');
  root.style.setProperty('--e', 'cubic-bezier(.33,1,.68,1)');
  paintBars();
}

function pick(i) {
  const S = SERIES[series], from = shares.slice(), to = S.split(i), me = ++pickRun;
  sel = i;
  paintSelection();
  paintBreakdown();
  animate(480, e => { if (me === pickRun) { shares = from.map((f, k) => lerp(f, to[k], e)); paintShares(); } }, ease.outCubic);
  tweenNum('selV', selShown, S.now[i], 480, v => { selShown = v; $('b-val').textContent = S.unit(v); });
}

function close() {
  transition();
  sel = -1;
  root.style.setProperty('--od', '300ms');
  root.classList.remove('dim');
  paintSelection();
}

root.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t || !root.contains(t)) return;
  const name = t.dataset.act, value = t.dataset.value;
  if (name === 'series') {
    const s = Number(value);
    if (s === series) return;
    series = s;
    paintSeries();
    morph(520, 20);
    tweenNum('sum', sumShown, SERIES[s].total[1](SERIES[s].now), 600, v => { sumShown = v; $('s-sum').textContent = SERIES[series].total[2](v); });
    if (sel >= 0) pick(sel);
  } else if (name === 'compare') {
    compare = !compare;
    tog.classList.toggle('on', compare);
    tog.textContent = (compare ? '✓ ' : '') + 'vs last year';
    hint.textContent = compare ? 'Faded columns: the same month a year earlier' : 'Hover a column for its value, click it for the breakdown';
    root.style.setProperty('--ms', '450ms');
    root.style.setProperty('--st', '0ms');
    root.style.setProperty('--e', 'cubic-bezier(.65,0,.35,1)');
    root.classList.toggle('cmp', compare);
    paintBars();
  } else if (name === 'pick') {
    const i = Number(value);
    if (i === sel) return close();
    if (sel < 0) {
      transition();
      shares = [0, 0, 0];
      selShown = 0;
      root.style.setProperty('--od', '350ms');
      root.classList.add('dim');
    }
    pick(i);
  } else if (name === 'step' && sel >= 0) {
    pick((sel + Number(value) + 12) % 12);
  } else if (name === 'close' && sel >= 0) {
    close();
  }
});

paintSeries();
paintSelection();
$('s-sum').textContent = SERIES[0].total[2](0);
setTimeout(() => {
  morph(560, 30);
  tweenNum('sum', 0, SERIES[0].total[1](SERIES[0].now), 900, v => { sumShown = v; $('s-sum').textContent = SERIES[series].total[2](v); });
}, 250);
</script>
