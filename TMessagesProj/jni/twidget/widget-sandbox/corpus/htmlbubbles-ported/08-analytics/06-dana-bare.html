<!--
  source: Telegram macOS 12.10 (283300), 08-analytics.chat, message 6
  author: dana 09:10 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --green: #34c759; --red: #ff3b30; --purple: #af52de; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .pad { padding: 12px 14px; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  .grow { flex-grow: 1; }
  .fg { color: var(--fg); } .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 700; background-color: rgba(127,127,127,0.18); }
  .badge.green { background-color: rgba(52,199,89,0.18); color: var(--green); }
  .badge.red { background-color: rgba(255,59,48,0.16); color: var(--red); }
  .badge.purple { background-color: rgba(175,82,222,0.16); color: var(--purple); }
  [data-act] { cursor: pointer; }
  [hidden] { display: none !important; }

  .hm { width: 390px; max-width: 100%; box-sizing: border-box; --dc: 18ms; --dr: 20ms; --wd: 300ms; }
  .hm .seg { display: inline-block; padding: 2px; border-radius: 9px; background-color: rgba(127,127,127,0.14); }
  .hm .seg span { display: inline-block; padding: 3px 9px; border-radius: 7px; font-size: 11.5px; font-weight: 700; }
  .hm .seg span:hover { background-color: rgba(127,127,127,0.22); }
  .hm .seg span.on { color: #ffffff; }
  .hm .ml { position: relative; height: 13px; margin-top: 10px; font-size: 10px; color: #8e8e93; }
  .hm .ml span { position: absolute; top: 0; }
  .hm .grid7 { display: flex; }
  .hm .hw { margin-right: 3px; }
  .hm .hc { width: 11px; height: 11px; border-radius: 3px; margin-bottom: 3px; box-sizing: border-box; background-color: transparent;
    transition: background-color var(--wd) cubic-bezier(.33,1,.68,1) calc(var(--c) * var(--dc) + var(--r) * var(--dr)); }
  .hm .hc:hover { border: 1px solid #1c1c1e; }
  .hm .hc.sel { border: 2px solid #1c1c1e; }
  @media (prefers-color-scheme: dark) { .hm .hc:hover, .hm .hc.sel { border-color: #ffffff; } }
  .hm .dl { width: 28px; font-size: 9px; color: #8e8e93; line-height: 14px; }
  .hm .leg { display: flex; align-items: center; font-size: 10px; color: #8e8e93; margin-top: 2px; }
  .hm .leg div { width: 10px; height: 10px; border-radius: 3px; margin-left: 3px; transition: background-color 640ms cubic-bezier(.33,1,.68,1); }
  .hm .det { margin-top: 10px; padding: 9px 11px; border-radius: 10px; background-color: rgba(127,127,127,0.08); }
  .hm .mx span { display: inline-block; margin-right: 12px; }
  .hm .wk { display: flex; align-items: flex-end; height: 50px; margin-top: 6px; }
  .hm .wk > div { flex-grow: 1; flex-basis: 0; margin: 0 4px; text-align: center; border-radius: 5px 5px 0 0; }
  .hm .wk > div:hover { background-color: rgba(127,127,127,0.14); }
  .hm .bb { border-radius: 4px 4px 0 0; height: 2px; transition: height 450ms cubic-bezier(.33,1,.68,1); }
  .hm .wkl { display: flex; font-size: 9.5px; color: #8e8e93; border-top: 1px solid rgba(127,127,127,0.25); padding-top: 2px; }
  .hm .wkl span { flex-grow: 1; flex-basis: 0; text-align: center; }
  .hm .x { display: inline-block; padding: 0 6px; text-align: center; border-radius: 7px; font-weight: 700; font-size: 12px; }
  .hm .x:hover { background-color: rgba(127,127,127,0.2); }

  @keyframes tw-fade { from { opacity: 0; } to { opacity: 1; } }
  .tr-fade { animation: tw-fade 0.25s ease-out; }
</style>
<div class="card pad hm" id="root">
  <div class="row"><b class="grow" style="font-size: 16px" id="title"></b><span class="badge green" id="total"></span></div>
  <div class="row between" style="margin-top: 6px"><span class="seg" id="tabs"></span><span class="tiny muted">click any day</span></div>
  <div class="ml" id="months"></div>
  <div class="row" style="align-items: flex-start">
    <div class="dl"><div>Mon</div><div>&nbsp;</div><div>Wed</div><div>&nbsp;</div><div>Fri</div><div>&nbsp;</div><div>Sun</div></div>
    <div class="grid7" id="grid"></div>
  </div>
  <div class="leg"><span class="grow" id="change"></span>Less<div></div><div></div><div></div><div></div><div></div><span style="margin-left: 4px">More</span></div>
  <div class="det" id="det" hidden>
    <div class="row"><b class="grow" id="d-day"></b>
      <span class="x" data-act="week" data-value="-1" id="d-prev">‹ week</span><span class="x" data-act="week" data-value="1" id="d-next">week ›</span><span class="x" data-act="close">×</span></div>
    <div class="small mx" style="margin-top: 2px" id="d-counts"></div>
    <div class="wk" id="d-bars"></div>
    <div class="wkl" id="d-dow"></div>
    <div class="tiny muted" style="margin-top: 6px" id="d-foot"></div>
  </div>
</div>
<script>
const ENC = '55kcb005kef932af06j0eg9ib847albki706g0f53ahcehad9ada9c04bkaf675lblad330ghhb045ekb9623d74e07a6578302e43b0380c620098362005006800893930090475002350420ceeb0004409700273622452859024deb000';
const DEPLOYS = [...ENC].map(c => parseInt(c, 36));
let seed = 20261004;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INCIDENTS = DEPLOYS.map(d => { const r = rnd(); return d ? Math.max(0, Math.round(d * 0.12 + r * 1.8 - 1.1)) : r < 0.05 ? 1 : 0; });
const PRS = DEPLOYS.map((d, i) => Math.round(d * 1.5 + rnd() * (i % 7 >= 5 ? 2 : 7)));
const METRICS = [
  { label: 'Deploys', one: 'deploy', many: 'deploys', badge: 'green', pal: ['#9be9a8', '#40c463', '#30a14e', '#216e39'], data: DEPLOYS },
  { label: 'Incidents', one: 'incident', many: 'incidents', badge: 'red', pal: ['#ffc078', '#ff922b', '#f03e3e', '#a61e1e'], data: INCIDENTS },
  { label: 'PRs merged', one: 'PR', many: 'PRs', badge: 'purple', pal: ['#d0bfff', '#9775fa', '#7048e8', '#4c2fb0'], data: PRS },
];
const START = Date.UTC(2026, 3, 6), N = 182;
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const SERVICES = ['api-gateway', 'web', 'billing', 'search', 'notifications', 'auth', 'media'];
const EMPTY = 'rgba(127,127,127,0.15)';
const date = i => new Date(START + i * 86400000);
const dayLabel = i => `${DOW[i % 7]} ${date(i).getUTCDate()} ${MON[date(i).getUTCMonth()]}`;
const group = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const alpha = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };

METRICS.forEach(m => {
  const nz = m.data.filter(v => v > 0).sort((a, b) => a - b);
  m.cuts = [0.25, 0.5, 0.75].map(f => nz[Math.floor(f * (nz.length - 1))]);
  m.total = m.data.reduce((a, b) => a + b, 0);
  m.max = Math.max(...m.data);
  const month = k => m.data.reduce((s, v, i) => s + (date(i).getUTCMonth() === k ? v : 0), 0);
  m.jul = month(6);
  m.aug = month(7);
  m.colors = m.data.map(v => v <= 0 ? EMPTY : m.pal[v <= m.cuts[0] ? 0 : v <= m.cuts[1] ? 1 : v <= m.cuts[2] ? 2 : 3]);
});
const LABELS = [];
for (let i = 0; i < N; i++) if (i === 0 || date(i).getUTCDate() === 1) LABELS.push([Math.floor(i / 7), MON[date(i).getUTCMonth()]]);

const ease = { outCubic: t => 1 - Math.pow(1 - t, 3) };
const lerp = (a, b, t) => a + (b - a) * t;
function animate(duration, onFrame, easing) {
  const start = performance.now();
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / Math.max(1, duration));
    onFrame(easing(t), t);
    if (t < 1) requestAnimationFrame(step);
  };
  step();
}

let metric = 0, sel = -1, totalRun = 0, totalShown = 0;

// --- static markup, built once ---
const root = document.getElementById('root');
const $ = id => document.getElementById(id);
const tabsEl = $('tabs'), grid = $('grid'), totalEl = $('total'), legend = [...document.querySelectorAll('.leg div')];
tabsEl.innerHTML = METRICS.map((M, k) => `<span data-act="metric" data-value="${k}">${M.label}</span>`).join('');
$('months').innerHTML = LABELS.map(([c, name]) => `<span style="left: ${28 + c * 14}px">${name}</span>`).join('');
const cells = [];
for (let c = 0; c < 26; c++) {
  const col = document.createElement('div');
  col.className = 'hw';
  for (let r = 0; r < 7; r++) {
    const i = c * 7 + r, d = document.createElement('div');
    d.className = 'hc'; d.dataset.act = 'day'; d.dataset.value = String(i);
    d.style.setProperty('--c', String(c)); d.style.setProperty('--r', String(r));
    col.appendChild(d); cells.push(d);
  }
  grid.appendChild(col);
}
$('d-bars').innerHTML = DOW.map(() => `<div data-act="day"><div class="tiny muted"></div><div class="bb"></div></div>`).join('');
$('d-dow').innerHTML = DOW.map(d => `<span>${d}</span>`).join('');
const weekBars = [...$('d-bars').children], dowEls = [...$('d-dow').children];

// --- targeted updates ---
function paintMetric() {
  const m = METRICS[metric];
  $('title').textContent = m.label + ' per day';
  totalEl.className = 'badge ' + m.badge;
  [...tabsEl.children].forEach((t, k) => { t.classList.toggle('on', k === metric); t.style.backgroundColor = k === metric ? m.pal[2] : ''; });
  legend.forEach((d, k) => { d.style.backgroundColor = k === 0 ? EMPTY : m.pal[k - 1]; });
  const change = m.jul ? Math.round((m.aug / m.jul - 1) * 100) : 0;
  $('change').innerHTML = `August vs July: <b class="fg">${change > 0 ? '+' : change < 0 ? '−' : ''}${Math.abs(change)}%</b>${change <= -30 ? ' 🏖️' : ''}`;
}
function paintCells() {
  const colors = METRICS[metric].colors;
  cells.forEach((d, i) => { d.style.backgroundColor = colors[i]; });
}
function runWave(kind) {
  // the original's staggered colour wave: per-cell transition-delay = column * --dc + row * --dr
  root.style.setProperty('--wd', kind === 'intro' ? '300ms' : '260ms');
  root.style.setProperty('--dc', kind === 'intro' ? '18ms' : '13ms');
  root.style.setProperty('--dr', kind === 'intro' ? '20ms' : '9ms');
  paintCells();
}
function tweenTotal(ms) {
  const me = ++totalRun, from = totalShown, to = METRICS[metric].total;
  animate(ms, e => { if (me === totalRun) { totalShown = lerp(from, to, e); totalEl.textContent = group(totalShown) + ' in 6 months'; } }, ease.outCubic);
}
function paintSelection() {
  cells.forEach((d, i) => d.classList.toggle('sel', i === sel));
}
function paintDetail() {
  const m = METRICS[metric], i = sel, c = Math.floor(i / 7), r0 = i % 7, start = c * 7;
  const week = m.data.slice(start, start + 7), wsum = week.reduce((a, b) => a + b, 0);
  $('d-day').textContent = dayLabel(i);
  $('d-prev').classList.toggle('muted', !(c > 0));
  $('d-next').classList.toggle('muted', !(c < 25));
  $('d-counts').innerHTML = METRICS.map((M, k) => `<span class="${k === metric ? 'fg' : 'muted'}"><b>${M.data[i]}</b> ${M.data[i] === 1 ? M.one : M.many}</span>`).join('');
  weekBars.forEach((b, r) => {
    b.dataset.value = String(start + r);
    const lbl = b.firstChild, bar = b.lastChild;
    lbl.className = 'tiny ' + (r === r0 ? 'fg' : 'muted');
    lbl.textContent = week[r];
    bar.style.backgroundColor = r === r0 ? m.pal[3] : alpha(m.pal[1], 0.85);
  });
  dowEls.forEach((s, r) => s.classList.toggle('fg', r === r0));
  $('d-foot').innerHTML = `Week of ${date(start).getUTCDate()} ${MON[date(start).getUTCMonth()]}: <b class="fg">${wsum}</b> ${wsum === 1 ? m.one : m.many}${m.data[i] ? ` · top service that day: <b class="fg">${SERVICES[(i * 5 + metric) % SERVICES.length]}</b>` : ' · a quiet day'}`;
}
function syncWeek(fromZero) {
  const m = METRICS[metric], c = Math.floor(sel / 7);
  const to = m.data.slice(c * 7, c * 7 + 7).map(v => v / m.max * 34);
  const apply = () => weekBars.forEach((b, r) => { b.lastChild.style.height = Math.max(2, to[r]).toFixed(1) + 'px'; });
  if (fromZero) {
    weekBars.forEach(b => { b.lastChild.style.height = '2px'; });
    requestAnimationFrame(apply);   // bars grow from zero over 450 ms (CSS transition)
  } else apply();
}

function transition() {
  root.classList.remove('tr-fade');
  requestAnimationFrame(() => root.classList.add('tr-fade'));
}
root.addEventListener('animationend', e => { if (e.target === root) root.classList.remove('tr-fade'); });

function close() {
  transition();
  sel = -1;
  paintSelection();
  $('det').hidden = true;
}

root.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t || !root.contains(t)) return;
  const name = t.dataset.act, value = t.dataset.value;
  if (name === 'metric') {
    const k = Number(value);
    if (k === metric) return;
    metric = k;
    paintMetric();
    runWave('switch');
    tweenTotal(600);
    if (sel >= 0) { paintDetail(); syncWeek(false); }
  } else if (name === 'day') {
    const i = Number(value);
    if (i === sel) return close();
    const opening = sel < 0, sameWeek = !opening && Math.floor(i / 7) === Math.floor(sel / 7);
    if (opening) transition();
    sel = i;
    paintSelection();
    paintDetail();
    $('det').hidden = false;
    if (!sameWeek) syncWeek(opening);
  } else if (name === 'week' && sel >= 0) {
    const i = sel + 7 * Number(value);
    if (i < 0 || i >= N) return;
    sel = i;
    paintSelection();
    paintDetail();
    syncWeek(false);
  } else if (name === 'close' && sel >= 0) {
    close();
  }
});

paintMetric();
totalEl.textContent = '0 in 6 months';
setTimeout(() => { runWave('intro'); tweenTotal(900); }, 250);
</script>
