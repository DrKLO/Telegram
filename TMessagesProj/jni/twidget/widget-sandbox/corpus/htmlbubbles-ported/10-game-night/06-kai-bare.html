<!--
  source: Telegram macOS 12.10 (283300), 10-game-night.chat, message 6
  author: kai 19:40 · bare (full width, no bubble)
  host stylesheet: ../kit.css is prepended to every bubble by the host; images use app:/sf: schemes
  ported: classic widget, see corpus/htmlbubbles-ported/README.md
-->
<style>
  :root { color-scheme: light dark;
    --fg: light-dark(#000, #fff); --muted: light-dark(#6e6e73, #98989d);
    --card: light-dark(#fff, #1c1c1e); --border: light-dark(rgba(0,0,0,0.10), rgba(255,255,255,0.14));
    --purple: #af52de; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.3; color: var(--fg); }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--fg); }
  .pad { padding: 12px 14px; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
  .caps { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .grow { flex-grow: 1; }
  .t-purple { color: var(--purple); }

  .mp { width: 380px; max-width: 100%; overflow: hidden; }
  .mp .top { position: relative; display: flex; padding: 14px; color: #ffffff; border-radius: 13px 13px 0 0; }
  .mp .gfade { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 13px 13px 0 0; opacity: 0; pointer-events: none; }
  .mp .gfade.on { transition: opacity 600ms ease-in-out; }
  .mp .top > .art, .mp .top > .grow { position: relative; }
  .mp .art { width: 92px; height: 92px; border-radius: 12px; background-size: cover; margin-right: 14px; flex-shrink: 0; }
  .art-sunset { background: linear-gradient(180deg, #ffb75e 0%, #ff6e5a 45%, #8e3b8f 100%); }
  .art-ocean { background: linear-gradient(180deg, #7fd3ff 0%, #1e8fd6 55%, #0b3954 100%); }
  .art-forest { background: linear-gradient(180deg, #b7e58a 0%, #4f9a3c 50%, #16422b 100%); }
  .art-aurora { background: linear-gradient(160deg, #0f2027 0%, #2c5364 35%, #3fb39c 70%, #a8ff78 100%); }
  .art-dunes { background: linear-gradient(180deg, #f9d976 0%, #e0a458 55%, #a8582a 100%); }
  .mp .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; color: rgba(255,255,255,0.72); }
  .mp .eq { display: flex; align-items: flex-end; height: 24px; margin-top: 7px; }
  .mp .eq div { width: 3px; height: 2px; margin-right: 2px; border-radius: 2px; background-color: rgba(255,255,255,0.8); }
  .mp .like { width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .mp .like:hover { background-color: rgba(255,255,255,0.18); }
  .mp .like svg { width: 17px; height: 17px; }
  .mp .like.pop svg { animation: heart-pop 420ms cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes heart-pop { from { transform: scale(0.5); } to { transform: none; } }
  .mp .body { padding: 10px 14px 2px 14px; }
  .mp .prog { position: relative; height: 14px; }
  .mp .rail { position: absolute; left: 0; top: 5px; width: 352px; height: 4px; border-radius: 2px; background-color: rgba(127,127,127,0.25); }
  .mp .fill { position: absolute; left: 0; top: 5px; width: 0; height: 4px; border-radius: 2px; background-color: #7f5af0; }
  .mp .knob { position: absolute; top: 0; left: 0; width: 12px; height: 12px; border-radius: 7px; margin-left: -7px; background-color: #ffffff; border: 1px solid rgba(0,0,0,0.2); }
  .mp .zone { position: absolute; top: 0; height: 14px; border-radius: 3px; cursor: pointer; }
  .mp .zone:hover { background-color: rgba(127,90,240,0.16); }
  .mp .ctl { display: flex; align-items: center; justify-content: center; height: 56px; margin: 2px 0; }
  .mp .ib { width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; margin: 0 7px; cursor: pointer; color: #8e8e93; }
  .mp .ib.on, .mp .ib.pu { color: #7f5af0; }
  .mp .ib:hover { background-color: rgba(127,90,240,0.13); }
  .mp .play { width: 50px; height: 50px; border-radius: 26px; background-color: #7f5af0; display: flex; align-items: center; justify-content: center; margin: 0 10px; cursor: pointer; color: #ffffff; }
  .mp .play:hover { background-color: #6a45e0; }
  .mp .play.press { animation: press 380ms cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes press { from { transform: scale(0.82); } to { transform: none; } }
  .mp .play svg { width: 22px; height: 22px; }
  .mp .qrow { position: relative; display: flex; align-items: center; height: 44px; padding: 0 14px; border-top: 1px solid rgba(127,127,127,0.15); font-size: 13px; cursor: pointer; transition: transform 520ms cubic-bezier(.65,0,.35,1); }
  .mp .qrow.cur { background-color: rgba(127,90,240,0.10); }
  .mp .qrow:hover { background-color: rgba(127,90,240,0.07); }
  .mp .no { width: 22px; color: #8e8e93; font-size: 12px; }
  .mp .mini { display: flex; align-items: flex-end; width: 22px; height: 14px; }
  .mp .mini div { width: 3px; height: 5.2px; margin-right: 1px; border-radius: 1px; background-color: #7f5af0; }
  .mp .qrow .mini { display: none; } .mp .qrow.cur .mini { display: flex; } .mp .qrow.cur .no { display: none; }
  .mp .thumb { width: 30px; height: 30px; border-radius: 6px; margin-right: 10px; background-size: cover; }
  .mp [hidden] { display: none !important; }
  .fx-fade { animation: fx-fade 220ms ease-out; }
  .fx-slide-left { animation: fx-slide-left 260ms cubic-bezier(.33,1,.68,1); }
  .fx-slide-right { animation: fx-slide-right 260ms cubic-bezier(.33,1,.68,1); }
  @keyframes fx-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fx-slide-left { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes fx-slide-right { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
</style>
<div class="card mp" id="root">
  <div class="top" id="top">
    <div class="gfade" id="gfade"></div>
    <div class="art" id="art"></div>
    <div class="grow">
      <div class="row"><div class="lbl grow"><span id="state">Paused</span> · Game night mix</div>
        <span class="like" id="like"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="heartPath" d="M12 21s-7-4.6-9.3-8.6C.9 9.3 2.6 5 6.5 5c2 0 3.4 1.1 4.2 2.3L12 8.5l1.3-1.2C14.1 6.1 15.5 5 17.5 5c3.9 0 5.6 4.3 3.8 7.4C19 16.4 12 21 12 21z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/></svg></span></div>
      <div style="font-size: 18px; font-weight: 800" id="title"></div>
      <div style="font-size: 13px; color: rgba(255,255,255,0.85)"><span id="artist"></span> — <i id="album"></i></div>
      <div class="eq" id="eq"></div>
    </div>
  </div>
  <div class="body">
    <div class="prog" id="prog"><div class="rail"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
    <div class="row between tiny muted"><span id="tPos">0:00</span><span id="tLeft">−0:00</span></div>
    <div class="ctl">
      <span class="ib" id="shuffleBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></span>
      <span class="ib pu" id="prevBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M22 4v16L12 12zM12 4v16L2 12z"/></svg></span>
      <span class="play" id="playBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path id="playPath" d="M7 4l14 8-14 8z"/></svg></span>
      <span class="ib pu" id="nextBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2 4v16l10-8zM12 4v16l10-8z"/></svg></span>
      <span class="ib" id="repeatBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/><text id="rep1" x="12" y="15.5" text-anchor="middle" font-size="9" font-weight="800" fill="currentColor" stroke="none" font-family="system-ui, sans-serif" style="display: none">1</text></svg></span>
    </div>
  </div>
  <div class="row" style="padding: 4px 14px 6px 14px"><span class="caps grow" id="qLabel">Up next</span><span class="tiny muted" id="repLabel"></span></div>
  <div id="queue"></div>
</div>
<script>
const TRACKS = [
  { title: 'Sunset Over Alfama', artist: 'The Box Models', album: 'Margin Collapse', art: 'sunset', len: 221, bpm: 112, g: ['#2b1055', '#7597de'] },
  { title: 'Float: Left', artist: 'The Box Models', album: 'Margin Collapse', art: 'ocean', len: 192, bpm: 96, g: ['#0b3954', '#3a86b4'] },
  { title: 'Conic Dreams', artist: 'Gradient Collective', album: 'Color Stops', art: 'forest', len: 245, bpm: 124, g: ['#16422b', '#5f9e57'] },
  { title: 'No JavaScript Required', artist: 'Static Site Generators', album: 'Build Step', art: 'aurora', len: 168, bpm: 132, g: ['#1d2b64', '#3fb39c'] },
  { title: 'Reflow (Night Mix)', artist: 'Shrink-to-Fit', album: 'Layout Thrash', art: 'dunes', len: 236, bpm: 104, g: ['#5a2a0c', '#c9814a'] },
];
const N = 22, ROW = 45;
const REST = Array.from({ length: N }, (_, i) => 0.25 + 0.55 * Math.abs(Math.sin(i * 1.7 + 0.4)));
let cur = 0, pos = 84, playing = false, shuffle = false, repeat = 0, order = [0, 1, 2, 3, 4];
let running = false, lastT = 0, energy = 0, levels = REST.map(() => 0), liked = new Set([2]);
let enter = 0, enterT0 = 0, seek = null;

const esc = v => String(v === undefined || v === null ? '' : v)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const outCubic = t => 1 - Math.pow(1 - t, 3);
const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const $ = id => document.getElementById(id);
const root = $('root'), eq = $('eq'), fill = $('fill'), knob = $('knob'), prog = $('prog'), topEl = $('top'), gfade = $('gfade');
function fxRoot(kind) {
  root.classList.remove('fx-fade', 'fx-slide-left', 'fx-slide-right');
  void root.offsetWidth;
  root.classList.add('fx-' + kind);
}
function pulse(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

// ---- static parts built once ----
const barEls = [];
for (let i = 0; i < N; i++) { const d = document.createElement('div'); eq.appendChild(d); barEls.push(d); }
for (let i = 0; i < 20; i++) {
  const z = document.createElement('div'); z.className = 'zone'; z.dataset.seek = i;
  z.style.left = (i * 17.6).toFixed(1) + 'px'; z.style.width = '17.6px';
  prog.appendChild(z);
}
const rowEls = TRACKS.map((x, t) => {
  const row = document.createElement('div');
  row.className = 'qrow'; row.dataset.t = t;
  row.innerHTML = `<div class="mini"><div></div><div></div><div></div></div><span class="no">${t + 1}</span><div class="thumb art-${x.art}"></div>
      <div class="grow"><b>${esc(x.title)}</b><div class="tiny muted">${esc(x.artist)}</div></div>
      <span class="muted small"><span class="lk"></span>${mmss(x.len)}</span>`;
  $('queue').appendChild(row);
  return row;
});
const gradCss = g => `linear-gradient(135deg, ${g[0]}, ${g[1]})`;

setTimeout(() => { enterT0 = performance.now(); wake(); }, 250);

function wake() {
  if (running) return;
  running = true;
  lastT = performance.now();
  requestAnimationFrame(step);
}

function step(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000);
  lastT = t;
  const tr = TRACKS[cur];
  if (enterT0 && enter < 1) enter = outCubic(Math.min(1, (t - enterT0) / 800));
  if (playing) { pos += dt; if (pos >= tr.len) ended(); }
  if (seek) { const p = Math.min(1, (t - seek.t0) / seek.ms); pos = seek.from + (seek.to - seek.from) * outCubic(p); if (p >= 1) seek = null; }
  energy += ((playing ? 1 : 0) - energy) * Math.min(1, dt * 5);
  const s = t / 1000, beat = Math.pow(Math.max(0, Math.sin(s * Math.PI * TRACKS[cur].bpm / 60)), 6);
  let settled = true;
  levels = levels.map((l, i) => {
    const live = Math.min(1, 0.2 + 0.35 * Math.abs(Math.sin(s * (1.9 + i * 0.37) + i)) + 0.45 * beat * (1 - i / N) + 0.25 * Math.random());
    const target = REST[i] * 0.3 * enter * (1 - energy) + live * energy;
    if (Math.abs(target - l) > 0.004) settled = false;
    return l + (target - l) * (target > l ? 0.5 : 0.22);
  });
  syncLive();
  if (playing || !settled || enter < 1 || seek) requestAnimationFrame(step); else running = false;
}

function ended() {
  if (repeat === 2) { pos = 0; return; }
  const i = order.indexOf(cur);
  if (i + 1 < order.length) return go(order[i + 1], 'slide-left');
  if (repeat === 1) return go(order[0], 'slide-left');
  playing = false;
  pos = TRACKS[cur].len;
  syncTrack();
}

function go(i, kind) {
  if (kind) fxRoot(kind);
  // the header gradient cross-fades 600 ms (ease-in-out): the old one sits on an overlay that fades out
  gfade.classList.remove('on');
  gfade.style.background = gradCss(TRACKS[cur].g);
  gfade.style.opacity = '1';
  void gfade.offsetWidth;
  gfade.classList.add('on');
  gfade.style.opacity = '0';
  cur = i;
  pos = 0;
  seek = null;
  syncTrack();
}

function reorder() {
  order = shuffle ? [cur].concat(TRACKS.map((_, i) => i).filter(i => i !== cur).sort(() => Math.random() - 0.5)) : TRACKS.map((_, i) => i);
  syncQueue();
}

function tweenPos(to, ms) { seek = { from: pos, to, t0: performance.now(), ms }; }

$('playBtn').addEventListener('click', () => {
  if (!playing && pos >= TRACKS[cur].len) pos = 0;
  playing = !playing;
  pulse($('playBtn'), 'press');
  syncTrack(); wake();
});
$('nextBtn').addEventListener('click', () => { const i = order.indexOf(cur); go(order[(i + 1) % order.length], 'slide-left'); wake(); });
$('prevBtn').addEventListener('click', () => {
  if (pos > 3) tweenPos(0, 260);
  else { const i = order.indexOf(cur); go(order[(i - 1 + order.length) % order.length], 'slide-right'); }
  wake();
});
$('queue').addEventListener('click', e => {
  const row = e.target.closest('.qrow');
  if (!row) return;
  const i = Number(row.dataset.t);
  if (i === cur) playing = !playing;
  else { go(i, 'fade'); playing = true; }
  syncTrack(); wake();
});
prog.addEventListener('click', e => {
  const z = e.target.closest('.zone');
  if (!z) return;
  tweenPos(Number(z.dataset.seek) / 20 * TRACKS[cur].len, 280);
  wake();
});
$('shuffleBtn').addEventListener('click', () => { shuffle = !shuffle; reorder(); syncTrack(); wake(); });
$('repeatBtn').addEventListener('click', () => { repeat = (repeat + 1) % 3; syncTrack(); wake(); });
$('like').addEventListener('click', () => {
  if (liked.has(cur)) liked.delete(cur); else liked.add(cur);
  pulse($('like'), 'pop');
  syncTrack(); wake();
});

// ---- targeted DOM updates ----
function syncLive() {
  const tr = TRACKS[cur];
  for (let i = 0; i < N; i++) barEls[i].style.height = (2 + levels[i] * 22).toFixed(1) + 'px';
  const shown = Math.min(pos, tr.len) * (enter < 1 ? enter : 1);
  const pct = shown / tr.len * 100;
  fill.style.width = (pct * 3.52).toFixed(1) + 'px';
  knob.style.left = (pct * 3.52).toFixed(1) + 'px';
  $('tPos').textContent = mmss(shown);
  $('tLeft').textContent = '−' + mmss(tr.len - shown);
  const mini = rowEls[cur].firstChild.children;
  [3, 9, 15].forEach((i, k) => { mini[k].style.height = (3 + (playing ? levels[i] : 0.2) * 11).toFixed(1) + 'px'; });
}
function syncTrack() {
  const tr = TRACKS[cur], heart = liked.has(cur);
  topEl.style.background = gradCss(tr.g);
  $('art').className = 'art art-' + tr.art;
  $('state').textContent = playing ? 'Now playing' : 'Paused';
  $('title').textContent = tr.title;
  $('artist').textContent = tr.artist;
  $('album').textContent = tr.album;
  const hp = $('heartPath');
  hp.setAttribute('fill', heart ? '#ff375f' : 'none');
  hp.setAttribute('stroke', heart ? '#ff375f' : '#ffffff');
  $('playPath').setAttribute('d', playing ? 'M6 4h4v16H6zM14 4h4v16h-4z' : 'M7 4l14 8-14 8z');
  $('shuffleBtn').classList.toggle('on', shuffle);
  $('repeatBtn').classList.toggle('on', repeat > 0);
  $('rep1').style.display = repeat === 2 ? '' : 'none'; // SVG has no hidden attribute
  $('qLabel').textContent = shuffle ? 'Shuffled queue' : 'Up next';
  $('repLabel').textContent = repeat === 2 ? 'Repeat one' : repeat === 1 ? 'Repeat all' : '';
  for (let t = 0; t < TRACKS.length; t++) {
    const row = rowEls[t];
    row.classList.toggle('cur', t === cur);
    row.querySelector('b').className = t === cur ? 't-purple' : '';
    row.querySelector('.lk').textContent = liked.has(t) ? '♥ ' : '';
  }
  syncLive();
}
function syncQueue() {
  // rows stay in track order in the DOM and slide to their slot: 520 ms + 60 ms per slot, inOutCubic
  order.forEach((t, k) => {
    const row = rowEls[t];
    row.querySelector('.no').textContent = k + 1;
    row.style.transitionDuration = (520 + k * 60) + 'ms';
    row.style.transform = k === t ? '' : `translateY(${(k - t) * ROW}px)`;
    row.style.zIndex = k === t ? '' : '1';
  });
}

syncTrack();
syncQueue();
</script>
