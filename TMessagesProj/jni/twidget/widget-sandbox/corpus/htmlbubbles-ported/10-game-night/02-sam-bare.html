    transition: left var(--mv) cubic-bezier(.65,0,.35,1), top var(--mv) cubic-bezier(.65,0,.35,1), opacity var(--mv) ease-in, transform var(--lift) var(--lift-ease), font-size var(--lift) var(--lift-ease); }

<div class="card pad chs" id="root">

<script>
const S = 34, FILES = 'abcdefgh';
const VAL = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
const FILL = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟︎' };
const LINE = { k: '♔', q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' };
const NAME = { k: 'king', q: 'queen', r: 'rook', b: 'bishop', n: 'knight', p: 'pawn' };
const DIAG = [[1, 1], [1, -1], [-1, 1], [-1, -1]], ORTH = [[1, 0], [-1, 0], [0, 1], [0, -1]], ALL = DIAG.concat(ORTH);
const KNIGHT = [[1, 2], [2, 1], [-1, 2], [-2, 1], [1, -2], [2, -1], [-1, -2], [-2, -1]];
const OPENING = ['e4', 'e5', 'Nf3', 'Nc6', 'Bb5'];
const REPLY = {
  'a6': 'Ba4', 'Nf6': 'O-O', 'Bc5': 'c3', 'd6': 'd4', 'f5': 'Nc3', 'Nd4': 'Nxd4', 'g6': 'c3', 'Nge7': 'c3',
  'a6 Ba4 Nf6': 'O-O', 'a6 Ba4 d6': 'c3', 'a6 Ba4 b5': 'Bb3',
  'a6 Ba4 Nf6 O-O Be7': 'Re1', 'a6 Ba4 Nf6 O-O Nxe4': 'd4', 'a6 Ba4 Nf6 O-O Be7 Re1 b5': 'Bb3',
  'a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 O-O': 'c3', 'a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6': 'c3',
  'a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 O-O c3 d5': 'exd5',
  'Nf6 O-O Nxe4': 'Re1', 'Nf6 O-O Bc5': 'Nxe5', 'Nf6 O-O Nxe4 Re1 Nd6': 'Nxe5',
  'Bc5 c3 Nf6': 'O-O', 'Bc5 c3 f5': 'd4', 'd6 d4 Bd7': 'Nc3', 'f5 Nc3 fxe4': 'Nxe4', 'Nd4 Nxd4 exd4': 'O-O',
};
const NAMES = {
  'a6': 'Morphy Defence', 'a6 Ba4 d6': 'Modern Steinitz', 'a6 Ba4 Nf6 O-O Be7': 'Closed Variation',
  'a6 Ba4 Nf6 O-O Nxe4': 'Open Variation', 'a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 O-O c3 d5': 'Marshall Attack',
  'Nf6': 'Berlin Defence', 'Nf6 O-O Nxe4': 'Berlin, Open Variation', 'Bc5': 'Classical Defence', 'd6': 'Steinitz Defence',
  'f5': 'Schliemann Gambit', 'Nd4': 'Bird Defence', 'g6': 'Smyslov Defence', 'Nge7': 'Cozio Defence',
};

let board, pieces, kings, history, turn, sel, targets, last, over, thinking, started;
let busy = 0, game = 0, think = 0, z = 0, clockId = 0, note = '', noteId = 0, flipTo = 0, flipId = 0, flipping = false;
const clock = { w: 291, b: 298 };

const on = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;
const foe = c => c === 'w' ? 'b' : 'w';
const sqName = s => FILES[s & 7] + (8 - (s >> 3));
const plain = text => text.replace(/[+#]/g, '');
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const esc = v => String(v === undefined || v === null ? '' : v)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---- DOM ----
const root = document.getElementById('root');
const boardEl = document.getElementById('board'), banner = document.getElementById('banner');
const $ = id => document.getElementById(id);
const sqEls = [];
(function buildSquares() {
  for (let R = 0; R < 8; R++) {
    const rw = document.createElement('div'); rw.className = 'rw';
    for (let C = 0; C < 8; C++) {
      const sq = document.createElement('div'); sq.className = 'sq';
      const hv = document.createElement('div'); hv.className = 'hv';
      const dot = document.createElement('div'); dot.className = 'dot';
      hv.appendChild(dot); sq.appendChild(hv); rw.appendChild(sq);
      sqEls.push(sq);
    }
    boardEl.insertBefore(rw, banner);
  }
})();
const rankEls = [], fileEls = [];
for (let i = 0; i < 8; i++) {
  const r = document.createElement('div'); $('ranks').appendChild(r); rankEls.push(r);
  const f = document.createElement('div'); $('files').appendChild(f); fileEls.push(f);
}
function fxRoot(kind) {
  root.classList.remove('fx-fade', 'fx-pop');
  void root.offsetWidth;
  root.classList.add('fx-' + kind);
}

function put(t, c, s) {
  const p = { t, c, s, moved: false, dead: false, z: 0, el: null };
  board[s] = p;
  pieces.push(p);
  if (t === 'k') kings[c] = p;
}

function attacked(s, by) {
  const r = s >> 3, c = s & 7;
  const at = (r2, c2) => on(r2, c2) ? board[r2 * 8 + c2] : null;
  const pr = by === 'w' ? r + 1 : r - 1;
  for (const dc of [-1, 1]) { const q = at(pr, c + dc); if (q && q.c === by && q.t === 'p') return true; }
  for (const [dr, dc] of KNIGHT) { const q = at(r + dr, c + dc); if (q && q.c === by && q.t === 'n') return true; }
  for (const [dr, dc] of ALL) { const q = at(r + dr, c + dc); if (q && q.c === by && q.t === 'k') return true; }
  for (const [dirs, kinds] of [[DIAG, 'bq'], [ORTH, 'rq']]) {
    for (const [dr, dc] of dirs) {
      let r2 = r + dr, c2 = c + dc;
      while (on(r2, c2)) {
        const q = board[r2 * 8 + c2];
        if (q) { if (q.c === by && kinds.includes(q.t)) return true; break; }
        r2 += dr; c2 += dc;
      }
    }
  }
  return false;
}

function pseudo(color) {
  const out = [];
  for (const p of pieces) {
    if (p.dead || p.c !== color) continue;
    const s = p.s, r = s >> 3, c = s & 7;
    const add = (r2, c2) => {
      const t = r2 * 8 + c2, q = board[t];
      if (q && q.c === color) return false;
      out.push({ p, from: s, to: t, cap: q, promo: p.t === 'p' && (r2 === 0 || r2 === 7) });
      return !q;
    };
    if (p.t === 'p') {
      const d = color === 'w' ? -1 : 1;
      if (on(r + d, c) && !board[(r + d) * 8 + c]) {
        add(r + d, c);
        if (r === (color === 'w' ? 6 : 1) && !board[(r + 2 * d) * 8 + c]) add(r + 2 * d, c);
      }
      for (const dc of [-1, 1]) if (on(r + d, c + dc)) { const q = board[(r + d) * 8 + c + dc]; if (q && q.c !== color) add(r + d, c + dc); }
    } else if (p.t === 'n' || p.t === 'k') {
      for (const [dr, dc] of p.t === 'n' ? KNIGHT : ALL) if (on(r + dr, c + dc)) add(r + dr, c + dc);
      if (p.t === 'k' && !p.moved && !attacked(s, foe(color))) {
        for (const [rc, step, path] of [[7, 1, [5, 6]], [0, -1, [3, 2, 1]]]) {
          const rook = board[r * 8 + rc];
          if (!rook || rook.t !== 'r' || rook.c !== color || rook.moved) continue;
          if (path.some(f => board[r * 8 + f]) || attacked(s + step, foe(color))) continue;
          out.push({ p, from: s, to: s + 2 * step, cap: null, rook, rookFrom: r * 8 + rc, rookTo: s + step });
        }
      }
    } else {
      for (const [dr, dc] of p.t === 'b' ? DIAG : p.t === 'r' ? ORTH : ALL) {
        let r2 = r + dr, c2 = c + dc;
        while (on(r2, c2) && add(r2, c2)) { r2 += dr; c2 += dc; }
      }
    }
  }
  return out;
}

function make(m) {
  board[m.from] = null;
  if (m.cap) m.cap.dead = true;
  board[m.to] = m.p;
  m.p.s = m.to;
  m.wasMoved = m.p.moved;
  m.p.moved = true;
  if (m.promo) m.p.t = 'q';
  if (m.rook) { board[m.rookFrom] = null; board[m.rookTo] = m.rook; m.rook.s = m.rookTo; m.rook.moved = true; }
  turn = foe(m.p.c);
}

function unmake(m) {
  board[m.to] = m.cap;
  if (m.cap) m.cap.dead = false;
  board[m.from] = m.p;
  m.p.s = m.from;
  m.p.moved = m.wasMoved;
  if (m.promo) m.p.t = 'p';
  if (m.rook) { board[m.rookTo] = null; board[m.rookFrom] = m.rook; m.rook.s = m.rookFrom; m.rook.moved = false; }
  turn = m.p.c;
}

function legal(color) {
  const keep = turn;
  const out = pseudo(color).filter(m => { make(m); const ok = !attacked(kings[color].s, foe(color)); unmake(m); return ok; });
  turn = keep;
  return out;
}

function san(m, list, suffix) {
  let s;
  if (m.rook) s = (m.rookFrom & 7) === 7 ? 'O-O' : 'O-O-O';
  else if (m.p.t === 'p') s = (m.cap ? FILES[m.from & 7] + 'x' : '') + sqName(m.to) + (m.promo ? '=Q' : '');
  else {
    const twins = list.filter(o => o.p !== m.p && o.p.t === m.p.t && o.to === m.to);
    let dis = '';
    if (twins.length) dis = twins.every(o => (o.from & 7) !== (m.from & 7)) ? FILES[m.from & 7]
      : twins.every(o => (o.from >> 3) !== (m.from >> 3)) ? String(8 - (m.from >> 3)) : sqName(m.from);
    s = m.p.t.toUpperCase() + dis + (m.cap ? 'x' : '') + sqName(m.to);
  }
  if (suffix) {
    make(m);
    const them = foe(m.p.c);
    if (attacked(kings[them].s, m.p.c)) s += legal(them).length ? '+' : '#';
    unmake(m);
  }
  return s;
}

function find(color, text) {
  const list = legal(color);
  return [list.find(m => san(m, list, false) === text), list];
}

const line = () => history.slice(OPENING.length).map(m => plain(m.san));

function bookMoves() {
  const k = line().join(' '), pre = k ? k + ' ' : '';
  return Object.keys(REPLY).filter(x => x.startsWith(pre) && x.length > pre.length && !x.slice(pre.length).includes(' '))
    .map(x => x.slice(pre.length)).slice(0, 3);
}

function openingName() {
  const seq = line();
  for (let n = seq.length; n > 0; n--) { const name = NAMES[seq.slice(0, n).join(' ')]; if (name) return name; }
  return '';
}

function commit(m, list) {
  m.san = san(m, list, true);
  make(m);
  history.push(m);
  last = { from: m.from, to: m.to };
  m.p.z = ++z;
  if (m.rook) m.rook.z = z;
}

// Moves the pieces of `m` (forward or back) with a CSS transition of `ms`; resolves when the
// original's longest tween (the highlight, ms + 120) would have finished.
function slide(m, back, ms) {
  const g = game;
  busy++;
  const movers = [m.p];
  if (m.rook) movers.push(m.rook);
  if (m.cap) movers.push(m.cap);
  for (const p of movers) p.el.style.setProperty('--mv', ms + 'ms');
  sync();
  return sleep(ms + 120).then(() => { if (g === game) busy--; sync(); });
}

function pick(list) {
  const want = REPLY[line().join(' ')];
  if (want) { const m = list.find(x => san(x, list, false) === want); if (m) return m; }
  let best = null, top = -Infinity;
  for (const m of list) {
    const v = VAL[m.p.t];
    let sc = (m.cap ? VAL[m.cap.t] * 10 : 0) + (m.promo ? 80 : 0) + Math.random() * 1.5;
    if (attacked(m.from, 'b')) sc += v * 3;
    make(m);
    if (attacked(m.to, 'b')) sc -= attacked(m.to, 'w') ? Math.max(0, v - 3) * 10 : v * 10;
    if (attacked(kings.b.s, 'w')) sc += legal('b').length ? 2 : 10000;
    unmake(m);
    const r = m.to >> 3, c = m.to & 7;
    if ('nbp'.includes(m.p.t)) sc += (3.5 - Math.max(Math.abs(r - 3.5), Math.abs(c - 3.5))) * 0.6;
    if ((m.p.t === 'n' || m.p.t === 'b') && (m.from >> 3) === 7) sc += 1.5;
    if (m.rook) sc += 4; else if (m.p.t === 'k') sc -= 2;
    if (sc > top) { top = sc; best = m; }
  }
  return best;
}

function flash(text) {
  note = text;
  clearTimeout(noteId);
  noteId = setTimeout(() => { note = ''; syncNote(); }, 1800);
  syncNote();
}

function stopClock() { if (clockId) clearInterval(clockId); clockId = 0; }
function startClock() {
  started = true;
  if (clockId) return;
  clockId = setInterval(() => {
    if (over) return stopClock();
    clock[turn] = Math.max(0, clock[turn] - 1);
    if (!clock[turn]) finish(turn === 'b' ? 'Kai flagged' : 'Sam flagged', turn === 'b' ? 'Sam wins on time' : 'Kai wins on time 🏆');
    syncSide();
  }, 1000);
}

function finish(title, sub) {
  over = { title, sub };
  stopClock();
  clearSel();
  fxRoot('pop');
  $('overT').textContent = title;
  $('overS').textContent = sub;
  banner.hidden = false;
  banner.classList.remove('in');
  void banner.offsetWidth;
  banner.classList.add('in');
  sync();
}

function checkEnd() {
  if (legal(turn).length) return false;
  const mate = attacked(kings[turn].s, foe(turn));
  finish(mate ? 'Checkmate' : 'Stalemate', !mate ? 'Draw 🤝' : turn === 'w' ? 'Kai wins 🏆' : 'Sam wins');
  return true;
}

function clearSel() {
  if (sel >= 0 && board[sel]) { board[sel].el.style.setProperty('--lift', '160ms'); board[sel].el.style.setProperty('--lift-ease', 'cubic-bezier(.5,1,.89,1)'); }
  sel = -1;
  targets = [];
}

function select(s) {
  clearSel();
  sel = s;
  targets = legal('b').filter(m => m.from === s);
  board[s].el.style.setProperty('--lift', '300ms');
  board[s].el.style.setProperty('--lift-ease', 'cubic-bezier(.34,1.56,.64,1)');
  if (!targets.length) flash(`That ${NAME[board[s].t]} has no moves`);
}

const idle = () => !busy && !thinking && !over && turn === 'b' && !flipping;

async function userMove(m) {
  const list = legal('b');
  clearSel();
  commit(m, list);
  startClock();
  const g = game;
  await slide(m, false, 300);
  if (g !== game || over || checkEnd()) return;
  reply();
}

async function reply() {
  const g = game, me = ++think;
  thinking = true;
  sync();
  await sleep(450 + Math.random() * 450);
  if (g !== game || me !== think) return;
  thinking = false;
  if (over) return;
  const list = legal('w');
  const m = pick(list);
  if (!m) { sync(); return; }
  commit(m, list);
  await slide(m, false, 340);
  if (g === game) checkEnd();
}

async function undo() {
  if (busy || history.length <= OPENING.length || flipping) return;
  think++;
  thinking = false;
  clearSel();
  if (over) {
    fxRoot('fade');
    over = null;
    banner.hidden = true;
    for (const c of 'wb') clock[c] = Math.max(clock[c], 15);
    if (started) startClock();
  }
  const g = game;
  let n = turn === 'b' ? 2 : 1;
  while (n-- > 0 && history.length > OPENING.length) {
    const m = history.pop();
    unmake(m);
    const prev = history[history.length - 1];
    last = prev ? { from: prev.from, to: prev.to } : null;
    m.p.z = ++z;
    await slide(m, true, 240);
    if (g !== game) return;
  }
  sync();
}

function makePieceEl(p) {
  const el = document.createElement('div');
  el.className = 'pc ' + p.c;
  const span = document.createElement('span');
  el.appendChild(span);
  if (p.c === 'w') { const ol = document.createElement('div'); ol.className = 'ol'; el.appendChild(ol); }
  p.el = el;
  boardEl.insertBefore(el, banner);
}

function reset() {
  game++; think++; busy = 0; z = 0;
  for (const p of pieces || []) p.el.remove();
  board = Array(64).fill(null); pieces = []; kings = {}; history = [];
  turn = 'w'; sel = -1; targets = []; last = null; over = null; thinking = false; started = false; note = '';
  banner.hidden = true;
  stopClock();
  clock.w = 291; clock.b = 298;
  const back = 'rnbqkbnr';
  for (let c = 0; c < 8; c++) { put(back[c], 'b', c); put('p', 'b', 8 + c); put('p', 'w', 48 + c); put(back[c], 'w', 56 + c); }
  for (const text of OPENING.slice(0, 4)) { const [m, list] = find(turn, text); commit(m, list); }
  for (const p of pieces) { makePieceEl(p); p.el.style.setProperty('--mv', '0ms'); }
  sync();
}

function intro() {
  if (history.length !== OPENING.length - 1) return;
  const [m, list] = find('w', 'Bb5');
  commit(m, list);
  slide(m, false, 560);
}

// ---- events ----
function onSquare(s) {
  if (!idle()) return;
  const p = board[s];
  if (sel >= 0) {
    const m = targets.find(t => t.to === s);
    if (m) return userMove(m);
    if (p && p.c === 'b' && s !== sel) { select(s); sync(); return; }
    clearSel(); sync();
    return;
  }
  if (p && p.c === 'b') { select(s); sync(); return; }
  if (p) flash("That's Sam's piece, you play Black");
}
boardEl.addEventListener('click', e => {
  const t = e.target.closest('[data-s]');
  if (!t || !boardEl.contains(t)) return;
  onSquare(Number(t.dataset.s));
});
$('book').addEventListener('click', e => {
  const t = e.target.closest('.bk');
  if (!t || !idle()) return;
  const [m] = find('b', t.dataset.san);
  if (m) userMove(m);
});
$('undoBtn').addEventListener('click', undo);
$('flipBtn').addEventListener('click', () => {
  clearSel();
  flipTo = 1 - flipTo;
  flipping = true;
  clearTimeout(flipId);
  for (const p of pieces) p.el.style.setProperty('--mv', '620ms');
  sync();
  setTimeout(() => { boardFlipped = flipTo === 1; syncBoard(); }, 310);
  flipId = setTimeout(() => { flipping = false; sync(); }, 620);
});
$('newBtn').addEventListener('click', () => {
  fxRoot('fade');
  reset();
  setTimeout(intro, 350);
});

// ---- targeted DOM updates ----
let boardFlipped = false; // the squares swap at the midpoint of the flip, the pieces glide the whole way
function syncBoard() {
  const flipped = boardFlipped;
  const chk = attacked(kings[turn].s, foe(turn)) ? kings[turn].s : -1;
  const tmap = {};
  for (const m of targets) tmap[m.to] = m;
  for (let idx = 0; idx < 64; idx++) {
    const R = idx >> 3, C = idx & 7;
    const s = flipped ? 63 - idx : idx;
    const light = (R + C) % 2 === 0;
    let bg = light ? '#f0d9b5' : '#b58863';
    if (last && (s === last.from || s === last.to)) bg = light ? '#cdd26a' : '#aaa23a';
    if (s === sel) bg = light ? '#f7ec5c' : '#d9c13a';
    if (s === chk) bg = light ? 'rgba(249,116,106,1)' : 'rgba(224,99,84,1)';
    const t = tmap[s];
    if (t && t.cap) bg = light ? '#e8989f' : '#cb7056';
    const el = sqEls[idx];
    el.dataset.s = s;
    if (el.style.backgroundColor !== bg) el.style.backgroundColor = bg;
    el.classList.toggle('tgt', !!(t && !t.cap));
  }
  for (let i = 0; i < 8; i++) { rankEls[i].textContent = flipped ? i + 1 : 8 - i; fileEls[i].textContent = FILES[flipped ? 7 - i : i]; }
}
function syncPieces() {
  const flipped = flipTo === 1;
  const canAct = idle();
  const tmap = {};
  for (const m of targets) tmap[m.to] = m;
  for (const p of pieces) {
    const el = p.el, x = p.s & 7, y = p.s >> 3;
    const X = (flipped ? 7 - x : x) * S, Y = (flipped ? 7 - y : y) * S;
    el.style.left = X + 'px'; el.style.top = Y + 'px';
    el.style.zIndex = p.z;
    el.classList.toggle('dead', p.dead);
    el.classList.toggle('lift', p.s === sel && !p.dead);
    el.classList.toggle('act', canAct && !p.dead && (p.c === 'b' || !!tmap[p.s]));
    if (p.dead) delete el.dataset.s; else el.dataset.s = p.s;
    const glyph = FILL[p.t];
    if (el.firstChild.textContent !== glyph) {
      el.firstChild.textContent = glyph;
      if (p.c === 'w') el.lastChild.textContent = LINE[p.t];
    }
  }
}
function syncSide() {
  const flipped = flipTo === 1;
  const topSide = flipped ? 'w' : 'b', bottomSide = foe(topSide);
  const who = { w: 'Sam · White', b: 'Kai · you' };
  const clk = (c, who$, time$, el) => { who$.textContent = who[c]; time$.textContent = mmss(clock[c]); el.classList.toggle('on', !over && turn === c); };
  clk(topSide, $('whoTop'), $('timeTop'), $('clkTop'));
  clk(bottomSide, $('whoBottom'), $('timeBottom'), $('clkBottom'));
  const taken = (c, el) => {
    const gone = pieces.filter(p => p.dead && p.c === foe(c)).sort((a, b) => VAL[b.t] - VAL[a.t]);
    const mine = gone.reduce((n, p) => n + VAL[p.t], 0);
    const theirs = pieces.filter(p => p.dead && p.c === c).reduce((n, p) => n + VAL[p.t], 0);
    const glyphs = gone.map(p => p.c === 'w' ? LINE[p.t] : FILL[p.t]).join('');
    el.innerHTML = `${glyphs || '&nbsp;'}${mine > theirs ? ` <b class="small">+${mine - theirs}</b>` : ''}`;
  };
  taken(topSide, $('capTop'));
  taken(bottomSide, $('capBottom'));
  const name = openingName();
  $('oname').innerHTML = name ? `<br><span class="muted">${esc(name)}</span>` : '';
  const book = idle() ? bookMoves() : [];
  $('bookWrap').hidden = !book.length;
  $('book').innerHTML = book.map(b => `<span class="bk" data-san="${esc(b)}">${esc(b)}</span>`).join('');
}
function syncNote() {
  const el = $('note');
  el.className = 'tiny ' + (note ? 't-orange' : 'muted');
  el.textContent = note || 'You play Black for Kai · Sam answers from the book';
}
function syncText() {
  const chk = attacked(kings[turn].s, foe(turn)) ? kings[turn].s : -1;
  const st = $('status');
  if (over) { st.className = 'badge'; st.textContent = over.title; }
  else if (thinking) { st.className = 'badge purple'; st.textContent = 'Sam is thinking…'; }
  else if (chk >= 0) { st.className = 'badge red'; st.textContent = 'Check!'; }
  else if (turn === 'b') { st.className = 'badge orange'; st.textContent = 'Black to move'; }
  else { st.className = 'badge'; st.textContent = 'White to move'; }
  const sans = history.map(m => m.san);
  const first = Math.max(0, sans.length - 16) & ~1;
  let pgn = first ? '<span class="n">…</span>' : '';
  for (let i = first; i < sans.length; i++) {
    pgn += (i % 2 ? '' : `<span class="n">${i / 2 + 1}.</span>`) + `<span class="m${i === sans.length - 1 ? ' last' : ''}">${sans[i]}</span> `;
  }
  $('pgn').innerHTML = pgn;
  $('hint').textContent = over ? 'Undo, or start a new game' : thinking ? 'Your move is on the board' : sel >= 0 ? `${targets.length} move${targets.length === 1 ? '' : 's'} · tap a dot` : turn === 'b' ? 'Tap a black piece' : 'Sam opens…';
  const canUndo = history.length > OPENING.length && !busy;
  $('undoBtn').classList.toggle('off', !canUndo);
}
function sync() {
  syncBoard();
  syncPieces();
  syncSide();
  syncNote();
  syncText();
}

reset();
setTimeout(intro, 250);
</script>
