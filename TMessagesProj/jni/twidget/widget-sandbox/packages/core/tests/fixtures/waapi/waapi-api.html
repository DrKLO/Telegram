<style>body{margin:0}.t{margin:10px;width:60px;height:20px;background:#34c759}</style>
<div class="t" id="a"></div><div class="t" id="b"></div><div class="t" id="c"></div>
<script>
const L = [];
const log = (...a) => L.push(a.map(v => typeof v === 'number' ? String(Math.round(v * 1000) / 1000) : typeof v === 'object' && v !== null ? JSON.stringify(v) : String(v)).join(' '));
const err = (name, f) => { try { f(); log(name, 'no-throw'); } catch (e) { log(name, e instanceof TypeError ? 'TypeError' : e.name); } };
const a = document.getElementById('a'), b = document.getElementById('b'), c = document.getElementById('c');
log('types', typeof Animation, typeof KeyframeEffect, typeof DocumentTimeline, typeof AnimationPlaybackEvent, typeof AnimationEffect, document.timeline instanceof DocumentTimeline, typeof document.getAnimations);
const k1 = new KeyframeEffect(a, { opacity: [0, 1], transform: ['translateX(0px)', 'translateX(10px)', 'translateX(30px)'] }, { duration: 1000, easing: 'ease-in' });
log('pi', k1.getKeyframes());
const k2 = new KeyframeEffect(a, [{ opacity: 0, easing: 'steps(2, end)' }, { opacity: 0.5, offset: 0.3 }, { opacity: 1, composite: 'add' }], 500);
log('arr', k2.getKeyframes());
log('timing', k2.getTiming());
const k3 = new KeyframeEffect(null, { opacity: [0, 1], offset: [0, 0.8], easing: ['linear', 'ease-out'] }, { duration: 100, iterations: 2, fill: 'both', direction: 'alternate', delay: 10, endDelay: 5, iterationStart: 0.5 });
log('pi-off', k3.getKeyframes());
log('ct-none', k3.getComputedTiming());
err('bad-offset', () => new KeyframeEffect(a, [{ opacity: 0, offset: 2 }]));
err('unsorted', () => new KeyframeEffect(a, [{ opacity: 0, offset: 0.6 }, { opacity: 1, offset: 0.2 }]));
err('bad-easing', () => new KeyframeEffect(a, { opacity: [0, 1] }, { easing: 'jump' }));
err('neg-duration', () => new KeyframeEffect(a, { opacity: [0, 1] }, { duration: -1 }));
err('nan-iter', () => new KeyframeEffect(a, { opacity: [0, 1] }, { iterations: NaN }));
err('neg-istart', () => new KeyframeEffect(a, { opacity: [0, 1] }, { iterationStart: -1 }));
err('bad-dir', () => new KeyframeEffect(a, { opacity: [0, 1] }, { direction: 'up' }));
err('bad-fill', () => new KeyframeEffect(a, { opacity: [0, 1] }, { fill: 'x' }));
err('str-duration', () => new KeyframeEffect(a, { opacity: [0, 1] }, { duration: '1s' }));
err('bad-composite', () => new KeyframeEffect(a, { opacity: [0, 1] }, { composite: 'mul' }));
err('bad-target', () => new KeyframeEffect({}, { opacity: [0, 1] }));
const anim = new Animation(k3, document.timeline);
log('new', anim.playState, anim.pending, anim.currentTime, anim.startTime, anim.effect === k3, anim.timeline === document.timeline, anim.replaceState);
anim.currentTime = 60;
log('seek', anim.playState, anim.currentTime, anim.effect.getComputedTiming().progress, anim.effect.getComputedTiming().currentIteration, anim.effect.getComputedTiming().localTime);
anim.currentTime = 160;
log('seek2', anim.playState, anim.effect.getComputedTiming().progress, anim.effect.getComputedTiming().currentIteration);
anim.currentTime = 500;
log('after', anim.playState, anim.effect.getComputedTiming().progress, anim.effect.getComputedTiming().currentIteration);
anim.currentTime = 0;
log('before', anim.playState, anim.effect.getComputedTiming().progress, anim.effect.getComputedTiming().currentIteration);
const p = a.animate({ opacity: [0, 1] }, { duration: 1000, id: 'p1' });
log('animate', p instanceof Animation, p.id, p.playState, p.pending, p.currentTime, p.startTime);
const ready1 = p.ready;
p.pause();
log('pause-pending', p.playState, p.pending, p.ready === ready1, p.currentTime);
p.currentTime = 250;
log('pause-seek', p.playState, p.pending, p.currentTime);
p.playbackRate = 2;
log('rate', p.playbackRate, p.currentTime, p.playState);
p.updatePlaybackRate(0.5);
log('update-rate', p.playbackRate, p.currentTime);
p.reverse();
log('reverse', p.playState, p.pending, p.playbackRate, Math.round(p.currentTime));
const inf = b.animate({ opacity: [0, 1] }, { duration: 100, iterations: Infinity });
err('finish-inf', () => inf.finish());
inf.playbackRate = 0;
err('finish-zero', () => inf.finish());
inf.cancel();
log('cancel', inf.playState, inf.currentTime, inf.startTime, inf.pending);
const f = c.animate({ opacity: [0, 1] }, { duration: 100000 });
f.finish();
log('finish', f.playState, f.currentTime, f.pending);
f.startTime = null;
log('startTime-null', f.playState, f.currentTime);
f.play();
log('play-after-finish', f.playState, f.currentTime, f.pending);
const g = c.animate({ opacity: [1, 0.5] }, 300);
g.pause();
log('getAnimations', a.getAnimations().map(x => x.id || 'x'), document.getAnimations().length, c.getAnimations().length);
document.body.getAnimations({ subtree: true }).forEach((x, i) => log('sub', i, x.effect.target.id));
inf.play();
log('relevance', b.getAnimations().length);
const ev = new AnimationPlaybackEvent('finish', { currentTime: 5, timelineTime: 10 });
log('event', ev.type, ev.currentTime, ev.timelineTime, ev instanceof Event);
const cm = a.animate({ marginLeft: ['0px', '40px'] }, { duration: 1000, fill: 'forwards' });
cm.pause();
cm.currentTime = 500;
cm.commitStyles();
log('commit', a.style.marginLeft);
cm.cancel();
const tl = new DocumentTimeline({ originTime: 100 });
log('timeline', typeof tl.currentTime, Math.round(document.timeline.currentTime - tl.currentTime));
const h = a.animate(null, 100);
log('null-kf', h.effect.getKeyframes().length, h.effect.target === a, h.effect.pseudoElement);
h.effect.updateTiming({ duration: 200, iterations: 3 });
log('update-timing', h.effect.getTiming().duration, h.effect.getComputedTiming().endTime, h.effect.getComputedTiming().activeDuration);
h.effect.setKeyframes([{ opacity: 1 }, { opacity: 0 }]);
log('set-kf', h.effect.getKeyframes().map(x => x.computedOffset));
log('easings', ['ease', 'steps(3, jump-both)', 'cubic-bezier(0.1, 0.2, 0.3, 0.4)', 'step-start', 'steps(2, end)', 'linear(0, 0.5, 1)'].map(e => new KeyframeEffect(null, null, { easing: e }).getTiming().easing));
requestAnimationFrame(() => { L.forEach(l => console.log(l)); });
</script>
