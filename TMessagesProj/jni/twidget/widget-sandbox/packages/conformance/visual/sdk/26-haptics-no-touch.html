<!-- conformance:mini --><style>html,body{margin:0;padding:0}body{font:14px/1.4 system-ui,sans-serif;color:var(--tg-theme-text-color,#111)}@media (prefers-color-scheme:dark){body{color:var(--tg-theme-text-color,#eee)}}.h{font-weight:600;font-size:15px;margin:10px 12px 2px}.i{margin:0 12px 8px;font-size:13px;color:var(--tg-theme-hint-color,#888)}.r{display:flex;flex-wrap:wrap;gap:6px;margin:6px 12px}.big{font-size:22px;font-weight:600;margin:4px 12px}#log{margin:8px 12px 10px;font:12px/1.45 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}</style><script>var S = (function () {

<body>
<div class="h">SDK 26 · Haptics without a touch</div>
<div class="i">Start, then hands off: 1 s of haptics, 9 s of none, 1 s more.</div>
<div class="v">State <b id="st">idle</b> · asked <b id="n">0</b></div>
<div class="r"><button id="go">Start</button><button id="hold">Hold and buzz</button></div>
<div id="log"></div>
<script>
var $ = function (id) { return document.getElementById(id); };
var TW = S.TW, H = TW && TW.HapticFeedback, n = 0, loop = 0, held = 0;
function ask() { if (H) { H.notificationOccurred('error'); $('n').textContent = ++n; } }
$('go').onclick = function () {
  if (loop) return;
  $('st').textContent = 'waiting 6 s';
  setTimeout(function () {
    var t0 = Date.now();
    $('st').textContent = 'asking every 50 ms';
    loop = setInterval(function () { ask(); if (Date.now() - t0 > 15000) { clearInterval(loop); loop = 0; $('st').textContent = 'done'; } }, 50);
  }, 6000);
};
var stop = 0;
$('hold').addEventListener('pointerdown', function () { clearTimeout(stop); clearInterval(held); held = setInterval(ask, 100); $('st').textContent = 'held'; });
['pointerup', 'pointercancel'].forEach(function (t) {
  $('hold').addEventListener(t, function () { $('st').textContent = 'lifted: asking 8 s more'; stop = setTimeout(function () { clearInterval(held); held = 0; $('st').textContent = 'done'; }, 8000); });
});
S.check('tw.haptic', 'HapticFeedback is there', !!H, '');
S.target('go', 'go'); S.target('hold', 'hold');
S.done();
</script>
