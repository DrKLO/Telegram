<body>
<div class="h">SDK 25 · Group chat state</div>
<div class="big" id="n"></div>
<div class="v">Last tap by <b id="by">nobody</b></div>
<div class="v">You: <b id="me"></b> · chatType <b id="ct"></b></div>
<div class="r"><button id="plus">+1</button><span id="a"></span></div>

<script>
var $ = function (id) { return document.getElementById(id); };
var TW = S.TW;
function err(e) { return e && e.code ? e.code : String(e); }
function show() {
  var s = {}; try { s = JSON.parse(TW.chatData) || {}; } catch (e) {}
  $('n').textContent = 'Count ' + (s.n || 0);
  $('by').textContent = s.by || 'nobody';
  $('me').textContent = TW.viewer ? (TW.viewer.first_name || TW.viewer.id) : 'none';
  $('ct').textContent = String(TW.chatType);
}
if (TW) { TW.onEvent('chatDataChanged', show); show(); }
$('plus').onclick = function () { if (TW) TW.request('conf:25:plus').then(function () { $('a').textContent = ''; }, function (e) { $('a').textContent = ' ' + err(e); }); };
