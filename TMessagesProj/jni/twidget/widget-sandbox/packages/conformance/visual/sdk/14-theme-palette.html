<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- conformance {"title":"Theme palette: themeParams and --tg-theme-* follow the chat live","hint":"Each row: the swatch from themeParams and the one from the CSS variable are the same colour and match the chat. Switch the theme or night mode: all rows change at once, the counter goes up.","expect":"Every themeParams key as #rrggbb, the same values as --tg-theme-* on the root, updated in one task with themeChanged.","contract":"docs/sdk-v1.md §2.3, §5.1","covers":["tw.theme-params","tw.events","behaviour.theme-switch","tw.theme"],"themes":["light","dark"]} -->
<!-- conformance:mini --><style>html,body{margin:0;padding:0}body{font:14px/1.4 system-ui,sans-serif;color:var(--tg-theme-text-color,#111)}@media (prefers-color-scheme:dark){body{color:var(--tg-theme-text-color,#eee)}}.h{font-weight:600;font-size:15px;margin:10px 12px 2px}.i{margin:0 12px 8px;font-size:13px;color:var(--tg-theme-hint-color,#888)}.r{display:flex;flex-wrap:wrap;gap:6px;margin:6px 12px}.big{font-size:22px;font-weight:600;margin:4px 12px}#log{margin:8px 12px 10px;font:12px/1.45 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}</style><script>var S = (function () {
  var r = document.documentElement, c = [], tg = {}, st = 'running';
  function rc(e) { var b = e.getBoundingClientRect(); return [b.left, b.top, b.width, b.height].map(function (v) { return Math.round(v * 10) / 10; }); }
  function pub() {
    var t = {};
    for (var k in tg) { var e = document.getElementById(tg[k]); if (e) t[k] = rc(e); }
    r.setAttribute('data-conformance', JSON.stringify({ v: 1, id: r.getAttribute('data-test'), status: st, checks: c, targets: t }));
  }
  function log(m, ok) {
    var l = document.getElementById('log');
    if (!l) return;
    var d = document.createElement('div');
    d.textContent = (ok === true ? '✓ ' : ok === false ? '✗ ' : '· ') + m;
    l.appendChild(d);
  }
  return {
    TW: typeof TelegramWidget !== 'undefined' ? TelegramWidget : null,
    check: function (id, name, ok, d) { c.push([id, name, ok ? 'pass' : 'fail', d || '']); log(name + (d ? ' (' + d + ')' : ''), !!ok); pub(); },
    log: log,
    target: function (n, id) { tg[n] = id; },
    start: function () { st = 'awaiting'; pub(); },
    done: function () { st = 'done'; pub(); },
  };
})();</script><!-- /conformance:mini -->
<style>
.p{display:flex;align-items:center;gap:6px;margin:2px 12px;font:12px ui-monospace,monospace}
.p i{display:inline-block;width:28px;height:18px;border-radius:4px;box-shadow:0 0 0 1px #8886}
</style>
</head>
<body>
<div class="h">SDK 14 · Theme palette</div>
<div class="i">Both swatches equal and like the chat; switch the theme: all change at once.</div>
<div id="s" class="i"></div>
<div id="rows"></div>
<div id="log"></div>
<script>
var KEYS = ['bg_color', 'text_color', 'hint_color', 'link_color', 'button_color', 'button_text_color', 'secondary_bg_color', 'accent_text_color', 'subtitle_text_color', 'destructive_text_color', 'section_bg_color', 'section_header_text_color', 'section_separator_color', 'header_bg_color', 'bottom_bar_bg_color'];
var changes = 0;
function draw() {
  var p = (S.TW && S.TW.themeParams) || {}, rows = document.getElementById('rows');
  document.getElementById('s').textContent = 'colorScheme ' + (S.TW && S.TW.colorScheme) + ' · changes ' + changes;
  rows.textContent = '';
  KEYS.forEach(function (k) {
    var d = document.createElement('div'), a = document.createElement('i'), b = document.createElement('i');
    d.className = 'p'; a.style.background = p[k] || 'transparent'; b.style.background = 'var(--tg-theme-' + k.replace(/_/g, '-') + ')';
    d.appendChild(a); d.appendChild(b); d.appendChild(document.createTextNode(k + ' ' + (p[k] || '—')));
    rows.appendChild(d);
  });
}
if (S.TW && S.TW.onEvent) S.TW.onEvent('themeChanged', function () { changes++; draw(); });
if (!S.TW || !S.TW.themeParams) S.log('themeParams is missing (SDK v1)', false);
draw(); S.done();
</script>
</body>
</html>
