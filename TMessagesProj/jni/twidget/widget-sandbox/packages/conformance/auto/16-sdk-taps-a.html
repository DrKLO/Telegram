<body>
<div class="conf-head">16a · SDK and taps (1/3)</div>
<div class="conf-probes">
  <button id="link">link</button><a id="anchor" href="https://example.org/conformance/anchor">anchor</a><a id="anchor-prevented" href="https://example.org/conformance/prevented">prevented</a>
</div>
<div id="conf-list"></div>
<script>
var TW = typeof TelegramWidget !== 'undefined' ? TelegramWidget : null;
var S = T.sandbox ? {} : { sandboxOnly: true };
['link', 'anchor', 'anchor-prevented'].forEach(function (n) { T.target(n, '#' + n); });

var tap = T.wait('input.tap', 'click on the tapped element with coordinates inside it', { hint: 'tap “link”' });
var ptr = T.wait('input.pointer', 'pointerdown → pointerup → click, primary pointer with an id and type');
var mouse = T.wait('input.mouse-compat', 'mousedown → mouseup on a tap');
var openLink = T.wait('tw.open-link', 'openLink is callable in the task of a tap', S);
var anchorTap = T.wait('html.el.a-external', 'an external link tap reaches the widget as a click');
var prevented = T.wait('input.prevent-default', 'preventDefault on a link click is honoured', { hint: 'tap “prevented”' });
var seq = [];

var link = document.getElementById('link');
['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'click'].forEach(function (t) { link.addEventListener(t, function (e) { seq.push(t); if (t === 'pointerdown') link._pd = e; }); });
link.addEventListener('click', function (e) {
  var r = link.getBoundingClientRect();
  tap.result(e.target === link && e.clientX >= r.left - 1 && e.clientX <= r.right + 1 && e.clientY >= r.top - 1 && e.clientY <= r.bottom + 1, e.clientX + ',' + e.clientY + ' in ' + Math.round(r.left) + ',' + Math.round(r.top));
  var pd = link._pd;
  ptr.result(seq.indexOf('pointerdown') >= 0 && seq.indexOf('pointerup') > seq.indexOf('pointerdown') && seq.indexOf('click') > seq.indexOf('pointerup') && !!pd && pd.isPrimary === true && typeof pd.pointerId === 'number' && /mouse|touch|pen/.test(pd.pointerType), seq.join(',') + ' ' + (pd && pd.pointerType));
  mouse.result(seq.indexOf('mousedown') >= 0 && seq.indexOf('mouseup') > seq.indexOf('mousedown'), seq.join(','));
  if (TW) { try { TW.openLink('https://example.org/conformance/tap'); openLink.pass(); } catch (err) { openLink.fail(String(err)); } }
});
document.getElementById('anchor').addEventListener('click', function () { anchorTap.pass(); });
document.getElementById('anchor-prevented').addEventListener('click', function (e) { e.preventDefault(); prevented.result(e.defaultPrevented === true, String(e.defaultPrevented)); });
// A privileged call outside a gesture: the host must drop it (checked by the runner on the bridge log).
if (TW) setTimeout(function () { TW.openLink('https://example.org/conformance/timer'); }, 30);

T.step(function () {
  // SDK v1 contract (docs/sdk-v1.md): argument checks throw TypeError synchronously; valid calls outside a press are dropped by the host.
  var throwsType = function (fn) { try { fn(); return false; } catch (e) { return !!e && e.name === 'TypeError'; } };
  var noThrow = function (fn) { try { fn(); return true; } catch (e) { return false; } };
  var pad = function (n) { var b = 'https://example.org/'; return b + new Array(n - b.length + 1).join('a'); };
  T.ok('tw.open-link', 'openLink rejects non-https, user info, javascript: and t.me hosts with TypeError', !!TW && ['http://example.org/', 'javascript:alert(1)', 'https://user:pw@example.org/', 'https://t.me/telegram', 'example.org', 'tg://resolve?domain=telegram'].every(function (u) { return throwsType(function () { TW.openLink(u); }); }), '', S);
  T.ok('limit.url-length', 'a 257-character URL throws TypeError', !!TW && throwsType(function () { TW.openLink(pad(257)); }), '', S);
  T.ok('limit.url-length', 'a 256-character URL is accepted (dropped later without a press)', !!TW && noThrow(function () { TW.openLink(pad(256)); }), '', S);
});
T.run({ awaitInput: 20000 });
</script>
</body>
</html>
