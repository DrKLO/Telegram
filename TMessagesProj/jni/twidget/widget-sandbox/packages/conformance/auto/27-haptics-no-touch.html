<div class="conf-head">27 · Haptics without a touch</div>
<div id="conf-list"></div>
<script>
// No touch at all (do not tap this widget): 5 haptics at once open a series (the burst passes), the calls at 1.2 s and
// 2.5 s fall outside it and are dropped (haptic-limit). The runner counts the haptics the host let through.
var TW = typeof TelegramWidget !== 'undefined' ? TelegramWidget : null;
var S = T.sandbox ? {} : { sandboxOnly: true };
var H = TW && TW.HapticFeedback, asked = 0;
function buzz(n) { for (var i = 0; i < n; i++) { try { H.impactOccurred('rigid'); asked++; } catch (e) {} } }
T.step(function () { if (H) buzz(5); return 1200; });
T.step(function () { if (H) buzz(3); return 1300; });
T.step(function () {
  if (H) buzz(3);
  T.ok('limit.haptic-rate', 'haptics may be asked for without a touch: no exception (the client decides what plays)', !!H && asked === 11, asked + ' asked', S);
});
T.run();
</script>
