<body>
<div class="conf-head">26 · Context: no-queries</div>
<div class="conf-probes"><button id="ask" style="width:160px;height:36px">Ask (a tap)</button></div>
<div id="conf-list"></div>
<script>
// What the client must pass for an original sent without allow_queries (docs/sdk-v1.md §2.13, §2.14, §2.16; docs/tgw-format.md "Who may request").
// The test bot sends it with chat_data "conf-chat" and public_data "conf-public"; run-web gives the mock bot's
// "no-queries" context the same data.
var TW = typeof TelegramWidget !== 'undefined' ? TelegramWidget : null;
var S = T.sandbox ? {} : { sandboxOnly: true };
var E = {"fwd": false, "preview": false, "chat": ["private"], "viewer": false, "chatData": "conf-chat", "bg": false, "tap": false};
T.step(function () {
  if (!TW) return T.ok('tw.context', 'TelegramWidget exists', false, 'no SDK', S);
  T.ok('tw.context', 'isForward is ' + E.fwd + ', isPreview ' + E.preview, TW.isForward === E.fwd && TW.isPreview === E.preview, TW.isForward + ' / ' + TW.isPreview, S);
  T.ok('tw.context', 'chatType is ' + E.chat.join(' or '), E.chat.indexOf(TW.chatType) >= 0, String(TW.chatType), S);
  T.ok('tw.context', E.viewer ? 'viewer is the user (an id)' : 'viewer is null', E.viewer ? !!TW.viewer && Number.isInteger(TW.viewer.id) : TW.viewer === null, JSON.stringify(TW.viewer).slice(0, 60), S);
  T.ok('tw.bot-data', 'chatData is ' + JSON.stringify(E.chatData) + ', publicData "conf-public"', TW.chatData === E.chatData && TW.publicData === 'conf-public', JSON.stringify([TW.chatData, TW.publicData]), S);
});
// Without a tap a request goes out only where the message may ask in the background; elsewhere NOT_ALLOWED at once.
// It runs after the tap's request has settled (one request in flight per widget).
var bg = T.wait('tw.request', E.bg ? 'a request without a tap is not refused (background requests are allowed here)' : 'a request without a tap is refused with NOT_ALLOWED', S);
function background() {
  var p;
  try { p = TW && TW.request('conf:a26:bg'); } catch (e) { return bg.fail('threw ' + e); }
  if (!p) return bg.fail('no request');
  p.then(function () { bg.result(E.bg, 'resolved'); }, function (e) { bg.result(E.bg ? e.code !== 'NOT_ALLOWED' : e.code === 'NOT_ALLOWED', e.code); });
}
// A tap: still NOT_ALLOWED: the server allows no requests here.
var tap = T.wait('tw.request', 'a request on a tap is refused with NOT_ALLOWED too', S);
document.getElementById('ask').onclick = function () {
  var p;
  try { p = TW.request('conf:a26:tap'); } catch (x) { return tap.fail('threw ' + x); }
  p.then(function (a) { tap.result(E.tap && typeof a.result === 'string', 'result ' + JSON.stringify(a.result)); }, function (x) { tap.result(!E.tap && x.code === 'NOT_ALLOWED', x.code); })
    .then(function () { setTimeout(background, 0); });
};
T.target('ask', '#ask');
T.run({ awaitInput: 20000 });
</script>
