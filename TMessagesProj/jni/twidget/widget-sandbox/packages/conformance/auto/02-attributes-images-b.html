<script>
// Image decoding is reported by the renderer through load / error events.
function onImage(id, catId, name, want, opts) {
  var h = T.wait(catId, name, opts);
  var el = document.getElementById(id);
  var judge = function (ev) { var n = el.naturalWidth; h.result(want(ev.type, n), ev.type + ', naturalWidth ' + n); };
  el.addEventListener('load', judge);
  el.addEventListener('error', judge);
  if (el.complete && el.naturalWidth) judge({ type: 'load' });
}
onImage('i-png', 'html.el.img', 'PNG decodes (naturalWidth 2)', function (t, n) { return t === 'load' && n === 2; });
onImage('i-gif', 'html.el.img', 'GIF decodes (naturalWidth 1)', function (t, n) { return t === 'load' && n === 1; });
onImage('i-svg', 'html.el.img-svg', 'an SVG image is refused: the 48px placeholder (profile 1: out)', function (t, n) { return t === 'load' && n === 48; });
onImage('i-bmp', 'html.el.img-other-formats', 'BMP is refused (placeholder, not the 2px image)', function (t, n) { return n !== 2; });
onImage('i-ico', 'html.el.img-other-formats', 'ICO is refused (placeholder, not the 2px image)', function (t, n) { return n !== 2; });
onImage('i-remote', 'html.el.img-remote', 'a remote image becomes the 48px placeholder', function (t, n) { return t === 'load' && n === 48; }, { sandboxOnly: true });
onImage('i-css', 'html.el.img', 'img.width is the rendered width (12, not the attribute\'s 30)', function (t) { var el = document.getElementById('i-css'); return t === 'load' && el.width === 12; });
onImage('i-broken', 'html.el.img', 'a broken image fires error and is complete, with no natural size', function (t, n) { return t === 'error' && n === 0 && document.getElementById('i-broken').complete; });
// A script's image loads before it is inserted, as in a browser.
var made = T.wait('html.el.img', 'new Image() loads before it is inserted: naturalWidth, complete, width');
var img = new Image();
img.onload = function () { made.result(img.naturalWidth === 2 && img.complete && img.width === 2, 'naturalWidth ' + img.naturalWidth + ', complete ' + img.complete + ', width ' + img.width); };
img.onerror = function () { made.fail('error'); };
img.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAE0lEQVR4AWM8Y2z8nwEImBigAAAh4QI1lhEEowAAAABJRU5ErkJggg==';
T.run({ deadline: 4000 });
</script>
