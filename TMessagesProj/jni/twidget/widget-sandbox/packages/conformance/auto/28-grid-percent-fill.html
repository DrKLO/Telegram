<style>
#os button{display:grid;grid-template-columns:52px 1fr auto;align-items:center;row-gap:6px;width:100%;margin:0;padding:8px 8px 10px 0;background:none;border-radius:12px;color:inherit;font:inherit;text-align:left;transition:opacity .3s,background .2s}

.v .b i{opacity:.35}

<body>
<div class="conf-head">28 · Grid row with a percentage fill</div>
<div class="conf-probes"><div id="os"></div></div>
<div id="conf-list"></div>
<script>
// A poll's options (corpus/bot-demos/02-poll), built as it builds them. Seen on clients in a 100 % row: the button
// wider than its container, the auto column ~200 px (the count mid-row). Per option: label, % and count at load, after.
var O = [['Friday', 0, 0, 100, 7], ['Saturday after lunch, if it does not rain', 60, 803, 100, 1204], ['Sunday', 20, 1, 35, 3], ['Never', 0, 0, 0, 0]];
var R = T.rect, os = document.getElementById('os'), rows, at = 1, tok = 0;
os.innerHTML = O.map(function (o) { return '<button><span class="p"></span><span class="l"><span class="n">' + o[0] + '</span><span class="k"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span><span class="c"><span></span></span><i class="b"><i></i></i></button>'; }).join('');
rows = [].slice.call(os.children);
// k: the column of O to show (1 at load, 3 after the vote), tweened from the one shown before.
function draw(k) {
  rows.forEach(function (b, i) { b.children[3].firstChild.style.width = O[i][k] + '%'; });
  var a = at, t0 = Date.now(), id = ++tok;
  at = k;
  (function s() {
    if (id != tok) return;
    var e = Math.min(1, (Date.now() - t0) / 600), f = 1 - Math.pow(1 - e, 3);
    rows.forEach(function (b, i) {
      b.children[0].textContent = Math.round(O[i][a] + (O[i][k] - O[i][a]) * f) + '%';
      b.children[2].firstChild.textContent = Math.round(O[i][a + 1] + (O[i][k + 1] - O[i][a + 1]) * f);
    });
    if (e < 1) requestAnimationFrame(s);
  })();
}
var px = function (v) { return Math.round(v * 10) / 10; };
function each(id, name, f) {
  var bad = [];
  rows.forEach(function (b, i) { var r = R(b), d = f(r, b.children[2].firstChild, R(b.children[3]), R(b.children[3].firstChild), i); if (d) bad.push('row ' + (i + 1) + ': ' + d); });
  T.ok(id, name, !bad.length, bad.join('; '));
}
function rowsFit(when) {
  var o = R(os);
  each('css.box.size', when + 'every row is as wide as its container (width: 100%)', function (r) {
    return Math.abs(r.x - o.x) > 0.5 || Math.abs(r.w - o.w) > 0.5 ? px(r.w) + ' px at ' + px(r.x - o.x) + ' in ' + px(o.w) : '';
  });
  each('css.display.grid', when + 'each count ends at the row\'s end (the auto column fits the count)', function (r, c) {
    c = R(c);
    return Math.abs(r.r - 8 - c.r) > 1 ? 'count ' + px(c.x - r.x) + '–' + px(c.r - r.x) + ', want its end at ' + px(r.w - 8) : '';
  });
}
draw(1);
T.step(function () {
  rowsFit('at load: ');
  os.className = 'v';
  rows[0].className = 'm';
  draw(3);
  return 1000;
});
T.step(function () {
  rowsFit('at 100 %: ');
  each('css.display.grid', 'the bar spans columns 2–3, from 52 px to the row\'s end (grid-column: 2/4)', function (r, c, t) {
    return Math.abs(t.x - r.x - 52) > 0.5 || Math.abs(r.r - 8 - t.r) > 0.5 ? 'bar ' + px(t.x - r.x) + '–' + px(t.r - r.x) + ' in ' + px(r.w) : '';
  });
  each('css.box.size', 'no fill runs past its bar\'s right edge', function (r, c, t, f) {
    return f.r > t.r + 0.5 ? 'fill ends ' + px(f.r - t.r) + ' px past its bar' : '';
  });
  each('anim.transition', 'after the width transition each fill is its percentage of the bar', function (r, c, t, f, i) {
    return Math.abs(f.x - t.x) > 0.5 || Math.abs(f.w - t.w * O[i][3] / 100) > 1 ? 'fill ' + px(f.w) + ' of ' + px(t.w) + ', want ' + O[i][3] + ' %' : '';
  });
});
T.run();
</script>
