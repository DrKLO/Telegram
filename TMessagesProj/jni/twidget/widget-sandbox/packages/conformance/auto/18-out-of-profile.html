<style>
.conf-probes{font:13px/16px sans-serif}
.cell{display:inline-block;vertical-align:top;margin:2px}
dialog{margin:0;padding:4px;border:1px solid #333}

<body>
<div class="conf-head">18 · Out-of-profile elements</div>
<div class="conf-probes">
  <div><span class="cell"><input id="f-text" value="text"></span><span class="cell"><input id="f-check" type="checkbox" checked><span id="f-check-next">c</span></span><span class="cell"><input id="f-radio" type="radio" checked></span><span class="cell"><input id="f-range" type="range"></span></div>
  <div><span class="cell"><select id="f-select"><option>one</option></select></span><span class="cell"><textarea id="f-area" rows="1">area</textarea></span><span class="cell"><label id="f-label" for="f-text" style="display:inline-block;min-width:1px">label</label></span><fieldset id="f-fs" class="cell"><legend>l</legend></fieldset></div>
  <form id="f-form" style="display:inline-block"><button id="f-submit">submit</button></form>
  <div id="dlg-host" style="position:relative;height:30px"><dialog id="dlg">modal</dialog><div id="pop" popover>popover</div></div>
  <div><video id="m-video" width="40" height="20" controls src="data:video/mp4;base64,AAAA"></video><audio id="m-audio" controls src="data:audio/wav;base64,UklGRg=="></audio></div>
  <div><iframe id="e-iframe" width="40" height="20" srcdoc="<p>x</p>"></iframe><object id="e-object" width="40" height="20" data="data:text/html,x"></object><embed id="e-embed" width="40" height="20" src="data:text/html,x"><math id="e-math"><mi>x</mi></math></div>
</div>
<div id="conf-list"></div>
<script>
var R = T.rect;
var none = function (sel) { var r = R(sel); return [r.w === 0 && r.h === 0, r.w + 'x' + r.h]; };
var submitted = T.wait('html.el.forms', 'form submission never navigates (submit reaches the widget)', T.sandbox ? {} : { sandboxOnly: true });
document.getElementById('f-form').addEventListener('submit', function (e) { e.preventDefault(); setTimeout(function () { submitted.result(!document.hidden, 'still here'); }, 50); });
T.step(function () {
  T.check('html.el.forms', 'input type=text is not drawn', none('#f-text'));
  T.check('html.el.forms', 'checkbox is not drawn', none('#f-check'));
  T.check('html.el.forms', 'radio is not drawn', none('#f-radio'));
  T.check('html.el.forms', 'range is not drawn', none('#f-range'));
  T.check('html.el.forms', 'select is not drawn', none('#f-select'));
  T.check('html.el.forms', 'textarea is not drawn', none('#f-area'));
  T.check('html.el.forms', 'fieldset is not drawn', none('#f-fs'));
  T.ok('sel.form-state', ':checked does not match (the control is gone)', T.color('#f-check-next', 'color') !== '7,7,7,1', T.color('#f-check-next', 'color'));
  if (T.sandbox) document.getElementById('f-submit').click();
  var dlg = document.getElementById('dlg');
  try { dlg.showModal(); } catch (e) {}
  var dr = R('#dlg'), host = R('#dlg-host');
  T.ok('html.el.dialog-popover', 'showModal does not put the dialog in the top layer (:modal never matches)', T.color('#dlg', 'outline-color') !== '1,2,3,1', T.color('#dlg', 'outline-color'));
  T.ok('html.el.dialog-popover', 'a shown dialog stays where the widget put it', Math.abs(dr.y - host.y) < 2 && dr.x >= 0 && dr.r <= window.innerWidth + 0.5, 'dialog at ' + Math.round(dr.x) + ',' + Math.round(dr.y) + ' (' + Math.round(dr.w) + 'x' + Math.round(dr.h) + '), its place ' + Math.round(host.x) + ',' + Math.round(host.y));
  try { dlg.close(); } catch (e) {}
  var pop = document.getElementById('pop');
  try { pop.showPopover(); } catch (e) {}
  var pr = R('#pop');
  T.ok('html.el.dialog-popover', 'showPopover does not open a top-layer popover', T.color('#pop', 'outline-color') !== '4,5,6,1', T.color('#pop', 'outline-color'));
  T.ok('html.el.dialog-popover', 'a popover stays inside the widget', pr.w === 0 || (pr.x >= 0 && pr.r <= window.innerWidth + 0.5 && Math.abs(pr.y - host.y) < 40), 'popover at ' + Math.round(pr.x) + ',' + Math.round(pr.y) + ' (' + Math.round(pr.w) + 'x' + Math.round(pr.h) + ')');
  try { pop.hidePopover(); } catch (e) {}
  T.check('html.el.media', 'video is dropped', none('#m-video'));
  T.check('html.el.media', 'audio is dropped', none('#m-audio'));
  T.check('html.el.embedding', 'iframe is dropped', none('#e-iframe'));
  T.check('html.el.embedding', 'object is dropped', none('#e-object'));
  T.check('html.el.embedding', 'embed is dropped', none('#e-embed'));
  T.check('html.el.embedding', 'MathML is dropped', none('#e-math'));
});
T.run({ deadline: 2500 });
</script>
