<div class="conf-head">01b · HTML elements (2/3)</div>
<div class="conf-probes">
  <pre id="pre">a
b</pre>
  <div class="row" style="position:relative"><blockquote id="bq">q</blockquote><figure id="fig"><figcaption>f</figcaption></figure></div>
  <div class="row" style="position:relative"><ul id="ul"><li>a</li></ul><ol id="ol"><li>a</li></ol><dl id="dl"><dt>t</dt><dd id="dd">d</dd></dl><menu id="menu"><li>m</li></menu></div>
  <table class="tbl" id="tbl"><caption id="cap">c</caption><tr><th id="th">h</th><td id="c12">b</td></tr><tr><td colspan="2" id="span2">wide</td></tr><tr><td rowspan="2" id="rs">r</td><td>1</td></tr><tr><td id="r2">2</td></tr></table>
  <div class="row" style="font-size:20px;line-height:40px"><ruby id="ruby">漢<rp>(</rp><rt id="rt">kan</rt><rp>)</rp></ruby></div>
</div>
<div id="conf-list"></div>
<script>
var R = T.rect, CS = T.cs;
var fw = function (sel) { var w = CS(sel, 'font-weight'); return w === 'bold' ? 700 : parseInt(w, 10); };
var px = function (sel, prop, pseudo) { return parseFloat(CS(sel, prop, pseudo)); };

T.step(function () {
  T.ok('html.el.pre', 'pre keeps the line break', R('#pre').h >= 26, 'h ' + R('#pre').h);
  T.ok('html.el.pre', 'pre is monospace', /monospace/.test(CS('#pre', 'font-family')), CS('#pre', 'font-family'));

  T.ok('html.el.blockquote', 'blockquote is set off by the UA layer: a 3px bar and 0.75em before the text', px('#bq', 'border-left-width') === 3 && Math.abs(px('#bq', 'padding-left') - 9.75) < 0.5, CS('#bq', 'border-left-width') + ' ' + CS('#bq', 'padding-left'));
  T.near('html.el.blockquote', 'figure has no indent', px('#fig', 'margin-left'), 0, 0.5);

  T.near('html.el.lists', 'ul is padded 1.5em', px('#ul', 'padding-left'), 19.5, 0.5);
  T.eq('html.el.lists', 'ul items have discs', CS('#ul li', 'list-style-type'), 'disc');
  T.eq('html.el.lists', 'ol items are numbered', CS('#ol li', 'list-style-type'), 'decimal');
  T.near('html.el.lists', 'dd is indented 1.5em', px('#dd', 'margin-left'), 19.5, 0.5);
  T.near('html.el.lists', 'menu is a padded list', px('#menu', 'padding-left'), 19.5, 0.5);

  var th = R('#th'), c12 = R('#c12'), sp = R('#span2'), rs = R('#rs'), r2 = R('#r2'), cap = R('#cap');
  T.ok('html.el.table', 'cells sit side by side', Math.abs(c12.x - th.r) < 1 && Math.abs(c12.y - th.y) < 1, th.r + ' / ' + c12.x);
  T.near('html.el.table', 'colspan=2 spans both columns', sp.w, th.w + c12.w, 1);
  T.ok('html.el.table', 'rowspan=2 spans two rows', rs.h >= 2 * r2.h - 1 && Math.abs(rs.b - r2.b) < 1, rs.h + ' vs ' + r2.h);
  T.ok('html.el.table', 'caption sits above the rows', cap.b <= th.y + 0.5, cap.b + ' / ' + th.y);
  T.ok('html.el.table', 'th is bold and start-aligned', fw('#th') >= 600 && /^(start|left)$/.test(CS('#th', 'text-align')), fw('#th') + ' ' + CS('#th', 'text-align'));

  var rt = R('#rt'), rb = R('#ruby');
  T.ok('html.el.ruby', 'ruby renders as a span: rt stays inline, not above the base (profile 1: out)', !(rt.h > 0 && rt.b <= rb.y + rb.h / 2), 'rt ' + rt.y + '-' + rt.b + ' ruby ' + rb.y + '-' + rb.b);
  T.ok('html.el.ruby', 'rt keeps the text size (a plain span)', px('#rt', 'font-size') === 20, CS('#rt', 'font-size'));
});
T.run();
</script>
