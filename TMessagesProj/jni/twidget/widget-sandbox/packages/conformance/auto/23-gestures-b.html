<style>
.conf-probes{font:13px/16px sans-serif}
.g{display:inline-block;width:70px;height:40px;margin:2px;line-height:40px;text-align:center;background:#dde;vertical-align:top}
#vnone{touch-action:none;background:#bdf}
#vpanx{touch-action:pan-x;background:#bdf}
#pad{position:relative;height:40px;margin:6px -8px;background:#bdf;touch-action:none}
#edge,#mid{position:absolute;top:0;width:12px;height:40px}
#edge{left:0;background:#e66}
#mid{left:60px;background:#6a6}
#finish{width:80px;height:28px}
</style>

<body>
<div class="conf-head">23b · Who gets a press</div>
<div class="conf-probes">
  <span class="g" id="vnone">none ↕</span><span class="g" id="vpanx">pan-x ↕</span>
  <div id="pad"><span id="edge"></span><span id="mid"></span></div>
  <button id="finish">Finish</button>
</div>
<div id="conf-list"></div>
<script>
['vnone', 'vpanx', 'edge', 'mid', 'finish'].forEach(function (n) { T.target(n, '#' + n); });
var SB = { sandboxOnly: true };
var vNone = T.wait('behaviour.gesture-claim', 'a vertical drag on touch-action: none is the chat\'s scroll: pointercancel (a mouse drag stays the widget\'s)', SB);
var vPanx = T.wait('behaviour.gesture-claim', 'a vertical drag on touch-action: pan-x is the chat\'s scroll too: pointercancel', SB);
var edge = T.wait('behaviour.gesture-claim', 'a drag from the leading 20 px of a touch-action: none pad is the back gesture: pointercancel (a mouse drag stays the widget\'s)', SB);
var mid = T.wait('behaviour.gesture-claim', 'the same drag from 60 px in is the widget\'s: moves, pointerup, no pointercancel');
var $ = function (id) { return document.getElementById(id); };
// Per element: the press's pointerType, contextmenus, clicks, a pointercancel.
function watch(id, on) {
  var s = { ctx: 0, clicks: 0, dbl: 0, cancel: 0, moves: 0 };
  var el = $(id);
  el.addEventListener('pointerdown', function (e) { s.type = e.pointerType; s.x = e.clientX; s.moves = 0; el.setPointerCapture(e.pointerId); on('down', e, s); });
  el.addEventListener('pointermove', function (e) { if (e.buttons) s.moves++; });
  ['pointerup', 'pointercancel', 'click', 'dblclick', 'contextmenu'].forEach(function (t) {
    el.addEventListener(t, function (e) { if (t === 'contextmenu') { s.ctx++; e.preventDefault(); } if (t === 'click') s.clicks++; if (t === 'dblclick') s.dbl++; if (t === 'pointercancel') s.cancel++; on(t, e, s); });
  });
}
[['vnone', vNone], ['vpanx', vPanx]].forEach(function (v) {
  watch(v[0], function (t, e, s) {
    if (t === 'pointercancel') v[1].result(s.type !== 'mouse', s.type + ': pointercancel');
    if (t === 'pointerup') v[1].result(s.type === 'mouse', s.type + ': pointerup after ' + s.moves + ' moves');
  });
});
watch('pad', function (t, e, s) {
  var near = s.x < 20;
  if (t === 'pointercancel') (near ? edge : mid).result(near && s.type !== 'mouse', s.type + ' at x ' + Math.round(s.x) + ': pointercancel');
  if (t === 'pointerup') near ? edge.result(s.type === 'mouse', s.type + ': pointerup') : mid.result(s.moves >= 3, s.moves + ' moves');
});
T.run({ awaitInput: 20000 });
</script>
</body>
