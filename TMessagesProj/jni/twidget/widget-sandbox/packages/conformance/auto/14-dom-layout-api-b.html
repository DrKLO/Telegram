<script>
var R = T.rect, CS = T.cs;
var roHit = T.wait('js.layout.resize-observer', 'ResizeObserver reports the new width');
var ioHit = T.wait('js.layout.intersection-observer', 'IntersectionObserver reports the element (visible)');
var ro = new ResizeObserver(function (entries) {
  var e = entries[entries.length - 1];
  if (e && Math.round(e.contentRect.width) === 90) { roHit.pass(String(e.contentRect.width)); ro.disconnect(); }
});
ro.observe(document.getElementById('ro'));
new IntersectionObserver(function (es) { ioHit.result(es[0] && es[0].isIntersecting === true, es[0] && String(es[0].isIntersecting)); }).observe(document.getElementById('ro'));

T.step(function () {
  var host = document.getElementById('host');
  T.eq('js.dom.query', 'querySelectorAll', document.querySelectorAll('.conf-probes > div').length, 6);
  T.ok('js.dom.query', 'closest and matches', document.getElementById('ev-btn').closest('#ev-outer') !== null && document.getElementById('ev-btn').matches('#ev-outer > button'), '');
  var live = document.getElementsByClassName('liveq');
  var n0 = live.length; var l = document.createElement('i'); l.className = 'liveq'; host.appendChild(l);
  T.ok('js.dom.query', 'getElementsByClassName is live', n0 === 0 && live.length === 1, n0 + ' → ' + live.length);

  var rects = document.getElementById('inl').getClientRects();
  T.ok('js.layout.rect', 'getClientRects of a wrapped inline gives one rect per line', rects.length >= 2, String(rects.length));
  T.ok('js.layout.rect', 'getBoundingClientRect has DOMRect fields', typeof R('#bx').w === 'number' && (function () { var r = document.getElementById('bx').getBoundingClientRect(); return r.right - r.left === r.width && r.bottom === r.top + r.height; })(), '');

  T.eq('js.layout.box', 'clientWidth excludes the border', bx.clientWidth, 110);
  T.eq('js.layout.box', 'scrollHeight of overflowing content', bx.scrollHeight, 70);
  T.eq('js.layout.box', 'offsetParent', bx.offsetParent === document.body || (bx.offsetParent && bx.offsetParent.tagName === 'BODY'), true);
  T.eq('js.layout.computed-style', 'longhand (width)', CS('#bx', 'width'), '100px');
  T.eq('js.layout.computed-style', 'shorthand white-space', CS('#bx', 'white-space'), 'nowrap');
  T.eq('js.layout.computed-style', 'shorthand overflow', CS('#bx', 'overflow'), 'hidden');
  T.eq('js.layout.computed-style', 'shorthand margin', CS('#bx', 'margin'), '4px 0px');
