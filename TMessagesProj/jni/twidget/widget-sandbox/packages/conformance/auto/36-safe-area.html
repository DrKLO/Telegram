<script>
var TW = typeof TelegramWidget !== 'undefined' ? TelegramWidget : null;
var S = T.sandbox ? {} : { sandboxOnly: true };
// What the host passed (natively: nothing over the page, all 0).
var SA = TW && TW.contentSafeAreaInset || { top: 0, right: 0, bottom: 0, left: 0, cornerLeft: 0, cornerRight: 0 };
var W = function (s) { return T.rect(s).w; };
var v = function (n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); };
var KEYS = ['top', 'right', 'bottom', 'left', 'cornerLeft', 'cornerRight'];

T.step(function () {
  var a = TW && TW.contentSafeAreaInset;
  T.ok('tw.content-safe-area', 'contentSafeAreaInset: a frozen object of six numbers, the same object on every read', !!a && Object.isFrozen(a) && a === TW.contentSafeAreaInset && Object.keys(a).sort().join() === KEYS.slice().sort().join()
    && KEYS.every(function (k) { return typeof a[k] === 'number' && isFinite(a[k]); }), a ? JSON.stringify(a) : 'no SDK', S);
  T.ok('tw.content-safe-area', 'only the bottom band: top, left and right are 0; the band 0–64, a corner 0–200', SA.top === 0 && SA.left === 0 && SA.right === 0 && SA.bottom >= 0 && SA.bottom <= 64
    && SA.cornerLeft >= 0 && SA.cornerLeft <= 200 && SA.cornerRight >= 0 && SA.cornerRight <= 200, JSON.stringify(SA));
  T.ok('tw.content-safe-area', 'one corner at most, on one side, and only with a band', !(SA.cornerLeft && SA.cornerRight) && (SA.bottom > 0 || !(SA.cornerLeft || SA.cornerRight)), JSON.stringify(SA));
  T.eq('tw.content-safe-area', 'the root variables are its values', ['inset-top', 'inset-right', 'inset-bottom', 'inset-left', 'corner-left', 'corner-right'].map(function (n) { return v('--tg-content-safe-area-' + n); }).join(),
    [SA.top, SA.right, SA.bottom, SA.left, SA.cornerLeft, SA.cornerRight].map(function (n) { return n + 'px'; }).join(), S);

  // Bare: the renderer's UA layer pads an unstyled body for the band.
  T.near('tw.content-safe-area', "body: the band as bottom padding (the UA layer)", parseFloat(getComputedStyle(document.body).paddingBottom), SA.bottom, 0.5);
  T.near('css.value.env', 'env(safe-area-inset-bottom) is the band', W('#e1'), SA.bottom, 0.5);
  T.near('css.value.env', 'env(safe-area-inset-bottom, 77px) is the band, not the fallback', W('#e2'), SA.bottom, 0.5);
  T.near('css.value.env', 'env(safe-area-inset-top, 77px) is 0', W('#e3'), 0, 0.5);
  T.near('css.value.env', 'calc(10px + env(safe-area-inset-bottom, 0px))', W('#e4'), 10 + SA.bottom, 0.5);
  T.near('css.value.env', 'another name: env(keyboard-inset-height, 13px) is its fallback', W('#e5'), 13, 0.5, S);
  T.near('css.value.env', 'another name without a fallback: the declaration is dropped (the one before it stands)', W('#e6'), 40, 0.5, S);
  T.near('css.value.env', 'var(--tg-content-safe-area-inset-bottom) is the band', W('#e7'), SA.bottom, 0.5);
  var row = T.rect('#row'), bar = T.rect('#bar');
  T.eq('css.value.env', "the corner's side: left: var(--…-corner-left); right: var(--…-corner-right) leaves it free", [Math.round(bar.x - row.x), Math.round(row.r - bar.r)].join(), [SA.cornerLeft, SA.cornerRight].join());
