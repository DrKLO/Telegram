<body>
<div class="conf-stages">
  <div data-stage="rect" data-covers="html.el.canvas canvas.rect canvas.colors canvas.hidpi"><canvas width="160" height="120"></canvas></div>
  <div data-stage="path" data-covers="canvas.path"><canvas width="160" height="120"></canvas></div>
  <div data-stage="line-style" data-covers="canvas.line-style"><canvas width="160" height="120"></canvas></div>
  <div data-stage="gradients" data-covers="canvas.gradients"><canvas width="160" height="120"></canvas></div>
  <div data-stage="conic" data-covers="canvas.conic-gradient"><canvas width="160" height="120"></canvas></div>
</div>
<div class="conf-head">12a · Canvas 2D (1/2)</div>
<div class="conf-probes">
  <canvas id="probe" width="40" height="20" style="width:40px;height:20px"></canvas>
</div>
<div id="conf-list"></div>
<script>
function ctx(name) { var c = document.querySelector('[data-stage="' + name + '"] canvas').getContext('2d'); c.scale(2, 2); return c; }
var R = '#cc3333', B = '#3366cc', G = '#33aa33', O = '#ee8833';
// Profile 1 (out): conic gradients draw nothing. Reference mode draws exactly that.
var OUT = T.mode === 'ref';
T.stage('rect', function () { var c = ctx('rect'); c.fillStyle = R; c.fillRect(8, 8, 40, 30); c.strokeStyle = B; c.lineWidth = 4; c.strokeRect(30, 20, 40, 30); c.clearRect(14, 14, 10, 10); c.fillStyle = 'rgba(51,170,51,0.8)'; c.fillRect(56, 4, 18, 12); });
T.stage('path', function () { var c = ctx('path'); c.fillStyle = R; c.beginPath(); c.arc(20, 20, 14, 0, Math.PI * 1.5); c.lineTo(20, 20); c.closePath(); c.fill(); c.strokeStyle = B; c.lineWidth = 3; c.beginPath(); c.moveTo(40, 50); c.bezierCurveTo(50, 10, 70, 10, 76, 50); c.quadraticCurveTo(60, 58, 40, 50); c.stroke(); c.fillStyle = G; c.beginPath(); c.ellipse(20, 46, 14, 8, 0.3, 0, Math.PI * 2); c.fill(); c.beginPath(); c.roundRect(44, 4, 32, 14, 6); c.fill(); c.fillStyle = O; c.beginPath(); c.rect(48, 26, 24, 16); c.rect(54, 30, 12, 8); c.fill('evenodd'); });
T.stage('line-style', function () { var c = ctx('line-style'); c.strokeStyle = B; c.lineWidth = 8; c.lineCap = 'round'; c.beginPath(); c.moveTo(10, 12); c.lineTo(70, 12); c.stroke(); c.lineCap = 'square'; c.lineJoin = 'bevel'; c.strokeStyle = R; c.beginPath(); c.moveTo(10, 50); c.lineTo(25, 26); c.lineTo(40, 50); c.stroke(); c.lineJoin = 'miter'; c.miterLimit = 10; c.strokeStyle = G; c.beginPath(); c.moveTo(46, 50); c.lineTo(58, 26); c.lineTo(70, 50); c.stroke(); c.setLineDash([6, 4]); c.lineDashOffset = 2; c.lineWidth = 2; c.strokeStyle = '#222'; c.beginPath(); c.moveTo(6, 56); c.lineTo(76, 56); c.stroke(); });
T.stage('gradients', function () { var c = ctx('gradients'); var g = c.createLinearGradient(0, 0, 80, 0); g.addColorStop(0, R); g.addColorStop(1, B); c.fillStyle = g; c.fillRect(0, 0, 80, 28); var r = c.createRadialGradient(40, 44, 2, 40, 44, 16); r.addColorStop(0, O); r.addColorStop(1, G); c.fillStyle = r; c.fillRect(0, 30, 80, 30); });
T.stage('conic', function () { var c = ctx('conic'); if (OUT || !c.createConicGradient) return; var g = c.createConicGradient(0, 40, 30); g.addColorStop(0, R); g.addColorStop(0.25, O); g.addColorStop(0.5, G); g.addColorStop(0.75, B); g.addColorStop(1, R); c.fillStyle = g; c.beginPath(); c.arc(40, 30, 26, 0, Math.PI * 2); c.fill(); });

T.step(function () {
  var pc = document.getElementById('probe').getContext('2d');
  T.eq('canvas.hidpi', 'the backing store keeps its width attribute', document.querySelector('[data-stage="rect"] canvas').width, 160);
  pc.font = '16px sans-serif';
  var m = pc.measureText('Hello');
  T.ok('canvas.text', 'measureText gives a width', m.width > 20 && m.width < 60, String(m.width));
  T.ok('canvas.text', 'measureText gives ascent/descent', m.actualBoundingBoxAscent > 5 && m.actualBoundingBoxDescent >= 0, m.actualBoundingBoxAscent + ' / ' + m.actualBoundingBoxDescent);
  pc.beginPath(); pc.rect(5, 5, 10, 10);
  T.ok('canvas.hit-test', 'isPointInPath inside / outside', pc.isPointInPath(10, 10) === true && pc.isPointInPath(30, 10) === false, pc.isPointInPath(10, 10) + ' ' + pc.isPointInPath(30, 10));
  pc.lineWidth = 4;
  T.ok('canvas.hit-test', 'isPointInStroke', pc.isPointInStroke(5, 10) === true, String(pc.isPointInStroke(5, 10)));
  pc.fillStyle = 'rgb(200,10,20)'; pc.fillRect(0, 0, 4, 4);
  var px = pc.getImageData(1, 1, 1, 1).data;
  T.ok('canvas.image-data', 'getImageData returns transparent pixels (profile 1: out)', px[3] === 0, Array.prototype.slice.call(px).join(','));
  var blobArg = 'none';
  try { document.getElementById('probe').toBlob(function (b) { blobArg = b === null ? 'null' : 'blob'; }); } catch (e) { blobArg = 'threw'; }
  var url = '';
  try { url = document.getElementById('probe').toDataURL(); } catch (e) { url = 'threw'; }
  T.ok('canvas.readback', 'toDataURL does not hand pixels back', !/^data:image\/png;base64,.{40}/.test(url), url.slice(0, 30));
  var gl = null;
  try { gl = document.createElement('canvas').getContext('webgl'); } catch (e) { gl = null; }
  T.eq('canvas.webgl', 'getContext("webgl") is null', gl, null, { sandboxOnly: true });
  T.ok('canvas.webgl', 'OffscreenCanvas is not available', (function () { try { new OffscreenCanvas(1, 1); return false; } catch (e) { return true; } })(), '', { sandboxOnly: true });
});
T.run({ deadline: 3000 });
</script>
