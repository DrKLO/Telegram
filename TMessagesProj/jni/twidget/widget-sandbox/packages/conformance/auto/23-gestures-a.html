<style>
.conf-probes{font:13px/16px sans-serif}
.g{display:inline-block;width:70px;height:40px;margin:2px;line-height:40px;text-align:center;background:#dde;vertical-align:top}
#none,#nonedbl{touch-action:none;background:#bdf}
#finish{width:80px;height:28px}

<body>
<div class="conf-head">23a · Who gets a press</div>
<div class="conf-probes">
  <span class="g" id="none">none</span><span class="g" id="auto">auto</span><span class="g" id="nonedbl">none ×2</span><span class="g" id="autodbl">auto ×2</span>
  <button id="finish">Finish</button>
</div>
<div id="conf-list"></div>
<script>
['none', 'auto', 'nonedbl', 'autodbl', 'finish'].forEach(function (n) { T.target(n, '#' + n); });
var SB = { sandboxOnly: true };
var holdNone = T.wait('input.long-press', 'a hold on touch-action: none is the widget\'s: pointerdown … pointerup, no pointercancel, and contextmenu from a finger');
var holdAuto = T.wait('behaviour.gesture-claim', 'a hold on auto is the message menu: pointercancel, no pointerup (a mouse hold stays the widget\'s)', SB);
var dblNone = T.wait('input.dblclick', 'a double tap on touch-action: none: both clicks, then dblclick');
var dblAuto = T.wait('input.dblclick', 'a double tap on auto is the widget\'s too: both clicks, then dblclick, no pointercancel');
var $ = function (id) { return document.getElementById(id); };
var finger = function (e) { return e.pointerType !== 'mouse'; };
// Per element: the press's pointerType, contextmenus, clicks, a pointercancel.
function watch(id, on) {
  var s = { ctx: 0, clicks: 0, dbl: 0, cancel: 0, moves: 0 };
  var el = $(id);
  el.addEventListener('pointerdown', function (e) { s.type = e.pointerType; s.x = e.clientX; s.moves = 0; on('down', e, s); });
  el.addEventListener('pointermove', function (e) { if (e.buttons) s.moves++; });
  ['pointerup', 'pointercancel', 'click', 'dblclick', 'contextmenu'].forEach(function (t) {
    el.addEventListener(t, function (e) { if (t === 'contextmenu') { s.ctx++; e.preventDefault(); } if (t === 'click') s.clicks++; if (t === 'dblclick') s.dbl++; if (t === 'pointercancel') s.cancel++; on(t, e, s); });
  });
}
watch('none', function (t, e, s) {
  if (t === 'pointercancel') holdNone.fail('pointercancel');
  if (t === 'pointerup') holdNone.result(!s.cancel && (!finger(e) || s.ctx === 1), e.pointerType + ', ' + s.ctx + ' contextmenu');
});
watch('auto', function (t, e, s) {
  if (t === 'pointercancel') holdAuto.result(s.type !== 'mouse', s.type + ': pointercancel');
  if (t === 'pointerup') holdAuto.result(s.type === 'mouse', s.type + ': pointerup');
});
watch('nonedbl', function (t, e, s) {
  if (t === 'pointercancel') dblNone.fail('pointercancel');
  if (t === 'dblclick') dblNone.result(s.clicks === 2 && !s.cancel, s.clicks + ' clicks');
});
watch('autodbl', function (t, e, s) {
  if (t === 'pointercancel') dblAuto.fail('pointercancel after ' + s.clicks + ' clicks');
  if (t === 'dblclick') dblAuto.result(s.clicks === 2 && !s.cancel, s.clicks + ' clicks');
});
T.run({ awaitInput: 20000 });
</script>
</body>
