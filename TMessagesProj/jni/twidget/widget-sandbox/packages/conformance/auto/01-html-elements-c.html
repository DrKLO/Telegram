<style>
.conf-probes{font:13px/16px sans-serif;color:#111}
.row{display:block;margin:0 0 2px;width:340px}

<body>
<div class="conf-head">01c · HTML elements (3/3)</div>
<div class="conf-probes">
  <div class="row"><span id="base">x</span><sub id="sub">2</sub><sup id="sup">2</sup></div>
  <div class="row"><center id="center">c</center><font id="font" color="red">f</font> <big id="big">b</big> <tt id="tt">t</tt> <strike id="strike">s</strike></div>
  <div class="row" style="width:30px"><nobr id="nobr">aaa bbb ccc</nobr></div>
  <div class="row"><my-widget id="mw">custom</my-widget></div>
  <div class="row"><details id="det1"><summary id="sum1">closed</summary><div id="det1-c" style="height:20px">c</div></details><details id="det2" open><summary>open</summary><div id="det2-c" style="height:20px">c</div></details></div>
  <div class="row"><button id="btn">Button</button> <a id="afrag" href="#t">fragment</a> <a id="aext" class="ext" href="https://example.org/">external</a> <progress id="prog" value="0.5"></progress> <meter id="meter" value="0.5"></meter></div>
</div>
<div id="conf-list"></div>
<script>
var R = T.rect, CS = T.cs;
var px = function (sel, prop, pseudo) { return parseFloat(CS(sel, prop, pseudo)); };
var deco = function (el) { return CS(el, 'text-decoration-line') || CS(el, 'text-decoration'); };

T.step(function () {
  var base = R('#base'), sub = R('#sub'), sup = R('#sup');
  T.ok('html.el.sub-sup', 'sub sits lower, sup higher', sub.b > base.b && sup.y < base.y, 'base ' + base.y + '-' + base.b + ' sub ' + sub.b + ' sup ' + sup.y);
  T.ok('html.el.sub-sup', 'sub and sup are smaller', px('#sub', 'font-size') < 13 && px('#sup', 'font-size') < 13, CS('#sub', 'font-size'));

  T.ok('html.el.legacy', 'center becomes a div: no centring', !/center/.test(CS('#center', 'text-align')), CS('#center', 'text-align'));
  T.ok('html.el.legacy', 'font becomes a span: color=red is dropped', T.color('#font', 'color') !== '255,0,0,1', T.color('#font', 'color'));
  T.ok('html.el.legacy', 'big becomes a span: normal size', px('#big', 'font-size') === 13, CS('#big', 'font-size'));
  T.ok('html.el.legacy', 'tt becomes a span: not monospace', !/monospace/.test(CS('#tt', 'font-family')), CS('#tt', 'font-family'));
  T.ok('html.el.legacy', 'strike becomes a span: not struck', !/line-through/.test(deco('#strike')), deco('#strike'));
  T.ok('html.el.legacy', 'nobr becomes a span: the text wraps', R('#nobr').h > 20, R('#nobr').w + 'x' + R('#nobr').h);

  T.eq('html.el.unknown', 'an unknown element renders inline', CS('#mw', 'display'), 'inline');
  T.ok('html.el.unknown', 'it renders as an inert span: its type selector does not match', T.color('#mw', 'color') !== '200,0,0,1', T.color('#mw', 'color'), { sandboxOnly: true });

  T.ok('html.el.details', 'closed details is only as tall as its summary', Math.abs(R('#det1').h - R('#sum1').h) < 0.5, R('#det1').h + ' vs ' + R('#sum1').h);
  T.ok('html.el.details', 'open details shows its content', R('#det2-c').h === 20, 'h ' + R('#det2-c').h);
  T.eq('html.el.details', 'summary is a list item (disclosure marker)', CS('#sum1', 'display'), 'list-item');

  var b = R('#btn');
  T.ok('html.el.button', 'button has a box with padding', b.w > 30 && b.h > 12 && px('#btn', 'padding-left') > 0, b.w + 'x' + b.h);
  T.ok('html.el.button', 'button has a visible background or border', T.color('#btn') !== '0,0,0,0' || px('#btn', 'border-top-width') > 0, T.color('#btn'));
  T.ok('html.el.a-fragment', 'a[href=#…] is a link (the link colour, no underline)', T.color('#afrag', 'color') !== T.color('#base', 'color') && !/underline/.test(deco('#afrag')), T.color('#afrag', 'color') + ' ' + deco('#afrag'));
  T.ok('html.el.a-external', 'an external href never reaches the renderer (a[href^=https] does not match)', T.color('#aext', 'color') !== '1,2,3,1', T.color('#aext', 'color'), { sandboxOnly: true });
  T.ok('html.el.a-external', 'it is still drawn as a link (not the text colour, no underline)', T.color('#aext', 'color') !== T.color('#base', 'color') && !/underline/.test(deco('#aext')), T.color('#aext', 'color') + ' ' + deco('#aext'));

  T.ok('html.el.progress-meter', 'progress is dropped (no box)', R('#prog').w === 0 && R('#prog').h === 0, R('#prog').w + 'x' + R('#prog').h);
  T.ok('html.el.progress-meter', 'meter is dropped (no box)', R('#meter').w === 0 && R('#meter').h === 0, R('#meter').w + 'x' + R('#meter').h);
});
T.run();
</script>
</body>
</html>
