<script>
var TW = typeof TelegramWidget !== 'undefined' ? TelegramWidget : null;
var S = T.sandbox ? {} : { sandboxOnly: true };
var has = !!TW && typeof TW.setResizeAnchor === 'function';
var throwsType = function (fn) { try { fn(); return false; } catch (e) { return !!e && e.name === 'TypeError'; } };

  T.ok('tw.resize-anchor', "setResizeAnchor('bottom') and ('top') return undefined and throw nothing", has && noThrow(function () { return TW.setResizeAnchor('bottom'); }) && noThrow(function () { return TW.setResizeAnchor('top'); }), '', S);

});

// edge is behaviour.resize-anchor in visual/sdk/18).
var g = document.getElementById('grow');
T.step(function () {
  if (has) TW.setResizeAnchor('bottom');
  for (var i = 0; i < 3; i++) g.appendChild(document.createElement('div'));
  return 60;

  if (has) TW.setResizeAnchor('top');
  g.replaceChildren();
  return 60;
});
T.step(function () {
  T.ok('tw.resize-anchor', "with 'top' it shrinks back to 0 px", g.offsetHeight === 0, g.offsetHeight + ' px', S);
});
T.run();
