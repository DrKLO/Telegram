<style>
.conf-probes{font:13px/16px sans-serif}
.box{position:absolute;width:30px;height:20px}
.s-2d1{left:8px;top:10px;background:#c33;transform:rotate(20deg)}
.s-2d2{left:44px;top:8px;background:#36c;transform:scale(1.3,.8) skewX(-15deg)}
.s-2d3{left:8px;top:36px;width:24px;height:16px;background:#3a3;translate:40px 2px;rotate:-10deg}
.s-3d{left:20px;top:10px;width:40px;height:40px;background:#e83;transform:perspective(100px) rotateY(55deg)}
.s-3d-wrap{position:absolute;inset:0;perspective:80px;transform-style:preserve-3d}
.s-blur{left:20px;top:15px;width:40px;height:30px;background:#36c;filter:blur(3px)}
.s-bright{left:6px;top:15px;width:30px;height:30px;background:#864;filter:brightness(1.6)}
.s-ds{left:44px;top:10px;width:24px;height:24px;background:#3a3;border-radius:50%;filter:drop-shadow(4px 6px 0 #c33)}
.s-gray{left:4px;top:5px;width:34px;height:24px;background:#c33;filter:grayscale(1)}
.s-sepia{left:42px;top:5px;width:34px;height:24px;background:#36c;filter:sepia(1)}
.s-hue{left:4px;top:32px;width:34px;height:24px;background:#c33;filter:hue-rotate(120deg)}
.s-inv{left:42px;top:32px;width:34px;height:24px;background:#36c;filter:invert(1) contrast(1.2) saturate(.5)}
.s-furl{left:20px;top:15px;width:40px;height:30px;background:#e83;filter:url(#conf-blur)}
#t-tx{transform:translateX(30px)}
#t-rot{transform:rotate(90deg)}
#t-sc{transform:scale(2);transform-origin:0 0}
#t-tr{translate:10px 5px}
#t-3d{transform:rotateY(60deg)}
#t-txp{transform:translateX(150%)}
#t-txc{transform:translateX(calc(100% + 10px))}
#t-txm{transform:translateX(calc(50% - 1 * (100% + 10px) + 50px))}
.p{position:relative;height:44px;width:200px}
.pp{position:absolute;width:40px;height:20px;top:0}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="conf-blur"><feGaussianBlur stdDeviation="3"/></filter></svg>
<div class="conf-stages">
  <div data-stage="transform-2d" data-covers="css.transform.2d"><div class="box s-2d1"></div><div class="box s-2d2"></div><div class="box s-2d3"></div></div>
  <div data-stage="transform-3d" data-covers="css.transform.3d"><div class="s-3d-wrap"><div class="box s-3d"></div></div></div>
  <div data-stage="blur" data-covers="css.filter.blur-brightness-drop-shadow" data-max-diff="0.1"><div class="box s-blur"></div></div>
  <div data-stage="brightness-drop-shadow" data-covers="css.filter.blur-brightness-drop-shadow"><div class="box s-bright"></div><div class="box s-ds"></div></div>
  <div data-stage="filter-other" data-covers="css.filter.other"><div class="box s-gray"></div><div class="box s-sepia"></div><div class="box s-hue"></div><div class="box s-inv"></div></div>
  <div data-stage="filter-url" data-covers="css.filter.url"><div class="box s-furl"></div></div>
</div>
<div class="conf-head">09a · Transforms and effects (1/2)</div>
<div class="conf-probes">
  <div class="p"><div class="pp" id="t-tx" style="left:0;width:20px;height:10px;background:#c33"></div><div class="pp" id="t-rot" style="left:60px;width:40px;height:20px;background:#36c"></div><div class="pp" id="t-sc" style="left:110px;width:10px;height:10px;background:#3a3"></div><div class="pp" id="t-tr" style="left:150px;width:10px;height:10px;background:#e83"></div></div>
  <div class="p"><div class="pp" id="t-3d" style="left:0;background:#e83"></div><div id="flt" style="position:absolute;left:160px;width:10px;height:10px;filter:blur(2px) brightness(1.5) drop-shadow(1px 1px 0 red)"></div></div>
  <div class="p"><div class="pp" id="t-txp" style="left:0;width:20px;height:8px;background:#c33"></div><div class="pp" id="t-txc" style="left:0;top:11px;width:20px;height:8px;background:#36c"></div><div class="pp" id="t-txm" style="left:0;top:22px;width:20px;height:8px;background:#3a3"></div><div class="pp" id="t-txj" style="left:0;top:33px;width:20px;height:8px;background:#e83"></div></div>
</div>
<div id="conf-list"></div>
<script>
var R = T.rect;
var rel = function (sel) { var r = R(sel), p = R(document.querySelector(sel).parentNode); return { x: r.x - p.x, y: r.y - p.y, w: r.w, h: r.h }; };
document.getElementById('t-txj').style.transform = 'translateX(calc(100% + 10px))';
T.step(function () {
  T.near('css.transform.2d', 'translateX(30px) moves the box', rel('#t-tx').x, 30, 0.5);
  var rot = rel('#t-rot');
  T.ok('css.transform.2d', 'rotate(90deg) swaps the bounding box', Math.abs(rot.w - 20) < 0.5 && Math.abs(rot.h - 40) < 0.5, rot.w + 'x' + rot.h);
  var sc = rel('#t-sc');
  T.ok('css.transform.2d', 'scale(2) with transform-origin 0 0', Math.abs(sc.w - 20) < 0.5 && Math.abs(sc.x - 110) < 0.5, sc.x + ' ' + sc.w);
  var tr = rel('#t-tr');
  T.ok('css.transform.2d', 'the translate property', Math.abs(tr.x - 160) < 0.5 && Math.abs(tr.y - 5) < 0.5, tr.x + ',' + tr.y);
  T.near('css.transform.3d', 'rotateY(60deg) is dropped: the box keeps its width', rel('#t-3d').w, 40, 0.5);
  T.near('css.transform.2d', 'translateX(150%) is a share of the box\'s own width', rel('#t-txp').x, 30, 0.5);
  T.near('css.value.math', 'calc(% + px) inside translateX()', rel('#t-txc').x, 30, 0.5);
  T.near('css.value.math', 'calc() with * and nested parentheses inside translateX()', rel('#t-txm').x, 30, 0.5);
  T.near('css.transform.2d', 'a transform set from script (style.transform, calc())', rel('#t-txj').x, 30, 0.5);
  T.ok('css.filter.blur-brightness-drop-shadow', 'filter functions are kept', /blur\(2px\)/.test(T.cs('#flt', 'filter')) && /brightness/.test(T.cs('#flt', 'filter')) && /drop-shadow/.test(T.cs('#flt', 'filter')), T.cs('#flt', 'filter'));
});
T.run();
</script>
<template data-ref="transform-3d"><div style="position:absolute;left:20px;top:10px;width:40px;height:40px;background:#e83"></div></template>
<template data-ref="filter-url"><div style="position:absolute;left:20px;top:15px;width:40px;height:30px;background:#e83"></div></template>
<template data-ref="filter-other"><div style="position:absolute;left:4px;top:5px;width:34px;height:24px;background:#c33"></div><div style="position:absolute;left:42px;top:5px;width:34px;height:24px;background:#36c"></div><div style="position:absolute;left:4px;top:32px;width:34px;height:24px;background:#c33"></div><div style="position:absolute;left:42px;top:32px;width:34px;height:24px;background:#36c"></div></template>
</body>
