<style>
.conf-probes{font:13px/16px sans-serif;color:#111}
.p{position:relative;width:300px;margin:0 0 2px}
.i{display:inline-block;white-space:nowrap}
.box{width:120px;background:#eef}
#sel{user-select:text;-webkit-user-select:text}
#all{user-select:all;-webkit-user-select:all}
::selection{background:rgb(1,2,3)}
.st-ell{position:absolute;left:4px;top:18px;width:66px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:bold 16px/24px sans-serif;color:#36c}
.st-shadow{position:absolute;left:10px;top:4px;font:900 36px/48px sans-serif;color:#36c;text-shadow:6px 6px 0 #e83}
.st-emoji{position:absolute;left:8px;top:6px;font:36px/48px sans-serif}
.st-deco{position:absolute;left:4px;top:4px;font:18px/26px sans-serif;color:#222}
</style>
</head>
<body>
<div class="conf-stages">
  <div data-stage="ellipsis" data-covers="css.text.overflow" data-max-diff="0.5" data-colors="#36c"><div class="st-ell"><span style="color:#222">Ellipsis text here</span></div></div>
  <div data-stage="text-shadow" data-covers="css.text.shadow" data-max-diff="0.5" data-colors="#e83 #36c"><div class="st-shadow">Sh</div></div>
  <div data-stage="emoji" data-covers="css.text.emoji" data-max-diff="0.5"><div class="st-emoji">🎨</div></div>
  <div data-stage="decoration" data-covers="css.text.decoration" data-max-diff="0.5" data-colors="#c33 #36c"><div class="st-deco"><u style="text-decoration-color:#c33;text-decoration-thickness:2px">un</u> <s>st</s><br><span style="text-decoration:underline wavy #36c">wavy</span></div></div>
</div>
<div class="conf-head">06c · Text and fonts (3/3)</div>
<div class="conf-probes">
  <div class="p">
    <div class="box" dir="rtl" id="he" style="font-size:16px"><span id="he-s">שלום עולם</span></div>
    <span class="i" id="ar-lig" style="font-size:20px">لا</span><span class="i" id="ar-l" style="font-size:20px">ل</span><span class="i" id="ar-a" style="font-size:20px">ا</span>
    <span class="i" id="emoji" style="font-size:20px">😀</span><span class="i" id="flag" style="font-size:20px">🇺🇦</span><span class="i" id="zwj" style="font-size:20px">👩‍💻</span>
    <span id="sel">select <b id="kid">me</b></span> <span id="all">all</span>
  </div>
</div>
<div id="conf-list"></div>
<script>
var R = T.rect, CS = T.cs;
var W = function (s) { return R(s).w; };
T.step(function () {
  T.near('css.text.rtl', 'Hebrew in dir=rtl starts at the right edge', R('#he-s').r, R('#he').r, 1);
  T.ok('css.text.rtl', 'Arabic lam-alef is shaped (ligature narrower than its letters)', W('#ar-lig') < W('#ar-l') + W('#ar-a') - 1, W('#ar-lig') + ' vs ' + (W('#ar-l') + W('#ar-a')));
  T.ok('css.text.emoji', 'emoji glyph has an advance', W('#emoji') > 14, W('#emoji') + '');
  T.ok('css.text.emoji', 'flag sequence is one glyph', W('#flag') < W('#emoji') * 1.6, W('#flag') + ' vs ' + W('#emoji'));
  T.ok('css.text.emoji', 'ZWJ sequence is one glyph', W('#zwj') < W('#emoji') * 1.6, W('#zwj') + ' vs ' + W('#emoji'));
  var us = function (s) { return CS(s, 'user-select') || CS(s, '-webkit-user-select'); };
  T.eq('css.text.selection', 'not selectable by default (none on the root); user-select: text enables it', us(document.documentElement) + ' ' + us('#sel'), 'none text');
  T.ok('css.text.selection', 'a child of user-select: text is selectable too (auto or text)', /^(auto|text)$/.test(us('#kid')), us('#kid'));
  T.ok('css.text.selection', 'user-select: all is outside the profile (dropped)', us('#all') !== 'all', us('#all'), { sandboxOnly: true });
});
T.run();
</script>
<template data-ref="text-shadow"><div style="position:absolute;left:10px;top:4px;font:900 36px/48px sans-serif;color:#36c">Sh</div></template>
