<style>
.conf-probes{font:13px/16px sans-serif;color:#111}
.p{position:relative;width:300px;margin:0 0 2px}
.i{display:inline-block;white-space:nowrap}
.box{width:120px;background:#eef}
.w40{width:40px}
#up{text-transform:uppercase}
#ls{letter-spacing:5px}
#ws{word-spacing:10px}
#nowrap{white-space:nowrap}
#prew{white-space:pre-wrap}
#preline{white-space:pre-line}
#pre{white-space:pre}
#ow{overflow-wrap:anywhere}
#wb{word-break:break-all}

<body>
<div class="conf-head">06b · Text and fonts (2/3)</div>
<div class="conf-probes">
  <div class="p">
    <div class="box" style="text-align:center"><span id="ac">c</span></div>
    <div class="box" style="text-align:right"><span id="ar">r</span></div>
    <div class="box" dir="rtl" style="text-align:end"><span id="ae" style="display:inline-block;width:6px;height:6px"></span></div>
    <div class="box" style="text-indent:20px"><span id="ti">t</span></div>
  </div>
  <div class="p">
    <span class="i" id="lo">abc</span><span class="i" id="up">abc</span><span class="i" id="ls0">abcd</span><span class="i" id="ls">abcd</span><span class="i" id="ws0">a b c</span><span class="i" id="ws">a b c</span>
    <span id="deco" style="text-decoration:underline">u</span>
  </div>
  <div class="p">
    <div class="box w40" id="nowrap">aaa bbb ccc</div>
    <div class="box" id="pre">a
b</div>
    <span class="i" id="sp1">a b</span><span id="prew" class="i">a    b</span>
    <div class="box" id="preline">a     b
c</div>
    <div class="box w40" id="ow">aaaaaaaaaaaaaaaaaaaa</div>
    <div class="box w40" id="wb">bbbbbbbbbbbbbbbbbbbb</div>
    <div id="clamp">one two three four five six seven eight nine ten</div>
    <div id="va"><span class="t" id="va-t"></span><span class="b" id="va-b"></span>x</div>
  </div>
  <div class="p">
    <ul id="lso" style="margin:0"><li><span id="lso-s">o</span></li></ul>
    <ul id="lsi" style="margin:0"><li><span id="lsi-s">i</span></li></ul>
    <ul id="lsn" style="margin:0"><li>n</li></ul>
    <div id="wm">vertical</div>
  </div>
</div>
<div id="conf-list"></div>
<script>
var R = T.rect, CS = T.cs;
var W = function (s) { return R(s).w; };
T.step(function () {
  var box = R('.box'), ac = R('#ac'), ar = R('#ar');
  T.near('css.text.align', 'text-align: center', ac.x + ac.w / 2 - box.x, 60, 1);
  T.near('css.text.align', 'text-align: right', ar.r - box.x, 120, 1);
  T.near('css.text.align', 'text-align: end in RTL is the left edge', R('#ae').x - box.x, 0, 1);
  T.near('css.text.align', 'text-indent', R('#ti').x - box.x, 20, 1);

  T.ok('css.text.decoration', 'text-decoration: underline', /underline/.test(CS('#deco', 'text-decoration-line') || CS('#deco', 'text-decoration')), CS('#deco', 'text-decoration-line'));
  T.ok('css.text.transform', 'text-transform: uppercase widens', W('#up') > W('#lo') + 1, W('#up') + ' vs ' + W('#lo'));
  T.near('css.text.transform', 'letter-spacing: 5px adds 5px per letter', W('#ls') - W('#ls0'), 20, 1.5);
  T.near('css.text.transform', 'word-spacing: 10px adds 10px per space', W('#ws') - W('#ws0'), 20, 1.5);

  T.ok('css.text.white-space', 'nowrap keeps one line', R('#nowrap').h < 20 && R('#nowrap').h > 0, R('#nowrap').h + '');
  T.ok('css.text.white-space', 'pre keeps the newline', R('#pre').h >= 31, R('#pre').h + '');
  T.ok('css.text.white-space', 'pre-wrap keeps the spaces', W('#prew') > W('#sp1') + 8, W('#prew') + ' vs ' + W('#sp1'));
  T.ok('css.text.white-space', 'pre-line keeps the newline, collapses the spaces', R('#preline').h >= 31 && R('#preline').h < 40, R('#preline').h + '');
  T.ok('css.text.wrap', 'overflow-wrap: anywhere breaks a long word', R('#ow').h >= 31 && R('#ow').w <= 40.5, R('#ow').w + 'x' + R('#ow').h);
  T.ok('css.text.wrap', 'word-break: break-all breaks a long word', R('#wb').h >= 31, R('#wb').h + '');
  T.ok('css.text.line-clamp', '-webkit-line-clamp is dropped: all lines show (profile 1: out)', R('#clamp').h > 40, 'h ' + R('#clamp').h);
  T.ok('css.text.vertical-align', 'vertical-align top and bottom', R('#va-t').y - R('#va').y < 2 && R('#va').b - R('#va-b').b < 2, (R('#va-t').y - R('#va').y) + ' / ' + (R('#va').b - R('#va-b').b));
  T.ok('css.text.list-style', 'list-style-position: inside moves the text right', R('#lsi-s').x > R('#lso-s').x + 4, R('#lsi-s').x + ' vs ' + R('#lso-s').x);
  T.eq('css.text.list-style', 'list-style-type: none', CS('#lsn li', 'list-style-type'), 'none');
  T.ok('css.text.writing-mode', 'writing-mode is neutralised (text stays horizontal)', R('#wm').w > R('#wm').h, R('#wm').w + 'x' + R('#wm').h);
});
T.run();
</script>
