<body>
<div class="conf-head">01a · HTML elements (1/3)</div>
<div class="conf-probes">
  <div class="row" id="marg"><p id="p1">p</p></div>
  <div class="row"><span id="br-a">a</span><br><span id="br-b">b</span></div>
  <div class="row"><hr id="hr"></div>
  <div class="row" id="narrow">aaaaaaaa<wbr>bbbbbbbb</div>
  <div class="row" id="heads"><h1>H</h1><h2>H</h2><h3>H</h3><h4>H</h4><h5>H</h5><h6>H</h6></div>
  <div class="row" id="secs"><header>h</header><footer>f</footer><main>m</main><nav>n</nav><section>s</section><article>a</article><aside>a</aside><hgroup>g</hgroup><search>s</search><address id="addr">ad</address></div>
  <div class="row" id="inl"><b>b</b> <strong>s</strong> <i>i</i> <em>e</em> <cite>c</cite> <dfn>d</dfn> <var>v</var> <u>u</u> <ins>i</ins> <s>s</s> <del>d</del> <code>c</code> <kbd>k</kbd> <samp>s</samp> <mark>m</mark> <small>sm</small> <span id="q-plain">qq</span><q id="q">qq</q> <abbr title="x">ab</abbr> <time>t</time> <data value="1">d</data></div>
</div>
<div id="conf-list"></div>
<script>
var R = T.rect, CS = T.cs;
var fw = function (sel) { var w = CS(sel, 'font-weight'); return w === 'bold' ? 700 : parseInt(w, 10); };
var px = function (sel, prop, pseudo) { return parseFloat(CS(sel, prop, pseudo)); };
var deco = function (el) { return CS(el, 'text-decoration-line') || CS(el, 'text-decoration'); };
var inl = function (tag) { return document.querySelector('#inl ' + tag); };

T.step(function () {
  T.near('html.el.structure', 'p has 1em block margins', px('#p1', 'margin-top'), 13, 0.5);
  T.ok('html.el.structure', 'br starts a new line', R('#br-b').y >= R('#br-a').b - 0.5, R('#br-a').y + ' → ' + R('#br-b').y);
  T.ok('html.el.structure', 'hr draws a rule', R('#hr').h > 0 && R('#hr').w > 100, R('#hr').w + 'x' + R('#hr').h);
  T.ok('html.el.structure', 'wbr is a break opportunity', R('#narrow').h >= 31, 'h ' + R('#narrow').h);

  var hs = document.querySelectorAll('#heads > *');
  var sizes = Array.prototype.map.call(hs, function (h) { return parseFloat(getComputedStyle(h).fontSize); });
  T.ok('html.el.headings', 'h1 > h2 > … > h6 font sizes', sizes.every(function (s, i) { return i === 0 || s < sizes[i - 1]; }), sizes.join(','));
  T.ok('html.el.headings', 'headings are bold', fw(hs[0]) >= 600 && fw(hs[5]) >= 600, fw(hs[0]) + ',' + fw(hs[5]));

  var secs = document.querySelectorAll('#secs > *');
  T.ok('html.el.sections', 'sectioning elements are blocks', Array.prototype.every.call(secs, function (e) { return getComputedStyle(e).display === 'block'; }), Array.prototype.map.call(secs, function (e) { return getComputedStyle(e).display; }).join(','));
  T.eq('html.el.sections', 'address is italic', CS('#addr', 'font-style'), 'italic');

  T.ok('html.el.inline-text', 'b, strong are bold', fw(inl('b')) >= 600 && fw(inl('strong')) >= 600, fw(inl('b')) + ',' + fw(inl('strong')));
  T.ok('html.el.inline-text', 'i, em, cite, dfn, var are italic', ['i', 'em', 'cite', 'dfn', 'var'].every(function (t) { return CS(inl(t), 'font-style') === 'italic'; }), '');
  T.ok('html.el.inline-text', 'u, ins underline; s, del strike', /underline/.test(deco(inl('u'))) && /underline/.test(deco(inl('ins'))) && /line-through/.test(deco(inl('s'))) && /line-through/.test(deco(inl('del'))), deco(inl('u')) + ' / ' + deco(inl('s')));
  T.ok('html.el.inline-text', 'code, kbd, samp are monospace', ['code', 'kbd', 'samp'].every(function (t) { return /monospace/.test(CS(inl(t), 'font-family')); }), CS(inl('code'), 'font-family'));
  T.ok('html.el.inline-text', 'mark has a highlight', T.color(inl('mark')) !== '0,0,0,0', T.color(inl('mark')));
  T.ok('html.el.inline-text', 'small is smaller', px(inl('small'), 'font-size') < 13, CS(inl('small'), 'font-size'));
  T.ok('html.el.inline-text', 'q adds quotation marks', R('#q').w > R('#q-plain').w + 2, R('#q').w + ' vs ' + R('#q-plain').w);
});
T.run();
</script>
