.conf-probes{font:13px/16px sans-serif}
.row{margin:0 0 2px;width:300px}
:lang(ru) .lg{color:rgb(0,100,0)}
[data-state="on"]{color:rgb(0,0,150)}

<body>
<div class="conf-head">02a · Attributes and images (1/2)</div>
<div class="conf-probes">
  <div class="row"><span id="hid" hidden>hidden</span><span id="sty" style="display:inline-block;width:17px;height:5px"></span><span id="ttl" title="tooltip">t</span></div>
  <div class="row" lang="ru"><span class="lg" id="lg">язык</span></div>
  <div class="row" dir="rtl" id="rtl" style="width:200px"><span id="rtl-a" style="display:inline-block;width:10px;height:8px;background:#c33"></span><span id="rtl-b" style="display:inline-block;width:10px;height:8px;background:#33c"></span></div>
  <div class="row" dir="auto" id="auto" style="width:200px">שלום</div>
  <div class="row"><span id="dat" data-state="on">d</span> <span id="ar" aria-pressed="true">a</span></div>
  <div class="row" align="center" id="al">c</div>
  <table border="1" cellpadding="5" id="lt"><tr><td bgcolor="#ff0000" id="lt-td" valign="top">x</td></tr></table>
  <div class="row"><button id="ih" onclick="this.setAttribute('data-n', String(Number(this.getAttribute('data-n') || 0) + 1))">inline</button></div>
  <div class="row"><span id="ce" contenteditable="true">ce</span> <span id="dg" draggable="true">dg</span> <span id="ti" tabindex="0">ti</span></div>
  <div class="row">
    <img id="i-png" width="20" height="10" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAE0lEQVR4AWM8Y2z8nwEImBigAAAh4QI1lhEEowAAAABJRU5ErkJggg==">
    <picture><img id="i-pic" width="12" height="12" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAE0lEQVR4AWM8Y2z8nwEImBigAAAh4QI1lhEEowAAAABJRU5ErkJggg=="></picture>
  </div>
</div>
<div id="conf-list"></div>
<script>
var R = T.rect, CS = T.cs;

T.step(function () {
  T.ok('html.el.img', 'width/height attributes size the image', R('#i-png').w === 20 && R('#i-png').h === 10, R('#i-png').w + 'x' + R('#i-png').h);
  T.ok('html.el.img', 'img inside picture is drawn', R('#i-pic').w === 12, R('#i-pic').w + '');

  T.ok('html.attr.global', 'hidden hides', R('#hid').w === 0 && CS('#hid', 'display') === 'none', CS('#hid', 'display'));
  T.ok('html.attr.global', 'style attribute applies', R('#sty').w === 17 && R('#sty').h === 5, R('#sty').w + 'x' + R('#sty').h);
  T.eq('html.attr.global', 'lang reaches the renderer (:lang(ru))', T.color('#lg', 'color'), '0,100,0,1');
  T.eq('html.attr.dir', 'dir=rtl sets direction', CS('#rtl', 'direction'), 'rtl');
  T.ok('html.attr.dir', 'dir=rtl lays out inline boxes right to left', R('#rtl-a').x > R('#rtl-b').x && R('#rtl-a').r > R('#rtl').r - 2, 'a ' + R('#rtl-a').x + ' b ' + R('#rtl-b').x);
  T.eq('html.attr.dir', 'dir=auto with Hebrew text resolves to rtl', CS('#auto', 'direction'), 'rtl');
  T.eq('html.attr.data-aria', 'data-* reaches attribute selectors', T.color('#dat', 'color'), '0,0,150,1');
  T.eq('html.attr.data-aria', 'aria-* reaches attribute selectors', T.color('#ar', 'color'), '150,0,0,1');
  T.ok('html.attr.legacy-presentational', 'align is dropped: no centring', !/center/.test(CS('#al', 'text-align')), CS('#al', 'text-align'));
  T.ok('html.attr.legacy-presentational', 'bgcolor is dropped', T.color('#lt-td') !== '255,0,0,1', T.color('#lt-td'));
  T.ok('html.attr.legacy-presentational', 'cellpadding is dropped', parseFloat(CS('#lt-td', 'padding-left')) !== 5, CS('#lt-td', 'padding-left'));
  T.ok('html.attr.legacy-presentational', 'border=1 is dropped', parseFloat(CS('#lt', 'border-top-width')) === 0, CS('#lt', 'border-top-width'));
  var ih = document.getElementById('ih');
  ih.click(); ih.click();
  T.eq('html.attr.event-handlers', 'an inline onclick handler runs', ih.getAttribute('data-n'), '2');
  T.ok('html.attr.contenteditable', 'contenteditable does not reach the renderer', T.color('#ce', 'color') !== '1,1,1,1', T.color('#ce', 'color'));
  T.ok('html.attr.draggable', 'draggable does not reach the renderer', T.color('#dg', 'color') !== '2,2,2,1', T.color('#dg', 'color'));
  T.ok('html.attr.tabindex', 'tabindex does not reach the renderer', T.color('#ti', 'color') !== '3,3,3,1', T.color('#ti', 'color'));
});
T.run({ deadline: 4000 });
</script>
</body>
