<script>
var S = T.sandbox ? {} : { sandboxOnly: true };
// The checks are published first; the last step passes the limit and the host stops the widget. The runner judges the

T.step(function () {
  if (!T.sandbox) return;
  // 1900 elements on top of the page's own nodes stay within 2000 (built in one task: the flush goes out in parts).
  var box = document.createElement('div'); box.id = 'box'; box.style.display = 'none';

  document.body.appendChild(box);
  return 60;
});

  return 60;
});
T.step(function () {
  if (!T.sandbox) return;
  var box = document.getElementById('box');
  for (var i = 0; i < 200; i++) box.appendChild(document.createElement('i'));
});
T.run();
</script>
