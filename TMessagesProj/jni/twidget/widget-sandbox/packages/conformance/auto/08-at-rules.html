<style>
@import url("data:text/css,%23imp%7Bcolor%3Argb(80%2C0%2C0)%7D");
.conf-probes{font:13px/16px sans-serif}
.m{display:inline-block;width:8px;height:8px;margin:1px;color:rgb(0,0,0)}
@media (min-width:200px){#mw1{color:rgb(1,0,0)}}
@media (max-width:100px){#mw2{color:rgb(2,0,0)}}
@media screen and (min-width:200px) and (max-width:2000px){#mw3{color:rgb(3,0,0)}}
@media (prefers-color-scheme:dark){#cs{color:rgb(10,0,0)}}
@media (prefers-color-scheme:light){#cs{color:rgb(11,0,0)}}
@media (prefers-reduced-motion:reduce){#rm{color:rgb(12,0,0)}}
@media (hover:hover){#hh{color:rgb(13,0,0)}}
@media (pointer:coarse){#pc{color:rgb(14,0,0)}}
@media print{#pr{color:rgb(15,0,0)}}
@supports (display:flex){#sf{color:rgb(20,0,0)}}
@supports (transform:rotateY(10deg)){#s3d{color:rgb(21,0,0)}}
@supports (display:flex) and (not (transform:rotateY(10deg))){#scomb{color:rgb(22,0,0)}}
@supports (gap:1px){#sgap{color:rgb(23,0,0)}}
#cq-wrap{container-type:inline-size;width:200px}
@container (min-width:150px){#cq{color:rgb(30,0,0)}}
@container (min-width:500px){#cq2{color:rgb(31,0,0)}}
@layer base,top;
@layer top{#ly{color:rgb(40,0,0)}}
@layer base{#ly{color:rgb(41,0,0)}}
@property --pp{syntax:'<length>';inherits:false;initial-value:25px}
#pp{width:var(--pp);height:4px;background:#46c}
@scope (#scope-root){.sp{color:rgb(50,0,0)}}
@starting-style{#ss{color:rgb(51,0,0)}}
.nest{.inner{width:50px}}
.nest2{& .inner{width:60px}}
.nest3{color:rgb(0,0,0);&.on{color:rgb(60,0,0)}}
#nest-after{width:33px}
</style>
</head>
<body>
<div class="conf-head">08 · At-rules and nesting</div>
<div class="conf-probes">
  <div><span class="m" id="mw1"></span><span class="m" id="mw2"></span><span class="m" id="mw3"></span><span class="m" id="cs"></span><span class="m" id="rm"></span><span class="m" id="hh"></span><span class="m" id="pc"></span><span class="m" id="pr"></span></div>
  <div><span class="m" id="sf"></span><span class="m" id="s3d"></span><span class="m" id="scomb"></span><span class="m" id="sgap"></span><span class="m" id="imp"></span></div>
  <div id="cq-wrap"><span class="m" id="cq"></span><span class="m" id="cq2"></span></div>
  <div><span id="ly" style="display:inline-block;width:8px;height:8px"></span><div id="pp"></div><span id="scope-root"><span class="m sp" id="sp"></span></span><span class="m" id="ss"></span></div>
  <div class="nest"><div class="inner" id="n1" style="height:4px;background:#46c"></div></div>
  <div class="nest2"><div class="inner" id="n2" style="height:4px;background:#46c"></div></div>
  <span class="m nest3 on" id="n3"></span><div id="nest-after" style="height:4px;background:#46c"></div>
</div>
<div id="conf-list"></div>
<script>
var C = function (sel) { return T.color(sel, 'color'); };
var red = function (n) { return n + ',0,0,1'; };
var mm = function (q) { return matchMedia(q).matches; };
T.step(function () {
  T.eq('at.media.width', '(min-width: 200px) applies', C('#mw1'), red(1));
  T.ok('at.media.width', '(max-width: 100px) does not', C('#mw2') !== red(2), C('#mw2'));
  T.eq('at.media.width', 'screen and (min-width) and (max-width)', C('#mw3'), red(3));
  T.eq('at.media.width', 'matchMedia agrees with @media', mm('(min-width: 200px)') && !mm('(max-width: 100px)'), true);
  var dark = typeof TelegramWidget !== 'undefined' ? TelegramWidget.theme === 'dark' : mm('(prefers-color-scheme: dark)');
  T.eq('at.media.color-scheme', 'prefers-color-scheme follows the chat theme', C('#cs'), dark ? red(10) : red(11));
  T.eq('at.media.color-scheme', 'matchMedia(prefers-color-scheme) agrees', mm('(prefers-color-scheme: dark)'), dark);
  T.eq('at.media.reduced-motion', '@media and matchMedia agree on reduced motion', C('#rm') === red(12), mm('(prefers-reduced-motion: reduce)'));
  T.ok('at.media.hover-pointer', '@media (hover) is dropped and matchMedia answers false (profile 1: out)', C('#hh') !== red(13) && mm('(hover: hover)') === false, C('#hh') + ' / ' + mm('(hover: hover)'));
  T.ok('at.media.hover-pointer', '@media (pointer) is dropped and matchMedia answers false', C('#pc') !== red(14) && mm('(pointer: coarse)') === false && mm('(pointer: fine)') === false, C('#pc') + ' / ' + mm('(pointer: fine)'));
  T.ok('at.media.other', '@media print never applies and matchMedia(print) is false', C('#pr') !== red(15) && mm('print') === false, C('#pr'));
  T.eq('at.supports', '@supports (display: flex) holds', C('#sf'), red(20));
  T.ok('at.supports', '@supports (3D transform) is false: 3D is out of the profile', C('#s3d') !== red(21), C('#s3d'), { sandboxOnly: true });
  T.eq('at.supports', '@supports with and/not follows the profile', C('#scomb'), red(22), { sandboxOnly: true });
  T.eq('at.supports', '@supports (gap) holds', C('#sgap'), red(23));
  T.ok('at.import-namespace', '@import is dropped', C('#imp') !== red(80), C('#imp'));
  T.ok('at.container', '@container is dropped (profile 1: out)', C('#cq') !== red(30), C('#cq'));
  T.ok('at.container', '@container (min-width: 500px) does not apply either way', C('#cq2') !== red(31), C('#cq2'));
  T.ok('at.layer', '@layer is dropped with its rules (profile 1: out)', C('#ly') !== red(40) && C('#ly') !== red(41), C('#ly'));
  T.ok('at.property', '@property is dropped: var(--pp) has no initial value (profile 1: out)', Math.abs(T.rect('#pp').w - 25) > 0.5, 'w ' + T.rect('#pp').w);
  T.ok('at.exotic', '@scope is dropped', C('#sp') !== red(50), C('#sp'));
  T.ok('at.nesting', 'a nested rule .a { .b {} } is dropped (profile 1: out)', Math.abs(T.rect('#n1').w - 50) > 0.5, 'w ' + T.rect('#n1').w);
  T.ok('at.nesting', 'a nested & .b rule is dropped', Math.abs(T.rect('#n2').w - 60) > 0.5, 'w ' + T.rect('#n2').w);
  T.ok('at.nesting', 'a nested &.class rule is dropped', C('#n3') !== red(60), C('#n3'));
  T.near('at.nesting', 'rules after nested ones survive', T.rect('#nest-after').w, 33, 0.5);
});
T.run();
</script>
</body>
