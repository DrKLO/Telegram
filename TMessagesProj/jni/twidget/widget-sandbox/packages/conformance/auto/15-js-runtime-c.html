<div class="conf-head">15c · JS runtime (3/3)</div>

<script>
var S = T.sandbox ? {} : { sandboxOnly: true };
T.step(function () {
  // ───── out of the profile
  var net = [];
  ['XMLHttpRequest', 'WebSocket', 'EventSource', 'RTCPeerConnection', 'Worker', 'SharedWorker', 'BroadcastChannel'].forEach(function (n) {
    try { new window[n]('https://example.org/'); net.push(n + ':constructed'); } catch (e) { if (!e || e.name !== 'NetworkDisabledError') net.push(n + ':' + (e && e.name)); }
  });
  try { navigator.sendBeacon('https://example.org/', 'x'); net.push('sendBeacon:sent'); } catch (e) { if (e.name !== 'NetworkDisabledError') net.push('sendBeacon:' + e.name); }
  try { importScripts('https://example.org/x.js'); net.push('importScripts:ran'); } catch (e) { if (e.name !== 'NetworkDisabledError') net.push('importScripts:' + e.name); }
  T.ok('js.network', 'XHR, WebSocket, EventSource, RTCPeerConnection, Worker, sendBeacon, importScripts throw NetworkDisabledError', net.length === 0, net.join(' '), S);
  if (T.sandbox) {
    var href = String(location.href);
    try { location.href = 'https://example.org/'; } catch (e) {}
    T.ok('js.navigation', 'location assignment does not navigate', String(location.href) === href, String(location.href));
    T.eq('js.navigation', 'window.open returns null', window.open('https://example.org/'), null);
    T.ok('js.dialogs', 'confirm → false, prompt → null, alert does not block', confirm('x') === false && prompt('x') === null && alert('x') === undefined, '');
  } else {
    T.skip('js.navigation', 'location assignment does not navigate', 'sandbox only');
    T.skip('js.navigation', 'window.open returns null', 'sandbox only');
    T.skip('js.dialogs', 'confirm → false, prompt → null, alert does not block', 'sandbox only');
  }
  T.ok('js.device', 'no geolocation or media devices; vibrate is false', !navigator.geolocation && !navigator.mediaDevices && navigator.vibrate(10) === false, '', S);
  T.ok('js.shadow-dom', 'attachShadow throws', (function () { try { document.createElement('div').attachShadow({ mode: 'open' }); return false; } catch (e) { return true; } })(), '', S);
  T.eq('js.blob-file', 'URL.createObjectURL gives no URL', URL.createObjectURL(new Blob(['x'])), '', S);
  T.eq('anim.magic-move', 'no View Transitions (document.startViewTransition)', typeof document.startViewTransition, 'undefined', S);
});
var fetchRej = T.wait('js.network', 'fetch rejects with NetworkDisabledError', S);
if (T.sandbox) fetch('https://example.org/').then(function () { fetchRej.fail('resolved'); }, function (e) { fetchRej.result(e && e.name === 'NetworkDisabledError', e && e.name); });
var clip = T.wait('js.device', 'clipboard.writeText and share reject', S);
if (T.sandbox) navigator.clipboard.writeText('x').then(function () { clip.fail('clipboard resolved'); }, function () { navigator.share({ text: 'x' }).then(function () { clip.fail('share resolved'); }, function () { clip.pass(); }); });

if (T.sandbox) { try { document.body.requestFullscreen().then(function () { fs.fail('resolved'); }, function () { fs.pass(); }); } catch (e) { fs.pass('threw'); } }
