<style>
.conf-probes{font:13px/16px sans-serif}
.m{display:inline-block;width:8px;height:8px;margin:1px;color:rgb(0,0,0)}
/* each matching rule sets a distinct colour on .m probes */
#st .m:first-child{color:rgb(20,0,0)}
#st .m:last-child{color:rgb(21,0,0)}
#st .m:nth-child(3){color:rgb(22,0,0)}
#st .m:nth-last-child(2){color:rgb(23,0,0)}
#st2 b:nth-of-type(2){color:rgb(24,0,0)}
#st2 b:first-of-type{color:rgb(25,0,0)}
#st2 i:last-of-type{color:rgb(26,0,0)}
#st3 .m:only-child{color:rgb(27,0,0)}
#st4 .m:empty{color:rgb(28,0,0)}
#st4 .m:not(:empty){color:rgb(29,0,0)}
:is(#isw .a,#isw .b) .m{color:rgb(30,0,0)}
:where(#isw .w) .m{color:rgb(31,0,0)}
.m.low{color:rgb(33,0,0)}
#has .card:has(.badge){color:rgb(40,0,0)}
:root{--root-probe:rgb(50,0,0)}
#root-probe{color:var(--root-probe)}
#pe::before{content:"";display:inline-block;width:11px;height:1px}
#pe::after{content:"x";color:rgb(51,0,0)}
#fl::first-letter{font-size:26px}
#fl::first-line{color:rgb(52,0,0)}
#mk li::marker{color:rgb(53,0,0)}
#hv:hover{color:rgb(60,0,0)}
#fc:focus{color:rgb(61,0,0)}
#fc:focus-visible{color:rgb(61,0,0)}
:host{--host-probe:1}
:scope .sc{color:rgb(62,0,0)}
#tg:target{color:rgb(63,0,0)}
#dyn.on{color:rgb(70,0,0)}
</style>
</head>
<body>
<div class="conf-head">07b · Selectors (2/2)</div>
<div class="conf-probes">
  <div id="st"><span class="m"></span><span class="m"></span><span class="m"></span><span class="m"></span><span class="m"></span></div>
  <div id="st2"><b class="m"></b><i class="m"></i><b class="m"></b><i class="m"></i></div>
  <div id="st3"><span><span class="m" id="only"></span></span></div>
  <div id="st4"><span class="m" id="empty"></span><span class="m" id="nonempty">x</span></div>
  <div id="isw"><span class="b"><span class="m" id="is"></span></span><span class="w"><span class="m" id="where"></span><span class="m low" id="low"></span></span></div>
  <div id="has"><span class="card" id="card1"><span class="badge">b</span></span><span class="card" id="card2">c</span></div>
  <div><span class="m" id="root-probe"></span><span id="pe"></span><div id="fl" style="width:200px">First line text</div><ul id="mk" style="margin:0"><li>m</li></ul></div>
  <div><span class="m" id="hv"></span><button id="fc">focus</button><span class="m sc" id="scope"></span><span class="m" id="tg"></span><span class="m" id="dyn"></span></div>
</div>
<div id="conf-list"></div>
<script>
var C = function (sel, pseudo) { return T.color(sel, 'color', pseudo); };
var red = function (n) { return n + ',0,0,1'; };
var all = function (sel) { return Array.prototype.map.call(document.querySelectorAll(sel), function (e) { return T.color(e, 'color'); }); };
T.step(function () {
  var st = all('#st .m');
  T.ok('sel.structural', ':first-child, :nth-child(3), :nth-last-child(2), :last-child', st[0] === red(20) && st[2] === red(22) && st[3] === red(23) && st[4] === red(21), st.join(' '));
  var st2 = all('#st2 .m');
  T.ok('sel.structural', ':first-of-type, :nth-of-type(2), :last-of-type', st2[0] === red(25) && st2[2] === red(24) && st2[3] === red(26), st2.join(' '));
  T.eq('sel.structural', ':only-child', C('#only'), red(27));
  T.eq('sel.structural', ':empty', C('#empty'), red(28));
  T.eq('sel.structural', ':not(:empty)', C('#nonempty'), red(29));
  T.eq('sel.is-where', ':is()', C('#is'), red(30));
  T.eq('sel.is-where', ':where() matches', C('#where'), red(31));
  T.eq('sel.is-where', ':where() has zero specificity', C('#low'), red(33));
  T.ok('sel.has', ':has() never matches (profile 1: out)', C('#card1') !== red(40) && C('#card2') !== red(40), C('#card1') + ' / ' + C('#card2'));
  T.eq('sel.root', ':root custom property reaches descendants', C('#root-probe'), red(50));
  T.eq('sel.before-after', '::before box takes space', T.rect('#pe').w >= 11 ? 'ok' : String(T.rect('#pe').w), 'ok');
  T.eq('sel.before-after', '::after computed style', C('#pe', '::after'), red(51));
  T.ok('sel.first-letter-line', '::first-letter never matches', T.cs('#fl', 'font-size', '::first-letter') !== '26px', T.cs('#fl', 'font-size', '::first-letter'));
  T.ok('sel.first-letter-line', '::first-line never matches', C('#fl', '::first-line') !== red(52), C('#fl', '::first-line'));
  T.ok('sel.first-letter-line', '::marker never matches', C('#mk li', '::marker') !== red(53), C('#mk li', '::marker'));
  T.ok('sel.hover', ':hover rules are kept and do not match without a pointer', C('#hv') === '0,0,0,1', C('#hv'));
  document.getElementById('fc').focus();
  T.ok('sel.focus', ':focus never matches (no keyboard focus in v1)', C('#fc') !== red(61), C('#fc'));
  T.ok('sel.host-scoped', ':scope at the top level matches nothing', C('#scope') !== red(62), C('#scope'));
  T.ok('sel.target', ':target never matches', C('#tg') !== red(63), C('#tg'));
  document.getElementById('dyn').classList.add('on');
  T.eq('sel.basic', 'a class added from script restyles', C('#dyn'), red(70));
});
T.run();
</script>
</body>
</html>
