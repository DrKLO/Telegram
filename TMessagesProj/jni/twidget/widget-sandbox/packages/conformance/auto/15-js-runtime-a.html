<div class="conf-head">15a · JS runtime (1/3)</div>
<div id="conf-list"></div>
<script>
var S = T.sandbox ? {} : { sandboxOnly: true };
// ───── timers, frames, microtasks
var order = [];
var tOrder = T.wait('js.timers', 'timeouts fire in delay order, after microtasks');
setTimeout(function () { order.push('t20'); }, 20);
setTimeout(function () { order.push('t10'); }, 10);
setTimeout(function (a, b) { order.push('t0:' + a + b); }, 0, 'x', 'y');
Promise.resolve().then(function () { order.push('p'); });
queueMicrotask(function () { order.push('q'); });
var cancelled = setTimeout(function () { order.push('cancelled'); }, 5);
clearTimeout(cancelled);
setTimeout(function () { tOrder.result(order.join(',') === 'p,q,t0:xy,t10,t20', order.join(',')); }, 60);
var ticks = 0, tInt = T.wait('js.timers', 'setInterval repeats until cleared');
var iv = setInterval(function () { if (++ticks === 3) { clearInterval(iv); setTimeout(function () { tInt.result(ticks === 3, ticks + ' ticks'); }, 80); } }, 15);
var raf = T.wait('js.raf', 'requestAnimationFrame: three frames with increasing timestamps');
var stamps = [];
var rafCancelled = requestAnimationFrame(function () { stamps.push('cancelled'); });
cancelAnimationFrame(rafCancelled);
requestAnimationFrame(function f1(ts) { stamps.push(ts); requestAnimationFrame(function f2(ts2) { stamps.push(ts2); requestAnimationFrame(function f3(ts3) { stamps.push(ts3); raf.result(stamps.length === 3 && stamps[0] < stamps[1] && stamps[1] < stamps[2], stamps.map(Math.round).join(',')); }); }); });
var aw = T.wait('js.microtasks', 'async/await');
(async function () { var v = await new Promise(function (r) { setTimeout(function () { r(42); }, 5); }); aw.result(v === 42, String(v)); })();

T.step(function () {
  T.ok('js.microtasks', 'Promise.all / allSettled', typeof Promise.allSettled === 'function' && typeof Promise.any === 'function', '');
  // ───── storage
  localStorage.clear();
  localStorage.setItem('k', 'v'); localStorage.n = '1';
  T.ok('js.storage.local', 'setItem / getItem / property access / length / key', localStorage.getItem('k') === 'v' && localStorage.getItem('n') === '1' && localStorage.length === 2 && ['k', 'n'].indexOf(localStorage.key(0)) >= 0, localStorage.length + '');
  localStorage.removeItem('k');
  T.ok('js.storage.local', 'removeItem / missing key is null', localStorage.getItem('k') === null, '');
  localStorage.setItem('obj', JSON.stringify({ a: [1, 2] }));
  T.eq('js.storage.local', 'values are strings (JSON round trip)', JSON.parse(localStorage.getItem('obj')).a[1], 2);
  var big = new Array(3 * 1024 + 1).join('x');
  T.ok('js.storage.local', '3 KB fits', (function () { try { localStorage.setItem('big', big); return localStorage.getItem('big').length === 3072; } catch (e) { return false; } })(), '');
  var quota = 'no error';
  try { localStorage.setItem('huge', new Array(5 * 1024 + 1).join('y')); } catch (e) { quota = e && e.name; }
  T.eq('limit.storage', 'over 4 KB per message: setItem throws QuotaExceededError', quota, 'QuotaExceededError', S);
  T.ok('limit.storage', 'the refused value is not stored', localStorage.getItem('huge') === null, String((localStorage.getItem('huge') || '').length), S);
  localStorage.clear();
  var sq = 'no error';
  try { sessionStorage.setItem('huge', new Array(5 * 1024 + 1).join('y')); } catch (e) { sq = e && e.name; }
  T.eq('limit.storage', 'sessionStorage has the same 4 KB quota', sq, 'QuotaExceededError', S);
  sessionStorage.clear();
  localStorage.clear();
  sessionStorage.setItem('s', '1');
  T.ok('js.storage.session', 'sessionStorage works and is separate', sessionStorage.getItem('s') === '1' && localStorage.getItem('s') === null, '');
  sessionStorage.clear();
});
T.run({ deadline: 3000 });
</script>
