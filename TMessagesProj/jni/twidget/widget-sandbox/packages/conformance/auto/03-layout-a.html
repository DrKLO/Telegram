<style>
.p{position:relative;width:200px;margin:0 0 3px;background:#eef}
.b{height:10px;background:#46c}
.w40{width:40px}
#flex{display:flex}
#flex-sb{display:flex;justify-content:space-between}
#flex-c{display:flex;align-items:center;height:30px}
#flex-col{display:flex;flex-direction:column}
#flex-wrap{display:flex;flex-wrap:wrap}
#flex-wrap>div{width:80px}
#flex-grow{display:flex}
#flex-order{display:flex}
#gap{display:flex;gap:10px}
#gap-row{display:flex;flex-wrap:wrap;row-gap:6px}
#gap-row>div{width:120px}
#grid{display:grid;grid-template-columns:50px 1fr;gap:4px}
#grid-rep{display:grid;grid-template-columns:repeat(4,1fr)}
#grid-area{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:10px 10px}
#grid-area .span{grid-column:2 / span 2;grid-row:2}
/* stages */
.s-flex{display:flex;gap:4px;padding:6px}
.s-flex>div{width:20px;height:48px}
.s-grid{display:grid;grid-template-columns:20px 1fr;grid-template-rows:20px 1fr;gap:4px;padding:6px;height:60px;box-sizing:border-box}
</style>
</head>
<body>
<div class="conf-stages">
  <div data-stage="flex" data-covers="css.display.flex css.gap.flex"><div class="s-flex"><div style="background:#c33"></div><div style="background:#3a3;flex:1"></div><div style="background:#33c"></div></div></div>
  <div data-stage="grid" data-covers="css.display.grid"><div class="s-grid"><div style="background:#c33"></div><div style="background:#3a3"></div><div style="background:#33c;grid-column:1 / span 2"></div></div></div>
</div>
<div class="conf-head">03a · Layout and box model (1/3)</div>
<div class="conf-probes">
  <div class="p" id="db"><div class="b" id="db-block"></div><span id="db-i1">ab</span><span id="db-i2">cd</span><span id="db-ib" style="display:inline-block;width:30px;height:8px;background:#c33"></span><div id="db-none" style="display:none;height:10px"></div></div>
  <div class="p" id="flex"><div class="b w40"></div><div class="b w40"></div><div class="b w40"></div></div>
  <div class="p" id="flex-sb"><div class="b w40"></div><div class="b w40"></div></div>
  <div class="p" id="flex-c"><div class="b w40"></div></div>
  <div class="p" id="flex-col"><div class="b w40"></div><div class="b w40"></div></div>
  <div class="p" id="flex-wrap"><div class="b"></div><div class="b"></div><div class="b"></div></div>
  <div class="p" id="flex-grow"><div class="b w40"></div><div class="b" style="flex-grow:1"></div></div>
  <div class="p" id="flex-order"><div class="b w40" id="fo-a"></div><div class="b w40" id="fo-b" style="order:-1"></div></div>
  <div class="p" id="gap"><div class="b w40"></div><div class="b w40"></div></div>
  <div class="p" id="gap-row"><div class="b"></div><div class="b"></div></div>
  <div class="p" id="grid"><div class="b"></div><div class="b"></div><div class="b"></div></div>
  <div class="p" id="grid-rep"><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div></div>
  <div class="p" id="grid-area"><div class="b"></div><div class="b span"></div></div>
</div>
<div id="conf-list"></div>
<script>
var R = T.rect;
function kids(sel) { return Array.prototype.map.call(document.querySelector(sel).children, R); }
function inside(sel) { var p = R(sel); return kids(sel).map(function (k) { return { x: k.x - p.x, y: k.y - p.y, w: k.w, h: k.h, r: k.r - p.x, b: k.b - p.y }; }); }

T.step(function () {
  var db = R('#db'), blk = R('#db-block');
  T.near('css.display.basic', 'a block fills the container width', blk.w, db.w, 0.5);
  var i1 = R('#db-i1'), i2 = R('#db-i2'), ib = R('#db-ib');
  T.ok('css.display.basic', 'inline boxes share a line', Math.abs(i1.y - i2.y) < 1 && i2.x >= i1.r - 0.5, 'i1 ' + i1.x + ',' + i1.y + ' i2 ' + i2.x + ',' + i2.y);
  T.ok('css.display.basic', 'inline-block keeps its width on the line', Math.abs(ib.w - 30) < 0.5 && ib.x >= i2.r - 0.5, 'w ' + ib.w + ' x ' + ib.x);
  var none = R('#db-none');
  T.ok('css.display.basic', 'display:none has no box', none.w === 0 && none.h === 0, none.w + 'x' + none.h);

  var f = inside('#flex');
  T.ok('css.display.flex', 'row places children side by side', Math.abs(f[1].x - 40) < 0.5 && Math.abs(f[2].x - 80) < 0.5 && Math.abs(f[2].y - f[0].y) < 0.5, f.map(function (k) { return k.x; }).join(','));
  var sb = inside('#flex-sb');
  T.near('css.display.flex', 'justify-content: space-between', sb[1].r, 200, 0.5);
  var c = inside('#flex-c');
  T.near('css.display.flex', 'align-items: center', c[0].y, 10, 0.5);
  var col = inside('#flex-col');
  T.ok('css.display.flex', 'flex-direction: column stacks', Math.abs(col[1].y - 10) < 0.5 && Math.abs(col[1].x) < 0.5, col[1].x + ',' + col[1].y);
  var wr = inside('#flex-wrap');
  T.ok('css.display.flex', 'flex-wrap moves the third item to a new line', Math.abs(wr[2].y - 10) < 0.5 && Math.abs(wr[2].x) < 0.5, wr[2].x + ',' + wr[2].y);
  var g = inside('#flex-grow');
  T.near('css.display.flex', 'flex-grow takes the free space', g[1].w, 160, 0.5);
  var oa = R('#fo-a'), ob = R('#fo-b');
  T.ok('css.display.flex', 'order: -1 comes first', ob.x < oa.x, 'a ' + oa.x + ' b ' + ob.x);

  var gp = inside('#gap');
  T.near('css.gap.flex', 'gap between flex items', gp[1].x, 50, 0.5);
  var gr = inside('#gap-row');
  T.near('css.gap.flex', 'row-gap between wrapped lines', gr[1].y, 16, 0.5);

  var gd = inside('#grid');
  T.ok('css.display.grid', 'grid-template-columns: 50px 1fr', Math.abs(gd[0].w - 50) < 0.5 && Math.abs(gd[1].x - 54) < 0.5 && Math.abs(gd[1].w - 146) < 0.5, gd[0].w + ' / ' + gd[1].x + ' ' + gd[1].w);
  T.ok('css.display.grid', 'auto-placement wraps to the next row', Math.abs(gd[2].x) < 0.5 && Math.abs(gd[2].y - 14) < 0.5, gd[2].x + ',' + gd[2].y);
  var rep = inside('#grid-rep');
  T.ok('css.display.grid', 'repeat(4, 1fr) gives equal tracks', rep.every(function (k, i) { return Math.abs(k.w - 50) < 0.5 && Math.abs(k.x - 50 * i) < 0.5; }), rep.map(function (k) { return k.x + '/' + k.w; }).join(' '));
  var ga = inside('#grid-area');
  T.ok('css.display.grid', 'grid-column: 2 / span 2 on row 2', Math.abs(ga[1].x - 40) < 0.5 && Math.abs(ga[1].w - 80) < 0.5 && Math.abs(ga[1].y - 10) < 0.5, ga[1].x + ',' + ga[1].y + ' w ' + ga[1].w);
});
T.run();
</script>
<template data-ref="flex"><div style="position:absolute;left:6px;top:6px;width:20px;height:48px;background:#c33"></div><div style="position:absolute;left:30px;top:6px;width:20px;height:48px;background:#3a3"></div><div style="position:absolute;left:54px;top:6px;width:20px;height:48px;background:#33c"></div></template>
<template data-ref="grid"><div style="position:absolute;left:6px;top:6px;width:20px;height:20px;background:#c33"></div><div style="position:absolute;left:30px;top:6px;width:44px;height:20px;background:#3a3"></div><div style="position:absolute;left:6px;top:30px;width:68px;height:24px;background:#33c"></div></template>
</body>
