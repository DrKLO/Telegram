<div class="conf-head">25a · State and context (API)</div>
<div id="conf-list"></div>
<script>
var TW = typeof TelegramWidget !== 'undefined' ? TelegramWidget : null;
var S = T.sandbox ? {} : { sandboxOnly: true };
var fn = function (k) { return !!TW && typeof TW[k] === 'function'; };
var undef = function (f) { try { return f() === undefined; } catch (e) { return false; } };
function bytes(s) { var n = 0; for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); n += c < 128 ? 1 : c < 2048 ? 2 : c >= 0xd800 && c < 0xdc00 ? (i++, 4) : 3; } return n; }
var text = function (v) { return v === null || (typeof v === 'string' && v.length > 0 && bytes(v) <= 1024 && v.indexOf('\0') < 0); };
// The viewer is Mini Apps' WebAppUser: an id and, when the client has them, the names, the username and is_premium (only true).
function user(v) {
  if (v === null) return true;
  if (!v || typeof v !== 'object' || !Object.isFrozen(v)) return false;
  var name = function (s) { return s === undefined || (typeof s === 'string' && s.length >= 1 && s.length <= 64); };
  return Object.keys(v).every(function (k) { return ['id', 'first_name', 'last_name', 'username', 'is_premium'].indexOf(k) >= 0; })
    && Number.isInteger(v.id) && v.id >= 1 && v.id <= 9007199254740991 && name(v.first_name) && name(v.last_name)
    && (v.username === undefined || /^[A-Za-z0-9_]{5,32}$/.test(v.username)) && (v.is_premium === undefined || v.is_premium === true);
}

T.step(function () {
  var d = TW ? JSON.stringify([TW.chatData, TW.publicData]).slice(0, 60) : 'no SDK';
  T.ok('tw.bot-data', 'chatData and publicData are text of 1–1024 bytes, or null', !!TW && text(TW.chatData) && text(TW.publicData), d, S);
  var before = TW && [TW.chatData, TW.publicData, TW.isForward, TW.isPreview, TW.chatType, TW.viewer];
  if (TW) ['chatData', 'publicData', 'isForward', 'isPreview', 'chatType', 'viewer'].forEach(function (k) { try { TW[k] = 'x'; } catch (e) {} });
  T.ok('tw.bot-data', 'the state and the context fields are read-only', !!TW && [TW.chatData, TW.publicData, TW.isForward, TW.isPreview, TW.chatType, TW.viewer].every(function (v, i) { return v === before[i]; }), '', S);
  T.ok('tw.bot-data', "onEvent takes 'chatDataChanged' and 'publicDataChanged'", fn('onEvent') && undef(function () { TW.onEvent('chatDataChanged', function () {}); }) && undef(function () { TW.onEvent('publicDataChanged', function () {}); }), '', S);
  T.ok('tw.context', 'isForward is a boolean; chatType is private, group, supergroup, channel or null', !!TW && typeof TW.isForward === 'boolean' && ['private', 'group', 'supergroup', 'channel', null].indexOf(TW.chatType) >= 0, TW ? TW.isForward + ' / ' + TW.chatType : '', S);
  T.ok('tw.context', 'viewer is null or a frozen WebAppUser: id, first_name, last_name, username, is_premium', !!TW && user(TW.viewer), TW ? JSON.stringify(TW.viewer).slice(0, 80) : '', S);
  T.ok('tw.context', 'a forward has no chatData and no chatType', !!TW && (!TW.isForward || (TW.chatData === null && TW.chatType === null)), '', S);
  T.ok('tw.preview', 'isPreview is a boolean; a preview is no forward and has no chatType or viewer', !!TW && typeof TW.isPreview === 'boolean' && (!TW.isPreview || (!TW.isForward && TW.chatType === null && TW.viewer === null)), TW ? String(TW.isPreview) : '', S);
});
