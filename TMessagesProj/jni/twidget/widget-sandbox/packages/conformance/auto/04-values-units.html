<style>
html{font-size:16px}
.conf-probes{font:13px/16px sans-serif}
.p{position:relative;width:200px;margin:0 0 2px;background:#eef}
.b{height:6px;background:#46c}
#em{width:2em}
#rem{width:2rem}
#pct{width:50%}
#ch{width:10ch;font:13px monospace}
#ch-ref{font:13px monospace;white-space:nowrap}
#ex{width:4ex}
#pt{width:12pt}
#in{width:1in}
#cm{width:2.54cm}
#mm{width:25.4mm}
#vw{width:50vw}
#vh{height:10vh;width:4px;background:#46c}
#calc{width:calc(50% - 10px)}
#min{width:min(50px,30%)}
#max{width:max(10px,20%)}
#clamp{width:clamp(20px,50%,60px)}
#calcvar{--u:7px;width:calc(var(--u) * 3 + 1px)}
:root{--w:30px}
#var{width:var(--w)}
#fallback{width:var(--missing,33px)}
#inh-parent{--c:rgb(0,120,0)}
#inh-child{color:var(--c)}
#js-var{width:var(--jw,1px)}
#inherit-parent{width:77px}
#inherit-parent>div{width:inherit}
#initial{display:initial}
#unset-parent{color:rgb(0,0,140)}
#unset{color:rgb(200,0,0);color:unset}
#revert{display:inline;display:revert}
.imp{width:40px!important}
#before::before{content:"abcd"}
#attr::before{content:attr(data-label)}
#cnt{counter-reset:n 2}
#cnt>span{counter-increment:n}
#cnt>span::before{content:counter(n)}
#quotes{quotes:"«" "»"}
#env{width:env(safe-area-inset-left,31px)}
</style>
</head>
<body>
<div class="conf-head">04 · Values and units</div>
<div class="conf-probes">
  <div class="p"><div class="b" id="em"></div><div class="b" id="rem"></div><div class="b" id="pct"></div><div class="b" id="ch"></div><span id="ch-ref">0000000000</span><div class="b" id="ex"></div><div class="b" id="pt"></div><div class="b" id="in"></div><div class="b" id="cm"></div><div class="b" id="mm"></div></div>
  <div class="p" style="width:auto"><div class="b" id="vw"></div><div id="vh"></div></div>
  <div class="p"><div class="b" id="calc"></div><div class="b" id="min"></div><div class="b" id="max"></div><div class="b" id="clamp"></div><div class="b" id="calcvar"></div></div>
  <div class="p"><div class="b" id="var"></div><div class="b" id="fallback"></div><div id="inh-parent"><span id="inh-child">c</span></div><div class="b" id="js-var"></div></div>
  <div class="p"><div id="inherit-parent"><div class="b"></div></div><div id="initial">i</div><div id="unset-parent"><span id="unset">u</span></div><div id="revert">r</div><div class="b imp" id="imp" style="width:10px"></div></div>
  <div class="p"><span id="before"></span><span id="attr" data-label="xyz"></span><div id="cnt"><span></span><span id="cnt-last"></span></div><q id="quotes">q</q></div>
  <div class="p"><div class="b" id="env"></div></div>
</div>
<div id="conf-list"></div>
<script>
var R = T.rect, CS = T.cs;
var W = function (sel) { return R(sel).w; };

T.step(function () {
  T.near('css.value.units', 'em', W('#em'), 26, 0.5);
  T.near('css.value.units', 'rem', W('#rem'), 32, 0.5);
  T.near('css.value.units', '%', W('#pct'), 100, 0.5);
  T.near('css.value.units', 'ch is the width of "0"', W('#ch'), W('#ch-ref'), 1);
  T.ok('css.value.units', 'ex is positive', W('#ex') > 8 && W('#ex') < 40, W('#ex') + '');
  T.near('css.value.units', 'pt (12pt = 16px)', W('#pt'), 16, 0.5);
  T.near('css.value.units', 'in (1in = 96px)', W('#in'), 96, 0.5);
  T.near('css.value.units', 'cm (2.54cm = 96px)', W('#cm'), 96, 0.5);
  T.near('css.value.units', 'mm (25.4mm = 96px)', W('#mm'), 96, 0.5);

  T.near('css.value.vw', '50vw is half the bubble width (innerWidth)', W('#vw'), window.innerWidth / 2, 1);
  T.near('css.value.vw', '50vw is half the root width', W('#vw'), document.documentElement.clientWidth / 2, 1);
  T.near('css.value.vh', 'height: 10vh is dropped: the empty box has no height (profile 1: out)', R('#vh').h, 0, 0.5);

  T.near('css.value.math', 'calc(50% - 10px)', W('#calc'), 90, 0.5);
  T.near('css.value.math', 'min(50px, 30%)', W('#min'), 50, 0.5);
  T.near('css.value.math', 'max(10px, 20%)', W('#max'), 40, 0.5);
  T.near('css.value.math', 'clamp(20px, 50%, 60px)', W('#clamp'), 60, 0.5);
  T.near('css.value.math', 'calc() with var()', W('#calcvar'), 22, 0.5);

  T.near('css.value.custom-properties', 'var() from :root', W('#var'), 30, 0.5);
  T.near('css.value.custom-properties', 'var() fallback', W('#fallback'), 33, 0.5);
  T.eq('css.value.custom-properties', 'custom properties inherit', T.color('#inh-child', 'color'), '0,120,0,1');
  T.eq('css.value.custom-properties', 'getPropertyValue reads a custom property', CS('#inh-parent', '--c').replace(/\s/g, ''), 'rgb(0,120,0)');
  document.getElementById('js-var').style.setProperty('--jw', '44px');
  T.near('css.value.custom-properties', 'style.setProperty(--x) from script', W('#js-var'), 44, 0.5);

  T.near('css.value.keywords', 'width: inherit', W('#inherit-parent > div'), 77, 0.5);
  T.eq('css.value.keywords', 'display: initial is inline', CS('#initial', 'display'), 'inline');
  T.eq('css.value.keywords', 'color: unset inherits', T.color('#unset', 'color'), '0,0,140,1');
  T.eq('css.value.keywords', 'display: revert is the UA block', CS('#revert', 'display'), 'block');
  T.near('css.value.keywords', '!important beats the style attribute', W('#imp'), 40, 0.5);

  T.ok('css.value.content', '::before content takes space', W('#before') > 15, W('#before') + '');
  T.ok('css.value.content', 'content: attr(data-label)', W('#attr') > 10, W('#attr') + '');
  T.ok('css.value.content', 'counters: counter-reset / increment / counter()', W('#cnt-last') > 4 && CS('#cnt-last', 'content', '::before') !== 'none', CS('#cnt-last', 'content', '::before'));
  T.ok('css.value.content', 'quotes', /«/.test(CS('#quotes', 'quotes')), CS('#quotes', 'quotes'));

  var SA = typeof TelegramWidget != 'undefined' && TelegramWidget.contentSafeAreaInset;
  T.near('css.value.env', "env(safe-area-inset-left, 31px) is the client's", W('#env'), SA ? SA.left : 0, 0.5);
});
T.run();
</script>
</body>
</html>
