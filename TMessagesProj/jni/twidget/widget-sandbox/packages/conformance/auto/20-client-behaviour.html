<style>
:root{color-scheme:light dark}
.conf-probes{font:13px/16px sans-serif}
#ld{width:10px;height:10px;background:light-dark(rgb(1,1,1),rgb(2,2,2))}
#mq{width:10px;height:10px;background:rgb(3,3,3)}
@media (prefers-color-scheme:dark){#mq{background:rgb(4,4,4)}}

<body>
<div class="conf-head">20 · Client behaviour</div>
<div class="conf-probes">
  <div id="ld"></div><div id="mq"></div>
  <button id="grow">Grow</button><button id="finish">Finish</button>
  <div id="tall"></div>
</div>
<div id="conf-list"></div>
<script>
var TW = typeof TelegramWidget !== 'undefined' ? TelegramWidget : null;
T.target('grow', '#grow'); T.target('finish', '#finish');
var toDark = T.wait('behaviour.theme-switch', 'switching to dark: onTheme, matchMedia, @media and light-dark() follow', TW ? {} : { sandboxOnly: true });
var toLight = T.wait('behaviour.theme-switch', 'switching back to light: all four follow again', TW ? {} : { sandboxOnly: true });
var hidden = T.wait('behaviour.offscreen-pause', 'visibilitychange: hidden, then visible again');
var frames = T.wait('behaviour.offscreen-pause', 'no animation frames while hidden');
var timers = T.wait('behaviour.offscreen-pause', 'timers run at most once per second while hidden');
var SDK = TW ? {} : { sandboxOnly: true };
var limit16 = T.wait('limit.event-handlers', 'onEvent keeps the first 16 handlers per type: of 1 checker + 20 counters, 15 counters run on a theme change', SDK);
var paramsLive = T.wait('tw.theme-params', 'themeParams and --tg-theme-bg-color change with the theme, before themeChanged fires', SDK);
var activeEv = T.wait('tw.is-active', 'deactivated / activated fire and isActive follows visibility', SDK);
var calls16 = 0, bgBefore = null, activeLog = [];
if (TW && typeof TW.onEvent === 'function') {
  bgBefore = TW.themeParams && TW.themeParams.bg_color;
  // The checker goes first, so it is one of the 16 handlers kept; 15 of the 20 counters after it run.
  TW.onEvent('themeChanged', function () {
    var p = TW.themeParams || {};
    var cssBg = getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-bg-color').trim().toLowerCase();
    paramsLive.result(!!p.bg_color && p.bg_color !== bgBefore && cssBg === p.bg_color, 'bg ' + bgBefore + ' → ' + p.bg_color + ', css ' + cssBg);
    setTimeout(function () { limit16.result(calls16 === 15, calls16 + ' of 20 counters called'); }, 0);
  });
  for (var h = 0; h < 20; h++) TW.onEvent('themeChanged', function () { calls16++; });
  TW.onEvent('deactivated', function () { activeLog.push('deactivated:' + TW.isActive); });
  TW.onEvent('activated', function () { activeLog.push('activated:' + TW.isActive); activeEv.result(activeLog.join(',') === 'deactivated:false,activated:true', activeLog.join(',')); });
}
var ticks = 0, rafs = 0, hiddenAt = 0, hiddenTicks = 0, hiddenRafs = 0, wentHidden = false;
setInterval(function () { ticks++; }, 50);
(function loop() { rafs++; requestAnimationFrame(loop); })();
function snapshot(theme) {
  var mm = matchMedia('(prefers-color-scheme: dark)').matches;
  var dark = theme === 'dark';
  var ld = T.color('#ld'), mq = T.color('#mq');
  return [mm === dark && ld === (dark ? '2,2,2,1' : '1,1,1,1') && mq === (dark ? '4,4,4,1' : '3,3,3,1'), theme + ': matchMedia ' + mm + ', light-dark ' + ld + ', @media ' + mq];
}
if (TW) {
  var seen = [];
  TW.onTheme(function (t) {
    seen.push(t);
    if (seen.length < 2) return;
    setTimeout(function () { var s = snapshot(t); (t === 'dark' ? toDark : toLight).result(s[0], s[1]); }, 150);
  });
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { wentHidden = true; hiddenAt = Date.now(); hiddenTicks = ticks; hiddenRafs = rafs; }
  else if (wentHidden) {
    var secs = (Date.now() - hiddenAt) / 1000;
    hidden.pass(Math.round(secs * 10) / 10 + ' s hidden');
    frames.result(rafs - hiddenRafs <= 1, (rafs - hiddenRafs) + ' frames in ' + secs.toFixed(1) + ' s');
    timers.result(ticks - hiddenTicks <= Math.ceil(secs) + 1, (ticks - hiddenTicks) + ' ticks of a 50 ms interval in ' + secs.toFixed(1) + ' s');
  }
});
document.getElementById('grow').addEventListener('click', function () { document.getElementById('tall').style.height = '1500px'; });
document.getElementById('finish').addEventListener('click', function () { [toDark, toLight, hidden, frames, timers, limit16, paramsLive, activeEv].forEach(function (h) { if (!h.done) h.fail('did not happen'); }); });
T.run({ awaitInput: 20000 });
</script>
</body>
</html>
