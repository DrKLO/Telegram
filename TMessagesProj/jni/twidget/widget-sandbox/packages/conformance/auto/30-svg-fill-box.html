<script>
// A chart's end dot (corpus/bot-demos/05-ticker): viewBox = the SVG's width, cx/cy moved per update, the pulse scaled
// about the dot (fill-box). d1 the dot, d2 at scale(3), d3 the pulse. Telegram's own renderers ignored fill-box and
// scaled it about the view box; the stages draw scale(3) static, animated, and animated with cx/cy moved.
var R = T.rect, sv = document.getElementById('sv'), D = ['d1', 'd2', 'd3'].map(function (k) { return document.getElementById(k); });
var W, X, Y, pulse = [];
var px = function (v) { return Math.round(v * 10) / 10; };
var mid = function (r) { return [r.x + r.w / 2, r.y + r.h / 2]; };
function put(x, y) {
  X = x; Y = y;
  document.getElementById('ln').setAttribute('d', 'M0 80Q' + (x / 2).toFixed(1) + ' 90 ' + x.toFixed(1) + ' ' + y.toFixed(1));
  D.forEach(function (d) { d.setAttribute('cx', x.toFixed(1)); d.setAttribute('cy', y.toFixed(1)); });
}
// How far r's centre is from the dot's, and its size over the dot's.
function off(r, d) { var a = mid(r), b = mid(d); return [px(a[0] - b[0]), px(a[1] - b[1]), Math.round(r.w / d.w * 100) / 100]; }
function look(when) {
  var s = R(sv), d = R(D[0]), q = off(R(D[1]), d), c = mid(d);
  T.ok(when ? 'svg.shapes' : 'svg.structure', when + 'the dot sits at its cx/cy' + (when ? '' : ' (a viewBox the element\'s width, preserveAspectRatio none)'), Math.abs(c[0] - s.x - X) < 0.5 && Math.abs(c[1] - s.y - Y) < 0.5, 'centre ' + px(c[0] - s.x) + ',' + px(c[1] - s.y) + ', want ' + px(X) + ',' + px(Y));
  T.ok('css.transform.2d', when + 'scale(3) with transform-box: fill-box, transform-origin: center: centred on the dot, 3× its size', Math.abs(q[0]) < 0.5 && Math.abs(q[1]) < 0.5 && Math.abs(q[2] - 3) < 0.1, 'off by ' + q[0] + ',' + q[1] + ', ' + q[2] + '× the dot');
}
// The running pulse at whatever scale it has now: centred on the dot, between 1× and 3× of it.
function sample() { var q = off(R(D[2]), R(D[0])); if (Math.abs(q[0]) > 1 || Math.abs(q[1]) > 1 || q[2] < 0.9 || q[2] > 3.1) pulse.push('off by ' + q[0] + ',' + q[1] + ', ' + q[2] + '×'); }
function pulsed(when) { T.ok('css.transform.2d', when + 'the running pulse (scale 1 → 3) stays centred on the dot', !pulse.length, pulse.slice(0, 3).join('; ')); pulse = []; }
T.step(function () {
  W = Math.round(R(sv).w);
  sv.setAttribute('viewBox', '0 0 ' + W + ' 96');
  put(W - 16, 20);
  return 100;
});
T.step(function () { look(''); sample(); return 600; });
T.step(function () { sample(); return 600; });
T.step(function () {
  sample();
  pulsed('');
  var x0 = X, y0 = Y, t0 = Date.now();
  (function st() {
    var k = Math.min(1, (Date.now() - t0) / 750), e = 1 - Math.pow(1 - k, 3);
    put(x0 + (W - 66 - x0) * e, y0 + (70 - y0) * e);
    T.stage('moved', function (s) { [].forEach.call(s.querySelectorAll('circle'), function (c) { c.setAttribute('cx', (20 + 36 * e).toFixed(1)); c.setAttribute('cy', (40 - 18 * e).toFixed(1)); }); });
    if (k < 1) requestAnimationFrame(st);
  })();
  return 1000;
});
T.step(function () { look('after cx/cy move: '); sample(); return 600; });
T.step(function () { sample(); return 600; });
T.step(function () { sample(); pulsed('after cx/cy move: '); });
T.run();
</script>
