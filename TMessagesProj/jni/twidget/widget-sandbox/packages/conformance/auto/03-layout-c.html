<style>
.p{position:relative;width:200px;margin:0 0 3px;background:#eef}
.b{height:10px;background:#46c}
.w40{width:40px}
#tbl{display:table;width:200px}
#tbl>div{display:table-cell;height:10px}
#flowroot{display:flow-root}
#flowroot>.f{float:left;width:20px;height:24px;background:#c64}
#contents{display:flex}
#contents>span{display:contents}
#pos .abs{position:absolute;left:7px;top:5px;width:10px;height:10px;background:#c33}
#pos .ins{position:absolute;inset:0;background:#3c33}
#pos .rb{position:absolute;right:3px;bottom:2px;width:10px;height:10px;background:#33c}
.rel{position:relative;left:12px;top:3px;width:10px}
#fixed{position:fixed;left:3px;top:4px;width:2px;height:2px}
#sticky{position:sticky;top:0}
#z{height:30px}
#z .lo,#z .hi{position:absolute;top:0;left:0;width:30px;height:30px}
#z .hi{z-index:2;background:#c33}
#z .lo{z-index:1;background:#33c}
#ov{width:50px;height:20px;overflow:hidden}
#ov>div{height:60px;background:#c93}
#ovc{width:50px;height:20px;overflow:clip}
#ovc>div{height:60px;background:#c93}
#ovs{width:50px;height:20px;overflow:auto}
#ovs>div{height:60px;background:#c93}
#vis{height:20px}
#vis .under{position:absolute;inset:0;background:#9cf}
#vis .hid{position:absolute;inset:0;visibility:hidden;background:#f00}
#op{opacity:.5;width:20px}
/* stages */
.s-radius{position:absolute;left:10px;top:5px;width:60px;height:50px;border-radius:12px 25px;overflow:hidden;background:#36c}
.s-radius>div{width:60px;height:25px;background:#e83}
</style>
</head>
<body>
<div class="conf-stages">
  <div data-stage="radius" data-covers="css.box.radius css.overflow.clip"><div class="s-radius"><div></div></div></div>
</div>
<div class="conf-head">03c · Layout and box model (3/3)</div>
<div class="conf-probes">
  <div class="p" id="z"><div class="hi"></div><div class="lo"></div></div>
  <div class="p"><div id="ov"><div></div></div></div>
  <div class="p" id="vis"><div class="under"></div><div class="hid"></div></div>
  <div class="p" id="tbl"><div style="width:50px;background:#c33"></div><div style="background:#33c"></div></div>
  <div class="p" id="flowroot"><div class="f"></div></div>
  <div class="p" id="contents"><span><div class="b w40"></div><div class="b w40"></div></span></div>
  <div class="p" id="pos" style="height:30px"><div class="abs"></div><div class="ins"></div><div class="rb"></div></div>
  <div class="p" id="pos-rel"><div class="b rel" id="relb"></div></div>
  <div id="fixed"></div>
  <div class="p"><div class="b" id="sticky"></div></div>
  <div class="p"><div id="ovc"><div></div></div></div>
  <div class="p"><div id="ovs"><div></div></div></div>
  <div class="p"><div class="b" id="op"></div></div>
</div>
<div id="conf-list"></div>
<script>
var R = T.rect;
function kids(sel) { return Array.prototype.map.call(document.querySelector(sel).children, R); }
function inside(sel) { var p = R(sel); return kids(sel).map(function (k) { return { x: k.x - p.x, y: k.y - p.y, w: k.w, h: k.h, r: k.r - p.x, b: k.b - p.y }; }); }

T.step(function () {
  var tb = inside('#tbl');
  T.ok('css.display.table', 'table cells side by side, the second takes the rest', Math.abs(tb[0].w - 50) < 1 && Math.abs(tb[1].x - tb[0].r) < 1 && Math.abs(tb[1].r - 200) < 1, tb.map(function (k) { return k.x + '/' + k.w; }).join(' '));
  T.ok('css.display.other', 'display: flow-root is dropped: the float is not contained (profile 1: out)', R('#flowroot').h < 1, 'h ' + R('#flowroot').h);
  var ct = inside('#contents');
  T.ok('css.display.other', 'display: contents is dropped: the span stays one flex item', (function () { var k = document.querySelector('#contents span').children; return Math.abs(R(k[1]).x - R(k[0]).x) < 0.5; })(), '');

  var ps = inside('#pos');
  T.ok('css.position.relative-absolute', 'absolute: left/top inside a relative parent', Math.abs(ps[0].x - 7) < 0.5 && Math.abs(ps[0].y - 5) < 0.5, ps[0].x + ',' + ps[0].y);
  T.ok('css.position.relative-absolute', 'inset: 0 fills the parent', Math.abs(ps[1].w - 200) < 0.5 && Math.abs(ps[1].h - 30) < 0.5, ps[1].w + 'x' + ps[1].h);
  T.ok('css.position.relative-absolute', 'right/bottom anchor to the far edges', Math.abs(ps[2].r - 197) < 0.5 && Math.abs(ps[2].b - 28) < 0.5, ps[2].r + ',' + ps[2].b);
  var rl = R('#relb'), rp = R('#pos-rel');
  T.ok('css.position.relative-absolute', 'relative: left/top shift the box', Math.abs(rl.x - rp.x - 12) < 0.5 && Math.abs(rl.y - rp.y - 3) < 0.5, (rl.x - rp.x) + ',' + (rl.y - rp.y));
  var fx = R('#fixed');
  T.ok('css.position.fixed', 'fixed is placed against the bubble', Math.abs(fx.x - 3) < 0.5 && Math.abs(fx.y - 4) < 0.5, fx.x + ',' + fx.y);
  T.ok('css.position.sticky', 'sticky is neutralised to relative', T.cs('#sticky', 'position') !== 'sticky', T.cs('#sticky', 'position'));

  var z = R('#z');
  var top = document.elementFromPoint(z.x + 10, z.y + 10);
  T.ok('css.position.z-index', 'the higher z-index is on top', !!top && top.className === 'hi', top ? top.className : 'null');

  var ov = R('#ov');
  var hit = document.elementFromPoint(ov.x + 10, ov.y + 30);
  T.ok('css.overflow.clip', 'overflow: hidden clips hit testing', !hit || hit.parentNode !== document.getElementById('ov'), hit ? hit.id || hit.className || hit.tagName : 'null');
  T.eq('css.overflow.clip', 'overflow: hidden is computed', T.cs('#ov', 'overflow-y'), 'hidden');
  T.eq('css.overflow.clip', 'overflow: clip is computed', T.cs('#ovc', 'overflow-y'), 'clip');
  T.ok('css.overflow.scroll', 'overflow: auto is neutralised to hidden', T.cs('#ovs', 'overflow-y') === 'hidden', T.cs('#ovs', 'overflow-y'));

  var vh = R('#vis');
  var under = document.elementFromPoint(vh.x + 10, vh.y + 10);
  T.ok('css.visibility', 'visibility: hidden is skipped by hit testing', !!under && under.className === 'under', under ? under.className : 'null');
  T.ok('css.visibility', 'a hidden box keeps its size', R('#vis .hid').w === 200, '');
  T.eq('css.opacity', 'computed opacity', T.cs('#op', 'opacity'), '0.5');
});
T.run();
</script>
</body>
