<style>
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.conf-probes{font:13px/16px sans-serif}
.box{position:absolute;left:10px;top:20px;width:20px;height:20px}
#w-anim{background:#c33}
#w-css{background:#36c;animation:slide 10s linear infinite}
#w-off{left:20px;top:15px;width:40px;height:30px;background:#3a3}
#w-ease{background:#e83}
.pr{width:20px;height:4px;background:#999}
</style>
</head>
<body>
<div class="conf-stages">
  <div data-stage="animate" data-covers="anim.waapi"><div class="box" id="w-anim"></div></div>
  <div data-stage="css-control" data-covers="anim.waapi-css-control"><div class="box" id="w-css"></div></div>
  <div data-stage="offsets" data-covers="anim.waapi"><div class="box" id="w-off"></div></div>
  <div data-stage="easing" data-covers="anim.waapi"><div class="box" id="w-ease"></div></div>
</div>
<div class="conf-head">11 · Web Animations</div>
<div class="conf-probes"><div class="pr" id="p1"></div><div class="pr" id="p2"></div><div class="pr" id="p3"></div></div>
<div id="conf-list"></div>
<script>
var supported = typeof Element !== 'undefined' && typeof document.body.animate === 'function';
var fin = T.wait('anim.waapi', 'finished resolves for a 100ms animation');
var a1, a2, a3, a4, css;
T.stage('animate', function () {
  a1 = document.getElementById('w-anim').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(40px)' }], { duration: 1000, fill: 'both' });
  a1.pause(); a1.currentTime = 500;
});
T.stage('offsets', function () {
  a3 = document.getElementById('w-off').animate([{ background: '#3a3' }, { background: '#c33', offset: 0.25 }, { background: '#3a3' }], { duration: 1000, fill: 'both' });
  a3.pause(); a3.currentTime = 250;
});
T.stage('easing', function () {
  a4 = document.getElementById('w-ease').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(40px)' }], { duration: 1000, easing: 'steps(2, end)', fill: 'both' });
  a4.pause(); a4.currentTime = 600;
});
var p3 = document.getElementById('p3').animate([{ opacity: 1 }, { opacity: 0.5 }], { duration: 100 });
p3.finished.then(function () { fin.pass(); }, function (e) { fin.fail('rejected ' + e); });

T.step(function () {
  T.ok('anim.waapi', 'Element.animate returns an Animation', !!a1 && typeof a1.pause === 'function' && typeof a1.play === 'function', typeof a1);
  T.eq('anim.waapi', 'paused + currentTime: playState', a1 && a1.playState, 'paused');
  T.near('anim.waapi', 'currentTime reads back', a1 && Number(a1.currentTime), 500, 1);
  T.near('anim.waapi', 'getComputedTiming().progress', a1 && a1.effect.getComputedTiming().progress, 0.5, 0.001);
  var m = /matrix\(([^)]*)\)/.exec(T.cs('#w-anim', 'transform'));
  T.near('anim.waapi', 'the renderer applies the seeked frame (computed transform)', m ? parseFloat(m[1].split(',')[4]) : NaN, 20, 0.5);
  T.ok('anim.waapi', 'element.getAnimations() lists it', document.getElementById('w-anim').getAnimations().length === 1, String(document.getElementById('w-anim').getAnimations().length));
  T.ok('anim.waapi', 'document.getAnimations() lists script and CSS animations', document.getAnimations().length >= 4, String(document.getAnimations().length));
  var t0 = document.timeline && document.timeline.currentTime;
  T.ok('anim.waapi', 'document.timeline.currentTime is a number', typeof t0 === 'number' && t0 >= 0, String(t0));
  var p1 = document.getElementById('p1').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 10000 });
  p1.cancel();
  T.eq('anim.waapi', 'cancel() removes the animation', document.getElementById('p1').getAnimations().length, 0);
  var p2 = document.getElementById('p2').animate([{ width: '20px' }, { width: '120px' }], { duration: 1000, fill: 'forwards' });
  p2.pause(); p2.currentTime = 250;
  T.near('anim.waapi', 'a seek is visible to a layout query in the same task', T.rect('#p2').w, 45, 0.5);
  var el = document.getElementById('w-css');
  var list = el.getAnimations();
  css = list[0];
  T.ok('anim.waapi-css-control', 'a CSS animation shows up in getAnimations()', list.length === 1 && css.animationName === 'slide', list.length + ' ' + (css && css.animationName));
  if (css) { css.pause(); css.currentTime = 2500; }
  return 80;
});
T.step(function () {
  T.eq('anim.waapi-css-control', 'pause() + currentTime seek a CSS animation', css && css.playState, 'paused');
  var m = /matrix\(([^)]*)\)/.exec(T.cs('#w-css', 'transform'));
  T.near('anim.waapi-css-control', 'the renderer shows the seeked CSS frame', m ? parseFloat(m[1].split(',')[4]) : NaN, 10, 0.5);
  T.near('anim.waapi', 'a seeked width animation lays out in a later task', T.rect('#p2').w, 45, 0.5);
});
T.run({ deadline: 3000 });
</script>
<template data-ref="animate"><div style="position:absolute;left:30px;top:20px;width:20px;height:20px;background:#c33"></div></template>
<template data-ref="css-control"><div style="position:absolute;left:20px;top:20px;width:20px;height:20px;background:#36c"></div></template>
<template data-ref="offsets"><div style="position:absolute;left:20px;top:15px;width:40px;height:30px;background:#c33"></div></template>
<template data-ref="easing"><div style="position:absolute;left:30px;top:20px;width:20px;height:20px;background:#e83"></div></template>
