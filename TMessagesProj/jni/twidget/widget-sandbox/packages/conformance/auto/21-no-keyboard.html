<style>
.conf-probes{font:13px/16px sans-serif}
button,a{display:inline-block;min-width:80px;height:30px;margin:4px;font:14px/30px system-ui;text-align:center}
#btn:focus{outline:3px solid rgb(9,9,9)}
#field{width:60px}
</style>

<body>
<div class="conf-head">21 · No keyboard</div>
<div class="conf-probes">
  <button id="btn">button</button><a id="lnk" href="#t">link</a><button id="finish">Finish</button>
</div>
<div id="conf-list"></div>
<script>
['btn', 'lnk', 'finish'].forEach(function (n) { T.target(n, '#' + n); });
var keyEv = T.wait('input.keyboard', 'no keydown, keyup, keypress, beforeinput or input event reaches the widget');
var keyAct = T.wait('input.key-activation', 'Enter and Space add no clicks to a tapped button or link (one click each)');
var seen = { keydown: 0, keyup: 0, keypress: 0, beforeinput: 0, input: 0 };
Object.keys(seen).forEach(function (t) { document.addEventListener(t, function () { seen[t]++; }, true); });
// Were a key press a gesture, this privileged call would reach the host (the runner counts it).
document.addEventListener('keydown', function () { if (typeof TelegramWidget !== 'undefined') TelegramWidget.openLink('https://example.org/conformance/key'); });
var clicks = { btn: 0, lnk: 0 };
document.getElementById('btn').addEventListener('click', function () { clicks.btn++; });
document.getElementById('lnk').addEventListener('click', function (e) { clicks.lnk++; e.preventDefault(); });
document.getElementById('finish').addEventListener('click', function () {
  var total = seen.keydown + seen.keyup + seen.keypress + seen.beforeinput + seen.input;
  keyEv.result(total === 0, JSON.stringify(seen));
  keyAct.result(clicks.btn === 1 && clicks.lnk === 1, 'button ' + clicks.btn + ', link ' + clicks.lnk + ' clicks');
});
T.step(function () {
  var btn = document.getElementById('btn');
  btn.focus();
  T.ok('js.focus', 'focus() does not make :focus match in the renderer', T.color('#btn', 'outline-color') !== '9,9,9,1', T.color('#btn', 'outline-color'));
});
T.run({ awaitInput: 20000 });
</script>
</body>
