<style>
.conf-probes{font:13px/16px sans-serif}
.conf-probes button,.conf-probes a,.conf-probes summary,.tgt{display:inline-block;min-width:64px;height:28px;margin:2px;font:13px/28px sans-serif;text-align:center;vertical-align:top}
.tgt{background:#dde}
#active{background:rgb(220,220,220);border:0}
#active:active{background:rgb(10,200,10)}
#det-c{height:14px}
</style>
</head>
<body>
<div class="conf-head">16b · SDK and taps (2/3)</div>
<div class="conf-probes">
  <details id="det"><summary id="summary">summary</summary><div id="det-c">content</div></details>
  <a id="frag" href="#det">frag</a><button id="active">active</button><span class="tgt" id="dbl">dbl</span><span class="tgt" id="ctx">ctx</span><button id="kbd">kbd</button><span class="tgt" id="wheel">wheel</span><button id="finish">Finish</button>
</div>
<div id="conf-list"></div>
<script>
['summary', 'frag', 'active', 'dbl', 'ctx', 'kbd', 'wheel', 'finish'].forEach(function (n) { T.target(n, '#' + n); });

var toggle = T.wait('html.el.details', 'tapping summary opens details (toggle event)');
var frag = T.wait('html.el.a-fragment', 'tapping a #fragment link does not leave the widget');
var active = T.wait('sel.active', ':active applies while pressed', { hint: 'press and hold “active”' });
var dbl = T.wait('input.dblclick', 'a double tap on touch-action: auto reaches the widget as dblclick (the reaction stays outside the widget)');
var dblSeen = 0;
var noCtx = T.wait('input.long-press', 'no contextmenu reaches the widget from touch-action: auto (the hold or right click is the message menu)', { sandboxOnly: true });
var noKey = T.wait('input.keyboard', 'no keydown reaches the widget');
var noWheel = T.wait('input.wheel-scroll', 'no wheel event reaches the widget');
var seen = { contextmenu: 0, keydown: 0, wheel: 0 };

document.getElementById('det').addEventListener('toggle', function () { var d = document.getElementById('det'); toggle.result(d.open === true && T.rect('#det-c').h > 0, 'open ' + d.open + ' h ' + T.rect('#det-c').h); });
document.getElementById('frag').addEventListener('click', function () { setTimeout(function () { frag.result(!document.hidden, 'still here'); }, 50); });
var act = document.getElementById('active');
act.addEventListener('pointerdown', function () { setTimeout(function () { var c = T.color(act); active.result(c === '10,200,10,1', c); }, 150); });
document.getElementById('dbl').addEventListener('dblclick', function () { dblSeen++; });
document.addEventListener('contextmenu', function (e) { seen.contextmenu++; e.preventDefault(); });
document.addEventListener('keydown', function () { seen.keydown++; });
document.addEventListener('wheel', function () { seen.wheel++; });
document.getElementById('finish').addEventListener('click', function () {
  noCtx.result(seen.contextmenu === 0, seen.contextmenu + ' events');
  noKey.result(seen.keydown === 0, seen.keydown + ' events');
  noWheel.result(seen.wheel === 0, seen.wheel + ' events');
  dbl.result(dblSeen === 1, dblSeen + ' events');
});

T.run({ awaitInput: 20000 });
</script>
</body>
