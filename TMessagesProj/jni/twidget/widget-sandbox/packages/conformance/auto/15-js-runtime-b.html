<div class="conf-head">15b · JS runtime (2/3)</div>
<div id="conf-list"></div>
<script>
var S = T.sandbox ? {} : { sandboxOnly: true };
T.step(function () {
  // ───── Intl
  T.eq('js.intl', 'NumberFormat currency', new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(1234.5), '$1,234.50');
  T.eq('js.intl', 'NumberFormat ru grouping', new Intl.NumberFormat('ru-RU').format(1234.5).replace(/\s/g, ' '), '1 234,5');
  T.eq('js.intl', 'DateTimeFormat UTC', new Intl.DateTimeFormat('en-US', { timeZone: 'UTC' }).format(new Date(0)), '1/1/1970');
  T.eq('js.intl', 'PluralRules', new Intl.PluralRules('en-US').select(1) + ',' + new Intl.PluralRules('ru-RU').select(3), 'one,few');
  T.eq('js.intl', 'RelativeTimeFormat', new Intl.RelativeTimeFormat('en', { numeric: 'auto' }).format(-1, 'day'), 'yesterday');
  T.eq('js.intl', 'ListFormat', new Intl.ListFormat('en', { type: 'conjunction' }).format(['a', 'b', 'c']), 'a, b, and c');
  T.ok('js.intl', 'Collator', new Intl.Collator('en').compare('a', 'B') < 0, '');
  T.ok('js.intl', 'toLocaleString uses Intl', (1234.5).toLocaleString('en-US') === '1,234.5', (1234.5).toLocaleString('en-US'));
  T.ok('js.intl.format-to-parts', 'NumberFormat.formatToParts', (function () { var p = new Intl.NumberFormat('en-US').formatToParts(1234.5); return Array.isArray(p) && p.some(function (x) { return x.type === 'group'; }); })(), '');
  T.ok('js.intl.format-to-parts', 'DateTimeFormat.formatToParts', (function () { var p = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC' }).formatToParts(new Date(0)); return Array.isArray(p) && p.some(function (x) { return x.type === 'year' && x.value === '1970'; }); })(), '');
  T.ok('js.locale', 'navigator.language is a BCP 47 tag', /^[a-z]{2,3}(-[A-Za-z0-9]+)*$/.test(navigator.language), navigator.language);
  T.ok('js.locale', 'navigator.languages starts with navigator.language', navigator.languages && navigator.languages[0] === navigator.language, String(navigator.languages));
  // ───── crypto, built-ins, eval
  var bytes = crypto.getRandomValues(new Uint8Array(16));
  T.ok('js.crypto-random', 'getRandomValues fills the array', Array.prototype.some.call(bytes, function (b) { return b !== 0; }), '');
  T.ok('js.crypto-random', 'randomUUID is a v4 UUID', /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(crypto.randomUUID()), '');
  T.ok('js.crypto-random', 'Math.random in [0, 1)', (function () { for (var i = 0; i < 100; i++) { var r = Math.random(); if (!(r >= 0 && r < 1)) return false; } return true; })(), '');
  T.eq('js.builtins', 'TextEncoder', Array.prototype.join.call(new TextEncoder().encode('é'), ','), '195,169');
  T.eq('js.builtins', 'TextDecoder', new TextDecoder().decode(new Uint8Array([0xd0, 0xaf])), 'Я');
  var u = new URL('https://t.me/path?a=1&b=two#h');
  T.ok('js.builtins', 'URL and URLSearchParams', u.hostname === 't.me' && u.searchParams.get('b') === 'two' && u.hash === '#h' && new URLSearchParams('x=1&y=2').toString() === 'x=1&y=2', u.hostname);
  var src = { a: { b: [1, 2] } }, cl = structuredClone(src);
  T.ok('js.builtins', 'structuredClone', cl.a.b[1] === 2 && cl.a !== src.a, '');
  var ac = new AbortController(); ac.abort();
  T.ok('js.builtins', 'AbortController', ac.signal.aborted === true, '');
  T.eq('js.builtins', 'atob / btoa', atob(btoa('hi')), 'hi');
  T.eq('js.eval', 'eval', eval('1 + 2'), 3);
  T.eq('js.eval', 'new Function', new Function('a', 'return a * 2')(4), 8);
  // ───── CSS.supports from the profile (D23)
  T.eq('js.css-supports', 'CSS.supports("display", "flex")', CSS.supports('display', 'flex'), true);
  T.eq('js.css-supports', 'CSS.supports rejects an invalid value', CSS.supports('display', 'no-such-value'), false);
  T.eq('js.css-supports', 'CSS.supports("transform", "rotateY(10deg)") is false: 3D is out', CSS.supports('transform', 'rotateY(10deg)'), false, S);
  T.eq('js.css-supports', 'CSS.supports("(display: flex) and (gap: 1px)")', CSS.supports('(display: flex) and (gap: 1px)'), true);
  T.eq('js.css-supports', 'CSS.escape', CSS.escape('a b'), 'a\\ b');
  T.ok('js.visibility', 'document is visible', document.hidden === false && document.visibilityState === 'visible', document.visibilityState);
  T.ok('js.libraries', 'a Chart.js CDN script is an external script and is not run (profile 1: out)', typeof Chart === 'undefined', typeof Chart, S);
  T.ok('js.libraries', 'a D3 CDN script is not run either', typeof d3 === 'undefined', typeof d3, S);
});
