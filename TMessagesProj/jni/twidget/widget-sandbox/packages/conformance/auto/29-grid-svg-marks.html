<style>

#bd{position:relative;max-width:264px;margin:auto;aspect-ratio:1}

<body>
<div class="conf-head">29 · 3×3 board with SVG marks</div>
<div class="conf-probes"><div id="bd"><div id="g"></div><svg viewBox="0 0 300 300"><path id="gr" d="M100 8v284M200 8v284M8 100h284M8 200h284"/></svg></div></div>
<div id="conf-list"></div>
<script>
// A tic-tac-toe board (corpus/bot-demos/04-tic-tac-toe), built as it builds it: nine buttons appended to the grid, a
// move first shows a faded ghost mark, then the mark that draws itself in (stroke-dashoffset). Seen on clients after
// moves in cells 4 and 5 (0-based): marks at full cell size in the middle column at the top and the bottom, or the first
// one in the wrong column.
var M = { x: '<path pathLength="1" d="M6.5 6.5l11 11"/><path pathLength="1" d="M17.5 6.5l-11 11"/>', o: '<circle pathLength="1" cx="12" cy="12" r="6.5" transform="rotate(-90 12 12)"/>' };
var mk = function (m, c) { return '<svg viewBox="0 0 24 24" class="m' + m + ' ' + c + '">' + M[m] + '</svg>'; };
var R = T.rect, cells = [], B;
for (var i = 0; i < 9; i++) cells.push(document.getElementById('g').appendChild(document.createElement('button')));
var px = function (v) { return Math.round(v * 10) / 10; };
// Cell i's third of the board as it was before any mark: [x, y, w, h] from the board's top left.
var third = function (i) { var w = B.w / 3, h = B.h / 3; return [i % 3 * w, (i / 3 | 0) * h, w, h]; };
function thirds(name) {
  var bad = [];
  cells.forEach(function (c, i) {
    var r = R(c), t = third(i), g = [r.x - B.x, r.y - B.y, r.w, r.h];
    if (g.some(function (v, k) { return Math.abs(v - t[k]) > 1; })) bad.push(i + ' at ' + g.map(px).join(','));
  });
  T.ok('css.display.grid', name, !bad.length, bad.length ? 'cells x,y,w,h: ' + bad.join('; ') + ' (a third is ' + px(B.w / 3) + ')' : '');
}
T.step(function () {
  B = R('#bd');
  var w = Math.min(264, R('.conf-probes').w);
  T.ok('css.box.aspect-ratio', 'the board is square at its max-width (aspect-ratio: 1, max-width: 264px)', Math.abs(B.w - w) < 0.5 && Math.abs(B.h - w) < 0.5, px(B.w) + 'x' + px(B.h) + ', want ' + px(w));
  thirds('nine buttons take equal thirds of the board (grid-template: repeat(3,1fr)/repeat(3,1fr))');
  cells[4].innerHTML = mk('x', 'gh');
  return 300;
});
T.step(function () { cells[4].innerHTML = mk('x', 'd'); return 500; });
T.step(function () {
  thirds('after a mark in cell 4: the cells keep equal thirds');
  cells[5].innerHTML = mk('o', 'gh');
  return 300;
});
T.step(function () { cells[5].innerHTML = mk('o', 'd'); return 600; });
T.step(function () {
  thirds('after marks in cells 4 and 5: the cells keep equal thirds');
  var at = [], size = [];
  [4, 5].forEach(function (i) {
    var m = R(cells[i].firstChild), t = third(i), dx = m.x - B.x + m.w / 2 - t[0] - t[2] / 2, dy = m.y - B.y + m.h / 2 - t[1] - t[3] / 2;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) at.push(i + ': off its cell\'s centre by ' + px(dx) + ',' + px(dy));
    if (Math.abs(m.w - 0.58 * t[2]) > 1 || Math.abs(m.h - 0.58 * t[3]) > 1) size.push(i + ': ' + px(m.w) + 'x' + px(m.h) + ', want ' + px(0.58 * t[2]));
  });
  T.ok('css.display.grid', 'each mark is centred in its own cell (place-items: center)', !at.length, at.join('; '));
  T.ok('css.box.size', 'each mark is 58 % of its cell (width/height: 58% of the button)', !size.length, size.join('; '));
});
T.run();
</script>
