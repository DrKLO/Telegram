<div class="conf-head">16c · SDK and taps (3/3)</div>
<div class="conf-probes">
  <div id="tp"></div>
</div>
<div id="conf-list"></div>
<script>
var TW = typeof TelegramWidget !== 'undefined' ? TelegramWidget : null;
var S = T.sandbox ? {} : { sandboxOnly: true };

T.step(function () {
  T.ok('tw.ready', 'TelegramWidget.ready()', !!TW && typeof TW.ready === 'function' && (TW.ready(), true), '', S);
  var called = null;
  if (TW) TW.onTheme(function (t) { if (called === null) called = t; });
  T.ok('tw.theme', 'theme is "light" or "dark" and onTheme calls back at once', !!TW && /^(light|dark)$/.test(TW.theme) && called === TW.theme, TW ? TW.theme + ' / ' + called : 'no SDK', S);
  T.ok('tw.theme-params', 'themeParams has the palette (bg_color, text_color, …)', !!TW && !!TW.themeParams && typeof TW.themeParams.bg_color === 'string', '', S);
  T.ok('tw.theme-params', '--tg-theme-bg-color is defined for CSS', T.color('#tp') !== '1,2,3,1', T.color('#tp'), S);
  T.ok('tw.open-telegram-link', 'openTelegramLink exists', !!TW && typeof TW.openTelegramLink === 'function', '', S);
  T.ok('tw.haptic', 'haptic feedback exists', !!TW && (typeof TW.HapticFeedback === 'object' || typeof TW.haptic === 'function'), '', S);
  T.ok('tw.profile', 'TelegramWidget.profile is a positive integer', !!TW && Number.isInteger(TW.profile) && TW.profile >= 1, TW ? String(TW.profile) : '', S);
  T.ok('tw.profile', 'isProfileAtLeast(1) is true, isProfileAtLeast(999) false', !!TW && typeof TW.isProfileAtLeast === 'function' && TW.isProfileAtLeast(1) === true && TW.isProfileAtLeast(999) === false, '', S);
  T.ok('tw.send-message', 'sendMessage is not in the SDK', !!TW && typeof TW.sendMessage === 'undefined', '', S);
  // SDK v1 contract (docs/sdk-v1.md): argument checks throw TypeError synchronously; valid calls outside a press are dropped by the host.
  var throwsType = function (fn) { try { fn(); return false; } catch (e) { return !!e && e.name === 'TypeError'; } };
  var noThrow = function (fn) { try { fn(); return true; } catch (e) { return false; } };
  T.ok('tw.theme', 'colorScheme is "light" or "dark" and equals theme', !!TW && /^(light|dark)$/.test(TW.colorScheme) && TW.colorScheme === TW.theme, TW ? String(TW.colorScheme) : '', S);
  T.ok('tw.is-active', 'isActive is true while the widget is on screen', !!TW && TW.isActive === true, TW ? String(TW.isActive) : '', S);
  T.ok('tw.events', 'onEvent and offEvent exist; unknown types and non-functions are ignored', !!TW && typeof TW.onEvent === 'function' && typeof TW.offEvent === 'function' && noThrow(function () { TW.onEvent('noSuchEvent', function () {}); TW.onEvent('themeChanged', 42); }), '', S);
  T.ok('tw.theme-params', 'themeParams carries every key as #rrggbb', !!TW && !!TW.themeParams && ['bg_color', 'text_color', 'hint_color', 'link_color', 'button_color', 'button_text_color', 'secondary_bg_color', 'accent_text_color', 'subtitle_text_color', 'destructive_text_color', 'section_bg_color', 'section_header_text_color', 'section_separator_color', 'header_bg_color', 'bottom_bar_bg_color'].every(function (k) { return /^#[0-9a-f]{6}$/.test(TW.themeParams[k]); }), '', S);
  T.ok('tw.open-telegram-link', 'openTelegramLink accepts any t.me / telegram.me path', !!TW && typeof TW.openTelegramLink === 'function' && ['https://t.me/telegram', 'https://t.me/s/durov/1', 'https://telegram.me/+abc', 'https://t.me/addstickers/x'].every(function (u) { return noThrow(function () { TW.openTelegramLink(u); }); }), '', S);
  T.ok('tw.open-telegram-link', 'openTelegramLink rejects other hosts and tg: with TypeError', !!TW && typeof TW.openTelegramLink === 'function' && ['https://example.org/', 'tg://resolve?domain=telegram', 'http://t.me/telegram'].every(function (u) { return throwsType(function () { TW.openTelegramLink(u); }); }), '', S);
  T.ok('tw.haptic', 'haptic methods return HapticFeedback for chaining', !!TW && !!TW.HapticFeedback && TW.HapticFeedback.impactOccurred('light') === TW.HapticFeedback && TW.HapticFeedback.notificationOccurred('success') === TW.HapticFeedback && TW.HapticFeedback.selectionChanged() === TW.HapticFeedback, '', S);
  // A burst of 20 haptics in one task: the host passes the first 5 (the runner counts them on the bridge).
  if (TW && TW.HapticFeedback) for (var hb = 0; hb < 20; hb++) { try { TW.HapticFeedback.impactOccurred('rigid'); } catch (e) {} }
  T.ok('tw.haptic', 'an unknown style or type throws TypeError', !!TW && !!TW.HapticFeedback && throwsType(function () { TW.HapticFeedback.impactOccurred('huge'); }) && throwsType(function () { TW.HapticFeedback.notificationOccurred('oops'); }), '', S);
});
T.run({ awaitInput: 20000 });
</script>
