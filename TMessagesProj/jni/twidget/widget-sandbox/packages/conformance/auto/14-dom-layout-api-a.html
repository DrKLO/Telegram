<body>
<div class="conf-head">14a · DOM and layout APIs (1/2)</div>
<div class="conf-probes">
  <div id="host"></div>
  <div id="ev-outer"><button id="ev-btn">ev</button></div>
</div>
<div id="conf-list"></div>
<script>
var R = T.rect;

T.step(function () {
  var host = document.getElementById('host');
  var a = document.createElement('div');
  a.id = 'dyn-a'; a.textContent = 'created'; a.style.height = '12px';
  host.appendChild(a);
  T.ok('js.dom.core', 'createElement + appendChild renders', R(a).h === 12 && R(a).w === 200, R(a).w + 'x' + R(a).h);
  host.insertAdjacentHTML('beforeend', '<p id="dyn-b" style="margin:0;height:10px" class="x y">parsed <b>html</b></p>');
  var b = document.getElementById('dyn-b');
  T.ok('js.dom.core', 'insertAdjacentHTML is parsed in the sandbox and rendered', !!b && R(b).h === 10 && R(b).y >= R(a).b - 0.5, b ? R(b).y + '' : 'missing');
  var c = document.createElement('span');
  host.insertBefore(c, a); c.textContent = 'first';
  T.ok('js.dom.core', 'insertBefore orders the nodes', R(c).y < R(a).y, R(c).y + ' < ' + R(a).y);
  b.classList.toggle('y'); b.dataset.k = 'v';
  T.ok('js.dom.core', 'classList and dataset', b.className === 'x' && b.getAttribute('data-k') === 'v', b.className + ' ' + b.getAttribute('data-k'));
  var clone = b.cloneNode(true); clone.id = 'dyn-c'; host.appendChild(clone);
  T.ok('js.dom.core', 'cloneNode(true) renders a deep copy', R(clone).h === 10 && clone.querySelector('b') !== null, '');
  host.removeChild(clone);
  T.ok('js.dom.core', 'a removed node has no box', R(clone).w === 0 && R(clone).h === 0, R(clone).w + 'x' + R(clone).h);
  host.innerHTML = '<i id="dyn-i">replaced</i>';
  T.ok('js.dom.core', 'innerHTML replaces the children', host.children.length === 1 && R('#dyn-i').w > 10, host.children.length + '');

  var s = document.getElementById('dyn-i').style;
  s.display = 'inline-block'; s.width = '33px'; s.setProperty('background-color', 'rgb(1, 2, 3)');
  T.ok('js.dom.style', 'element.style and setProperty', R('#dyn-i').w === 33 && T.color('#dyn-i') === '1,2,3,1', R('#dyn-i').w + ' ' + T.color('#dyn-i'));
  s.cssText = 'display:inline-block;width:21px';
  T.ok('js.dom.style', 'style.cssText replaces the declarations', R('#dyn-i').w === 21 && T.color('#dyn-i') === '0,0,0,0', R('#dyn-i').w + ' ' + T.color('#dyn-i'));
  s.removeProperty('width');
  T.ok('js.dom.style', 'removeProperty', R('#dyn-i').w !== 21, String(R('#dyn-i').w));

  var order = [];
  var outer = document.getElementById('ev-outer'), btn = document.getElementById('ev-btn');
  outer.addEventListener('ping', function () { order.push('capture'); }, true);
  btn.addEventListener('ping', function (e) { order.push('target:' + e.detail.n); e.preventDefault(); });
  outer.addEventListener('ping', function () { order.push('bubble'); });
  var once = 0; btn.addEventListener('ping', function () { once++; }, { once: true });
  var ev = new CustomEvent('ping', { bubbles: true, cancelable: true, detail: { n: 7 } });
  var res = btn.dispatchEvent(ev);
  btn.dispatchEvent(new CustomEvent('ping', { bubbles: false, detail: { n: 8 } }));
  T.eq('js.dom.events', 'capture, target, bubble order and detail', order.slice(0, 3).join(','), 'capture,target:7,bubble');
  T.ok('js.dom.events', 'preventDefault: dispatchEvent returns false, defaultPrevented', res === false && ev.defaultPrevented === true, res + ' ' + ev.defaultPrevented);
  T.eq('js.dom.events', 'once listener runs once', once, 1);
  var stopped = [];
  outer.addEventListener('pong', function () { stopped.push('outer'); });
  btn.addEventListener('pong', function (e) { stopped.push('btn'); e.stopPropagation(); });
  btn.dispatchEvent(new Event('pong', { bubbles: true }));
  T.eq('js.dom.events', 'stopPropagation', stopped.join(','), 'btn');
});
T.run({ deadline: 2500 });
</script>
