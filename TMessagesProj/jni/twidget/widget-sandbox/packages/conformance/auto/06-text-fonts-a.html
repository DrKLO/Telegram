<style>
@font-face{font-family:"Conformance Face";src:url(data:font/woff2;base64,d09GMgABAAAAAA) format("woff2")}
.conf-probes{font:13px/16px sans-serif;color:#111}
.p{position:relative;width:300px;margin:0 0 2px}
.i{display:inline-block;white-space:nowrap}
.mono{font-family:monospace}.uimono{font-family:ui-monospace}.serif{font-family:serif}.sans{font-family:sans-serif}.sys{font-family:system-ui}.rounded{font-family:ui-rounded,sans-serif}
.named{font-family:"Courier New","Courier"}
.named2{font-family:"Times New Roman",sans-serif}
.face{font-family:"Conformance Face",monospace}

<body>
<div class="conf-head">06a · Text and fonts (1/3)</div>
<div class="conf-probes">
  <div class="p">
    <span class="i mono" id="mono-i">iiiiii</span><span class="i mono" id="mono-m">MMMMMM</span>
    <span class="i uimono" id="uimono-i">iiiiii</span><span class="i uimono" id="uimono-m">MMMMMM</span>
    <span class="i serif" id="serif">Hamburgefonstiv</span><span class="i sans" id="sans">Hamburgefonstiv</span><span class="i sys" id="sys">Hamburgefonstiv</span><span class="i rounded" id="rounded">Rr</span>
  </div>
  <div class="p">
    <span class="i named" id="named-i">iiiiii</span><span class="i named" id="named-m">MMMMMM</span><span class="i named2" id="named2">Hamburgefonstiv</span>
    <span class="i face" id="face-i">iiiiii</span><span class="i face" id="face-m">MMMMMM</span>
  </div>
  <div class="p">
    <span class="i" id="fs" style="font-size:20px;line-height:normal">x</span><span class="i" id="n" style="font-weight:400">Bold text</span><span class="i" id="b" style="font-weight:700">Bold text</span><span class="i" id="it" style="font-style:italic">i</span><span class="i" id="sh" style="font:italic 700 15px/19px serif">f</span>
    <div id="lh">x</div>
  </div>
  <div class="p">
    <span class="i tab" id="tab1">1111</span><span class="i tab" id="tab0">0000</span><span class="i tnum" id="tnum1">1111</span><span class="i tnum" id="tnum0">0000</span>
  </div>
</div>
<div id="conf-list"></div>
<script>
var R = T.rect, CS = T.cs;
var W = function (s) { return R(s).w; };
T.step(function () {
  T.near('css.font.generic', 'monospace: i and M have the same advance', W('#mono-i'), W('#mono-m'), 0.5);
  T.ok('css.font.generic', 'computed font-family keeps the generic name', /monospace/.test(CS('#mono-i', 'font-family')), CS('#mono-i', 'font-family'));
  T.near('css.font.ui-families', 'ui-monospace: i and M have the same advance', W('#uimono-i'), W('#uimono-m'), 0.5, { sandboxOnly: true });
  T.ok('css.font.ui-families', 'the validator adds a generic fallback (ui-monospace → …, monospace)', /,\s*monospace/.test(CS('#uimono-i', 'font-family')), CS('#uimono-i', 'font-family'), { sandboxOnly: true });
  T.ok('css.font.generic', 'serif and sans-serif are different faces', Math.abs(W('#serif') - W('#sans')) > 1, W('#serif') + ' vs ' + W('#sans'));
  T.ok('css.font.generic', 'system-ui renders', W('#sys') > 40, W('#sys') + '');
  T.ok('css.font.ui-families', 'ui-rounded with a fallback renders', W('#rounded') > 5, W('#rounded') + '');

  T.ok('css.font.named', 'a named family is dropped: "Courier New" alone is not monospace', Math.abs(W('#named-i') - W('#named-m')) > 2, W('#named-i') + ' vs ' + W('#named-m'));
  T.ok('css.font.named', 'a named family is dropped from the list ("Times New Roman", sans-serif → sans-serif)', !/Times/.test(CS('#named2', 'font-family')), CS('#named2', 'font-family'));
  T.near('css.font.face', '@font-face is dropped: the fallback monospace is used', W('#face-i'), W('#face-m'), 0.5);

  T.ok('css.font.basic', 'font-size: 20px gives a taller line', R('#fs').h >= 20, R('#fs').h + '');
  T.ok('css.font.basic', 'font-weight: 700 is wider than 400', W('#b') > W('#n') + 1, W('#b') + ' vs ' + W('#n'));
  T.eq('css.font.basic', 'font-style: italic', CS('#it', 'font-style'), 'italic');
  T.ok('css.font.basic', 'font shorthand', CS('#sh', 'font-style') === 'italic' && CS('#sh', 'font-weight') === '700' && CS('#sh', 'font-size') === '15px' && CS('#sh', 'line-height') === '19px', CS('#sh', 'font-weight') + ' ' + CS('#sh', 'font-size'));
  T.near('css.font.basic', 'line-height: 30px', R('#lh').h, 30, 0.5);

  T.near('css.font.variant-numeric', 'tabular-nums: 1111 as wide as 0000', W('#tab1'), W('#tab0'), 0.5);
  T.near('css.font.variant-numeric', 'font-feature-settings "tnum"', W('#tnum1'), W('#tnum0'), 0.5);
});
T.run();
</script>
