<script>
var C = function (sel, pseudo) { return T.color(sel, 'color', pseudo); };
var red = function (n) { return n + ',0,0,1'; };
T.step(function () {
  T.eq('sel.basic', 'type selector', C('#type'), red(1));
  T.eq('sel.basic', 'class selector', C('#cls'), red(2));
  T.eq('sel.basic', 'id selector', C('#idp'), red(3));
  T.eq('sel.basic', 'universal selector', C('#u'), red(4));
  T.eq('sel.basic', '[attr]', C('#a1'), red(5));
  T.eq('sel.basic', '[attr=v]', C('#a2'), red(6));
  T.eq('sel.basic', '[attr^=v]', C('#a3'), red(7));
  T.eq('sel.basic', '[attr$=v]', C('#a4'), red(8));
  T.eq('sel.basic', '[attr*=v]', C('#a5'), red(9));
  T.eq('sel.basic', '[attr~=v]', C('#a6'), red(10));
  T.eq('sel.basic', '[attr|=v]', C('#a7'), red(11));
  T.eq('sel.basic', 'descendant combinator', C('#c1'), red(12));
  T.eq('sel.basic', 'child combinator', C('#c2'), red(13));
  T.eq('sel.basic', 'adjacent sibling +', C('#c3'), red(14));
  T.eq('sel.basic', 'general sibling ~', C('#c4'), red(15));
  T.eq('sel.basic', 'selector list', C('#c5'), red(16));
});
T.run();
