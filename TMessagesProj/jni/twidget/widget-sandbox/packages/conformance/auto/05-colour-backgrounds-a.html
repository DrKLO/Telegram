  <div id="c-named" style="background:rebeccapurple;width:4px;height:4px"></div>
  <div id="c-hex4" style="background:#f008;width:4px;height:4px"></div>
  <div id="c-hsl" style="background:hsl(120,100%,25%);width:4px;height:4px"></div>
  <div id="c-cur" style="color:rgb(0,0,200);border:1px solid currentColor;width:4px;height:4px"></div>
  <div id="c-tr" style="background:transparent;width:4px;height:4px"></div>
  <div id="c-ld" style="background:light-dark(rgb(1,2,3),rgb(4,5,6));width:4px;height:4px"></div>
  <div id="c-mix" style="background:color-mix(in srgb,rgb(200,0,0) 50%,rgb(0,0,200));width:4px;height:4px"></div>
</div>
<div id="conf-list"></div>
<script>
var C = T.color;
T.step(function () {
  T.eq('css.color.basic', 'named colour', C('#c-named'), '102,51,153,1');
  T.eq('css.color.basic', '#rgba hex', C('#c-hex4'), '255,0,0,0.53');
  T.eq('css.color.basic', 'hsl()', C('#c-hsl'), '0,128,0,1');
  T.eq('css.color.basic', 'currentColor', C('#c-cur', 'border-top-color'), '0,0,200,1');
  T.eq('css.color.basic', 'transparent', C('#c-tr'), '0,0,0,0');
  var dark = (typeof TelegramWidget !== 'undefined' ? TelegramWidget.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
  T.eq('css.color.light-dark', 'light-dark() picks the chat theme', C('#c-ld'), dark ? '4,5,6,1' : '1,2,3,1');

});
T.run();
</script>
