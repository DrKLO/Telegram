<div class="conf-head">25b · Requests and copyText (API)</div>
<div id="conf-list"></div>
<script>
var TW = typeof TelegramWidget !== 'undefined' ? TelegramWidget : null;
var S = T.sandbox ? {} : { sandboxOnly: true };
var CODES = ['NOT_ALLOWED', 'BUSY', 'RATE_LIMITED', 'TIMEOUT', 'FAILED', 'INVALID_ANSWER'];
var fn = function (k) { return !!TW && typeof TW[k] === 'function'; };
var throwsType = function (f) { try { f(); return false; } catch (e) { return !!e && e.name === 'TypeError'; } };
var undef = function (f) { try { return f() === undefined; } catch (e) { return false; } };
T.step(function () {
  var bad = [undefined, null, '', 'x'.repeat(65), 'é'.repeat(33), 5, {}, '\ud800'];
  var wrong = fn('request') ? bad.filter(function (v) { return !throwsType(function () { TW.request(v); }); }) : bad;
  T.ok('tw.request', 'request throws TypeError at once for data that is not 1–64 bytes of text', fn('request') && !wrong.length, wrong.map(function (v) { return typeof v === 'string' ? v.length + ' chars' : String(v); }).join(', '), S);
  var badText = [undefined, null, '', 'x'.repeat(257), 5, '\ud800'];
  var wrongText = fn('copyText') ? badText.filter(function (v) { return !throwsType(function () { TW.copyText(v); }); }) : badText;
  T.ok('tw.copy-text', 'copyText throws TypeError for anything but 1–256 characters of text', fn('copyText') && !wrongText.length, wrongText.map(String).join(', '), S);
  T.ok('tw.copy-text', 'copyText outside a tap returns undefined and throws nothing (the client drops it)', fn('copyText') && undef(function () { return TW.copyText('not copied: no tap'); }), '', S);
  T.ok('tw.watch-public-data', 'watchPublicData and unwatchPublicData return undefined and may be called again', fn('watchPublicData') && fn('unwatchPublicData') && [1, 1, 0, 0, 1, 0].every(function (w) { return undef(function () { return w ? TW.watchPublicData() : TW.unwatchPublicData(); }); }), '', S);
});
// A request without a tap: where the message may ask in the background (the original in the private chat with the
// bot) it goes out and the test bot answers "conf:a25" with "ok"; everywhere else it is refused. Either way it settles.
var settles = T.wait('tw.request', 'a request without a tap settles: { result } (frozen) or a WidgetRequestError with its code', S);
T.step(function () {
  var p;
  try { p = fn('request') && TW.request('conf:a25'); } catch (e) { return settles.fail('threw ' + e); }
  if (!p || typeof p.then !== 'function') return settles.fail('not a promise');
  p.then(function (a) { settles.result(!!a && Object.isFrozen(a) && (a.result === null || typeof a.result === 'string'), 'resolved ' + JSON.stringify(a)); },
    function (e) { settles.result(!!e && e.name === 'WidgetRequestError' && CODES.indexOf(e.code) >= 0 && typeof e.message === 'string', 'rejected ' + (e && e.code)); });
});
T.run({ deadline: 20000 });
</script>
