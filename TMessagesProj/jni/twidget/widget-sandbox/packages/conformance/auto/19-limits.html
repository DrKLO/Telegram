<div class="conf-head">19 · Limits</div>
<div class="conf-probes">
  <div class="t" id="t30"></div><div class="t" id="cjk-small"></div><div class="t" id="cjk-big"></div>
  <span id="big-attr">big data-*</span> <span id="attr-ok" data-label="ok"></span> <span id="attr-cls" class="cls"></span>
  <img id="img-ok" alt="" style="width:6px" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAQAAQMAAABF07nAAAAAA1BMVEUqiuDzxmxVAAAAlklEQVR42u3BAQEAAACCIP+vbkhAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADvBgQeAAEN3jhkAAAAAElFTkSuQmCC"><img id="img-big" alt="" style="width:6px" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAEAAAQAAQMAAACqEdL+AAAAA1BMVEUqiuDzxmxVAAAAl0lEQVR42u3BAQEAAACCIP+vbkhAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAArwYIHgABJD3WogAAAABJRU5ErkJggg==">
</div>

<script>
var S = T.sandbox ? {} : { sandboxOnly: true };
var rep = function (s, n) { return new Array(n + 1).join(s); };
function onImage(id, name, want, opts) {
  var h = T.wait('limit.image-pixels', name, opts), el = document.getElementById(id);
  var judge = function (ev) { var n = el.naturalWidth; h.result(want(ev.type, n), ev.type + ', naturalWidth ' + n); };
  el.addEventListener('load', judge);
  el.addEventListener('error', judge);
  if (el.complete && el.naturalWidth) judge({ type: 'load' });
}
onImage('img-ok', 'a 1024 \u00d7 1024 data: image decodes', function (t, n) { return t === 'load' && n === 1024; });
onImage('img-big', 'a 1025 \u00d7 1024 data: image is the 48 px placeholder', function (t, n) { return t === 'load' && n === 48; }, S);
T.step(function () {
  // One long word each: the strict churn limit charges per word, not per character.
  document.getElementById('t30').textContent = rep('a', 30 * 1024);
  T.ok('limit.text-node', 'a 30 K text node renders', T.rect('#t30').h > 0, String(T.rect('#t30').h));
  document.getElementById('cjk-small').textContent = rep('漢', 3000);
  document.getElementById('cjk-big').textContent = rep('字', 6000);
  T.ok('limit.text-budget', '3000 CJK characters render', T.rect('#cjk-small').h > 0, String(T.rect('#cjk-small').h));
  T.ok('limit.text-budget', 'past 8192 complex-script units in the document the text is refused', T.rect('#cjk-big').h === 0, String(T.rect('#cjk-big').h), S);
  document.getElementById('big-attr').setAttribute('data-big', rep('z', 6 * 1024));
  T.ok('limit.attribute', 'a 6 K data-* attribute reaches the renderer', T.color('#big-attr', 'color') === '9,9,9,1', T.color('#big-attr', 'color'));
  T.ok('behaviour.policy-strict', 'attr() of a text attribute (data-*) works', T.rect('#attr-ok').w > 5, String(T.rect('#attr-ok').w));
  T.ok('behaviour.policy-strict', 'attr() of a non-text attribute (class) is dropped', T.rect('#attr-cls').w === 0, String(T.rect('#attr-cls').w), S);
  var made = 0, err = null, ids = [];
  try { for (var i = 0; i < 400; i++) { ids.push(setTimeout(function () {}, 60000)); made++; } } catch (e) { err = e; }
  for (var j = 0; j < ids.length; j++) clearTimeout(ids[j]);
  T.ok('limit.timers', 'the 65th live timer throws RangeError', !!err && err.name === 'RangeError' && made >= 50 && made <= 64, made + ' made, ' + (err && err.name), S);
  var cx = document.createElement('canvas').getContext('2d'), drawn = 0, cerr = null;
  try { for (var k = 0; k < 4001; k++) { cx.fillRect(k, 0, 1, 1); drawn++; } } catch (e) { cerr = e; }
  T.ok('limit.canvas-commands', 'the 4001st command for one canvas in one task throws RangeError', !!cerr && cerr.name === 'RangeError' && drawn === 4000, drawn + ' drawn, ' + (cerr && cerr.name), S);
});
T.run({ deadline: 4000 });
</script>
