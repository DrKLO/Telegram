<!doctype html>
<html><head><meta charset="utf-8"><title>stress: Emoji · 50 emoji</title>
<!-- stress {"id":"emoji/50","load":"emoji","level":0,"param":"emoji","value":50,"unit":"emoji"} -->
<style>body{margin:0;font:12px system-ui,sans-serif}#h{padding:5px 8px;color:var(--tg-theme-hint-color);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}#f{position:relative;height:300px;overflow:hidden}div.r{font:13px/1.2 system-ui,sans-serif;white-space:nowrap}.e{position:absolute;font:20px system-ui;background:#fffc}</style>
</head><body><div id="h">Emoji · 50 emoji</div><div id="f"></div>
<script>
var ID="emoji/50",LV=0,N=50,F=document.getElementById('f'),W=F.clientWidth||300;
function mk(n,c){for(var a=[],i=0;i<n;i++){var d=document.createElement('div');d.className=c;F.appendChild(d);a.push(d)}return a}
var E=Array.from('😀😂🥰😎🤖👾🎉🔥⭐🍕🚀🌈🐱🐶🦊🍀⚽🎵💡📦');for(var j=0;j*32<N;j++){var s='';for(var i=0;i<32&&j*32+i<N;i++)s+=E[(j*7+i)%E.length];mk(1,'r')[0].textContent=s}var a=mk(8,'e');a.forEach(function(d,i){d.style.left=i*34+4+'px';d.style.top='250px';d.textContent=E[i]});
function step(t){for(var i=0;i<8;i++)a[i].firstChild.data=E[((t/80|0)+i*3)%E.length]}
(function(){var de=document.documentElement,h=document.getElementById('h'),lb=h.textContent,n=0,t0=0,lt=0,lp=0,mx=0,j=0,fs=0,fc=0,fps=0;
function pub(st,t){de.setAttribute('data-stress',JSON.stringify({v:1,id:ID,level:LV,value:N,status:st,t:Math.round(t),frames:n,fps:fps,maxGap:Math.round(mx),jank:j}));mx=0}
function loop(t){if(!t0)t0=lt=lp=fs=t;var g=t-lt;lt=t;if(g>mx)mx=g;if(g>50)j++;n++;fc++;if(t-fs>=1000){fps=Math.round(fc*1000/(t-fs));fc=0;fs=t}
if(typeof step=='function')step(t-t0);
if(t-lp>=500){lp=t;h.firstChild.data=lb+' \u00b7 '+fps+' fps';pub('running',t-t0)}requestAnimationFrame(loop)}
pub('setup',0);requestAnimationFrame(loop)})();
</script>
</body></html>
