<!doctype html>
<html><head><meta charset="utf-8"><title>stress: SVG path, morphing · 50 segments</title>
<!-- stress {"id":"svg-path/50","load":"svg-path","level":0,"param":"segments","value":50,"unit":"segments"} -->
<style>body{margin:0;font:12px system-ui,sans-serif}#h{padding:5px 8px;color:var(--tg-theme-hint-color);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}#f{position:relative;height:300px;overflow:hidden}svg{display:block;width:300px;height:300px}path{fill:none;stroke:#4a90e2;stroke-width:1.5}</style>
</head><body><div id="h">SVG path, morphing · 50 segments</div><div id="f"></div>
<script>
var ID="svg-path/50",LV=0,N=50,F=document.getElementById('f'),W=F.clientWidth||300;
function mk(n,c){for(var a=[],i=0;i<n;i++){var d=document.createElement('div');d.className=c;F.appendChild(d);a.push(d)}return a}
var ns='http://www.w3.org/2000/svg',sv=document.createElementNS(ns,'svg');sv.setAttribute('viewBox','0 0 300 300');var pa=document.createElementNS(ns,'path');sv.appendChild(pa);F.appendChild(sv);
function step(t){var d='M0 150';for(var i=1;i<=N;i++)d+='L'+(i*300/N).toFixed(1)+' '+(150+Math.sin(i*.3+t/300)*120).toFixed(1);pa.setAttribute('d',d)}
(function(){var de=document.documentElement,h=document.getElementById('h'),lb=h.textContent,n=0,t0=0,lt=0,lp=0,mx=0,j=0,fs=0,fc=0,fps=0;
function pub(st,t){de.setAttribute('data-stress',JSON.stringify({v:1,id:ID,level:LV,value:N,status:st,t:Math.round(t),frames:n,fps:fps,maxGap:Math.round(mx),jank:j}));mx=0}
function loop(t){if(!t0)t0=lt=lp=fs=t;var g=t-lt;lt=t;if(g>mx)mx=g;if(g>50)j++;n++;fc++;if(t-fs>=1000){fps=Math.round(fc*1000/(t-fs));fc=0;fs=t}
if(typeof step=='function')step(t-t0);
if(t-lp>=500){lp=t;h.firstChild.data=lb+' \u00b7 '+fps+' fps';pub('running',t-t0)}requestAnimationFrame(loop)}
pub('setup',0);requestAnimationFrame(loop)})();
</script>
</body></html>
