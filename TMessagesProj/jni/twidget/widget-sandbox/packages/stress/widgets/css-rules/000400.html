<!doctype html>
<html><head><meta charset="utf-8"><title>stress: CSS rules · 400 rules</title>
<!-- stress {"id":"css-rules/400","load":"css-rules","level":2,"param":"rules","value":400,"unit":"rules"} -->
<style>body{margin:0;font:12px system-ui,sans-serif}#h{padding:5px 8px;color:var(--tg-theme-hint-color);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}#f{position:relative;height:300px;overflow:hidden}.g{display:flex;gap:2px;margin:2px}.g i{display:block;width:30px;height:30px;background:#ccc}</style>
</head><body><div id="h">CSS rules · 400 rules</div><div id="f"></div>
<script>
var ID="css-rules/400",LV=2,N=400,F=document.getElementById('f'),W=F.clientWidth||300;
function mk(n,c){for(var a=[],i=0;i<n;i++){var d=document.createElement('div');d.className=c;F.appendChild(d);a.push(d)}return a}
var css='';for(var i=0;i<N-5;i++){css+='.k'+(i%8)+' .r'+(i%64)+'{background:hsl('+(i*7%360)+',60%,'+(35+i%40)+'%)}';if(i%200==199||i==N-6){var y=document.createElement('style');y.textContent=css;document.head.appendChild(y);css=''}}var g=mk(8,'g');g.forEach(function(e,j){for(var i=0;i<8;i++){var b=document.createElement('i');b.className='r'+(j*8+i);e.appendChild(b)}});var fr=0;
function step(t){fr++;for(var j=0;j<8;j++)g[j].className='g k'+((j+fr)%8)}
(function(){var de=document.documentElement,h=document.getElementById('h'),lb=h.textContent,n=0,t0=0,lt=0,lp=0,mx=0,j=0,fs=0,fc=0,fps=0;
function pub(st,t){de.setAttribute('data-stress',JSON.stringify({v:1,id:ID,level:LV,value:N,status:st,t:Math.round(t),frames:n,fps:fps,maxGap:Math.round(mx),jank:j}));mx=0}
function loop(t){if(!t0)t0=lt=lp=fs=t;var g=t-lt;lt=t;if(g>mx)mx=g;if(g>50)j++;n++;fc++;if(t-fs>=1000){fps=Math.round(fc*1000/(t-fs));fc=0;fs=t}
if(typeof step=='function')step(t-t0);
if(t-lp>=500){lp=t;h.firstChild.data=lb+' \u00b7 '+fps+' fps';pub('running',t-t0)}requestAnimationFrame(loop)}
pub('setup',0);requestAnimationFrame(loop)})();
</script>
</body></html>
