<!doctype html>
<html><head><meta charset="utf-8"><title>stress: Canvas commands per frame · 2000 commands per frame</title>
<!-- stress {"id":"canvas-cmds/2000","load":"canvas-cmds","level":2,"param":"commands","value":2000,"unit":"commands per frame"} -->
<style>body{margin:0;font:12px system-ui,sans-serif}#h{padding:5px 8px;color:var(--tg-theme-hint-color);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}#f{position:relative;height:300px;overflow:hidden}canvas{display:block;width:300px;height:300px}</style>
</head><body><div id="h">Canvas commands per frame · 2000 commands per frame</div><div id="f"></div>
<script>
var ID="canvas-cmds/2000",LV=2,N=2000,F=document.getElementById('f'),W=F.clientWidth||300;
function mk(n,c){for(var a=[],i=0;i<n;i++){var d=document.createElement('div');d.className=c;F.appendChild(d);a.push(d)}return a}
var cv=document.createElement('canvas');cv.width=600;cv.height=600;F.appendChild(cv);var x=cv.getContext('2d');
function step(t){x.clearRect(0,0,600,600);for(var i=0;i<N/2;i++){x.fillStyle='hsl('+((i*7+t/10)%360|0)+',70%,50%)';x.fillRect((i*37+t/8)%580,(i*53)%580,16,16)}}
(function(){var de=document.documentElement,h=document.getElementById('h'),lb=h.textContent,n=0,t0=0,lt=0,lp=0,mx=0,j=0,fs=0,fc=0,fps=0;
function pub(st,t){de.setAttribute('data-stress',JSON.stringify({v:1,id:ID,level:LV,value:N,status:st,t:Math.round(t),frames:n,fps:fps,maxGap:Math.round(mx),jank:j}));mx=0}
function loop(t){if(!t0)t0=lt=lp=fs=t;var g=t-lt;lt=t;if(g>mx)mx=g;if(g>50)j++;n++;fc++;if(t-fs>=1000){fps=Math.round(fc*1000/(t-fs));fc=0;fs=t}
if(typeof step=='function')step(t-t0);
if(t-lp>=500){lp=t;h.firstChild.data=lb+' \u00b7 '+fps+' fps';pub('running',t-t0)}requestAnimationFrame(loop)}
pub('setup',0);requestAnimationFrame(loop)})();
</script>
</body></html>
