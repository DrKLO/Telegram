<!doctype html>
<html><head><meta charset="utf-8"><title>stress: Style and text churn · 4000 boxes</title>
<!-- stress {"id":"style-churn/4000","load":"style-churn","level":6,"param":"boxes","value":4000,"unit":"boxes"} -->
<style>body{margin:0;font:12px system-ui,sans-serif}#h{padding:5px 8px;color:var(--tg-theme-hint-color);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}#f{position:relative;height:300px;overflow:hidden}.b{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:6px;background:#4a90e2;width:18px;height:18px;border-radius:0;font:8px/18px system-ui,sans-serif;text-align:center;color:#fff}</style>
</head><body><div id="h">Style and text churn · 4000 boxes</div><div id="f"></div>
<script>
var ID="style-churn/4000",LV=6,N=4000,F=document.getElementById('f'),W=F.clientWidth||300;
function mk(n,c){for(var a=[],i=0;i<n;i++){var d=document.createElement('div');d.className=c;F.appendChild(d);a.push(d)}return a}
function move(a,t,bg){for(var i=0;i<a.length;i++){var s=a[i].style,k=t/900+i*.37;s.transform='translate('+((i*13.7+t/20)%(W-24)).toFixed(1)+'px,'+(138+Math.sin(k)*130).toFixed(1)+'px) rotate('+((k*57)%360).toFixed(0)+'deg)';if(bg)s.backgroundColor='hsl('+((i*7+t/10)%360).toFixed(0)+',70%,50%)'}}var a=mk(N,'b');a.forEach(function(d){d.textContent='0'});
function step(t){move(a,t,1);for(var i=0;i<a.length;i++)a[i].firstChild.data=String((t/100+i)%100|0)}
(function(){var de=document.documentElement,h=document.getElementById('h'),lb=h.textContent,n=0,t0=0,lt=0,lp=0,mx=0,j=0,fs=0,fc=0,fps=0;
function pub(st,t){de.setAttribute('data-stress',JSON.stringify({v:1,id:ID,level:LV,value:N,status:st,t:Math.round(t),frames:n,fps:fps,maxGap:Math.round(mx),jank:j}));mx=0}
function loop(t){if(!t0)t0=lt=lp=fs=t;var g=t-lt;lt=t;if(g>mx)mx=g;if(g>50)j++;n++;fc++;if(t-fs>=1000){fps=Math.round(fc*1000/(t-fs));fc=0;fs=t}
if(typeof step=='function')step(t-t0);
if(t-lp>=500){lp=t;h.firstChild.data=lb+' \u00b7 '+fps+' fps';pub('running',t-t0)}requestAnimationFrame(loop)}
pub('setup',0);requestAnimationFrame(loop)})();
</script>
</body></html>
