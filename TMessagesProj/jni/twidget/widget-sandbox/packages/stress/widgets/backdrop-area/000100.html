<!doctype html>
<html><head><meta charset="utf-8"><title>stress: Backdrop filter, area · 100 % of the field</title>
<!-- stress {"id":"backdrop-area/100","load":"backdrop-area","level":4,"param":"area","value":100,"unit":"% of the field"} -->
<style>body{margin:0;font:12px system-ui,sans-serif}#h{padding:5px 8px;color:var(--tg-theme-hint-color);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}#f{position:relative;height:300px;overflow:hidden}.s{position:absolute;left:0;top:0;width:100%;height:28px}.p{position:absolute;left:0;top:0;width:100%;backdrop-filter:blur(8px);background:rgba(255,255,255,.12)}</style>
</head><body><div id="h">Backdrop filter, area · 100 % of the field</div><div id="f"></div>
<script>
var ID="backdrop-area/100",LV=4,N=100,F=document.getElementById('f'),W=F.clientWidth||300;
function mk(n,c){for(var a=[],i=0;i<n;i++){var d=document.createElement('div');d.className=c;F.appendChild(d);a.push(d)}return a}
var st=mk(10,'s');st.forEach(function(d,i){d.style.background='hsl('+i*36+',70%,55%)'});function stripes(t){st.forEach(function(d,i){d.style.transform='translateY('+((i*33+t/15)%330-30).toFixed(1)+'px)'})}if(N)mk(1,'p')[0].style.height=N*3+'px';
function step(t){stripes(t)}
(function(){var de=document.documentElement,h=document.getElementById('h'),lb=h.textContent,n=0,t0=0,lt=0,lp=0,mx=0,j=0,fs=0,fc=0,fps=0;
function pub(st,t){de.setAttribute('data-stress',JSON.stringify({v:1,id:ID,level:LV,value:N,status:st,t:Math.round(t),frames:n,fps:fps,maxGap:Math.round(mx),jank:j}));mx=0}
function loop(t){if(!t0)t0=lt=lp=fs=t;var g=t-lt;lt=t;if(g>mx)mx=g;if(g>50)j++;n++;fc++;if(t-fs>=1000){fps=Math.round(fc*1000/(t-fs));fc=0;fs=t}
if(typeof step=='function')step(t-t0);
if(t-lp>=500){lp=t;h.firstChild.data=lb+' \u00b7 '+fps+' fps';pub('running',t-t0)}requestAnimationFrame(loop)}
pub('setup',0);requestAnimationFrame(loop)})();
</script>
</body></html>
