<!doctype html>
<html><head><meta charset="utf-8"><title>stress: The ARS cell, moving · 512 cells</title>
<!-- stress {"id":"ars-cell/512","load":"ars-cell","level":5,"param":"cells","value":512,"unit":"cells"} -->
<style>body{margin:0;font:12px system-ui,sans-serif}#h{padding:5px 8px;color:var(--tg-theme-hint-color);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}#f{position:relative;height:300px;overflow:hidden}.c{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:6px;background:#4a90e2;background:linear-gradient(135deg,rgba(255,80,80,.8),rgba(80,80,255,.6));box-shadow:0 1px 3px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.2);opacity:.85;font-size:8px;line-height:22px;text-align:center;color:#fff}</style>
</head><body><div id="h">The ARS cell, moving · 512 cells</div><div id="f"></div>
<script>
var ID="ars-cell/512",LV=5,N=512,F=document.getElementById('f'),W=F.clientWidth||300;
function mk(n,c){for(var a=[],i=0;i<n;i++){var d=document.createElement('div');d.className=c;F.appendChild(d);a.push(d)}return a}
function move(a,t,bg){for(var i=0;i<a.length;i++){var s=a[i].style,k=t/900+i*.37;s.transform='translate('+((i*13.7+t/20)%(W-24)).toFixed(1)+'px,'+(138+Math.sin(k)*130).toFixed(1)+'px) rotate('+((k*57)%360).toFixed(0)+'deg)';if(bg)s.backgroundColor='hsl('+((i*7+t/10)%360).toFixed(0)+',70%,50%)'}}var a=mk(N,'c');a.forEach(function(d,i){d.textContent=i%100});
function step(t){move(a,t,1)}
(function(){var de=document.documentElement,h=document.getElementById('h'),lb=h.textContent,n=0,t0=0,lt=0,lp=0,mx=0,j=0,fs=0,fc=0,fps=0;
function pub(st,t){de.setAttribute('data-stress',JSON.stringify({v:1,id:ID,level:LV,value:N,status:st,t:Math.round(t),frames:n,fps:fps,maxGap:Math.round(mx),jank:j}));mx=0}
function loop(t){if(!t0)t0=lt=lp=fs=t;var g=t-lt;lt=t;if(g>mx)mx=g;if(g>50)j++;n++;fc++;if(t-fs>=1000){fps=Math.round(fc*1000/(t-fs));fc=0;fs=t}
if(typeof step=='function')step(t-t0);
if(t-lp>=500){lp=t;h.firstChild.data=lb+' \u00b7 '+fps+' fps';pub('running',t-t0)}requestAnimationFrame(loop)}
pub('setup',0);requestAnimationFrame(loop)})();
</script>
</body></html>
