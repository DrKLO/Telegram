<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>twidget — feed bench (iframe vs shadow DOM renderer)</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; background: #e9eef3; }
    #feed { height: 100%; overflow: auto; padding: 8px 12px; box-sizing: border-box; }
    .bubble { width: 420px; max-width: 100%; margin: 0 0 10px; background: #fff; border-radius: 12px; overflow: hidden; box-sizing: border-box; }
    .bubble.cv { content-visibility: auto; contain-intrinsic-size: auto 240px; }
    .bubble .frame-wrap { width: 100%; }
    .widget-frame { display: block; width: 100%; height: 24px; border: 0; background: transparent; }
    #hud { position: fixed; right: 8px; top: 8px; background: rgba(255,255,255,.92); border: 1px solid #ccd; border-radius: 8px; padding: 6px 10px; font: 12px/1.5 ui-monospace, monospace; white-space: pre; max-width: 46vw; }
  </style>
</head>
<body>
  <div id="feed"></div>
  <div id="hud">feed bench</div>
  <script type="module" src="./feed.ts"></script>
</body>
</html>
