# twidget Blitz renderer (prototype): the renderer trust domain of
# docs/protocol.md on blitz-dom + blitz-paint + vello_cpu. No JavaScript, no
# network: it only consumes validated RenderOps. One crate, two glues: a JNI
# cdylib for Android (src/android.rs, built by android/renderer-blitz via
# cargo-ndk) and a C-ABI staticlib for iOS/macOS and the C++ core (src/ffi.rs +
# include/twidget_blitz.h, built by build-apple.sh from the demo's Xcode
# project and by desktop/CMakeLists.txt). The same C ABI, built for
# wasm32-unknown-unknown and post-processed by wasm-bindgen (only web-time
# needs it), is the web prototype's renderer (scripts/build-blitz-web.ts,
# src/host/blitz-renderer.ts); browsers expose no system fonts to wasm, so
# that build bundles assets/DejaVuSans.woff2. See docs/blitz-experiment.md.
[package]
name = "twidget-blitz"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "twidget_blitz"
crate-type = ["cdylib", "staticlib"]

[dependencies]
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "c351a46883b4069c051f51029b902719062b95cd", default-features = false, features = ["svg", "system-fonts", "custom-widget", "woff"] }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "c351a46883b4069c051f51029b902719062b95cd", default-features = false, features = ["svg", "custom-widget"] }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "c351a46883b4069c051f51029b902719062b95cd" }
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
# anyrender_vello_cpu leaves vello_cpu's `png` feature off; Apple Color Emoji is sbix PNG bitmaps and
# glifo skips them silently without it (feature unification turns it on for the shared dependency).
vello_cpu = { version = "0.3", features = ["png"] }
peniko = "0.6"
parley = "0.12"
kurbo = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-url = "0.3"
log = "0.4"
# The CoreGraphics and display-list backends (src/cg.rs, src/dl.rs) read face names and variation axes from the font bytes.
skrifa = "0.44"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
strip = true

# The web build: smaller over the wire, one codegen unit for LTO (slower to build).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2

