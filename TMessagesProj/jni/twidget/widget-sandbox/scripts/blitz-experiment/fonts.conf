<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>
  <!-- What Chromium resolves the widgets' font stacks to on macOS. -->
  <alias binding="strong"><family>-apple-system</family><prefer><family>SF Pro Text</family></prefer></alias>
  <alias binding="strong"><family>BlinkMacSystemFont</family><prefer><family>SF Pro Text</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>SF Pro Text</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>SF Pro Text</family></prefer></alias>
  <alias binding="strong"><family>ui-monospace</family><prefer><family>SF Mono</family><family>Menlo</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Menlo</family></prefer></alias>
</fontconfig>
