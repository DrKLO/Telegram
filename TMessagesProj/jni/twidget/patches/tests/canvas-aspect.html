.conf-probes{font:13px/16px sans-serif}

<body>
<div class="conf-head">37 · Canvas size</div>
<div class="conf-probes">
  <canvas id="full" width="400" height="500" style="display:block;width:100%"></canvas>
  <canvas id="fixed" width="400" height="500" style="display:block;width:80px"></canvas>
  <canvas id="tall" width="400" height="500" style="display:block;height:50px"></canvas>
  <canvas id="both" width="400" height="500" style="display:block;width:80px;height:60px"></canvas>
  <canvas id="natural" width="40" height="20" style="display:block"></canvas>
  <canvas id="resized" width="40" height="20" style="display:block;width:80px"></canvas>
</div>
<div id="conf-list"></div>
<script>
var rectOf = function (selector) { return T.rect(selector); }, round1 = function (v) { return Math.round(v * 10) / 10; };
['full', 'fixed', 'tall', 'both', 'natural', 'resized'].forEach(function (id) {
  var c = document.getElementById(id).getContext('2d');
  c.fillStyle = '#36c';
  c.fillRect(0, 0, 400, 500);
});
function checkSize(name, id, w, h) {
  var r = rectOf('#' + id);
  T.ok('html.el.canvas', name, Math.abs(r.w - w) < 1 && Math.abs(r.h - h) < 1, round1(r.w) + 'x' + round1(r.h) + ', want ' + round1(w) + 'x' + round1(h));
}
T.step(function () {
  var w = rectOf('.conf-probes').w;
  checkSize('width: 100%: the height keeps the 4:5 ratio', 'full', w, w * 1.25);
  checkSize('width: 80px: the height keeps the ratio', 'fixed', 80, 100);
  checkSize('height: 50px: the width keeps the ratio', 'tall', 40, 50);
  checkSize('both in CSS: both win over the attributes', 'both', 80, 60);
  checkSize('no CSS size: the attributes are the size', 'natural', 40, 20);
  document.getElementById('resized').height = 40;
  document.getElementById('resized').getContext('2d').fillRect(0, 0, 40, 40);
  return 100;
});
T.step(function () { checkSize('a new height attribute changes the ratio', 'resized', 80, 80); });
T.run();
</script>
</body>
